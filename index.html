<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#0a2540"/>
<title>Progressive Mothers School Management</title>
<style>
:root{--navy:#0a2540;--navy3:#1e3a5c;--gold:#d4a017;--bg:#eef2f7;--line:#e2e8f0;--line2:#eef1f6;--text:#0a2540;--text2:#334155;--muted:#64748b;--ok:#059669;--oksoft:#ecfdf5;--warn:#d97706;--warnsoft:#fffbeb;--bad:#dc2626;--badsoft:#fef2f2;--brandsoft:#e0e9f5;--radius:14px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:system-ui,sans-serif}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:14px}
input:focus,select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 4px rgba(10,37,64,.1)}
label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:6px;font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line2);font-size:13.5px}
th{color:#fff;font-weight:600;font-size:11.5px;text-transform:uppercase;background:var(--navy)}
tbody tr:hover{background:#f9fafb}
h1{font-size:20px;font-weight:700;margin:0 0 4px;color:var(--navy)}
h3{font-size:15px;font-weight:700;margin:0 0 12px;color:var(--navy)}
.muted{color:var(--muted);font-size:12.5px}
.topbar{position:fixed;top:0;left:0;right:0;height:48px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 12px;z-index:100;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar .title{flex:1;font-size:12.5px;font-weight:600;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:16px}
#app{min-height:100vh;padding-top:48px;padding-bottom:90px;background:var(--bg);display:none}
.container{max-width:1100px;margin:0 auto;padding:0 12px}
.header-wrap{padding:12px}
.header-card{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 24px -8px rgba(10,37,64,.4)}
.header-top{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px}
.admin-chip{background:rgba(255,255,255,.15);color:#fff;font-size:10.5px;font-weight:700;padding:4px 12px;border-radius:999px;text-transform:uppercase}
.exit-chip{background:#dc2626;color:#fff;font-size:10.5px;font-weight:700;padding:4px 12px;border-radius:999px;text-transform:uppercase;cursor:pointer}
.header-school{display:flex;align-items:flex-start;gap:10px;font-size:16px;font-weight:800;margin-bottom:8px;text-transform:uppercase}
.header-school .logo{width:44px;height:44px;border-radius:10px;background:var(--gold);display:grid;place-items:center;font-size:20px;flex-shrink:0;color:var(--navy);overflow:hidden}
.header-school .logo img{width:100%;height:100%;object-fit:cover}
.header-meta{font-size:12.5px;color:#cbd5e1;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.header-datetime{font-size:12.5px;color:#cbd5e1;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.header-periods{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.header-period{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;color:#fff}
.header-period select{background:transparent;color:#fff;border:none;padding:0 4px;font-size:12px;font-weight:700;width:auto;cursor:pointer}
.header-period select option{color:var(--navy)}
.header-search{position:relative}
.header-search input{background:#fff;border:none;border-radius:999px;padding:13px 20px 13px 46px;font-size:13.5px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.header-search .si{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#94a3b8;pointer-events:none}
.nav-pills{display:flex;gap:8px;padding:12px 0 4px;overflow-x:auto;scrollbar-width:none}
.nav-pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;background:#fff;color:var(--navy);font-size:12.5px;font-weight:600;border:1.5px solid var(--line);white-space:nowrap;cursor:pointer}
.pill.active{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:3px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.04);margin-bottom:14px}
.grid{display:grid;gap:12px}
.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
@media(max-width:640px){.grid-2,.grid-3{grid-template-columns:1fr}.grid-kpi{grid-template-columns:1fr 1fr}}
.kpi{background:#fff;border-radius:var(--radius);padding:18px 14px;box-shadow:0 2px 8px rgba(15,23,42,.05);border-top:3px solid var(--gold);text-align:center}
.kpi .v{font-size:22px;font-weight:800;color:var(--navy);line-height:1.15;word-break:break-word}
.kpi .l{color:var(--muted);font-size:11.5px;margin-top:6px;font-weight:500}
.kpi.kpi-ok{border-top-color:var(--ok)}.kpi.kpi-ok .v{color:#065f46}
.kpi.kpi-bad{border-top-color:var(--bad)}.kpi.kpi-bad .v{color:#7f1d1d}
.kpi.kpi-warn{border-top-color:var(--warn)}.kpi.kpi-warn .v{color:#78350f}
.kpi.kpi-navy{border-top-color:var(--navy)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--oksoft);color:#047857;border:1px solid #a7f3d0}
.badge.bad{background:var(--badsoft);color:#b91c1c;border:1px solid #fecaca}
.badge.info{background:var(--brandsoft);color:var(--navy);border:1px solid #c7d2fe}
.badge.warn{background:var(--warnsoft);color:#92400e;border:1px solid #fde68a}
.btn{background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--navy3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn.ghost:hover{background:#f8fafc;border-color:var(--navy)}
.btn.danger{background:var(--bad)}
.btn.ok{background:var(--ok)}
.btn.gold{background:var(--gold)}
.btn.wa{background:#25D366;color:#fff}
.btn.sm{padding:6px 12px;font-size:11.5px;border-radius:999px}
.btn.block{width:100%}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:6px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;z-index:1000;font-size:13px;font-weight:500;box-shadow:0 20px 40px -12px rgba(10,37,64,.5);max-width:90vw;text-align:center}
.toast.bad{background:#7f1d1d}.toast.ok{background:#065f46}
.auth-bg{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),#2c5282);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;overflow:auto}
.auth-card{background:#fff;border-radius:20px;padding:30px 26px;width:100%;max-width:440px;box-shadow:0 40px 80px -20px rgba(0,0,0,.5);margin:auto}
.auth-card .logo{width:66px;height:66px;border-radius:16px;background:linear-gradient(135deg,var(--navy),#2c5282);display:grid;place-items:center;color:var(--gold);font-weight:800;font-size:26px;margin:0 auto 14px;overflow:hidden}
.auth-card .logo img{width:100%;height:100%;object-fit:cover}
.auth-card h1{text-align:center;font-size:19px;margin:0 0 6px}
.auth-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}
.err{background:var(--badsoft);border:1px solid #fecaca;color:#b91c1c;padding:11px 14px;border-radius:10px;margin-top:14px;font-size:13px}
.loading{padding:60px;text-align:center;color:var(--muted)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(10,37,64,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
@media(min-width:640px){.modal-bg{align-items:center;padding:16px}}
.modal{background:#fff;border-radius:20px 20px 0 0;max-width:720px;width:100%;max-height:92vh;overflow:auto;padding:22px}
@media(min-width:640px){.modal{border-radius:20px}}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line2);flex-wrap:wrap}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:90;box-shadow:0 -4px 16px rgba(10,37,64,.08)}
.bottom-bar-inner{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:1100px;margin:0 auto}
.bottom-bar-inner::-webkit-scrollbar{display:none}
.bottom-bar .pill{background:var(--navy);color:#fff;border-color:var(--navy);padding:9px 14px;font-size:12px}
.bottom-bar .pill.active{background:var(--gold);border-color:var(--gold);color:#fff}
.mini-stat{display:inline-block;padding:6px 12px;background:#f1f5f9;border-radius:8px;font-size:12px;font-weight:600;color:var(--navy);margin:2px 4px 2px 0}
.alert-item{display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;background:#fff;border-left:4px solid var(--gold);margin-bottom:8px;font-size:13px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.alert-item.danger{border-left-color:var(--bad)}
.alert-item.ok{border-left-color:var(--ok)}
.alert-item.info{border-left-color:#2c5282}
.alert-item .ico{font-size:20px}
.alert-item .txt{flex:1}
.alert-item .txt b{display:block;color:var(--navy)}
.alert-item .txt span{color:var(--muted);font-size:12px;display:block}
.profile-hero{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;border-radius:16px;padding:20px;margin-bottom:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.profile-hero .avatar{width:72px;height:72px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:28px;font-weight:800;flex-shrink:0}
.profile-hero .info{flex:1;min-width:200px}
.profile-hero .info h1{color:#fff;font-size:20px;margin:0 0 4px}
.profile-hero .info .meta{color:#cbd5e1;font-size:12.5px;line-height:1.7}
.marks-input{width:70px;padding:6px;text-align:center;border:2px solid var(--line);border-radius:8px;font-weight:700}
.marks-input:focus{border-color:var(--navy);background:#f8fafc}

/* ============================================================
   EXACT PHYSICAL REPORT CARD MATCH (A4 PORTRAIT)
   ============================================================ */
.rc-stage{
  background:#e2e8f0;
  padding:20px;
  border-radius:12px;
  display:flex;
  justify-content:center;
  margin-bottom:20px;
  overflow-x:auto;
}
.rc-page{
  width:210mm;
  min-height:297mm;
  background:#fff;
  padding:10mm 12mm;
  font-family:'Times New Roman', Times, serif;
  color:#000;
  box-shadow:0 4px 20px rgba(10,37,64,.15);
  position:relative;
  display:flex;
  flex-direction:column;
  page-break-after:always;
  font-size:11pt;
  line-height:1.3;
  border: 3px solid #800080;
}
.rc-inner{
  border: 2px solid #800080;
  padding: 10px;
  flex:1;
  display:flex;
  flex-direction:column;
}

/* Header */
.rc-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:2px solid #800080;
  padding-bottom:10px;
  margin-bottom:10px;
  text-align:center;
}
.rc-head .side-logo{
  width:75px;height:75px;flex-shrink:0;
  border-radius:50%;border:1px solid #800080;
  display:grid;place-items:center;font-size:9pt;color:#800080;text-align:center;overflow:hidden;
}
.rc-head .side-logo img{width:100%;height:100%;object-fit:cover}
.rc-head .title-block{flex:1;padding:0 10px}
.rc-head .title-block h1{font-size:22pt;margin:0 0 2px;text-transform:uppercase;color:#800080;font-weight:bold;font-family:Arial,sans-serif}
.rc-head .title-block .addr{font-size:10pt;margin:0;font-weight:bold}
.rc-head .title-block .contact{font-size:10pt;margin:2px 0 0;font-weight:bold;color:#000080}
.rc-head .title-block .doctype{font-size:13pt;font-weight:bold;letter-spacing:2px;color:#000080;margin-top:6px;text-transform:uppercase;text-decoration:underline}
.rc-head .photo{
  width:70px;height:85px;flex-shrink:0;
  border:1.5px solid #800080;
}

/* Pupil info */
.rc-pupil{
  display:flex;
  flex-wrap:wrap;
  gap:8px 16px;
  margin-bottom:10px;
  font-size:11pt;
  font-weight:bold;
}
.rc-pupil .cell{display:flex;align-items:flex-end;gap:4px}
.rc-pupil .lbl{white-space:nowrap}
.rc-pupil .val{border-bottom:1px dotted #000;min-width:80px;padding:0 4px;text-align:center;color:#000080}
.rc-pupil .cell.w-50{width:calc(50% - 8px)}
.rc-pupil .cell.w-full{width:100%}

/* Tables */
.rc-section-title{
  text-align:center;
  font-weight:bold;
  font-size:10pt;
  color:#800080;
  background:#f8f8f8;
  border:1px solid #800080;
  border-bottom:none;
  padding:3px;
  text-transform:uppercase;
}
.rc-table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:10px;
  font-size:10pt;
}
.rc-table th, .rc-table td{
  border:1px solid #800080;
  padding:3px 6px;
  text-align:center;
  color:#000;
}
.rc-table th{
  font-weight:bold;
  text-transform:uppercase;
  background:#fff;
}
.rc-table td.subname{text-align:left;font-weight:bold}
.rc-table td.sc{color:#000080;font-weight:bold}
.rc-table td.grade{color:#800080;font-weight:bold}
.rc-table td.agg{color:#800080;font-weight:bold}

/* Grading Scale Table */
.rc-scale{
  width:100%;
  border-collapse:collapse;
  margin-bottom:12px;
  font-size:9pt;
}
.rc-scale th, .rc-scale td{
  border:1px solid #800080;
  text-align:center;
  padding:3px;
}
.rc-scale th{font-weight:normal;font-size:8pt}

/* Remarks */
.rc-lines{
  font-size:10pt;
  margin-bottom:8px;
  line-height:1.8;
}
.rc-lines .lbl{font-weight:bold;display:block;margin-bottom:2px}
.rc-lines .line{border-bottom:1px dotted #000;display:block;min-height:20px}
.rc-lines .line.handwriting{font-family:'Comic Sans MS', cursive;color:#000080;font-size:12pt;padding-left:5px}

/* Signatures */
.rc-signs-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-top:10px;
  font-size:10pt;
  font-weight:bold;
}
.rc-signs-row .s{
  display:flex;
  align-items:flex-end;
  gap:8px;
}
.rc-signs-row .s .line{border-bottom:1px dotted #000;flex:1;min-height:18px}

/* Footer Stamp Removed */
.rc-footer{
  margin-top:auto;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  padding-top:10px;
}
.rc-illustration{font-size:10pt;font-weight:bold;color:#800080;display:flex;gap:10px}

@media(max-width:800px){.rc-stage{padding:8px;justify-content:flex-start}}
@media print{
  @page{size:A4 portrait;margin:0}
  body{background:#fff}
  .topbar,.header-wrap,.nav-pills,.bottom-bar,#modalRoot,.page-head,.card,.alert-item,.btn{display:none !important}
  #app{padding:0 !important}
  .container{max-width:none;padding:0}
  .rc-stage{background:#fff;padding:0;margin:0;border:none;display:block}
  .rc-page{width:210mm;height:297mm;box-shadow:none;padding:10mm 12mm;margin:0;page-break-after:always;}
}
</style>
</head>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const SUPA_URL='https://wabeempxckdtjvrkzhpv.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhYmVlbXB4Y2tkdGp2cmt6aHB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NTQyODcsImV4cCI6MjEwMDEzMDI4N30.5IDNbrip0nLDF9pN2fXHWVB7w-lYNxPIbTaTO-s1PaM';

/* ============================================================
   STATE & STORAGE
   ============================================================ */
let _session=null,_profile=null,_school=null,_schoolId=null,_role=null;
let _classesCache=null,_examsCache=null;
let _cachedStudents=[],_cachedPayments=[],_cachedPOStudents=[];
let _profileStudentId=null;
let _marksClass=null,_marksExam=null,_subjClass=null;
let activeRoute='dashboard';
let refreshTimer=null;

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function getYear(){return parseInt(lsGet('pm_year'))||new Date().getFullYear()}
function getTerm(){return parseInt(lsGet('pm_term'))||1}
function setPeriod(y,t){lsSet('pm_year',String(y));lsSet('pm_term',String(t))}
function getToken(){return _session?_session.access_token:null}
function getUser(){return _session?_session.user:null}

function setSession(d){
  _session=d;
  if(d){
    lsSet('pm_session',JSON.stringify(d));
    scheduleTokenRefresh(d.expires_in||3600);
  } else {
    lsDel('pm_session');
    if(refreshTimer) clearTimeout(refreshTimer);
  }
}

function scheduleTokenRefresh(expiresInSeconds){
  if(refreshTimer) clearTimeout(refreshTimer);
  const refreshInMs = (expiresInSeconds - 120) * 1000; 
  if(refreshInMs > 0){
    refreshTimer = setTimeout(async () => {
      try{
        const res = await fetch(SUPA_URL+'/auth/v1/token?grant_type=refresh_token', {
          method:'POST',
          headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
          body:JSON.stringify({refresh_token:_session.refresh_token})
        });
        if(res.ok){
          const data = await res.json();
          setSession({access_token:data.access_token, refresh_token:data.refresh_token, user:data.user, expires_in:data.expires_in});
        }
      }catch(e){ console.warn('Auto token refresh failed', e); }
    }, refreshInMs);
  }
}

/* ============================================================
   HELPERS
   ============================================================ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtUGX(n){if(n==null||isNaN(n))return'UGX 0';return'UGX '+(Number(n)||0).toLocaleString()}
function fmtNum(n){if(n==null||isNaN(n))return'0';return(Number(n)||0).toLocaleString()}
function fmtDate(ts){if(!ts)return'—';const d=new Date(ts);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}
function fmtLongDate(d){return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}
function fmtDateTime(ts){if(!ts)return'—';const d=new Date(ts);return fmtDate(ts)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function telLink(num){if(!num)return'';return String(num).replace(/[^0-9+]/g,'')}
function waLink(num){if(!num)return'';let c=String(num).replace(/[^0-9]/g,'');if(c.startsWith('0'))c='256'+c.slice(1);return c}
function genderLabel(g){if(!g)return'—';const x=String(g).trim().toLowerCase();if(x==='m'||x==='male')return'Male';if(x==='f'||x==='female')return'Female';return'—'}
function isBoard(s){if(!s)return false;const v=String(s).trim().toLowerCase();return v==='boarding'||v==='boarder'||v==='b'}

function gradePrimary(score){
  if(score==null||isNaN(score))return{g:'—',r:'—',agg:'—'};
  const s=Number(score);
  if(s>=90)return{g:'D1',r:'Distinction 1',agg:'1'};
  if(s>=80)return{g:'D2',r:'Distinction 2',agg:'2'};
  if(s>=70)return{g:'C3',r:'Credit 3',agg:'3'};
  if(s>=60)return{g:'C4',r:'Credit 4',agg:'4'};
  if(s>=55)return{g:'C5',r:'Credit 5',agg:'5'};
  if(s>=50)return{g:'C6',r:'Credit 6',agg:'6'};
  if(s>=45)return{g:'P7',r:'Pass 7',agg:'7'};
  if(s>=40)return{g:'P8',r:'Pass 8',agg:'8'};
  return{g:'F9',r:'Fail 9',agg:'9'};
}

function gradeBaby(score){
  if(score==null||isNaN(score))return{g:'—',r:'—'};
  const s=Number(score);
  if(s>=90)return{g:'A',r:'Excellent'};
  if(s>=80)return{g:'B',r:'V. Good'};
  if(s>=70)return{g:'C',r:'Good'};
  if(s>=50)return{g:'D',r:'Fair'};
  return{g:'E',r:'Needs Help'};
}

function toast(msg,type){const el=document.createElement('div');el.className='toast'+(type==='bad'?' bad':(type==='ok'?' ok':''));el.textContent=msg;document.getElementById('toastRoot').appendChild(el);setTimeout(()=>el.remove(),3500)}

/* ============================================================
   API
   ============================================================ */
async function api(path,opt){
  opt=opt||{};
  const h=Object.assign({'apikey':SUPA_KEY,'Content-Type':'application/json'},opt.headers||{});
  const t=getToken();h['Authorization']='Bearer '+(t||SUPA_KEY);
  const res=await fetch(SUPA_URL+path,Object.assign({},opt,{headers:h}));
  const txt=await res.text();
  let data=null;try{data=txt?JSON.parse(txt):null}catch(e){data=txt}
  if(!res.ok)throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||txt||('HTTP '+res.status));
  return data;
}

async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass=document.getElementById('loginPass').value;
  const err=document.getElementById('loginErr');
  const btn=document.getElementById('loginBtn');
  err.style.display='none';
  if(!email||!pass){err.textContent='Enter email and password';err.style.display='block';return}
  btn.disabled=true;btn.textContent='Signing in…';
  try{
    const res=await fetch(SUPA_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    const txt=await res.text();const data=txt?JSON.parse(txt):null;
    if(!res.ok)throw new Error((data&&(data.error_description||data.msg||data.error))||'Login failed');
    setSession({access_token:data.access_token,refresh_token:data.refresh_token,user:data.user,expires_in:data.expires_in});
    await boot();
  }catch(e){err.textContent=e.message;err.style.display='block'}
  btn.disabled=false;btn.textContent='Sign In';
}
window.doLogin=doLogin;

  try{const t=getToken();if(t)await fetch(SUPA_URL+'/auth/v1/logout',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+t}})}catch(e){}

async function boot(){
  const user=getUser();
  if(!user){document.getElementById('authScreen').style.display='flex';return}
  const errEl=document.getElementById('loginErr');
  try{const p=await api('/rest/v1/profiles?id=eq.'+user.id+'&select=*');_profile=p&&p[0]}
  catch(e){errEl.textContent='Profile error: '+e.message;errEl.style.display='block';return}
  if(!_profile){errEl.textContent='Profile not found.';errEl.style.display='block';return}
  _schoolId=_profile.school_id;_role=_profile.role;

  const activeIds=window._activePassIds||new Set();
  const list=_cachedStudents.filter(s=>{
    if(cf&&s.class_id!==cf)return false;
    if(rf){const wb=(rf==='Boarding');if(wb!==isBoard(s.boarding_status))return false}
    if(q){const h=(s.first_name+' '+(s.last_name||'')+' '+s.admission_no+' '+(s.parent_name||'')+' '+(s.parent_contact||'')+' '+(s.lin||'')).toLowerCase();if(h.indexOf(q)===-1)return false}

  });

  const c=document.getElementById('stTable');
  if(!list.length){c.innerHTML='<div class="empty">No pupils.</div>';return}
  let rows='';
  list.forEach(s=>{
    const cls=cById[s.class_id];const bal=(Number(s.total_charged)||0)-(Number(s.total_paid)||0);
    const pc=(s.parent_contact||'').trim();const wa=pc?waLink(pc):'',tl=pc?telLink(pc):'';

    rows+='<tr><td><b>'+esc(s.admission_no||'—')+'</b></td><td><a href="javascript:void(0)" onclick="openProfile(\''+s.id+'\')" style="color:var(--navy);font-weight:600;text-decoration:none">'+esc(s.first_name+' '+(s.last_name||''))+'</a></td><td>'+(cls?'<span class="badge info">'+esc(cls.name)+'</span>':'—')+'</td><td>'+esc(genderLabel(s.gender))+'</td><td>'+esc(s.lin||'—')+'</td><td>'+contact+'</td><td>'+(isBoard(s.boarding_status)?'<span class="badge warn">Board</span>':'<span class="badge ok">Day</span>')+'</td><td>'+(activeIds.has(s.id)?'<span class="badge bad">OUT</span>':'')+'</td><td style="text-align:right"><span class="badge '+(bal>0?'bad':'ok')+'">'+fmtNum(bal)+'</span></td><td style="text-align:right;white-space:nowrap"><button class="btn sm" onclick="openProfile(\''+s.id+'\')">👤</button> <button class="btn sm gold" onclick="recordPayment(\''+s.id+'\')">💵</button> <button class="btn sm ghost" onclick="openStudentModalById(\''+s.id+'\')">✏️</button> <button class="btn sm danger" onclick="deleteStudent(\''+s.id+'\')">✕</button></td></tr>';
  });
  c.innerHTML='<div class="table-wrap"><table style="font-size:12.5px"><thead><tr><th>ADM</th><th>Name</th><th>Class</th><th>Gender</th><th>LIN</th><th>Parent</th><th>Type</th><th>OUT</th><th style="text-align:right">Balance</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

async function saveStudent(id){

  try{
    await api('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});

    const charged=Number(s.total_charged)||0;

function fallbackCopy(str, count){
  const ta = document.createElement('textarea');
  ta.value = str;
  ta.style.position = 'fixed';
  ta.style.left = '-999999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {

}

function downloadJukilaCSV(){
  const list = window._contactsFiltered || window._contactsAll || [];
  const withPhone = list.filter(r => r.phone && String(r.phone).trim() !== '');
  
  if(!withPhone.length){
    toast('No contacts with phone numbers to export.', 'bad');
    return;
  }

  const head = ['name','phone','language','nokPhone'];
  const rows = [head.join(',')];
  const seenPhones = new Set();

  withPhone.forEach(r => {
    const s = r.s;
    let contactName = '';
    if (s.parent_name && String(s.parent_name).trim()) {
      contactName = String(s.parent_name).trim();
    } else {
      contactName = 'Parent of ' + (s.first_name || '') + ' ' + (s.last_name || '');
    }
    contactName = contactName.replace(/[\r\n,;"]/g, ' ').replace(/\s+/g, ' ').trim();
    if(!contactName) contactName = 'Parent';

    let phone = String(r.phone).replace(/[^0-9]/g, '');
    if (!phone) return;
    if (seenPhones.has(phone)) return;
    seenPhones.add(phone);

    const language = 'English';
    const nokPhone = '';

    const safe = (v) => {
      const str = String(v == null ? '' : v);
      if (str.includes(',') || str.includes('"') || str.includes('\n')) {
        return '"' + str.replace(/"/g, '""') + '"';
      }
      return str;
    };

    rows.push([safe(contactName), safe(phone), safe(language), safe(nokPhone)].join(','));
  });

  const blob = new Blob(['\ufeff' + rows.join('\r\n')], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'jukila_contacts_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  toast('✅ Jukila CSV downloaded (' + seenPhones.size + ' contacts, English)', 'ok');
}
window.downloadJukilaCSV = downloadJukilaCSV;

function promiseStatusOf(p){
  if(p.status==='cleared')return 'cleared';
  if(!p.promise_date)return 'future';
  const today=new Date();today.setHours(0,0,0,0);
  const d=new Date(p.promise_date);d.setHours(0,0,0,0);
  if(d.getTime()===today.getTime())return 'today';
  if(d<today)return 'overdue';
  const diff=(d-today)/(1000*60*60*24);return diff<=7?'upcoming':'future';
}

  window._promiseStudents=students;window._allPromises=promises;
  const sById={};students.forEach(s=>sById[s.id]=s);
  let overdue=0,dueToday=0,upcoming=0,cleared=0,total=0;
  promises.forEach(p=>{const st=promiseStatusOf(p);if(st==='overdue')overdue++;else if(st==='today')dueToday++;else if(st==='upcoming')upcoming++;else if(st==='cleared')cleared++;total+=Number(p.promised_amount||0)});

async function pageMarks(root){
  clearClassesCache();
  const classes=await loadClasses();
  if(!_marksClass&&classes[0])_marksClass=classes[0].id;
  const exams=await loadExams();
  if(!_marksExam&&exams[0])_marksExam=exams[0].id;
  if(!_marksClass||!_marksExam){root.innerHTML='<div class="card empty">Select Class/Exam or create them first.</div>';return}

  const subjects=await loadSubjectsForClass(_marksClass);
  const results=await Promise.all([
    api('/rest/v1/students?school_id=eq.'+_schoolId+'&class_id=eq.'+_marksClass+'&status=eq.active&select=id,admission_no,first_name,last_name&order=first_name'),
    api('/rest/v1/marks?school_id=eq.'+_schoolId+'&exam_id=eq.'+_marksExam+'&select=student_id,subject_id,score')
  ]);
  const students=results[0]||[],marksRows=results[1]||[];
  const mm={};marksRows.forEach(m=>{if(!mm[m.student_id])mm[m.student_id]={};mm[m.student_id][m.subject_id]=m.score});
  window._marksMap=mm;window._marksSubjects=subjects;
  
  const cOpts=classes.map(c=>'<option value="'+c.id+'"'+(_marksClass===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('');
  const eOpts=exams.map(e=>'<option value="'+e.id+'"'+(_marksExam===e.id?' selected':'')+'>'+esc(e.name)+'</option>').join('');
  let table='';
  if(!students.length)table='<div class="card empty">No pupils.</div>';
  else if(!subjects.length)table='<div class="card empty">No subjects for this class.</div>';
  else{
    let hdr='';subjects.forEach(s=>{hdr+='<th style="text-align:center">'+esc(s.code)+'</th>'});
    let rows='';
    students.forEach((s,i)=>{
      const per=mm[s.id]||{};let total=0;let inputs='';
      subjects.forEach(sj=>{const v=per[sj.subject_id];if(v!=null&&!isNaN(v))total+=Number(v);inputs+='<td><input type="number" min="0" max="100" value="'+(v!=null?v:'')+'" data-student="'+s.id+'" data-subject="'+sj.subject_id+'" onchange="setMark(this)" class="marks-input"></td>'});
      rows+='<tr><td>'+(i+1)+'</td><td>'+esc(s.admission_no)+'</td><td>'+esc(s.first_name+' '+(s.last_name||''))+'</td>'+inputs+'<td style="text-align:right;font-weight:700" class="row-total" data-student="'+s.id+'">'+total.toFixed(0)+'</td></tr>';
    });
    table='<div class="card"><div class="table-wrap"><table><thead><tr><th>#</th><th>ADM</th><th>Name</th>'+hdr+'<th style="text-align:right">Total</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  }
  root.innerHTML='<div class="page-head"><h1>✍️ Edit Marks (Admin)</h1></div><div class="card"><div class="grid grid-2"><div><label>Class</label><select onchange="_marksClass=this.value;pageMarks(document.getElementById(\'main\'))">'+cOpts+'</select></div><div><label>Exam</label><select onchange="_marksExam=this.value;pageMarks(document.getElementById(\'main\'))">'+eOpts+'</select></div></div></div>'+table;
}
window.pageMarks=pageMarks;

async function setMark(inp){
  const sid=inp.dataset.student,subid=inp.dataset.subject;
  let sc=inp.value===''?null:parseFloat(inp.value);
  if(sc!=null){
    if(isNaN(sc)||sc<0){sc=0;inp.value=0;}
    if(sc>100){sc=100;inp.value=100;}
  }
  try{
    await api('/rest/v1/marks?school_id=eq.'+_schoolId+'&student_id=eq.'+sid+'&exam_id=eq.'+_marksExam+'&subject_id=eq.'+subid,{method:'DELETE'});
    if(sc!=null)await api('/rest/v1/marks',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({school_id:_schoolId,student_id:sid,exam_id:_marksExam,subject_id:subid,score:sc,academic_year:getYear(),term:getTerm()})});
    const per=window._marksMap[sid]||{};per[subid]=sc;window._marksMap[sid]=per;
    let total=0;window._marksSubjects.forEach(sj=>{const v=per[sj.subject_id];if(v!=null&&!isNaN(v))total+=Number(v)});
    const el=document.querySelector('.row-total[data-student="'+sid+'"]');if(el)el.textContent=total.toFixed(0);
  }catch(e){toast(e.message,'bad')}
}
window.setMark=setMark;

async function pageReports(root){
  clearClassesCache();
  const classes = await loadClasses();
  if(!_marksClass && classes[0]) _marksClass = classes[0].id;
  const classObj = classes.find(c=>c.id===_marksClass);
  let subjects = await loadSubjectsForClass(_marksClass);
  const exams = await loadExams();
  const examId = _marksExam || (exams[0] && exams[0].id);
  if(!examId){ root.innerHTML='<div class="card empty">No exams yet.</div>'; return; }
  _marksExam = examId;

  const students = await api('/rest/v1/students?school_id=eq.'+_schoolId+'&class_id=eq.'+_marksClass+'&status=eq.active&select=*&order=first_name') || [];
  
  let marksRows = [];
  if(students.length){
    const ids = students.map(s=>s.id).join(',');
    marksRows = await api('/rest/v1/marks?school_id=eq.'+_schoolId+'&student_id=in.('+ids+')&exam_id=eq.'+examId+'&select=student_id,subject_id,score') || [];
  }

  const marks = {};
  marksRows.forEach(m=>{ if(!marks[m.student_id]) marks[m.student_id]={}; marks[m.student_id][m.subject_id]=Number(m.score); });

  const positions = {};
  const totals = students.map(s=>{
    const per = marks[s.id]||{}; let total=0;
    subjects.forEach(sj=>{ const v=per[sj.subject_id]; if(v!=null&&!isNaN(v)) total+=Number(v); });
    return { id:s.id, total };
  });
  totals.slice().sort((a,b)=>b.total-a.total).forEach((t,i)=>{ positions[t.id]=i+1; });

  const clsName  = classObj ? classObj.name.toLowerCase() : '';
  const examName = (exams.find(e=>e.id===examId)||{name:''}).name.toLowerCase();
  const isBaby = clsName.includes('baby')||clsName.includes('middle')||clsName.includes('top')||clsName.includes('nur');
  const isUpperPrimary = /p\.?\s*[4-7]/.test(clsName) || clsName.includes('p4')||clsName.includes('p5')||clsName.includes('p6')||clsName.includes('p7');
  const isMidTerm = examName.includes('mid')||examName.includes('bot')||examName.includes('beginning')||examName.includes('half');

  if(isUpperPrimary){const req=['ENG','MAT','SCI','SST'];const f=subjects.filter(sj=>req.some(k=>sj.code.toUpperCase().includes(k)||sj.name.toUpperCase().includes(k)));if(f.length) subjects=f;} 
  else if(!isBaby){const req=['ENG','MAT','LIT','RE','R.E'];const f=subjects.filter(sj=>req.some(k=>sj.code.toUpperCase().includes(k)||sj.name.toUpperCase().includes(k)));if(f.length) subjects=f;}

  window._reportData = { students, subjects, marks, positions, examId, isBaby, isUpperPrimary, isMidTerm, classes };

  const cOpts = classes.map(c=>'<option value="'+c.id+'"'+(c.id===_marksClass?' selected':'')+'>'+esc(c.name)+'</option>').join('');
  const eOpts = exams.map(e=>'<option value="'+e.id+'"'+(e.id===examId?' selected':'')+'>'+esc(e.name)+'</option>').join('');

  if(window._printTables===undefined) window._printTables = { bot:true, mid:true, end:true };
  let cards='';
  if(students.length && subjects.length){
    cards = '<div id="rcCardsWrap">'+students.map(s=>'<div class="rc-stage">'+(isBaby?buildBabyReportCard(s,subjects,marks,marks,marks,isMidTerm,classes):buildPrimaryReportCard(s,subjects,marks,positions,students.length,isUpperPrimary,isMidTerm,classes,marks,marks))+'</div>').join('')+'</div>';
  }

  root.innerHTML =
    '<div class="page-head"><div><h1>📄 Report Cards</h1>'+
    '<div class="sub">'+(isMidTerm?'Mid-Term':'End of Term')+' · '+(isBaby?'Baby Format':(isUpperPrimary?'Upper Primary':'Lower Primary'))+'</div></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ok" onclick="openCommentsModal()">✏️ Save Comments</button><button class="btn gold" onclick="printAllReports()">🖨️ Print All</button></div></div>'+
    '<div class="card"><div class="grid grid-2">'+
      '<div><label>Class</label><select onchange="_marksClass=this.value;pageReports(document.getElementById(\'main\'))">'+cOpts+'</select></div>'+
      '<div><label>Exam</label><select onchange="_marksExam=this.value;pageReports(document.getElementById(\'main\'))">'+eOpts+'</select></div>'+
    '</div>'+
    '<div style="margin-top:14px;padding-top:12px;border-top:1px solid #eef1f6"><label style="margin-bottom:8px">Tables to print on report card</label>'+
    '<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">'+
    '<label style="margin:0;font-weight:600"><input type="checkbox" id="pt_bot" '+(window._printTables.bot?'checked':'')+' onchange="togglePrintTable(\'bot\',this.checked)" style="width:auto"> Beginning</label>'+
    '<label style="margin:0;font-weight:600"><input type="checkbox" id="pt_mid" '+(window._printTables.mid?'checked':'')+' onchange="togglePrintTable(\'mid\',this.checked)" style="width:auto"> Mid Term</label>'+
    '<label style="margin:0;font-weight:600"><input type="checkbox" id="pt_end" '+(window._printTables.end?'checked':'')+' onchange="togglePrintTable(\'end\',this.checked)" style="width:auto"> End of Term</label>'+
    '<span class="muted">·</span>'+
    '<button class="btn sm ghost" onclick="selectPrintTables({bot:true,mid:true,end:true})">All</button>'+
    '<button class="btn sm ghost" onclick="selectPrintTables({bot:false,mid:true,end:true})">Mid + End</button>'+
    '<button class="btn sm ghost" onclick="selectPrintTables({bot:false,mid:false,end:true})">End only</button>'+
    '<button class="btn sm ghost" onclick="selectPrintTables({bot:false,mid:true,end:false})">Mid only</button>'+
    '</div></div></div>'+
    (students.length===0?'<div class="card empty">No pupils.</div>':(subjects.length===0?'<div class="card empty">No subjects.</div>':cards));
}

  const cls=classes.find(c=>c.id===s.class_id);const charged=Number(s.total_charged)||0,paid=Number(s.total_paid)||0,bal=charged-paid;
  const initials=(s.first_name||'?').charAt(0).toUpperCase();const gl=genderLabel(s.gender);
  const hero='<div class="profile-hero"><div class="avatar">'+esc(initials)+'</div><div class="info"><h1>'+esc(s.first_name+' '+(s.last_name||''))+'</h1><div class="meta">📋 '+esc(s.admission_no)+' · '+(cls?'🏫 '+esc(cls.name):'No class')+' · '+(gl!=='—'?'👤 '+gl+' · ':'')+esc(isBoard(s.boarding_status)?'Boarding':'Day')+'</div>'+(s.parent_name||s.parent_contact?'<div class="meta">👤 '+esc(s.parent_name||'')+(s.parent_contact?' · 📞 '+esc(s.parent_contact):'')+'</div>':'')+'</div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn gold" onclick="recordPayment(\''+s.id+'\')">💵 Pay</button><button class="btn ghost" style="background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)" onclick="openStudentModalById(\''+s.id+'\')">✏️ Edit</button></div></div>';
  const kpis='<div class="grid grid-kpi" style="margin-bottom:14px"><div class="kpi"><div class="v">'+fmtUGX(charged)+'</div><div class="l">Charged</div></div><div class="kpi kpi-ok"><div class="v">'+fmtUGX(paid)+'</div><div class="l">Paid</div></div><div class="kpi '+(bal>0?'kpi-bad':'kpi-ok')+'"><div class="v">'+fmtUGX(bal)+'</div><div class="l">Balance</div></div><div class="kpi kpi-warn"><div class="v">'+passouts.length+'</div><div class="l">Pass Outs</div></div></div>';
  let content='<div class="grid grid-2"><div class="card"><h3>Personal</h3><table><tbody><tr><td>ADM</td><td><b>'+esc(s.admission_no)+'</b></td></tr><tr><td>Class</td><td>'+esc(cls?cls.name:'—')+'</td></tr><tr><td>Gender</td><td><b>'+esc(gl)+'</b></td></tr><tr><td>Boarding</td><td>'+esc(isBoard(s.boarding_status)?'Boarding':'Day')+'</td></tr><tr><td>DOB</td><td>'+fmtDate(s.date_of_birth)+'</td></tr><tr><td>LIN</td><td>'+esc(s.lin||'—')+'</td></tr><tr><td>Pay Code</td><td><b>'+esc(s.school_pay_code||'—')+'</b></td></tr></tbody></table></div><div class="card"><h3>Parent / Guardian</h3><table><tbody><tr><td>Name</td><td><b>'+esc(s.parent_name||'—')+'</b></td></tr><tr><td>Phone</td><td><b>'+esc(s.parent_contact||'—')+'</b></td></tr></tbody></table>'+(s.parent_contact?'<div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap"><a href="https://wa.me/'+waLink(s.parent_contact)+'" target="_blank" class="btn wa">💬 WhatsApp</a><a href="tel:'+telLink(s.parent_contact)+'" class="btn ghost">📞 Call</a></div>':'')+'</div></div>';
  if(payments.length){let rows='';payments.forEach(p=>{rows+='<tr><td>'+fmtDateTime(p.paid_at)+'</td><td><b style="font-family:monospace">'+esc(p.receipt_no||'')+'</b></td><td>'+esc(p.payment_for||'')+'</td><td style="text-align:right;color:#047857">'+fmtNum(p.amount)+'</td></tr>'});content+='<div class="card"><h3>💳 Payment History</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th>Receipt</th><th>For</th><th style="text-align:right">Amount</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';}
  if(passouts.length){let rows='';passouts.forEach(p=>{const statusBadge=p.status==='out'?'<span class="badge bad">OUT</span>':'<span class="badge ok">Returned</span>';rows+='<tr><td>'+fmtDateTime(p.signed_out_at)+'</td><td>'+fmtDateTime(p.signed_in_at)+'</td><td>'+esc(p.reason||'')+'</td><td>'+esc(p.picked_up_by||'')+'</td><td>'+statusBadge+'</td></tr>'});content+='<div class="card"><h3>🚪 Pass Outs</h3><div class="table-wrap"><table><thead><tr><th>Out</th><th>Return</th><th>Reason</th><th>Picked By</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';}
  root.innerHTML=hero+kpis+content;
}
window.pageProfile=pageProfile;

/* INIT */
try{const s=lsGet('pm_session');if(s)_session=JSON.parse(s)}catch(e){_session=null}
if(_session&&_session.user)boot();
</script>
