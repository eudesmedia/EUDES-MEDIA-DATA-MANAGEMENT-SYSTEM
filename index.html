.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}

.profile-hero{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;border-radius:16px;padding:20px;margin-bottom:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}

.profile-hero .info .meta{color:#cbd5e1;font-size:12.5px;line-height:1.7}
.tabs-bar{display:flex;gap:6px;overflow-x:auto;padding:4px 0;border-bottom:2px solid var(--line);margin-bottom:14px;scrollbar-width:none}
.tabs-bar::-webkit-scrollbar{display:none}
.tabs-bar button{flex:0 0 auto;padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}

.marks-input{width:70px;padding:6px;text-align:center;border:2px solid var(--line);border-radius:8px;font-weight:700}
.marks-input:focus{border-color:var(--navy);background:#f8fafc}
</style>

<script>
const SUPA_URL='https://wabeempxckdtjvrkzhpv.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhYmVlbXB4Y2tkdGp2cmt6aHB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NTQyODcsImV4cCI6MjEwMDEzMDI4N30.5IDNbrip0nLDF9pN2fXHWVB7w-lYNxPIbTaTO-s1PaM';

let _session=null,_profile=null,_school=null,_schoolId=null,_role=null;
let _classesCache=null,_examsCache=null;
let _cachedStudents=[],_cachedPayments=[],_cachedPOStudents=[];
let _profileStudentId=null,_profileTab='overview';
let _marksClass=null,_marksExam=null,_subjClass=null;
let activeRoute='dashboard';

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function getYear(){return parseInt(lsGet('pm_year'))||new Date().getFullYear()}
function getTerm(){return parseInt(lsGet('pm_term'))||1}
function setPeriod(y,t){lsSet('pm_year',String(y));lsSet('pm_term',String(t))}
function getToken(){return _session?_session.access_token:null}
function getUser(){return _session?_session.user:null}
function setSession(d){_session=d;if(d)lsSet('pm_session',JSON.stringify(d));else lsDel('pm_session')}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtUGX(n){if(n==null||isNaN(n))return'UGX 0';return'UGX '+(Number(n)||0).toLocaleString()}
function fmtNum(n){if(n==null||isNaN(n))return'0';return(Number(n)||0).toLocaleString()}
function fmtDate(ts){if(!ts)return'—';const d=new Date(ts);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}
function fmtLongDate(d){return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}
function fmtDateTime(ts){if(!ts)return'—';const d=new Date(ts);return fmtDate(ts)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function telLink(num){if(!num)return'';return String(num).replace(/[^0-9+]/g,'')}
function waLink(num){if(!num)return'';let c=String(num).replace(/[^0-9]/g,'');if(c.startsWith('0'))c='256'+c.slice(1);return c}
function genderLabel(g){if(!g)return'—';const x=String(g).trim().toLowerCase();if(x==='m'||x==='male')return'Male';if(x==='f'||x==='female')return'Female';return'—'}
function isBoard(s){if(!s)return false;const v=String(s).trim().toLowerCase();return v==='boarding'||v==='boarder'||v==='b'}
function gradeOf(score){if(score==null||isNaN(score))return{g:'—',r:'—'};const s=Number(score);if(s>=90)return{g:'D1',r:'Distinction 1'};if(s>=80)return{g:'D2',r:'Distinction 2'};if(s>=70)return{g:'C3',r:'Credit 3'};if(s>=60)return{g:'C4',r:'Credit 4'};if(s>=55)return{g:'C5',r:'Credit 5'};if(s>=50)return{g:'C6',r:'Credit 6'};if(s>=45)return{g:'P7',r:'Pass 7'};if(s>=40)return{g:'P8',r:'Pass 8'};return{g:'F9',r:'Fail 9'}}

function toast(msg,type){const el=document.createElement('div');el.className='toast'+(type==='bad'?' bad':(type==='ok'?' ok':''));el.textContent=msg;document.getElementById('toastRoot').appendChild(el);setTimeout(()=>el.remove(),3500)}
function modal(html){const r=document.getElementById('modalRoot');r.innerHTML='<div class="modal-bg"><div class="modal">'+html+'</div></div>';r.querySelector('.modal-bg').addEventListener('click',e=>{if(e.target.classList.contains('modal-bg'))closeModal()})}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
window.toast=toast;window.modal=modal;window.closeModal=closeModal;window.esc=esc;

function printSection(title,tableHTML){
  const w=window.open('','_blank');
  if(!w){toast('Allow popups','bad');return}
  const logo=_school&&(_school.logo_url||_school.logo_data);
  let h='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+esc(title)+'</title><style>*{box-sizing:border-box}body{font-family:Arial;padding:20px;margin:0;font-size:13px}.letterhead{display:flex;align-items:center;gap:16px;padding-bottom:14px;border-bottom:2px solid #0a2540;margin-bottom:18px}.letterhead img{width:70px;height:70px;object-fit:contain}.letterhead h1{font-size:18px;margin:0 0 4px;text-transform:uppercase;color:#0a2540}.doc-title{text-align:center;font-size:14px;font-weight:700;text-transform:uppercase;color:#0a2540;margin:14px 0 6px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:7px 9px;border:1px solid #ccc;font-size:11.5px;text-align:left}th{background:#0a2540;color:#fff}@media print{body{padding:0}}</style></head><body>';
  h+='<div class="letterhead">'+(logo?'<img src="'+esc(logo)+'">':'')+'<div><h1>'+esc(_school?.name||'')+'</h1><div style="font-size:11px;color:#555">'+esc(_school?.address||'')+'</div></div></div>';
  h+='<div class="doc-title">'+esc(title)+'</div>'+tableHTML;
  h+='<div style="text-align:center;font-size:10px;color:#888;margin-top:24px">Powered by EUDES MEDIA</div>';
  h+='<script>setTimeout(function(){window.print()},400)</'+'script></body></html>';
  w.document.write(h);
  w.document.close();
}
window.printSection=printSection;

async function api(path,opt){
  opt=opt||{};
  const h=Object.assign({'apikey':SUPA_KEY,'Content-Type':'application/json'},opt.headers||{});
  const t=getToken();h['Authorization']='Bearer '+(t||SUPA_KEY);
  const res=await fetch(SUPA_URL+path,Object.assign({},opt,{headers:h}));
  const txt=await res.text();
  let data=null;try{data=txt?JSON.parse(txt):null}catch(e){data=txt}
  if(!res.ok)throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||txt||('HTTP '+res.status));
  return data;
}

async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass=document.getElementById('loginPass').value;
  const err=document.getElementById('loginErr');
  const btn=document.getElementById('loginBtn');
  err.style.display='none';
  if(!email||!pass){err.textContent='Enter email and password';err.style.display='block';return}
  btn.disabled=true;btn.textContent='Signing in…';
  try{
    const res=await fetch(SUPA_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    const txt=await res.text();
    const data=txt?JSON.parse(txt):null;
    if(!res.ok)throw new Error((data&&(data.error_description||data.msg||data.error))||'Login failed');
    setSession({access_token:data.access_token,refresh_token:data.refresh_token,user:data.user});
    await boot();
  }catch(e){err.textContent=e.message;err.style.display='block'}
  btn.disabled=false;btn.textContent='Sign In';
}
window.doLogin=doLogin;

async function doLogout(){
  if(!confirm('Sign out?'))return;
  try{const t=getToken();if(t)await fetch(SUPA_URL+'/auth/v1/logout',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+t}})}catch(e){}
  setSession(null);_profile=null;_school=null;_schoolId=null;_classesCache=null;
  document.getElementById('app').style.display='none';
  document.getElementById('authScreen').style.display='flex';
}
window.doLogout=doLogout;

async function boot(){
  const user=getUser();
  if(!user){document.getElementById('authScreen').style.display='flex';return}
  const errEl=document.getElementById('loginErr');
  try{
    const p=await api('/rest/v1/profiles?id=eq.'+user.id+'&select=*');
    _profile=p&&p[0];
  }catch(e){errEl.textContent='Profile error: '+e.message;errEl.style.display='block';return}
  if(!_profile){errEl.textContent='Profile not found.';errEl.style.display='block';return}
  _schoolId=_profile.school_id;_role=_profile.role;
  if(!_schoolId){errEl.textContent='No school linked.';errEl.style.display='block';return}
  try{const sc=await api('/rest/v1/schools?id=eq.'+_schoolId+'&select=*');_school=sc&&sc[0]}catch(e){}
  if(!_school){errEl.textContent='School not found.';errEl.style.display='block';return}
  if(_school.current_year)setPeriod(_school.current_year,_school.current_term||1);
  document.getElementById('authScreen').style.display='none';
  document.getElementById('app').style.display='block';
  populateTermSelector();renderHeader();renderNav();renderBottomBar();tickClock();
  setInterval(tickClock,30000);
  await nav('dashboard');
}
window.boot=boot;

function tickClock(){const now=new Date();const d=document.getElementById('headerDate');const t=document.getElementById('headerTime');if(d)d.textContent='📅 '+fmtLongDate(now);if(t)t.textContent='🕐 '+now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}

function renderHeader(){
  if(!_school)return;
  document.getElementById('headerSchoolName').textContent=_school.name||'SCHOOL';
  document.getElementById('topbarTitle').textContent=_school.name||'SCHOOL';
  if(_role)document.getElementById('roleChip').textContent=String(_role).replace(/_/g,' ').toUpperCase();
  const meta=[];if(_school.address)meta.push('📍 '+esc(_school.address));if(_school.telephone)meta.push('📞 '+esc(_school.telephone));
  document.getElementById('headerMeta').innerHTML=meta.length?meta.join(' · '):'—';
  const logoEl=document.getElementById('headerLogo');
  if(logoEl){const src=_school.logo_data||_school.logo_url||'';if(src){logoEl.innerHTML='<img src="'+esc(src)+'">';logoEl.style.background='#fff';logoEl.style.padding='2px'}else{logoEl.innerHTML='🏛️'}}
}
window.renderHeader=renderHeader;

function populateTermSelector(){
  const ySel=document.getElementById('termYearSelect');const tSel=document.getElementById('termTermSelect');if(!ySel||!tSel)return;
  const cy=getYear(),ct=getTerm(),cyr=new Date().getFullYear();
  const years=[];for(let y=cyr-2;y<=cyr+1;y++)years.push(y);
  if(!years.includes(cy))years.push(cy);years.sort((a,b)=>b-a);
  ySel.innerHTML=years.map(y=>'<option value="'+y+'"'+(y===cy?' selected':'')+'>'+y+'</option>').join('');
  tSel.value=ct;
}
async function changePeriod(){
  const y=parseInt(document.getElementById('termYearSelect').value);
  const t=parseInt(document.getElementById('termTermSelect').value);
  setPeriod(y,t);
  try{await api('/rest/v1/schools?id=eq.'+_schoolId,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({current_year:y,current_term:t})});_school.current_year=y;_school.current_term=t}catch(e){}
  toast('Switched to '+y+' Term '+t,'ok');nav(activeRoute);
}
window.changePeriod=changePeriod;

async function nav(route){
  if(!ROUTES[route])return;
  activeRoute=route;renderNav();renderBottomBar();
  const main=document.getElementById('main');main.innerHTML='<div class="loading">Loading…</div>';
  window.scrollTo({top:0,behavior:'smooth'});
  try{await ROUTES[route].render(main)}
  catch(e){console.error(e);main.innerHTML='<div class="card"><h3>Error</h3><p class="muted">'+esc(e.message)+'</p><button class="btn ghost" onclick="nav(\''+route+'\')">Retry</button></div>'}
}
window.nav=nav;
function renderNav(){const entries=Object.entries(ROUTES).filter(([k])=>k!=='student_profile');document.getElementById('nav').innerHTML=entries.map(([k,r])=>'<button class="pill'+(k===activeRoute?' active':'')+'" onclick="nav(\''+k+'\')">'+r.icon+' '+esc(r.label)+'</button>').join('')}

  const results=await Promise.all([
    api('/rest/v1/students?school_id=eq.'+_schoolId+'&select=*').catch(()=>[]),
    api('/rest/v1/classes?school_id=eq.'+_schoolId+'&select=id').catch(()=>[]),
    api('/rest/v1/payments?school_id=eq.'+_schoolId+'&select=amount,paid_at').catch(()=>[]),

  '<div class="kpi kpi-navy"><div class="v">'+active.length+'</div><div class="l">Active Pupils</div></div>'+
  '<div class="kpi kpi-ok"><div class="v">'+fmtUGX(tP)+'</div><div class="l">Collected</div></div>'+
  '<div class="kpi kpi-bad"><div class="v">'+fmtUGX(tC-tP)+'</div><div class="l">Outstanding</div></div>'+
  '<div class="kpi"><div class="v">'+fmtUGX(todayColl)+'</div><div class="l">Today</div></div>'+
  '<div class="kpi kpi-warn" style="cursor:pointer" onclick="nav(\'reminders\')"><div class="v">'+debtors+'</div><div class="l">Send Reminders →</div></div></div>'+
  '<div class="grid grid-2"><div class="card"><h3>🔔 Alerts</h3>'+
  (debtors>0?'<div class="alert-item danger" onclick="nav(\'debtors\')" style="cursor:pointer"><span class="ico">⚠️</span><div class="txt"><b>'+debtors+' debtors</b><span>'+fmtUGX(tC-tP)+'</span></div></div>':'')+

  ]);
  _cachedStudents=results[0]||[];
  window._activePassIds=new Set((results[1]||[]).map(p=>p.student_id));
  root.innerHTML='<div class="page-head"><div><h1>Pupils</h1><div class="sub" id="stCount">'+_cachedStudents.length+'</div></div><button class="btn" onclick="openStudentModal(null)">＋ Register</button></div>'+

  '</div><div id="stTable"></div></div>';

function filterStudents(){
  const q=(document.getElementById('stSearch').value||'').toLowerCase();
  const cf=document.getElementById('stClass').value||'';
  const rf=document.getElementById('stRes').value||'';
  const classes=_classesCache||[];const cById={};classes.forEach(c=>cById[c.id]=c);
  const activeIds=window._activePassIds||new Set();
  const list=_cachedStudents.filter(s=>{
    if(cf&&s.class_id!==cf)return false;
    if(rf){const wb=(rf==='Boarding');if(wb!==isBoard(s.boarding_status))return false}
    if(q){const h=(s.first_name+' '+(s.last_name||'')+' '+s.admission_no+' '+(s.parent_name||'')+' '+(s.parent_contact||'')+' '+(s.lin||'')).toLowerCase();if(h.indexOf(q)===-1)return false}
    return true;
  });
  window._filteredSt=list;
  document.getElementById('stCount').textContent=_cachedStudents.length+' total · '+list.length+' shown';
  const c=document.getElementById('stTable');
  if(!list.length){c.innerHTML='<div class="empty">No pupils.</div>';return}
  let rows='';
  list.forEach(s=>{
    const cls=cById[s.class_id];const bal=(Number(s.total_charged)||0)-(Number(s.total_paid)||0);
    const pc=(s.parent_contact||'').trim();
    const wa=pc?waLink(pc):'',tl=pc?telLink(pc):'';
    let contact='—';
    if(s.parent_name||pc){contact='';if(s.parent_name)contact+='<b>'+esc(s.parent_name)+'</b>';if(pc)contact+='<div style="font-weight:600;margin-top:2px">'+esc(pc)+'</div><div style="display:flex;gap:4px;margin-top:4px">'+(wa?'<a href="https://wa.me/'+wa+'" target="_blank" class="btn sm wa" style="text-decoration:none">💬</a>':'')+(tl?'<a href="tel:'+tl+'" class="btn sm ghost" style="text-decoration:none">📞</a>':'')+'</div>'}
    rows+='<tr><td><b>'+esc(s.admission_no||'—')+'</b></td><td><a href="javascript:void(0)" onclick="openProfile(\''+s.id+'\')" style="color:var(--navy);font-weight:600;text-decoration:none">'+esc(s.first_name+' '+(s.last_name||''))+'</a></td><td>'+(cls?'<span class="badge info">'+esc(cls.name)+'</span>':'—')+'</td><td>'+esc(genderLabel(s.gender))+'</td><td>'+esc(s.lin||'—')+'</td><td>'+contact+'</td><td>'+(isBoard(s.boarding_status)?'<span class="badge warn">Board</span>':'<span class="badge ok">Day</span>')+'</td><td>'+(activeIds.has(s.id)?'<span class="badge bad">OUT</span>':'')+'</td><td style="text-align:right"><span class="badge '+(bal>0?'bad':'ok')+'">'+fmtNum(bal)+'</span></td><td style="text-align:right;white-space:nowrap"><button class="btn sm" onclick="openProfile(\''+s.id+'\')">👤</button> <button class="btn sm gold" onclick="recordPayment(\''+s.id+'\')">💵</button> <button class="btn sm ghost" onclick="openStudentModalById(\''+s.id+'\')">✏️</button> <button class="btn sm danger" onclick="deleteStudent(\''+s.id+'\')">✕</button></td></tr>';
  });
  c.innerHTML='<div class="table-wrap"><table style="font-size:12.5px"><thead><tr><th>ADM</th><th>Name</th><th>Class</th><th>Gender</th><th>LIN</th><th>Parent</th><th>Type</th><th>OUT</th><th style="text-align:right">Balance</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
window.filterStudents=filterStudents;

function recalcFees(){
  const n=f=>Number(document.getElementById(f)?.value)||0;
  const sum=n('m_bf')+n('m_fee')+n('m_func')+n('m_trans')+n('m_hol')+n('m_acad');
  const tc=document.getElementById('m_tc');if(tc){tc.value=sum;recalcBal()}
}
function recalcBal(){
  const n=f=>Number(document.getElementById(f)?.value)||0;
  const bal=document.getElementById('m_bal');if(bal)bal.value=n('m_tc')-n('m_tp');
}
window.recalcFees=recalcFees;window.recalcBal=recalcBal;

async function saveStudent(id){
  const n=f=>{const el=document.getElementById(f);if(!el)return 0;const v=el.value.trim();return v===''?0:(Number(v)||0)};
  const v=f=>{const el=document.getElementById(f);return el?el.value.trim():''};
  const adm=v('m_adm'),fn=v('m_fn'),cid=v('m_class');
  if(!adm||!fn||!cid){toast('Fill ADM, First Name and Class','bad');return}
  const bf=n('m_bf'),fee=n('m_fee'),func=n('m_func'),trans=n('m_trans'),hol=n('m_hol'),acad=n('m_acad');
  const tc=n('m_tc')||(bf+fee+func+trans+hol+acad);
  const tp=n('m_tp');const bal=tc-tp;
  const body={school_id:_schoolId,admission_no:adm,class_id:cid,first_name:fn,last_name:v('m_ln')||null,gender:v('m_gender')||null,date_of_birth:v('m_dob')||null,lin:v('m_lin')||null,school_pay_code:v('m_paycode')||null,boarding_status:v('m_res')||'Day',location:v('m_loc')||null,parent_name:v('m_par')||null,parent_contact:v('m_pc')||null,status:v('m_status')||'active',balance_bf:bf,actual_fee:fee,functional_fee:func,transport_fee:trans,holiday_fee:hol,academics_fee:acad,total_charged:tc,total_paid:tp,current_balance:bal};
  try{
    if(id)await api('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});
    else await api('/rest/v1/students',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});
    toast('Saved ✓ Charged: '+fmtUGX(tc)+' · Paid: '+fmtUGX(tp)+' · Balance: '+fmtUGX(bal),'ok');
    closeModal();nav(activeRoute);
  }catch(e){toast('Save failed: '+e.message,'bad')}
}
window.saveStudent=saveStudent;

async function deleteStudent(id){
  if(!confirm('Delete this pupil permanently?'))return;

async function nextReceiptNo(){
  const y=getYear();
  try{const rows=await api('/rest/v1/payments?school_id=eq.'+_schoolId+'&year=eq.'+y+'&select=id');return 'RCP-'+y+'-'+String((rows.length||0)+1).padStart(5,'0')}
  catch(e){return 'RCP-'+y+'-'+String(Date.now()).slice(-5)}
}

async function recordPayment(studentId){
  const s=_cachedStudents.find(x=>x.id===studentId);
  if(!s){toast('Open Students page first','bad');return}
  const cls=(_classesCache||[]).find(c=>c.id===s.class_id);
  const charged=Number(s.total_charged)||0,paid=Number(s.total_paid)||0,bal=charged-paid;
  const rno=await nextReceiptNo();
  modal('<h3>💰 Record Payment</h3>'+
    '<div style="background:#f8fafc;border-radius:10px;padding:12px;margin-bottom:12px"><b>'+esc(s.first_name+' '+(s.last_name||''))+'</b><div class="muted">'+esc(cls?cls.name:'')+' · '+esc(s.admission_no)+'</div><div style="margin-top:8px"><span class="mini-stat">Charged: '+fmtUGX(charged)+'</span><span class="mini-stat" style="background:#ecfdf5;color:#047857">Paid: '+fmtUGX(paid)+'</span><span class="mini-stat" style="background:#fef2f2;color:#b91c1c">Balance: '+fmtUGX(bal)+'</span></div></div>'+

    '<div><label>Payment For</label><select id="p_for"><option>School Fees</option><option>Functional Fees</option><option>Transport</option><option>Holiday</option><option>Academics</option><option>Uniform</option><option>Other</option></select></div>'+
    '<div style="margin-top:12px"><label>Amount *</label><input id="p_amount" type="number" value="'+Math.max(0,bal)+'"></div>'+
    '<div style="margin-top:12px"><label>Method</label><select id="p_method"><option>Cash</option><option>Mobile Money</option><option>Bank</option><option>Cheque</option></select></div>'+
    '<div style="margin-top:12px"><label>Notes</label><input id="p_notes"></div>'+

}
window.recordPayment=recordPayment;

async function savePayment(studentId){
  const amount=Number(document.getElementById('p_amount').value);
  const rno=document.getElementById('p_rno').value.trim()||('RCP-'+Date.now());
  if(!amount||amount<=0){toast('Enter amount','bad');return}
  const s=_cachedStudents.find(x=>x.id===studentId);if(!s){toast('Not found','bad');return}
  const payment_for=document.getElementById('p_for').value;
  const method=document.getElementById('p_method').value;
  const notes=document.getElementById('p_notes').value.trim();
  const body={school_id:_schoolId,student_id:studentId,receipt_no:rno,year:getYear(),term:getTerm(),academic_year:getYear(),amount:amount,method:method,payment_for:payment_for,received_by:_profile?_profile.id:null};
  if(notes)body.notes=notes;
  try{
    await api('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});
    const newPaid=(Number(s.total_paid)||0)+amount;
    const charged=Number(s.total_charged)||0;
    await api('/rest/v1/students?id=eq.'+studentId,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({total_paid:newPaid,current_balance:Math.max(0,charged-newPaid)})});
    toast('Receipt: '+rno,'ok');
    printReceipt(s,{receipt_no:rno,amount:amount,payment_for:payment_for,method:method,date:new Date().toISOString()});
    closeModal();nav(activeRoute);
  }catch(e){toast(e.message,'bad')}
}
window.savePayment=savePayment;

async function pageReminders(root){
  const students=await api('/rest/v1/students?school_id=eq.'+_schoolId+'&status=eq.active&select=*&order=admission_no')||[];
  const rows=students.map(s=>{
    const charged=Number(s.total_charged)||0,paid=Number(s.total_paid)||0,bal=charged-paid;
    let status='unpaid';if(charged<=0)status='no-fees';else if(bal<=0)status='cleared';else if(paid>0)status='partial';
    return{s,charged,paid,bal,status};
  });
  window._remAll=rows;
  let tc=0,tp=0,tb=0,debt=0;rows.forEach(r=>{tc+=r.charged;tp+=r.paid;tb+=r.bal;if(r.bal>0.5)debt++});

function downloadCSV(){
  const list=window._contactsFiltered||window._contactsAll||[];
  if(!list.length){toast('Nothing','bad');return}
  const head=['ADM','LIN','First Name','Last Name','Gender','Boarding','Parent Name','Parent Phone','Balance'];
  const rows=[head.join(',')];
  list.forEach(r=>{
    const s=r.s;
    const row=[s.admission_no||'',s.lin||'',s.first_name||'',s.last_name||'',genderLabel(s.gender),isBoard(s.boarding_status)?'Boarding':'Day',s.parent_name||'',r.phone||'',r.bal].map(v=>{const str=String(v==null?'':v);if(str.includes(',')||str.includes('"')||str.includes('\n'))return'"'+str.replace(/"/g,'""')+'"';return str});
    rows.push(row.join(','));
  });
  const blob=new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='parents_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast('CSV downloaded ('+list.length+' rows)','ok');
}
window.downloadCSV=downloadCSV;

function downloadVCF(){
  const list=(window._contactsFiltered||window._contactsAll||[]).filter(r=>r.phone);
  if(!list.length){toast('No phones','bad');return}
  let vcf='';
  list.forEach(r=>{
    const s=r.s;
    const name=(s.parent_name||'Parent of '+(s.first_name||'')).replace(/[\n;]/g,' ');
    vcf+='BEGIN:VCARD\nVERSION:3.0\nFN:'+name+'\nTEL;TYPE=CELL:'+r.phone+'\nNOTE:Parent of '+s.first_name+' '+(s.last_name||'')+' — ADM '+(s.admission_no||'')+'\nEND:VCARD\n';
  });
  const blob=new Blob([vcf],{type:'text/vcard;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='parents_'+new Date().toISOString().slice(0,10)+'.vcf';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast('vCard downloaded ('+list.length+' contacts)','ok');
}
window.downloadVCF=downloadVCF;

async function pageClasses(root){
  const classes=await api('/rest/v1/classes?school_id=eq.'+_schoolId+'&select=*&order=sort_order')||[];
  let rows='';classes.forEach(c=>{rows+='<tr><td>'+esc(c.name)+'</td><td>'+esc(c.level||'')+'</td></tr>'});
  root.innerHTML='<div class="page-head"><h1>🏫 Classes</h1></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Level</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

async function pageSettings(root){
  root.innerHTML='<div class="card"><h3>School Info</h3><div class="grid grid-2" style="margin-top:12px"><div><label>Name</label><input id="st_name" value="'+esc(_school.name||'')+'"></div><div><label>Telephone</label><input id="st_phone" value="'+esc(_school.telephone||'')+'"></div><div><label>Address</label><input id="st_addr" value="'+esc(_school.address||'')+'"></div></div><button class="btn" style="margin-top:14px" onclick="saveSchoolInfo()">💾 Save</button></div><div class="card"><h3>Account</h3><div class="muted">'+esc(_profile.full_name||'')+' ('+esc(_profile.email||'')+')</div><button class="btn danger" style="margin-top:12px" onclick="doLogout()">Sign Out</button></div>';
}
async function saveSchoolInfo(){
  const b={name:document.getElementById('st_name').value.trim(),telephone:document.getElementById('st_phone').value.trim(),address:document.getElementById('st_addr').value.trim()};
  try{await api('/rest/v1/schools?id=eq.'+_schoolId,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(b)});Object.assign(_school,b);renderHeader();toast('Saved ✓','ok')}catch(e){toast('Save failed: '+e.message,'bad')}
}
window.saveSchoolInfo=saveSchoolInfo;

async function pageProfile(root){
  if(!_profileStudentId){root.innerHTML='<div class="empty">No pupil selected</div>';return}
  const p=await api('/rest/v1/students?id=eq.'+_profileStudentId+'&select=*');
  const s=p&&p[0];if(!s){root.innerHTML='<div class="empty">Not found</div>';return}
  const charged=Number(s.total_charged)||0,paid=Number(s.total_paid)||0,bal=charged-paid;
  root.innerHTML='<div class="profile-hero"><div class="avatar">'+esc((s.first_name||'?').charAt(0).toUpperCase())+'</div><div class="info"><h1>'+esc(s.first_name+' '+(s.last_name||''))+'</h1><div class="meta">'+esc(s.admission_no)+' · LIN: '+esc(s.lin||'—')+'</div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn gold" onclick="recordPayment(\''+s.id+'\')">💵 Pay</button><button class="btn ghost" style="background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)" onclick="openStudentModalById(\''+s.id+'\')">✏️ Edit</button></div></div>'+
  '<div class="grid grid-kpi" style="margin-bottom:14px"><div class="kpi"><div class="v">'+fmtUGX(charged)+'</div><div class="l">Charged</div></div><div class="kpi kpi-ok"><div class="v">'+fmtUGX(paid)+'</div><div class="l">Paid</div></div><div class="kpi '+(bal>0?'kpi-bad':'kpi-ok')+'"><div class="v">'+fmtUGX(bal)+'</div><div class="l">Balance</div></div></div>'+
  '<div class="card"><h3>Details</h3><table><tbody><tr><td>Class</td><td>'+esc(s.class_id||'—')+'</td></tr><tr><td>Gender</td><td>'+esc(genderLabel(s.gender))+'</td></tr><tr><td>Parent</td><td>'+esc(s.parent_name||'—')+'</td></tr><tr><td>Phone</td><td>'+esc(s.parent_contact||'—')+'</td></tr></tbody></table></div>';
}
window.pageProfile=pageProfile;

try{const s=lsGet('pm_session');if(s)_session=JSON.parse(s)}catch(e){_session=null}
if(_session&&_session.user)boot();
</script>
