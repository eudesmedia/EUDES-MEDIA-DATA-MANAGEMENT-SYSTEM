<script>
/* ============================================================
   EUDES SCHOOL MANAGEMENT — Complete Single File (v2)
   ============================================================ */
const SUPA_URL='https://wabeempxckdtjvrkzhpv.supabase.co';
const SUPA_KEY='sb_publishable_n0uAm0Gcq7qR2dJM4jMZGQ_wiV__Cfp';

let _memoryStore={};
const safeStorage={
  getItem:k=>{try{return localStorage.getItem(k);}catch(e){return _memoryStore[k]||null;}},
  setItem:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){_memoryStore[k]=String(v);}},
  removeItem:k=>{try{localStorage.removeItem(k);}catch(e){delete _memoryStore[k];}}
};

function getCurrentYear(){return parseInt(safeStorage.getItem('eudes_year'))||new Date().getFullYear();}
function getCurrentTerm(){return parseInt(safeStorage.getItem('eudes_term'))||1;}
function setCurrentPeriod(y,t){safeStorage.setItem('eudes_year',String(y));safeStorage.setItem('eudes_term',String(t));}

function getToken(){const s=safeStorage.getItem('eudes_session');if(!s)return null;try{return JSON.parse(s).access_token;}catch(e){return null;}}
function getUser(){const s=safeStorage.getItem('eudes_session');if(!s)return null;try{return JSON.parse(s).user;}catch(e){return null;}}
function setSession(d){if(d)safeStorage.setItem('eudes_session',JSON.stringify(d));else safeStorage.removeItem('eudes_session');}

async function rest(path,options){
  options=options||{};
  const headers=Object.assign({'apikey':SUPA_KEY,'Content-Type':'application/json'},options.headers||{});
  const token=getToken();
  headers['Authorization']='Bearer '+(token||SUPA_KEY);
  const res=await fetch(SUPA_URL+path,Object.assign({},options,{headers}));
  const text=await res.text();
  let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok){
    if(res.status===401){setSession(null);alert('Session expired. Please sign in again.');window.location.reload();throw new Error('Session expired');}
    throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status));
  }
  return data;
}
async function auth(path,body){
  const res=await fetch(SUPA_URL+path,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const text=await res.text();
  let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok)throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status));
  return data;
}

let _profile=null,_school=null,_schoolId=null,_role=null,_classesCache=null;
let _examsCache=null,_marksClass=null,_marksExam=null,_subjClass=null;
let _repClass=null,_repStage=3,_repPupil='';
let _importMatches=null,_importClasses=null;

/* ---------- UI HELPERS ---------- */
function toast(msg,type){const el=document.createElement('div');el.className='toast'+(type==='bad'?' bad':(type==='ok'?' ok':''));el.textContent=msg;document.getElementById('toastRoot').appendChild(el);setTimeout(()=>el.remove(),3500);}
function modal(html){const root=document.getElementById('modalRoot');root.innerHTML='<div class="modal-bg"><div class="modal">'+html+'</div></div>';root.querySelector('.modal-bg').addEventListener('click',e=>{if(e.target.classList.contains('modal-bg'))closeModal();});}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtUGX(n){if(n==null||isNaN(n))return 'UGX 0';return 'UGX '+(Number(n)||0).toLocaleString();}
function fmtNum(n){if(n==null||isNaN(n))return '0';return (Number(n)||0).toLocaleString();}
function fmtDate(ts){if(!ts)return '—';const d=new Date(ts);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function fmtLongDate(d){return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});}

window.toast=toast;window.modal=modal;window.closeModal=closeModal;window.esc=esc;
window.fmtUGX=fmtUGX;window.fmtNum=fmtNum;window.fmtDate=fmtDate;

function gradeOf(score){
  if(score==null||isNaN(score)||score==='')return{g:'—',r:'—',cls:''};
  const s=Number(score);
  if(s>=90)return{g:'D1',r:'Distinction 1',cls:'d1'};
  if(s>=80)return{g:'D2',r:'Distinction 2',cls:'d2'};
  if(s>=70)return{g:'C3',r:'Credit 3',cls:'c3'};
  if(s>=60)return{g:'C4',r:'Credit 4',cls:'c4'};
  if(s>=55)return{g:'C5',r:'Credit 5',cls:'c5'};
  if(s>=50)return{g:'C6',r:'Credit 6',cls:'c6'};
  if(s>=45)return{g:'P7',r:'Pass 7',cls:'p7'};
  if(s>=40)return{g:'P8',r:'Pass 8',cls:'p8'};
  return{g:'F9',r:'Fail 9',cls:'f9'};
}
function posLabel(n){if(!n)return '—';if(n===1)return '1st';if(n===2)return '2nd';if(n===3)return '3rd';return n+'th';}
window.gradeOf=gradeOf;

function printHTML(title,bodyHTML){
  const w=window.open('','_blank');
  if(!w){toast('Allow popups','bad');return;}

function switchTab(which){

async function doRegister(){

  const school=document.getElementById('regSchool').value.trim();

  if(pass.length<8){err.textContent='Password min 8 characters';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='Creating…';

const CLASS_ALIASES = {
  'baby':'Baby Class','baby class':'Baby Class','nursery baby':'Baby Class','babyclass':'Baby Class',
  'middle':'Middle Class','middle class':'Middle Class','middleclass':'Middle Class',
  'top':'Top Class','top class':'Top Class','topclass':'Top Class',
  'p1':'Primary 1','p.1':'Primary 1','primary1':'Primary 1','primary 1':'Primary 1',
  'p2':'Primary 2','p.2':'Primary 2','primary2':'Primary 2','primary 2':'Primary 2',
  'p3':'Primary 3','p.3':'Primary 3','primary3':'Primary 3','primary 3':'Primary 3',
  'p4':'Primary 4','p.4':'Primary 4','primary4':'Primary 4','primary 4':'Primary 4',
  'p5':'Primary 5','p.5':'Primary 5','primary5':'Primary 5','primary 5':'Primary 5',
  'p6':'Primary 6','p.6':'Primary 6','primary6':'Primary 6','primary 6':'Primary 6',
  'p7':'Primary 7','p.7':'Primary 7','primary7':'Primary 7','primary 7':'Primary 7'
};
function normalizeClassName(raw){
  if(!raw)return '';
  const k=String(raw).trim().toLowerCase().replace(/\s+/g,' ');
  return CLASS_ALIASES[k]||raw.trim();
}
function normalizeName(first,last){
  const f=String(first||'').trim().toLowerCase().replace(/\s+/g,' ');
  const l=String(last||'').trim().toLowerCase().replace(/\s+/g,' ');
  return (f+' '+l).trim();
}
function parseMoney(v){
  if(v==null||v==='')return 0;
  if(typeof v==='number')return v;
  let s=String(v).trim();
  if(s==='-'||s==='—'||s==='')return 0;
  const neg=s.startsWith('(')&&s.endsWith(')');
  s=s.replace(/[(),]/g,'').replace(/[^\d.\-]/g,'');
  const n=parseFloat(s);
  return isNaN(n)?0:(neg?-Math.abs(n):n);
}
window.normalizeClassName=normalizeClassName;
window.parseMoney=parseMoney;

function filterStudentsTable(q,fClass){
  q=(q||'').toLowerCase();fClass=fClass||'';
  window._stFilterSearch=q;
  const fRes=document.getElementById('studentResFilter')?.value||'';
  const classes=_classesCache||[];
  const filtered=(window._allStudents||[]).filter(s=>{
    if(fClass&&s.class_id!==fClass)return false;
    if(fRes&&s.residence!==fRes)return false;
    if(q){const hay=(s.first_name+' '+(s.last_name||'')+' '+s.admission_no+' '+(s.parent_name||'')+' '+(s.parent_contact||'')).toLowerCase();if(hay.indexOf(q)===-1)return false;}
    return true;
  });
  window._filteredStudents=filtered;
  document.getElementById('studentCount').textContent=(window._allStudents||[]).length+' total · '+filtered.length+' shown';
  const c=document.getElementById('studentsTableContainer');
  if(!filtered.length){c.innerHTML='<div class="empty">No pupils match your filters.</div>';return;}
  let rows='';
  filtered.forEach(s=>{
    const cls=(classes||[]).find(x=>x.id===s.class_id);
    const charged=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.holiday_fee)||0)+(Number(s.academics_fee)||0)+(Number(s.functional_fee)||0)+(Number(s.transport_fee)||0);
    const collected=(Number(s.deposit_1)||0)+(Number(s.deposit_2)||0)+(Number(s.deposit_3)||0);

async function savePayment(studentId){
  const amount=Number(document.getElementById('p_amount').value);
  const payment_for=document.getElementById('p_for').value;
  const method=document.getElementById('p_method').value;
  const notes=document.getElementById('p_notes').value.trim();
  if(!amount||amount<=0){toast('Enter a valid amount','bad');return;}
  const s=(window._allStudents||[]).find(x=>x.id===studentId);
  if(!s){toast('Pupil not found','bad');return;}

  try{
    await rest('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({
      school_id:_schoolId,
      student_id:studentId,
      receipt_no:'RCP-'+Date.now(),
      year:getCurrentYear(),
      term:getCurrentTerm(),
      academic_year:getCurrentYear(),
      amount:amount,
      method:method,
      payment_method:method,
      payment_for:payment_for,
      notes:notes||null,
      received_by:_profile?_profile.id:null
    })});

    const newBalances={deposit_1:Number(s.deposit_1)||0,deposit_2:Number(s.deposit_2)||0,deposit_3:Number(s.deposit_3)||0};
    if(!newBalances.deposit_1){newBalances.deposit_1=amount;}
    else if(!newBalances.deposit_2){newBalances.deposit_2=amount;}
    else if(!newBalances.deposit_3){newBalances.deposit_3=amount;}
    else{newBalances.deposit_3+=amount;}
    const charged=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.holiday_fee)||0)+(Number(s.academics_fee)||0)+(Number(s.functional_fee)||0)+(Number(s.transport_fee)||0);
    const newCollected=newBalances.deposit_1+newBalances.deposit_2+newBalances.deposit_3;
    await rest('/rest/v1/students?id=eq.'+studentId,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify(Object.assign({current_balance:charged-newCollected},newBalances))});

    if(payment_for==='Functional Fees'){
      const newPaid=(Number(s.functional_fee_paid)||0)+amount;
      await rest('/rest/v1/students?id=eq.'+studentId,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({functional_fee_paid:newPaid,functional_fee_status:'cash'})});
    }

    toast('Payment recorded: '+fmtUGX(amount),'ok');
    closeModal();
    nav(activeRoute);
  }catch(e){toast(e.message,'bad');}
}

function findColIndex(headers,names){
  for(let i=0;i<headers.length;i++){
    const h=String(headers[i]||'').trim().toLowerCase().replace(/\s+/g,' ');
    for(const n of names){
      if(h===n.toLowerCase())return i;
    }
  }
  return -1;
}

async function processImportRows(rows){
  const status=document.getElementById('importStatus');
  if(!rows||rows.length<2){status.textContent='No data rows found.';return;}

  let headerIdx=0;
  for(let i=0;i<Math.min(5,rows.length);i++){
    const r=rows[i].map(c=>String(c||'').toLowerCase());
    if(r.includes('name')||r.some(c=>c.includes('class'))){headerIdx=i;break;}
  }
  const headers=rows[headerIdx].map(h=>String(h||'').trim());

  const iName=findColIndex(headers,['name','pupil','pupil name','full name']);
  const iClass=findColIndex(headers,['class']);
  const iStatus=findColIndex(headers,['status','residence']);
  const iBF=findColIndex(headers,['b/f','bf','balance b/f','bal bf']);
  const iActual=findColIndex(headers,['actual fee','actual']);
  const iHoliday=findColIndex(headers,['holiday']);
  const iAcademics=findColIndex(headers,['academics']);
  const iFunc=findColIndex(headers,['funct','functional','functional fee']);
  const iTrans=findColIndex(headers,['transport']);
  const iD1=findColIndex(headers,['1st deposit','first deposit','deposit 1']);
  const iD2=findColIndex(headers,['2nd deposit','second deposit','deposit 2']);
  const iD3=findColIndex(headers,['3rd deposit','third deposit','deposit 3']);

  if(iName<0){status.innerHTML='<span style="color:#dc2626">❌ Could not find a "Name" column.</span>';return;}

  const parsed=[];
  for(let i=headerIdx+1;i<rows.length;i++){
    const r=rows[i];
    const rawName=String(r[iName]||'').trim();
    if(!rawName)continue;
    if(rawName.toLowerCase().includes('total')||rawName.toLowerCase().includes('grand'))continue;

    const parts=rawName.split(/\s+/);
    let first,last='';
    if(parts.length>=2){first=parts[0];last=parts.slice(1).join(' ');}
    else{first=parts[0];}

    parsed.push({
      rowNum:i+1,
      rawName:rawName,
      first_name:first,
      last_name:last,
      class_name:iClass>=0?normalizeClassName(r[iClass]):'',
      residence:iStatus>=0?(String(r[iStatus]).toLowerCase().includes('board')?'boarding':'day'):'',
      balance_bf:iBF>=0?parseMoney(r[iBF]):0,
      actual_fee:iActual>=0?parseMoney(r[iActual]):0,
      holiday_fee:iHoliday>=0?parseMoney(r[iHoliday]):0,
      academics_fee:iAcademics>=0?parseMoney(r[iAcademics]):0,
      functional_fee:iFunc>=0?parseMoney(r[iFunc]):0,
      transport_fee:iTrans>=0?parseMoney(r[iTrans]):0,
      deposit_1:iD1>=0?parseMoney(r[iD1]):0,
      deposit_2:iD2>=0?parseMoney(r[iD2]):0,
      deposit_3:iD3>=0?parseMoney(r[iD3]):0
    });
  }

  await matchImportRows(parsed);
  status.innerHTML='<b style="color:#047857">✅ '+parsed.length+' rows parsed</b>';
}
window.processImportRows=processImportRows;

async function matchImportRows(parsed){
  const students=window._allStudents||[];
  const nameIndex={};
  students.forEach(s=>{
    const k=normalizeName(s.first_name,s.last_name);
    if(!nameIndex[k])nameIndex[k]=[];
    nameIndex[k].push(s);
  });

  _importMatches=parsed.map(row=>{
    const k=normalizeName(row.first_name,row.last_name);
    const candidates=nameIndex[k]||[];
    let status='new';
    let chosen=null;
    if(candidates.length===1){status='exact';chosen=candidates[0];}
    else if(candidates.length>1){status='ambiguous';}
    else{
      const firstMatches=students.filter(s=>String(s.first_name||'').toLowerCase().trim()===row.first_name.toLowerCase().trim());
      if(firstMatches.length===1){status='fuzzy';chosen=firstMatches[0];}
      else if(firstMatches.length>1){status='ambiguous';}
      else{status='missing';}
    }
    return {row, candidates, status, chosen};
  });

  renderImportPreview();
}

function renderImportPreview(){
  const c=document.getElementById('importPreview');
  if(!_importMatches){c.innerHTML='';return;}

  const counts={exact:0,fuzzy:0,ambiguous:0,missing:0,new:0};
  _importMatches.forEach(m=>{counts[m.status]=(counts[m.status]||0)+1;});

  let rows='';
  _importMatches.forEach((m,i)=>{
    const charged=m.row.balance_bf+m.row.actual_fee+m.row.holiday_fee+m.row.academics_fee+m.row.functional_fee+m.row.transport_fee;
    const collected=m.row.deposit_1+m.row.deposit_2+m.row.deposit_3;
    const bal=charged-collected;
    const cls=m.chosen?((_importClasses||[]).find(x=>x.id===m.chosen.class_id)||{}).name:'';
    const badge={
      exact:'<span class="badge ok">✅ Exact</span>',
      fuzzy:'<span class="badge warn">⚠️ Fuzzy</span>',
      ambiguous:'<span class="badge warn">❓ Ambiguous</span>',
      missing:'<span class="badge bad">❌ Not found</span>',
      new:'<span class="badge info">🆕 New</span>'
    }[m.status]||'';
    rows+='<tr>'+
      '<td>'+(i+1)+'</td>'+
      '<td><b>'+esc(m.row.rawName)+'</b><div class="muted" style="font-size:11px">'+esc(m.row.class_name||'—')+'</div></td>'+
      '<td>'+(m.chosen?esc(m.chosen.first_name+' '+(m.chosen.last_name||'')):'<i style="color:#94a3b8">—</i>')+'</td>'+
      '<td>'+esc(cls||m.row.class_name||'—')+'</td>'+
      '<td>'+esc(m.row.residence||'—')+'</td>'+
      '<td style="text-align:right">'+fmtNum(charged)+'</td>'+
      '<td style="text-align:right;color:#047857">'+fmtNum(collected)+'</td>'+
      '<td style="text-align:right;color:'+(bal>0?'#b91c1c':'#047857')+'">'+fmtNum(bal)+'</td>'+
      '<td>'+badge+'</td>'+
      '<td>'+(m.status==='ambiguous'?'<button class="btn sm" onclick="pickAmbiguous('+i+')">Pick</button>':'')+'</td>'+
      '</tr>';
  });

  c.innerHTML=
  '<div class="grid grid-kpi" style="margin-bottom:14px">'+
  '<div class="kpi kpi-ok"><div class="v">'+counts.exact+'</div><div class="l">✅ Exact matches</div></div>'+
  '<div class="kpi kpi-warn"><div class="v">'+(counts.fuzzy||0)+'</div><div class="l">⚠️ Fuzzy matches</div></div>'+
  '<div class="kpi kpi-warn"><div class="v">'+(counts.ambiguous||0)+'</div><div class="l">❓ Ambiguous</div></div>'+
  '<div class="kpi kpi-bad"><div class="v">'+counts.missing+'</div><div class="l">❌ Not found</div></div>'+
  '</div>'+

  '<button class="btn ok" onclick="applyImport(this)">✅ Apply '+_importMatches.length+' rows</button></div>'+

async function applyImport(btn){
  if(!_importMatches||!_importMatches.length){toast('Nothing to import','bad');return;}
  const classes=_importClasses||await loadClasses();
  const classByName={};classes.forEach(c=>classByName[c.name.toLowerCase()]=c);

  const willUpdate=_importMatches.filter(m=>m.chosen&&(m.status==='exact'||m.status==='fuzzy'));
  const willCreate=_importMatches.filter(m=>m.status==='missing'||m.status==='new');

  if(!confirm('Apply '+willUpdate.length+' updates and create '+willCreate.length+' new pupils?'))return;

  let updated=0,created=0,errors=0;
  if(btn){btn.disabled=true;btn.textContent='Applying…';}

  for(const m of willUpdate){
    try{
      const row=m.row;
      const cls=classByName[row.class_name.toLowerCase()];
      const charged=row.balance_bf+row.actual_fee+row.holiday_fee+row.academics_fee+row.functional_fee+row.transport_fee;
      const collected=row.deposit_1+row.deposit_2+row.deposit_3;
      const body={
        class_id:cls?cls.id:(m.chosen.class_id||null),
        residence:row.residence||m.chosen.residence||'day',
        balance_bf:row.balance_bf,
        actual_fee:row.actual_fee,
        holiday_fee:row.holiday_fee,
        academics_fee:row.academics_fee,
        functional_fee:row.functional_fee,
        transport_fee:row.transport_fee,
        deposit_1:row.deposit_1,
        deposit_2:row.deposit_2,
        deposit_3:row.deposit_3,
        total_expected:charged,
        current_balance:charged-collected
      };
      await rest('/rest/v1/students?id=eq.'+m.chosen.id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});
      updated++;
    }catch(e){errors++;console.error(e);}
  }

  for(const m of willCreate){
    try{
      const row=m.row;
      const cls=classByName[row.class_name.toLowerCase()];
      const charged=row.balance_bf+row.actual_fee+row.holiday_fee+row.academics_fee+row.functional_fee+row.transport_fee;
      const collected=row.deposit_1+row.deposit_2+row.deposit_3;
      const body={
        school_id:_schoolId,
        admission_no:'ADM-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-5)+Math.floor(Math.random()*100),
        class_id:cls?cls.id:null,
        first_name:row.first_name,
        last_name:row.last_name||null,
        residence:row.residence||'day',
        status:'active',
        balance_bf:row.balance_bf,
        actual_fee:row.actual_fee,
        holiday_fee:row.holiday_fee,
        academics_fee:row.academics_fee,
        functional_fee:row.functional_fee,
        transport_fee:row.transport_fee,
        deposit_1:row.deposit_1,
        deposit_2:row.deposit_2,
        deposit_3:row.deposit_3,
        total_expected:charged,
        current_balance:charged-collected
      };
      await rest('/rest/v1/students',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});
      created++;
    }catch(e){errors++;console.error(e);}
  }

  if(btn){btn.disabled=false;btn.textContent='✅ Apply '+_importMatches.length+' rows';}
  toast('Done: '+updated+' updated, '+created+' created, '+errors+' errors',errors?'bad':'ok');
  _importMatches=null;
  nav('fees');
}
window.applyImport=applyImport;

        const v=per[sj.subject_id];
        if(v!=null&&!isNaN(v)&&sj.graded)total+=Number(v);
        inputCells+='<td><input type="number" min="0" max="100" value="'+(v!=null?v:'')+'" data-student="'+s.id+'" data-subject="'+sj.subject_id+'" onchange="setMark(this)" onfocus="this.select()" class="marks-input"></td>';
      });
      rows+='<tr><td>'+(i+1)+'</td><td>'+esc(s.admission_no)+'</td><td><b>'+esc(s.first_name+' '+(s.last_name||''))+'</b></td>'+
        inputCells+
        '<td style="text-align:right;font-weight:700" class="row-total" data-student="'+s.id+'">'+total.toFixed(0)+'</td></tr>';
    });
    tableHTML='<div class="card"><div class="table-wrap"><table><thead><tr><th>#</th><th>Adm</th><th>Name</th>'+headerCells+'<th style="text-align:right">Total</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  }

  root.innerHTML=
  '<div class="page-head"><h1>✍️ Marks</h1><div class="sub">Enter scores per subject</div></div>'+
  '<div class="card"><div class="grid grid-2">'+
  '<div><label>Class</label><select onchange="_marksClass=this.value;pageMarks(document.getElementById(\'main\'))">'+classOpts+'</select></div>'+
  '<div><label>Exam</label><select onchange="_marksExam=this.value;pageMarks(document.getElementById(\'main\'))">'+examOpts+'</select></div>'+
  '</div>'+subjInfo+'</div>'+
  tableHTML;
}
window.renderMarksInner=renderMarksInner;

async function setMark(inputEl){
  const studentId=inputEl.dataset.student;
  const subjectId=inputEl.dataset.subject;
  const val=inputEl.value;
  const score=val===''?null:parseFloat(val);
  if(score!=null&&(isNaN(score)||score<0||score>100)){toast('Score must be 0-100','bad');inputEl.value='';return;}
  try{
    if(score==null){
      await rest('/rest/v1/marks?school_id=eq.'+_schoolId+'&student_id=eq.'+studentId+'&exam_id=eq.'+_marksExam+'&subject_id=eq.'+subjectId,{method:'DELETE'});
      if(window._marksMap[studentId])delete window._marksMap[studentId][subjectId];
    }else{
      await rest('/rest/v1/marks?school_id=eq.'+_schoolId+'&student_id=eq.'+studentId+'&exam_id=eq.'+_marksExam+'&subject_id=eq.'+subjectId,{method:'DELETE'});
      await rest('/rest/v1/marks',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,student_id:studentId,exam_id:_marksExam,subject_id:subjectId,score})});
      if(!window._marksMap[studentId])window._marksMap[studentId]={};
      window._marksMap[studentId][subjectId]=score;
    }
    const per=window._marksMap[studentId]||{};
    let total=0;
    (window._marksSubjects||[]).forEach(sj=>{const v=per[sj.subject_id];if(v!=null&&!isNaN(v)&&sj.graded)total+=Number(v);});
    const el=document.querySelector('.row-total[data-student="'+studentId+'"]');
    if(el)el.textContent=total.toFixed(0);
  }catch(e){toast(e.message,'bad');}
}
window.setMark=setMark;

/* ============================================================
   REPORTS (uses class_subjects ⋈ subjects)

async function pageReports(root){
  clearClassesCache();
  const classes=await loadClasses();
  if(!_repClass&&classes[0])_repClass=classes[0].id;
  await renderReportsInner(root, classes);
}
window.pageReports=pageReports;

async function renderReportsInner(root, classesArg){
  const classes=classesArg||await loadClasses();
  const classObj=classes.find(c=>c.id===_repClass);
  const subjects=await loadSubjectsForClass(_repClass);
  const students=await rest('/rest/v1/students?school_id=eq.'+_schoolId+'&class_id=eq.'+_repClass+'&status=eq.active&select=*&order=first_name')||[];
  if(!_examsCache){_examsCache=await rest('/rest/v1/exams?school_id=eq.'+_schoolId+'&select=*&order=stage')||[];}
  const exams=(_examsCache||[]).filter(e=>e.stage<=_repStage);

  const studentIds=students.map(s=>s.id);
  let marksRows=[];
  if(studentIds.length&&exams.length){
    const ids=studentIds.join(',');
    const eids=exams.map(e=>e.id).join(',');
    marksRows=await rest('/rest/v1/marks?school_id=eq.'+_schoolId+'&student_id=in.('+ids+')&exam_id=in.('+eids+')&select=student_id,exam_id,subject_id,score')||[];
  }
  const marks={};marksRows.forEach(m=>{if(!marks[m.student_id])marks[m.student_id]={};if(!marks[m.student_id][m.exam_id])marks[m.student_id][m.exam_id]={};marks[m.student_id][m.exam_id][m.subject_id]=Number(m.score);});
  window._reportData={students,subjects,exams,marks,classObj};

  let subjInfo='';
  if(subjects.length){
    subjInfo='<div class="alert-item info" style="margin-top:12px;cursor:default"><span class="ico">📚</span><div class="txt"><b>'+esc(classObj?.name||'')+' subjects ('+subjects.length+')</b><span>'+subjects.map(s=>'<span class="mini-stat" style="background:#e0e9f5;font-size:11px">'+esc(s.name)+'</span>').join('')+'</span></div></div>';
  }else{
    subjInfo='<div class="alert-item danger" style="margin-top:12px;cursor:default"><span class="ico">⚠️</span><div class="txt"><b>No subjects assigned to this class</b><span>Go to Subjects tab to add them</span></div></div>';
  }

  let body='';
  if(students.length===0){
    body='<div class="card empty">No pupils in '+esc(classObj?.name||'')+'.</div>';
  }else{
    let pupilOpts='';
    students.forEach(s=>{pupilOpts+='<option value="'+s.id+'">'+esc(s.admission_no)+' — '+esc(s.first_name+' '+(s.last_name||''))+'</option>';});
    let allCards='';
    students.forEach(s=>{allCards+=reportCardBlock(s,subjects,exams,marks,false);});
    body=
    '<div class="card no-print"><label>View Single Pupil</label><select onchange="showSingleReport(this.value)"><option value="">— Choose —</option>'+pupilOpts+'</select></div>'+
    '<div id="singleReport"></div>'+
    '<div class="card no-print"><h3>📊 Class Ranking</h3>'+rankingTable(students,subjects,exams,marks)+'</div>'+
    '<div class="no-print"><h3 style="padding:0 4px">All Report Cards ('+students.length+')</h3>'+allCards+'</div>';
  }

  const classOpts=classes.map(c=>'<option value="'+c.id+'"'+(_repClass===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('');

  root.innerHTML=
  '<div class="page-head"><h1>📄 Report Cards</h1><div class="sub">'+getCurrentYear()+' Term '+getCurrentTerm()+'</div></div>'+
  '<div class="card no-print"><div class="grid grid-2">'+
  '<div><label>Class</label><select onchange="_repClass=this.value;_repPupil=\'\';pageReports(document.getElementById(\'main\'))">'+classOpts+'</select></div>'+
  '<div><label>Exam Stage</label><select onchange="_repStage=parseInt(this.value);pageReports(document.getElementById(\'main\'))"><option value="1"'+(_repStage===1?' selected':'')+'>Beginning of Term</option><option value="2"'+(_repStage===2?' selected':'')+'>Mid Term</option><option value="3"'+(_repStage===3?' selected':'')+'>End of Term</option></select></div>'+
  '</div>'+subjInfo+
  '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn" onclick="printAllReports()">🖨️ Print All</button><button class="btn ghost" onclick="printBroadsheet()">📊 Broadsheet</button><button class="btn ghost" onclick="exportReportExcel()">📥 Excel</button></div>'+
  '</div>'+
  body;
}
window.renderReportsInner=renderReportsInner;

function showSingleReport(id){
  _repPupil=id;
  const c=document.getElementById('singleReport');
  if(!id){c.innerHTML='';return;}
  const d=window._reportData;const s=d.students.find(x=>x.id===id);
  if(!s){c.innerHTML='';return;}
  c.innerHTML=reportCardBlock(s,d.subjects,d.exams,d.marks,true);
  setTimeout(()=>{const el=document.getElementById('singleReport');if(el)el.scrollIntoView({behavior:'smooth'});},100);
}
window.showSingleReport=showSingleReport;

function reportCardBlock(s,subjects,exams,marks,isSingle){
  const html=buildReportCardHTML(s,subjects,exams,marks,window._reportData.students);
  let head;
  if(isSingle){
    head='<div class="no-print" style="display:flex;justify-content:space-between;padding:8px 12px;background:#0a2540;color:#fff;border-radius:8px 8px 0 0"><b>📄 '+esc(s.first_name+' '+(s.last_name||''))+'</b><button class="btn sm gold" onclick="printOneReport(\''+s.id+'\')">🖨️ Print</button></div>';
  }else{
    head='<div class="no-print" style="display:flex;justify-content:space-between;padding:8px 12px;background:#f1f5f9;border-radius:8px 8px 0 0"><b>'+esc(s.first_name+' '+(s.last_name||''))+' — '+esc(s.admission_no)+'</b><button class="btn sm" onclick="printOneReport(\''+s.id+'\')">🖨️ Print</button></div>';
  }
  return '<div style="margin-bottom:16px">'+head+'<div style="background:#fff;padding:20px;border:1px solid #e2e8f0;border-radius:0 0 12px 12px">'+html+'</div></div>';
}

function buildReportCardHTML(s,subjects,exams,marks,students){
  const cls=(_classesCache||[]).find(c=>c.id===s.class_id);
  const per=marks[s.id]||{};
  const graded=subjects.filter(x=>x.graded!==false);
  const stageLabel={1:'Beginning of Term',2:'Mid Term',3:'End of Term'}[_repStage];
  let grand=0,cnt=0;

  let rows='';
  subjects.forEach((sj,i)=>{
    const scores=exams.map(e=>{const v=per[e.id]?.[sj.subject_id];return v!=null&&!isNaN(v)?Number(v):null;});
    const isG=sj.graded!==false;
    if(isG)scores.forEach(v=>{if(v!=null){grand+=v;cnt++;}});
    const valid=scores.filter(v=>v!=null);
    const sub=valid.reduce((a,b)=>a+b,0);
    const sAvg=valid.length?sub/valid.length:0;
    const sg=gradeOf(sAvg);
    let scoreCells='';
    scores.forEach(v=>{scoreCells+='<td style="text-align:center;padding:6px 8px;border:1px solid #e2e8f0">'+(v!=null?v.toFixed(0):'—')+'</td>';});
    rows+='<tr><td style="padding:6px 8px;border:1px solid #e2e8f0;text-align:center">'+(i+1)+'</td>'+
      '<td style="padding:6px 8px;border:1px solid #e2e8f0;text-align:left;font-weight:600">'+esc(sj.name)+(isG?'':' <span style="font-size:9px;color:#94a3b8">(na)</span>')+'</td>'+
      scoreCells+
      '<td style="padding:6px 8px;border:1px solid #e2e8f0;text-align:center;font-weight:600">'+(valid.length?sub.toFixed(0):'—')+'</td>'+
      '<td style="padding:6px 8px;border:1px solid #e2e8f0;text-align:center"><b>'+(isG?sg.g:'—')+'</b></td>'+
      '<td style="padding:6px 8px;border:1px solid #e2e8f0;font-size:10.5px">'+(isG?sg.r:'Not graded')+'</td></tr>';
  });

  const avg=cnt?grand/cnt:0;
  const g=gradeOf(avg);

  const ranked=students.map(st=>{
    const m=marks[st.id]||{};
    let t=0,c=0;
    exams.forEach(e=>graded.forEach(sj=>{const v=m[e.id]?.[sj.subject_id];if(v!=null&&!isNaN(v)){t+=Number(v);c++;}}));
    return{id:st.id,avg:c?t/c:0,cnt:c};
  }).filter(x=>x.cnt>0).sort((a,b)=>b.avg-a.avg);
  ranked.forEach((r,i)=>r.pos=i+1);
  for(let i=1;i<ranked.length;i++)if(ranked[i].avg===ranked[i-1].avg)ranked[i].pos=ranked[i-1].pos;
  const myPos=(ranked.find(r=>r.id===s.id)||{}).pos||0;

  let examHeaders='';
  exams.forEach(e=>{examHeaders+='<th style="background:#0a2540;color:#fff;padding:8px 6px;font-size:10.5px;text-transform:uppercase;text-align:center;border:1px solid #0a2540">'+esc(e.name)+'</th>';});

  let footCells='';
  exams.forEach(e=>{
    const et=graded.reduce((a,sj)=>a+(per[e.id]?.[sj.subject_id]||0),0);
    const any=graded.some(sj=>per[e.id]?.[sj.subject_id]!=null);
    footCells+='<td style="background:#f1f5f9;font-weight:700;padding:8px 6px;text-align:center;border-top:2px solid #0a2540">'+(any?et.toFixed(0):'—')+'</td>';
  });

  const logoImg=_school?.logo_url?('<img src="'+esc(_school.logo_url)+'" style="width:60px;height:60px;object-fit:contain;margin-bottom:6px">'):'';
  const schoolName=esc(_school?.name||'');
  const schoolMeta=esc(_school?.address||'')+' · '+esc(_school?.telephone||'');
  const dateStr=new Date().toLocaleDateString('en-GB');

  return '<div style="text-align:center;padding-bottom:14px;border-bottom:2px solid #0a2540;margin-bottom:14px">'+logoImg+
    '<h1 style="font-size:18px;margin:0 0 4px;text-transform:uppercase;color:#0a2540">'+schoolName+'</h1>'+
    '<div style="font-size:11.5px;color:#666">'+schoolMeta+'</div>'+
    '<h2 style="font-size:14px;margin:10px 0 4px;color:#0a2540;text-transform:uppercase">'+esc(stageLabel)+' Report Card — '+getCurrentYear()+' Term '+getCurrentTerm()+'</h2></div>'+
    '<table style="width:100%;border-collapse:collapse;margin:10px 0;font-size:12px">'+
    '<tr><td style="padding:6px 10px;border:1px solid #e2e8f0"><b>Name:</b> '+esc(s.first_name+' '+(s.last_name||''))+'</td>'+
    '<td style="padding:6px 10px;border:1px solid #e2e8f0"><b>Adm:</b> '+esc(s.admission_no)+'</td>'+
    '<td style="padding:6px 10px;border:1px solid #e2e8f0"><b>LIN:</b> '+esc(s.lin||'—')+'</td></tr>'+
    '<tr><td style="padding:6px 10px;border:1px solid #e2e8f0"><b>Class:</b> '+esc(cls?.name||'')+'</td>'+
    '<td style="padding:6px 10px;border:1px solid #e2e8f0"><b>Year:</b> '+getCurrentYear()+'</td>'+
    '<td style="padding:6px 10px;border:1px solid #e2e8f0"><b>Term:</b> '+getCurrentTerm()+'</td></tr></table>'+
    '<table style="width:100%;border-collapse:collapse;margin:12px 0;font-size:12px">'+
    '<thead><tr><th style="background:#0a2540;color:#fff;padding:8px 6px;font-size:10.5px;text-transform:uppercase;border:1px solid #0a2540;width:30px">#</th>'+
    '<th style="background:#0a2540;color:#fff;padding:8px 6px;font-size:10.5px;text-transform:uppercase;border:1px solid #0a2540;text-align:left">Subject</th>'+
    examHeaders+
    '<th style="background:#0a2540;color:#fff;padding:8px 6px;font-size:10.5px;text-transform:uppercase;border:1px solid #0a2540;text-align:center">Total</th>'+
    '<th style="background:#0a2540;color:#fff;padding:8px 6px;font-size:10.5px;text-transform:uppercase;border:1px solid #0a2540;text-align:center">Grade</th>'+
    '<th style="background:#0a2540;color:#fff;padding:8px 6px;font-size:10.5px;text-transform:uppercase;border:1px solid #0a2540;text-align:center">Remark</th></tr></thead>'+
    '<tbody>'+rows+'</tbody>'+
    '<tfoot><tr><td colspan="2" style="background:#f1f5f9;font-weight:700;padding:8px 6px;text-align:left;border-top:2px solid #0a2540">GRAND TOTAL</td>'+
    footCells+
    '<td style="background:#f1f5f9;font-weight:700;padding:8px 6px;text-align:center;border-top:2px solid #0a2540">'+grand.toFixed(0)+'</td>'+
    '<td style="background:#f1f5f9;font-weight:700;padding:8px 6px;text-align:center;border-top:2px solid #0a2540">'+g.g+'</td>'+
    '<td style="background:#f1f5f9;padding:8px 6px;border-top:2px solid #0a2540"></td></tr></tfoot></table>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;padding:12px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0">'+
    '<div><b style="font-size:10px;color:#666;text-transform:uppercase">Total Marks</b><div style="font-size:14px;font-weight:700">'+grand.toFixed(0)+'</div></div>'+
    '<div><b style="font-size:10px;color:#666;text-transform:uppercase">Average</b><div style="font-size:14px;font-weight:700">'+avg.toFixed(1)+'%</div></div></div>'+
    '<div style="margin-top:14px;padding:10px 16px;background:#0a2540;color:#fff;border-radius:10px;display:flex;justify-content:space-between;align-items:center">'+
    '<span style="font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.85">Position in Class</span>'+
    '<span style="font-size:20px;font-weight:800;color:#d4a017">'+posLabel(myPos)+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;gap:12px;margin-top:18px;font-size:11px;flex-wrap:wrap">'+
    '<div style="flex:1;min-width:150px;padding-top:22px;border-top:1px solid #999;text-align:center;color:#666">Class Teacher</div>'+
    '<div style="flex:1;min-width:150px;padding-top:22px;border-top:1px solid #999;text-align:center;color:#666">Head Teacher</div>'+
    '<div style="flex:1;min-width:150px;padding-top:22px;border-top:1px solid #999;text-align:center;color:#666">Date: '+dateStr+'</div></div>';
}
window.buildReportCardHTML=buildReportCardHTML;

function rankingTable(students,subjects,exams,marks){
  const graded=subjects.filter(x=>x.graded!==false);
  const rows=students.map(s=>{
    const m=marks[s.id]||{};
    let t=0,c=0;
    exams.forEach(e=>graded.forEach(sj=>{const v=m[e.id]?.[sj.subject_id];if(v!=null&&!isNaN(v)){t+=Number(v);c++;}}));
    return{s,total:t,avg:c?t/c:0,cnt:c};
  });
  rows.sort((a,b)=>b.avg-a.avg);
  rows.forEach((r,i)=>r.pos=i+1);
  for(let i=1;i<rows.length;i++)if(rows[i].avg===rows[i-1].avg)rows[i].pos=rows[i-1].pos;
  let body='';
  rows.forEach(r=>{
    const g=gradeOf(r.avg);
    body+='<tr><td><b>'+posLabel(r.pos)+'</b></td><td>'+esc(r.s.admission_no)+'</td><td>'+esc(r.s.first_name+' '+(r.s.last_name||''))+'</td><td style="text-align:right">'+r.total.toFixed(0)+'</td><td><span class="badge '+g.cls+'">'+g.g+'</span></td><td><button class="btn sm ghost" onclick="showSingleReport(\''+r.s.id+'\')">View</button></td></tr>';
  });
  return '<div class="table-wrap"><table><thead><tr><th>Pos</th><th>Adm</th><th>Name</th><th style="text-align:right">Total</th><th>Grade</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
window.rankingTable=rankingTable;

function printOneReport(id){
  const d=window._reportData;const s=d.students.find(x=>x.id===id);
  if(!s){toast('Not found','bad');return;}
  printHTML('Report — '+s.first_name,'<div style="page-break-inside:avoid">'+buildReportCardHTML(s,d.subjects,d.exams,d.marks,d.students)+'</div>');
}
window.printOneReport=printOneReport;

function printAllReports(){
  const d=window._reportData;
  if(!d.students.length){toast('No pupils','bad');return;}
  let pages='';
  d.students.forEach((s,i)=>{
    pages+='<div style="page-break-inside:avoid;'+(i<d.students.length-1?'page-break-after:always':'')+'">'+buildReportCardHTML(s,d.subjects,d.exams,d.marks,d.students)+'</div>';
  });
  printHTML('All Report Cards',pages);
}
window.printAllReports=printAllReports;

function printBroadsheet(){
  const d=window._reportData;
  const graded=d.subjects.filter(x=>x.graded!==false);
  const ranked=d.students.map(s=>{
    const m=d.marks[s.id]||{};
    let t=0,c=0;
    d.exams.forEach(e=>graded.forEach(sj=>{const v=m[e.id]?.[sj.subject_id];if(v!=null&&!isNaN(v)){t+=Number(v);c++;}}));
    return{s,total:t,avg:c?t/c:0};
  }).sort((a,b)=>b.avg-a.avg);
  ranked.forEach((r,i)=>r.pos=i+1);
  for(let i=1;i<ranked.length;i++)if(ranked[i].avg===ranked[i-1].avg)ranked[i].pos=ranked[i-1].pos;

  let head='<tr><th rowspan="2">Pos</th><th rowspan="2">Adm</th><th rowspan="2">Name</th>';
  d.exams.forEach(e=>{head+='<th colspan="'+(d.subjects.length+1)+'">'+esc(e.name)+'</th>';});
  head+='<th rowspan="2">Total</th><th rowspan="2">Grade</th></tr><tr>';
  d.exams.forEach(()=>{
    d.subjects.forEach(sj=>{head+='<th>'+esc(sj.code)+'</th>';});
    head+='<th style="background:#d4a017">TOT</th>';
  });
  head+='</tr>';

  let body='';
  ranked.forEach(r=>{
    const m=d.marks[r.s.id]||{};
    let total=0,c=0;
    let cells='<td><b>'+posLabel(r.pos)+'</b></td><td>'+esc(r.s.admission_no)+'</td><td style="text-align:left">'+esc(r.s.first_name+' '+(r.s.last_name||''))+'</td>';
    d.exams.forEach(e=>{
      let et=0,any=false;
      d.subjects.forEach(sj=>{
        const v=m[e.id]?.[sj.subject_id];
        if(v!=null&&!isNaN(v)){et+=Number(v);any=true;if(sj.graded!==false){total+=Number(v);c++;}}
        cells+='<td>'+(v!=null?v.toFixed(0):'—')+'</td>';
      });
      cells+='<td style="background:#fff7e6;font-weight:700">'+(any?et.toFixed(0):'—')+'</td>';
    });
    const g=gradeOf(c?total/c:0);
    cells+='<td style="font-weight:700">'+total.toFixed(0)+'</td><td><b>'+g.g+'</b></td>';
    body+='<tr>'+cells+'</tr>';
  });

  printHTML('Broadsheet','<div style="text-align:center"><h1>'+esc(_school?.name||'')+'</h1><div style="font-size:11px;color:#666">'+esc(_school?.address||'')+'</div><h2 style="font-size:14px;color:#0a2540">BROADSHEET — '+esc(d.classObj?.name||'')+' — '+getCurrentYear()+' Term '+getCurrentTerm()+'</h2></div><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table>');
}

function exportReportExcel(){
  const d=window._reportData;
  if(!d.students.length){toast('No pupils','bad');return;}
  const rows=d.students.map(s=>{
    const m=d.marks[s.id]||{};
    const row={Adm:s.admission_no,Name:s.first_name+' '+(s.last_name||'')};
    let total=0,c=0;
    d.exams.forEach(e=>{
      d.subjects.forEach(sj=>{
        const v=m[e.id]?.[sj.subject_id];
        row[e.name+' - '+sj.code]=v!=null?Number(v):'';
        if(v!=null&&!isNaN(v)&&sj.graded!==false){total+=Number(v);c++;}
      });
    });
    row.Total=total;row.Grade=gradeOf(c?total/c:0).g;
    return row;
  });
  const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Marks');
  XLSX.writeFile(wb,'ReportSheet_'+getCurrentYear()+'_T'+getCurrentTerm()+'.xlsx');
  toast('Exported','ok');
}

async function saveSubject(){
  const code=document.getElementById('s_code').value.trim().toUpperCase();
  const name=document.getElementById('s_name').value.trim();
  const graded=document.getElementById('s_graded').value==='true';
  if(!code||!name){toast('Fill code and name','bad');return;}
  try{
    // 1. Find or create subject in master list
    let subjectId=null;
    const existing=await rest('/rest/v1/subjects?school_id=eq.'+_schoolId+'&code=eq.'+encodeURIComponent(code)+'&select=id');
    if(existing&&existing.length){subjectId=existing[0].id;}
    else{
      const created=await rest('/rest/v1/subjects',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({school_id:_schoolId,code,name,is_compulsory:graded})});
      subjectId=(created&&created[0])?created[0].id:null;
    }
    if(!subjectId){toast('Failed to create subject','bad');return;}
    // 2. Link subject to class
    await rest('/rest/v1/class_subjects',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,class_id:_subjClass,subject_id:subjectId})});
    toast('Added','ok');closeModal();nav('subjects');
  }catch(e){toast(e.message,'bad');}
}

async function pageDebtors(root){
  clearClassesCache();
  const students=await rest('/rest/v1/students?school_id=eq.'+_schoolId+'&status=eq.active&select=*');
  const classes=await loadClasses();
  const classesById={};classes.forEach(c=>classesById[c.id]=c);

    const charged=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.holiday_fee)||0)+(Number(s.academics_fee)||0)+(Number(s.functional_fee)||0)+(Number(s.transport_fee)||0);

  window._allStudents=debtors.map(d=>d.s);

  debtors.forEach(d=>{

  const cy=getCurrentYear(),ct=getCurrentTerm();
  const rows=await rest('/rest/v1/expenses?school_id=eq.'+_schoolId+'&academic_year=eq.'+cy+'&term=eq.'+ct+'&select=*&order=spent_at.desc')||[];
  const total=rows.reduce((s,x)=>s+Number(x.amount),0);
  let body='';
  rows.forEach(e=>{
    body+='<tr><td>'+fmtDate(e.spent_at)+'</td><td>'+esc(e.description)+'</td><td>'+esc(e.category||'')+'</td><td style="text-align:right;font-weight:700;color:#b91c1c">'+fmtUGX(e.amount)+'</td></tr>';
  });
  root.innerHTML=
  '<div class="page-head"><div><h1>💸 Expenses</h1><div class="sub">'+cy+' Term '+ct+' · '+fmtUGX(total)+'</div></div><button class="btn" onclick="addExpense()">＋ Add Expense</button></div>'+
  '<div class="card"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right">Amount</th></tr></thead><tbody>'+body+'</tbody></table></div></div>';
}
window.pageExpenses=pageExpenses;

function addExpense(){
  modal('<h3>Add Expense</h3>'+
    '<div><label>Description *</label><input id="x_d"></div>'+
    '<div style="margin-top:12px"><label>Amount *</label><input id="x_a" type="number"></div>'+
    '<div style="margin-top:12px"><label>Category</label><input id="x_c" placeholder="Utilities"></div>'+
    '<div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveExpense()">Save</button></div>');
}
window.addExpense=addExpense;

async function saveExpense(){
  const description=document.getElementById('x_d').value.trim();
  const amount=Number(document.getElementById('x_a').value);
  const category=document.getElementById('x_c').value.trim();
  if(!description||!amount){toast('Fill required','bad');return;}
  try{await rest('/rest/v1/expenses',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,description,amount,category,academic_year:getCurrentYear(),term:getCurrentTerm()})});toast('Saved','ok');closeModal();nav('expenses');}
  catch(e){toast(e.message,'bad');}
}
window.saveExpense=saveExpense;

/* ============================================================
   MESSAGES
   ============================================================ */
async function pageMessages(root){
  const msgs=await rest('/rest/v1/messages?school_id=eq.'+_schoolId+'&select=*&order=sent_at.desc&limit=100')||[];
  let rows='';
  msgs.forEach(m=>{
    rows+='<tr><td>'+fmtDate(m.sent_at)+'</td><td>'+esc(m.parent_contact||'—')+'</td><td>'+esc(m.body)+'</td></tr>';
  });
  root.innerHTML=
  '<div class="page-head"><h1>💬 Messages</h1><div class="sub">'+msgs.length+' messages</div></div>'+
  '<div class="card"><button class="btn" onclick="addMessage()">＋ New Message</button></div>'+
  '<div class="card"><div class="table-wrap"><table><thead><tr><th>Date</th><th>To</th><th>Body</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
window.pageMessages=pageMessages;

function addMessage(){
  modal('<h3>New Message</h3>'+
    '<div><label>Parent Contact</label><input id="m_c" placeholder="+256..."></div>'+
    '<div style="margin-top:12px"><label>Body</label><textarea id="m_b" rows="4"></textarea></div>'+
    '<div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveMessage()">Save</button></div>');
}
window.addMessage=addMessage;

async function saveMessage(){
  const parent_contact=document.getElementById('m_c').value.trim();
  const body=document.getElementById('m_b').value.trim();
  if(!body){toast('Enter body','bad');return;}
  try{await rest('/rest/v1/messages',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,parent_contact,body})});toast('Saved','ok');closeModal();nav('messages');}
  catch(e){toast(e.message,'bad');}
}
window.saveMessage=saveMessage;

/* ============================================================
   SETTINGS
   ============================================================ */
async function pageSettings(root){
  root.innerHTML=
  '<div class="page-head"><h1>⚙️ Settings</h1><div class="sub">School information</div></div>'+
  '<div class="card"><h3>School Info</h3>'+
  '<div class="grid grid-2"><div><label>Name</label><input id="s_name" value="'+esc(_school?.name||'')+'"></div><div><label>Telephone</label><input id="s_phone" value="'+esc(_school?.telephone||'')+'"></div>'+
  '<div><label>Address</label><input id="s_addr" value="'+esc(_school?.address||'')+'"></div><div><label>Head Teacher</label><input id="s_head" value="'+esc(_school?.head_teacher||'')+'"></div></div>'+
  '<div style="margin-top:12px"><label>Logo URL</label><input id="s_logo" value="'+esc(_school?.logo_url||'')+'"></div>'+
  '<button class="btn" style="margin-top:14px" onclick="saveSchool()">💾 Save</button></div>'+
  '<div class="card"><h3>Account</h3><div class="muted">Signed in as <b>'+esc(_profile?.full_name||'')+'</b> ('+esc(_profile?.email||'')+')</div>'+
  '<div class="muted" style="margin-top:6px">Role: <b>'+esc(_role||'')+'</b></div>'+
  '<button class="btn danger" style="margin-top:12px" onclick="doLogout()">Sign Out</button></div>';
}
window.pageSettings=pageSettings;

async function saveSchool(){
  const body={
    name:document.getElementById('s_name').value.trim(),
    telephone:document.getElementById('s_phone').value.trim(),
    address:document.getElementById('s_addr').value.trim(),
    head_teacher:document.getElementById('s_head').value.trim(),
    logo_url:document.getElementById('s_logo').value.trim()
  };
  try{await rest('/rest/v1/schools?id=eq.'+_schoolId,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});_school=Object.assign(_school,body);renderHeader();toast('Saved','ok');}
  catch(e){toast(e.message,'bad');}
}
window.saveSchool=saveSchool;

/* ============================================================
   INIT
   ============================================================ */
if(getUser()&&getToken()){boot();}
</script>
</body>
</html>
