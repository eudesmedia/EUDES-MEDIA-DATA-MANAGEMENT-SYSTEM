<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:'Inter',system-ui,sans-serif;background:#eef2f7;color:#0a2540;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid #e2e8f0;background:#fff;color:#0a2540;font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#0a2540;box-shadow:0 0 0 4px rgba(10,37,64,.1)}
label{display:block;font-size:12.5px;color:#334155;margin-bottom:6px;font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #eef1f6;font-size:13px}
th{color:#fff;font-weight:600;font-size:11px;text-transform:uppercase;background:#0a2540}
tbody tr:hover{background:#f9fafb}
h1{font-size:20px;font-weight:700;margin:0 0 4px;color:#0a2540}
h3{font-size:15px;font-weight:700;margin:0 0 12px;color:#0a2540}
.muted{color:#64748b;font-size:12.5px}
.topbar{position:fixed;top:0;left:0;right:0;height:48px;background:#0a2540;color:#fff;display:flex;align-items:center;padding:0 12px;z-index:100;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar .title{flex:1;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.topbar .icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:16px}
.topbar .icon-btn:hover{background:rgba(255,255,255,.1)}
#app{min-height:100vh;padding-top:48px;padding-bottom:90px;display:none}
.container{max-width:1100px;margin:0 auto;padding:0 12px}
.header-wrap{padding:12px}
.header-card{background:linear-gradient(135deg,#0a2540,#1e3a5c);color:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 24px -8px rgba(10,37,64,.4)}
.header-top{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px}
.admin-chip{background:rgba(255,255,255,.15);color:#fff;font-size:10.5px;font-weight:700;padding:4px 12px;border-radius:999px;text-transform:uppercase;border:1px solid rgba(255,255,255,.2)}
.exit-chip{background:#dc2626;color:#fff;font-size:10.5px;font-weight:700;padding:4px 12px;border-radius:999px;text-transform:uppercase;cursor:pointer}
.header-school{display:flex;align-items:flex-start;gap:10px;font-size:16px;font-weight:800;margin-bottom:8px;text-transform:uppercase}
.header-school .logo{width:44px;height:44px;border-radius:10px;background:#d4a017;display:grid;place-items:center;font-size:20px;flex-shrink:0;color:#0a2540;overflow:hidden}
.header-school .logo img{width:100%;height:100%;object-fit:cover}
.header-meta{font-size:12.5px;color:#cbd5e1;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.header-meta .sep{opacity:.5}
.header-periods{display:flex;gap:8px;flex-wrap:wrap}
.header-period{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;color:#fff}
.header-period select{background:transparent;color:#fff;border:none;padding:0 4px;font-size:12px;font-weight:700;width:auto;cursor:pointer}
.header-period select option{color:#0a2540}
.nav-pills{display:flex;gap:8px;padding:12px 0 4px;overflow-x:auto;scrollbar-width:none}
.nav-pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;background:#fff;color:#0a2540;font-size:12.5px;font-weight:600;border:1.5px solid #e2e8f0;white-space:nowrap;cursor:pointer}
.pill.active{background:#0a2540;color:#fff;border-color:#0a2540;font-weight:700}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.page-head .sub{color:#64748b;font-size:13px;margin-top:3px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.04);margin-bottom:14px}
.grid{display:grid;gap:12px}
.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
@media(max-width:640px){.grid-2,.grid-3{grid-template-columns:1fr}.grid-kpi{grid-template-columns:1fr 1fr}}
.kpi{background:#fff;border-radius:14px;padding:18px 14px;box-shadow:0 2px 8px rgba(15,23,42,.05);border-top:3px solid #d4a017;text-align:center}
.kpi .v{font-size:22px;font-weight:800;color:#0a2540;line-height:1.15;word-break:break-word}
.kpi .l{color:#64748b;font-size:11.5px;margin-top:6px;font-weight:500}
.kpi.kpi-ok{border-top-color:#059669}.kpi.kpi-ok .v{color:#065f46}
.kpi.kpi-bad{border-top-color:#dc2626}.kpi.kpi-bad .v{color:#7f1d1d}
.kpi.kpi-warn{border-top-color:#d97706}.kpi.kpi-warn .v{color:#78350f}
.kpi.kpi-navy{border-top-color:#0a2540}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.badge.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.badge.bad{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.badge.info{background:#e0e9f5;color:#0a2540;border:1px solid #c7d2fe}
.badge.warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.btn{background:#0a2540;color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:#1e3a5c}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;border:1.5px solid #e2e8f0;color:#0a2540}
.btn.danger{background:#dc2626}
.btn.ok{background:#059669}
.btn.gold{background:#d4a017}
.btn.wa{background:#25D366;color:#fff}
.btn.sm{padding:6px 12px;font-size:11.5px;border-radius:999px}
.btn.block{width:100%}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid #e2e8f0;background:#fff;margin-bottom:6px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#0a2540;color:#fff;padding:12px 20px;border-radius:999px;z-index:1000;font-size:13px;font-weight:500;box-shadow:0 20px 40px -12px rgba(10,37,64,.5);max-width:90vw;text-align:center}
.toast.bad{background:#7f1d1d}.toast.ok{background:#065f46}
.auth-bg{position:fixed;inset:0;background:linear-gradient(135deg,#0a2540,#2c5282);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;overflow:auto}
.auth-card{background:#fff;border-radius:20px;padding:30px 26px;width:100%;max-width:440px;box-shadow:0 40px 80px -20px rgba(0,0,0,.5);margin:auto}
.auth-card .logo{width:66px;height:66px;border-radius:16px;background:linear-gradient(135deg,#0a2540,#2c5282);display:grid;place-items:center;color:#d4a017;font-weight:800;font-size:26px;margin:0 auto 14px;overflow:hidden}
.auth-card .logo img{width:100%;height:100%;object-fit:cover}
.auth-card h1{text-align:center;font-size:19px;margin:0 0 6px}
.auth-card .sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:22px}
.err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:11px 14px;border-radius:10px;margin-top:14px;font-size:13px}
.loading{padding:60px;text-align:center;color:#64748b}
.empty{text-align:center;padding:40px 20px;color:#64748b}
.error-box{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:14px;border-radius:10px;margin:14px 0;font-size:13px;font-family:monospace;word-break:break-word}
.modal-bg{position:fixed;inset:0;background:rgba(10,37,64,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
@media(min-width:640px){.modal-bg{align-items:center;padding:16px}}
.modal{background:#fff;border-radius:20px 20px 0 0;max-width:680px;width:100%;max-height:92vh;overflow:auto;padding:22px}
@media(min-width:640px){.modal{border-radius:20px}}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid #eef1f6;flex-wrap:wrap}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:90;box-shadow:0 -4px 16px rgba(10,37,64,.08)}
.bottom-bar-inner{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:1100px;margin:0 auto}
.bottom-bar-inner::-webkit-scrollbar{display:none}
.bottom-bar .pill{background:#0a2540;color:#fff;border-color:#0a2540;padding:9px 14px;font-size:12px}
.bottom-bar .pill.active{background:#d4a017;border-color:#d4a017;color:#fff}
.mini-stat{display:inline-block;padding:6px 12px;background:#f1f5f9;border-radius:8px;font-size:12px;font-weight:600;color:#0a2540;margin:2px 4px 2px 0}
.alert-item{display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;background:#fff;border-left:4px solid #d4a017;margin-bottom:8px;font-size:13px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.alert-item.danger{border-left-color:#dc2626}
.alert-item.ok{border-left-color:#059669}
.alert-item.info{border-left-color:#2c5282}
.alert-item .ico{font-size:20px}
.alert-item .txt{flex:1}
.alert-item .txt b{display:block;color:#0a2540}
.alert-item .txt span{color:#64748b;font-size:12px;display:block}
.tabs-bar{display:flex;gap:6px;overflow-x:auto;padding:4px 0;border-bottom:2px solid #e2e8f0;margin-bottom:14px;scrollbar-width:none}
.tabs-bar::-webkit-scrollbar{display:none}
.tabs-bar button{flex:0 0 auto;padding:9px 14px;font-size:12.5px;font-weight:600;color:#64748b;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs-bar button.active{color:#0a2540;border-bottom-color:#d4a017}
.marks-input{width:70px;padding:6px;text-align:center;border:2px solid #e2e8f0;border-radius:8px;font-weight:700}
</style>
</head>
<body>

<div class="auth-bg" id="authScreen">
  <div class="auth-card">
    <div class="logo" id="authLogo">P</div>
    <h1>Progressive Mothers School</h1>
    <div class="sub">Powered by Eudes Media</div>
    <div id="loginForm">
      <div><label>Email</label><input id="loginEmail" type="email" placeholder="you@example.com"></div>
      <div style="margin-top:12px"><label>Password</label><input id="loginPass" type="password" placeholder="••••••••"></div>
      <div id="loginErr" class="err" style="display:none"></div>
      <button class="btn block" id="loginBtn" style="padding:13px;margin-top:18px" onclick="doLogin()">Sign In</button>
    </div>
  </div>
</div>

<div id="app">
  <div class="topbar no-print">
    <button class="icon-btn" onclick="doLogout()">⎋</button>
    <div class="title" id="topbarTitle">SCHOOL</div>
    <button class="icon-btn" onclick="nav('settings')">⚙️</button>
  </div>
  <div class="header-wrap">
    <div class="header-card">
      <div class="header-top">
        <span class="admin-chip" id="roleChip">ADMIN</span>
        <button class="exit-chip" onclick="doLogout()">Exit</button>
      </div>
      <div class="header-school">
        <div class="logo" id="headerLogo">🏛️</div>
        <div class="name" id="headerSchoolName">SCHOOL NAME</div>
      </div>
      <div class="header-meta" id="headerMeta">—</div>
      <div class="header-periods">
        <span class="header-period">📅 <select id="termYearSelect" onchange="changePeriod()"></select></span>
        <span class="header-period">📆 <select id="termTermSelect" onchange="changePeriod()"><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select></span>
      </div>
    </div>
  </div>
  <div class="container">
    <div class="nav-pills" id="nav"></div>
    <main id="main"></main>
  </div>
  <div class="bottom-bar"><div class="bottom-bar-inner" id="bottomBar"></div></div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ============================================================
   Progressive Mothers School Management — Fresh v1
   ============================================================ */

/* CONFIG — ⚠️ REPLACE KEY */
var SUPA_URL='https://wabeempxckdtjvrkzhpv.supabase.co';
var SUPA_KEY='sb_publishable_n0uAm0Gcq7qR2dJM4jMZGQ_wiV__Cfp';

/* ---------- STORAGE (safe for sandbox) ---------- */
var _mem={};
function lsGet(k){try{if(typeof localStorage!=='undefined'&&localStorage)return localStorage.getItem(k);}catch(e){}return _mem[k]!==undefined?_mem[k]:null;}
function lsSet(k,v){try{if(typeof localStorage!=='undefined'&&localStorage){localStorage.setItem(k,v);return;}}catch(e){}_mem[k]=String(v);}
function lsDel(k){try{if(typeof localStorage!=='undefined'&&localStorage){localStorage.removeItem(k);return;}}catch(e){}delete _mem[k];}

/* ---------- GLOBAL STATE ---------- */
var SESSION=null;      /* {access_token,user} */
var PROFILE=null;      /* profiles row */
var SCHOOL=null;       /* schools row */
var SCHOOL_ID=null;
var ROLE=null;
var CYEAR=null;        /* current year */
var CTERM=null;        /* current term */
var CLASSES_CACHE=null;
var EXAMS_CACHE=null;
var STUDENTS_CACHE=[];
var STUDENT_PASSES_CACHE=[];
var _marksClass=null,_marksExam=null;
var _subjClass=null;
var _profileStudentId=null,_profileTab='overview';
var _lastFilteredStudents=[];
var _lastFilteredPO=[];
var _passOutLookup={};
var activeRoute='dashboard';

/* ---------- HELPERS ---------- */
function toast(msg,type){var el=document.createElement('div');el.className='toast'+(type==='bad'?' bad':(type==='ok'?' ok':''));el.textContent=msg;document.getElementById('toastRoot').appendChild(el);setTimeout(function(){el.remove();},3500);}
function modal(html){var r=document.getElementById('modalRoot');r.innerHTML='<div class="modal-bg"><div class="modal">'+html+'</div></div>';r.querySelector('.modal-bg').addEventListener('click',function(e){if(e.target.classList.contains('modal-bg'))closeModal();});}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtUGX(n){if(n==null||isNaN(n))return 'UGX 0';return 'UGX '+(Number(n)||0).toLocaleString();}
function fmtNum(n){if(n==null||isNaN(n))return '0';return (Number(n)||0).toLocaleString();}
function fmtDate(ts){if(!ts)return '—';var d=new Date(ts);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function fmtDateTime(ts){if(!ts)return '—';var d=new Date(ts);return fmtDate(ts)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function telLink(num){if(!num)return '';return String(num).replace(/[^0-9+]/g,'');}
function waLink(num){if(!num)return '';var c=String(num).replace(/[^0-9]/g,'');if(c.startsWith('0'))c='256'+c.slice(1);return c;}
function genderLabel(g){return g==='M'?'Male':(g==='F'?'Female':'—');}

/* ---------- API ---------- */
async function rest(path,opts){
  opts=opts||{};
  var headers=Object.assign({'apikey':SUPA_KEY,'Content-Type':'application/json'},opts.headers||{});
  var token=SESSION?SESSION.access_token:null;
  headers['Authorization']='Bearer '+(token||SUPA_KEY);
  var res=await fetch(SUPA_URL+path,Object.assign({},opts,{headers:headers}));
  var text=await res.text();
  var data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok){
    var msg=(data&&(data.message||data.msg||data.error_description||data.error||data.hint))||text||('HTTP '+res.status);
    throw new Error(msg);
  }
  return data;
}
async function authReq(path,body){
  var res=await fetch(SUPA_URL+path,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  var text=await res.text();
  var data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok){
    var msg=(data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status);
    throw new Error(msg);
  }
  return data;
}

/* ---------- PRINT ---------- */
function printSection(title,html){
  var w=window.open('','_blank');
  if(!w){toast('Allow popups','bad');return;}
  var logo=SCHOOL?(SCHOOL.logo_url||SCHOOL.logo_data):'';
  var doc='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+esc(title)+'</title><style>'+
    'body{font-family:Arial,sans-serif;padding:20px;font-size:12px;color:#111}'+
    '.head{display:flex;align-items:center;gap:16px;padding-bottom:12px;border-bottom:2px solid #0a2540;margin-bottom:14px}'+
    '.head img{width:60px;height:60px;object-fit:contain}'+
    '.head h1{font-size:17px;margin:0;text-transform:uppercase;color:#0a2540}'+
    '.head .m{font-size:11px;color:#666}'+
    '.t{text-align:center;font-weight:700;text-transform:uppercase;color:#0a2540;margin:10px 0;font-size:13px}'+
    '.s{text-align:center;font-size:10px;color:#888;margin-bottom:12px}'+
    'table{width:100%;border-collapse:collapse;margin-top:8px}'+
    'th,td{padding:6px 8px;border:1px solid #ccc;font-size:11px;text-align:left}'+
    'th{background:#0a2540;color:#fff;text-transform:uppercase;font-size:10px}'+
    '.f{text-align:center;font-size:10px;color:#888;margin-top:20px;padding-top:8px;border-top:1px solid #eee}'+
    '@page{size:A4 landscape;margin:10mm}@media print{body{padding:0}}'+
    '</style></head><body>'+
    '<div class="head">'+(logo?'<img src="'+esc(logo)+'">':'')+'<div><h1>'+esc(SCHOOL?SCHOOL.name:'')+'</h1><div class="m">'+esc(SCHOOL?SCHOOL.address||'':'')+((SCHOOL&&SCHOOL.telephone)?' · '+esc(SCHOOL.telephone):'')+'</div></div></div>'+
    '<div class="t">'+esc(title)+'</div>'+
    '<div class="s">Generated: '+new Date().toLocaleString()+'</div>'+
    html+
    '<div class="f">Powered by EUDES MEDIA</div>'+
    '<script>setTimeout(function(){window.print();},400);<\/script></body></html>';
  w.document.write(doc);
  w.document.close();
}

/* ============================================================
   LOGIN
   ============================================================ */
async function doLogin(){
  var email=document.getElementById('loginEmail').value.trim().toLowerCase();
  var pass=document.getElementById('loginPass').value;
  var err=document.getElementById('loginErr');
  var btn=document.getElementById('loginBtn');
  err.style.display='none';
  if(!email||!pass){err.textContent='Enter email and password';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='Signing in…';
  try{
    var data=await authReq('/auth/v1/token?grant_type=password',{email:email,password:pass});
    SESSION={access_token:data.access_token,user:data.user};
    await boot();
  }catch(e){
    err.textContent=e.message;err.style.display='block';
    btn.disabled=false;btn.textContent='Sign In';
  }
}
window.doLogin=doLogin;

async function doLogout(){
  if(!confirm('Sign out?'))return;
  try{if(SESSION)await fetch(SUPA_URL+'/auth/v1/logout',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SESSION.access_token}});}catch(e){}
  SESSION=null;PROFILE=null;SCHOOL=null;SCHOOL_ID=null;CLASSES_CACHE=null;
  document.getElementById('app').style.display='none';
  document.getElementById('authScreen').style.display='flex';
}
window.doLogout=doLogout;

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  if(!SESSION||!SESSION.user){
    document.getElementById('app').style.display='none';
    document.getElementById('authScreen').style.display='flex';
    return;
  }
  var main=document.getElementById('main');
  try{
    /* 1. Load profile */
    main.innerHTML='<div class="loading">Loading profile…</div>';
    var profs=await rest('/rest/v1/profiles?id=eq.'+SESSION.user.id+'&select=*');
    PROFILE=profs&&profs[0];
    if(!PROFILE){
      document.getElementById('loginErr').innerHTML='<b>No profile found for your account.</b><br>Ask your admin to create one, or run in Supabase:<br><code>INSERT INTO profiles (id, school_id, full_name, email, role) SELECT \''+SESSION.user.id+'\', (SELECT id FROM schools LIMIT 1), \'Admin\', \''+SESSION.user.email+'\', \'admin\';</code>';
      document.getElementById('loginErr').style.display='block';
      document.getElementById('loginBtn').disabled=false;document.getElementById('loginBtn').textContent='Sign In';
      return;
    }
    SCHOOL_ID=PROFILE.school_id;
    ROLE=PROFILE.role||'admin';
    if(!SCHOOL_ID){
      document.getElementById('loginErr').innerHTML='<b>Your profile has no school.</b><br>Run in Supabase:<br><code>UPDATE profiles SET school_id=(SELECT id FROM schools LIMIT 1), role=\'admin\' WHERE id=\''+SESSION.user.id+'\';</code>';
      document.getElementById('loginErr').style.display='block';
      document.getElementById('loginBtn').disabled=false;document.getElementById('loginBtn').textContent='Sign In';
      return;
    }
    /* 2. Load school */
    main.innerHTML='<div class="loading">Loading school…</div>';
    var sc=await rest('/rest/v1/schools?id=eq.'+SCHOOL_ID+'&select=*');
    SCHOOL=sc&&sc[0];
    if(!SCHOOL){toast('School record not found','bad');return;}
    /* 3. Set year/term */
    CYEAR=SCHOOL.current_year||new Date().getFullYear();
    CTERM=SCHOOL.current_term||1;
    /* 4. Show app */
    document.getElementById('authScreen').style.display='none';
    document.getElementById('app').style.display='block';
    /* 5. Paint chrome */
    renderHeader();
    populateYearSelect();
    renderNav();
    renderBottomBar();
    /* 6. Load dashboard */
    await nav('dashboard');
  }catch(e){
    console.error(e);
    main.innerHTML='<div class="error-box"><b>Boot error:</b><br>'+esc(e.message)+'</div><button class="btn ghost" onclick="boot()">Retry</button>';
    toast('Boot error: '+e.message,'bad');
  }
}

function populateYearSelect(){
  var sel=document.getElementById('termYearSelect');
  var y=new Date().getFullYear();var arr=[];
  for(var i=y-2;i<=y+1;i++)arr.push(i);
  if(arr.indexOf(CYEAR)===-1)arr.push(CYEAR);
  arr.sort(function(a,b){return b-a;});
  sel.innerHTML=arr.map(function(v){return '<option value="'+v+'"'+(v===CYEAR?' selected':'')+'>'+v+'</option>';}).join('');
  document.getElementById('termTermSelect').value=CTERM;

function filterStudents(){
  var q=(document.getElementById('stSearch').value||'').toLowerCase();
  var cf=document.getElementById('stClass').value||'';
  var classes=CLASSES_CACHE||[];
  var cById={};classes.forEach(function(c){cById[c.id]=c;});
  var activeIds=window._activePassIds||new Set();
  var list=STUDENTS_CACHE.filter(function(s){
    if(cf&&s.class_id!==cf)return false;
    if(q){
      var h=(s.first_name+' '+(s.last_name||'')+' '+s.admission_no+' '+(s.parent_name||'')+' '+(s.parent_contact||'')).toLowerCase();
      if(h.indexOf(q)===-1)return false;
    }
    return true;
  });
  _lastFilteredStudents=list;
  document.getElementById('stCount').textContent=STUDENTS_CACHE.length+' total · '+list.length+' shown';
  var c=document.getElementById('stTable');
  if(!list.length){
    c.innerHTML='<div class="empty">'+(STUDENTS_CACHE.length===0?'No pupils yet. Click "Register" to add the first one.':'No pupils match your filter.')+'</div>';
    return;
  }
  var rows='';
  list.forEach(function(s){
    var cls=cById[s.class_id];
    var bal=(Number(s.total_charged)||0)-(Number(s.total_paid)||0);
    var pc=(s.parent_contact||'').trim();
    rows+='<tr>'+
      '<td><b>'+esc(s.admission_no||'—')+'</b></td>'+
      '<td><a href="javascript:void(0)" onclick="openProfile(\''+s.id+'\')" style="color:#0a2540;font-weight:600;text-decoration:none">'+esc(s.first_name+' '+(s.last_name||''))+'</a></td>'+
      '<td>'+(cls?'<span class="badge info">'+esc(cls.name)+'</span>':'—')+'</td>'+
      '<td>'+esc(genderLabel(s.gender))+'</td>'+
      '<td>'+(pc?'<b>'+esc(pc)+'</b>':'—')+'</td>'+
      '<td>'+(activeIds.has(s.id)?'<span class="badge bad">OUT</span>':'')+'</td>'+
      '<td style="text-align:right"><span class="badge '+(bal>0?'bad':'ok')+'">'+fmtNum(bal)+'</span></td>'+
      '<td style="text-align:right;white-space:nowrap">'+
      '<button class="btn sm gold" onclick="recordPayment(\''+s.id+'\')" title="Pay">💵</button> '+
      '<button class="btn sm ghost" onclick="openStudentModalById(\''+s.id+'\')" title="Edit">✏️</button> '+
      '<button class="btn sm danger" onclick="deleteStudent(\''+s.id+'\')" title="Delete">✕</button>'+
      '</td></tr>';
  });
  c.innerHTML='<div class="table-wrap"><table><thead><tr><th>ADM</th><th>Name</th><th>Class</th><th>Gender</th><th>Parent</th><th>OUT</th><th style="text-align:right">Balance</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

async function saveStudent(id){
  var n=function(f){return Number(document.getElementById(f).value)||0;};
  var body={
    school_id:SCHOOL_ID,
    admission_no:document.getElementById('m_adm').value.trim(),
    class_id:document.getElementById('m_class').value||null,
    first_name:document.getElementById('m_fn').value.trim(),
    last_name:document.getElementById('m_ln').value.trim()||null,
    gender:document.getElementById('m_gender').value||null,
    date_of_birth:document.getElementById('m_dob').value||null,
    lin:document.getElementById('m_lin').value.trim()||null,
    boarding_status:document.getElementById('m_res').value,
    location:document.getElementById('m_loc').value.trim()||null,
    parent_name:document.getElementById('m_par').value.trim()||null,
    parent_contact:document.getElementById('m_pc').value.trim()||null,
    balance_bf:n('m_bf'),actual_fee:n('m_fee'),functional_fee:n('m_func'),
    transport_fee:n('m_trans'),holiday_fee:n('m_hol'),academics_fee:n('m_acad')
  };
  body.total_charged=body.balance_bf+body.actual_fee+body.functional_fee+body.transport_fee+body.holiday_fee+body.academics_fee;
  var old=id?STUDENTS_CACHE.find(function(x){return x.id===id;}):null;
  body.total_paid=old?Number(old.total_paid)||0:0;
  body.current_balance=body.total_charged-body.total_paid;
  if(!body.admission_no||!body.first_name||!body.class_id){toast('Fill ADM, name, class','bad');return;}
  try{
    if(id)await rest('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});
    else await rest('/rest/v1/students',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});
    toast('Saved','ok');closeModal();nav(activeRoute);
  }catch(e){toast(e.message,'bad');}
}
window.saveStudent=saveStudent;

async function nextReceiptNo(){
  try{
    var rows=await rest('/rest/v1/payments?school_id=eq.'+SCHOOL_ID+'&year=eq.'+CYEAR+'&select=id');
    return 'RCP-'+CYEAR+'-'+String((rows.length||0)+1).padStart(5,'0');
  }catch(e){return 'RCP-'+CYEAR+'-'+String(Date.now()).slice(-5);}
}

  var s=STUDENTS_CACHE.find(function(x){return x.id===studentId;});

async function savePayment(studentId){
  var amount=Number(document.getElementById('p_amount').value);
  var rno=document.getElementById('p_rno').value.trim()||('RCP-'+Date.now());
  if(!amount||amount<=0){toast('Enter amount','bad');return;}
  var s=STUDENTS_CACHE.find(function(x){return x.id===studentId;});
  if(!s){toast('Not found','bad');return;}
  var method=document.getElementById('p_method').value;
  var payment_for=document.getElementById('p_for').value;
  var notes=document.getElementById('p_notes').value.trim();
  var body={
    school_id:SCHOOL_ID,student_id:studentId,receipt_no:rno,
    year:CYEAR,term:CTERM,academic_year:CYEAR,
    amount:amount,method:method,payment_for:payment_for,payment_method:method,
    received_by:PROFILE?PROFILE.id:null
  };
  if(notes)body.notes=notes;
  try{
    await rest('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});
    var newPaid=(Number(s.total_paid)||0)+amount;
    var charged=Number(s.total_charged)||0;
    await rest('/rest/v1/students?id=eq.'+studentId,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({total_paid:newPaid,current_balance:Math.max(0,charged-newPaid)})});
    toast('Receipt: '+rno,'ok');
    printReceipt(s,{receipt_no:rno,amount:amount,payment_for:payment_for,method:method,notes:notes,date:new Date().toISOString()});
    closeModal();nav(activeRoute);
  }catch(e){toast(e.message,'bad');}
}
window.savePayment=savePayment;

    rest('/rest/v1/payments?school_id=eq.'+SCHOOL_ID+'&select=*&order=paid_at.desc&limit=500'),
    rest('/rest/v1/students?school_id=eq.'+SCHOOL_ID+'&select=id,admission_no,first_name,last_name')
  ]);
  var payments=results[0]||[];
  var students=results[1]||[];
  window._pmStudents=students;
  window._allPayments=payments;
  var total=payments.reduce(function(a,b){return a+Number(b.amount||0);},0);
  root.innerHTML='<div class="page-head"><div><h1>💳 Payments</h1><div class="sub" id="pmCount">'+payments.length+' · '+fmtUGX(total)+'</div></div></div>'+
  '<div class="card"><input id="pmSearch" placeholder="🔍 Search receipt, name…" oninput="filterPayments()" style="margin-bottom:12px"><div id="pmTable"></div></div>';
  filterPayments();
}
window.pagePayments=pagePayments;

function filterPayments(){
  var q=(document.getElementById('pmSearch').value||'').toLowerCase();
  var students=window._pmStudents||[];var sById={};students.forEach(function(s){sById[s.id]=s;});
  var list=(window._allPayments||[]).filter(function(p){
    if(!q)return true;
    var s=sById[p.student_id]||{};
    var h=((p.receipt_no||'')+' '+(s.first_name||'')+' '+(s.last_name||'')+' '+(s.admission_no||'')).toLowerCase();
    return h.indexOf(q)!==-1;
  });
  document.getElementById('pmCount').textContent=(window._allPayments||[]).length+' total · '+list.length+' shown';
  var c=document.getElementById('pmTable');
  if(!list.length){c.innerHTML='<div class="empty">'+(window._allPayments||[]).length===0?'No payments yet.':'No match.'+'</div>';return;}
  var rows='';
  list.forEach(function(p){
    var s=sById[p.student_id]||{};
    rows+='<tr><td>'+fmtDate(p.paid_at)+'</td><td><b style="font-family:monospace">'+esc(p.receipt_no||'')+'</b></td><td>'+esc(s.admission_no||'')+'</td><td>'+esc((s.first_name||'')+' '+(s.last_name||''))+'</td><td>'+esc(p.payment_for||'')+'</td><td>'+esc(p.method||'')+'</td><td style="text-align:right;font-weight:700;color:#047857">'+fmtNum(p.amount)+'</td></tr>';
  });
  c.innerHTML='<div class="table-wrap"><table><thead><tr><th>Date</th><th>Receipt</th><th>ADM</th><th>Pupil</th><th>For</th><th>Method</th><th style="text-align:right">Amount</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
window.filterPayments=filterPayments;

async function pageDebtors(root){
  clearClasses();
  var classes=await loadClasses();
  var students=await rest('/rest/v1/students?school_id=eq.'+SCHOOL_ID+'&status=eq.active&select=*');
  STUDENTS_CACHE=students||[];
  var cById={};classes.forEach(function(c){cById[c.id]=c;});
  var debtors=students.map(function(s){var c=Number(s.total_charged)||0;var p=Number(s.total_paid)||0;return{s:s,bal:c-p,cls:cById[s.class_id]};}).filter(function(x){return x.bal>0;}).sort(function(a,b){return b.bal-a.bal;});
  window._debtors=debtors;
  var total=debtors.reduce(function(a,b){return a+b.bal;},0);
  root.innerHTML='<div class="page-head"><div><h1>👥 Debtors</h1><div class="sub">'+debtors.length+' · '+fmtUGX(total)+'</div></div><button class="btn ghost" onclick="printDebtors()">🖨️ Print</button></div>'+
  '<div class="card"><input id="dSearch" placeholder="🔍 Search…" oninput="filterDebtors()" style="margin-bottom:12px"><div id="dTable"></div></div>';
  filterDebtors();
}
window.pageDebtors=pageDebtors;

function filterDebtors(){
  var q=(document.getElementById('dSearch').value||'').toLowerCase();
  var list=(window._debtors||[]).filter(function(d){
    if(!q)return true;
    var h=(d.s.first_name+' '+(d.s.last_name||'')+' '+d.s.admission_no).toLowerCase();
    return h.indexOf(q)!==-1;
  });
  var c=document.getElementById('dTable');
  if(!list.length){c.innerHTML='<div class="empty">'+(window._debtors||[]).length===0?'No debtors.':'No match.'+'</div>';return;}
  var rows='';
  list.forEach(function(d){
    rows+='<tr><td>'+esc(d.s.admission_no)+'</td><td><b>'+esc(d.s.first_name+' '+(d.s.last_name||''))+'</b></td><td>'+esc(d.cls?d.cls.name:'')+'</td><td>'+esc(d.s.parent_contact||'')+'</td><td style="text-align:right;color:#b91c1c;font-weight:700">'+fmtNum(d.bal)+'</td><td><button class="btn sm" onclick="recordPayment(\''+d.s.id+'\')">💵</button></td></tr>';
  });
  c.innerHTML='<div class="table-wrap"><table><thead><tr><th>ADM</th><th>Name</th><th>Class</th><th>Contact</th><th style="text-align:right">Balance</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
window.filterDebtors=filterDebtors;

function printDebtors(){
  var list=window._debtors||[];
  if(!list.length){toast('Nothing','bad');return;}
  var rows='',total=0;
  list.forEach(function(d,i){total+=d.bal;rows+='<tr><td>'+(i+1)+'</td><td>'+esc(d.s.admission_no)+'</td><td>'+esc(d.s.first_name+' '+(d.s.last_name||''))+'</td><td>'+esc(d.cls?d.cls.name:'')+'</td><td>'+esc(d.s.parent_contact||'')+'</td><td style="text-align:right">'+fmtNum(d.bal)+'</td></tr>';});
  rows+='<tr style="background:#f1f5f9;font-weight:700"><td colspan="5" style="text-align:right">TOTAL</td><td style="text-align:right">'+fmtNum(total)+'</td></tr>';
  printSection('Debtors','<table><thead><tr><th>#</th><th>ADM</th><th>Name</th><th>Class</th><th>Contact</th><th style="text-align:right">Balance</th></tr></thead><tbody>'+rows+'</tbody></table>');

window.printDebtors=printDebtors;

var PASSOUT_REASONS=['Sick','Medical appointment','Family emergency','Funeral','Parent request','School activity','Discipline','Other'];

async function addPassOut(){
  var results=await Promise.all([
    rest('/rest/v1/students?school_id=eq.'+SCHOOL_ID+'&status=eq.active&select=id,first_name,last_name,admission_no,parent_name,parent_contact&order=first_name'),
    rest('/rest/v1/pass_outs?school_id=eq.'+SCHOOL_ID+'&status=eq.out&select=student_id')
  ]);
  var students=results[0]||[];
  var outIds=new Set((results[1]||[]).map(function(p){return p.student_id;}));
  _passOutLookup={};
  students.forEach(function(s){_passOutLookup[s.id]=s;});
  var opts='<option value="">— Select Pupil —</option>';
  students.forEach(function(s){
    var isOut=outIds.has(s.id);
    opts+='<option value="'+s.id+'"'+(isOut?' data-out="1"':'')+'>'+esc(s.admission_no+' — '+s.first_name+' '+(s.last_name||''))+(isOut?' ⚠️ OUT':'')+'</option>';
  });
  var rOpts=PASSOUT_REASONS.map(function(r){return '<option>'+r+'</option>';}).join('');
  modal('<h3>🚪 New Pass Out</h3>'+
    '<div id="pblock" style="display:none" class="alert-item danger"><span class="ico">🚫</span><div class="txt"><b>Already signed out</b><span>Return first</span></div></div>'+
    '<div><label>Pupil *</label><select id="psel" onchange="poSelect()">'+opts+'</select></div>'+
    '<div id="phint" style="background:#f8fafc;border-radius:10px;padding:10px;margin-top:8px;font-size:12.5px"><span class="muted">Select a pupil</span></div>'+
    '<div class="grid grid-2" style="margin-top:12px"><div><label>Reason *</label><select id="preason">'+rOpts+'</select></div><div><label>Expected Return</label><input id="pexp" type="datetime-local"></div></div>'+
    '<div class="grid grid-2" style="margin-top:12px"><div><label>Picked Up By *</label><input id="ppicked"></div><div><label>Their Phone</label><input id="pphone"></div></div>'+
    '<div style="margin-top:12px"><label>Authorized By *</label><input id="pauth" value="'+esc(PROFILE?PROFILE.full_name||'':'')+'"></div>'+
    '<div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="pbtn" onclick="savePassOut()">Sign Out</button></div>');
}
window.addPassOut=addPassOut;

function poSelect(){
  var sel=document.getElementById('psel');var id=sel.value;
  var hint=document.getElementById('phint');var block=document.getElementById('pblock');var btn=document.getElementById('pbtn');
  if(!id){hint.innerHTML='<span class="muted">Select a pupil</span>';block.style.display='none';btn.disabled=false;btn.textContent='Sign Out';document.getElementById('ppicked').value='';document.getElementById('pphone').value='';return;}
  var s=_passOutLookup[id];
  if(!s){hint.textContent='Loading…';return;}
  hint.innerHTML='<b>'+esc(s.first_name+' '+(s.last_name||''))+'</b> · '+esc(s.admission_no)+
    '<div style="margin-top:4px">👤 Parent: <b>'+esc(s.parent_name||'—')+'</b></div>'+
    '<div>📞 Phone: <b>'+esc(s.parent_contact||'—')+'</b></div>';
  document.getElementById('ppicked').value=s.parent_name||'';
  document.getElementById('pphone').value=s.parent_contact||'';
  var isOut=sel.options[sel.selectedIndex].dataset.out==='1';
  if(isOut){block.style.display='flex';btn.disabled=true;btn.textContent='⚠️ Already Signed Out';btn.style.background='#94a3b8';}
  else{block.style.display='none';btn.disabled=false;btn.textContent='Sign Out';btn.style.background='';}
}
window.poSelect=poSelect;

async function savePassOut(){
  var student_id=document.getElementById('psel').value;
  var reason=document.getElementById('preason').value;
  var exp=document.getElementById('pexp').value?new Date(document.getElementById('pexp').value).toISOString():null;
  var picked=document.getElementById('ppicked').value.trim();
  var phone=document.getElementById('pphone').value.trim();
  var auth=document.getElementById('pauth').value.trim();
  if(!student_id||!picked||!auth){toast('Fill required','bad');return;}
  try{
    var existing=await rest('/rest/v1/pass_outs?school_id=eq.'+SCHOOL_ID+'&student_id=eq.'+student_id+'&status=eq.out&select=id,signed_out_at');
    if(existing&&existing.length){
      var s=_passOutLookup[student_id]||{};
      modal('<h3>⛔ Already OUT</h3><div class="alert-item danger"><span class="ico">🚫</span><div class="txt"><b>'+esc(s.first_name+' '+(s.last_name||''))+'</b><span>Signed out '+fmtDateTime(existing[0].signed_out_at)+'</span></div></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Close</button><button class="btn ok" onclick="closeModal();returnPass(\''+existing[0].id+'\')">✓ Return</button></div>');
      return;
    }
    await rest('/rest/v1/pass_outs',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({
      school_id:SCHOOL_ID,student_id:student_id,reason:reason,expected_return_at:exp,
      picked_up_by:picked+(phone?' ('+phone+')':''),authorized_by:auth,status:'out',
      academic_year:CYEAR,term:CTERM
    })});
    toast('Signed out','ok');closeModal();nav('passouts');
  }catch(e){toast(e.message,'bad');}
}
window.savePassOut=savePassOut;

function returnPass(id){
  var p=(window._allPassOuts||[]).find(function(x){return x.id===id;})||(window._profilePassOuts||[]).find(function(x){return x.id===id;});
  if(!p){toast('Not found','bad');return;}
  var s={};
  if(STUDENT_PASSES_CACHE.length)s=STUDENT_PASSES_CACHE.find(function(x){return x.id===p.student_id;})||{};
  if(!s.first_name&&window._profileStudent)s=window._profileStudent;
  modal('<h3>✓ Mark Returned</h3>'+
    '<div style="background:#f8fafc;border-radius:10px;padding:12px;margin-bottom:12px"><b>'+esc((s.first_name||'')+' '+(s.last_name||''))+'</b><div class="muted">Out since '+fmtDateTime(p.signed_out_at)+'</div></div>'+
    '<div><label>Condition</label><select id="rc"><option>Healthy</option><option>Unwell — follow-up</option><option>Injured</option></select></div>'+
    '<div style="margin-top:12px"><label>Received By *</label><input id="rby" value="'+esc(PROFILE?PROFILE.full_name||'':'')+'"></div>'+
    '<div style="margin-top:12px"><label>Notes</label><input id="rnotes"></div>'+
    '<div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn ok" onclick="confirmReturn(\''+id+'\')">✓ Confirm</button></div>');
}
window.returnPass=returnPass;

async function confirmReturn(id){
  var cond=document.getElementById('rc').value;
  var by=document.getElementById('rby').value.trim();
  var notes=document.getElementById('rnotes').value.trim();
  if(!by){toast('Enter received by','bad');return;}
  try{
    await rest('/rest/v1/pass_outs?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({
      status:'returned',signed_in_at:new Date().toISOString(),signed_in_by:by,
      signed_in_notes:(cond!=='Healthy'?'['+cond+'] ':'')+(notes||'')
    })});
    toast('Returned','ok');closeModal();nav(activeRoute);
  }catch(e){toast(e.message,'bad');}
}
window.confirmReturn=confirmReturn;

async function loadAtt(){
  var cid=document.getElementById('aClass').value;
  var dt=document.getElementById('aDate').value;
  var url='/rest/v1/students?school_id=eq.'+SCHOOL_ID+'&status=eq.active&select=id,first_name,last_name,admission_no,class_id';
  if(cid)url+='&class_id=eq.'+cid;
  var results=await Promise.all([
    rest(url),
    rest('/rest/v1/attendance?school_id=eq.'+SCHOOL_ID+'&date=eq.'+dt+'&select=student_id,status')
  ]);
  var students=results[0]||[];
  var existing=results[1]||[];
  var map={};existing.forEach(function(a){map[a.student_id]=a.status;});
  window._attMap=map;window._attDate=dt;
  var c=document.getElementById('aTable');
  if(!students.length){c.innerHTML='<div class="card empty">No pupils'+(cid?' in this class':'')+'.</div>';return;}
  var rows='';
  students.forEach(function(s){
    var st=map[s.id]||'';
    rows+='<tr><td>'+esc(s.admission_no)+'</td><td><b>'+esc(s.first_name+' '+(s.last_name||''))+'</b></td><td style="text-align:center"><button class="btn sm '+(st==='present'?'ok':'ghost')+'" onclick="setAtt(\''+s.id+'\',\''+s.class_id+'\',\'present\')">✓</button> <button class="btn sm '+(st==='absent'?'danger':'ghost')+'" onclick="setAtt(\''+s.id+'\',\''+s.class_id+'\',\'absent\')">✗</button> <button class="btn sm '+(st==='late'?'gold':'ghost')+'" onclick="setAtt(\''+s.id+'\',\''+s.class_id+'\',\'late\')">⏰</button></td></tr>';
  });
  c.innerHTML='<div class="card"><div class="table-wrap"><table><thead><tr><th>ADM</th><th>Name</th><th style="text-align:center">Status</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
window.loadAtt=loadAtt;

async function setAtt(id,cid,status){
  var dt=window._attDate;
  try{
    await rest('/rest/v1/attendance?school_id=eq.'+SCHOOL_ID+'&student_id=eq.'+id+'&date=eq.'+dt,{method:'DELETE'});
    await rest('/rest/v1/attendance',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({
      school_id:SCHOOL_ID,student_id:id,class_id:cid,date:dt,status:status,
      academic_year:CYEAR,term:CTERM
    })});
    loadAtt();
  }catch(e){toast(e.message,'bad');}
}
window.setAtt=setAtt;

  if(!_marksExam&&exams[0])_marksExam=exams[0].id;

    rest('/rest/v1/students?school_id=eq.'+SCHOOL_ID+'&class_id=eq.'+_marksClass+'&status=eq.active&select=id,admission_no,first_name,last_name&order=first_name'),
    _marksExam?rest('/rest/v1/marks?school_id=eq.'+SCHOOL_ID+'&exam_id=eq.'+_marksExam+'&select=student_id,subject_id,score'):[]

function gradeOf(score){
  if(score==null||isNaN(score))return{g:'—',r:'—'};
  var s=Number(score);
  if(s>=90)return{g:'D1',r:'Distinction 1'};
  if(s>=80)return{g:'D2',r:'Distinction 2'};
  if(s>=70)return{g:'C3',r:'Credit 3'};
  if(s>=60)return{g:'C4',r:'Credit 4'};
  if(s>=55)return{g:'C5',r:'Credit 5'};
  if(s>=50)return{g:'C6',r:'Credit 6'};
  if(s>=45)return{g:'P7',r:'Pass 7'};
  if(s>=40)return{g:'P8',r:'Pass 8'};
  return{g:'F9',r:'Fail 9'};
}

function buildReportCard(s,subjects,marks){
  var cls=(CLASSES_CACHE||[]).find(function(c){return c.id===s.class_id;});

  var logo=(SCHOOL&&(SCHOOL.logo_url||SCHOOL.logo_data))||'';

  var hc=cell+'background:#ede7f6;font-weight:700;color:#4a148c;text-align:center;text-transform:uppercase;font-size:10px;';
  var lc=cell+'background:#f3e5f5;font-weight:700;color:#4a148c;';
  var cc=cell+'text-align:center;';
  var sRows='';var grand=0,cnt=0;
  subjects.forEach(function(sj,i){
    var v=per[sj.subject_id];
    var sc=(v!=null&&!isNaN(v))?Number(v):null;
    if(sc!=null){grand+=sc;cnt++;}
    var g=gradeOf(sc);
    sRows+='<tr><td style="'+cc+'">'+(i+1)+'</td><td style="'+lc+'">'+esc(sj.name)+'</td><td style="'+cc+'">'+(sc!=null?sc:'—')+'</td><td style="'+cc+'"><b>'+g.g+'</b></td><td style="'+cell+'">'+g.r+'</td></tr>';
  });
  var avg=cnt?grand/cnt:0;var fg=gradeOf(avg);
  var header='<div style="text-align:center;padding-bottom:10px;border-bottom:3px double #4a148c;margin-bottom:10px"><div style="display:flex;align-items:center;justify-content:center;gap:14px">'+
    (logo?'<img src="'+esc(logo)+'" style="width:65px;height:65px;object-fit:contain">':'')+
    '<div style="flex:1"><div style="font-family:Georgia;font-size:17px;font-weight:900;color:#6a1b9a;text-transform:uppercase">'+esc(SCHOOL?SCHOOL.name:'')+'</div>'+
    '<div style="font-size:11px;color:#4a148c">'+esc(SCHOOL?SCHOOL.address||'':'')+'</div>'+
    '<div style="font-size:12px;font-weight:800;color:#6a1b9a;background:#f3e5f5;padding:3px 14px;border-radius:4px;display:inline-block;margin-top:6px">TERMLY REPORT CARD</div></div></div></div>';
  var info='<table style="width:100%;border-collapse:collapse;margin-bottom:10px;font-size:11px"><tbody>'+
    '<tr><td style="padding:4px 8px;border:1px solid #e2e8f0"><b>Name:</b> '+esc(s.first_name+' '+(s.last_name||''))+'</td>'+
    '<td style="padding:4px 8px;border:1px solid #e2e8f0"><b>ADM:</b> '+esc(s.admission_no)+'</td>'+
    '<td style="padding:4px 8px;border:1px solid #e2e8f0"><b>Class:</b> '+esc(cls?cls.name:'')+'</td></tr>'+
    '<tr><td style="padding:4px 8px;border:1px solid #e2e8f0"><b>Gender:</b> '+esc(genderLabel(s.gender))+'</td>'+
    '<td style="padding:4px 8px;border:1px solid #e2e8f0"><b>Term:</b> '+CTERM+' / '+CYEAR+'</td>'+
    '<td style="padding:4px 8px;border:1px solid #e2e8f0"><b>LIN:</b> '+esc(s.lin||'—')+'</td></tr>'+
    '</tbody></table>';
  var table='<table style="width:100%;border-collapse:collapse;margin-bottom:10px"><thead><tr>'+
    '<th style="'+hc+'">#</th><th style="'+hc+'">Subject</th><th style="'+hc+'">Score</th><th style="'+hc+'">Grade</th><th style="'+hc+'">Remark</th>'+
    '</tr></thead><tbody>'+sRows+
    '<tr style="background:#f3e5f5;font-weight:700"><td style="'+cc+'" colspan="2">TOTAL</td><td style="'+cc+'">'+grand.toFixed(0)+'</td><td style="'+cc+'">'+fg.g+'</td><td style="'+cell+'">'+fg.r+'</td></tr>'+
    '<tr style="background:#f3e5f5;font-weight:700"><td style="'+cc+'" colspan="2">AVERAGE</td><td style="'+cc+'" colspan="3">'+avg.toFixed(1)+'%</td></tr>'+
    '</tbody></table>';
  return '<div style="background:#fff;padding:14px;border:2px solid #4a148c;max-width:210mm;margin:0 auto 16px">'+header+info+table+
    '<div style="text-align:center;font-size:10px;color:#666;margin-top:14px;font-style:italic">Valid only with school stamp</div></div>';
}

  (staff.length?'<div class="card"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Phone</th><th style="text-align:right">Salary</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>':
  '<div class="card"><div class="alert-item info"><span class="ico">💡</span><div class="txt"><b>No staff yet</b><span>Add your teachers and workers</span></div></div></div>');
}
window.pageStaff=pageStaff;

function addStaff(){
  modal('<h3>Add Staff</h3>'+
    '<div><label>Full Name *</label><input id="fn"></div>'+
    '<div class="grid grid-2" style="margin-top:12px"><div><label>Role</label><input id="fr" placeholder="Teacher"></div><div><label>Phone</label><input id="ft" placeholder="+256..."></div></div>'+
    '<div style="margin-top:12px"><label>Monthly Salary</label><input id="fs" type="number" value="0"></div>'+
    '<div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveStaff()">Save</button></div>');
}
window.addStaff=addStaff;

async function saveStaff(){
  var body={
    school_id:SCHOOL_ID,
    full_name:document.getElementById('fn').value.trim(),
    role:document.getElementById('fr').value.trim()||null,
    telephone:document.getElementById('ft').value.trim()||null,
    monthly_salary:Number(document.getElementById('fs').value)||0
  };

  try{
    await rest('/rest/v1/staff',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});

window.saveStaff=saveStaff;

async function delStaff(id){
  if(!confirm('Delete?'))return;
  try{await rest('/rest/v1/staff?id=eq.'+id,{method:'DELETE'});toast('Deleted','ok');nav('staff');}
  catch(e){toast(e.message,'bad');}

window.delStaff=delStaff;

/* ============================================================
   STAFF ATTENDANCE
   ============================================================ */
async function pageStaffAttendance(root){
  var today=new Date().toISOString().slice(0,10);
  root.innerHTML='<div class="page-head"><h1>⏰ Staff Attendance</h1></div>'+
  '<div class="card"><label>Date</label><input type="date" id="sad" value="'+today+'" onchange="loadStaffAtt()"></div>'+
  '<div id="sat"></div>';
  loadStaffAtt();
}
window.pageStaffAttendance=pageStaffAttendance;

async function loadStaffAtt(){
  var dt=document.getElementById('sad').value;
  var results=await Promise.all([
    rest('/rest/v1/staff?school_id=eq.'+SCHOOL_ID+'&select=*&order=full_name'),
    rest('/rest/v1/staff_attendance?school_id=eq.'+SCHOOL_ID+'&date=eq.'+dt+'&select=staff_id,status')
  ]);
  var staff=results[0]||[];
  var ex=results[1]||[];
  var map={};ex.forEach(function(a){map[a.staff_id]=a.status;});
  window._saMap=map;window._saDate=dt;
  var c=document.getElementById('sat');
  if(!staff.length){c.innerHTML='<div class="card empty">No staff yet.</div>';return;}
  var rows='';
  staff.forEach(function(s){
    var st=map[s.id]||'';
    rows+='<tr><td><b>'+esc(s.full_name)+'</b></td><td>'+esc(s.role||'')+'</td><td style="text-align:center"><button class="btn sm '+(st==='present'?'ok':'ghost')+'" onclick="setStaffAtt(\''+s.id+'\',\'present\')">✓</button> <button class="btn sm '+(st==='absent'?'danger':'ghost')+'" onclick="setStaffAtt(\''+s.id+'\',\'absent\')">✗</button></td></tr>';
  });
  c.innerHTML='<div class="card"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th style="text-align:center">Status</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
window.loadStaffAtt=loadStaffAtt;

async function setStaffAtt(id,status){
  try{
    await rest('/rest/v1/staff_attendance?school_id=eq.'+SCHOOL_ID+'&staff_id=eq.'+id+'&date=eq.'+window._saDate,{method:'DELETE'});
    await rest('/rest/v1/staff_attendance',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({school_id:SCHOOL_ID,staff_id:id,date:window._saDate,status:status,source:'manual'})});
    loadStaffAtt();
  }catch(e){toast(e.message,'bad');}
}
window.setStaffAtt=setStaffAtt;

/* ============================================================
   PAYROLL
   ============================================================ */
async function pagePayroll(root){
  var results=await Promise.all([
    rest('/rest/v1/staff?school_id=eq.'+SCHOOL_ID+'&select=*&order=full_name'),
    rest('/rest/v1/staff_salaries?school_id=eq.'+SCHOOL_ID+'&select=*&order=created_at.desc&limit=200').catch(function(){return [];}),
    rest('/rest/v1/staff_advances?school_id=eq.'+SCHOOL_ID+'&select=*&order=given_date.desc&limit=100').catch(function(){return [];})
  ]);
  var staff=results[0]||[];
  window._payrollStaff=staff;
  var byId={};staff.forEach(function(s){byId[s.id]=s;});
  var salRows='';
  results[1].forEach(function(s){
    var st=byId[s.staff_id]||{};
    salRows+='<tr><td>'+esc(st.full_name||'')+'</td><td>'+s.month+'/'+s.year+'</td><td style="text-align:right">'+fmtNum(s.net)+'</td><td><span class="badge '+(s.status==='paid'?'ok':'warn')+'">'+esc(s.status)+'</span></td><td>'+(s.status!=='paid'?'<button class="btn sm ok" onclick="markPaid(\''+s.id+'\')">💵 Pay</button>':'')+'</td></tr>';
  });
  var advRows='';
  results[2].forEach(function(a){
    var st=byId[a.staff_id]||{};
    advRows+='<tr><td>'+esc(st.full_name||'')+'</td><td>'+fmtDate(a.given_date)+'</td><td style="text-align:right">'+fmtNum(a.amount)+'</td><td>'+esc(a.reason||'')+'</td></tr>';
  });
  root.innerHTML='<div class="page-head"><h1>💼 Payroll</h1><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn gold" onclick="runPayroll()">▶ Run Payroll All</button><button class="btn" onclick="addSalary()">＋ Add Salary</button><button class="btn ghost" onclick="addAdvance()">＋ Advance</button></div></div>'+
  '<div class="card"><h3>Salaries</h3>'+(salRows?'<div class="table-wrap"><table><thead><tr><th>Staff</th><th>Period</th><th style="text-align:right">Net</th><th>Status</th><th></th></tr></thead><tbody>'+salRows+'</tbody></table></div>':'<div class="empty">No salary records. Click "Run Payroll All" to generate for all staff.</div>')+'</div>'+
  '<div class="card"><h3>Advances</h3>'+(advRows?'<div class="table-wrap"><table><thead><tr><th>Staff</th><th>Date</th><th style="text-align:right">Amount</th><th>Reason</th></tr></thead><tbody>'+advRows+'</tbody></table></div>':'<div class="empty">No advances.</div>')+'</div>';
}
window.pagePayroll=pagePayroll;

async function runPayroll(){
  var staff=window._payrollStaff||[];
  if(!staff.length){toast('No staff yet','bad');return;}
  var m=parseInt(prompt('Month (1-12):',new Date().getMonth()+1));
  if(!m||m<1||m>12)return;
  var y=parseInt(prompt('Year:',new Date().getFullYear()));
  if(!y)return;
  var c=0,sk=0;
  for(var i=0;i<staff.length;i++){
    var s=staff[i];
    var gross=Number(s.monthly_salary||0);
    if(!gross){sk++;continue;}
    try{
      var ex=await rest('/rest/v1/staff_salaries?school_id=eq.'+SCHOOL_ID+'&staff_id=eq.'+s.id+'&month=eq.'+m+'&year=eq.'+y+'&select=id');
      if(ex&&ex.length){sk++;continue;}
      await rest('/rest/v1/staff_salaries',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({school_id:SCHOOL_ID,staff_id:s.id,month:m,year:y,gross:gross,allowances:0,deductions:0,advance_deducted:0,net:gross,status:'pending'})});
      c++;
    }catch(e){}
  }
  toast('Created '+c+' · Skipped '+sk,'ok');nav('payroll');
}
window.runPayroll=runPayroll;

async function markPaid(id){
  if(!confirm('Mark salary as PAID?'))return;
  try{
    await rest('/rest/v1/staff_salaries?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({status:'paid',paid_date:new Date().toISOString().slice(0,10)})});
    toast('Paid','ok');nav('payroll');
  }catch(e){toast(e.message,'bad');}
}
window.markPaid=markPaid;

function addSalary(){
  var opts=(window._payrollStaff||[]).map(function(s){return '<option value="'+s.id+'">'+esc(s.full_name)+'</option>';}).join('');
  modal('<h3>Add Salary</h3>'+
    '<div><label>Staff</label><select id="ss">'+opts+'</select></div>'+
    '<div class="grid grid-2" style="margin-top:12px"><div><label>Month</label><input id="sm" type="number" value="'+(new Date().getMonth()+1)+'"></div><div><label>Year</label><input id="sy" type="number" value="'+new Date().getFullYear()+'"></div></div>'+
    '<div style="margin-top:12px"><label>Gross</label><input id="sg" type="number" value="0"></div>'+
    '<div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveSalary()">Save</button></div>');
}
window.addSalary=addSalary;

async function saveSalary(){
  var sid=document.getElementById('ss').value;
  var m=parseInt(document.getElementById('sm').value);
  var y=parseInt(document.getElementById('sy').value);
  var g=Number(document.getElementById('sg').value)||0;
  if(!sid){toast('Select staff','bad');return;}
  try{
    await rest('/rest/v1/staff_salaries',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({school_id:SCHOOL_ID,staff_id:sid,month:m,year:y,gross:g,allowances:0,deductions:0,advance_deducted:0,net:g,status:'pending'})});
    toast('Added','ok');closeModal();nav('payroll');
  }catch(e){toast(e.message,'bad');}
}
window.saveSalary=saveSalary;

function addAdvance(){
  var opts=(window._payrollStaff||[]).map(function(s){return '<option value="'+s.id+'">'+esc(s.full_name)+'</option>';}).join('');
  modal('<h3>Record Advance</h3>'+
    '<div><label>Staff</label><select id="as">'+opts+'</select></div>'+
    '<div style="margin-top:12px"><label>Amount</label><input id="aa" type="number"></div>'+
    '<div style="margin-top:12px"><label>Reason</label><input id="ar"></div>'+
    '<div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveAdvance()">Save</button></div>');
}
window.addAdvance=addAdvance;

async function saveAdvance(){
  var sid=document.getElementById('as').value;
  var a=Number(document.getElementById('aa').value);
  var r=document.getElementById('ar').value.trim()||null;
  if(!sid||!a){toast('Fill','bad');return;}
  try{
    await rest('/rest/v1/staff_advances',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({school_id:SCHOOL_ID,staff_id:sid,amount:a,reason:r,given_date:new Date().toISOString().slice(0,10),balance:a,status:'active'})});
    toast('Saved','ok');closeModal();nav('payroll');
  }catch(e){toast(e.message,'bad');}
}
window.saveAdvance=saveAdvance;

/* ============================================================
   EXPENSES
   ============================================================ */
async function pageExpenses(root){
  var rows=await rest('/rest/v1/expenses?school_id=eq.'+SCHOOL_ID+'&select=*&order=date.desc').catch(function(){return [];});
  rows=rows.filter(function(e){return(!e.academic_year||e.academic_year===CYEAR)&&(!e.term||e.term===CTERM);});
  var body='';var total=0;
  rows.forEach(function(e){total+=Number(e.amount);body+='<tr><td>'+fmtDate(e.date)+'</td><td>'+esc(e.description)+'</td><td>'+esc(e.category||'')+'</td><td style="text-align:right">'+fmtNum(e.amount)+'</td></tr>';});
  if(!rows.length)body='<tr><td colspan="4" class="empty">No expenses yet</td></tr>';
  else body+='<tr style="background:#f1f5f9;font-weight:700"><td colspan="3" style="text-align:right">TOTAL</td><td style="text-align:right">'+fmtNum(total)+'</td></tr>';
  root.innerHTML='<div class="page-head"><h1>💸 Expenses</h1><button class="btn" onclick="addExpense()">＋ Add</button></div>'+
  '<div class="card"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right">Amount</th></tr></thead><tbody>'+body+'</tbody></table></div></div>';
}
window.pageExpenses=pageExpenses;

function addExpense(){
  modal('<h3>Add Expense</h3>'+
    '<div><label>Description</label><input id="xd"></div>'+
    '<div style="margin-top:12px"><label>Amount</label><input id="xa" type="number"></div>'+
    '<div style="margin-top:12px"><label>Category</label><input id="xc" placeholder="Utilities"></div>'+
    '<div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveExpense()">Save</button></div>');
}
window.addExpense=addExpense;

async function saveExpense(){
  var d=document.getElementById('xd').value.trim();
  var a=Number(document.getElementById('xa').value);
  var c=document.getElementById('xc').value.trim()||'Other';
  if(!d||!a){toast('Fill','bad');return;}
  try{
    await rest('/rest/v1/expenses',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({school_id:SCHOOL_ID,description:d,amount:a,category:c,academic_year:CYEAR,term:CTERM})});
    toast('Saved','ok');closeModal();nav('expenses');
  }catch(e){toast(e.message,'bad');}
}
window.saveExpense=saveExpense;

   SETTINGS

  root.innerHTML='<div class="page-head"><h1>⚙️ Settings</h1></div>'+
  '<div class="card"><h3>School Info</h3><div class="grid grid-2">'+
  '<div><label>Name</label><input id="s_name" value="'+esc(SCHOOL.name||'')+'"></div>'+
  '<div><label>Telephone</label><input id="s_phone" value="'+esc(SCHOOL.telephone||'')+'"></div>'+
  '<div><label>Address</label><input id="s_addr" value="'+esc(SCHOOL.address||'')+'"></div>'+
  '<div><label>Head Teacher</label><input id="s_head" value="'+esc(SCHOOL.head_teacher||'')+'"></div>'+
  '</div><div style="margin-top:12px"><label>Logo URL</label><input id="s_logo" value="'+esc(SCHOOL.logo_url||'')+'"></div>'+

  '<div class="muted" style="margin-top:6px">Role: <b>'+esc(ROLE)+'</b></div>'+
  '<div class="muted" style="margin-top:6px">School: <b>'+esc(SCHOOL.name)+'</b></div>'+
  '<button class="btn danger" style="margin-top:12px" onclick="doLogout()">Sign Out</button></div>';
}
window.pageSettings=pageSettings;

async function saveSchool(){
  var body={
    name:document.getElementById('s_name').value.trim(),
    telephone:document.getElementById('s_phone').value.trim(),
    address:document.getElementById('s_addr').value.trim(),
    head_teacher:document.getElementById('s_head').value.trim(),
    logo_url:document.getElementById('s_logo').value.trim()
  };
  try{
    await rest('/rest/v1/schools?id=eq.'+SCHOOL_ID,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});
    SCHOOL=Object.assign(SCHOOL,body);
    renderHeader();
    toast('Saved','ok');
  }catch(e){toast(e.message,'bad');}
}
window.saveSchool=saveSchool;
