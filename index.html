<style>
:root{--navy:#0a2540;--navy3:#1e3a5c;--gold:#d4a017;--bg:#eef2f7;--line:#e2e8f0;--line2:#eef1f6;--text:#0a2540;--text2:#334155;--muted:#64748b;--ok:#059669;--oksoft:#ecfdf5;--warn:#d97706;--warnsoft:#fffbeb;--bad:#dc2626;--badsoft:#fef2f2;--brandsoft:#e0e9f5;--radius:14px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:'Inter',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:all .15s}
input,select,textarea{font-family:inherit;width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--text);font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 4px rgba(10,37,64,.1)}
label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:6px;font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line2);font-size:13.5px}
th{color:#fff;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;background:var(--navy)}
tbody tr:hover{background:#f9fafb}
h1{font-size:20px;font-weight:700;margin:0 0 4px;color:var(--navy)}
h3{font-size:15px;font-weight:700;margin:0 0 12px;color:var(--navy)}
.muted{color:var(--muted);font-size:12.5px}
.topbar{position:fixed;top:0;left:0;right:0;height:48px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 12px;z-index:100;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar .title{flex:1;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.topbar .icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:16px}
.topbar .icon-btn:hover{background:rgba(255,255,255,.1)}
#app{min-height:100vh;padding-top:48px;padding-bottom:90px;background:var(--bg);display:none}
.container{max-width:1100px;margin:0 auto;padding:0 12px}
.header-wrap{padding:12px}
.header-card{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 24px -8px rgba(10,37,64,.4)}
.header-top{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px}
.admin-chip{background:rgba(255,255,255,.15);color:#fff;font-size:10.5px;font-weight:700;padding:4px 12px;border-radius:999px;text-transform:uppercase;border:1px solid rgba(255,255,255,.2)}
.exit-chip{background:#dc2626;color:#fff;font-size:10.5px;font-weight:700;padding:4px 12px;border-radius:999px;text-transform:uppercase;cursor:pointer}
.header-school{display:flex;align-items:flex-start;gap:10px;font-size:16px;font-weight:800;margin-bottom:8px;text-transform:uppercase}
.header-school .logo{width:44px;height:44px;border-radius:10px;background:var(--gold);display:grid;place-items:center;font-size:20px;flex-shrink:0;color:var(--navy);overflow:hidden}

.header-meta{font-size:12.5px;color:#cbd5e1;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}

.header-datetime{font-size:12.5px;color:#cbd5e1;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

.badge.warn{background:var(--warnsoft);color:#92400e;border:1px solid #fde68a}
.btn{background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--navy3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn.ghost:hover{background:#f8fafc;border-color:var(--navy)}
.btn.danger{background:var(--bad)}
.btn.ok{background:var(--ok)}
.btn.gold{background:var(--gold)}
.btn.wa{background:#25D366;color:#fff}
.btn.sm{padding:6px 12px;font-size:11.5px;border-radius:999px}

.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:6px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;z-index:1000;font-size:13px;font-weight:500;box-shadow:0 20px 40px -12px rgba(10,37,64,.5);max-width:90vw;text-align:center}

.auth-bg{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),#2c5282);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;overflow:auto}
.auth-card{background:#fff;border-radius:20px;padding:30px 26px;width:100%;max-width:440px;box-shadow:0 40px 80px -20px rgba(0,0,0,.5);margin:auto}

.modal{background:#fff;border-radius:20px 20px 0 0;max-width:680px;width:100%;max-height:92vh;overflow:auto;padding:22px}

.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line2);flex-wrap:wrap}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:90;box-shadow:0 -4px 16px rgba(10,37,64,.08)}
.bottom-bar-inner{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:1100px;margin:0 auto}

.alert-item{display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;background:#fff;border-left:4px solid var(--gold);margin-bottom:8px;font-size:13px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.alert-item.danger{border-left-color:var(--bad)}
.alert-item.ok{border-left-color:var(--ok)}
.alert-item.info{border-left-color:#2c5282}
.alert-item .ico{font-size:20px}
.alert-item .txt{flex:1}
.alert-item .txt b{display:block;color:var(--navy)}
.alert-item .txt span{color:var(--muted);font-size:12px;display:block}
.profile-hero{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;border-radius:16px;padding:20px;margin-bottom:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.profile-hero .avatar{width:72px;height:72px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:28px;font-weight:800;flex-shrink:0}
.profile-hero .info{flex:1;min-width:200px}
.profile-hero .info h1{color:#fff;font-size:20px;margin:0 0 4px}
.profile-hero .info .meta{color:#cbd5e1;font-size:12.5px;line-height:1.7}
.tabs-bar{display:flex;gap:6px;overflow-x:auto;padding:4px 0;border-bottom:2px solid var(--line);margin-bottom:14px;scrollbar-width:none}
.tabs-bar::-webkit-scrollbar{display:none}
.tabs-bar button{flex:0 0 auto;padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs-bar button.active{color:var(--navy);border-bottom-color:var(--gold)}
@media print{.no-print{display:none!important}.container{padding:0;max-width:none}}
</style>

<script>
const SUPA_URL='https://wabeempxckdtjvrkzhpv.supabase.co';
const SUPA_KEY='sb_publishable_n0uAm0Gcq7qR2dJM4jMZGQ_wiV__Cfp';

let _memoryStore={};
const safeStorage={
  getItem:k=>{try{return localStorage.getItem(k);}catch(e){return _memoryStore[k]||null;}},
  setItem:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){_memoryStore[k]=String(v);}},
  removeItem:k=>{try{localStorage.removeItem(k);}catch(e){delete _memoryStore[k];}}
};

function getCurrentYear(){return parseInt(safeStorage.getItem('eudes_year'))||new Date().getFullYear();}
function getCurrentTerm(){return parseInt(safeStorage.getItem('eudes_term'))||1;}
function setCurrentPeriod(y,t){safeStorage.setItem('eudes_year',String(y));safeStorage.setItem('eudes_term',String(t));}

function getToken(){const s=safeStorage.getItem('eudes_session');if(!s)return null;try{return JSON.parse(s).access_token;}catch(e){return null;}}
function getUser(){const s=safeStorage.getItem('eudes_session');if(!s)return null;try{return JSON.parse(s).user;}catch(e){return null;}}
function setSession(d){if(d)safeStorage.setItem('eudes_session',JSON.stringify(d));else safeStorage.removeItem('eudes_session');}

async function rest(path,options){
  options=options||{};
  const headers=Object.assign({'apikey':SUPA_KEY,'Content-Type':'application/json'},options.headers||{});
  const token=getToken();
  headers['Authorization']='Bearer '+(token||SUPA_KEY);
  const res=await fetch(SUPA_URL+path,Object.assign({},options,{headers}));
  const text=await res.text();
  let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok){
    if(res.status===401){setSession(null);alert('Session expired. Please sign in again.');window.location.reload();throw new Error('Session expired');}
    throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status));
  }
  return data;
}
async function auth(path,body){
  const res=await fetch(SUPA_URL+path,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const text=await res.text();
  let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok)throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status));
  return data;
}

let _profile=null,_school=null,_schoolId=null,_role=null,_classesCache=null;
let _profileStudentId=null,_profileTab='overview';

function toast(msg,type){const el=document.createElement('div');el.className='toast'+(type==='bad'?' bad':(type==='ok'?' ok':''));el.textContent=msg;document.getElementById('toastRoot').appendChild(el);setTimeout(()=>el.remove(),3500);}
function modal(html){const root=document.getElementById('modalRoot');root.innerHTML='<div class="modal-bg"><div class="modal">'+html+'</div></div>';root.querySelector('.modal-bg').addEventListener('click',e=>{if(e.target.classList.contains('modal-bg'))closeModal();});}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtUGX(n){if(n==null||isNaN(n))return 'UGX 0';return 'UGX '+(Number(n)||0).toLocaleString();}
function fmtNum(n){if(n==null||isNaN(n))return '0';return (Number(n)||0).toLocaleString();}
function fmtDate(ts){if(!ts)return '—';const d=new Date(ts);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function fmtLongDate(d){return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});}
function fmtDateTime(ts){if(!ts)return '—';const d=new Date(ts);return fmtDate(ts)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function telLink(num){if(!num)return '';return String(num).replace(/[^0-9+]/g,'');}
function waLink(num){if(!num)return '';let clean=String(num).replace(/[^0-9]/g,'');if(clean.startsWith('0'))clean='256'+clean.slice(1);return clean;}

window.toast=toast;window.modal=modal;window.closeModal=closeModal;window.esc=esc;
window.fmtUGX=fmtUGX;window.fmtNum=fmtNum;window.fmtDate=fmtDate;

function printHTML(title,bodyHTML){
  const w=window.open('','_blank');
  if(!w){toast('Allow popups','bad');return;}
  const logo=_school&&(_school.logo_data||_school.logo_url);
  w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>'+esc(title)+'</title><style>'+
    '*{box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;color:#111;padding:20px;margin:0;font-size:13px}'+
    '.header{text-align:center;padding-bottom:14px;border-bottom:2px solid #0a2540;margin-bottom:14px}'+
    '.header img{width:70px;height:70px;object-fit:contain;margin-bottom:8px}'+

function switchTab(which){
  document.getElementById('tabLogin').classList.toggle('active',which==='login');
  document.getElementById('tabRegister').classList.toggle('active',which==='register');
  document.getElementById('loginForm').style.display=which==='login'?'block':'none';

async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass=document.getElementById('loginPass').value;
  const err=document.getElementById('loginErr');
  const btn=document.getElementById('loginBtn');
  err.style.display='none';
  if(!email||!pass){err.textContent='Enter email and password';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='Signing in…';
  try{const data=await auth('/auth/v1/token?grant_type=password',{email,password:pass});setSession(data);await boot();}
  catch(e){err.textContent=e.message;err.style.display='block';}
  btn.disabled=false;btn.textContent='Sign In';
}
window.doLogin=doLogin;

async function doRegister(){
  const name=document.getElementById('regName').value.trim();
  const email=document.getElementById('regEmail').value.trim().toLowerCase();
  const pass=document.getElementById('regPass').value;
  const school=document.getElementById('regSchool').value.trim();
  const slug=document.getElementById('regSlug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-');
  const addr=document.getElementById('regAddr').value.trim();
  const phone=document.getElementById('regPhone').value.trim();
  const head=document.getElementById('regHead').value.trim();
  const err=document.getElementById('regErr');const ok=document.getElementById('regOk');const btn=document.getElementById('regBtn');
  err.style.display='none';ok.style.display='none';
  if(!name||!email||!pass||!school||!slug){err.textContent='Fill all required fields';err.style.display='block';return;}
  if(pass.length<8){err.textContent='Password min 8 characters';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='Creating…';
  try{
    const data=await auth('/auth/v1/signup',{email,password:pass,data:{full_name:name}});
    if(!data.access_token){ok.textContent='Check your email to confirm, then sign in.';ok.style.display='block';btn.disabled=false;btn.textContent='Create School';return;}
    setSession(data);
    await rest('/rest/v1/rpc/create_school_and_become_owner',{method:'POST',body:JSON.stringify({p_school_name:school,p_school_slug:slug,p_motto:null,p_address:addr||null,p_telephone:phone||null,p_email:email,p_head_teacher:head||null})});
    ok.textContent='School created! Pending approval. WhatsApp +254757208077.';ok.style.display='block';
    setTimeout(boot,500);
  }catch(e){err.textContent=e.message;err.style.display='block';}
  btn.disabled=false;btn.textContent='Create School';
}
window.doRegister=doRegister;

async function doLogout(){
  if(!confirm('Sign out?'))return;
  try{const t=getToken();if(t)await fetch(SUPA_URL+'/auth/v1/logout',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+t}});}catch(e){}
  setSession(null);_profile=null;_school=null;_schoolId=null;_role=null;_classesCache=null;
  document.getElementById('app').style.display='none';
  document.getElementById('authScreen').style.display='flex';
}

async function boot(){
  const user=getUser(),token=getToken();
  if(!user||!token){document.getElementById('authScreen').style.display='flex';document.getElementById('app').style.display='none';return;}
  try{const p=await rest('/rest/v1/profiles?id=eq.'+user.id+'&select=*');_profile=p&&p[0];}
  catch(e){document.getElementById('loginErr').textContent='Profile error: '+e.message;document.getElementById('loginErr').style.display='block';return;}
  if(!_profile){document.getElementById('loginErr').textContent='Profile not found.';document.getElementById('loginErr').style.display='block';return;}
  _schoolId=_profile.school_id;_role=_profile.role;
  if(!_schoolId){
    switchTab('register');
    document.getElementById('regErr').textContent='Account not linked to a school. Please create one.';
    document.getElementById('regErr').style.display='block';
    return;
  }
  try{const sc=await rest('/rest/v1/schools?id=eq.'+_schoolId+'&select=*');_school=sc&&sc[0];}catch(e){}
  if(!_school||!_school.is_approved){
    document.getElementById('loginErr').innerHTML='⏳ School pending approval. WhatsApp <b>+254757208077</b>.';
    document.getElementById('loginErr').style.display='block';
    return;
  }
  document.getElementById('authScreen').style.display='none';
  document.getElementById('app').style.display='block';
  populateTermSelector();renderHeader();renderAuthLogo();renderNav();renderBottomBar();tickClock();
  setInterval(tickClock,30000);
  await nav('dashboard');
}
window.boot=boot;

async function pageDashboard(root){

    rest('/rest/v1/students?school_id=eq.'+_schoolId+'&select=id,status,residence,balance_bf,actual_fee,holiday_fee,academics_fee,functional_fee,transport_fee,deposit_1,deposit_2,deposit_3').catch(()=>[]),
    rest('/rest/v1/classes?school_id=eq.'+_schoolId+'&select=id,name,sort_order&order=sort_order').catch(()=>[]),
    rest('/rest/v1/payments?school_id=eq.'+_schoolId+'&select=student_id,amount,paid_at').catch(()=>[]),
    rest('/rest/v1/pass_outs?school_id=eq.'+_schoolId+'&status=eq.out&select=id').catch(()=>[]),

  ]);
  const active=students.filter(s=>s.status==='active'||!s.status);
  let totalCharged=0,totalCollected=0,debtors=0;
  active.forEach(s=>{
    const charged=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.holiday_fee)||0)+(Number(s.academics_fee)||0)+(Number(s.functional_fee)||0)+(Number(s.transport_fee)||0);
    const collected=(Number(s.deposit_1)||0)+(Number(s.deposit_2)||0)+(Number(s.deposit_3)||0);
    totalCharged+=charged;totalCollected+=collected;

  const todayColl=payments.filter(p=>(p.paid_at||'').slice(0,10)===today).reduce((s,p)=>s+Number(p.amount),0);
  root.innerHTML=
  '<div class="page-head"><div><h1>Dashboard</h1><div class="sub">'+cy+' · Term '+ct+' · '+fmtLongDate(new Date())+'</div></div>'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="addStudent()">＋ Register Pupil</button></div></div>'+

  '<div class="kpi kpi-ok"><div class="v">'+fmtUGX(totalCollected)+'</div><div class="l">Fees Collected</div></div>'+
  '<div class="kpi kpi-bad"><div class="v">'+fmtUGX(totalCharged-totalCollected)+'</div><div class="l">Outstanding</div></div>'+
  '<div class="kpi"><div class="v">'+fmtUGX(todayColl)+'</div><div class="l">Today Revenue</div></div>'+
  '</div>'+
  '<div class="grid grid-2" style="margin-bottom:14px">'+
  '<div class="card"><h3>🔔 Alerts</h3>'+
  (debtors>0?'<div class="alert-item danger"><span class="ico">⚠️</span><div class="txt"><b>'+debtors+' debtors</b><span>'+fmtUGX(totalCharged-totalCollected)+' outstanding</span></div></div>':'')+
  (passOuts.length>0?'<div class="alert-item danger"><span class="ico">🚪</span><div class="txt"><b>'+passOuts.length+' pupil(s) currently OUT</b></div></div>':'')+
  (debtors===0&&passOuts.length===0?'<div class="alert-item ok"><span class="ico">✅</span><div class="txt"><b>All normal</b></div></div>':'')+
  '</div>'+
  '<div class="card"><h3>🏫 Snapshot</h3><div class="grid grid-3">'+
  '<div><div class="muted">Classes</div><div style="font-size:20px;font-weight:800;color:var(--navy)">'+classes.length+'</div></div>'+
  '<div><div class="muted">Staff</div><div style="font-size:20px;font-weight:800;color:var(--navy)">'+staff.length+'</div></div>'+
  '<div><div class="muted">Payments</div><div style="font-size:20px;font-weight:800;color:var(--navy)">'+payments.length+'</div></div>'+
  '</div></div></div>';

function filterStudentsTable(q,fClass){
  q=(q||'').toLowerCase();fClass=fClass||'';
  window._stFilterSearch=q;
  const fRes=document.getElementById('studentResFilter')?.value||'';
  const classes=_classesCache||[];
  const filtered=(window._allStudents||[]).filter(s=>{
    if(fClass&&s.class_id!==fClass)return false;
    if(fRes&&s.residence!==fRes)return false;
    if(q){const hay=(s.first_name+' '+(s.last_name||'')+' '+s.admission_no).toLowerCase();if(hay.indexOf(q)===-1)return false;}
    return true;
  });
  window._filteredStudents=filtered;
  document.getElementById('studentCount').textContent=(window._allStudents||[]).length+' total · '+filtered.length+' shown';
  const c=document.getElementById('studentsTableContainer');
  if(!filtered.length){c.innerHTML='<div class="empty">No pupils match.</div>';return;}
  let rows='';
  filtered.forEach(s=>{
    const cls=classes.find(x=>x.id===s.class_id);
    const charged=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.holiday_fee)||0)+(Number(s.academics_fee)||0)+(Number(s.functional_fee)||0)+(Number(s.transport_fee)||0);
    const collected=(Number(s.deposit_1)||0)+(Number(s.deposit_2)||0)+(Number(s.deposit_3)||0);
    const bal=charged-collected;
    rows+='<tr>'+
      '<td><b>'+esc(s.admission_no)+'</b></td>'+
      '<td><a href="javascript:void(0)" onclick="nav(\'student_profile\',\''+s.id+'\')" style="color:var(--navy);font-weight:600;text-decoration:none">'+esc(s.first_name+' '+(s.last_name||''))+'</a></td>'+
      '<td>'+(cls?'<span class="badge info">'+esc(cls.name)+'</span>':'<span class="badge bad">No class</span>')+'</td>'+
      '<td>'+(s.residence==='boarding'?'<span class="badge warn">Board</span>':'<span class="badge ok">Day</span>')+'</td>'+
      '<td style="text-align:right"><span class="badge '+(bal>0?'bad':'ok')+'">'+fmtNum(bal)+'</span></td>'+
      '<td style="text-align:right;white-space:nowrap">'+
      '<button class="btn sm" onclick="nav(\'student_profile\',\''+s.id+'\')" title="Profile">👤</button> '+
      '<button class="btn sm gold" onclick="recordPayment(\''+s.id+'\')" title="Pay">💵</button> '+
      '<button class="btn sm ghost" onclick="editStudent(\''+s.id+'\')" title="Edit">✏️</button> '+
      '<button class="btn sm danger" onclick="deleteStudent(\''+s.id+'\')" title="Delete">✕</button>'+
      '</td></tr>';
  });
  c.innerHTML='<div class="table-wrap"><table><thead><tr><th>ADM</th><th>Name</th><th>Class</th><th>R</th><th style="text-align:right">Balance</th><th style="text-align:right">Actions</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
window.filterStudentsTable=filterStudentsTable;

async function saveStudent(id){
  const feeFields={
    balance_bf:Number(document.getElementById('m_bf').value)||0,
    actual_fee:Number(document.getElementById('m_fee').value)||0,
    holiday_fee:Number(document.getElementById('m_hol').value)||0,
    academics_fee:Number(document.getElementById('m_acad').value)||0,
    functional_fee:Number(document.getElementById('m_func').value)||0,
    transport_fee:Number(document.getElementById('m_trans').value)||0,
    deposit_1:Number(document.getElementById('m_d1').value)||0,
    deposit_2:Number(document.getElementById('m_d2').value)||0,
    deposit_3:Number(document.getElementById('m_d3').value)||0
  };
  const charged=feeFields.balance_bf+feeFields.actual_fee+feeFields.holiday_fee+feeFields.academics_fee+feeFields.functional_fee+feeFields.transport_fee;
  const collected=feeFields.deposit_1+feeFields.deposit_2+feeFields.deposit_3;
  const body=Object.assign({
    school_id:_schoolId,
    admission_no:document.getElementById('m_adm').value.trim(),
    class_id:document.getElementById('m_class').value||null,
    first_name:document.getElementById('m_fn').value.trim(),
    last_name:document.getElementById('m_ln').value.trim()||null,
    gender:document.getElementById('m_gender').value||null,
    date_of_birth:document.getElementById('m_dob').value||null,
    residence:document.getElementById('m_res').value,
    parent_name:document.getElementById('m_par').value.trim()||null,
    parent_contact:document.getElementById('m_pc').value.trim()||null,
    total_expected:charged,
    current_balance:charged-collected
  },feeFields);
  if(!body.admission_no||!body.first_name){toast('ADM and First Name required','bad');return;}
  if(!body.class_id){toast('Select class','bad');return;}
  try{
    if(id)await rest('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});
    else await rest('/rest/v1/students',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});
    toast('Saved','ok');closeModal();nav(activeRoute);
  }catch(e){toast(e.message,'bad');}
}
window.saveStudent=saveStudent;

async function savePayment(studentId){
  const amount=Number(document.getElementById('p_amount').value);
  const payment_for=document.getElementById('p_for').value;
  const method=document.getElementById('p_method').value;
  const notes=document.getElementById('p_notes').value.trim();
  if(!amount||amount<=0){toast('Enter amount','bad');return;}
  const s=(window._allStudents||[]).find(x=>x.id===studentId);
  if(!s){toast('Pupil not found','bad');return;}
  try{
    await rest('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({
      school_id:_schoolId,student_id:studentId,receipt_no:'RCP-'+Date.now(),
      year:getCurrentYear(),term:getCurrentTerm(),academic_year:getCurrentYear(),
      amount,method,payment_method:method,payment_for,notes:notes||null,
      received_by:_profile?_profile.id:null
    })});
    const dep={deposit_1:Number(s.deposit_1)||0,deposit_2:Number(s.deposit_2)||0,deposit_3:Number(s.deposit_3)||0};
    if(!dep.deposit_1)dep.deposit_1=amount;else if(!dep.deposit_2)dep.deposit_2=amount;else dep.deposit_3+=amount;
    const charged=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.holiday_fee)||0)+(Number(s.academics_fee)||0)+(Number(s.functional_fee)||0)+(Number(s.transport_fee)||0);
    const newCollected=dep.deposit_1+dep.deposit_2+dep.deposit_3;
    await rest('/rest/v1/students?id=eq.'+studentId,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify(Object.assign({current_balance:charged-newCollected},dep))});
    toast('Payment recorded','ok');closeModal();nav(activeRoute);
  }catch(e){toast(e.message,'bad');}
}
window.savePayment=savePayment;

  '<div class="kpi kpi-navy"><div class="v">'+students.length+'</div><div class="l">Pupils</div></div>'+
  '<div class="kpi"><div class="v">'+fmtUGX(tCharged)+'</div><div class="l">Total Charged</div></div>'+
  '<div class="kpi kpi-ok"><div class="v">'+fmtUGX(tCollected)+'</div><div class="l">Collected</div></div>'+
  '<div class="kpi kpi-bad"><div class="v">'+fmtUGX(tCharged-tCollected)+'</div><div class="l">Outstanding</div></div>'+
  '</div>'+
  '<div class="card"><div class="grid grid-2" style="margin-bottom:12px">'+
  '<input id="feeSearch" placeholder="Search…" oninput="renderFeesTable()">'+
  '<select id="feeClassFilter" onchange="renderFeesTable()"><option value="">All classes</option>'+(classes||[]).map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select>'+
  '</div><div id="feesTableContainer"></div></div>';
  renderFeesTable();
}
window.pageFees=pageFees;

function renderFeesTable(){
  const q=(document.getElementById('feeSearch').value||'').toLowerCase();
  const fClass=document.getElementById('feeClassFilter').value||'';
  const classes=_classesCache||[];
  const filtered=(window._allStudents||[]).filter(s=>{
    if(fClass&&s.class_id!==fClass)return false;
    if(q){const hay=(s.first_name+' '+(s.last_name||'')+' '+s.admission_no).toLowerCase();if(hay.indexOf(q)===-1)return false;}
    return true;
  });
  const c=document.getElementById('feesTableContainer');
  if(!filtered.length){c.innerHTML='<div class="empty">No pupils.</div>';return;}
  let rows='',tCharged=0,tPaid=0;
  filtered.forEach(s=>{
    const cls=classes.find(x=>x.id===s.class_id);
    const charged=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.holiday_fee)||0)+(Number(s.academics_fee)||0)+(Number(s.functional_fee)||0)+(Number(s.transport_fee)||0);
    const paid=(Number(s.deposit_1)||0)+(Number(s.deposit_2)||0)+(Number(s.deposit_3)||0);
    const bal=charged-paid;
    tCharged+=charged;tPaid+=paid;
    rows+='<tr>'+
      '<td>'+esc(s.admission_no)+'</td>'+
      '<td><a href="javascript:void(0)" onclick="nav(\'student_profile\',\''+s.id+'\')" style="color:var(--navy);font-weight:600;text-decoration:none">'+esc(s.first_name+' '+(s.last_name||''))+'</a></td>'+
      '<td>'+esc(cls?cls.name:'—')+'</td>'+
      '<td style="text-align:right">'+fmtNum(s.balance_bf)+'</td>'+
      '<td style="text-align:right">'+fmtNum(s.actual_fee)+'</td>'+
      '<td style="text-align:right">'+fmtNum(s.functional_fee)+'</td>'+
      '<td style="text-align:right">'+fmtNum(s.transport_fee)+'</td>'+
      '<td style="text-align:right">'+fmtNum(s.deposit_1)+'</td>'+
      '<td style="text-align:right">'+fmtNum(s.deposit_2)+'</td>'+
      '<td style="text-align:right">'+fmtNum(s.deposit_3)+'</td>'+
      '<td style="text-align:right;font-weight:700">'+fmtNum(charged)+'</td>'+
      '<td style="text-align:right;font-weight:700;color:'+(bal>0?'#b91c1c':'#047857')+'">'+fmtNum(bal)+'</td>'+
      '<td><button class="btn sm" onclick="recordPayment(\''+s.id+'\')">💵</button></td></tr>';
  });
  c.innerHTML='<div class="table-wrap"><table style="font-size:12px"><thead><tr><th>ADM</th><th>Name</th><th>Class</th><th style="text-align:right">B/F</th><th style="text-align:right">Actual</th><th style="text-align:right">Funct</th><th style="text-align:right">Trans</th><th style="text-align:right">D1</th><th style="text-align:right">D2</th><th style="text-align:right">D3</th><th style="text-align:right">Total</th><th style="text-align:right">Balance</th><th></th></tr></thead><tbody>'+rows+'</tbody>'+
  '<tfoot><tr style="background:#f1f5f9;font-weight:700"><td colspan="10" style="text-align:right">TOTALS</td><td style="text-align:right">'+fmtNum(tCharged)+'</td><td style="text-align:right;color:#b91c1c">'+fmtNum(tCharged-tPaid)+'</td><td></td></tr></tfoot></table></div>';
}
window.renderFeesTable=renderFeesTable;

/* ============================================================
   SETTINGS
   ============================================================ */
async function pageSettings(root){
  root.innerHTML=
  '<div class="page-head"><h1>⚙️ Settings</h1></div>'+
  '<div class="card"><h3>School Info</h3>'+
  '<div class="grid grid-2"><div><label>Name</label><input id="s_name" value="'+esc(_school?.name||'')+'"></div><div><label>Telephone</label><input id="s_phone" value="'+esc(_school?.telephone||'')+'"></div>'+
  '<div><label>Address</label><input id="s_addr" value="'+esc(_school?.address||'')+'"></div><div><label>Head Teacher</label><input id="s_head" value="'+esc(_school?.head_teacher||'')+'"></div></div>'+
  '<div style="margin-top:12px"><label>Logo URL</label><input id="s_logo" value="'+esc(_school?.logo_url||'')+'"></div>'+
  '<button class="btn" style="margin-top:14px" onclick="saveSchool()">💾 Save</button></div>'+
  '<div class="card"><h3>Account</h3><div class="muted">Signed in as <b>'+esc(_profile?.full_name||'')+'</b></div>'+
  '<div class="muted" style="margin-top:6px">Role: <b>'+esc(_role||'')+'</b></div>'+
  '<button class="btn danger" style="margin-top:12px" onclick="doLogout()">Sign Out</button></div>';
}
window.pageSettings=pageSettings;

async function saveSchool(){
  const body={name:document.getElementById('s_name').value.trim(),telephone:document.getElementById('s_phone').value.trim(),address:document.getElementById('s_addr').value.trim(),head_teacher:document.getElementById('s_head').value.trim(),logo_url:document.getElementById('s_logo').value.trim()};
  try{await rest('/rest/v1/schools?id=eq.'+_schoolId,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});_school=Object.assign(_school,body);renderHeader();toast('Saved','ok');}
  catch(e){toast(e.message,'bad');}
}
window.saveSchool=saveSchool;

if(getUser()&&getToken()){boot();}
</script>
