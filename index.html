<!DOCTYPE html>

<head>

<style>
:root{--bg:#f4f6fb;--line:#e5e9f0;--line2:#eef1f6;--text:#0b1220;--text2:#334155;--muted:#64748b;--brand:#4f46e5;--brand2:#4338ca;--brandsoft:#eef2ff;--ring:rgba(79,70,229,.15);--ok:#059669;--oksoft:#ecfdf5;--warn:#d97706;--warnsoft:#fffbeb;--bad:#dc2626;--badsoft:#fef2f2;--radius:14px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:'Inter',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:all .15s}
input,select,textarea{font-family:inherit;width:100%;padding:11px 14px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--text);font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--ring)}
label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:6px;font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line2);font-size:13.5px}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;background:#f9fafb}
tbody tr:hover{background:#f9fafb}
h1{font-size:22px;font-weight:700;margin:0 0 4px}
h3{font-size:15px;font-weight:700;margin:0 0 12px}
.muted{color:var(--muted);font-size:12.5px}
#app{display:flex;min-height:100vh;flex-direction:row-reverse}
#sidebar{width:250px;background:#0f172a;color:#cbd5e1;display:flex;flex-direction:column;padding:60px 14px 20px;flex-shrink:0}
#sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:16px}
#sidebar .brand .mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px}
#sidebar .brand .name{font-size:13.5px;font-weight:700;color:#fff}
#sidebar .brand .sub{font-size:10px;color:#94a3b8;letter-spacing:.06em;text-transform:uppercase}
#schoolBadge{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);padding:12px;border-radius:12px;margin-bottom:16px;font-size:12px;color:#e2e8f0}
#schoolBadge b{display:block;font-size:12.5px;font-weight:600;color:#fff;margin-bottom:3px;line-height:1.3}
#schoolBadge .muted{color:#8ea1bb;font-size:11px}
#sidebar nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
#sidebar nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;color:#cbd5e1;font-weight:500}
#sidebar nav a:hover{background:rgba(255,255,255,.06);color:#fff}
#sidebar nav a.active{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;font-weight:600}
#sidebar .logout{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;color:#94a3b8;margin-top:8px;border-top:1px solid rgba(255,255,255,.06);padding-top:14px}
#sidebar .logout:hover{color:#fca5a5}
#main{flex:1;padding:80px 36px 28px;overflow:auto;min-width:0}
#termBar{position:fixed;top:0;left:0;right:0;background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;padding:8px 16px;font-size:13px;font-weight:600;z-index:40;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#termBar select{width:auto;padding:4px 8px;border-radius:6px;border:none;font-size:13px;font-weight:600;color:#1e1b4b;background:#fff}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:3px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.grid{display:grid;gap:16px}
.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-size:12px;margin-top:4px;font-weight:500}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600}
.badge.ok{background:var(--oksoft);color:#047857;border:1px solid #a7f3d0}
.badge.bad{background:var(--badsoft);color:#b91c1c;border:1px solid #fecaca}
.badge.info{background:var(--brandsoft);color:var(--brand2);border:1px solid #c7d2fe}
.badge.warn{background:var(--warnsoft);color:#92400e;border:1px solid #fde68a}
.badge.req{background:#e0e7ff;color:#3730a3;border:1px solid #a5b4fc}
.btn{background:var(--brand);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--brand2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--text2)}
.btn.ghost:hover{background:#f9fafb}
.btn.danger{background:var(--bad)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
.toast{position:fixed;bottom:20px;left:20px;background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;z-index:100;font-size:13.5px;font-weight:500;box-shadow:0 20px 40px -12px rgba(15,23,42,.5)}
.toast.bad{background:#7f1d1d}
.toast.ok{background:#065f46}
.auth-bg{position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,#4f46e5 0%,transparent 50%),radial-gradient(circle at 80% 80%,#7c3aed 0%,transparent 50%),#0b1220;display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;overflow:auto}
.auth-card{background:#fff;border-radius:20px;padding:36px;width:100%;max-width:440px;box-shadow:0 40px 80px -20px rgba(0,0,0,.5)}
.auth-card .logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;margin:0 auto 16px}
.auth-card h1{text-align:center;font-size:19px;margin:0 0 6px}
.auth-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs button{flex:1;padding:11px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.active{color:var(--brand);border-bottom-color:var(--brand)}
.err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:11px 14px;border-radius:10px;margin-top:14px;font-size:13px}
.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#047857;padding:11px 14px;border-radius:10px;margin-top:14px;font-size:13px}
.loading{padding:60px;text-align:center;color:var(--muted);font-size:14px}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:14px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:26px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line2);flex-wrap:wrap}
.wa-float{position:fixed;bottom:20px;right:20px;background:#25D366;color:#fff;padding:12px 18px;border-radius:50px;font-weight:600;z-index:999;text-decoration:none;box-shadow:0 10px 20px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;font-size:14px}
.wa-float:hover{background:#20BA5A;color:#fff}
@media(max-width:900px){
  #app{flex-direction:column}
  #sidebar{width:100%;flex-direction:column;padding:60px 12px 12px}
  #sidebar .brand{padding:0 0 10px;margin:0}
  #sidebar nav{flex-direction:row;overflow-x:auto;gap:6px;padding:6px 0}
  #sidebar nav a{flex:0 0 auto;padding:8px 12px;font-size:12.5px;background:rgba(255,255,255,.05);border-radius:999px}
  #main{padding:80px 16px 16px}
  .grid-kpi{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<a href="https://wa.me/254757208077" target="_blank" class="wa-float">💬 Need Help? WhatsApp Us</a>

<div class="auth-bg" id="authScreen">
  <div class="auth-card">
    <div class="logo">E</div>

<div id="app" style="display:none">
  <div id="termBar">

</div>

<script>
const SUPA_URL = 'https://wabeempxckdtjvrkzhpv.supabase.co';
const SUPA_KEY = 'sb_publishable_n0uAm0Gcq7qR2dJM4jMZGQ_wiV__Cfp';
const FUNC_FEE_DEFAULT = 70000;

function getCurrentYear(){ return parseInt(safeStorage.getItem('eudes_year')) || new Date().getFullYear(); }
function getCurrentTerm(){ return parseInt(safeStorage.getItem('eudes_term')) || 1; }
function setCurrentPeriod(y,t){ safeStorage.setItem('eudes_year', String(y)); safeStorage.setItem('eudes_term', String(t)); }
window.getCurrentYear = getCurrentYear; window.getCurrentTerm = getCurrentTerm; window.setCurrentPeriod = setCurrentPeriod;

let _memoryStore = {};
const safeStorage = {
  getItem: k => { try { return localStorage.getItem(k); } catch(e){ return _memoryStore[k]||null; } },
  setItem: (k,v) => { try { localStorage.setItem(k,v); } catch(e){ _memoryStore[k]=String(v); } },
  removeItem: k => { try { localStorage.removeItem(k); } catch(e){ delete _memoryStore[k]; } }
};
function getToken(){ const s=safeStorage.getItem('eudes_session'); if(!s) return null; try { return JSON.parse(s).access_token; } catch(e){ return null; } }
function getUser(){ const s=safeStorage.getItem('eudes_session'); if(!s) return null; try { return JSON.parse(s).user; } catch(e){ return null; } }
function setSession(d){ if(d) safeStorage.setItem('eudes_session', JSON.stringify(d)); else safeStorage.removeItem('eudes_session'); }

async function rest(path, options){
  options = options || {};
  const headers = Object.assign({ 'apikey': SUPA_KEY, 'Content-Type': 'application/json' }, options.headers || {});
  const token = getToken();
  headers['Authorization'] = 'Bearer ' + (token || SUPA_KEY);
  const res = await fetch(SUPA_URL + path, Object.assign({}, options, { headers }));
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
  if(!res.ok){
    if (res.status === 401){ setSession(null); alert('Session expired. Please log in again.'); window.location.reload(); throw new Error('Session expired'); }
    throw new Error((data && (data.message || data.msg || data.error_description || data.error)) || text || ('HTTP ' + res.status));
  }
  return data;
}
async function auth(path, body){
  const res = await fetch(SUPA_URL + path, { method: 'POST', headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
  if(!res.ok) throw new Error((data && (data.message || data.msg || data.error_description || data.error)) || text || ('HTTP ' + res.status));
  return data;
}

let SESSION=null,_profile=null,_school=null,_schoolId=null,_role=null,_classesCache=null,_staffCache=null;

function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'bad' ? ' bad' : (type === 'ok' ? ' ok' : ''));
  el.textContent = msg;
  document.getElementById('toastRoot').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
function modal(html){
  const root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="modal-bg"><div class="modal">' + html + '</div></div>';
  root.querySelector('.modal-bg').addEventListener('click', e => { if(e.target.classList.contains('modal-bg')) closeModal(); });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtUGX(n){ return 'UGX ' + (Number(n)||0).toLocaleString(); }
function fmtDate(ts){ if(!ts) return '—'; const d = new Date(ts); return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear(); }
function fmtTime(ts){ if(!ts) return ''; return new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
function printHTML(title, bodyHTML){
  const w = window.open('', '_blank');
  w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>'+title+'</title><style>*{box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;color:#111;padding:20px;margin:0}h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 8px;color:#333}.muted{color:#666;font-size:12px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #ddd;font-size:12.5px}th{background:#f1f5f9;text-transform:uppercase;font-size:11px;letter-spacing:.05em;color:#555}.header{text-align:center;padding-bottom:14px;border-bottom:2px solid #111;margin-bottom:14px}.footer{text-align:center;font-size:10px;color:#888;margin-top:20px;padding-top:10px;border-top:1px solid #eee}.summary{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;background:#f8fafc;padding:12px;border-radius:8px;margin-top:12px;font-size:13px}.summary div b{display:block;font-size:11px;color:#666;text-transform:uppercase;margin-bottom:2px}@media print{@page{margin:10mm}}</style></head><body><div class="header"><h1>'+esc(_school ? _school.name : 'School')+'</h1><div class="muted">'+esc(_school?.address||'')+(_school?.telephone?' · '+esc(_school.telephone):'')+'</div><h2 style="margin-top:10px">'+title+'</h2><div class="muted">Printed: '+new Date().toLocaleString()+'</div></div>'+bodyHTML+'<div class="footer">Powered by EUDES MEDIA</div><script>setTimeout(()=>window.print(),300);<\/script></body></html>');
  w.document.close();
}
window.toast=toast;window.modal=modal;window.closeModal=closeModal;window.printHTML=printHTML;

function switchTab(which){
  document.getElementById('tabLogin').classList.toggle('active', which === 'login');
  document.getElementById('tabRegister').classList.toggle('active', which === 'register');
  document.getElementById('loginForm').style.display = which === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = which === 'register' ? 'block' : 'none';
}
window.switchTab = switchTab;

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  err.style.display = 'none';
  if(!email || !pass){ err.textContent = 'Enter email and password'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  try { const data = await auth('/auth/v1/token?grant_type=password', { email, password: pass }); setSession(data); await boot(); }
  catch(e){ err.textContent = e.message; err.style.display = 'block'; }
  btn.disabled = false; btn.textContent = 'Sign In';
}
window.doLogin = doLogin;

async function doRegister(){
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim().toLowerCase();
  const pass = document.getElementById('regPass').value;
  const school = document.getElementById('regSchool').value.trim();
  const slug = document.getElementById('regSlug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-');
  const addr = document.getElementById('regAddr').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const head = document.getElementById('regHead').value.trim();
  const motto = document.getElementById('regMotto').value.trim();
  const err = document.getElementById('regErr'); const ok = document.getElementById('regOk'); const btn = document.getElementById('regBtn');
  err.style.display = 'none'; ok.style.display = 'none';
  if(!name || !email || !pass || !school || !slug){ err.textContent = 'Fill all required fields'; err.style.display = 'block'; return; }
  if(pass.length < 8){ err.textContent = 'Password must be at least 8 characters'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const data = await auth('/auth/v1/signup', { email, password: pass, data: { full_name: name } });
    if(!data.access_token){ ok.textContent = 'Check your email to confirm, then sign in.'; ok.style.display = 'block'; btn.disabled = false; btn.textContent = 'Create School'; return; }
    setSession(data);
    await rest('/rest/v1/rpc/create_school_and_become_owner', { method: 'POST', body: JSON.stringify({ p_school_name: school, p_school_slug: slug, p_motto: motto || null, p_address: addr || null, p_telephone: phone || null, p_email: email, p_head_teacher: head || null }) });
    ok.textContent = 'School created. Pending approval. WhatsApp +254757208077.'; ok.style.display = 'block';
    setTimeout(boot, 500);
  } catch(e){ err.textContent = e.message; err.style.display = 'block'; }
  btn.disabled = false; btn.textContent = 'Create School';
}
window.doRegister = doRegister;

async function doLogout(){
  try { const t = getToken(); if(t) await fetch(SUPA_URL + '/auth/v1/logout', { method: 'POST', headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + t } }); } catch(e){}
  setSession(null); SESSION=null; _profile=null; _school=null; _schoolId=null; _role=null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('authScreen').style.display = 'flex';
}
window.doLogout = doLogout;

function populateTermSelector(){
  const ySel = document.getElementById('termYearSelect');
  const tSel = document.getElementById('termTermSelect');
  if(!ySel || !tSel) return;
  const cy = getCurrentYear(), ct = getCurrentTerm();
  const currentYear = new Date().getFullYear();
  const years = [];
  for (let y = currentYear - 2; y <= currentYear + 1; y++) years.push(y);
  if (!years.includes(cy)) years.push(cy);
  years.sort((a,b) => b - a);
  ySel.innerHTML = years.map(y => '<option value="' + y + '"' + (y===cy?' selected':'') + '>' + y + '</option>').join('');
  tSel.value = ct;
}
window.populateTermSelector = populateTermSelector;
function changePeriod(){
  const y = parseInt(document.getElementById('termYearSelect').value);

}

async function checkDuplicateStudent(admissionNo, firstName, lastName, parentContact, excludeId){
  if (admissionNo){
    const byAdm = await rest('/rest/v1/students?school_id=eq.' + _schoolId + '&admission_no=eq.' + encodeURIComponent(admissionNo) + '&select=id,first_name,last_name,admission_no' + (excludeId ? '&id=neq.' + excludeId : ''));
    if (byAdm && byAdm.length) return { reason: 'admission_no', existing: byAdm[0] };
  }
  if (firstName && parentContact){
    const n = await rest('/rest/v1/students?school_id=eq.' + _schoolId + '&first_name=ilike.' + encodeURIComponent(firstName) + '&parent_contact=eq.' + encodeURIComponent(parentContact) + '&select=id,first_name,last_name,admission_no,parent_contact' + (excludeId ? '&id=neq.' + excludeId : ''));
    if (n && n.length){ const ll=(lastName||'').toLowerCase(); const m=n.find(x => (x.last_name||'').toLowerCase()===ll || !lastName || !x.last_name); if (m) return { reason:'name_and_parent', existing:m }; }
  }
  if (firstName && lastName){
    const n = await rest('/rest/v1/students?school_id=eq.' + _schoolId + '&first_name=ilike.' + encodeURIComponent(firstName) + '&last_name=ilike.' + encodeURIComponent(lastName) + '&select=id,first_name,last_name,admission_no,parent_contact' + (excludeId ? '&id=neq.' + excludeId : ''));
    if (n && n.length) return { reason: 'exact_name', existing: n[0] };
  }
  return null;
}

async function renderRangeReport(title, start, end){
  const body = window._reportBody;
  const [att, pays, exps] = await Promise.all([
    rest('/rest/v1/attendance?school_id=eq.' + _schoolId + '&date=gte.' + start + '&date=lte.' + end + '&select=*').catch(()=>[]),
    rest('/rest/v1/payments?school_id=eq.' + _schoolId + '&paid_at=gte.' + start + 'T00:00:00&paid_at=lte.' + end + 'T23:59:59&select=*').catch(()=>[]),
    rest('/rest/v1/expenses?school_id=eq.' + _schoolId + '&date=gte.' + start + '&date=lte.' + end + '&select=*').catch(()=>[])
  ]);
  const present = att.filter(a => a.status === 'present').length;
  const absent = att.filter(a => a.status === 'absent').length;
  const collTotal = pays.reduce((s,p) => s + Number(p.amount), 0);
  const expTotal = exps.reduce((s,e) => s + Number(e.amount), 0);
  window._currentReportData = { title: title + ' (' + fmtDate(start) + ' → ' + fmtDate(end) + ')', att, pays, exps, present, absent, collTotal, expTotal };
  const dayData = {};
  const cur = new Date(start); const endD = new Date(end);
  while (cur <= endD){ dayData[cur.toISOString().slice(0,10)] = { coll:0, exp:0, pres:0, abs:0 }; cur.setDate(cur.getDate()+1); }
  pays.forEach(p => { const d = new Date(p.paid_at).toISOString().slice(0,10); if(dayData[d]) dayData[d].coll += Number(p.amount); });
  exps.forEach(e => { if(dayData[e.date]) dayData[e.date].exp += Number(e.amount); });
  att.forEach(a => { if(dayData[a.date]){ if(a.status==='present') dayData[a.date].pres++; if(a.status==='absent') dayData[a.date].abs++; } });
  const rows = Object.entries(dayData).map(([d, v]) =>
    '<tr><td>' + fmtDate(d) + '</td><td style="text-align:right">' + v.pres + '</td><td style="text-align:right">' + v.abs + '</td>' +
    '<td style="text-align:right;color:#047857">' + v.coll.toLocaleString() + '</td>' +
    '<td style="text-align:right;color:#b91c1c">' + v.exp.toLocaleString() + '</td>' +
    '<td style="text-align:right;font-weight:600">' + (v.coll - v.exp).toLocaleString() + '</td></tr>').join('');
  body.innerHTML =
    '<div class="grid grid-kpi" style="margin-bottom:20px">' +
      '<div class="kpi" style="background:var(--oksoft);border-color:#a7f3d0"><div class="l" style="color:#047857">✅ Present</div><div class="v" style="color:#065f46;font-size:22px">' + present + '</div></div>' +
      '<div class="kpi" style="background:var(--badsoft);border-color:#fecaca"><div class="l" style="color:#b91c1c">❌ Absent</div><div class="v" style="color:#7f1d1d;font-size:22px">' + absent + '</div></div>' +
      '<div class="kpi" style="background:var(--brandsoft);border-color:#c7d2fe"><div class="l" style="color:#4338ca">💰 Collected</div><div class="v" style="color:#3730a3;font-size:18px">' + fmtUGX(collTotal) + '</div></div>' +
      '<div class="kpi" style="background:linear-gradient(135deg,#fef3c7,#fde68a);border-color:#fcd34d"><div class="l" style="color:#92400e">💸 Expenses</div><div class="v" style="color:#78350f;font-size:18px">' + fmtUGX(expTotal) + '</div></div>' +
      '<div class="kpi" style="background:linear-gradient(135deg,#f3e8ff,#e9d5ff);border-color:#d8b4fe"><div class="l" style="color:#6b21a8">Net</div><div class="v" style="color:#581c87;font-size:18px">' + fmtUGX(collTotal - expTotal) + '</div></div>' +
      '<div class="kpi"><div class="l">Total Payments</div><div class="v" style="font-size:22px">' + pays.length + '</div></div></div>' +
    '<div class="card"><h3>📊 Daily Breakdown</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th style="text-align:right">Present</th><th style="text-align:right">Absent</th><th style="text-align:right">Collected</th><th style="text-align:right">Expenses</th><th style="text-align:right">Net</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}
window.renderRangeReport = renderRangeReport;

    rest('/rest/v1/attendance?school_id=eq.' + _schoolId + '&academic_year=eq.' + year + '&term=eq.' + term + '&select=*').catch(()=>[]),
    rest('/rest/v1/exams?school_id=eq.' + _schoolId + '&year=eq.' + year + '&term=eq.' + term + '&select=id').catch(()=>[]),

  const collTotal = pays.reduce((s,p) => s + Number(p.amount), 0);

  const schoolFees = pays.filter(p => p.payment_for !== 'Functional Fees').reduce((s,p) => s + Number(p.amount), 0);
  const funcFees = pays.filter(p => p.payment_for === 'Functional Fees').reduce((s,p) => s + Number(p.amount), 0);

  window._currentReportData = { title: 'Termly Report — ' + year + ' Term ' + term, att, pays, exps, present, absent, collTotal, expTotal };
  body.innerHTML =

      '<div class="kpi"><div class="l">Active Pupils</div><div class="v" style="font-size:22px">' + students.length + '</div></div>' +
      '<div class="kpi" style="background:var(--oksoft);border-color:#a7f3d0"><div class="l" style="color:#047857">✅ Days Present</div><div class="v" style="color:#065f46;font-size:22px">' + present + '</div></div>' +
      '<div class="kpi" style="background:var(--badsoft);border-color:#fecaca"><div class="l" style="color:#b91c1c">❌ Absences</div><div class="v" style="color:#7f1d1d;font-size:22px">' + absent + '</div></div>' +
      '<div class="kpi" style="background:var(--brandsoft);border-color:#c7d2fe"><div class="l" style="color:#4338ca">💰 Total Collected</div><div class="v" style="color:#3730a3;font-size:18px">' + fmtUGX(collTotal) + '</div></div>' +
      '<div class="kpi" style="background:linear-gradient(135deg,#fef3c7,#fde68a);border-color:#fcd34d"><div class="l" style="color:#92400e">💸 Total Expenses</div><div class="v" style="color:#78350f;font-size:18px">' + fmtUGX(expTotal) + '</div></div>' +
      '<div class="kpi" style="background:linear-gradient(135deg,#f3e8ff,#e9d5ff);border-color:#d8b4fe"><div class="l" style="color:#6b21a8">Net Position</div><div class="v" style="color:#581c87;font-size:18px">' + fmtUGX(collTotal - expTotal) + '</div></div></div>' +
    '<div class="grid grid-2" style="margin-bottom:16px">' +
      '<div class="card"><h3>💵 Fee Collection Breakdown</h3><div style="font-size:13px;line-height:2">' +
        '<div><b>School Fees Collected:</b> ' + fmtUGX(schoolFees) + '</div>' +
        '<div><b>Functional Fees Collected:</b> ' + fmtUGX(funcFees) + '</div>' +
        '<div><b>Expected Fees (Running):</b> ' + fmtUGX(totExp) + '</div>' +
        '<div><b>Payments Recorded:</b> ' + pays.length + '</div></div></div>' +
      '<div class="card"><h3>📊 Academic Summary</h3><div style="font-size:13px;line-height:2">' +
        '<div><b>Exams this term:</b> ' + exams.length + '</div>' +
        '<div><b>Marks Recorded:</b> ' + marks.length + '</div>' +
        '<div><b>Average Score:</b> ' + avgScore.toFixed(1) + ' / 100</div>' +
        '<div><b>Attendance Rate:</b> ' + (present + absent > 0 ? ((present / (present + absent)) * 100).toFixed(1) : '—') + '%</div></div></div></div>' +
    '<div class="card"><h3>📋 Term Activity Log</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Description</th><th style="text-align:right">Amount</th></tr></thead><tbody>' +
      [...pays.map(p => ({ date: new Date(p.paid_at), type: '💰 Payment', desc: (p.payment_for||'') + ' (' + (p.payment_method||'') + ')', amount: p.amount })),
       ...exps.map(e => ({ date: new Date(e.date), type: '💸 Expense', desc: e.description + ' · ' + (e.category||''), amount: -e.amount }))]
      .sort((a,b) => b.date - a.date).slice(0,100).map(x => '<tr><td>' + fmtDate(x.date) + '</td><td>' + x.type + '</td><td>' + esc(x.desc) + '</td>' +
        '<td style="text-align:right;color:' + (x.amount >= 0 ? '#047857' : '#b91c1c') + '"><b>' + (x.amount >= 0 ? '' : '-') + Math.abs(x.amount).toLocaleString() + '</b></td></tr>').join('') +
      '</tbody></table></div></div>';

async function handleExcelUpload(input){
  if (!input.files || input.files.length === 0) return;
  const file = input.files[0]; const reader = new FileReader();
  reader.onload = async function(e){
    try {
      toast('Reading Excel...', 'ok');
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
      if (!rows || rows.length < 2){ toast('No data', 'bad'); return; }
      const classes = await loadClasses();
      const toInsert = []; const pays = []; const dupList = [];
      for (let i = 1; i < rows.length; i++){
        const row = rows[i];
        if (!row || !row[1] || String(row[1]).trim() === '' || String(row[1]).trim() === 'Name') continue;
        const fullName = String(row[1]).trim(); const parts = fullName.split(' ');
        const fn = parts[0]; const ln = parts.slice(1).join(' ') || null;
        const className = String(row[2] || '').trim();
        let classId = null;
        if (className){
          const matched = classes.find(c => c.name.toLowerCase() === className.toLowerCase());
          if (matched) classId = matched.id;
          else { try { const nc = await rest('/rest/v1/classes', { method: 'POST', headers: { 'Prefer': 'return=representation' }, body: JSON.stringify({ school_id: _schoolId, name: className, sort_order: 99 }) }); if (nc && nc[0]){ classId = nc[0].id; classes.push({ id: classId, name: className }); _classesCache = classes; } } catch(err){} }
        }
        const getNum = v => { if (v==null||v==='') return 0; const n = parseFloat(String(v).replace(/[^0-9.-]/g,'')); return isNaN(n)?0:n; };
        const bf = getNum(row[5]); const af = getNum(row[7]); let ff = getNum(row[10]); if (ff === 0) ff = FUNC_FEE_DEFAULT;
        const tf = getNum(row[12]); const d1 = getNum(row[13]), d2 = getNum(row[14]), d3 = getNum(row[15]);
        const te = bf + af + tf;
        const admNo = row[0] ? 'ADM-' + String(row[0]).trim() : 'ADM-' + Math.floor(Math.random()*10000);
        const pc = row[4] ? String(row[4]).trim() : null;
        const dupInDb = await checkDuplicateStudent(admNo, fn, ln, pc);
        if (dupInDb){ dupList.push({ name: fn + ' ' + (ln||''), reason: 'Already in system (Adm: ' + dupInDb.existing.admission_no + ')' }); continue; }
        const dupInFile = toInsert.find(x => x.admission_no === admNo || (x.first_name.toLowerCase() === fn.toLowerCase() && (x.last_name||'').toLowerCase() === (ln||'').toLowerCase() && x.parent_contact === pc));
        if (dupInFile){ dupList.push({ name: fn + ' ' + (ln||''), reason: 'Duplicate in Excel file' }); continue; }
        const idx = toInsert.length;
        toInsert.push({ school_id: _schoolId, admission_no: admNo, first_name: fn, last_name: ln, lin: generateLIN(fn), class_id: classId, boarding_status: String(row[3]||'Day').trim(), parent_contact: pc, location: row[18] ? String(row[18]).trim() : null, balance_bf: bf, actual_fee: af, functional_fee: ff, transport_fee: tf, total_expected: te, current_balance: te, functional_fee_status: 'pending', status: 'active' });
        if (d1 > 0) pays.push({ idx, amount: d1, note: 'Imported 1st dep' });
        if (d2 > 0) pays.push({ idx, amount: d2, note: 'Imported 2nd dep' });
        if (d3 > 0) pays.push({ idx, amount: d3, note: 'Imported 3rd dep' });
      }
      if (!toInsert.length){ toast('No new students to import', 'bad'); if (dupList.length) showDupModal(dupList); return; }
      toast('Importing ' + toInsert.length + ' students...', 'ok');
      const ids = [];
      for (let i = 0; i < toInsert.length; i += 50){
        const res = await rest('/rest/v1/students', { method: 'POST', headers: { 'Prefer': 'return=representation' }, body: JSON.stringify(toInsert.slice(i, i+50)) });
        if (Array.isArray(res)) res.forEach(r => ids.push(r.id));
      }
      if (pays.length){
        const y = getCurrentYear(), t = getCurrentTerm();
        const payRows = pays.map(p => ({ school_id: _schoolId, student_id: ids[p.idx], amount: p.amount, payment_for: 'School Fees', payment_method: 'Cash', notes: p.note, academic_year: y, term: t })).filter(r => r.student_id);
        for (let i = 0; i < payRows.length; i += 50){ await rest('/rest/v1/payments', { method: 'POST', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify(payRows.slice(i, i+50)) }); }
      }
      let msg = 'Imported ' + toInsert.length + ' students!';
      if (dupList.length) msg += ' · ' + dupList.length + ' skipped (duplicates)';
      toast(msg, 'ok');
      if (dupList.length) setTimeout(() => showDupModal(dupList), 500);
      input.value = ''; nav('students');
    } catch (err){ toast('Error: ' + err.message, 'bad'); input.value = ''; }
  };
  reader.readAsArrayBuffer(file);
}
window.handleExcelUpload = handleExcelUpload;

async function savePayment(id){
  const pf = document.getElementById('p_for').value;
  const amt = parseFloat(document.getElementById('p_amount').value);
  const method = document.getElementById('p_method').value;
  const txn = (document.getElementById('p_txn')?.value||'').trim();
  const dv = document.getElementById('p_date').value;
  const nt = document.getElementById('p_notes').value.trim();
  if (!amt || amt <= 0){ toast('Invalid amount', 'bad'); return; }
  if (method !== 'Cash' && !txn){ toast('Transaction ID required', 'bad'); return; }
  if (!dv){ toast('Select date', 'bad'); return; }
  try {
    await rest('/rest/v1/payments', { method: 'POST', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify({ school_id: _schoolId, student_id: id, amount: amt, payment_for: pf, payment_method: method, transaction_id: txn||null, notes: nt||null, paid_at: new Date(dv).toISOString(), academic_year: getCurrentYear(), term: getCurrentTerm() })});
    const [st, pays] = await Promise.all([ rest('/rest/v1/students?id=eq.' + id + '&select=total_expected,functional_fee'), rest('/rest/v1/payments?student_id=eq.' + id + '&select=amount,payment_for') ]);

async function saveSchoolInfo(){ const n = document.getElementById('set_name').value.trim(); if(!n){ toast('Name required', 'bad'); return; } try { await rest('/rest/v1/schools?id=eq.' + _schoolId, { method: 'PATCH', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify({ name: n, telephone: document.getElementById('set_phone').value.trim()||null, address: document.getElementById('set_addr').value.trim()||null, email: document.getElementById('set_email').value.trim()||null, head_teacher: document.getElementById('set_head').value.trim()||null, motto: document.getElementById('set_motto').value.trim()||null })}); const sc = await rest('/rest/v1/schools?id=eq.' + _schoolId + '&select=*'); _school = sc[0]; renderBadge(); toast('Saved', 'ok'); } catch(e){ toast(e.message,'bad'); } }
window.saveSchoolInfo = saveSchoolInfo;
async function wipeStudents(){ modal('<h3>⚠️ Delete All Pupils</h3><p class="muted" style="margin-bottom:16px">Delete ALL pupils permanently?</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="cfmWipeStudents()">Yes</button></div>'); }
window.wipeStudents = wipeStudents;
async function cfmWipeStudents(){ closeModal(); try { for (const t of ['payments','attendance','pass_outs','discipline','marks','report_comments','students']) await rest('/rest/v1/' + t + '?school_id=eq.' + _schoolId, { method: 'DELETE' }); toast('All pupils deleted', 'ok'); nav('settings'); } catch(e){ toast(e.message,'bad'); } }

async function wipePayments(){ modal('<h3>⚠️ Delete All Payments</h3><p class="muted" style="margin-bottom:16px">Delete all?</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="cfmWipePay()">Yes</button></div>'); }

window.cfmWipePay = cfmWipePay;

async function handleAuthRedirect(){
  const hash = window.location.hash;
  if (hash && hash.includes('access_token')){
    const p = new URLSearchParams(hash.substring(1)); const at = p.get('access_token'); const rt = p.get('refresh_token');
    if (at){
      try { const r = await fetch(SUPA_URL + '/auth/v1/user', { headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + at } }); const u = await r.json();
        if (u && u.id){ setSession({ access_token: at, refresh_token: rt, user: u }); window.history.replaceState(null, '', window.location.pathname); await boot(); return; }
      } catch(e){ console.error(e); }
    }
  }
  const s = safeStorage.getItem('eudes_session');
  if(s){ try { await boot(); } catch(e){ console.error(e); } }
}
handleAuthRedirect();
</script>
