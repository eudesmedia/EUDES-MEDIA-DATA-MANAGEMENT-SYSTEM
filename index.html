<script>
/* ============================================================
   Progressive Mothers School Management — Complete v13
   Auto token refresh + enum detection + everything
   ============================================================ */
const SUPA_URL='https://wabeempxckdtjvrkzhpv.supabase.co';
const SUPA_KEY='sb_publishable_n0uAm0Gcq7qR2dJM4jMZGQ_wiV__Cfp'; /* ⚠️ REPLACE with eyJ... anon key */

let _mem={};
function lsGet(k){try{if(typeof localStorage!=='undefined'&&localStorage)return localStorage.getItem(k);}catch(e){}return _mem[k]!==undefined?_mem[k]:null;}
function lsSet(k,v){try{if(typeof localStorage!=='undefined'&&localStorage){localStorage.setItem(k,v);return;}}catch(e){}_mem[k]=String(v);}
function lsDel(k){try{if(typeof localStorage!=='undefined'&&localStorage){localStorage.removeItem(k);return;}}catch(e){}delete _mem[k];}

function getYear(){return parseInt(lsGet('pm_year'))||new Date().getFullYear();}
function getTerm(){return parseInt(lsGet('pm_term'))||1;}
function setPeriod(y,t){lsSet('pm_year',String(y));lsSet('pm_term',String(t));}

let _session=null;
function getToken(){return _session?_session.access_token:null;}
function getUser(){return _session?_session.user:null;}
function setSession(d){_session=d;if(d)lsSet('pm_session',JSON.stringify(d));else lsDel('pm_session');}

/* ============================================================
   TOKEN AUTO-REFRESH
   ============================================================ */
let _refreshing=null;
async function refreshSession(){
  if(!_session||!_session.refresh_token)throw new Error('No refresh token');
  if(_refreshing)return _refreshing;
  _refreshing=(async()=>{
    try{
      const res=await fetch(SUPA_URL+'/auth/v1/token?grant_type=refresh_token',{
        method:'POST',
        headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
        body:JSON.stringify({refresh_token:_session.refresh_token})
      });
      const text=await res.text();
      let data=null;try{data=text?JSON.parse(text):null;}catch(e){}
      if(!res.ok||!data||!data.access_token){
        throw new Error((data&&(data.error_description||data.msg||data.error))||'Refresh failed');
      }
      setSession({
        access_token:data.access_token,
        refresh_token:data.refresh_token||_session.refresh_token,
        user:data.user||_session.user
      });
      return true;
    }finally{
      _refreshing=null;
    }
  })();
  return _refreshing;
}
window.refreshSession=refreshSession;

async function rest(path,options){
  options=options||{};
  const buildHeaders=()=>{
    const h=Object.assign({'apikey':SUPA_KEY,'Content-Type':'application/json'},options.headers||{});
    const t=getToken();h['Authorization']='Bearer '+(t||SUPA_KEY);
    return h;
  };
  let res=await fetch(SUPA_URL+path,Object.assign({},options,{headers:buildHeaders()}));
  let text=await res.text();

  /* Auto-refresh on 401 and retry once */
  if(res.status===401&&_session&&_session.refresh_token){
    try{
      await refreshSession();
      res=await fetch(SUPA_URL+path,Object.assign({},options,{headers:buildHeaders()}));
      text=await res.text();
    }catch(e){
      setSession(null);
      document.getElementById('app').style.display='none';
      document.getElementById('authScreen').style.display='flex';
      const errEl=document.getElementById('loginErr');
      if(errEl){errEl.textContent='Session expired. Please sign in again.';errEl.style.display='block';}
      throw new Error('Session expired — please sign in again');
    }
  }

  let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok){
    throw new Error((data&&(data.message||data.msg||data.error_description||data.error||data.hint))||text||('HTTP '+res.status));
  }
  return data;
}
async function auth(path,body){
  const res=await fetch(SUPA_URL+path,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const text=await res.text();let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok)throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status));
  return data;
}

let _profile=null,_school=null,_schoolId=null,_role=null,_classesCache=null,_examsCache=null;
let _marksClass=null,_marksExam=null,_subjClass=null;
let _profileStudentId=null,_profileTab='overview';
let _cachedStudents=[],_cachedPayments=[],_cachedPassOuts=[],_cachedPOStudents=[];
let _passOutLookup={};

/* ENUM AUTO-DETECTION */
let _enumPaymentMethod=[];
let _enumPaymentProvider=[];
let _enumAttendanceStatus=['present','absent','late','excused'];

async function detectEnums(){
  try{
    const r=await rest('/rest/v1/rpc/get_enum_values',{method:'POST',body:JSON.stringify({p_type:'payment_method'})});
    if(Array.isArray(r)&&r.length){_enumPaymentMethod=r.map(x=>x.enumlabel||x);}
  }catch(e){}
  if(!_enumPaymentMethod.length){
    try{
      const r=await rest('/rest/v1/payments?school_id=eq.'+_schoolId+'&select=method&limit=100');
      const set=new Set();(r||[]).forEach(x=>{if(x.method)set.add(x.method);});
      _enumPaymentMethod=[...set];
    }catch(e){}
  }
  if(!_enumPaymentMethod.length){_enumPaymentMethod=['Cash','Mobile Money','Bank','Cheque','Bank Transfer'];}
  try{
    const r=await rest('/rest/v1/rpc/get_enum_values',{method:'POST',body:JSON.stringify({p_type:'payment_provider'})});
    if(Array.isArray(r)&&r.length){_enumPaymentProvider=r.map(x=>x.enumlabel||x);}
  }catch(e){}
  if(!_enumPaymentProvider.length)_enumPaymentProvider=['MTN','Airtel','Other'];
  try{
    const r=await rest('/rest/v1/rpc/get_enum_values',{method:'POST',body:JSON.stringify({p_type:'attendance_status'})});
    if(Array.isArray(r)&&r.length){_enumAttendanceStatus=r.map(x=>x.enumlabel||x);}
  }catch(e){}
}

function matchEnum(input,list){
  if(!list||!list.length)return input;
  const raw=String(input||'').trim();
  if(!raw)return list[0];
  if(list.includes(raw))return raw;
  const lower=raw.toLowerCase();
  const l2=list.find(x=>String(x).toLowerCase()===lower);
  if(l2)return l2;
  const underscored=lower.replace(/\s+/g,'_');
  const l3=list.find(x=>String(x).toLowerCase().replace(/\s+/g,'_')===underscored);
  if(l3)return l3;
  const noSpace=lower.replace(/[\s_-]+/g,'');
  const l4=list.find(x=>String(x).toLowerCase().replace(/[\s_-]+/g,'')===noSpace);
  if(l4)return l4;
  const noHyphen=lower.replace(/[\s_]/g,'_');
  const l5=list.find(x=>String(x).toLowerCase().replace(/[\s]/g,'_')===noHyphen);
  if(l5)return l5;
  return list[0];
}

function fmtUGX(n){if(n==null||isNaN(n))return 'UGX 0';return 'UGX '+(Number(n)||0).toLocaleString();}
function fmtNum(n){if(n==null||isNaN(n))return '0';return (Number(n)||0).toLocaleString();}
function fmtDate(ts){if(!ts)return '—';const d=new Date(ts);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function fmtLongDate(d){return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});}
function fmtDateTime(ts){if(!ts)return '—';const d=new Date(ts);return fmtDate(ts)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function telLink(num){if(!num)return '';return String(num).replace(/[^0-9+]/g,'');}
function waLink(num){if(!num)return '';let c=String(num).replace(/[^0-9]/g,'');if(c.startsWith('0'))c='256'+c.slice(1);return c;}
function genderLabel(g){return g==='M'?'Male':(g==='F'?'Female':'—');}
function gradeOf(score){if(score==null||isNaN(score))return{g:'—',r:'—',cls:''};const s=Number(score);if(s>=90)return{g:'D1',r:'Distinction 1',cls:'d1'};if(s>=80)return{g:'D2',r:'Distinction 2',cls:'d2'};if(s>=70)return{g:'C3',r:'Credit 3',cls:'c3'};if(s>=60)return{g:'C4',r:'Credit 4',cls:'c4'};if(s>=55)return{g:'C5',r:'Credit 5',cls:'c5'};if(s>=50)return{g:'C6',r:'Credit 6',cls:'c6'};if(s>=45)return{g:'P7',r:'Pass 7',cls:'p7'};if(s>=40)return{g:'P8',r:'Pass 8',cls:'p8'};return{g:'F9',r:'Fail 9',cls:'f9'};}

async function saveStudent(id){
  const n=f=>Number(document.getElementById(f).value)||0;
  const body={
    school_id:_schoolId,
    admission_no:document.getElementById('m_adm').value.trim(),
    class_id:document.getElementById('m_class').value||null,
    first_name:document.getElementById('m_fn').value.trim(),
    last_name:document.getElementById('m_ln').value.trim()||null,
    gender:document.getElementById('m_gender').value||null,
    date_of_birth:document.getElementById('m_dob').value||null,
    lin:document.getElementById('m_lin').value.trim()||null,
    boarding_status:document.getElementById('m_res').value,
    location:document.getElementById('m_loc').value.trim()||null,
    parent_name:document.getElementById('m_par').value.trim()||null,
    parent_contact:document.getElementById('m_pc').value.trim()||null,
    status:document.getElementById('m_status').value,
    balance_bf:n('m_bf'),actual_fee:n('m_fee'),functional_fee:n('m_func'),
    transport_fee:n('m_trans'),holiday_fee:n('m_hol'),academics_fee:n('m_acad')
  };
  body.total_charged=body.balance_bf+body.actual_fee+body.functional_fee+body.transport_fee+body.holiday_fee+body.academics_fee;
  const old=id?_cachedStudents.find(x=>x.id===id):null;
  body.total_paid=old?Number(old.total_paid)||0:0;
  body.current_balance=body.total_charged-body.total_paid;
  if(!body.admission_no||!body.first_name||!body.class_id){toast('Fill ADM, name, class','bad');return;}
  try{
    if(id)await rest('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});
    else await rest('/rest/v1/students',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});
    toast('Saved','ok');closeModal();nav(activeRoute);
  }catch(e){toast(e.message,'bad');}
}
window.saveStudent=saveStudent;

async function savePayment(studentId){
  const amount=Number(document.getElementById('p_amount').value);
  const rno=document.getElementById('p_rno').value.trim()||('RCP-'+Date.now());
  if(!amount||amount<=0){toast('Enter amount','bad');return;}
  const s=_cachedStudents.find(x=>x.id===studentId);if(!s){toast('Not found','bad');return;}
  const rawMethod=document.getElementById('p_method').value;
  const method=matchEnum(rawMethod,_enumPaymentMethod);
  const rawProvider=document.getElementById('p_provider').value;
  const provider=rawProvider?matchEnum(rawProvider,_enumPaymentProvider):null;
  const payment_for=document.getElementById('p_for').value;
  const notes=document.getElementById('p_notes').value.trim();
  const ref=document.getElementById('p_ref').value.trim();
  const body={school_id:_schoolId,student_id:studentId,receipt_no:rno,year:getYear(),term:getTerm(),academic_year:getYear(),amount:amount,method:method,payment_for:payment_for,payment_method:rawMethod,received_by:_profile?_profile.id:null};
  if(provider)body.provider=provider;
  if(notes)body.notes=notes;
  if(ref)body.reference=ref;
  try{
    await rest('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});
    const newPaid=(Number(s.total_paid)||0)+amount;
    const charged=Number(s.total_charged)||0;
    await rest('/rest/v1/students?id=eq.'+studentId,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({total_paid:newPaid,current_balance:Math.max(0,charged-newPaid)})});
    toast('Receipt: '+rno,'ok');
    printReceipt(s,{receipt_no:rno,amount:amount,payment_for:payment_for,method:rawMethod,notes:notes,date:new Date().toISOString(),ref:ref});
    closeModal();nav(activeRoute);
  }catch(e){toast(e.message,'bad');}
}
