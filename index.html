<script>
/* ============================================================
   EUDES SCHOOL MANAGEMENT
   ============================================================ */
const SUPA_URL='https://wabeempxckdtjvrkzhpv.supabase.co';
const SUPA_KEY='sb_publishable_n0uAm0Gcq7qR2dJM4jMZGQ_wiV__Cfp';
const FUNC_FEE_DEFAULT=70000;

function isInAppBrowser(){const ua=navigator.userAgent||'';return /(wv|WebView|FBAN|FBAV|FB_IAB|Instagram|Line\/|WhatsApp|Twitter|TikTok|SnapChat|Pinterest|DeepSeek|GSA\/)/i.test(ua);}
function getCurrentYear(){return parseInt(safeStorage.getItem('eudes_year'))||new Date().getFullYear();}
function getCurrentTerm(){return parseInt(safeStorage.getItem('eudes_term'))||1;}
function setCurrentPeriod(y,t){safeStorage.setItem('eudes_year',String(y));safeStorage.setItem('eudes_term',String(t));}

let _memoryStore={};
const safeStorage={
  getItem:k=>{try{return localStorage.getItem(k);}catch(e){return _memoryStore[k]||null;}},
  setItem:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){_memoryStore[k]=String(v);}},
  removeItem:k=>{try{localStorage.removeItem(k);}catch(e){delete _memoryStore[k];}}
};

function getToken(){const s=safeStorage.getItem('eudes_session');if(!s)return null;try{return JSON.parse(s).access_token;}catch(e){return null;}}
function getUser(){const s=safeStorage.getItem('eudes_session');if(!s)return null;try{return JSON.parse(s).user;}catch(e){return null;}}
function setSession(d){if(d)safeStorage.setItem('eudes_session',JSON.stringify(d));else safeStorage.removeItem('eudes_session');}

async function rest(path,options){
  options=options||{};
  const headers=Object.assign({'apikey':SUPA_KEY,'Content-Type':'application/json'},options.headers||{});
  const token=getToken();
  headers['Authorization']='Bearer '+(token||SUPA_KEY);
  const res=await fetch(SUPA_URL+path,Object.assign({},options,{headers}));
  const text=await res.text();
  let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok){
    if(res.status===401){setSession(null);alert('Session expired.');window.location.reload();throw new Error('Session expired');}
    throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status));
  }
  return data;
}
async function auth(path,body){
  const res=await fetch(SUPA_URL+path,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const text=await res.text();
  let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok)throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status));
  return data;
}

let SESSION=null,_profile=null,_school=null,_schoolId=null,_role=null,_classesCache=null,_staffCache=null;

function toast(msg,type){const el=document.createElement('div');el.className='toast'+(type==='bad'?' bad':(type==='ok'?' ok':''));el.textContent=msg;document.getElementById('toastRoot').appendChild(el);setTimeout(()=>el.remove(),3500);}
function modal(html){const root=document.getElementById('modalRoot');root.innerHTML='<div class="modal-bg"><div class="modal">'+html+'</div></div>';root.querySelector('.modal-bg').addEventListener('click',e=>{if(e.target.classList.contains('modal-bg'))closeModal();});}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtUGX(n){return 'UGX '+(Number(n)||0).toLocaleString();}

function fmtTime(ts){if(!ts)return '';return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function fmtLongDate(d){return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});}
function fmtDuration(ms){const mins=Math.round(ms/60000);const h=Math.floor(mins/60);const m=mins%60;return (h?h+'h ':'')+m+'m';}

/* ---------- LIN engine ---------- */
function schoolPrefix(schoolName){
  const letters=(schoolName||'XX').replace(/[^A-Za-z]/g,'').toUpperCase();
  return (letters+'XX').slice(0,2);
}
function generateLIN(firstName){
  const prefix=(_school && _school.lin_prefix ? _school.lin_prefix : schoolPrefix(_school&&_school.name)).toUpperCase();
  const initial=(firstName||'X').replace(/[^A-Za-z]/g,'').charAt(0).toUpperCase()||'X';
  const digits=Math.floor(1000+Math.random()*9000);
  return prefix+initial+digits;
}
function copyText(text,label){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){navigator.clipboard.writeText(text);toast((label||'Copied')+': '+text,'ok');return;}
  }catch(e){}
  const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast((label||'Copied')+': '+text,'ok');}catch(e){toast('Copy failed','bad');}
  ta.remove();
}
function copyLin(lin){if(!lin){toast('No LIN','bad');return;}copyText(lin,'LIN');}

async function insertStudentWithRetry(payload){
  for(let i=0;i<8;i++){
    try{
      const res=await rest('/rest/v1/students',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(payload)});
      return res;
    }catch(e){
      const m=String(e.message||'').toLowerCase();
      if(m.includes('lin_unique')||m.includes('students_lin')||m.includes('duplicate key')){
        payload.lin=generateLIN(payload.first_name);
        continue;
      }
      throw e;
    }
  }
  throw new Error('Could not assign a unique LIN after several attempts.');
}

/* ---------- Duplicate detection ----------
   Rule: same school + same first_name + same last_name + same dob + same parent_name + same parent_contact
   = duplicate. If any of those is missing, that field is treated as "match anything" only if blank
   in both records.
*/
function normalizeName(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');}
function normalizePhone(s){return String(s||'').replace(/[^0-9+]/g,'').replace(/^\+?256/,'0').replace(/^\+?0*/,'0');}
function normalizeDob(s){return String(s||'').trim().slice(0,10);}

function findDuplicateLocal({first_name,last_name,dob,parent_name,parent_contact},excludeId){
  const list=window._allStudents||[];
  const fn=normalizeName(first_name),ln=normalizeName(last_name);
  const dp=normalizeDob(dob),pn=normalizeName(parent_name),pc=normalizePhone(parent_contact);
  return list.find(s=>{
    if(excludeId && s.id===excludeId)return false;
    if(normalizeName(s.first_name)!==fn)return false;
    if(ln && normalizeName(s.last_name)!==ln)return false;
    // Only compare dob if both have one
    if(dp && s.date_of_birth && normalizeDob(s.date_of_birth)!==dp)return false;
    // Only compare parent name if both have one
    if(pn && s.parent_name && normalizeName(s.parent_name)!==pn)return false;
    // Only compare parent contact if both have one
    if(pc && s.parent_contact && normalizePhone(s.parent_contact)!==pc)return false;
    // Everything matched (or was blank on one side)
    return true;
  });
}

function gradeOf(score){
  if(score==null||isNaN(score)||score==='')return{g:'—',r:'—',cls:''};
  const s=Number(score);
  if(s>=90)return{g:'D1',r:'Distinction 1',cls:'ok'};
  if(s>=80)return{g:'D2',r:'Distinction 2',cls:'ok'};
  if(s>=70)return{g:'C3',r:'Credit 3',cls:'ok'};
  if(s>=60)return{g:'C4',r:'Credit 4',cls:'info'};
  if(s>=55)return{g:'C5',r:'Credit 5',cls:'info'};
  if(s>=50)return{g:'C6',r:'Credit 6',cls:'info'};
  if(s>=45)return{g:'P7',r:'Pass 7',cls:'warn'};
  if(s>=40)return{g:'P8',r:'Pass 8',cls:'warn'};
  return{g:'F9',r:'Fail 9',cls:'bad'};
}

let _qrScanner=null;
async function startQRScanner(onScan){
  if(_qrScanner){try{await _qrScanner.stop();}catch(e){}_qrScanner=null;}
  const container=document.getElementById('qrScannerBox');
  if(!container){toast('Scanner container missing','bad');return;}
  container.innerHTML='';
  _qrScanner=new Html5Qrcode("qrScannerBox");
  let lastCode='';let lastTime=0;
  try{
    await _qrScanner.start({facingMode:'environment'},{fps:12,qrbox:{width:260,height:260}},async decoded=>{
      const now=Date.now();
      if(decoded===lastCode&&now-lastTime<2000)return;
      lastCode=decoded;lastTime=now;
      try{await onScan(decoded);}catch(e){console.warn(e);}
    },()=>{});
  }catch(e){toast('Camera: '+e.message,'bad');}
}

  '<select id="studentClassFilter" onchange="filterStudentsTable(document.getElementById(\'studentSearchInput\').value,this.value)"><option value="">All classes</option>'+classes.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select>'+

function filterStudentsTable(q,fClass){
  q=(q||'').toLowerCase();fClass=fClass||'';
  window._stFilterSearch=q;
  const fFunc=document.getElementById('studentFuncFilter')?.value||'';
  const classes=_classesCache||[];
  const paid=window._paidByStudent||{};
  const openMap=window._openPassOuts||{};
  const filtered=(window._allStudents||[]).filter(s=>{
    if(fClass&&s.class_id!==fClass)return false;
    if(fFunc==='out'&&!openMap[s.id])return false;
    if(fFunc==='nolin'&&s.lin)return false;
    if(q){
      const hay=(s.first_name+' '+(s.last_name||'')+' '+s.admission_no+' '+(s.lin||'')+' '+(s.parent_name||'')+' '+(s.parent_contact||'')).toLowerCase();
      if(hay.indexOf(q)===-1)return false;
    }
    return true;
  });
  window._filteredStudents=filtered;
  document.getElementById('studentCount').textContent=(window._allStudents||[]).length+' total · '+filtered.length+' shown';
  const c=document.getElementById('studentsTableContainer');
  if(!filtered.length){c.innerHTML='<div class="empty">No pupils.</div>';return;}
  c.innerHTML='<div class="table-wrap"><table><thead><tr><th>Adm No</th><th>Name</th><th>Class</th><th>LIN</th><th>Parent</th><th>Balance</th><th></th></tr></thead><tbody>'+
  filtered.map(s=>{
    const cls=(classes||[]).find(x=>x.id===s.class_id);
    const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);
    const p=paid[s.id]||{school:0};const bal=sf-p.school;
    const openPO=openMap[s.id];
    const outBadge=openPO?' <span class="badge" style="background:#dc2626;color:#fff;border-color:#991b1b">🚪 OUT</span>':'';
    const linCell=s.lin?'<span class="lin-chip" onclick="event.stopPropagation();copyLin(\''+esc(s.lin)+'\')" title="Tap to copy">'+esc(s.lin)+'</span>':'<span class="badge warn">—</span>';
    return '<tr style="'+(openPO?'background:#fef3c7':'')+'">'+
      '<td><b>'+esc(s.admission_no)+'</b></td>'+
      '<td><b>'+esc(s.first_name+' '+(s.last_name||''))+'</b>'+(s.photo_data?' <span class="badge info">📸</span>':'')+(s.qr_code?' <span class="badge info">🎫</span>':'')+outBadge+'</td>'+
      '<td><span class="badge info">'+esc(cls?cls.name:'—')+'</span></td>'+
      '<td>'+linCell+'</td>'+
      '<td>'+esc(s.parent_name||'—')+'</td>'+
      '<td><span class="badge '+(bal>0?'bad':'ok')+'">'+bal.toLocaleString()+'</span></td>'+
      '<td style="white-space:nowrap">'+
      '<button class="btn sm" onclick="recordPayment(\''+s.id+'\')">💵</button> '+
      '<button class="btn sm ghost" onclick="openProfile(\''+s.id+'\')">👤</button> '+
      '<button class="btn sm ghost" onclick="editStudent(\''+s.id+'\')">✏️</button> '+
      '<button class="btn sm danger" onclick="deleteStudent(\''+s.id+'\')">✕</button></td></tr>';
  }).join('')+'</tbody></table></div>';
}

function copyAllLins(){
  const list=window._allStudents||[];
  const withLin=list.filter(s=>s.lin);
  if(!withLin.length){toast('No pupils with LIN','bad');return;}
  const classes=_classesCache||[];
  const clsMap={};classes.forEach(c=>clsMap[c.id]=c.name);
  const text=withLin.map(s=>s.admission_no+' | '+s.first_name+' '+(s.last_name||'')+' | '+(clsMap[s.class_id]||'—')+' | LIN: '+s.lin).join('\n');
  copyText(text,withLin.length+' LINs');
}

function previewStudentLin(){
  const fn=(document.getElementById('s_fn').value||'').trim();
  if(!fn)return;
  const lin=generateLIN(fn);
  const el=document.getElementById('s_lin');
  if(el)el.value=lin;
}
function checkLiveDuplicate(){
  const warn=document.getElementById('s_dupWarn');const btn=document.getElementById('s_saveBtn');
  if(!warn)return;
  const candidate={
    first_name:document.getElementById('s_fn')?.value||'',
    last_name:document.getElementById('s_ln')?.value||'',
    dob:document.getElementById('s_dob')?.value||'',
    parent_name:document.getElementById('s_parent_name')?.value||'',
    parent_contact:document.getElementById('s_parent_contact')?.value||''
  };
  if(!candidate.first_name){warn.style.display='none';if(btn)btn.disabled=false;return;}
  const dup=findDuplicateLocal(candidate);
  if(dup){
    warn.style.display='block';
    warn.innerHTML='<div class="err" style="line-height:1.7"><b>⚠️ Possible duplicate detected</b><br>'+
      'An existing pupil matches: <b>'+esc(dup.first_name+' '+(dup.last_name||''))+'</b> — '+esc(dup.admission_no)+' — LIN '+esc(dup.lin||'—')+
      '<br><br><button class="btn sm ghost" onclick="closeModal();openProfile(\''+dup.id+'\')">Open existing pupil</button></div>';
    if(btn)btn.disabled=true;
  } else {
    warn.style.display='none';
    if(btn)btn.disabled=false;
  }
}

async function saveNewStudent(ev){
  const adm=document.getElementById('s_adm').value.trim();
  const fn=document.getElementById('s_fn').value.trim();
  const ln=document.getElementById('s_ln').value.trim()||null;
  const dob=document.getElementById('s_dob').value||null;
  const pc=document.getElementById('s_parent_contact').value.trim()||null;
  const pn=document.getElementById('s_parent_name').value.trim()||null;
  if(!adm||!fn){toast('Admission and Name required','bad');return;}

  // Final duplicate check
  const dup=findDuplicateLocal({first_name:fn,last_name:ln,dob,parent_name:pn,parent_contact:pc});
  if(dup){
    toast('Duplicate pupil detected: '+dup.admission_no,'bad');
    return;
  }

  const btn=ev?.target;if(btn)btn.disabled=true;
  const lin=document.getElementById('s_lin').value.trim()||generateLIN(fn);
  const gn=id=>{const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;};
  const bf=gn('s_balance_bf'),af=gn('s_actual_fee'),tf=gn('s_transport_fee');
  let ff=gn('s_functional_fee');if(ff===0)ff=FUNC_FEE_DEFAULT;
  const tot=bf+af+tf;
  try{
    await insertStudentWithRetry({
      school_id:_schoolId,admission_no:adm,first_name:fn,lin,last_name:ln,
      date_of_birth:dob,
      class_id:document.getElementById('s_class').value,
      boarding_status:document.getElementById('s_boarding').value,
      gender:document.getElementById('s_gender').value,
      parent_name:pn,parent_contact:pc,
      balance_bf:bf,actual_fee:af,functional_fee:ff,transport_fee:tf,
      functional_fee_paid:0,functional_fee_status:'pending',
      total_expected:tot,current_balance:tot,status:'active',
      qr_code:'STU-'+Date.now()
    });
    toast('Registered · LIN: '+lin,'ok');closeModal();nav('students');
  }catch(e){toast(e.message,'bad');}
  if(btn)btn.disabled=false;
}

async function updateStudent(id){
  const gn=i=>{const v=parseFloat(document.getElementById(i).value);return isNaN(v)?0:v;};
  const bf=gn('e_balance_bf'),af=gn('e_actual_fee'),tf=gn('e_transport_fee');
  let ff=gn('e_functional_fee');if(ff===0)ff=FUNC_FEE_DEFAULT;
  const fpaid=gn('e_functional_fee_paid');
  const tot=bf+af+tf;
  const fn=document.getElementById('e_fn').value.trim();
  const ln=document.getElementById('e_ln').value.trim()||null;
  const dob=document.getElementById('e_dob').value||null;
  const pn=document.getElementById('e_parent_name').value.trim()||null;
  const pc=document.getElementById('e_parent_contact').value.trim()||null;

  // Duplicate check (excluding self)
  const dup=findDuplicateLocal({first_name:fn,last_name:ln,dob,parent_name:pn,parent_contact:pc},id);
  if(dup){
    toast('Another pupil matches: '+dup.admission_no,'bad');
    return;
  }

  try{
    await rest('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({
      admission_no:document.getElementById('e_adm').value.trim(),
      lin:document.getElementById('e_lin').value.trim()||null,
      first_name:fn,last_name:ln,
      date_of_birth:dob,
      class_id:document.getElementById('e_class').value,
      boarding_status:document.getElementById('e_boarding').value,
      parent_name:pn,parent_contact:pc,
      balance_bf:bf,actual_fee:af,functional_fee:ff,transport_fee:tf,
      functional_fee_paid:fpaid,
      functional_fee_status:document.getElementById('e_func_status').value,
      total_expected:tot,
      status:document.getElementById('e_status').value
    })});
    toast('Updated','ok');closeModal();nav('students');

function resetFeesFilters(){const a=document.getElementById('feesClassFilter');if(a)a.value='';const b=document.getElementById('feesOwingFilter');if(b)b.value='all';filterFeesTable();}

function filterFeesTable(){
  const fc=document.getElementById('feesClassFilter')?.value||'';
  const m=document.getElementById('feesOwingFilter')?.value||'all';
  const paid=window._paidByStudentFees||{};
  const tab=_feesTab;
  let list=(window._allFeeStudents||[]).slice();
  if(fc)list=list.filter(s=>s.class_id===fc);
  if(tab==='school'){
    if(m==='owing')list=list.filter(s=>{const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);return (sf-((paid[s.id]||{school:0}).school))>0;});
    if(m==='paid')list=list.filter(s=>{const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);return (sf-((paid[s.id]||{school:0}).school))<=0;});
  } else {
    if(m!=='all')list=list.filter(s=>(s.functional_fee_status||'pending')===m);
  }
  const c=document.getElementById('feesTableContainer');
  if(!list.length){c.innerHTML='<div class="empty">No match.</div>';return;}
  if(tab==='school'){
    c.innerHTML='<div class="table-wrap"><table><thead><tr><th>Adm</th><th>Name</th><th>Class</th><th style="text-align:right">Exp</th><th style="text-align:right">Paid</th><th style="text-align:right">Bal</th><th></th></tr></thead><tbody>'+
      list.map(s=>{const cls=(window._allClassesForFees||[]).find(c=>c.id===s.class_id);const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);const p=paid[s.id]||{school:0};const bal=sf-p.school;
        return '<tr><td><b>'+esc(s.admission_no)+'</b></td><td>'+esc(s.first_name+' '+(s.last_name||''))+'</td><td><span class="badge info">'+esc(cls?cls.name:'—')+'</span></td><td style="text-align:right">'+sf.toLocaleString()+'</td><td style="text-align:right;color:#047857">'+p.school.toLocaleString()+'</td><td style="text-align:right"><span class="badge '+(bal>0?'bad':'ok')+'">'+bal.toLocaleString()+'</span></td><td><button class="btn sm" onclick="recordPayment(\''+s.id+'\')">💵</button></td></tr>';}).join('')+'</tbody></table></div>';
  } else {
    c.innerHTML='<div class="table-wrap"><table><thead><tr><th>Adm</th><th>Name</th><th style="text-align:right">Exp</th><th style="text-align:right">Paid</th><th>Status</th><th></th></tr></thead><tbody>'+
      list.map(s=>{const expected=Number(s.functional_fee)||FUNC_FEE_DEFAULT;const paidAmt=Number(s.functional_fee_paid)||(paid[s.id]||{func:0}).func||0;
        return '<tr><td><b>'+esc(s.admission_no)+'</b></td><td>'+esc(s.first_name+' '+(s.last_name||''))+'</td><td style="text-align:right">'+expected.toLocaleString()+'</td><td style="text-align:right;color:#047857">'+paidAmt.toLocaleString()+'</td><td>'+functionalStatusBadge(s.functional_fee_status)+'</td><td><button class="btn sm" onclick="recordPayment(\''+s.id+'\',\'Functional Fees\')">💵</button></td></tr>';}).join('')+'</tbody></table></div>';
  }
}

async function bulkMarkFuncPaid(){
  const list=(window._allFeeStudents||[]).filter(s=>(s.functional_fee_status||'pending')==='pending');
  if(!list.length){toast('Nothing','ok');return;}
  if(!confirm('Mark '+list.length+' paid?'))return;
  let n=0;
  for(const s of list){try{const ff=Number(s.functional_fee)||FUNC_FEE_DEFAULT;await rest('/rest/v1/students?id=eq.'+s.id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({functional_fee_status:'cash',functional_fee_paid:ff})});n++;}catch(e){}}
  toast('Marked '+n,'ok');nav('fees');
}

async function recordPayment(id,preselectFor){
  const [st,pays]=await Promise.all([rest('/rest/v1/students?id=eq.'+id+'&select=*'),rest('/rest/v1/payments?student_id=eq.'+id+'&select=amount,payment_for')]);
  const s=st[0];if(!s)return;
  const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);
  const ff=Number(s.functional_fee)||FUNC_FEE_DEFAULT;
  const sp=pays.filter(p=>p.payment_for!=='Functional Fees').reduce((sum,p)=>sum+Number(p.amount),0);
  const fp=pays.filter(p=>p.payment_for==='Functional Fees').reduce((sum,p)=>sum+Number(p.amount),0);
  const bal=sf-sp;
  const funcShort=Math.max(0,ff-fp);
  const now=new Date();const tz=now.getTimezoneOffset()*60000;const l=new Date(now-tz).toISOString().slice(0,16);
  const defaultAmt=preselectFor==='Functional Fees'?(funcShort>0?funcShort:''):(bal>0?bal:'');
  modal('<h3>💵 Payment — '+esc(s.first_name+' '+(s.last_name||''))+'</h3>'+
  '<div style="background:var(--brandsoft);padding:12px;border-radius:10px;margin-bottom:16px;font-size:13px;line-height:1.9">'+
  '<div>📚 <b>Balance:</b> '+fmtUGX(bal)+'</div>'+
  '<div>🧾 <b>Func.:</b> '+functionalStatusBadge(s.functional_fee_status)+' ('+fmtUGX(fp)+' / '+fmtUGX(ff)+')</div></div>'+
  '<div class="grid grid-2">'+
  '<div><label>Payment for</label><select id="p_for" onchange="onPaymentForChange()"><option value="School Fees"'+(preselectFor!=='Functional Fees'?' selected':'')+'>📚 School</option><option value="Functional Fees"'+(preselectFor==='Functional Fees'?' selected':'')+'>🧾 Functional</option></select></div>'+
  '<div><label>Amount *</label><input id="p_amount" type="number" value="'+defaultAmt+'"></div>'+
  '<div><label>Method</label><select id="p_method" onchange="toggleTxn()"><option>Cash</option><option>Mobile Money</option><option>Bank Transfer</option><option>Bank</option><option>Cheque</option></select></div>'+
  '<div><label>Date</label><input id="p_date" type="datetime-local" value="'+l+'"></div>'+
  '<div id="txnIdField" style="display:none"><label>Txn ID</label><input id="p_txn"></div>'+
  '<div><label>Notes</label><input id="p_notes"></div></div>'+
  '<div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn ok" onclick="savePayment(\''+id+'\')">💾 Save</button></div>');
  window._funcShort=funcShort;window._schoolBal=bal;
}
function onPaymentForChange(){const pf=document.getElementById('p_for').value;const amt=document.getElementById('p_amount');if(pf==='Functional Fees'&&window._funcShort>0)amt.value=window._funcShort;else if(pf==='School Fees'&&window._schoolBal>0)amt.value=window._schoolBal;}
function toggleTxn(){const m=document.getElementById('p_method').value;const f=document.getElementById('txnIdField');if(m==='Cash'){f.style.display='none';const t=document.getElementById('p_txn');if(t)t.value='';}else f.style.display='block';}

async function savePayment(id){
  const pf=document.getElementById('p_for').value;
  const amt=parseFloat(document.getElementById('p_amount').value);
  const method=document.getElementById('p_method').value;
  const txn=(document.getElementById('p_txn')?.value||'').trim();
  const dv=document.getElementById('p_date').value;
  const nt=document.getElementById('p_notes').value.trim();
  if(!amt||amt<=0){toast('Invalid','bad');return;}
  if(method!=='Cash'&&!txn){toast('Txn ID required','bad');return;}
  try{
    await rest('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,student_id:id,amount:amt,payment_for:pf,payment_method:method,transaction_id:txn||null,notes:nt||null,paid_at:new Date(dv).toISOString(),academic_year:getCurrentYear(),term:getCurrentTerm()})});
    const [st,pays]=await Promise.all([rest('/rest/v1/students?id=eq.'+id+'&select=total_expected,functional_fee'),rest('/rest/v1/payments?student_id=eq.'+id+'&select=amount,payment_for')]);
    const te=Number(st[0].total_expected)||0;const ff=Number(st[0].functional_fee)||FUNC_FEE_DEFAULT;
    const sp=pays.filter(p=>p.payment_for!=='Functional Fees').reduce((s,p)=>s+Number(p.amount),0);
    const fp=pays.filter(p=>p.payment_for==='Functional Fees').reduce((s,p)=>s+Number(p.amount),0);
    const upd={current_balance:te-sp,functional_fee_paid:fp};
    if(pf==='Functional Fees'&&fp>=ff)upd.functional_fee_status='cash';
    await rest('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify(upd)});
    toast('Saved · '+fmtUGX(amt),'ok');closeModal();nav(activeRoute);
  }catch(e){toast(e.message,'bad');}
}

async function printAttendanceReport(studentId){
  const [st,records]=await Promise.all([rest('/rest/v1/students?id=eq.'+studentId+'&select=*').then(r=>r[0]),rest('/rest/v1/attendance?student_id=eq.'+studentId+'&select=*&order=date.desc').catch(()=>[])]);
  if(!st)return;
  const byMonth={};(records||[]).forEach(r=>{const m=(r.date||'').slice(0,7);if(!byMonth[m])byMonth[m]={present:0,absent:0,total:0};byMonth[m].total++;if(r.status==='absent')byMonth[m].absent++;else byMonth[m].present++;});
  const total={present:0,absent:0,total:0};Object.values(byMonth).forEach(m=>{total.present+=m.present;total.absent+=m.absent;total.total+=m.total;});
  const attPct=total.total?Math.round(total.present*100/total.total):0;
  const rows=Object.keys(byMonth).sort().reverse().map(m=>{const d=byMonth[m];const pct=d.total?Math.round(d.present*100/d.total):0;const [y,mo]=m.split('-');const mn=new Date(y,mo-1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
    return '<tr><td>'+mn+'</td><td style="text-align:center">'+d.present+'</td><td style="text-align:center">'+d.absent+'</td><td style="text-align:center">'+d.total+'</td><td style="text-align:center;font-weight:700">'+pct+'%</td></tr>';}).join('');
  printHTML('Attendance Report — '+st.first_name,'<div class="summary"><div><b>Total Days</b>'+total.total+'</div><div><b>Present</b>'+total.present+'</div><div><b>Absent</b>'+total.absent+'</div><div><b>Attendance %</b>'+attPct+'%</div></div><table><thead><tr><th>Month</th><th style="text-align:center">Present</th><th style="text-align:center">Absent</th><th style="text-align:center">Total</th><th style="text-align:center">%</th></tr></thead><tbody>'+(rows||'<tr><td colspan="5" style="text-align:center">No records</td></tr>')+'</tbody></table>');
}

async function handlePhotoFile(input){
  if(!input.files||!input.files[0])return;
  const sid=document.getElementById('photoTargetStudent').value;if(!sid)return;
  const file=input.files[0];if(file.size>2*1024*1024){toast('Max 2MB','bad');input.value='';return;}
  const reader=new FileReader();
  reader.onload=async e=>{
    const img=new Image();
    img.onload=async()=>{
      const canvas=document.createElement('canvas');const size=400;canvas.width=size;canvas.height=size;
      const ctx=canvas.getContext('2d');const min=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-min)/2,(img.height-min)/2,min,min,0,0,size,size);
      const dataUrl=canvas.toDataURL('image/jpeg',0.75);
      try{await rest('/rest/v1/students?id=eq.'+sid,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({photo_data:dataUrl})});toast('Photo saved','ok');input.value='';nav('pupil_photos');}
      catch(err){toast(err.message,'bad');}
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

  const filtered=list.filter(p=>{
    if(status==='out'&&p.status!=='out')return false;
    if(status==='returned'&&p.status==='out')return false;
    if(q){const st=stuMap[p.student_id];const hay=((st?st.first_name+' '+(st.last_name||''):'')+' '+(st?st.admission_no:'')+' '+(st?st.parent_name||'':'')+' '+(p.reason||'')).toLowerCase();if(hay.indexOf(q)===-1)return false;}
    return true;
  });
  const c=document.getElementById('poTableContainer');if(!c)return;
  if(!filtered.length){c.innerHTML='<div class="empty">'+(q||status!=='all'?'No match.':'No pass-outs.')+'</div>';return;}
  c.innerHTML='<div class="table-wrap"><table><thead><tr><th>#</th><th>Pupil</th><th>Class</th><th>Reason</th><th>Signed Out</th><th>Returned</th><th>Duration</th><th>Status</th><th></th></tr></thead><tbody>'+
  filtered.slice(0,300).map((p,i)=>{const st=stuMap[p.student_id];const outAt=new Date(p.signed_out_at);const inAt=p.signed_in_at?new Date(p.signed_in_at):null;const isOut=p.status==='out';
    let duration='—';if(outAt&&inAt)duration=fmtDuration(inAt-outAt);else if(outAt&&isOut)duration='<b style="color:#b91c1c">'+fmtDuration(Date.now()-outAt.getTime())+' ongoing</b>';
    return '<tr style="'+(isOut?'background:#fef3c7':'')+'"><td>'+(i+1)+'</td>'+
      '<td><b>'+esc(st?st.first_name+' '+(st.last_name||''):'Unknown')+'</b></td>'+
      '<td>'+esc(st&&st.class_id?clsMap[st.class_id]||'—':'—')+'</td>'+
      '<td><span class="badge warn">'+esc(p.reason||'—')+'</span></td>'+
      '<td style="font-size:12px">'+outAt.toLocaleDateString('en-GB')+'<br><span class="muted">'+outAt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+'</span></td>'+
      '<td style="font-size:12px">'+(inAt?inAt.toLocaleDateString('en-GB')+'<br><span class="muted">'+inAt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+'</span>':'—')+'</td>'+
      '<td style="font-size:12px">'+duration+'</td>'+
      '<td>'+(isOut?'<span class="badge bad">OUT</span>':'<span class="badge ok">Returned</span>')+'</td>'+
      '<td style="white-space:nowrap">'+(st?'<button class="btn sm ghost" onclick="openProfile(\''+st.id+'\')">👤</button> ':'')+(isOut?'<button class="btn sm ok" onclick="signInStudent(\''+p.id+'\')">🏠 In</button> ':'')+'<button class="btn sm danger" onclick="delPassOut(\''+p.id+'\')">✕</button></td></tr>';
  }).join('')+'</tbody></table></div>';
}

async function pageTimetable(root){

  if(!classes.length){root.innerHTML='<div class="card"><div class="empty">Create classes first.</div></div>';return;}

  const entries=await rest('/rest/v1/timetable?school_id=eq.'+_schoolId+'&class_id=eq.'+cls.id+'&select=*').catch(()=>[]);
  const days=['Mon','Tue','Wed','Thu','Fri'];const periods=[1,2,3,4,5,6,7,8];
  const times={'1':'08:00','2':'08:40','3':'09:20','4':'10:20','5':'11:00','6':'11:40','7':'14:00','8':'14:40'};

      else{grid+='<div class="tt-cell empty" onclick="editTTCell('+d+','+p+',\''+cls.id+'\')">+</div>';}}});
  grid+='</div>';
  root.innerHTML='<div class="page-head"><div><h1>🗓️ Timetable</h1></div>'+
  '<div style="display:flex;gap:8px"><button class="btn ghost" onclick="printTimetable()">🖨️</button><button class="btn danger" onclick="clearTimetable(\''+cls.id+'\')">🗑️</button></div></div>'+

  '<div class="card" style="overflow-x:auto">'+grid+'</div>';

function buildReportCardBody(student,rd){
  const {exams,cls,subjects,marksByStudent,classAvgPct,classSize,attMap,rankMap,year,term,stageLabel}=rd;
  const perExam=marksByStudent[student.id]||{};
  let grandTotal=0,assessCount=0;
  const subjectRows=subjects.map(s=>{const scores=exams.map(e=>{const sc=perExam[e.id]?.[s.id];if(sc!=null&&!isNaN(sc)){grandTotal+=Number(sc);assessCount++;}return sc!=null&&!isNaN(sc)?Number(sc):null;});return{subject:s,scores};});
  const avg=assessCount?grandTotal/assessCount:0;const pos=rankMap[student.id];
  const att=attMap[student.id]||{present:0,absent:0,total:0};const attPct=att.total?((att.present/att.total)*100).toFixed(0):'—';
  const g=gradeOf(avg);const comment=autoComment(avg,student.first_name);
  let html='<div class="rc-title">'+esc(stageLabel+' Report Card')+'</div>';
  if(student.photo_data)html+='<div style="text-align:center;margin:8px 0"><img src="'+esc(student.photo_data)+'" style="width:80px;height:80px;object-fit:cover;border-radius:8px;border:2px solid #0a2540"></div>';
  html+='<table class="rc-info"><tr><td><b>Name:</b> '+esc(student.first_name+' '+(student.last_name||''))+'</td><td><b>Adm:</b> '+esc(student.admission_no)+'</td><td><b>LIN:</b> '+esc(student.lin||'—')+'</td></tr><tr><td><b>Class:</b> '+esc(cls.name)+'</td><td><b>Year:</b> '+year+'</td><td><b>Term:</b> '+term+'</td></tr></table>';
  html+='<table class="rc-multi"><thead><tr><th>#</th><th>Subject</th>';
  exams.forEach(e=>{html+='<th>'+esc(examStageLabel(e.type))+'</th>';});
  html+='<th>Total</th><th>Grade</th><th>Remark</th></tr></thead><tbody>';
  subjectRows.forEach((r,i)=>{const valid=r.scores.filter(v=>v!=null);const subTotal=valid.reduce((a,b)=>a+b,0);const subAvg=valid.length?subTotal/valid.length:0;const sg=gradeOf(subAvg);
    html+='<tr><td>'+(i+1)+'</td><td>'+esc(r.subject.name)+'</td>';
    r.scores.forEach(v=>{html+='<td style="text-align:center">'+(v!=null?v.toFixed(0):'—')+'</td>';});
    html+='<td style="text-align:right"><b>'+(valid.length?subTotal.toFixed(0):'—')+'</b></td><td style="text-align:center"><b>'+sg.g+'</b></td><td>'+esc(valid.length?sg.r:'—')+'</td></tr>';});
  html+='</tbody><tfoot><tr><td colspan="2">TOTAL</td>';
  exams.forEach(e=>{const t=subjects.reduce((sum,sj)=>sum+(perExam[e.id]?.[sj.id]||0),0);const hasAny=subjects.some(sj=>perExam[e.id]?.[sj.id]!=null);html+='<td style="text-align:center">'+(hasAny?t.toFixed(0):'—')+'</td>';});
  html+='<td style="text-align:right">'+grandTotal.toFixed(0)+'</td><td style="text-align:center">'+g.g+'</td><td>Avg: '+avg.toFixed(1)+'%</td></tr></tfoot></table>';
  html+='<div class="rc-summary"><div><b>Total</b>'+grandTotal.toFixed(0)+'</div><div><b>Average</b>'+avg.toFixed(1)+'%</div><div><b>Position</b>'+(pos?ordinal(pos)+' / '+classSize:'—')+'</div><div><b>Grade</b>'+g.g+' — '+g.r+'</div><div><b>Attendance</b>'+(att.total?att.present+' / '+att.total+' ('+attPct+'%)':'—')+'</div><div><b>Class Avg</b>'+classAvgPct.toFixed(1)+'%</div></div>';
  html+='<div class="rc-comment"><b>📝 Comment:</b><br>'+esc(comment)+'</div>';
  html+='<div class="rc-sign"><div>Teacher: __________</div><div>Head: __________</div><div>Date: '+new Date().toLocaleDateString()+'</div></div>';
  html+=gradeKeyHTML();
  return html;
}
async function pageReports(root){
  root.innerHTML='<div class="loading">Loading…</div>';
  const [exams,classes,subjects]=await Promise.all([rest('/rest/v1/exams?school_id=eq.'+_schoolId+'&select=*&order=created_at.desc').catch(()=>[]),rest('/rest/v1/classes?school_id=eq.'+_schoolId+'&select=*&order=sort_order').catch(()=>[]),rest('/rest/v1/subjects?school_id=eq.'+_schoolId+'&select=*&order=code').catch(()=>[])]);
  if(!exams.length||!classes.length||!subjects.length){root.innerHTML='<div class="card"><div class="empty">Create exams, classes, subjects first.</div></div>';return;}
  const year=window._rcYear!=null?Number(window._rcYear):getCurrentYear();const term=window._rcTerm!=null?Number(window._rcTerm):getCurrentTerm();
  const cId=window._rcClassId||(classes[0]&&classes[0].id);const cls=classes.find(c=>c.id===cId)||classes[0];
  const termExams=exams.filter(e=>Number(e.year)===year&&Number(e.term)===term).sort((a,b)=>examStageRank(a.type)-examStageRank(b.type));
  if(!termExams.length){root.innerHTML='<div class="page-head"><div><h1>📄 Report Cards</h1></div></div><div class="card"><div class="empty">No exams for '+year+' T'+term+'.</div></div>';return;}
  const stageRanks=[...new Set(termExams.map(e=>examStageRank(e.type)))].sort((a,b)=>a-b);
  const highestStage=stageRanks[stageRanks.length-1];let selectedStage=window._rcStage!=null?Number(window._rcStage):highestStage;
  if(!stageRanks.includes(selectedStage))selectedStage=highestStage;
  const activeExams=termExams.filter(e=>examStageRank(e.type)<=selectedStage);const activeExamIds=activeExams.map(e=>e.id);
  const stageLabel=examStageFullLabel(selectedStage);
  const [students,marks,attRecords]=await Promise.all([
    rest('/rest/v1/students?school_id=eq.'+_schoolId+'&class_id=eq.'+cls.id+'&status=eq.active&select=*&order=first_name'),
    rest('/rest/v1/marks?school_id=eq.'+_schoolId+'&exam_id=in.('+activeExamIds.join(',')+')&select=*'),
    rest('/rest/v1/attendance?school_id=eq.'+_schoolId+'&class_id=eq.'+cls.id+'&academic_year=eq.'+year+'&term=eq.'+term+'&select=student_id,status').catch(()=>[])
  ]);
  const studs=students||[];const sidSet=new Set(studs.map(s=>s.id));const mks=(marks||[]).filter(m=>sidSet.has(m.student_id));
  const marksByStudent={};mks.forEach(m=>{if(!marksByStudent[m.student_id])marksByStudent[m.student_id]={};if(!marksByStudent[m.student_id][m.exam_id])marksByStudent[m.student_id][m.exam_id]={};marksByStudent[m.student_id][m.exam_id][m.subject_id]=Number(m.score);});
  const subjList=subjects||[];
  const rows=studs.map(s=>{const per=marksByStudent[s.id]||{};let total=0,count=0;activeExams.forEach(e=>{subjList.forEach(sj=>{const v=per[e.id]?.[sj.id];if(v!=null&&!isNaN(v)){total+=Number(v);count++;}});});const avg=count?total/count:0;return{student:s,total,avg,count};});
  const ranked=rows.filter(r=>r.count>0).slice().sort((a,b)=>b.avg-a.avg);ranked.forEach((r,i)=>{r.position=i+1;});for(let i=1;i<ranked.length;i++){if(ranked[i].avg===ranked[i-1].avg)ranked[i].position=ranked[i-1].position;}
  const rankMap={};ranked.forEach(r=>rankMap[r.student.id]=r.position);
  const classAvgPct=ranked.length?(ranked.reduce((s,r)=>s+r.avg,0)/ranked.length):0;
  const attMap={};(attRecords||[]).forEach(a=>{if(!attMap[a.student_id])attMap[a.student_id]={present:0,absent:0,total:0};attMap[a.student_id].total++;if(a.status==='absent')attMap[a.student_id].absent++;else attMap[a.student_id].present++;});

async function renderClassPerformance(){

async function renderDebtorsAging(){

async function renderProfitLoss(){
  const area=document.getElementById('reportArea');area.innerHTML='<div class="loading">…</div>';
  const cy=getCurrentYear(),ct=getCurrentTerm();
  const [payments,expenses,salaries,uniformSales]=await Promise.all([
    rest('/rest/v1/payments?school_id=eq.'+_schoolId+'&academic_year=eq.'+cy+'&term=eq.'+ct+'&select=amount,payment_for'),
    rest('/rest/v1/expenses?school_id=eq.'+_schoolId+'&academic_year=eq.'+cy+'&term=eq.'+ct+'&select=amount'),
    rest('/rest/v1/staff_salaries?school_id=eq.'+_schoolId+'&year=eq.'+cy+'&status=eq.paid&select=net').catch(()=>[]),
    rest('/rest/v1/uniform_sales?school_id=eq.'+_schoolId+'&academic_year=eq.'+cy+'&term=eq.'+ct+'&select=total_amount').catch(()=>[])
  ]);
  const feeRev=payments.filter(p=>p.payment_for!=='Functional Fees').reduce((s,p)=>s+Number(p.amount),0);
  const funcRev=payments.filter(p=>p.payment_for==='Functional Fees').reduce((s,p)=>s+Number(p.amount),0);
  const uniformRev=uniformSales.reduce((s,u)=>s+Number(u.total_amount),0);
  const expTotal=expenses.reduce((s,e)=>s+Number(e.amount),0);
  const salaryTotal=salaries.reduce((s,x)=>s+Number(x.net),0);
  const rev=feeRev+funcRev+uniformRev;const costs=expTotal+salaryTotal;const profit=rev-costs;
  area.innerHTML='<div class="grid grid-kpi" style="margin-bottom:14px"><div class="kpi kpi-ok"><div class="v">'+fmtUGX(rev)+'</div><div class="l">Revenue</div></div><div class="kpi kpi-bad"><div class="v">'+fmtUGX(costs)+'</div><div class="l">Costs</div></div><div class="kpi '+(profit>=0?'kpi-ok':'kpi-bad')+'"><div class="v">'+fmtUGX(profit)+'</div><div class="l">'+(profit>=0?'Surplus':'Deficit')+'</div></div></div>'+
  '<div class="card"><table><tbody>'+
  '<tr><td>School fees</td><td style="text-align:right">'+feeRev.toLocaleString()+'</td></tr>'+
  '<tr><td>Functional fees</td><td style="text-align:right">'+funcRev.toLocaleString()+'</td></tr>'+
  '<tr><td>Uniforms</td><td style="text-align:right">'+uniformRev.toLocaleString()+'</td></tr>'+
  '<tr style="font-weight:700;background:#ecfdf5"><td>Total Revenue</td><td style="text-align:right">'+rev.toLocaleString()+'</td></tr>'+
  '<tr><td>Expenses</td><td style="text-align:right">'+expTotal.toLocaleString()+'</td></tr>'+
  '<tr><td>Salaries</td><td style="text-align:right">'+salaryTotal.toLocaleString()+'</td></tr>'+
  '<tr style="font-weight:700;background:#fef2f2"><td>Total Costs</td><td style="text-align:right">'+costs.toLocaleString()+'</td></tr>'+
  '<tr style="font-weight:800;font-size:15px;background:'+(profit>=0?'#ecfdf5':'#fef2f2')+';color:'+(profit>=0?'#047857':'#b91c1c')+'"><td>'+(profit>=0?'SURPLUS':'DEFICIT')+'</td><td style="text-align:right">'+Math.abs(profit).toLocaleString()+'</td></tr>'+
  '</tbody></table></div>';
}

  try{
    await rest('/rest/v1/schools?id=eq.'+_schoolId,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({name:n,telephone:document.getElementById('set_phone').value.trim()||null,address:document.getElementById('set_addr').value.trim()||null,motto:document.getElementById('set_motto').value.trim()||null,lin_prefix:lp||null})});
    const sc=await rest('/rest/v1/schools?id=eq.'+_schoolId+'&select=*');_school=sc[0];renderHeader();toast('Saved','ok');
  }catch(e){toast(e.message,'bad');}
}

/* ============================================================
   BULK IMPORT + WHATSAPP + REMINDERS + ROLLOVER
   ============================================================ */
function bulkImportStudents(){
  const input=document.createElement('input');input.type='file';input.accept='.xlsx,.xls';
  input.onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=async ev=>{
      try{
        toast('Reading…','ok');
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
        const sheet=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});
        if(rows.length<2){toast('Empty','bad');return;}
        const headers=rows[0].map(h=>String(h||'').trim().toLowerCase());
        const find=(...names)=>{for(const n of names){const i=headers.findIndex(h=>h===n.toLowerCase());if(i>=0)return i;}for(const n of names){const i=headers.findIndex(h=>h.includes(n.toLowerCase()));if(i>=0)return i;}return -1;};
        const cName=find('name','full name'),cClass=find('class'),cAdm=find('admission','adm'),cGender=find('gender'),cDOB=find('date of birth','dob','birth'),cParent=find('parent name'),cContact=find('parent contact','contact'),cBF=find('balance b/f','b/f'),cActual=find('actual fee','tuition'),cFunc=find('funct','functional'),cTrans=find('transport'),cBoard=find('boarding','status');
        if(cName<0||cClass<0){toast('Missing Name/Class','bad');return;}
        const classes=await loadClasses();const classMap={};classes.forEach(c=>classMap[c.name.toLowerCase()]=c.id);
        const parsed=[];const unknown=new Set();const dupes=[];const existing=window._allStudents||[];
        for(let i=1;i<rows.length;i++){
          const r=rows[i];if(!r)continue;const name=String(r[cName]||'').trim();if(!name||name.toLowerCase()==='name')continue;
          const parts=name.split(/\s+/);const fn=parts[0];const ln=parts.slice(1).join(' ')||null;
          const clsName=String(r[cClass]||'').trim();let classId=classMap[clsName.toLowerCase()]||null;if(!classId&&clsName)unknown.add(clsName);
          const num=v=>{if(v==null||v==='')return 0;const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;};
          const bf=num(r[cBF]),act=num(r[cActual]),func=num(r[cFunc])||FUNC_FEE_DEFAULT,tr=num(r[cTrans]);
          const adm=String(r[cAdm]||'').trim()||('ADM-'+Date.now()+'-'+Math.floor(Math.random()*999));
          const gender=String(r[cGender]||'male').toLowerCase().includes('f')?'female':'male';
          const boarding=String(r[cBoard]||'Day').trim();
          const dob=(cDOB>=0?String(r[cDOB]||'').trim():'')||null;
          const pname=String(r[cParent]||'').trim()||null,pcontact=String(r[cContact]||'').trim()||null;
          // Local duplicate check within file AND against existing students
          const dup=findDuplicateLocal({first_name:fn,last_name:ln,dob,parent_name:pname,parent_contact:pcontact});
          if(dup){dupes.push({fn,ln,adm,reason:'Matches '+dup.admission_no});continue;}
          const tot=bf+act+tr;
          parsed.push({school_id:_schoolId,admission_no:adm,first_name:fn,last_name:ln,lin:generateLIN(fn),date_of_birth:dob,class_id:classId,gender,boarding_status:boarding,parent_name:pname,parent_contact:pcontact,balance_bf:bf,actual_fee:act,functional_fee:func,transport_fee:tr,functional_fee_paid:func>0?func:0,functional_fee_status:func>0?'cash':'pending',total_expected:tot,current_balance:tot,status:'active',qr_code:'STU-'+Date.now()+Math.floor(Math.random()*999)});
        }
        if(!parsed.length){toast(dupes.length?'All rows were duplicates':'No valid rows','bad');return;}
        modal('<h3>📥 Import Preview</h3><div style="background:var(--brandsoft);padding:14px;border-radius:10px;font-size:13px;line-height:1.9"><div><b>Pupils found:</b> '+parsed.length+'</div>'+(dupes.length?'<div style="color:#b91c1c"><b>Duplicates skipped:</b> '+dupes.length+'</div>':'')+'<div><b>Unknown classes:</b> '+(unknown.size||'none')+'</div></div>'+(dupes.length?'<div class="err" style="margin-top:10px;max-height:150px;overflow:auto">Duplicates: '+dupes.map(d=>esc(d.fn+' '+(d.ln||''))+' — '+esc(d.reason)).join('<br>')+'</div>':'')+'<div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn ok" onclick="confirmBulkImport('+JSON.stringify(parsed).replace(/"/g,'&quot;')+','+JSON.stringify([...unknown]).replace(/"/g,'&quot;')+')">✅ Import '+parsed.length+'</button></div>');
      }catch(err){toast('Error: '+err.message,'bad');}
    };
    reader.readAsArrayBuffer(file);
  };
  input.click();
}
async function confirmBulkImport(parsed,unknown){
  closeModal();toast('Importing…','ok');
  const classes=await loadClasses();const classMap={};classes.forEach(c=>classMap[c.name.toLowerCase()]=c.id);
  for(const clsName of unknown){if(!clsName)continue;try{const ins=await rest('/rest/v1/classes',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({school_id:_schoolId,name:clsName.trim(),sort_order:0})});if(ins&&ins[0])classMap[clsName.toLowerCase()]=ins[0].id;}catch(e){}}
  _classesCache=null;
  let ok=0;
  for(let i=0;i<parsed.length;i+=50){const chunk=parsed.slice(i,i+50);try{await rest('/rest/v1/students',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify(chunk)});ok+=chunk.length;}catch(e){}}
  toast('Imported '+ok,'ok');nav('students');
}
function openWhatsApp(phone,message){if(!phone){toast('No phone','bad');return;}const p=String(phone).replace(/[^0-9]/g,'');window.open('https://wa.me/'+p+'?text='+encodeURIComponent(message||''),'_blank');}
function whatsappStudent(id,preset){rest('/rest/v1/students?id=eq.'+id+'&select=*').then(r=>{const s=r[0];if(!s)return;let msg='Hello '+(s.parent_name||'Parent')+',\n\n';if(preset==='fees'){const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);msg+='Reminder about fees for '+s.first_name+' '+(s.last_name||'')+'.\n\nExpected: '+fmtUGX(sf)+'\n\nKindly clear. Thank you.\n\n'+_school.name;}else msg+='Regarding '+s.first_name+' '+(s.last_name||'')+' (LIN: '+(s.lin||'—')+')\n\n'+_school.name;openWhatsApp(s.parent_contact,msg);});}
async function sendFeeReminders(){
  const students=await rest('/rest/v1/students?school_id=eq.'+_schoolId+'&status=eq.active&select=*');
  const payments=await rest('/rest/v1/payments?school_id=eq.'+_schoolId+'&select=student_id,amount,payment_for');
  const pbs={};payments.forEach(p=>{if(p.payment_for!=='Functional Fees'){if(!pbs[p.student_id])pbs[p.student_id]=0;pbs[p.student_id]+=Number(p.amount);}});
  const debtors=students.filter(s=>{const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);return (sf-(pbs[s.id]||0))>0&&s.parent_contact;});
  if(!debtors.length){toast('No debtors with phone','ok');return;}
  if(!confirm('Queue reminders for '+debtors.length+' parents?'))return;
  const rows=debtors.map(s=>{const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);const bal=sf-(pbs[s.id]||0);return {school_id:_schoolId,student_id:s.id,channel:'sms',phone:s.parent_contact,message:'Dear Parent, '+s.first_name+' has UGX '+bal.toLocaleString()+' balance. Kindly clear. Thank you.',amount_owed:bal,status:'queued'};});
  try{for(let i=0;i<rows.length;i+=50)await rest('/rest/v1/fee_reminders',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify(rows.slice(i,i+50))});toast('Queued '+rows.length,'ok');}catch(e){toast(e.message,'bad');}
}
async function termRollover(){
  const cy=getCurrentYear(),ct=getCurrentTerm();
  const nextTerm=ct<3?ct+1:1,nextYear=ct<3?cy:cy+1;
  modal('<h3>🔄 Term Rollover</h3><div style="background:var(--warnsoft);padding:14px;border-radius:10px;font-size:13px;line-height:1.9"><b>Current:</b> '+cy+' T'+ct+'<br><b>Next:</b> '+nextYear+' T'+nextTerm+'<br><br>All balances carry forward as B/F.</div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="cfmRollover('+cy+','+ct+','+nextYear+','+nextTerm+')">🔄 Proceed</button></div>');
}
async function cfmRollover(cy,ct,ny,nt){
  closeModal();toast('Rolling over…','ok');
  try{
    const students=await rest('/rest/v1/students?school_id=eq.'+_schoolId+'&status=eq.active&select=id,balance_bf,actual_fee,transport_fee');
    const payments=await rest('/rest/v1/payments?school_id=eq.'+_schoolId+'&academic_year=eq.'+cy+'&term=eq.'+ct+'&select=student_id,amount,payment_for');
    const pbs={};payments.forEach(p=>{if(p.payment_for!=='Functional Fees'){if(!pbs[p.student_id])pbs[p.student_id]=0;pbs[p.student_id]+=Number(p.amount);}});
    for(const s of students){const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);const newBF=sf-(pbs[s.id]||0);await rest('/rest/v1/students?id=eq.'+s.id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({balance_bf:newBF,actual_fee:0,transport_fee:0})});}
    await rest('/rest/v1/term_history',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,year:cy,term:ct,ended_at:new Date().toISOString(),notes:'Rolled to '+ny+' T'+nt})});
    setCurrentPeriod(ny,nt);populateTermSelector();toast('✅ Rolled to '+ny+' T'+nt,'ok');nav('dashboard');
  }catch(e){toast('Failed: '+e.message,'bad');}
}

/* ============================================================
   PARENT ACCESS
   ============================================================ */

  const [students,codes]=await Promise.all([rest('/rest/v1/students?school_id=eq.'+_schoolId+'&status=eq.active&select=id,first_name,last_name,admission_no,parent_name,parent_contact,class_id,lin&order=first_name'),rest('/rest/v1/parent_access?school_id=eq.'+_schoolId+'&select=*').catch(()=>[])]);
  const codeMap={};codes.forEach(c=>codeMap[c.student_id]=c);
  const classes=await loadClasses();const clsMap={};classes.forEach(c=>clsMap[c.id]=c.name);
  root.innerHTML='<div class="page-head"><div><h1>👨‍👩‍👧 Parent Access</h1><div class="sub">Parents log in using the pupil\'s LIN</div></div>'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" onclick="printAllLins()">🖨️ Print All LINs</button></div></div>'+
  '<div class="alert-item info" style="border-left-color:var(--navy);margin-bottom:14px"><span class="ico">🎓</span><div class="txt"><b>Parents now use the LIN to log in</b><span>No access codes needed. Share each pupil\'s LIN with their parent via WhatsApp or SMS.</span></div></div>'+
  '<div class="card"><div class="table-wrap"><table><thead><tr><th>Pupil</th><th>Class</th><th>LIN</th><th>Parent</th><th></th></tr></thead><tbody>'+
  students.map(s=>'<tr><td><b>'+esc(s.first_name+' '+(s.last_name||''))+'</b><div class="muted" style="font-size:11px">'+esc(s.admission_no)+'</div></td><td>'+esc(clsMap[s.class_id]||'—')+'</td>'+
    '<td>'+(s.lin?'<span class="lin-chip" onclick="copyLin(\''+esc(s.lin)+'\')">'+esc(s.lin)+'</span>':'<span class="badge warn">—</span>')+'</td>'+
    '<td>'+esc(s.parent_name||'—')+'</td>'+
    '<td style="white-space:nowrap">'+(s.lin&&s.parent_contact?'<button class="btn sm ok" onclick="shareLinWithParent(\''+s.id+'\')">💬 Send LIN</button> ':'')+'<button class="btn sm ghost" onclick="openProfile(\''+s.id+'\')">👤</button></td></tr>').join('')+'</tbody></table></div></div>';
}
async function shareLinWithParent(sid){
  const st=(await rest('/rest/v1/students?id=eq.'+sid+'&select=*'))[0];
  if(!st||!st.lin){toast('No LIN','bad');return;}
  if(!st.parent_contact){toast('No parent phone','bad');return;}
  const msg='Hello '+(st.parent_name||'Parent')+',\n\n'+
    'Your child *'+st.first_name+' '+(st.last_name||'')+'* can now be tracked online.\n\n'+
    '🎓 *LIN:* '+st.lin+'\n\n'+
    'To view fees, reports, attendance and more, use this LIN at:\n'+location.origin+location.pathname+'\n\n'+
    'Keep it private.\n\n'+_school.name;
  openWhatsApp(st.parent_contact,msg);
}
function printAllLins(){
  const list=window._allStudents||[];
  if(!list.length){toast('No pupils loaded','bad');return;}
  const classes=_classesCache||[];const clsMap={};classes.forEach(c=>clsMap[c.id]=c.name);
  const rows=list.filter(s=>s.lin).map((s,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(s.admission_no)+'</td><td><b>'+esc(s.first_name+' '+(s.last_name||''))+'</b></td><td>'+esc(clsMap[s.class_id]||'—')+'</td><td style="font-family:monospace;font-weight:800;font-size:13px">'+esc(s.lin)+'</td><td>'+esc(s.parent_name||'')+'</td><td>'+esc(s.parent_contact||'')+'</td></tr>').join('');
  printHTML('All LINs','<table><thead><tr><th>#</th><th>Adm</th><th>Name</th><th>Class</th><th>LIN</th><th>Parent</th><th>Contact</th></tr></thead><tbody>'+rows+'</tbody></table>');
}

/* ============================================================
   BOOT
   ============================================================ */
async function handleAuthRedirect(){
  const hash=window.location.hash;
  if(hash&&hash.includes('access_token')){
    const p=new URLSearchParams(hash.substring(1));
    const at=p.get('access_token');const rt=p.get('refresh_token');
    if(at){try{const r=await fetch(SUPA_URL+'/auth/v1/user',{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+at}});const u=await r.json();if(u&&u.id){setSession({access_token:at,refresh_token:rt,user:u});window.history.replaceState(null,'',window.location.pathname);await boot();return;}}catch(e){}}
  }
  const s=safeStorage.getItem('eudes_session');
  if(s){try{await boot();}catch(e){console.error(e);}}
}
handleAuthRedirect();
console.log('%c✅ Eudes School Management loaded','color:#d4a017;font-weight:800;font-size:14px');
