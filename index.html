<style>

.btn.ok{background:var(--ok)}

.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:6px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;z-index:1000;font-size:13px;font-weight:500;box-shadow:0 20px 40px -12px rgba(10,37,64,.5);max-width:90vw;text-align:center}

.auth-bg{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),#2c5282);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;overflow:auto}
.auth-card{background:#fff;border-radius:20px;padding:30px 26px;width:100%;max-width:440px;box-shadow:0 40px 80px -20px rgba(0,0,0,.5);margin:auto}

.modal-bg{position:fixed;inset:0;background:rgba(10,37,64,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(2px)}

.modal{background:#fff;border-radius:20px 20px 0 0;max-width:680px;width:100%;max-height:92vh;overflow:auto;padding:22px}

.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line2);flex-wrap:wrap}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:90;box-shadow:0 -4px 16px rgba(10,37,64,.08)}
.bottom-bar-inner{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:1100px;margin:0 auto}
.bottom-bar-inner::-webkit-scrollbar{display:none}
.bottom-bar .pill{background:var(--navy);color:#fff;border-color:var(--navy);padding:9px 14px;font-size:12px}
.bottom-bar .pill.active{background:var(--gold);border-color:var(--gold);color:#fff}
.wa-float{position:fixed;bottom:96px;right:16px;background:#25D366;color:#fff;width:52px;height:52px;border-radius:50%;z-index:99;text-decoration:none;box-shadow:0 10px 20px rgba(0,0,0,.25);display:grid;place-items:center;font-size:22px}
.mini-stat{display:inline-block;padding:6px 12px;background:#f1f5f9;border-radius:8px;font-size:12px;font-weight:600;color:var(--navy);margin:2px 4px 2px 0}
.alert-item{display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;background:#fff;border-left:4px solid var(--gold);margin-bottom:8px;font-size:13px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.alert-item.danger{border-left-color:var(--bad)}
.alert-item.ok{border-left-color:var(--ok)}

.marks-input{width:70px;padding:6px;text-align:center;border:2px solid var(--line);border-radius:8px;font-weight:700}

@media print{.no-print{display:none!important}.container{padding:0;max-width:none}}
</style>
</head>

<script>
/* ============================================================
   Progressive Mothers School Management — v4 (schema-accurate)
   Matches the real Supabase schema from Oct 2026.
   ============================================================ */
const SUPA_URL='https://wabeempxckdtjvrkzhpv.supabase.co';
const SUPA_KEY='sb_publishable_n0uAm0Gcq7qR2dJM4jMZGQ_wiV__Cfp'; // ⚠️ replace with eyJ... anon key

let _memoryStore={};
const safeStorage={getItem:k=>{try{return localStorage.getItem(k);}catch(e){return _memoryStore[k]||null;}},setItem:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){_memoryStore[k]=String(v);}},removeItem:k=>{try{localStorage.removeItem(k);}catch(e){delete _memoryStore[k];}}};
function getCurrentYear(){return parseInt(safeStorage.getItem('pm_year'))||new Date().getFullYear();}
function getCurrentTerm(){return parseInt(safeStorage.getItem('pm_term'))||1;}
function setCurrentPeriod(y,t){safeStorage.setItem('pm_year',String(y));safeStorage.setItem('pm_term',String(t));}
function getToken(){const s=safeStorage.getItem('pm_session');if(!s)return null;try{return JSON.parse(s).access_token;}catch(e){return null;}}
function getUser(){const s=safeStorage.getItem('pm_session');if(!s)return null;try{return JSON.parse(s).user;}catch(e){return null;}}
function setSession(d){if(d)safeStorage.setItem('pm_session',JSON.stringify(d));else safeStorage.removeItem('pm_session');}

async function rest(path,options){
  options=options||{};
  const headers=Object.assign({'apikey':SUPA_KEY,'Content-Type':'application/json'},options.headers||{});
  const token=getToken();headers['Authorization']='Bearer '+(token||SUPA_KEY);
  const res=await fetch(SUPA_URL+path,Object.assign({},options,{headers}));
  const text=await res.text();let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok){if(res.status===401){setSession(null);alert('Session expired.');window.location.reload();throw new Error('Session expired');}throw new Error((data&&(data.message||data.msg||data.error_description||data.error||data.hint))||text||('HTTP '+res.status));}
  return data;
}
async function auth(path,body){
  const res=await fetch(SUPA_URL+path,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const text=await res.text();let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok)throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status));return data;
}

let _profile=null,_school=null,_schoolId=null,_role=null,_classesCache=null,_examsCache=null;
let _marksClass=null,_marksExam=null,_subjClass=null,_importMatches=null;
let _enumPaymentMethod=[],_enumPaymentProvider=[],_enumAttendanceStatus=[];
const CACHE_KEYS={students:'allStudents',payments:'allPayments',classes:'allClasses',exams:'allExams',subjects:'allSubjects',staff:'allStaff'};

function cache(k,v){window['_'+CACHE_KEYS[k]]=v;}
function getCache(k){return window['_'+CACHE_KEYS[k]]||[];}

function toast(msg,type){const el=document.createElement('div');el.className='toast'+(type==='bad'?' bad':(type==='ok'?' ok':''));el.textContent=msg;document.getElementById('toastRoot').appendChild(el);setTimeout(()=>el.remove(),3500);}
function modal(html){const root=document.getElementById('modalRoot');root.innerHTML='<div class="modal-bg"><div class="modal">'+html+'</div></div>';root.querySelector('.modal-bg').addEventListener('click',e=>{if(e.target.classList.contains('modal-bg'))closeModal();});}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtUGX(n){if(n==null||isNaN(n))return 'UGX 0';return 'UGX '+(Number(n)||0).toLocaleString();}
function fmtNum(n){if(n==null||isNaN(n))return '0';return (Number(n)||0).toLocaleString();}
function fmtDate(ts){if(!ts)return '—';const d=new Date(ts);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function fmtLongDate(d){return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});}
function fmtDateTime(ts){if(!ts)return '—';const d=new Date(ts);return fmtDate(ts)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function telLink(num){if(!num)return '';return String(num).replace(/[^0-9+]/g,'');}
function waLink(num){if(!num)return '';let clean=String(num).replace(/[^0-9]/g,'');if(clean.startsWith('0'))clean='256'+clean.slice(1);return clean;}
window.toast=toast;window.modal=modal;window.closeModal=closeModal;window.esc=esc;

/* ---------- PRINT ---------- */
function printSection(title,tableHTML){
  const w=window.open('','_blank');
  if(!w){toast('Allow popups','bad');return;}
  const logo=_school&&(_school.logo_data||_school.logo_url);
  const now=new Date();
  const stamp=now.toLocaleDateString('en-GB')+' '+now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>'+esc(title)+'</title><style>'+
    '*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#111;padding:20px;margin:0;font-size:13px}'+
    '.letterhead{display:flex;align-items:center;gap:16px;padding-bottom:14px;border-bottom:2px solid #0a2540;margin-bottom:18px}'+

    '.letterhead .fallback{width:70px;height:70px;border-radius:50%;background:#e0e9f5;display:grid;place-items:center;font-size:32px;color:#0a2540;flex-shrink:0}'+
    '.letterhead h1{font-size:18px;margin:0 0 4px;text-transform:uppercase;color:#0a2540}'+
    '.letterhead .meta{font-size:11.5px;color:#555}'+
    '.doc-title{text-align:center;font-size:14px;font-weight:700;text-transform:uppercase;color:#0a2540;margin:14px 0 6px}'+
    '.doc-stamp{text-align:center;font-size:11px;color:#666;margin-bottom:14px}'+
    'table{width:100%;border-collapse:collapse;margin-top:10px}'+
    'th,td{padding:7px 9px;border:1px solid #ccc;font-size:11.5px;text-align:left}'+
    'th{background:#0a2540;color:#fff;text-transform:uppercase;font-size:10px}'+
    'tbody tr:nth-child(even){background:#f8fafc}'+
    '.footer{text-align:center;font-size:10px;color:#888;margin-top:24px;padding-top:10px;border-top:1px solid #eee}'+
    '@page{margin:10mm;size:A4 landscape}@media print{body{padding:0}}'+

function posLabel(n){if(!n)return '—';if(n===1)return '1st';if(n===2)return '2nd';if(n===3)return '3rd';return n+'th';}

/* Enum-safe helpers */
function normMethodForDb(v){
  const m={
    'Cash':'cash','Mobile Money':'mobile_money','Mobile money':'mobile_money','mobile money':'mobile_money','Momo':'mobile_money','MTN':'mobile_money','Airtel':'mobile_money',
    'Bank':'bank','Bank Transfer':'bank_transfer','Cheque':'cheque','Other':'other'
  };
  const raw=String(v||'cash').trim();
  const mapped=m[raw]||raw.toLowerCase().replace(/\s+/g,'_');
  // ensure it's in list
  if(_enumPaymentMethod.includes(mapped))return mapped;
  if(_enumPaymentMethod.includes(raw.toLowerCase()))return raw.toLowerCase();
  return _enumPaymentMethod[0]||'cash';
}
function normStatusForDb(v){
  const raw=String(v||'present').trim().toLowerCase();
  if(_enumAttendanceStatus.includes(raw))return raw;
  if(_enumAttendanceStatus.includes('present'))return raw;
  return _enumAttendanceStatus[0]||raw;
}

function exportContacts(mode){
  const students=getCache('students');
  const classes=_classesCache||[];
  const classesById={};classes.forEach(c=>classesById[c.id]=c);
  let rows=students.map(s=>{
    const cls=classesById[s.class_id];
    const res=String(s.boarding_status||'Day').toLowerCase();
    return{
      'ADM No':s.admission_no||'',
      'Pupil Name':(s.first_name||'')+' '+(s.last_name||''),
      'Class':cls?cls.name:'',
      'Boarding':res==='boarding'?'Boarding':'Day',
      'Parent Name':s.parent_name||'',
      'Parent Contact':s.parent_contact||'',
      'Location':s.location||s.district||'',
      'Status':s.status||'active'
    };
  });
  if(mode==='with')rows=rows.filter(r=>r['Parent Contact']);
  if(mode==='missing')rows=rows.filter(r=>!r['Parent Contact']);
  rows.sort((a,b)=>(a.Class||'').localeCompare(b.Class||'')||(a['Pupil Name']||'').localeCompare(b['Pupil Name']||''));
  if(!rows.length){toast('Nothing to export','bad');return;}
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:16},{wch:24},{wch:14},{wch:10},{wch:24},{wch:18},{wch:18},{wch:10}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Parent Contacts');
  const suffix=mode==='with'?'WithContacts':mode==='missing'?'MissingContacts':'AllContacts';
  XLSX.writeFile(wb,'ParentContacts_'+suffix+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('Downloaded: '+rows.length+' contacts','ok');closeModal();
}
window.exportContacts=exportContacts;

function copyContactsToClipboard(){
  const students=getCache('students');
  const classes=_classesCache||[];
  const classesById={};classes.forEach(c=>classesById[c.id]=c);
  const rows=students.filter(s=>s.parent_contact);
  if(!rows.length){toast('No contacts to copy','bad');return;}
  const text=rows.map(s=>{
    const cls=classesById[s.class_id];
    const name=(s.first_name||'')+' '+(s.last_name||'');
    const cleaned=String(s.parent_contact).replace(/[^0-9+]/g,'');
    return cleaned+'  -  '+(s.parent_name||'Parent')+' ('+name+', '+(cls?cls.name:'')+')';
  }).join('\n');
  navigator.clipboard.writeText(text).then(()=>{toast('Copied '+rows.length+' contacts!','ok');closeModal();}).catch(()=>{
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    toast('Copied '+rows.length+' contacts!','ok');closeModal();
  });
}
window.copyContactsToClipboard=copyContactsToClipboard;

function filterStudentsTable(q,fClass){
  q=(q||'').toLowerCase();fClass=fClass||'';

  const classes=_classesCache||[];
  const filtered=getCache('students').filter(s=>{
    if(fClass&&s.class_id!==fClass)return false;

    if(fRes&&res!==fRes)return false;
    if(q){const hay=(s.first_name+' '+(s.last_name||'')+' '+(s.admission_no||'')+' '+(s.parent_name||'')+' '+(s.parent_contact||'')+' '+(s.lin||'')+' '+(s.location||'')+' '+(s.district||'')).toLowerCase();if(hay.indexOf(q)===-1)return false;}
    return true;
  });
  window._filteredStudents=filtered;
  document.getElementById('studentCount').textContent=getCache('students').length+' total · '+filtered.length+' shown';
  const c=document.getElementById('studentsTableContainer');
  if(!filtered.length){c.innerHTML='<div class="empty">No pupils.</div>';return;}
  let rows='';
  filtered.forEach(s=>{
    const cls=classes.find(x=>x.id===s.class_id);
    const charged=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.functional_fee)||0)+(Number(s.transport_fee)||0)+(Number(s.holiday_fee)||0)+(Number(s.academics_fee)||0);

      }

      '<td><b>'+esc(s.first_name+' '+(s.last_name||''))+'</b></td>'+
      '<td>'+(cls?'<span class="badge info">'+esc(cls.name)+'</span>':'<span class="badge bad">No class</span>')+'</td>'+

      '<td style="text-align:right"><span class="badge '+(bal>0?'bad':'ok')+'">'+fmtNum(bal)+'</span></td>'+

async function saveStudent(id){
  const num=id=>Number(document.getElementById(id).value)||0;
  const body={
    school_id:_schoolId,
    admission_no:document.getElementById('m_adm').value.trim(),
    class_id:document.getElementById('m_class').value||null,
    first_name:document.getElementById('m_fn').value.trim(),
    last_name:document.getElementById('m_ln').value.trim()||null,
    gender:document.getElementById('m_gender').value||null,
    date_of_birth:document.getElementById('m_dob').value||null,
    lin:document.getElementById('m_lin').value.trim()||null,
    boarding_status:document.getElementById('m_res').value,
    location:document.getElementById('m_location').value.trim()||null,
    district:document.getElementById('m_district').value.trim()||null,
    parent_name:document.getElementById('m_par').value.trim()||null,
    parent_contact:document.getElementById('m_pc').value.trim()||null,
    balance_bf:num('m_bf'),
    actual_fee:num('m_fee'),
    functional_fee:num('m_func'),
    transport_fee:num('m_trans'),
    holiday_fee:num('m_hol'),
    academics_fee:num('m_acad'),
    deposit_1:num('m_d1'),
    deposit_2:num('m_d2'),
    deposit_3:num('m_d3')
  };
  body.total_expected=body.balance_bf+body.actual_fee+body.functional_fee+body.transport_fee+body.holiday_fee+body.academics_fee;
  body.current_balance=body.total_expected-(body.deposit_1+body.deposit_2+body.deposit_3);
  if(!body.admission_no||!body.first_name){toast('ADM and name required','bad');return;}
  if(!body.class_id){toast('Select class','bad');return;}
  try{
    if(id)await rest('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});
    else await rest('/rest/v1/students',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});
    toast('Saved','ok');closeModal();nav(activeRoute);
  }catch(e){toast(e.message,'bad');}
}

async function savePayment(studentId){
  const amount=Number(document.getElementById('p_amount').value);
  const receipt_no=document.getElementById('p_receipt').value.trim()||('RCP-'+Date.now());
  if(!amount||amount<=0){toast('Enter amount','bad');return;}
  const s=getCache('students').find(x=>x.id===studentId);if(!s){toast('Not found','bad');return;}
  const payment_for=document.getElementById('p_for').value;
  const method=normMethodForDb(document.getElementById('p_method').value);
  const providerRaw=document.getElementById('p_provider').value;
  const provider=providerRaw?(_enumPaymentProvider.includes(providerRaw)?providerRaw:_enumPaymentProvider[0]):null;
  const momo_number=document.getElementById('p_momo').value.trim()||null;
  const transaction_id=document.getElementById('p_txn').value.trim()||null;
  const bank_name=document.getElementById('p_bank').value.trim()||null;
  const bank_branch=document.getElementById('p_branch').value.trim()||null;
  const notes=document.getElementById('p_notes').value.trim()||null;
  const body={
    school_id:_schoolId,
    student_id:studentId,
    receipt_no:receipt_no,
    year:getCurrentYear(),
    term:getCurrentTerm(),
    academic_year:getCurrentYear(),
    amount:amount,
    method:method,
    payment_for:payment_for,
    payment_method:document.getElementById('p_method').value,
    received_by:_profile?_profile.id:null
  };
  if(provider)body.provider=provider;
  if(momo_number)body.momo_number=momo_number;
  if(transaction_id)body.transaction_id=transaction_id;
  if(bank_name)body.bank_name=bank_name;
  if(bank_branch)body.bank_branch=bank_branch;
  if(notes)body.notes=notes;

  try{
    await rest('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});
    // Update student's deposit boxes
    const dep={deposit_1:Number(s.deposit_1)||0,deposit_2:Number(s.deposit_2)||0,deposit_3:Number(s.deposit_3)||0};
    if(!dep.deposit_1)dep.deposit_1=amount;else if(!dep.deposit_2)dep.deposit_2=amount;else dep.deposit_3+=amount;
    const charged=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.functional_fee)||0)+(Number(s.transport_fee)||0)+(Number(s.holiday_fee)||0)+(Number(s.academics_fee)||0);
    const newCollected=dep.deposit_1+dep.deposit_2+dep.deposit_3;
    await rest('/rest/v1/students?id=eq.'+studentId,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify(Object.assign({current_balance:charged-newCollected,total_expected:charged},dep))});
    toast('Payment saved. Receipt: '+receipt_no,'ok');
    printReceipt(s,{receipt_no,amount,payment_for,method:document.getElementById('p_method').value,provider:providerRaw,notes,date:new Date().toISOString(),momo:momo_number,txn:transaction_id,bank:bank_name});
    closeModal();nav(activeRoute);
  }catch(e){toast(e.message,'bad');}
}

function filterPayments(){
  const q=(document.getElementById('paySearch').value||'').toLowerCase();

  const fd=document.getElementById('payDateFilter').value||'';
  const students=window._paymentsStudents||[];

  const classes=_classesCache||[];

  const filtered=(window._allPayments||[]).filter(p=>{
    if(fm&&p.method!==fm)return false;
    if(fd&&(p.paid_at||'').slice(0,10)!==fd)return false;
    if(q){
      const s=studentsById[p.student_id]||{};
      const hay=((p.receipt_no||'')+' '+(s.first_name||'')+' '+(s.last_name||'')+' '+(s.admission_no||'')).toLowerCase();

      '<td>'+esc((s.first_name||'')+' '+(s.last_name||''))+'</td>'+
      '<td>'+esc(cls?cls.name:'')+'</td>'+

      '<td>'+esc(p.method||'')+'</td>'+

      '</tr>';
  });
  c.innerHTML='<div class="table-wrap"><table style="font-size:12px"><thead><tr><th>Date</th><th>Receipt</th><th>ADM</th><th>Pupil</th><th>Class</th><th>For</th><th>Method</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';

async function setMark(inputEl){
  const studentId=inputEl.dataset.student,subjectId=inputEl.dataset.subject;
  const val=inputEl.value,score=val===''?null:parseFloat(val);
  if(score!=null&&(isNaN(score)||score<0||score>100)){toast('0-100','bad');inputEl.value='';return;}
  try{
    if(score==null){
      await rest('/rest/v1/marks?school_id=eq.'+_schoolId+'&student_id=eq.'+studentId+'&exam_id=eq.'+window._marksExamId+'&subject_id=eq.'+subjectId,{method:'DELETE'});
      if(window._marksMap[studentId])delete window._marksMap[studentId][subjectId];
    }else{
      await rest('/rest/v1/marks?school_id=eq.'+_schoolId+'&student_id=eq.'+studentId+'&exam_id=eq.'+window._marksExamId+'&subject_id=eq.'+subjectId,{method:'DELETE'});
      await rest('/rest/v1/marks',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,student_id:studentId,exam_id:window._marksExamId,subject_id:subjectId,score:score,academic_year:getCurrentYear(),term:getCurrentTerm()})});
      if(!window._marksMap[studentId])window._marksMap[studentId]={};
      window._marksMap[studentId][subjectId]=score;
    }
    const per=window._marksMap[studentId]||{};let total=0;
    (window._marksSubjects||[]).forEach(sj=>{const v=per[sj.subject_id];if(v!=null&&!isNaN(v))total+=Number(v);});
    const el=document.querySelector('.row-total[data-student="'+studentId+'"]');if(el)el.textContent=total.toFixed(0);
  }catch(e){toast(e.message,'bad');}
}
window.setMark=setMark;

function rankingTable(students,subjects,marks){
  const rows=students.map(s=>{
    const m=marks[s.id]||{};let t=0,c=0;
    subjects.forEach(sj=>{const v=m[sj.subject_id];if(v!=null&&!isNaN(v)){t+=Number(v);c++;}});
    return{s,total:t,avg:c?t/c:0,cnt:c};
  });
  rows.sort((a,b)=>b.avg-a.avg);rows.forEach((r,i)=>r.pos=i+1);
  for(let i=1;i<rows.length;i++)if(rows[i].avg===rows[i-1].avg)rows[i].pos=rows[i-1].pos;
  let body='';
  rows.forEach(r=>{
    const g=gradeOf(r.avg);
    body+='<tr><td><b>'+posLabel(r.pos)+'</b></td><td>'+esc(r.s.admission_no)+'</td><td>'+esc(r.s.first_name+' '+(r.s.last_name||''))+'</td><td style="text-align:right">'+r.total.toFixed(0)+'</td><td><span class="badge '+g.cls+'">'+g.g+'</span></td><td>'+esc(r.s.lin||'')+'</td></tr>';
  });
  return '<div class="table-wrap"><table><thead><tr><th>Pos</th><th>ADM</th><th>Name</th><th style="text-align:right">Total</th><th>Grade</th><th>LIN</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
window.rankingTable=rankingTable;

  }).sort((a,b)=>b.avg-a.avg);
  ranked.forEach((r,i)=>r.pos=i+1);

function filterPassOuts(){
  const q=(document.getElementById('poSearch').value||'').toLowerCase();
  const status=document.getElementById('poStatusFilter').value||'';
  const range=document.getElementById('poRangeFilter').value||'';
  const students=window._passOutStudents||[];
  const studentsById={};students.forEach(s=>studentsById[s.id]=s);
  const classes=_classesCache||[];
  const classesById={};classes.forEach(c=>classesById[c.id]=c);
  const now=new Date();
  const startOfDay=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const startOfWeek=new Date(startOfDay);startOfWeek.setDate(startOfDay.getDate()-startOfDay.getDay());
  const startOfMonth=new Date(now.getFullYear(),now.getMonth(),1);
  const filtered=(window._allPassOuts||[]).filter(p=>{
    if(status&&p.status!==status)return false;
    if(range){
      const d=new Date(p.signed_out_at||0);
      if(range==='today'&&d<startOfDay)return false;
      if(range==='week'&&d<startOfWeek)return false;
      if(range==='month'&&d<startOfMonth)return false;
    }
    if(q){
      const s=studentsById[p.student_id]||{};
      const hay=((s.first_name||'')+' '+(s.last_name||'')+' '+(s.admission_no||'')+' '+(p.reason||'')).toLowerCase();
      if(hay.indexOf(q)===-1)return false;
    }
    return true;
  });
  window._filteredPassOuts=filtered;
  document.getElementById('poCount').textContent=(window._allPassOuts||[]).length+' total · '+filtered.length+' shown';
  const c=document.getElementById('poTableContainer');
  if(!filtered.length){c.innerHTML='<div class="empty">No records match.</div>';return;}
  let rows='';
  filtered.forEach(p=>{
    const s=studentsById[p.student_id]||{};
    const cls=classesById[s.class_id];
    rows+='<tr><td>'+esc(s.admission_no||'—')+'</td><td><b>'+esc((s.first_name||'')+' '+(s.last_name||''))+'</b></td><td>'+esc(cls?cls.name:'—')+'</td><td>'+esc(p.reason||'')+'</td><td>'+fmtDateTime(p.signed_out_at)+'</td><td>'+fmtDateTime(p.signed_in_at)+'</td><td>'+(p.status==='out'?'<span class="badge bad">OUT</span>':'<span class="badge ok">Returned</span>')+'</td><td>'+(p.status==='out'?'<button class="btn sm ok" onclick="returnPass(\''+p.id+'\')">Return</button>':'')+'</td></tr>';
  });
  c.innerHTML='<div class="table-wrap"><table><thead><tr><th>ADM</th><th>Pupil</th><th>Class</th><th>Reason</th><th>Out</th><th>In</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
window.filterPassOuts=filterPassOuts;

function printPassOuts(){
  const list=window._filteredPassOuts||window._allPassOuts||[];

}
window.pageUniforms=pageUniforms;

function addUniformSale(){

async function saveUniformSale(){

/* ============ EXPENSES ============ */
async function pageExpenses(root){
  const cy=getCurrentYear(),ct=getCurrentTerm();
  let rows=await rest('/rest/v1/expenses?school_id=eq.'+_schoolId+'&select=*&order=date.desc').catch(()=>[]);
  rows=rows.filter(e=>(e.academic_year===cy||!e.academic_year)&&(e.term===ct||!e.term));
  window._allExpenses=rows;
  root.innerHTML='<div class="page-head"><div><h1>💸 Expenses</h1><div class="sub">'+cy+' Term '+ct+' · '+rows.length+' records</div></div><div style="display:flex;gap:8px"><button class="btn ghost" onclick="printExpenses()">🖨️ Print</button><button class="btn" onclick="addExpense()">＋ Add Expense</button></div></div><div class="card"><div class="grid grid-2" style="margin-bottom:12px"><input id="expenseSearch" placeholder="Search description, category…" oninput="filterExpenses()"><select id="expenseCategoryFilter" onchange="filterExpenses()"><option value="">All categories</option></select></div><div id="expenseTableContainer"></div></div>';
  const catSel=document.getElementById('expenseCategoryFilter');
  const cats=[...new Set(rows.map(e=>e.category).filter(Boolean))].sort();
  cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;catSel.appendChild(o);});
  filterExpenses();
}
window.pageExpenses=pageExpenses;

function filterExpenses(){
  const q=(document.getElementById('expenseSearch').value||'').toLowerCase();
  const fCat=document.getElementById('expenseCategoryFilter').value||'';
  const filtered=(window._allExpenses||[]).filter(e=>{
    if(fCat&&e.category!==fCat)return false;
    if(q){const hay=((e.description||'')+' '+(e.category||'')+' '+(e.supplier||'')).toLowerCase();if(hay.indexOf(q)===-1)return false;}
    return true;
  });
  window._filteredExpenses=filtered;
  const total=filtered.reduce((s,x)=>s+Number(x.amount),0);
  const c=document.getElementById('expenseTableContainer');
  if(!filtered.length){c.innerHTML='<div class="empty">No expenses match.</div>';return;}
  let body='';
  filtered.forEach(e=>{body+='<tr><td>'+fmtDate(e.date)+'</td><td>'+esc(e.description)+'</td><td>'+esc(e.category||'')+'</td><td>'+esc(e.supplier||'')+'</td><td style="text-align:right;font-weight:700;color:#b91c1c">'+fmtUGX(e.amount)+'</td></tr>';});
  body+='<tr style="background:#f1f5f9;font-weight:700"><td colspan="4" style="text-align:right">TOTAL</td><td style="text-align:right;color:#b91c1c">'+fmtUGX(total)+'</td></tr>';
  c.innerHTML='<div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Supplier</th><th style="text-align:right">Amount</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
window.filterExpenses=filterExpenses;

function printExpenses(){
  const rows=window._filteredExpenses||window._allExpenses||[];
  if(!rows.length){toast('Nothing to print','bad');return;}
  let body='';let total=0;
  rows.forEach((e,i)=>{total+=Number(e.amount);body+='<tr><td>'+(i+1)+'</td><td>'+fmtDate(e.date)+'</td><td>'+esc(e.description)+'</td><td>'+esc(e.category||'')+'</td><td>'+esc(e.supplier||'')+'</td><td style="text-align:right">'+fmtNum(e.amount)+'</td></tr>';});
  body+='<tr style="background:#f1f5f9;font-weight:700"><td colspan="5" style="text-align:right">GRAND TOTAL</td><td style="text-align:right">'+fmtNum(total)+'</td></tr>';
  printSection('Expenses — '+getCurrentYear()+' Term '+getCurrentTerm(),'<table><thead><tr><th>#</th><th>Date</th><th>Description</th><th>Category</th><th>Supplier</th><th style="text-align:right">Amount</th></tr></thead><tbody>'+body+'</tbody></table>');
}
window.printExpenses=printExpenses;

function addExpense(){
  modal('<h3>Add Expense</h3><div><label>Description *</label><input id="x_d"></div><div class="grid grid-2" style="margin-top:12px"><div><label>Amount *</label><input id="x_a" type="number"></div><div><label>Category</label><input id="x_c" placeholder="Utilities"></div></div><div class="grid grid-2" style="margin-top:12px"><div><label>Method</label><input id="x_m" placeholder="Cash"></div><div><label>Supplier</label><input id="x_s"></div></div><div style="margin-top:12px"><label>Notes</label><input id="x_n"></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveExpense()">Save</button></div>');
}
window.addExpense=addExpense;

async function saveExpense(){
  const description=document.getElementById('x_d').value.trim();
  const amount=Number(document.getElementById('x_a').value);
  const category=document.getElementById('x_c').value.trim()||'Other';
  const method=document.getElementById('x_m').value.trim()||'Cash';
  const supplier=document.getElementById('x_s').value.trim()||null;
  const notes=document.getElementById('x_n').value.trim()||null;
  if(!description||!amount){toast('Fill required','bad');return;}
  try{await rest('/rest/v1/expenses',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,description:description,amount:amount,category:category,method:method,supplier:supplier,notes:notes,academic_year:getCurrentYear(),term:getCurrentTerm(),recorded_by:_profile?_profile.id:null})});toast('Saved','ok');closeModal();nav('expenses');}
  catch(e){toast(e.message,'bad');}
}
window.saveExpense=saveExpense;

/* ============ MESSAGES ============ */
async function pageMessages(root){
  const msgs=await rest('/rest/v1/messages?school_id=eq.'+_schoolId+'&select=*&order=sent_at.desc&limit=200').catch(()=>[]);
  window._allMessages=msgs;
  let rows='';
  msgs.forEach(m=>{rows+='<tr><td>'+fmtDate(m.sent_at)+'</td><td>'+esc(m.recipient_phone||'—')+'</td><td>'+esc(m.recipient_name||'—')+'</td><td>'+esc(m.body||'')+'</td></tr>';});

function addMessage(){
  modal('<h3>New Message</h3><div><label>Phone</label><input id="ms_p" placeholder="+256..."></div><div style="margin-top:12px"><label>Recipient Name</label><input id="ms_n"></div><div style="margin-top:12px"><label>Body</label><textarea id="ms_b" rows="4"></textarea></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveMessage()">Save</button></div>');
}

async function saveMessage(){
  const recipient_phone=document.getElementById('ms_p').value.trim();
  const recipient_name=document.getElementById('ms_n').value.trim()||null;
  const body=document.getElementById('ms_b').value.trim();
  if(!body){toast('Enter body','bad');return;}
  try{await rest('/rest/v1/messages',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,recipient_phone:recipient_phone||null,recipient_name:recipient_name,body:body,channel:'sms',status:'sent',academic_year:getCurrentYear(),term:getCurrentTerm()})});toast('Saved','ok');closeModal();nav('messages');}
  catch(e){toast(e.message,'bad');}
}
window.saveMessage=saveMessage;

/* ============ SETTINGS ============ */
async function pageSettings(root){
  const [feeDef,transportZones]=await Promise.all([
    rest('/rest/v1/class_fee_defaults?school_id=eq.'+_schoolId+'&select=*&order=class_name').catch(()=>[]),
    rest('/rest/v1/transport_zones?school_id=eq.'+_schoolId+'&select=*&order=zone_name').catch(()=>[])
  ]);
  window._feeDefaults=feeDef;window._transportZones=transportZones;
  let feeRows='';feeDef.forEach(f=>{feeRows+='<tr><td><b>'+esc(f.class_name)+'</b></td><td style="text-align:right">'+fmtNum(f.day_fee)+'</td><td style="text-align:right">'+fmtNum(f.boarding_fee)+'</td><td style="text-align:right">'+fmtNum(f.uniform_fee)+'</td><td><button class="btn sm danger" onclick="delFeeDefault(\''+f.id+'\')">✕</button></td></tr>';});
  let tzRows='';transportZones.forEach(z=>{tzRows+='<tr><td><b>'+esc(z.zone_name)+'</b></td><td>'+esc(z.distance||'')+'</td><td style="text-align:right">'+fmtNum(z.fee)+'</td><td><button class="btn sm danger" onclick="delTransportZone(\''+z.id+'\')">✕</button></td></tr>';});
  root.innerHTML='<div class="page-head"><div><h1>⚙️ Settings</h1><div class="sub">School information, fees & transport</div></div></div>'+
  '<div class="card"><h3>School Info</h3><div class="grid grid-2"><div><label>Name</label><input id="s_name" value="'+esc(_school?.name||'')+'"></div><div><label>Telephone</label><input id="s_phone" value="'+esc(_school?.telephone||'')+'"></div><div><label>Address</label><input id="s_addr" value="'+esc(_school?.address||'')+'"></div><div><label>Head Teacher</label><input id="s_head" value="'+esc(_school?.head_teacher||'')+'"></div><div><label>Director</label><input id="s_dir" value="'+esc(_school?.director_name||'')+'"></div><div><label>Pay Code</label><input id="s_pay" value="'+esc(_school?.payment_code||'')+'"></div><div><label>Next Term Begins</label><input id="s_next" type="date" value="'+esc(_school?.next_term_begins||'')+'"></div><div><label>LIN Prefix</label><input id="s_lin" value="'+esc(_school?.lin_prefix||'')+'"></div></div><div style="margin-top:12px"><label>Logo URL</label><input id="s_logo" value="'+esc(_school?.logo_url||'')+'"></div><button class="btn" style="margin-top:14px" onclick="saveSchool()">💾 Save</button></div>'+
  '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">Class Fee Defaults</h3><button class="btn sm" onclick="addFeeDefault()">＋ Add</button></div>'+(feeRows?'<div class="table-wrap"><table><thead><tr><th>Class</th><th style="text-align:right">Day</th><th style="text-align:right">Boarding</th><th style="text-align:right">Uniform</th><th></th></tr></thead><tbody>'+feeRows+'</tbody></table></div>':'<div class="empty">No fee defaults yet.</div>')+'</div>'+
  '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">Transport Zones</h3><button class="btn sm" onclick="addTransportZone()">＋ Add</button></div>'+(tzRows?'<div class="table-wrap"><table><thead><tr><th>Zone</th><th>Distance</th><th style="text-align:right">Fee</th><th></th></tr></thead><tbody>'+tzRows+'</tbody></table></div>':'<div class="empty">No transport zones yet.</div>')+'</div>'+
  '<div class="card"><h3>Account</h3><div class="muted">Signed in as <b>'+esc(_profile?.full_name||'')+'</b> ('+esc(_profile?.email||'')+')</div><div class="muted" style="margin-top:6px">Role: <b>'+esc(_role||'')+'</b></div><button class="btn danger" style="margin-top:12px" onclick="doLogout()">Sign Out</button></div>';
}
window.pageSettings=pageSettings;

async function saveSchool(){
  const body={
    name:document.getElementById('s_name').value.trim(),
    telephone:document.getElementById('s_phone').value.trim(),
    address:document.getElementById('s_addr').value.trim(),
    head_teacher:document.getElementById('s_head').value.trim(),
    director_name:document.getElementById('s_dir').value.trim(),
    payment_code:document.getElementById('s_pay').value.trim(),
    next_term_begins:document.getElementById('s_next').value||null,
    lin_prefix:document.getElementById('s_lin').value.trim(),
    logo_url:document.getElementById('s_logo').value.trim()
  };
  try{await rest('/rest/v1/schools?id=eq.'+_schoolId,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});_school=Object.assign(_school,body);renderHeader();toast('Saved','ok');}
  catch(e){toast(e.message,'bad');}
}
window.saveSchool=saveSchool;

function addFeeDefault(){
  modal('<h3>Add Class Fee Default</h3><div><label>Class Name</label><input id="fd_c" placeholder="Primary 1"></div><div class="grid grid-3" style="margin-top:12px"><div><label>Day Fee</label><input id="fd_d" type="number" value="0"></div><div><label>Boarding Fee</label><input id="fd_b" type="number" value="0"></div><div><label>Uniform Fee</label><input id="fd_u" type="number" value="0"></div></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveFeeDefault()">Save</button></div>');
}
window.addFeeDefault=addFeeDefault;

async function saveFeeDefault(){
  const class_name=document.getElementById('fd_c').value.trim();
  const day_fee=Number(document.getElementById('fd_d').value)||0;
  const boarding_fee=Number(document.getElementById('fd_b').value)||0;
  const uniform_fee=Number(document.getElementById('fd_u').value)||0;
  if(!class_name){toast('Enter class name','bad');return;}
  try{await rest('/rest/v1/class_fee_defaults',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,class_name:class_name,day_fee:day_fee,boarding_fee:boarding_fee,uniform_fee:uniform_fee})});toast('Saved','ok');closeModal();nav('settings');}
  catch(e){toast(e.message,'bad');}
}
window.saveFeeDefault=saveFeeDefault;

async function delFeeDefault(id){if(!confirm('Delete?'))return;try{await rest('/rest/v1/class_fee_defaults?id=eq.'+id,{method:'DELETE'});toast('Deleted','ok');nav('settings');}catch(e){toast(e.message,'bad');}}
window.delFeeDefault=delFeeDefault;

function addTransportZone(){

window.addTransportZone=addTransportZone;

  const zone_name=document.getElementById('tz_n').value.trim();
  const distance=document.getElementById('tz_d').value.trim()||null;
  const fee=Number(document.getElementById('tz_f').value)||0;

  catch(e){toast(e.message,'bad');}
}
window.saveTransportZone=saveTransportZone;

async function delTransportZone(id){if(!confirm('Delete?'))return;try{await rest('/rest/v1/transport_zones?id=eq.'+id,{method:'DELETE'});toast('Deleted','ok');nav('settings');}catch(e){toast(e.message,'bad');}}
window.delTransportZone=delTransportZone;

if(getUser()&&getToken()){boot();}
</script>
