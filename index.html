const SUPA_URL='https://wabeempxckdtjvrkzhpv.supabase.co';

function getCurrentYear(){return parseInt(safeStorage.getItem('eudes_year'))||new Date().getFullYear();}
function getCurrentTerm(){return parseInt(safeStorage.getItem('eudes_term'))||1;}
function setCurrentPeriod(y,t){safeStorage.setItem('eudes_year',String(y));safeStorage.setItem('eudes_term',String(t));}

let _memoryStore={};
const safeStorage={
  getItem:k=>{try{return localStorage.getItem(k);}catch(e){return _memoryStore[k]||null;}},
  setItem:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){_memoryStore[k]=String(v);}},
  removeItem:k=>{try{localStorage.removeItem(k);}catch(e){delete _memoryStore[k];}}
};

function getToken(){const s=safeStorage.getItem('eudes_session');if(!s)return null;try{return JSON.parse(s).access_token;}catch(e){return null;}}
function getUser(){const s=safeStorage.getItem('eudes_session');if(!s)return null;try{return JSON.parse(s).user;}catch(e){return null;}}
function setSession(d){if(d)safeStorage.setItem('eudes_session',JSON.stringify(d));else safeStorage.removeItem('eudes_session');}

async function rest(path,options){
  options=options||{};
  const headers=Object.assign({'apikey':SUPA_KEY,'Content-Type':'application/json'},options.headers||{});
  const token=getToken();
  headers['Authorization']='Bearer '+(token||SUPA_KEY);
  const res=await fetch(SUPA_URL+path,Object.assign({},options,{headers}));
  const text=await res.text();
  let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok){
    if(res.status===401){setSession(null);alert('Session expired.');window.location.reload();throw new Error('Session expired');}
    throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status));
  }
  return data;
}
async function auth(path,body){
  const res=await fetch(SUPA_URL+path,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const text=await res.text();
  let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok)throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status));
  return data;
}

const FP_CRED_KEY='eudes_fp_cred';
const FP_SESS_KEY='eudes_fp_session';

function b64u(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64u(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const bin=atob(str);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}

async function fpAvailable(){
  if(!window.PublicKeyCredential)return false;
  try{return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();}
  catch(e){return false;}
}
window.fpAvailable=fpAvailable;

async function fpPrompt(allowCredId){
  const challenge=crypto.getRandomValues(new Uint8Array(32));
  try{
    const a=await navigator.credentials.get({
      publicKey:{challenge,rpId:location.hostname,
        allowCredentials:allowCredId?[{type:'public-key',id:unb64u(allowCredId)}]:[],
        userVerification:'required',timeout:60000}
    });
    if(!a)return{error:'Cancelled'};
    return{credentialId:b64u(a.rawId)};
  }catch(e){
    if(e.name==='NotAllowedError')return{error:'Cancelled'};
    if(e.name==='InvalidStateError')return{error:'Fingerprint not recognised'};
    return{error:e.message||'Failed'};
  }
}

async function fpRegister({name,displayName,userId}){
  const challenge=crypto.getRandomValues(new Uint8Array(32));
  const uid=userId||crypto.getRandomValues(new Uint8Array(16));
  try{
    const c=await navigator.credentials.create({
      publicKey:{challenge,
        rp:{name:_school?.name||'Eudes School',id:location.hostname},
        user:{id:uid,name,displayName:displayName||name},
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
        authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'required',requireResidentKey:true},
        timeout:90000,attestation:'none'}
    });
    if(!c)return{error:'Cancelled'};
    return{credentialId:b64u(c.rawId)};
  }catch(e){
    if(e.name==='NotAllowedError')return{error:'Cancelled'};
    if(e.name==='InvalidStateError')return{error:'Already registered on this device'};
    return{error:e.message||'Failed'};
  }
}

/* Register fingerprints for staff/pupils */
async function registerPersonFP(type,id){
  if(!(await fpAvailable())){toast('No fingerprint sensor on this device','bad');return;}
  let label='',subtitle='';
  if(type==='student'){const st=(await rest('/rest/v1/students?id=eq.'+id+'&select=*'))[0];if(!st){toast('Not found','bad');return;}label=st.first_name+' '+(st.last_name||'');subtitle=st.admission_no;}
  else{const sf=(await rest('/rest/v1/staff?id=eq.'+id+'&select=*'))[0];if(!sf){toast('Not found','bad');return;}label=sf.full_name;subtitle=sf.role||'';}

  modal('<div style="text-align:center;padding:20px">'+
    '<div class="fp-hero" id="regHero"><div class="icon">🖐️</div><h3 style="margin-bottom:6px">'+esc(label)+'</h3><div class="muted" id="regMsg">Ask them to touch the sensor 2–3 times…</div></div>'+
    '<div id="regResult" style="margin-top:16px"></div>'+
    '<button class="btn ghost block" style="margin-top:20px" onclick="closeModal()">Cancel</button></div>');

  toast('Touch the sensor now…','ok');
  const r=await fpRegister({name:(type==='student'?'student:':'staff:')+id,displayName:label,userId:crypto.getRandomValues(new Uint8Array(16))});
  const el=document.getElementById('regResult');
  if(!el)return;
  if(r.error){
    document.getElementById('regHero').innerHTML='<div class="icon">❌</div><h3 style="margin-bottom:6px">Failed</h3><div class="muted">'+esc(r.error)+'</div>';
    el.innerHTML='<button class="btn block" onclick="closeModal();registerPersonFP(\''+type+'\',\''+id+'\')">🖐️ Try again</button>';
    return;
  }
  try{
    await rest('/rest/v1/fp_credentials?school_id=eq.'+_schoolId+'&'+(type==='student'?'student_id':'staff_id')+'=eq.'+id+'&purpose=eq.attendance',{method:'DELETE'});
    const row={credential_id:r.credentialId,school_id:_schoolId,purpose:'attendance',device_label:navigator.userAgent.slice(0,80)};
    if(type==='student')row.student_id=id;else row.staff_id=id;
    await rest('/rest/v1/fp_credentials',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(row)});
    const now=new Date().toISOString();
    if(type==='student')await rest('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({fp_registered_at:now})});
    else await rest('/rest/v1/staff?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({fp_registered_at:now})});
    document.getElementById('regHero').innerHTML='<div class="icon">✅</div><h3 style="margin-bottom:6px">'+esc(label)+'</h3><div class="muted">Registered successfully</div>';
    el.innerHTML='<button class="btn ok block" onclick="closeModal();nav(\'fingerprint\')">Done</button>';
  }catch(e){
    el.innerHTML='<div class="alert-item danger"><span class="ico">❌</span><div class="txt"><b>Save failed</b><span>'+esc(e.message)+'</span></div></div>';
  }
}

async function fpIdentify(){
  if(!(await fpAvailable()))return{error:'No fingerprint sensor on this device'};
  const r=await fpPrompt(null);
  if(r.error)return r;
  let row=null;
  try{row=(await rest('/rest/v1/fp_credentials?credential_id=eq.'+encodeURIComponent(r.credentialId)+'&school_id=eq.'+_schoolId+'&purpose=eq.attendance&select=staff_id,student_id'))[0];}
  catch(e){}
  if(!row)return{error:'Not registered in this school'};
  if(row.student_id){
    const st=(await rest('/rest/v1/students?id=eq.'+row.student_id+'&select=id,first_name,last_name,admission_no,class_id,status'))[0];
    return{type:'student',student:st,credentialId:r.credentialId};
  }
  if(row.staff_id){
    const sf=(await rest('/rest/v1/staff?id=eq.'+row.staff_id+'&select=id,full_name,role'))[0];
    return{type:'staff',staff:sf,credentialId:r.credentialId};
  }
  return{error:'No matching record'};
}
window.fpIdentify=fpIdentify;

function filterStudentsTable(q,fClass){

  const classes=_classesCache||[];
  const paid=window._paidByStudent||{};
  const openMap=window._openPassOuts||{};
  const filtered=(window._allStudents||[]).filter(s=>{
    if(fClass&&s.class_id!==fClass)return false;
    if(fFunc==='out'&&!openMap[s.id])return false;
    if(fFunc&&fFunc!=='out'&&s.functional_fee_status!==fFunc)return false;
    if(q){const hay=(s.first_name+' '+(s.last_name||'')+' '+s.admission_no+' '+(s.parent_name||'')+' '+(s.parent_contact||'')).toLowerCase();if(hay.indexOf(q)===-1)return false;}

  document.getElementById('studentCount').textContent=(window._allStudents||[]).length+' total · '+filtered.length+' shown';

  c.innerHTML='<div class="table-wrap"><table><thead><tr><th>Adm No</th><th>Name</th><th>Class</th><th>Parent</th><th>Func.</th><th style="text-align:right">Balance</th><th style="text-align:right">Actions</th></tr></thead><tbody>'+
  filtered.map(s=>{
    const cls=(classes||[]).find(x=>x.id===s.class_id);
    const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);
    const p=paid[s.id]||{school:0};
    const bal=sf-p.school;
    const openPO=openMap[s.id];
    const outBadge=openPO?' <span class="badge" style="background:#dc2626;color:#fff;border-color:#991b1b" title="Out since '+new Date(openPO.signed_out_at).toLocaleString()+'">🚪 OUT</span>':'';
    return '<tr style="'+(openPO?'background:#fef3c7':'')+'">'+
      '<td><b>'+esc(s.admission_no)+'</b></td>'+
      '<td><b>'+esc(s.first_name+' '+(s.last_name||''))+'</b>'+(s.fp_registered_at?' <span class="badge ok" title="Fingerprint registered">🖐️</span>':'')+outBadge+'</td>'+
      '<td><span class="badge info">'+esc(cls?cls.name:'—')+'</span></td>'+
      '<td>'+esc(s.parent_name||'—')+'</td>'+
      '<td>'+functionalStatusBadge(s.functional_fee_status)+'</td>'+
      '<td style="text-align:right"><span class="badge '+(bal>0?'bad':'ok')+'">'+bal.toLocaleString()+'</span></td>'+
      '<td style="text-align:right;white-space:nowrap">'+
      '<button class="btn sm" onclick="recordPayment(\''+s.id+'\')">💵</button> '+

async function recordPayment(id,preselectFor){
  const [st,pays]=await Promise.all([rest('/rest/v1/students?id=eq.'+id+'&select=*'),rest('/rest/v1/payments?student_id=eq.'+id+'&select=amount,payment_for')]);
  const s=st[0];if(!s)return;
  const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);
  const ff=Number(s.functional_fee)||FUNC_FEE_DEFAULT;
  const sp=pays.filter(p=>p.payment_for!=='Functional Fees').reduce((sum,p)=>sum+Number(p.amount),0);
  const fp=pays.filter(p=>p.payment_for==='Functional Fees').reduce((sum,p)=>sum+Number(p.amount),0);
  const funcPaid=Math.max(fp,Number(s.functional_fee_paid)||0);
  const bal=sf-sp;const funcShort=Math.max(0,ff-funcPaid);
  const now=new Date();const tz=now.getTimezoneOffset()*60000;const l=new Date(now-tz).toISOString().slice(0,16);
  const defaultAmt=preselectFor==='Functional Fees'?(funcShort>0?funcShort:''):(bal>0?bal:'');
  modal('<h3>💵 Payment — '+esc(s.first_name+' '+(s.last_name||''))+'</h3>'+
  '<div style="background:var(--brandsoft);padding:12px;border-radius:10px;margin-bottom:16px;font-size:13px;line-height:1.9">'+
  '<div>📚 <b>School balance:</b> '+fmtUGX(bal)+'</div>'+
  '<div>🧾 <b>Func.:</b> '+functionalStatusBadge(s.functional_fee_status)+' — '+fmtUGX(funcPaid)+' of '+fmtUGX(ff)+'</div></div>'+
  '<div class="grid grid-2">'+
  '<div><label>Payment for</label><select id="p_for" onchange="onPaymentForChange()"><option value="School Fees"'+(preselectFor!=='Functional Fees'?' selected':'')+'>📚 School</option><option value="Functional Fees"'+(preselectFor==='Functional Fees'?' selected':'')+'>🧾 Functional</option></select></div>'+
  '<div><label>Amount *</label><input id="p_amount" type="number" value="'+defaultAmt+'"></div>'+
  '<div><label>Method</label><select id="p_method" onchange="toggleTxn()"><option>Cash</option><option>Mobile Money</option><option>Bank Transfer</option><option>Bank</option><option>Cheque</option></select></div>'+
  '<div><label>Date</label><input id="p_date" type="datetime-local" value="'+l+'"></div>'+
  '<div id="txnIdField" style="display:none"><label>Txn ID</label><input id="p_txn"></div>'+
  '<div><label>Notes</label><input id="p_notes"></div></div>'+
  '<div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn ok" onclick="savePayment(\''+id+'\')">Save</button></div>');
  window._funcShort=funcShort;window._schoolBal=bal;
}
window.recordPayment=recordPayment;
function onPaymentForChange(){const pf=document.getElementById('p_for').value;const amt=document.getElementById('p_amount');if(pf==='Functional Fees'&&window._funcShort>0)amt.value=window._funcShort;else if(pf==='School Fees'&&window._schoolBal>0)amt.value=window._schoolBal;}
window.onPaymentForChange=onPaymentForChange;
function toggleTxn(){const m=document.getElementById('p_method').value;const f=document.getElementById('txnIdField');if(m==='Cash'){f.style.display='none';const t=document.getElementById('p_txn');if(t)t.value='';}else f.style.display='block';}
window.toggleTxn=toggleTxn;

async function savePayment(id){
  const pf=document.getElementById('p_for').value;
  const amt=parseFloat(document.getElementById('p_amount').value);
  const method=document.getElementById('p_method').value;
  const txn=(document.getElementById('p_txn')?.value||'').trim();
  const dv=document.getElementById('p_date').value;
  const nt=document.getElementById('p_notes').value.trim();
  if(!amt||amt<=0){toast('Invalid amount','bad');return;}
  if(method!=='Cash'&&!txn){toast('Txn ID required','bad');return;}
  try{
    await rest('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({school_id:_schoolId,student_id:id,amount:amt,payment_for:pf,payment_method:method,transaction_id:txn||null,notes:nt||null,paid_at:new Date(dv).toISOString(),academic_year:getCurrentYear(),term:getCurrentTerm()})});
    const [st,pays]=await Promise.all([rest('/rest/v1/students?id=eq.'+id+'&select=total_expected,functional_fee'),rest('/rest/v1/payments?student_id=eq.'+id+'&select=amount,payment_for')]);
    const te=Number(st[0].total_expected)||0;const ff=Number(st[0].functional_fee)||FUNC_FEE_DEFAULT;
    const sp=pays.filter(p=>p.payment_for!=='Functional Fees').reduce((s,p)=>s+Number(p.amount),0);
    const fp=pays.filter(p=>p.payment_for==='Functional Fees').reduce((s,p)=>s+Number(p.amount),0);
    const upd={current_balance:te-sp,functional_fee_paid:fp};
    if(pf==='Functional Fees'&&fp>=ff)upd.functional_fee_status='cash';
    await rest('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify(upd)});
    toast('Saved · '+fmtUGX(amt),'ok');closeModal();nav(activeRoute);
  }catch(e){toast(e.message,'bad');}
}
window.savePayment=savePayment;

function renderPassOutsTable(){
  const list=window._passOutsList||[];
  const students=window._passOutsStudents||[];
  const q=(window._poFilterQ||'').toLowerCase().trim();
  const status=window._poFilterStatus||'all';
  const stuMap={};students.forEach(s=>stuMap[s.id]=s);
  const clsMap={};(_classesCache||[]).forEach(c=>clsMap[c.id]=c.name);

  let filtered=list.filter(p=>{
    if(status==='out'&&p.status!=='out')return false;
    if(status==='returned'&&p.status==='out')return false;
    if(q){
      const st=stuMap[p.student_id];
      const hay=((st?st.first_name+' '+(st.last_name||''):'')+' '+(st?st.admission_no:'')+' '+(st?st.parent_name||'':'')+' '+(st?st.parent_contact||'':'')+' '+(p.reason||'')+' '+(p.picked_up_by||'')+' '+(p.notes||'')).toLowerCase();
      if(hay.indexOf(q)===-1)return false;
    }
    return true;
  });

  const c=document.getElementById('poTableContainer');
  if(!c)return;
  if(!filtered.length){
    c.innerHTML='<div class="empty">'+(q||status!=='all'?'No records match your filter.':'No pass-outs yet.')+'</div>';
    return;
  }
  c.innerHTML='<div class="table-wrap"><table><thead><tr>'+
  '<th>#</th><th>Pupil</th><th>Adm</th><th>Class</th><th>Reason</th><th>Picked Up By</th>'+
  '<th>Signed Out</th><th>Returned</th><th>Duration</th><th>Status</th><th></th></tr></thead><tbody>'+
  filtered.slice(0,300).map((p,i)=>{
    const st=stuMap[p.student_id];
    const outAt=new Date(p.signed_out_at);
    const inAt=p.signed_in_at?new Date(p.signed_in_at):null;
    const isOut=p.status==='out';
    let duration='—';
    if(outAt&&inAt)duration=fmtDuration(inAt-outAt);
    else if(outAt&&isOut)duration='<b style="color:#b91c1c">'+fmtDuration(Date.now()-outAt.getTime())+' ongoing</b>';

      '<td>'+(isOut?'<span class="badge bad">🚪 OUT</span>':'<span class="badge ok">✅</span>')+'</td>'+

        (st?'<button class="btn sm ghost" onclick="openProfile(\''+st.id+'\')">👤</button> ':'')+

async function fpPassOut(preStudentId){
  const cnt=(await rest('/rest/v1/fp_credentials?school_id=eq.'+_schoolId+'&purpose=eq.attendance&student_id=not.is.null&select=id').catch(()=>[])).length;
  if(!cnt&&!preStudentId){toast('No pupil fingerprints registered','bad');return;}
  if(preStudentId){
    const st=(await rest('/rest/v1/students?id=eq.'+preStudentId+'&select=*'))[0];
    if(!st){toast('Not found','bad');return;}
    openManualPassOut(st);
    return;
  }
  modal('<div style="text-align:center;padding:20px">'+
    '<div class="fp-hero" id="fpHero"><div class="icon">🚪</div><h3 style="margin-bottom:6px">Pupil touches to sign out</h3><div class="muted">Waiting for fingerprint…</div></div>'+
    '<div id="fpResult" style="margin-top:16px"></div>'+
    '<button class="btn ghost block" style="margin-top:20px" onclick="closeModal()">Close</button></div>');
  const r=await fpIdentify();
  const el=document.getElementById('fpResult');
  if(!el)return;
  if(r.error||r.type!=='student'){
    document.getElementById('fpHero').innerHTML='<div class="icon">❌</div><h3 style="margin-bottom:6px">'+(r.error||'Not a pupil')+'</h3>';
    el.innerHTML='<button class="btn block" onclick="closeModal();fpPassOut()">🖐️ Try again</button>';
    return;
  }
  const st=r.student;
  if(!st||st.status!=='active'){
    document.getElementById('fpHero').innerHTML='<div class="icon">⚠️</div><h3 style="margin-bottom:6px">Not active</h3>';
    return;
  }
  openManualPassOut(st);
}

function buildReportCardBody(student,rd){
  const {exams,cls,subjects,marksByStudent,classAvgPct,classSize,attMap,rankMap,year,term,stageLabel}=rd;
  const perExam=marksByStudent[student.id]||{};
  let grandTotal=0,assessCount=0;
  const subjectRows=subjects.map(s=>{const scores=exams.map(e=>{const sc=perExam[e.id]?.[s.id];if(sc!=null&&!isNaN(sc)){grandTotal+=Number(sc);assessCount++;}return sc!=null&&!isNaN(sc)?Number(sc):null;});return{subject:s,scores};});
  const avg=assessCount?grandTotal/assessCount:0;const pos=rankMap[student.id];
  const att=attMap[student.id]||{present:0,absent:0,total:0};const attPct=att.total?((att.present/att.total)*100).toFixed(0):'—';
  const g=gradeOf(avg);const comment=autoComment(avg,student.first_name);
  let html='';
  html+='<div class="rc-title">'+esc(stageLabel+' Report Card')+'</div>';
  html+='<table class="rc-info"><tr><td><b>Name:</b> '+esc(student.first_name+' '+(student.last_name||''))+'</td><td><b>Adm No:</b> '+esc(student.admission_no)+'</td><td><b>LIN:</b> '+esc(student.lin||'—')+'</td></tr><tr><td><b>Class:</b> '+esc(cls.name)+'</td><td><b>Year:</b> '+year+'</td><td><b>Term:</b> '+term+'</td></tr></table>';
  html+='<table class="rc-multi"><thead><tr><th>#</th><th>Subject</th>';
  exams.forEach(e=>{html+='<th>'+esc(examStageLabel(e.type))+'<span class="sub">'+esc(e.name)+'</span></th>';});
  html+='<th>Total</th><th>Grade</th><th>Remark</th></tr></thead><tbody>';
  subjectRows.forEach((r,i)=>{const valid=r.scores.filter(v=>v!=null);const subTotal=valid.reduce((a,b)=>a+b,0);const subAvg=valid.length?subTotal/valid.length:0;const sg=gradeOf(subAvg);
    html+='<tr><td>'+(i+1)+'</td><td>'+esc(r.subject.name)+'</td>';
    r.scores.forEach(v=>{html+='<td style="text-align:center">'+(v!=null?v.toFixed(0):'—')+'</td>';});
    html+='<td style="text-align:right;font-weight:600">'+(valid.length?subTotal.toFixed(0):'—')+'</td><td style="text-align:center"><b>'+sg.g+'</b></td><td>'+esc(valid.length?sg.r:'—')+'</td></tr>';});
  html+='</tbody><tfoot><tr><td colspan="2">GRAND TOTAL</td>';
  exams.forEach(e=>{const examTotal=subjects.reduce((sum,sj)=>{const sc=perExam[e.id]?.[sj.id];return sum+(sc!=null&&!isNaN(sc)?Number(sc):0);},0);const hasAny=subjects.some(sj=>perExam[e.id]?.[sj.id]!=null);html+='<td style="text-align:center">'+(hasAny?examTotal.toFixed(0):'—')+'</td>';});
  html+='<td style="text-align:right">'+grandTotal.toFixed(0)+'</td><td style="text-align:center">'+g.g+'</td><td>Avg: '+avg.toFixed(1)+'%</td></tr></tfoot></table>';
  html+='<div class="rc-summary"><div><b>Total</b>'+grandTotal.toFixed(0)+'</div><div><b>Average</b>'+avg.toFixed(1)+'%</div><div><b>Position</b>'+(pos?ordinal(pos)+' / '+classSize:'—')+'</div><div><b>Grade</b>'+g.g+' — '+g.r+'</div><div><b>Attendance</b>'+(att.total?att.present+' / '+att.total+' ('+attPct+'%)':'—')+'</div><div><b>Class Avg</b>'+classAvgPct.toFixed(1)+'%</div></div>';
  html+='<div class="rc-comment"><b>📝 Teacher\'s Comment:</b><br>'+esc(comment)+'</div>';
  html+='<div class="rc-sign"><div>Class Teacher: ___________</div><div>Head Teacher: ___________</div><div>Date: '+new Date().toLocaleDateString()+'</div></div>';
  html+=gradeKeyHTML();
  return html;
}

  '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" onclick="printBroadsheet()">📊 Broadsheet</button><button class="btn" onclick="printAllReportCards()">🖨️ Print All</button></div></div>'+
  '<div class="card"><div class="grid grid-3">'+

  '<div><label>Term</label><select onchange="window._rcTerm=this.value;window._rcStage=null;nav(\'reports\')"><option value="1"'+(term==1?' selected':'')+'>Term 1</option><option value="2"'+(term==2?' selected':'')+'>Term 2</option><option value="3"'+(term==3?' selected':'')+'>Term 3</option></select></div>'+
  '<div><label>Class</label><select onchange="window._rcClassId=this.value;nav(\'reports\')">'+classes.map(c=>'<option value="'+c.id+'"'+(c.id===cls.id?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div>'+
  '<div style="grid-column:1/-1"><label>Stage (cumulative)</label><select onchange="window._rcStage=this.value;nav(\'reports\')">'+
  stageOptions.map(o=>'<option value="'+o.value+'"'+(o.value===selectedStage?' selected':'')+'>'+esc(o.label)+' — '+o.count+' exam'+(o.count>1?'s':'')+'</option>').join('')+'</select></div></div></div>'+
  '<div class="card"><h3>📊 Ranking</h3>'+
  (studs.length?'<div class="table-wrap"><table><thead><tr><th>Pos</th><th>Adm</th><th>Name</th>'+activeExams.map(e=>'<th style="text-align:center">'+esc(examStageLabel(e.type))+'</th>').join('')+'<th style="text-align:right">Tot</th><th style="text-align:right">Avg</th><th>Grade</th><th></th></tr></thead><tbody>'+
  sortedView.map(r=>{const pos=rankMap[r.student.id];const g=gradeOf(r.avg);const per=marksByStudent[r.student.id]||{};
    return '<tr><td><b>'+(pos?ordinal(pos):'—')+'</b></td><td>'+esc(r.student.admission_no)+'</td><td><b>'+esc(r.student.first_name+' '+(r.student.last_name||''))+'</b></td>'+
      activeExams.map(e=>{const hasAny=subjList.some(sj=>per[e.id]?.[sj.id]!=null);const examTotal=subjList.reduce((sum,sj)=>sum+(per[e.id]?.[sj.id]!=null?Number(per[e.id][sj.id]):0),0);return '<td style="text-align:center">'+(hasAny?examTotal.toFixed(0):'—')+'</td>';}).join('')+
      '<td style="text-align:right;font-weight:600">'+r.total.toFixed(0)+'</td><td style="text-align:right">'+r.avg.toFixed(1)+'</td><td><span class="badge '+(g.cls||'info')+'">'+g.g+'</span></td>'+
      '<td style="text-align:right"><button class="btn sm" onclick="printOneReportCard(\''+r.student.id+'\')">🖨️</button></td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">No pupils.</div>')+'</div>';

window.pageReports=pageReports;

const RC_PRINT_CSS='.rc-title{text-align:center;font-size:15px;font-weight:800;color:#0a2540;text-transform:uppercase;margin:10px 0 6px}.rc-info{width:100%;border-collapse:collapse;margin:10px 0}.rc-info td{padding:6px 10px;font-size:11.5px;border:1px solid #ccc}.rc-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;padding:10px;background:#f8fafc;border:1px solid #eee;border-radius:8px}.rc-summary div b{display:block;font-size:9.5px;color:#666;text-transform:uppercase;font-weight:600}.rc-summary div{font-size:12.5px;font-weight:700;color:#0a2540}.rc-comment{margin:12px 0;padding:10px 12px;background:#fffbeb;border-left:3px solid #d4a017;border-radius:6px;font-size:11.5px}.rc-sign{display:flex;justify-content:space-between;gap:12px;margin:16px 0;font-size:10.5px;flex-wrap:wrap}.rc-sign div{flex:1;min-width:140px}.gc-key{margin-top:10px;padding:8px 10px;background:#f1f5f9;border-radius:6px;font-size:9.5px;color:#555}.rc-page{margin-bottom:16px}.rc-page-break{page-break-after:always}.rc-multi th{background:#0a2540;color:#fff;font-size:11px;text-transform:uppercase;text-align:center;padding:8px 6px}.rc-multi th .sub{font-size:9px;font-weight:400;opacity:.75;text-transform:none;display:block}.rc-multi td{padding:8px 10px;font-size:12.5px;border:1px solid #e2e8f0}.rc-multi tfoot td{background:#f1f5f9;font-weight:700;border-top:2px solid #0a2540}@media print{.rc-page{page-break-inside:avoid}}';

function printOneReportCard(studentId){const rd=window._rcData;if(!rd){toast('Reload','bad');return;}const r=rd.rows.find(x=>x.student.id===studentId);if(!r){toast('Not found','bad');return;}const body=buildReportCardBody(r.student,rd);printHTML(rd.stageLabel+' Report — '+r.student.first_name,body,RC_PRINT_CSS);}
window.printOneReportCard=printOneReportCard;
function printAllReportCards(){const rd=window._rcData;if(!rd||!rd.rows.length){toast('No pupils','bad');return;}const sorted=rd.rows.slice().sort((a,b)=>(rd.rankMap[a.student.id]||9999)-(rd.rankMap[b.student.id]||9999));let html='';sorted.forEach((r,i)=>{html+='<div class="rc-page'+(i<sorted.length-1?' rc-page-break':'')+'">'+buildReportCardBody(r.student,rd)+'</div>';});printHTML(rd.stageLabel+' Reports — '+rd.cls.name,html,RC_PRINT_CSS);}
window.printAllReportCards=printAllReportCards;
function printBroadsheet(){const rd=window._rcData;if(!rd||!rd.rows.length){toast('No data','bad');return;}const sorted=rd.rows.slice().sort((a,b)=>(rd.rankMap[a.student.id]||9999)-(rd.rankMap[b.student.id]||9999));let head='<tr><th rowspan="2">Pos</th><th rowspan="2">Adm</th><th rowspan="2">Name</th>';rd.exams.forEach(e=>{head+='<th colspan="'+(rd.subjects.length+1)+'">'+esc(e.name)+'</th>';});head+='<th rowspan="2" style="text-align:right">Tot</th><th rowspan="2" style="text-align:right">Avg</th><th rowspan="2">Grade</th></tr><tr>';rd.exams.forEach(()=>{rd.subjects.forEach(s=>{head+='<th style="text-align:center">'+esc(s.code)+'</th>';});head+='<th style="text-align:center;background:#d4a017">TOT</th>';});head+='</tr>';const bodyRows=sorted.map(r=>{const per=rd.marksByStudent[r.student.id]||{};let cells='<td><b>'+(rd.rankMap[r.student.id]?ordinal(rd.rankMap[r.student.id]):'—')+'</b></td><td>'+esc(r.student.admission_no)+'</td><td>'+esc(r.student.first_name+' '+(r.student.last_name||''))+'</td>';rd.exams.forEach(e=>{let examTotal=0,hasAny=false;rd.subjects.forEach(sj=>{const v=per[e.id]?.[sj.id];if(v!=null&&!isNaN(v)){examTotal+=Number(v);hasAny=true;}cells+='<td style="text-align:center">'+(v!=null?Number(v).toFixed(0):'—')+'</td>';});cells+='<td style="text-align:center;font-weight:700;background:#fff7e6">'+(hasAny?examTotal.toFixed(0):'—')+'</td>';});const g=gradeOf(r.avg);cells+='<td style="text-align:right;font-weight:700">'+r.total.toFixed(0)+'</td><td style="text-align:right">'+r.avg.toFixed(1)+'</td><td style="text-align:center"><b>'+g.g+'</b></td>';return '<tr>'+cells+'</tr>';}).join('');printHTML('Broadsheet — '+rd.cls.name+' — '+rd.stageLabel,'<table><thead>'+head+'</thead><tbody>'+bodyRows+'</tbody></table>');}
window.printBroadsheet=printBroadsheet;

/* ============================================================
   UNIFORMS
   ============================================================ */
async function pageUniforms(root){
  const items=await rest('/rest/v1/uniform_items?school_id=eq.'+_schoolId+'&select=*&order=category,name').catch(()=>[]);
  const salesTotal=(await rest('/rest/v1/uniform_sales?school_id=eq.'+_schoolId+'&select=total_amount').catch(()=>[])).reduce((s,x)=>s+Number(x.total_amount||0),0);
  const stockValue=(items||[]).reduce((s,i)=>s+(Number(i.current_stock)||0)*(Number(i.unit_cost)||0),0);
  const grouped={};(items||[]).forEach(i=>{const c=i.category||'Other';if(!grouped[c])grouped[c]=[];grouped[c].push(i);});
  root.innerHTML='<div class="page-head"><div><h1>👕 Uniforms</h1></div><button class="btn" onclick="addUniformItem()">＋ Item</button></div>'+
  '<div class="grid grid-kpi" style="margin-bottom:14px"><div class="kpi"><div class="v">'+fmtUGX(stockValue)+'</div><div class="l">Stock Value</div></div><div class="kpi kpi-navy"><div class="v">'+fmtUGX(salesTotal)+'</div><div class="l">Sales</div></div></div>'+
  Object.entries(grouped).map(([cat,list])=>'<div class="card"><h3>'+esc(cat)+'</h3><div class="table-wrap"><table><thead><tr><th>Item</th><th>Size</th><th style="text-align:right">Stock</th><th style="text-align:right">Price</th><th></th></tr></thead><tbody>'+
    list.map(it=>'<tr><td><b>'+esc(it.name)+'</b></td><td>'+esc(it.size||'—')+'</td><td style="text-align:right"><span class="badge '+(Number(it.current_stock)>0?'ok':'bad')+'">'+Number(it.current_stock)+'</span></td><td style="text-align:right">'+Number(it.selling_price).toLocaleString()+'</td><td><button class="btn sm danger" onclick="delUniformItem(\''+it.id+'\')">✕</button></td></tr>').join('')+
    '</tbody></table></div></div>').join('')+
  ((items||[]).length===0?'<div class="card"><div class="empty">No items.</div></div>':'');
}
window.pageUniforms=pageUniforms;
function addUniformItem(){modal('<h3>Add Uniform Item</h3><div><label>Category</label><select id="ui_cat"><option>Boys Uniform</option><option>Girls Uniform</option><option>Sports Wear</option><option>Sweaters</option><option>Other</option></select></div><div style="margin-top:12px"><label>Name</label><input id="ui_name"></div><div style="margin-top:12px"><label>Size</label><input id="ui_size"></div><div class="grid grid-2" style="margin-top:12px"><div><label>Cost</label><input id="ui_cost" type="number" value="0"></div><div><label>Price</label><input id="ui_price" type="number" value="0"></div></div><div style="margin-top:12px"><label>Stock</label><input id="ui_stock" type="number" value="0"></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveUniformItem()">Save</button></div>');}
window.addUniformItem=addUniformItem;
async function saveUniformItem(){const n=document.getElementById('ui_name').value.trim();if(!n){toast('Name','bad');return;}try{await rest('/rest/v1/uniform_items',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,category:document.getElementById('ui_cat').value,name:n,size:document.getElementById('ui_size').value.trim()||null,unit_cost:parseFloat(document.getElementById('ui_cost').value)||0,selling_price:parseFloat(document.getElementById('ui_price').value)||0,current_stock:parseInt(document.getElementById('ui_stock').value)||0})});closeModal();nav('uniforms');}catch(e){toast(e.message,'bad');}}
window.saveUniformItem=saveUniformItem;
async function delUniformItem(id){if(!confirm('Delete?'))return;try{await rest('/rest/v1/uniform_items?id=eq.'+id,{method:'DELETE'});nav('uniforms');}catch(e){toast(e.message,'bad');}}
window.delUniformItem=delUniformItem;

function addExp(){modal('<h3>Add Expense</h3><div><label>Description</label><input id="ex_desc"></div><div style="margin-top:12px"><label>Amount</label><input id="ex_amount" type="number"></div><div style="margin-top:12px"><label>Date</label><input id="ex_date" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveExp()">Save</button></div>');}

async function saveExp(){const d=document.getElementById('ex_desc').value.trim();const a=parseFloat(document.getElementById('ex_amount').value);if(!d||!a){toast('Fill','bad');return;}try{await rest('/rest/v1/expenses',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,description:d,amount:a,date:document.getElementById('ex_date').value,academic_year:getCurrentYear(),term:getCurrentTerm()})});closeModal();nav('expenses');}catch(e){toast(e.message,'bad');}}
window.saveExp=saveExp;

/* ============================================================
   MESSAGES
   ============================================================ */
async function pageMessages(root){
  const [messages,students]=await Promise.all([
    rest('/rest/v1/messages?school_id=eq.'+_schoolId+'&select=*&order=sent_at.desc&limit=200').catch(()=>[]),
    rest('/rest/v1/students?school_id=eq.'+_schoolId+'&select=id,first_name,last_name,parent_name,parent_contact&status=eq.active&order=first_name').catch(()=>[])
  ]);
  window._msgStudents=students||[];
  root.innerHTML='<div class="page-head"><div><h1>💬 Messages</h1><div class="sub">'+messages.length+' sent</div></div><button class="btn" onclick="composeMessage()">＋ Compose</button></div>'+
  '<div class="card">'+((messages||[]).length?'<div class="table-wrap"><table><thead><tr><th>Sent</th><th>To</th><th>Message</th></tr></thead><tbody>'+
  messages.slice(0,100).map(m=>'<tr><td>'+fmtDate(m.sent_at)+'</td><td>'+esc(m.recipient_name||'—')+'</td><td>'+esc((m.body||'').slice(0,80))+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No messages.</div>')+'</div>';
}
window.pageMessages=pageMessages;
function composeMessage(){const students=window._msgStudents||[];modal('<h3>Compose</h3><div><label>Recipient</label><select id="cm_student"><option value="">— Manual —</option>'+students.map(s=>'<option value="'+s.id+'" data-phone="'+esc(s.parent_contact||'')+'" data-name="'+esc(s.parent_name||'')+'">'+esc(s.first_name+' '+(s.last_name||''))+'</option>').join('')+'</select></div><div class="grid grid-2" style="margin-top:12px"><div><label>Name</label><input id="cm_name"></div><div><label>Phone</label><input id="cm_phone"></div></div><div style="margin-top:12px"><label>Message</label><textarea id="cm_body" rows="4"></textarea></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveMessage()">Send</button></div>');setTimeout(()=>{const sel=document.getElementById('cm_student');sel.onchange=()=>{const o=sel.options[sel.selectedIndex];if(o.value){document.getElementById('cm_phone').value=o.getAttribute('data-phone')||'';document.getElementById('cm_name').value=o.getAttribute('data-name')||'';}};},50);}
window.composeMessage=composeMessage;
async function saveMessage(){const name=document.getElementById('cm_name').value.trim();const phone=document.getElementById('cm_phone').value.trim();const body=document.getElementById('cm_body').value.trim();if(!phone||!body){toast('Fill','bad');return;}try{await rest('/rest/v1/messages',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,student_id:document.getElementById('cm_student').value||null,recipient_name:name||null,recipient_phone:phone,recipient_type:'parent',body,channel:'sms',academic_year:getCurrentYear(),term:getCurrentTerm()})});toast('Logged','ok');closeModal();nav('messages');}catch(e){toast(e.message,'bad');}}
window.saveMessage=saveMessage;

/* ============================================================
   SETTINGS

async function pageSettings(root){

  const fpAvail=await fpAvailable();
  const fpEnabled=!!safeStorage.getItem(FP_CRED_KEY);

  '<div class="card"><h3>🏫 School Logo</h3>'+
  '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">'+
  '<div class="logo-preview" id="logoPreview">'+(hasLogo?'<img src="'+esc(_school.logo_data||_school.logo_url)+'">':'🏛️')+'</div>'+
  '<div style="flex:1;min-width:220px"><div class="muted" style="margin-bottom:8px">PNG or JPG. Max 800KB.</div>'+

  '<div class="card"><h3>School Profile</h3><div class="grid grid-2">'+

  '<div class="card"><h3>🔐 Fingerprint Unlock (Admin)</h3>'+
  (fpAvail?(fpEnabled?'<div class="alert-item ok"><span class="ico">✅</span><div class="txt"><b>Enabled on this device</b></div></div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn ghost" onclick="enableLoginFingerprint()">🔄 Re-register</button><button class="btn danger" onclick="disableLoginFingerprint()">Disable</button></div>':'<div class="muted" style="margin-bottom:12px">Sign in with your fingerprint instead of typing a password.</div><button class="btn ok block" onclick="enableLoginFingerprint()">🔐 Enable Fingerprint Unlock</button>')

  '<div class="card"><h3>My Account</h3><div><label>Name</label><input value="'+esc(_profile.full_name||'')+'" disabled></div><div style="margin-top:12px"><label>Email</label><input value="'+esc(SESSION.email||'')+'" disabled></div><div style="margin-top:12px"><label>Role</label><input value="'+esc(_role||'')+'" disabled></div></div>';
}
window.pageSettings=pageSettings;
async function handleLogoUpload(input){if(!input.files||!input.files[0])return;const file=input.files[0];if(file.size>800*1024){toast('Too large (max 800KB)','bad');input.value='';return;}const reader=new FileReader();reader.onload=async e=>{const dataUrl=e.target.result;const prev=document.getElementById('logoPreview');if(prev)prev.innerHTML='<img src="'+dataUrl+'">';toast('Saving…','ok');try{await rest('/rest/v1/schools?id=eq.'+_schoolId,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({logo_data:dataUrl})});_school.logo_data=dataUrl;renderHeader();renderAuthLogo();toast('Saved ✓','ok');}catch(err){toast('Failed: '+err.message,'bad');}};reader.readAsDataURL(file);}
window.handleLogoUpload=handleLogoUpload;
async function removeLogo(){if(!confirm('Remove logo?'))return;try{await rest('/rest/v1/schools?id=eq.'+_schoolId,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({logo_data:null,logo_url:null})});delete _school.logo_data;delete _school.logo_url;renderHeader();renderAuthLogo();nav('settings');toast('Removed','ok');}catch(e){toast(e.message,'bad');}}
window.removeLogo=removeLogo;
async function saveSchoolInfo(){const n=document.getElementById('set_name').value.trim();if(!n){toast('Name','bad');return;}try{await rest('/rest/v1/schools?id=eq.'+_schoolId,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({name:n,telephone:document.getElementById('set_phone').value.trim()||null,address:document.getElementById('set_addr').value.trim()||null,motto:document.getElementById('set_motto').value.trim()||null})});const sc=await rest('/rest/v1/schools?id=eq.'+_schoolId+'&select=*');_school=sc[0];renderHeader();toast('Saved','ok');}catch(e){toast(e.message,'bad');}}
window.saveSchoolInfo=saveSchoolInfo;

/* ============================================================
   AUTH REDIRECT
   ============================================================ */
async function handleAuthRedirect(){
  const hash=window.location.hash;
  if(hash&&hash.includes('access_token')){
    const p=new URLSearchParams(hash.substring(1));
    const at=p.get('access_token');const rt=p.get('refresh_token');
    if(at){try{const r=await fetch(SUPA_URL+'/auth/v1/user',{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+at}});const u=await r.json();if(u&&u.id){setSession({access_token:at,refresh_token:rt,user:u});window.history.replaceState(null,'',window.location.pathname);await boot();return;}}catch(e){}}
  }
  const s=safeStorage.getItem('eudes_session');
  if(s){try{await boot();}catch(e){console.error(e);}}
}
handleAuthRedirect();
console.log('%c✅ Eudes School Management loaded','color:#d4a017;font-weight:800;font-size:14px');
