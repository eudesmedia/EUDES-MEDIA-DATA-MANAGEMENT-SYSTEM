let _mem={};
function lsGet(k){try{if(typeof localStorage!=='undefined'&&localStorage)return localStorage.getItem(k);}catch(e){}return _mem[k]!==undefined?_mem[k]:null;}
function lsSet(k,v){try{if(typeof localStorage!=='undefined'&&localStorage){localStorage.setItem(k,v);return;}}catch(e){}_mem[k]=String(v);}
function lsDel(k){try{if(typeof localStorage!=='undefined'&&localStorage){localStorage.removeItem(k);return;}}catch(e){}delete _mem[k];}

async function rest(path,options){
  options=options||{};
  const headers=Object.assign({'apikey':SUPA_KEY,'Content-Type':'application/json'},options.headers||{});

}

function gradeOf(score){if(score==null||isNaN(score))return{g:'—',r:'—',cls:''};const s=Number(score);if(s>=90)return{g:'D1',r:'Distinction 1',cls:'d1'};if(s>=80)return{g:'D2',r:'Distinction 2',cls:'d2'};if(s>=70)return{g:'C3',r:'Credit 3',cls:'c3'};if(s>=60)return{g:'C4',r:'Credit 4',cls:'c4'};if(s>=55)return{g:'C5',r:'Credit 5',cls:'c5'};if(s>=50)return{g:'C6',r:'Credit 6',cls:'c6'};if(s>=45)return{g:'P7',r:'Pass 7',cls:'p7'};if(s>=40)return{g:'P8',r:'Pass 8',cls:'p8'};return{g:'F9',r:'Fail 9',cls:'f9'};}

/* AUTH */
async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass=document.getElementById('loginPass').value;
  const err=document.getElementById('loginErr');
  const btn=document.getElementById('loginBtn');
  err.style.display='none';
  if(!email||!pass){err.textContent='Enter email and password';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='Signing in…';
  try{
    const data=await auth('/auth/v1/token?grant_type=password',{email,password:pass});
    setSession({access_token:data.access_token,user:data.user});
    await boot();
  }catch(e){err.textContent=e.message;err.style.display='block';}
  btn.disabled=false;btn.textContent='Sign In';
}
window.doLogin=doLogin;

async function doLogout(){
  if(!confirm('Sign out?'))return;
  try{const t=getToken();if(t)await fetch(SUPA_URL+'/auth/v1/logout',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+t}});}catch(e){}
  setSession(null);_profile=null;_school=null;_schoolId=null;_classesCache=null;
  document.getElementById('app').style.display='none';
  document.getElementById('authScreen').style.display='flex';
}
window.doLogout=doLogout;

async function boot(){
  const user=getUser(),token=getToken();
  if(!user||!token){document.getElementById('authScreen').style.display='flex';document.getElementById('app').style.display='none';return;}
  const errEl=document.getElementById('loginErr');
  try{const p=await rest('/rest/v1/profiles?id=eq.'+user.id+'&select=*');_profile=p&&p[0];}
  catch(e){errEl.textContent='Profile error: '+e.message;errEl.style.display='block';return;}
  if(!_profile){errEl.textContent='Profile not found.';errEl.style.display='block';return;}
  _schoolId=_profile.school_id;_role=_profile.role;
  if(!_schoolId){errEl.innerHTML='Account not linked to a school.';errEl.style.display='block';return;}
  try{const sc=await rest('/rest/v1/schools?id=eq.'+_schoolId+'&select=*');_school=sc&&sc[0];}catch(e){}
  if(!_school){errEl.textContent='School not found.';errEl.style.display='block';return;}
  if(_school.current_year)setPeriod(_school.current_year,_school.current_term||1);
  document.getElementById('authScreen').style.display='none';
  document.getElementById('app').style.display='block';
  populateTermSelector();renderHeader();renderAuthLogo();renderNav();renderBottomBar();tickClock();
  setInterval(tickClock,30000);
  await nav('dashboard');
}
window.boot=boot;

function renderAuthLogo(){const el=document.getElementById('authLogo');if(!el)return;const src=_school&&(_school.logo_data||_school.logo_url);if(src){el.innerHTML='<img src="'+esc(src)+'">';el.style.background='#fff';}else{el.innerHTML='P';el.style.background='';}}
function tickClock(){const now=new Date();const d=document.getElementById('headerDate');const t=document.getElementById('headerTime');if(d)d.textContent='📅 '+fmtLongDate(now);if(t)t.textContent='🕐 '+now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}

function renderHeader(){
  const nameEl=document.getElementById('headerSchoolName');
  const metaEl=document.getElementById('headerMeta');
  const roleEl=document.getElementById('roleChip');
  const titleEl=document.getElementById('topbarTitle');
  if(!_school)return;
  nameEl.textContent=_school.name||'SCHOOL';
  const parts=[];
  if(_school.address)parts.push('📍 '+esc(_school.address));
  if(_school.telephone)parts.push('📞 '+esc(_school.telephone));
  metaEl.innerHTML=parts.length?parts.join('<span class="sep">·</span>'):'—';
  if(_role)roleEl.textContent=String(_role).replace(/_/g,' ').toUpperCase();
  titleEl.textContent=_school.name||'SCHOOL';
  const logoEl=document.getElementById('headerLogo');
  if(logoEl){const src=_school.logo_data||_school.logo_url||'';if(src){logoEl.innerHTML='<img src="'+esc(src)+'">';logoEl.style.background='#fff';logoEl.style.padding='2px';}else{logoEl.innerHTML='🏛️';logoEl.style.background='';logoEl.style.padding='';}}

function populateTermSelector(){
  const ySel=document.getElementById('termYearSelect');const tSel=document.getElementById('termTermSelect');if(!ySel||!tSel)return;
  const cy=getYear(),ct=getTerm();const currentYear=new Date().getFullYear();
  const years=[];for(let y=currentYear-2;y<=currentYear+1;y++)years.push(y);
  if(!years.includes(cy))years.push(cy);years.sort((a,b)=>b-a);
  ySel.innerHTML=years.map(y=>'<option value="'+y+'"'+(y===cy?' selected':'')+'>'+y+'</option>').join('');

function filterStudents(){
  const q=(document.getElementById('stSearch').value||'').toLowerCase();
  const cf=document.getElementById('stClass').value||'';
  const rf=document.getElementById('stRes').value||'';
  const classes=_classesCache||[];const cById={};classes.forEach(c=>cById[c.id]=c);
  const activeIds=window._activePassIds||new Set();
  const list=_cachedStudents.filter(s=>{
    if(cf&&s.class_id!==cf)return false;
    if(rf&&(s.boarding_status||'Day')!==rf)return false;
    if(q){const h=(s.first_name+' '+(s.last_name||'')+' '+s.admission_no+' '+(s.parent_name||'')+' '+(s.parent_contact||'')+' '+(s.lin||'')).toLowerCase();if(h.indexOf(q)===-1)return false;}
    return true;
  });
  window._filteredSt=list;
  document.getElementById('stCount').textContent=_cachedStudents.length+' total · '+list.length+' shown';
  const c=document.getElementById('stTable');
  if(!list.length){c.innerHTML='<div class="empty">'+( _cachedStudents.length===0?'No pupils yet. Click "Register".':'No pupils match.')+'</div>';return;}
  let rows='';
  list.forEach(s=>{
    const cls=cById[s.class_id];
    const bal=(Number(s.total_charged)||0)-(Number(s.total_paid)||0);
    const pc=(s.parent_contact||'').trim();
    const wa=pc?waLink(pc):'';const tl=pc?telLink(pc):'';
    let contact='—';
    if(s.parent_name||pc){contact='';if(s.parent_name)contact+='<b>'+esc(s.parent_name)+'</b>';if(pc){contact+='<div style="font-weight:600;margin-top:2px">'+esc(pc)+'</div><div style="display:flex;gap:4px;margin-top:4px">'+(wa?'<a href="https://wa.me/'+wa+'" target="_blank" class="btn sm wa" style="text-decoration:none">💬</a>':'')+(tl?'<a href="tel:'+tl+'" class="btn sm ghost" style="text-decoration:none">📞</a>':'')+'</div>';}}
    rows+='<tr>'+
      '<td><b>'+esc(s.admission_no||'—')+'</b></td>'+
      '<td><a href="javascript:void(0)" onclick="openProfile(\''+s.id+'\')" style="color:var(--navy);font-weight:600;text-decoration:none">'+esc(s.first_name+' '+(s.last_name||''))+'</a></td>'+
      '<td>'+(cls?'<span class="badge info">'+esc(cls.name)+'</span>':'—')+'</td>'+
      '<td>'+esc(genderLabel(s.gender))+'</td>'+
      '<td>'+esc(s.lin||'—')+'</td>'+
      '<td>'+contact+'</td>'+
      '<td>'+(String(s.boarding_status||'Day')==='Boarding'?'<span class="badge warn">Board</span>':'<span class="badge ok">Day</span>')+'</td>'+
      '<td>'+(activeIds.has(s.id)?'<span class="badge bad">OUT</span>':'')+'</td>'+
      '<td style="text-align:right"><span class="badge '+(bal>0?'bad':'ok')+'">'+fmtNum(bal)+'</span></td>'+
      '<td style="text-align:right;white-space:nowrap">'+
      '<button class="btn sm" onclick="openProfile(\''+s.id+'\')" title="View">👤</button> '+
      '<button class="btn sm gold" onclick="recordPayment(\''+s.id+'\')" title="Pay">💵</button> '+
      '<button class="btn sm ghost" onclick="openStudentModalById(\''+s.id+'\')" title="Edit">✏️</button> '+
      '<button class="btn sm danger" onclick="deleteStudent(\''+s.id+'\')" title="Delete">✕</button>'+
      '</td></tr>';
  });
  c.innerHTML='<div class="table-wrap"><table style="font-size:12.5px"><thead><tr><th>ADM</th><th>Name</th><th>Class</th><th>Gender</th><th>LIN</th><th>Parent</th><th>Type</th><th>OUT</th><th style="text-align:right">Balance</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

async function saveStudent(id){
  const n=f=>Number(document.getElementById(f).value)||0;
  const body={
    school_id:_schoolId,
    admission_no:document.getElementById('m_adm').value.trim(),
    class_id:document.getElementById('m_class').value||null,
    first_name:document.getElementById('m_fn').value.trim(),
    last_name:document.getElementById('m_ln').value.trim()||null,
    gender:document.getElementById('m_gender').value||null,
    date_of_birth:document.getElementById('m_dob').value||null,
    lin:document.getElementById('m_lin').value.trim()||null,
    boarding_status:document.getElementById('m_res').value,
    location:document.getElementById('m_loc').value.trim()||null,
    parent_name:document.getElementById('m_par').value.trim()||null,
    parent_contact:document.getElementById('m_pc').value.trim()||null,
    status:document.getElementById('m_status').value,
    balance_bf:n('m_bf'),actual_fee:n('m_fee'),functional_fee:n('m_func'),
    transport_fee:n('m_trans'),holiday_fee:n('m_hol'),academics_fee:n('m_acad')
  };
  body.total_charged=body.balance_bf+body.actual_fee+body.functional_fee+body.transport_fee+body.holiday_fee+body.academics_fee;
  const old=id?_cachedStudents.find(x=>x.id===id):null;
  body.total_paid=old?Number(old.total_paid)||0:0;
  body.current_balance=body.total_charged-body.total_paid;
  if(!body.admission_no||!body.first_name||!body.class_id){toast('Fill ADM, name, class','bad');return;}
  try{
    if(id)await rest('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});
    else await rest('/rest/v1/students',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});
    toast('Saved','ok');closeModal();nav(activeRoute);
  }catch(e){toast(e.message,'bad');}
}
window.saveStudent=saveStudent;

async function deleteStudent(id){
  if(!confirm('Delete this pupil?'))return;
  try{await rest('/rest/v1/students?id=eq.'+id,{method:'DELETE'});toast('Deleted','ok');nav('students');}
  catch(e){toast(e.message,'bad');}
}

async function savePayment(studentId){
  const amount=Number(document.getElementById('p_amount').value);
  const rno=document.getElementById('p_rno').value.trim()||('RCP-'+Date.now());
  if(!amount||amount<=0){toast('Enter amount','bad');return;}
  const s=_cachedStudents.find(x=>x.id===studentId);if(!s){toast('Not found','bad');return;}
  const method=document.getElementById('p_method').value;
  const payment_for=document.getElementById('p_for').value;
  const notes=document.getElementById('p_notes').value.trim();
  const ref=document.getElementById('p_ref').value.trim();
  const body={school_id:_schoolId,student_id:studentId,receipt_no:rno,year:getYear(),term:getTerm(),academic_year:getYear(),amount:amount,method:method,payment_for:payment_for,payment_method:method,received_by:_profile?_profile.id:null};
  if(notes)body.notes=notes;if(ref)body.reference=ref;
  try{
    await rest('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});
    const newPaid=(Number(s.total_paid)||0)+amount;
    const charged=Number(s.total_charged)||0;
    await rest('/rest/v1/students?id=eq.'+studentId,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({total_paid:newPaid,current_balance:Math.max(0,charged-newPaid)})});
    toast('Receipt: '+rno,'ok');
    printReceipt(s,{receipt_no:rno,amount:amount,payment_for:payment_for,method:method,notes:notes,date:new Date().toISOString(),ref:ref});
    closeModal();nav(activeRoute);
  }catch(e){toast(e.message,'bad');}
}
window.savePayment=savePayment;

function promiseStatusOf(p){
  if(p.status==='cleared'||p.status_override==='cleared')return 'cleared';
  if(!p.promise_date)return 'future';
  const today=new Date();today.setHours(0,0,0,0);
  const d=new Date(p.promise_date);d.setHours(0,0,0,0);
  if(d.getTime()===today.getTime())return 'today';
  if(d<today)return 'overdue';
  const diff=(d-today)/(1000*60*60*24);return diff<=7?'upcoming':'future';
}

async function loadAtt(){
  const cid=document.getElementById('aClass').value;
  const dt=document.getElementById('aDate').value;
  let url='/rest/v1/students?school_id=eq.'+_schoolId+'&status=eq.active&select=id,first_name,last_name,admission_no,class_id';
  if(cid)url+='&class_id=eq.'+cid;
  const results=await Promise.all([rest(url),rest('/rest/v1/attendance?school_id=eq.'+_schoolId+'&date=eq.'+dt+'&select=student_id,status')]);
  const students=results[0]||[];const existing=results[1]||[];
  const map={};existing.forEach(a=>map[a.student_id]=a.status);

  filterAttRows();
}

function filterAttRows(){
  const q=(document.getElementById('aSearch')?.value||'').toLowerCase();
  const classes=_classesCache||[];const cById={};classes.forEach(c=>cById[c.id]=c);
  const map=window._attMap||{};
  const rows=(window._attStudents||[]).filter(s=>{if(!q)return true;const h=(s.first_name+' '+(s.last_name||'')+' '+s.admission_no).toLowerCase();return h.indexOf(q)!==-1;});

async function pageMarks(root){
  clearClassesCache();
  const classes=await loadClasses();
  if(!_marksClass&&classes[0])_marksClass=classes[0].id;
  const exams=await loadExams();
  if(!_marksExam&&exams[0])_marksExam=exams[0].id;
  const subjects=await loadSubjectsForClass(_marksClass);
  const results=await Promise.all([
    rest('/rest/v1/students?school_id=eq.'+_schoolId+'&class_id=eq.'+_marksClass+'&status=eq.active&select=id,admission_no,first_name,last_name&order=first_name'),
    _marksExam?rest('/rest/v1/marks?school_id=eq.'+_schoolId+'&exam_id=eq.'+_marksExam+'&select=student_id,subject_id,score'):[]
  ]);
  const students=results[0]||[];const marksRows=results[1]||[];
  const mm={};marksRows.forEach(m=>{if(!mm[m.student_id])mm[m.student_id]={};mm[m.student_id][m.subject_id]=m.score;});
  window._marksMap=mm;window._marksSubjects=subjects;window._marksStudents=students;
  const cOpts=classes.map(c=>'<option value="'+c.id+'"'+(_marksClass===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('');
  const eOpts=exams.map(e=>'<option value="'+e.id+'"'+(_marksExam===e.id?' selected':'')+'>'+esc(e.name)+'</option>').join('');
  let table='';
  if(!students.length)table='<div class="card empty">No pupils.</div>';
  else if(!subjects.length)table='<div class="card empty">No subjects for this class.</div>';
  else{
    let hdr='';subjects.forEach(s=>{hdr+='<th style="text-align:center">'+esc(s.code)+'</th>';});
    let rows='';
    students.forEach((s,i)=>{
      const per=mm[s.id]||{};let total=0;let inputs='';
      subjects.forEach(sj=>{const v=per[sj.subject_id];if(v!=null&&!isNaN(v))total+=Number(v);inputs+='<td><input type="number" min="0" max="100" value="'+(v!=null?v:'')+'" data-student="'+s.id+'" data-subject="'+sj.subject_id+'" onchange="setMark(this)" class="marks-input"></td>';});
      rows+='<tr><td>'+(i+1)+'</td><td>'+esc(s.admission_no)+'</td><td>'+esc(s.first_name+' '+(s.last_name||''))+'</td>'+inputs+'<td style="text-align:right;font-weight:700" class="row-total" data-student="'+s.id+'">'+total.toFixed(0)+'</td></tr>';
    });
    table='<div class="card"><div class="table-wrap"><table><thead><tr><th>#</th><th>ADM</th><th>Name</th>'+hdr+'<th style="text-align:right">Total</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  }
  root.innerHTML='<div class="page-head"><h1>✍️ Marks</h1></div>'+
  '<div class="card"><div class="grid grid-2">'+
  '<div><label>Class</label><select onchange="_marksClass=this.value;pageMarks(document.getElementById(\'main\'))">'+cOpts+'</select></div>'+
  '<div><label>Exam</label><select onchange="_marksExam=this.value;pageMarks(document.getElementById(\'main\'))">'+eOpts+'</select></div></div></div>'+table;
}
window.pageMarks=pageMarks;

async function setMark(inp){
  const sid=inp.dataset.student;const subid=inp.dataset.subject;
  const val=inp.value;const sc=val===''?null:parseFloat(val);
  if(sc!=null&&(isNaN(sc)||sc<0||sc>100)){toast('0-100','bad');inp.value='';return;}
  try{
    await rest('/rest/v1/marks?school_id=eq.'+_schoolId+'&student_id=eq.'+sid+'&exam_id=eq.'+_marksExam+'&subject_id=eq.'+subid,{method:'DELETE'});
    if(sc!=null){
      await rest('/rest/v1/marks',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({school_id:_schoolId,student_id:sid,exam_id:_marksExam,subject_id:subid,score:sc,academic_year:getYear(),term:getTerm()})});
    }
    const per=window._marksMap[sid]||{};per[subid]=sc;
    let total=0;window._marksSubjects.forEach(sj=>{const v=per[sj.subject_id];if(v!=null&&!isNaN(v))total+=Number(v);});
    const el=document.querySelector('.row-total[data-student="'+sid+'"]');if(el)el.textContent=total.toFixed(0);
  }catch(e){toast(e.message,'bad');}
}
window.setMark=setMark;

function buildReportCard(s,subjects,marks){
  const cls=(_classesCache||[]).find(c=>c.id===s.class_id);
  const per=marks[s.id]||{};
  const logo=_school?.logo_url||_school?.logo_data||'';
  const cell='padding:5px 8px;border:1px solid #4a148c;font-size:11px;';
  const hc=cell+'background:#ede7f6;font-weight:700;color:#4a148c;text-align:center;text-transform:uppercase;font-size:10px;';
  const lc=cell+'background:#f3e5f5;font-weight:700;color:#4a148c;';
  const cc=cell+'text-align:center;';
  let sRows='';let grand=0,cnt=0;
  subjects.forEach((sj,i)=>{
    const v=per[sj.subject_id];const sc=(v!=null&&!isNaN(v))?Number(v):null;
    if(sc!=null){grand+=sc;cnt++;}
    const g=gradeOf(sc);
    sRows+='<tr><td style="'+cc+'">'+(i+1)+'</td><td style="'+lc+'">'+esc(sj.name)+'</td><td style="'+cc+'">'+(sc!=null?sc:'—')+'</td><td style="'+cc+'"><b>'+g.g+'</b></td><td style="'+cell+'">'+g.r+'</td></tr>';
  });
  const avg=cnt?grand/cnt:0;const fg=gradeOf(avg);
  const header='<div style="text-align:center;padding-bottom:10px;border-bottom:3px double #4a148c;margin-bottom:10px"><div style="display:flex;align-items:center;justify-content:center;gap:14px">'+
    (logo?'<img src="'+esc(logo)+'" style="width:65px;height:65px;object-fit:contain">':'')+
    '<div style="flex:1"><div style="font-family:Georgia;font-size:17px;font-weight:900;color:#6a1b9a;text-transform:uppercase">'+esc(_school?.name||'')+'</div>'+
    '<div style="font-size:11px;color:#4a148c">'+esc(_school?.address||'')+'</div>'+
    '<div style="font-size:12px;font-weight:800;color:#6a1b9a;background:#f3e5f5;padding:3px 14px;border-radius:4px;display:inline-block;margin-top:6px">TERMLY REPORT CARD</div></div></div></div>';
  const info='<table style="width:100%;border-collapse:collapse;margin-bottom:10px;font-size:11px"><tbody>'+
    '<tr><td style="padding:4px 8px;border:1px solid #e2e8f0"><b>Name:</b> '+esc(s.first_name+' '+(s.last_name||''))+'</td>'+
    '<td style="padding:4px 8px;border:1px solid #e2e8f0"><b>ADM:</b> '+esc(s.admission_no)+'</td>'+
    '<td style="padding:4px 8px;border:1px solid #e2e8f0"><b>Class:</b> '+esc(cls?cls.name:'')+'</td></tr>'+
    '<tr><td style="padding:4px 8px;border:1px solid #e2e8f0"><b>Gender:</b> '+esc(genderLabel(s.gender))+'</td>'+
    '<td style="padding:4px 8px;border:1px solid #e2e8f0"><b>Term:</b> '+getTerm()+' / '+getYear()+'</td>'+
    '<td style="padding:4px 8px;border:1px solid #e2e8f0"><b>LIN:</b> '+esc(s.lin||'—')+'</td></tr>'+
    '</tbody></table>';
  const table='<table style="width:100%;border-collapse:collapse;margin-bottom:10px"><thead><tr>'+
    '<th style="'+hc+'">#</th><th style="'+hc+'">Subject</th><th style="'+hc+'">Score</th><th style="'+hc+'">Grade</th><th style="'+hc+'">Remark</th>'+
    '</tr></thead><tbody>'+sRows+
    '<tr style="background:#f3e5f5;font-weight:700"><td style="'+cc+'" colspan="2">TOTAL</td><td style="'+cc+'">'+grand.toFixed(0)+'</td><td style="'+cc+'">'+fg.g+'</td><td style="'+cell+'">'+fg.r+'</td></tr>'+
    '<tr style="background:#f3e5f5;font-weight:700"><td style="'+cc+'" colspan="2">AVERAGE</td><td style="'+cc+'" colspan="3">'+avg.toFixed(1)+'%</td></tr>'+
    '</tbody></table>';
  return '<div style="background:#fff;padding:14px;border:2px solid #4a148c;max-width:210mm;margin:0 auto 16px">'+header+info+table+
    '<div style="text-align:center;font-size:10px;color:#666;margin-top:14px;font-style:italic">Valid only with school stamp</div></div>';
}
window.buildReportCard=buildReportCard;

function printAllReports(){

function printBroadsheet(){
  const d=window._reportData;
  if(!d||!d.students.length){toast('Nothing','bad');return;}
  const ranked=d.students.map(s=>{const m=d.marks[s.id]||{};let t=0,c=0;d.subjects.forEach(sj=>{const v=m[sj.subject_id];if(v!=null&&!isNaN(v)){t+=Number(v);c++;}});return{s,total:t,avg:c?t/c:0};}).sort((a,b)=>b.avg-a.avg);
  let head='<tr><th>Pos</th><th>ADM</th><th>Name</th>';d.subjects.forEach(sj=>{head+='<th>'+esc(sj.code)+'</th>';});head+='<th>Total</th><th>Grade</th></tr>';
  let body='';
  ranked.forEach((r,i)=>{const m=d.marks[r.s.id]||{};let cells='';d.subjects.forEach(sj=>{const v=m[sj.subject_id];cells+='<td>'+(v!=null?v.toFixed(0):'—')+'</td>';});const g=gradeOf(r.avg);body+='<tr><td><b>'+(i+1)+'</b></td><td>'+esc(r.s.admission_no)+'</td><td>'+esc(r.s.first_name+' '+(r.s.last_name||''))+'</td>'+cells+'<td style="font-weight:700">'+r.total.toFixed(0)+'</td><td><b>'+g.g+'</b></td></tr>';});
  printSection('Broadsheet — '+(d.classObj?d.classObj.name:''),'<table><thead>'+head+'</thead><tbody>'+body+'</tbody></table>');
}

async function pageSubjects(root){
  clearClassesCache();

  const subjects=await loadSubjectsForClass(_subjClass);
  const cOpts=classes.map(c=>'<option value="'+c.id+'"'+(_subjClass===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('');
  let rows='';
  if(subjects.length)subjects.forEach(s=>{rows+='<tr><td><b>'+esc(s.code)+'</b></td><td>'+esc(s.name)+'</td><td><button class="btn sm danger" onclick="delSubject(\''+s.subject_id+'\')">✕</button></td></tr>';});

  '<div class="card"><div class="alert-item info"><span class="ico">💡</span><div class="txt"><b>Add classes first</b></div></div></div>');
}
window.pageSubjects=pageSubjects;

async function delStaff(id){if(!confirm('Delete?'))return;try{await rest('/rest/v1/staff?id=eq.'+id,{method:'DELETE'});toast('Deleted','ok');nav('staff');}catch(e){toast(e.message,'bad');}}
window.delStaff=delStaff;

async function pageStaffAttendance(root){
  const today=new Date().toISOString().slice(0,10);
  root.innerHTML='<div class="page-head"><h1>⏰ Staff Attendance</h1></div><div class="card"><label>Date</label><input type="date" id="sad" value="'+today+'" onchange="loadStaffAtt()"></div><div id="sat"></div>';
  loadStaffAtt();
}
window.pageStaffAttendance=pageStaffAttendance;
async function loadStaffAtt(){
  const dt=document.getElementById('sad').value;
  const results=await Promise.all([rest('/rest/v1/staff?school_id=eq.'+_schoolId+'&select=*&order=full_name'),rest('/rest/v1/staff_attendance?school_id=eq.'+_schoolId+'&date=eq.'+dt+'&select=staff_id,status')]);
  const staff=results[0]||[];const ex=results[1]||[];
  const map={};ex.forEach(a=>map[a.staff_id]=a.status);
  window._saMap=map;window._saDate=dt;
  const c=document.getElementById('sat');
  if(!staff.length){c.innerHTML='<div class="card empty">No staff.</div>';return;}
  let rows='';
  staff.forEach(s=>{const st=map[s.id]||'';rows+='<tr><td><b>'+esc(s.full_name)+'</b></td><td>'+esc(s.role||'')+'</td><td style="text-align:center"><button class="btn sm '+(st==='present'?'ok':'ghost')+'" onclick="setStaffAtt(\''+s.id+'\',\'present\')">✓</button> <button class="btn sm '+(st==='absent'?'danger':'ghost')+'" onclick="setStaffAtt(\''+s.id+'\',\'absent\')">✗</button></td></tr>';});
  c.innerHTML='<div class="card"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th style="text-align:center">Status</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
window.loadStaffAtt=loadStaffAtt;
async function setStaffAtt(id,status){try{await rest('/rest/v1/staff_attendance?school_id=eq.'+_schoolId+'&staff_id=eq.'+id+'&date=eq.'+window._saDate,{method:'DELETE'});await rest('/rest/v1/staff_attendance',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({school_id:_schoolId,staff_id:id,date:window._saDate,status:status,source:'manual'})});loadStaffAtt();}catch(e){toast(e.message,'bad');}}
window.setStaffAtt=setStaffAtt;

async function pagePayroll(root){
  const results=await Promise.all([
    rest('/rest/v1/staff?school_id=eq.'+_schoolId+'&select=*&order=full_name'),
    rest('/rest/v1/staff_salaries?school_id=eq.'+_schoolId+'&select=*&order=created_at.desc&limit=200').catch(()=>[]),
    rest('/rest/v1/staff_advances?school_id=eq.'+_schoolId+'&select=*&order=given_date.desc&limit=100').catch(()=>[])
  ]);
  const staff=results[0]||[];window._payrollStaff=staff;
  const byId={};staff.forEach(s=>byId[s.id]=s);
  let salRows='';
  results[1].forEach(s=>{const st=byId[s.staff_id]||{};salRows+='<tr><td>'+esc(st.full_name||'')+'</td><td>'+s.month+'/'+s.year+'</td><td style="text-align:right">'+fmtNum(s.net)+'</td><td><span class="badge '+(s.status==='paid'?'ok':'warn')+'">'+esc(s.status)+'</span></td><td>'+(s.status!=='paid'?'<button class="btn sm ok" onclick="markPaid(\''+s.id+'\')">💵 Pay</button>':'')+'</td></tr>';});
  let advRows='';
  results[2].forEach(a=>{const st=byId[a.staff_id]||{};advRows+='<tr><td>'+esc(st.full_name||'')+'</td><td>'+fmtDate(a.given_date)+'</td><td style="text-align:right">'+fmtNum(a.amount)+'</td><td>'+esc(a.reason||'')+'</td></tr>';});
  root.innerHTML='<div class="page-head"><h1>💼 Payroll</h1><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn gold" onclick="runPayroll()">▶ Run Payroll All</button><button class="btn" onclick="addSalary()">＋ Salary</button><button class="btn ghost" onclick="addAdvance()">＋ Advance</button></div></div>'+
  '<div class="card"><h3>Salaries</h3>'+(salRows?'<div class="table-wrap"><table><thead><tr><th>Staff</th><th>Period</th><th style="text-align:right">Net</th><th>Status</th><th></th></tr></thead><tbody>'+salRows+'</tbody></table></div>':'<div class="empty">No salaries. Run Payroll All.</div>')+'</div>'+
  '<div class="card"><h3>Advances</h3>'+(advRows?'<div class="table-wrap"><table><thead><tr><th>Staff</th><th>Date</th><th style="text-align:right">Amount</th><th>Reason</th></tr></thead><tbody>'+advRows+'</tbody></table></div>':'<div class="empty">No advances.</div>')+'</div>';
}
window.pagePayroll=pagePayroll;
async function runPayroll(){
  const staff=window._payrollStaff||[];
  if(!staff.length){toast('No staff','bad');return;}
  const m=parseInt(prompt('Month (1-12):',new Date().getMonth()+1));
  const y=parseInt(prompt('Year:',new Date().getFullYear()));
  if(!m||!y)return;
  let c=0,sk=0;
  for(const s of staff){
    const gross=Number(s.monthly_salary||0);
    if(!gross){sk++;continue;}
    try{
      const ex=await rest('/rest/v1/staff_salaries?school_id=eq.'+_schoolId+'&staff_id=eq.'+s.id+'&month=eq.'+m+'&year=eq.'+y+'&select=id');
      if(ex&&ex.length){sk++;continue;}
      await rest('/rest/v1/staff_salaries',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({school_id:_schoolId,staff_id:s.id,month:m,year:y,gross:gross,allowances:0,deductions:0,advance_deducted:0,net:gross,status:'pending'})});
      c++;
    }catch(e){}
  }
  toast('Created '+c+' · Skipped '+sk,'ok');nav('payroll');
}
window.runPayroll=runPayroll;
async function markPaid(id){if(!confirm('Mark PAID?'))return;try{await rest('/rest/v1/staff_salaries?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({status:'paid',paid_date:new Date().toISOString().slice(0,10)})});toast('Paid','ok');nav('payroll');}catch(e){toast(e.message,'bad');}}
window.markPaid=markPaid;
function addSalary(){const opts=(window._payrollStaff||[]).map(s=>'<option value="'+s.id+'">'+esc(s.full_name)+'</option>').join('');modal('<h3>Add Salary</h3><div><label>Staff</label><select id="ss">'+opts+'</select></div><div class="grid grid-2" style="margin-top:12px"><div><label>Month</label><input id="sm" type="number" value="'+(new Date().getMonth()+1)+'"></div><div><label>Year</label><input id="sy" type="number" value="'+new Date().getFullYear()+'"></div></div><div style="margin-top:12px"><label>Gross</label><input id="sg" type="number" value="0"></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveSalary()">Save</button></div>');}
window.addSalary=addSalary;
async function saveSalary(){const sid=document.getElementById('ss').value;const m=parseInt(document.getElementById('sm').value);const y=parseInt(document.getElementById('sy').value);const g=Number(document.getElementById('sg').value)||0;if(!sid){toast('Select','bad');return;}try{await rest('/rest/v1/staff_salaries',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({school_id:_schoolId,staff_id:sid,month:m,year:y,gross:g,allowances:0,deductions:0,advance_deducted:0,net:g,status:'pending'})});toast('Added','ok');closeModal();nav('payroll');}catch(e){toast(e.message,'bad');}}
window.saveSalary=saveSalary;
function addAdvance(){const opts=(window._payrollStaff||[]).map(s=>'<option value="'+s.id+'">'+esc(s.full_name)+'</option>').join('');modal('<h3>Record Advance</h3><div><label>Staff</label><select id="as">'+opts+'</select></div><div style="margin-top:12px"><label>Amount</label><input id="aa" type="number"></div><div style="margin-top:12px"><label>Reason</label><input id="ar"></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveAdvance()">Save</button></div>');}
window.addAdvance=addAdvance;
async function saveAdvance(){const sid=document.getElementById('as').value;const a=Number(document.getElementById('aa').value);const r=document.getElementById('ar').value.trim()||null;if(!sid||!a){toast('Fill','bad');return;}try{await rest('/rest/v1/staff_advances',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({school_id:_schoolId,staff_id:sid,amount:a,reason:r,given_date:new Date().toISOString().slice(0,10),balance:a,status:'active'})});toast('Saved','ok');closeModal();nav('payroll');}catch(e){toast(e.message,'bad');}}
window.saveAdvance=saveAdvance;

async function pageExpenses(root){
  let rows=await rest('/rest/v1/expenses?school_id=eq.'+_schoolId+'&select=*&order=date.desc').catch(()=>[]);
  rows=rows.filter(e=>(!e.academic_year||e.academic_year===getYear())&&(!e.term||e.term===getTerm()));
  let body='';let total=0;
  rows.forEach(e=>{total+=Number(e.amount);body+='<tr><td>'+fmtDate(e.date)+'</td><td>'+esc(e.description)+'</td><td>'+esc(e.category||'')+'</td><td style="text-align:right">'+fmtNum(e.amount)+'</td></tr>';});
  if(!rows.length)body='<tr><td colspan="4" class="empty">No expenses yet</td></tr>';
  else body+='<tr style="background:#f1f5f9;font-weight:700"><td colspan="3" style="text-align:right">TOTAL</td><td style="text-align:right">'+fmtNum(total)+'</td></tr>';
  root.innerHTML='<div class="page-head"><h1>💸 Expenses</h1><button class="btn" onclick="addExpense()">＋ Add</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right">Amount</th></tr></thead><tbody>'+body+'</tbody></table></div></div>';
}

async function saveExpense(){const d=document.getElementById('xd').value.trim();const a=Number(document.getElementById('xa').value);const c=document.getElementById('xc').value.trim()||'Other';if(!d||!a){toast('Fill','bad');return;}try{await rest('/rest/v1/expenses',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({school_id:_schoolId,description:d,amount:a,category:c,academic_year:getYear(),term:getTerm()})});toast('Saved','ok');closeModal();nav('expenses');}catch(e){toast(e.message,'bad');}}
