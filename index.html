<style>
:root{--navy:#0a2540;--navy3:#1e3a5c;--navy4:#2c5282;--gold:#d4a017;--goldsoft:#fef3c7;--bg:#eef2f7;--line:#e2e8f0;--line2:#eef1f6;--muted:#64748b;--ok:#059669;--oksoft:#ecfdf5;--warn:#d97706;--warnsoft:#fffbeb;--bad:#dc2626;--badsoft:#fef2f2;--brandsoft:#e0e9f5}
*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{background:var(--bg);color:var(--navy);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:all .15s}
input,select,textarea{font-family:inherit;width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 4px rgba(10,37,64,.1)}
label{display:block;font-size:12.5px;color:#334155;margin-bottom:6px;font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line2);font-size:13.5px}
th{color:#fff;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;background:var(--navy)}
tbody tr:hover{background:#f9fafb}
h1{font-size:20px;font-weight:700;margin:0 0 4px;color:var(--navy)}
h3{font-size:15px;font-weight:700;margin:0 0 12px;color:var(--navy)}
.muted{color:var(--muted);font-size:12.5px}
.topbar{position:fixed;top:0;left:0;right:0;height:48px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 12px;z-index:100;gap:10px}
.topbar .title{flex:1;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.topbar .icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:16px}
.topbar .icon-btn:hover{background:rgba(255,255,255,.1)}
#app{min-height:100vh;padding-top:48px;padding-bottom:90px}
.container{max-width:1100px;margin:0 auto;padding:0 12px}
.header-wrap{padding:12px}
.header-card{background:linear-gradient(135deg,var(--navy) 0%,var(--navy3) 100%);color:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 24px -8px rgba(10,37,64,.4)}
.header-top{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px}
.admin-chip{background:rgba(255,255,255,.15);color:#fff;font-size:10.5px;font-weight:700;padding:4px 12px;border-radius:999px;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(255,255,255,.2)}
.exit-chip{background:#dc2626;color:#fff;font-size:10.5px;font-weight:700;padding:4px 12px;border-radius:999px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.header-school{display:flex;align-items:flex-start;gap:10px;font-size:16px;font-weight:800;margin-bottom:8px;text-transform:uppercase}
.header-school .logo{width:40px;height:40px;border-radius:10px;background:var(--gold);display:grid;place-items:center;font-size:20px;color:var(--navy);flex-shrink:0;overflow:hidden}
.header-school .logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.header-school .name{flex:1;padding-top:4px}
.header-meta,.header-datetime{font-size:12.5px;color:#cbd5e1;line-height:1.7;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.header-periods{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.header-period{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;color:#fff}
.header-period select{background:transparent;color:#fff;border:none;padding:0 4px;font-size:12px;font-weight:700;width:auto;cursor:pointer}
.header-period select option{color:var(--navy)}
.term-pill{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#fff;font-size:11px;font-weight:800;padding:5px 14px;border-radius:999px;letter-spacing:.05em;text-transform:uppercase}
.header-search{position:relative}
.header-search input{background:#fff;border:none;border-radius:999px;padding:13px 20px 13px 46px;font-size:13.5px;color:var(--navy);font-weight:500}
.header-search .si{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:15px;pointer-events:none}
.nav-pills{display:flex;gap:8px;padding:12px 0 4px;overflow-x:auto;scrollbar-width:none}
.nav-pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;background:#fff;color:var(--navy);font-size:12.5px;font-weight:600;border:1.5px solid var(--line);white-space:nowrap;cursor:pointer}
.pill.active{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:3px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.04);margin-bottom:14px}
.grid{display:grid;gap:12px}
.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
@media(max-width:640px){.grid-2,.grid-3{grid-template-columns:1fr}.grid-kpi{grid-template-columns:1fr 1fr}}
.kpi{background:#fff;border-radius:14px;padding:18px 14px;box-shadow:0 2px 8px rgba(15,23,42,.05);border-top:3px solid var(--gold);text-align:center}
.kpi .v{font-size:22px;font-weight:800;color:var(--navy);line-height:1.15;word-break:break-word}
.kpi .l{color:var(--muted);font-size:11.5px;margin-top:6px;font-weight:500}
.kpi.kpi-ok{border-top-color:var(--ok)}.kpi.kpi-ok .v{color:#065f46}
.kpi.kpi-bad{border-top-color:var(--bad)}.kpi.kpi-bad .v{color:#7f1d1d}
.kpi.kpi-warn{border-top-color:var(--warn)}.kpi.kpi-warn .v{color:#78350f}
.kpi.kpi-navy{border-top-color:var(--navy)}
.kpi.kpi-plain{border-top-color:var(--line)}.kpi.kpi-plain .v{color:var(--navy)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--oksoft);color:#047857;border:1px solid #a7f3d0}
.badge.bad{background:var(--badsoft);color:#b91c1c;border:1px solid #fecaca}
.badge.info{background:var(--brandsoft);color:var(--navy);border:1px solid #c7d2fe}
.badge.warn{background:var(--warnsoft);color:#92400e;border:1px solid #fde68a}
.badge.req{background:#e0e7ff;color:#3730a3;border:1px solid #a5b4fc}
.btn{background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer}
.btn:hover{background:var(--navy3)}.btn:disabled{opacity:.5}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn.danger{background:var(--bad)}.btn.ok{background:var(--ok)}.btn.gold{background:var(--gold)}
.btn.sm{padding:6px 12px;font-size:11.5px}
.btn.block{width:100%}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;z-index:1000;font-size:13px;box-shadow:0 20px 40px -12px rgba(10,37,64,.5);max-width:90vw;text-align:center}
.toast.bad{background:#7f1d1d}.toast.ok{background:#065f46}
.auth-bg{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),var(--navy4));display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;overflow:auto}
.auth-card{background:#fff;border-radius:20px;padding:30px 26px;width:100%;max-width:440px;margin:auto}
.auth-card .logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,var(--navy),var(--navy4));display:grid;place-items:center;color:var(--gold);font-weight:800;font-size:24px;margin:0 auto 14px}
.auth-card h1{text-align:center;font-size:19px;margin:0 0 6px}
.auth-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}
.tabs{display:flex;background:#f1f5f9;border-radius:999px;padding:4px;margin-bottom:22px}

.loading{padding:60px;text-align:center;color:var(--muted)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(10,37,64,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(2px)}

.modal{background:#fff;border-radius:20px 20px 0 0;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:22px}

.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:90}
.bottom-bar-inner{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:1100px;margin:0 auto}
.bottom-bar-inner::-webkit-scrollbar{display:none}
.bottom-bar .pill{background:var(--navy);color:#fff;border-color:var(--navy);padding:9px 14px;font-size:12px}
.bottom-bar .pill.active{background:var(--gold);border-color:var(--gold)}
.wa-float{position:fixed;bottom:96px;right:16px;background:#25D366;color:#fff;width:52px;height:52px;border-radius:50%;z-index:99;text-decoration:none;box-shadow:0 10px 20px rgba(0,0,0,.25);display:grid;place-items:center;font-size:22px}
@media(max-width:640px){.page-head{flex-direction:column;align-items:stretch}.page-head .btn{width:100%}.kpi .v{font-size:19px}}
.rc-title{text-align:center;font-size:15px;font-weight:800;color:var(--navy);text-transform:uppercase;margin:10px 0 6px}
.rc-info{width:100%;border-collapse:collapse;margin:10px 0}
.rc-info td{padding:8px 10px;font-size:12.5px;border:1px solid var(--line)}
.rc-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding:12px;background:#f8fafc;border-radius:10px;border:1px solid var(--line)}
.rc-summary div b{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;margin-bottom:2px;letter-spacing:.04em}
.rc-summary div{font-size:14px;font-weight:700;color:var(--navy)}
.rc-comment{margin-top:10px;padding:12px;background:var(--warnsoft);border-left:3px solid var(--gold);border-radius:8px;font-size:13px;line-height:1.6}
.rc-comment.director{background:#eef2f7;border-left-color:var(--navy)}
.rc-sign{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:16px;font-size:11.5px}
.gc-key{margin-top:12px;padding:10px;background:#f1f5f9;border-radius:8px;font-size:11px;color:var(--muted);line-height:1.6}
.rc-multi th{background:var(--navy);color:#fff;font-size:11px;text-transform:uppercase;text-align:center;padding:8px 6px}
.rc-multi th .sub{font-size:9px;font-weight:400;opacity:.75;text-transform:none;display:block;margin-top:2px}
.rc-multi td{padding:8px 10px;font-size:12.5px;border:1px solid #e2e8f0}
.rc-multi tfoot td{background:#f1f5f9;font-weight:700;border-top:2px solid #0a2540}
.profile-hero{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;border-radius:16px;padding:20px;margin-bottom:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}

.profile-hero .info .meta{color:#cbd5e1;font-size:12.5px}
.tabs-bar{display:flex;gap:6px;overflow-x:auto;padding:4px 0;border-bottom:2px solid var(--line);margin-bottom:14px;scrollbar-width:none}
.tabs-bar::-webkit-scrollbar{display:none}
.tabs-bar button{flex:0 0 auto;padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs-bar button.active{color:var(--navy);border-bottom-color:var(--gold)}
.mini-stat{display:inline-block;padding:6px 12px;background:#f1f5f9;border-radius:8px;font-size:12px;font-weight:600;color:var(--navy);margin:2px 4px 2px 0}
.palette-bg{position:fixed;inset:0;background:rgba(10,37,64,.7);z-index:2000;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh}
.palette{background:#fff;width:92%;max-width:560px;border-radius:14px;overflow:hidden}

.palette-results{max-height:56vh;overflow:auto}
.palette-item{padding:12px 20px;cursor:pointer;display:flex;gap:10px;font-size:13.5px;border-bottom:1px solid var(--line2)}
.palette-item:hover,.palette-item.sel{background:var(--brandsoft)}
.palette-item .k{flex:1}
.palette-item .hint{font-size:11px;color:var(--muted)}
.receipt{background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:20px;font-family:monospace;font-size:12.5px;line-height:1.7;max-width:420px;margin:0 auto}
.receipt .rhead{text-align:center;border-bottom:1px dashed #cbd5e1;padding-bottom:10px;margin-bottom:10px}

function setSession(d){if(d)safeStorage.setItem('eudes_session',JSON.stringify(d));else safeStorage.removeItem('eudes_session')}

async function rest(path,opts){
  opts=opts||{};
  const h=Object.assign({apikey:SUPA_KEY,'Content-Type':'application/json'},opts.headers||{});
  const t=getToken();h.Authorization='Bearer '+(t||SUPA_KEY);
  const r=await fetch(SUPA_URL+path,Object.assign({},opts,{headers:h}));
  const txt=await r.text();
  let d=null;try{d=txt?JSON.parse(txt):null}catch(e){d=txt}
  if(!r.ok){if(r.status===401){setSession(null);alert('Session expired');location.reload();throw new Error('expired')}throw new Error((d&&(d.message||d.msg||d.error_description||d.error))||txt||('HTTP '+r.status))}
  return d;
}
async function auth(path,body){
  const r=await fetch(SUPA_URL+path,{method:'POST',headers:{apikey:SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const txt=await r.text();let d=null;try{d=txt?JSON.parse(txt):null}catch(e){d=txt}
  if(!r.ok)throw new Error((d&&(d.message||d.msg||d.error_description||d.error))||txt);
  return d;
}

  try{const p=await rest('/rest/v1/profiles?id=eq.'+u.id+'&select=*');_profile=p&&p[0]}catch(e){document.getElementById('authScreen').style.display='flex';document.getElementById('loginErr').textContent='Profile error';document.getElementById('loginErr').style.display='block';return}

function populateTermSelector(){
  const yS=document.getElementById('termYearSelect'),tS=document.getElementById('termTermSelect');
  if(!yS||!tS)return;
  const cy=getCurrentYear(),ct=getCurrentTerm();const currentYear=new Date().getFullYear();
  const years=[];for(let y=currentYear-2;y<=currentYear+1;y++)years.push(y);
  if(!years.includes(cy))years.push(cy);years.sort((a,b)=>b-a);
  yS.innerHTML=years.map(y=>'<option value="'+y+'"'+(y===cy?' selected':'')+'>'+y+'</option>').join('');
  tS.value=ct;
}

function pickLogoFile(){
  const input=document.createElement('input');
  input.type='file';input.accept='image/png,image/jpeg,image/jpg,image/gif,image/webp';
  input.onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    if(file.size>800*1024){if(!confirm('Logo is '+(file.size/1024).toFixed(0)+'KB. For best performance, keep under 500KB. Continue?'))return}
    const reader=new FileReader();
    reader.onload=async ev=>{
      const dataUrl=ev.target.result;
      try{await rest('/rest/v1/schools?id=eq.'+_schoolId,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({logo_url:dataUrl})});_school.logo_url=dataUrl;renderHeader();toast('Logo saved','ok');nav(activeRoute)}catch(err){toast(err.message,'bad')}
    };
    reader.readAsDataURL(file);
  };
  input.click();
}
window.pickLogoFile=pickLogoFile;

  let te=0,tc=0,debtors=0,funcPend=0,funcExpected=0,funcCollected=0,funcCashCount=0,funcReqCount=0,funcPendingCount=0,funcPartialCount=0;
  active.forEach(s=>{const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);te+=sf;const p=pbs[s.id]||{school:0};tc+=p.school;if(sf-p.school>0)debtors++;const ff=Number(s.functional_fee)||FUNC_FEE_DEFAULT;funcExpected+=ff;const st=s.functional_fee_status||'pending';const fp=Number(s.functional_fee_paid)||p.func||0;funcCollected+=fp;if(st==='cash')funcCashCount++;else if(st==='requirements')funcReqCount++;else{if(fp>0)funcPartialCount++;else funcPendingCount++}if(!s.functional_fee_status||s.functional_fee_status==='pending')funcPend++});
  const totOut=te-tc;const presentToday=att.filter(a=>a.status==='present').length;const absentToday=att.filter(a=>a.status==='absent').length;const expTotal=expenses.reduce((s,e)=>s+Number(e.amount),0);
  const byLevel={nursery:0,lower:0,upper:0};active.forEach(s=>{const cls=classes.find(c=>c.id===s.class_id);if(cls)byLevel[levelOfClass(cls)]++});
  root.innerHTML='<div class="page-head"><div><h1>Dashboard</h1><div class="sub">'+termLabel()+' · '+fmtLong(new Date())+'</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" onclick="openPalette()">🔍</button><button class="btn" onclick="addStudent()">＋ Register</button></div></div>'+
  ((_school&&!_school.logo_url)?'<div class="alert-item" onclick="nav(\'settings\')" style="background:var(--goldsoft)"><span class="ico">🏛️</span><div class="txt"><b>Upload your school logo</b><span>Tap here → Settings → Logo. It will appear on every report card and receipt.</span></div><span class="badge warn">Action</span></div>':'')+
  '<div class="term-warn">📌 Viewing <b>'+termLabel()+'</b>.</div>'+
  '<div class="grid grid-kpi" style="margin-bottom:14px">'+
  '<div class="kpi kpi-navy"><div class="v">'+active.length+'</div><div class="l">Pupils</div></div>'+
  '<div class="kpi kpi-ok"><div class="v">'+fmtUGX(thisTermSchool)+'</div><div class="l">Fees · This Term</div></div>'+
  '<div class="kpi"><div class="v">'+fmtUGX(allTimeSchool)+'</div><div class="l">Fees · All-Time</div></div>'+
  '<div class="kpi kpi-bad"><div class="v">'+fmtUGX(totOut)+'</div><div class="l">Outstanding</div></div>'+
  '<div class="kpi kpi-ok"><div class="v">'+presentToday+'</div><div class="l">Present</div></div>'+
  '<div class="kpi kpi-warn"><div class="v">'+absentToday+'</div><div class="l">Absent</div></div></div>'+
  '<div class="grid grid-3" style="margin-bottom:14px">'+
  '<div class="card"><h3>🏫 By Level</h3><div style="font-size:13px;line-height:2"><div>'+levelBadge('nursery')+' <b>'+byLevel.nursery+'</b></div><div>'+levelBadge('lower')+' <b>'+byLevel.lower+'</b></div><div>'+levelBadge('upper')+' <b>'+byLevel.upper+'</b></div></div></div>'+
  '<div class="card"><h3>🧾 Functional Fee</h3><div style="font-size:13px;line-height:1.9"><div>Expected: <b>'+fmtUGX(funcExpected)+'</b></div><div>Collected: <b style="color:#047857">'+fmtUGX(funcCollected)+'</b></div><div>Shortfall: <b style="color:#b91c1c">'+fmtUGX(Math.max(0,funcExpected-funcCollected))+'</b></div><div style="margin-top:6px"><span class="mini-stat">💵 '+funcCashCount+'</span><span class="mini-stat">📦 '+funcReqCount+'</span><span class="mini-stat">⏳ '+funcPendingCount+'</span></div></div></div>'+
  '<div class="card"><h3>🔔 Alerts</h3>'+(debtors>0?'<div class="alert-item danger" onclick="nav(\'debtors\')"><span class="ico">⚠️</span><div class="txt"><b>'+debtors+' debtors</b></div></div>':'')+(funcPend>0?'<div class="alert-item" onclick="_feesTab=\'func\';nav(\'fees\')"><span class="ico">🧾</span><div class="txt"><b>'+funcPend+' pending func fee</b></div></div>':'')+(presentToday===0?'<div class="alert-item info" onclick="nav(\'attendance\')"><span class="ico">📅</span><div class="txt"><b>Attendance not taken</b></div></div>':'')+(debtors===0&&funcPend===0&&presentToday>0?'<div class="alert-item ok"><span class="ico">✅</span><div class="txt"><b>All systems normal</b></div></div>':'')+'</div></div>'+

}

}

async function recordPayment(id,pre){
  const [st,pays]=await Promise.all([rest('/rest/v1/students?id=eq.'+id+'&select=*'),rest('/rest/v1/payments?student_id=eq.'+id+'&select=amount,payment_for')]);
  const s=st[0];if(!s)return;const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);const ff=Number(s.functional_fee)||FUNC_FEE_DEFAULT;
  const sp=pays.filter(p=>p.payment_for!=='Functional Fees').reduce((a,p)=>a+Number(p.amount),0);const fp=pays.filter(p=>p.payment_for==='Functional Fees').reduce((a,p)=>a+Number(p.amount),0);
  const funcPaid=Math.max(fp,Number(s.functional_fee_paid)||0);const bal=sf-sp;const fsh=Math.max(0,ff-funcPaid);
  const now=new Date();const tz=now.getTimezoneOffset()*60000;const l=new Date(now-tz).toISOString().slice(0,16);
  const da=pre==='Functional Fees'?(fsh>0?fsh:''):(bal>0?bal:'');
  modal('<h3>💵 Payment — '+esc(s.first_name+' '+(s.last_name||''))+'</h3><div style="background:var(--brandsoft);padding:12px;border-radius:10px;margin-bottom:16px;font-size:13px;line-height:1.9"><div>📚 <b>School balance:</b> '+fmtUGX(bal)+'</div><div>🧾 <b>Func:</b> '+functionalStatusBadge(s.functional_fee_status)+' — '+fmtUGX(funcPaid)+' / '+fmtUGX(ff)+'</div><div>📅 Tagged: <b>'+termLabel()+'</b></div></div>'+
  '<div class="grid grid-2"><div><label>For *</label><select id="p_for" onchange="onPayChange()"><option value="School Fees"'+(pre!=='Functional Fees'?' selected':'')+'>📚 School Fees</option><option value="Functional Fees"'+(pre==='Functional Fees'?' selected':'')+'>🧾 Func. Fees</option></select></div>'+
  '<div><label>Amount *</label><input id="p_amount" type="number" value="'+da+'"></div>'+
  '<div><label>Method</label><select id="p_method"><option>Cash</option><option>Mobile Money</option><option>Bank</option></select></div>'+
  '<div><label>Date</label><input id="p_date" type="datetime-local" value="'+l+'"></div>'+
  '<div><label>Notes</label><input id="p_notes"></div></div>'+
  '<div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn ok" onclick="savePayment(\''+id+'\')">💾 Save</button></div>');
  window._fsh=fsh;window._bal=bal;
}

async function savePayment(id){
  const pf=document.getElementById('p_for').value;const amt=parseFloat(document.getElementById('p_amount').value);const m=document.getElementById('p_method').value;const dv=document.getElementById('p_date').value;const nt=document.getElementById('p_notes').value.trim();

    const [st,pays]=await Promise.all([rest('/rest/v1/students?id=eq.'+id+'&select=total_expected,functional_fee,functional_fee_status'),rest('/rest/v1/payments?student_id=eq.'+id+'&select=amount,payment_for')]);

    const sp=pays.filter(p=>p.payment_for!=='Functional Fees').reduce((a,p)=>a+Number(p.amount),0);const fp=pays.filter(p=>p.payment_for==='Functional Fees').reduce((a,p)=>a+Number(p.amount),0);
    const upd={current_balance:Math.max(0,te-sp),functional_fee_paid:fp,functional_fee:ff};const cs=st[0].functional_fee_status||'pending';if(cs!=='requirements')upd.functional_fee_status=fp>=ff?'cash':'pending';
    await rest('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(upd)});

async function pageDebtors(root){

  const pbs={};(payments||[]).forEach(p=>{if(!pbs[p.student_id])pbs[p.student_id]=0;if(p.payment_for!=='Functional Fees')pbs[p.student_id]+=Number(p.amount)});
  const dbt=(students||[]).filter(s=>{const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);return (sf-(pbs[s.id]||0))>0}).map(s=>{const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);return{...s,owed:sf-(pbs[s.id]||0)}}).sort((a,b)=>b.owed-a.owed);
  const tot=dbt.reduce((s,x)=>s+x.owed,0);
  root.innerHTML='<div class="page-head"><div><h1>📋 Debtors</h1><div class="sub">'+dbt.length+' pupils · '+fmtUGX(tot)+'</div></div></div>'+

async function pageTimetable(root){
  const [classes,subjects,staff]=await Promise.all([loadClasses(),loadSubjects(),loadStaff()]);
  if(!(classes||[]).length){root.innerHTML='<div class="card"><div class="empty">Add classes first.</div></div>';return}
  const cId=window._ttClassId||classes[0].id;const cls=classes.find(c=>c.id===cId)||classes[0];
  const entries=await rest('/rest/v1/timetable?school_id=eq.'+_schoolId+'&class_id=eq.'+cls.id+'&select=*').catch(()=>[]);
  const days=['Mon','Tue','Wed','Thu','Fri'];const periods=[1,2,3,4,5,6,7,8];const times={'1':'08:00','2':'08:40','3':'09:20','4':'10:20','5':'11:00','6':'11:40','7':'14:00','8':'14:40'};
  const sj={};(subjects||[]).forEach(s=>sj[s.id]=s);const stf={};(staff||[]).forEach(s=>stf[s.id]=s);
  const cm={};entries.forEach(e=>cm[e.day_of_week+'-'+e.period]=e);
  let g='<div style="display:grid;grid-template-columns:80px repeat(5,1fr);gap:4px;min-width:640px"><div style="background:var(--navy);color:#fff;padding:8px;border-radius:6px;text-align:center;font-weight:700">Time</div>'+days.map(d=>'<div style="background:var(--navy);color:#fff;padding:8px;border-radius:6px;text-align:center;font-weight:700">'+d+'</div>').join('');
  periods.forEach(p=>{g+='<div style="background:#f1f5f9;padding:8px;border-radius:6px;text-align:center;font-weight:700;color:var(--navy)">P'+p+'<div style="font-size:10px">'+times[p]+'</div></div>';for(let d=1;d<=5;d++){const e=cm[d+'-'+p];if(e){const s=sj[e.subject_id];const t=stf[e.staff_id];g+='<div style="border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center;cursor:pointer" onclick="editTTCell('+d+','+p+',\''+cls.id+'\')"><b>'+esc(s?s.code:'—')+'</b><div style="font-size:10px;color:#666">'+esc(t?t.full_name.split(' ')[0]:'')+'</div></div>'}else g+='<div style="border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center;color:#ccc;cursor:pointer" onclick="editTTCell('+d+','+p+',\''+cls.id+'\')">+</div>'}});
  g+='</div>';
  root.innerHTML='<div class="page-head"><div><h1>🗓️ Timetable</h1></div><button class="btn ghost" onclick="clearTimetable(\''+cls.id+'\')">🗑️ Clear</button></div>'+
  '<div class="card"><label>Class</label><select onchange="window._ttClassId=this.value;nav(\'timetable\')">'+classes.map(c=>'<option value="'+c.id+'"'+(c.id===cls.id?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div>'+
  '<div class="card" style="overflow-x:auto">'+g+'</div>';
}

/* ========== EXCEL IMPORT ========== */
async function eudesImport(){document.getElementById('excelInput').click()}
window.eudesImport=eudesImport;
async function eudesImportFilePicked(input){
  if(!input.files||!input.files.length)return;
  const file=input.files[0];const reader=new FileReader();
  reader.onload=async ev=>{
    try{toast('Reading…','ok');const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});const sheet=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});
      if(!rows||rows.length<2){toast('Empty','bad');input.value='';return}
      const hd=(rows[0]||[]).map(h=>String(h||'').trim().toLowerCase());
      const find=(...ns)=>{for(const n of ns){const i=hd.findIndex(h=>h===n.toLowerCase());if(i!==-1)return i}for(const n of ns){const i=hd.findIndex(h=>h.indexOf(n.toLowerCase())!==-1);if(i!==-1)return i}return -1};
      const cN=find('name'),cC=find('class'),cS=find('status','boarding'),cBF=find('b/f','bf'),cA=find('actual fee','tuition'),cF=find('funct','functional'),cT=find('transport'),cD1=find('1st deposit'),cD2=find('2nd deposit'),cD3=find('3rd deposit');
      if(cN<0||cC<0){toast('Missing Name/Class','bad');input.value='';return}
      const num=v=>{if(v==null)return 0;let s=String(v).trim();if(s===''||s==='-')return 0;const neg=/^\(.*\)$/.test(s);s=s.replace(/[^0-9.\-]/g,'');if(s===''||s==='-')return 0;let n=parseFloat(s);return isNaN(n)?0:(neg?-Math.abs(n):n)};
      const parsed=[];const seen=new Set();
      for(let i=1;i<rows.length;i++){const r=rows[i];if(!r)continue;const full=String(r[cN]||'').trim();if(!full)continue;const lo=full.toLowerCase();if(lo==='name'||lo.indexOf('total')!==-1)continue;if(seen.has(lo))continue;seen.add(lo);
        const cr=String(r[cC]||'').trim();const sr=String(r[cS]||'').trim().toLowerCase();let b='Day';if(sr.indexOf('board')!==-1)b='Boarding';else if(sr==='bar')b='BAR';
        parsed.push({full,clsRaw:cr,clsLower:cr.toLowerCase(),boarding:b,bf:num(r[cBF]),act:num(r[cA]),func:num(r[cF]),trans:num(r[cT]),d1:num(r[cD1]),d2:num(r[cD2]),d3:num(r[cD3])})}
      if(!parsed.length){toast('No valid rows','bad');input.value='';return}
      const classes=await loadClasses();const cMap={};classes.forEach(c=>cMap[c.name.trim().toLowerCase()]=c.id);
      const unknown=[...new Set(parsed.map(p=>p.clsRaw).filter(c=>c&&!cMap[c.toLowerCase()]))];
      modal('<h3>📋 Import Preview</h3><div style="background:var(--brandsoft);padding:14px;border-radius:10px;font-size:13px;line-height:1.9"><div><b>Pupils:</b> '+parsed.length+'</div><div><b>Func. paid:</b> '+parsed.filter(p=>p.func>0).length+' · '+fmtUGX(parsed.reduce((s,p)=>s+p.func,0))+'</div></div>'+(unknown.length?'<div class="err" style="margin-top:12px"><b>New classes:</b> '+unknown.map(esc).join(', ')+'</div>':'')+'<div class="actions"><button class="btn ghost" onclick="closeModal();document.getElementById(\'excelInput\').value=\'\'">Cancel</button><button class="btn ok" onclick="eudesImportCommit()">✅ Import '+parsed.length+'</button></div>');
      window._imp={parsed,cMap,unknown};
    }catch(err){toast('Error: '+err.message,'bad');input.value=''}
  };
  reader.readAsArrayBuffer(file);
}
window.eudesImportFilePicked=eudesImportFilePicked;
async function eudesImportCommit(){
  const p=window._imp;if(!p)return;const {parsed,cMap}=p;closeModal();document.getElementById('excelInput').value='';
  for(const clsName of p.unknown){try{const ins=await rest('/rest/v1/classes',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({school_id:_schoolId,name:clsName.trim(),sort_order:0})});if(ins&&ins[0])cMap[clsName.trim().toLowerCase()]=ins[0].id}catch(e){}}
  _classesCache=null;await loadClasses();toast('Importing '+parsed.length+'…','ok');
  let created=0,payments=0;const cy=getCurrentYear(),ct=getCurrentTerm();const iso=new Date().toISOString();
  for(const r of parsed){try{const parts=r.full.split(/\s+/);const fn=parts[0];const ln=parts.slice(1).join(' ')||null;const classId=cMap[r.clsLower]||null;const totE=r.bf+r.act+r.trans;const dep=r.d1+r.d2+r.d3;const bal=Math.max(0,totE-dep);const fs=r.func>0?'cash':'pending';
    const stu=await rest('/rest/v1/students',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({school_id:_schoolId,admission_no:'ADM-'+Date.now().toString().slice(-6)+Math.floor(Math.random()*99),first_name:fn,last_name:ln,lin:generateLIN(fn),class_id:classId,boarding_status:r.boarding,balance_bf:r.bf,actual_fee:r.act,transport_fee:r.trans,functional_fee:FUNC_FEE_DEFAULT,functional_fee_paid:r.func,functional_fee_status:fs,total_expected:totE,current_balance:bal,status:'active'})});
    if(!stu||!stu[0])continue;const sid=stu[0].id;created++;
    const mkPay=async(amt,label,forType)=>{if(!amt||amt<=0)return false;await rest('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({school_id:_schoolId,student_id:sid,amount:amt,payment_for:forType,payment_method:'Cash',notes:label,paid_at:iso,academic_year:cy,term:ct})});return true};
    if(await mkPay(r.d1,'1st dep','School Fees'))payments++;if(await mkPay(r.d2,'2nd dep','School Fees'))payments++;if(await mkPay(r.d3,'3rd dep','School Fees'))payments++;if(r.func>0&&await mkPay(r.func,'Func','Functional Fees'))payments++;
  }catch(e){}}
  toast('✅ '+created+' pupils · '+payments+' payments','ok');nav('students');
}
window.eudesImportCommit=eudesImportCommit;

/* ========== COMMAND PALETTE ========== */
function openPalette(){if(document.querySelector('.palette-bg'))return;const div=document.createElement('div');div.className='palette-bg';div.innerHTML='<div class="palette"><input id="paletteInput" placeholder="Search…" autofocus><div class="palette-results" id="paletteResults"></div></div>';document.body.appendChild(div);div.onclick=e=>{if(e.target===div)div.remove()};const inp=document.getElementById('paletteInput');inp.focus();inp.oninput=()=>runPalette(inp.value);inp.onkeydown=e=>{if(e.key==='Escape')div.remove();if(e.key==='Enter'){const s=document.querySelector('.palette-item.sel')||document.querySelector('.palette-item');if(s)s.click()}};runPalette('')}
window.openPalette=openPalette;
function runPalette(q){const res=document.getElementById('paletteResults');if(!res)return;q=(q||'').toLowerCase();const items=[];Object.entries(ROUTES).forEach(([k,r])=>{if(k==='student_profile')return;if(q&&r.label.toLowerCase().indexOf(q)===-1&&k.indexOf(q)===-1)return;items.push({icon:r.icon,label:r.label,hint:'Page',run:()=>{closePalette();nav(k)}})});const st=window._allStudents||[];if(q&&q.length>=2){st.filter(s=>(s.first_name+' '+(s.last_name||'')+' '+s.admission_no).toLowerCase().indexOf(q)!==-1).slice(0,8).forEach(s=>{items.push({icon:'👤',label:s.first_name+' '+(s.last_name||''),hint:'Adm '+s.admission_no,run:()=>{closePalette();openProfile(s.id)}})})}if(!items.length){res.innerHTML='<div class="palette-item">No results</div>';return}res.innerHTML=items.slice(0,20).map((it,i)=>'<div class="palette-item'+(i===0?' sel':'')+'" data-idx="'+i+'"><span style="font-size:18px">'+it.icon+'</span><div class="k">'+esc(it.label)+'</div><div class="hint">'+esc(it.hint)+'</div></div>').join('');res.querySelectorAll('.palette-item').forEach(el=>{el.onclick=()=>items[parseInt(el.dataset.idx)].run();el.onmouseenter=()=>{res.querySelectorAll('.palette-item').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')}})}
window.runPalette=runPalette;
function closePalette(){const p=document.querySelector('.palette-bg');if(p)p.remove()}
window.closePalette=closePalette;
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();openPalette()}if(e.key==='Escape')closePalette()});

/* ========== AUTH REDIRECT ========== */
async function handleAuthRedirect(){
  const hash=window.location.hash;
  if(hash&&hash.includes('access_token')){const p=new URLSearchParams(hash.substring(1));const at=p.get('access_token');const rt=p.get('refresh_token');if(at){try{const r=await fetch(SUPA_URL+'/auth/v1/user',{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+at}});const u=await r.json();if(u&&u.id){setSession({access_token:at,refresh_token:rt,user:u});window.history.replaceState(null,'',window.location.pathname);await boot();return}}catch(e){}}}
  const s=safeStorage.getItem('eudes_session');if(s){try{await boot()}catch(e){}}
}
handleAuthRedirect();
