<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>EUDES School Management · Multi-School Edition</title>
<style>
:root{--navy:#0a2540;--gold:#d4a017;--bg:#eef2f7;--line:#e2e8f0;--muted:#64748b;--ok:#059669;--bad:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--navy);font-size:14px}
button{cursor:pointer;border:none;background:none;font-family:inherit}input,select,textarea{font-family:inherit;width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:14px}
label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:#334155}
table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eef1f6;font-size:13.5px}th{background:var(--navy);color:#fff;font-size:11px;text-transform:uppercase}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.btn{background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px}.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy)}.btn.gold{background:var(--gold)}.btn.ok{background:var(--ok)}.btn.danger{background:var(--bad)}.btn.sm{padding:6px 12px;font-size:11.5px}.btn.block{width:100%}
.badge{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}.badge.ok{background:#ecfdf5;color:#047857}.badge.bad{background:#fef2f2;color:#b91c1c}.badge.info{background:#e0e9f5;color:var(--navy)}.badge.warn{background:#fffbeb;color:#92400e}
.topbar{position:fixed;top:0;left:0;right:0;height:48px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 12px;gap:10px;z-index:100}.topbar .title{flex:1;font-size:12.5px;font-weight:600;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app{min-height:100vh;padding:84px 12px 90px;display:none;max-width:1100px;margin:0 auto}
.header{background:linear-gradient(135deg,var(--navy),#1e3a5c);color:#fff;border-radius:20px;padding:18px;margin-bottom:12px}.header-school{display:flex;gap:10px;align-items:center;font-weight:800;text-transform:uppercase}.logo{width:44px;height:44px;border-radius:10px;background:var(--gold);display:grid;place-items:center;font-size:20px;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}
.pill{padding:9px 15px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap}.pill.active{background:var(--navy);color:#fff}.nav{display:flex;gap:8px;overflow-x:auto;padding:8px 0}.grid{display:grid;gap:12px}.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.kpi{background:#fff;border-radius:14px;padding:16px;text-align:center;border-top:3px solid var(--gold)}.kpi .v{font-size:22px;font-weight:800}.kpi .l{color:var(--muted);font-size:11.5px}
.auth-bg{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),#2c5282);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200}.auth-card{background:#fff;border-radius:20px;padding:30px 26px;width:100%;max-width:440px}.auth-card h1{text-align:center;font-size:19px}.err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:11px;border-radius:10px;margin-top:14px;font-size:13px;white-space:pre-wrap}
.modal-bg{position:fixed;inset:0;background:rgba(10,37,64,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.modal{background:#fff;border-radius:20px;max-width:720px;width:100%;max-height:92vh;overflow:auto;padding:22px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid #eef1f6;flex-wrap:wrap}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;z-index:1000}.toast.bad{background:#7f1d1d}.toast.ok{background:#065f46}
.marks-input{width:70px;padding:6px;text-align:center;border:2px solid var(--line);border-radius:8px;font-weight:700}
.rc-stage{background:#e2e8f0;padding:20px;border-radius:12px;display:flex;justify-content:center;margin-bottom:20px;overflow-x:auto;position:relative}
.rc-page{width:210mm;min-height:297mm;background:#fff;padding:10mm 12mm;font-family:'Times New Roman',Times,serif;color:#000;box-shadow:0 4px 20px rgba(10,37,64,.15);display:flex;flex-direction:column;font-size:11pt;line-height:1.3;border:3px solid #800080}
.rc-inner{border:2px solid #800080;padding:10px;flex:1;display:flex;flex-direction:column}
.rc-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #800080;padding-bottom:10px;margin-bottom:10px;text-align:center}
.rc-head .side-logo{width:75px;height:75px;border-radius:50%;border:1px solid #800080;display:grid;place-items:center;font-size:9pt;color:#800080;overflow:hidden}.rc-head .side-logo img{width:100%;height:100%;object-fit:cover}
.rc-head .title-block{flex:1}.rc-head .title-block h1{font-size:22pt;margin:0;text-transform:uppercase;color:#800080;font-family:Arial,sans-serif}.rc-head .title-block .addr{font-size:10pt;margin:0;font-weight:bold}.rc-head .title-block .doctype{font-size:13pt;font-weight:bold;letter-spacing:2px;color:#000080;margin-top:6px;text-transform:uppercase;text-decoration:underline}
.rc-head .photo{width:70px;height:85px;border:1.5px solid #800080}
.rc-pupil{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:12px;font-size:11pt;font-weight:bold}.rc-pupil .cell{display:flex;gap:4px;align-items:flex-end}.rc-pupil .val{border-bottom:1px dotted #000;min-width:80px;padding:0 4px;text-align:center;color:#000080}.rc-pupil .cell.w-50{width:calc(50% - 8px)}.rc-pupil .cell.w-full{width:100%}
.rc-section-title{text-align:center;font-weight:bold;font-size:10pt;color:#800080;background:#f8f8f8;border:1px solid #800080;border-bottom:none;padding:3px;text-transform:uppercase}
.rc-table{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:11pt}.rc-table tbody tr:nth-child(even){background:#faf5ff}.rc-table tr.total-row{background:#f3e8ff!important}.rc-summary{border:2px solid #800080;border-radius:10px;padding:10px 12px;margin:10px 0;display:flex;flex-wrap:wrap;gap:8px 22px;font-size:11.5pt}.rc-summary .big{font-size:15pt;font-weight:900;color:#800080}.rc-summary .lbl2{font-size:8.5pt;text-transform:uppercase;color:#64748b;font-weight:700}.rc-note{font-size:9.5pt;color:#475569;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px;margin:6px 0}.rc-table th,.rc-table td{border:1px solid #800080;padding:3px 6px;text-align:center;color:#000}.rc-table th{font-weight:bold;text-transform:uppercase;background:#fff}.rc-table td.subname{text-align:left;font-weight:bold}.rc-table td.sc{color:#000080;font-weight:bold}.rc-table td.grade{color:#800080;font-weight:bold}.rc-table td.agg{color:#800080;font-weight:bold}
.rc-scale{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:9pt}.rc-scale th,.rc-scale td{border:1px solid #800080;text-align:center;padding:3px}
.rc-lines{font-size:10pt;margin-bottom:8px;line-height:1.8}.rc-lines .lbl{font-weight:bold;display:block}.rc-lines .line{border-bottom:1px dotted #000;display:block;min-height:20px}.rc-lines .line.handwriting{font-family:'Comic Sans MS',cursive;color:#000080;font-size:12pt}
.rc-footer{margin-top:auto;display:flex;justify-content:center;padding-top:10px}.rc-illustration{font-size:10pt;font-weight:bold;color:#800080}
@media(max-width:640px){.grid-2,.grid-3{grid-template-columns:1fr}}
@media print{@page{size:A4 portrait;margin:0}body{background:#fff}.topbar,.header,.nav,.no-print,#modalRoot{display:none!important}#app{padding:0!important;max-width:none}.rc-stage{background:#fff;padding:0;margin:0}.rc-page{box-shadow:none;margin:0;page-break-after:always}}
</style><script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script></head><body>
