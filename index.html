<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0a2540"/>
<title>Eudes School Management — Ultimate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--navy:#0a2540;--navy2:#142b4d;--navy3:#1e3a5c;--navy4:#2c5282;--gold:#d4a017;--gold2:#e0a800;--goldsoft:#fef3c7;--bg:#eef2f7;--card:#fff;--line:#e2e8f0;--line2:#eef1f6;--text:#0a2540;--text2:#334155;--muted:#64748b;--ok:#059669;--oksoft:#ecfdf5;--warn:#d97706;--warnsoft:#fffbeb;--bad:#dc2626;--badsoft:#fef2f2;--brandsoft:#e0e9f5;--radius:14px;--radius-lg:20px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:'Inter',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:all .15s}
input,select,textarea{font-family:inherit;width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--text);font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 4px rgba(10,37,64,.1)}
label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:6px;font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line2);font-size:13.5px}
th{color:#fff;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;background:var(--navy)}
tbody tr:hover{background:#f9fafb}
h1{font-size:20px;font-weight:700;margin:0 0 4px;color:var(--navy)}
h3{font-size:15px;font-weight:700;margin:0 0 12px;color:var(--navy)}
.muted{color:var(--muted);font-size:12.5px}
.topbar{position:fixed;top:0;left:0;right:0;height:48px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 12px;z-index:100;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar .title{flex:1;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.03em;color:#fff}
.topbar .icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:16px}
.topbar .icon-btn:hover{background:rgba(255,255,255,.1)}
#app{min-height:100vh;padding-top:48px;padding-bottom:90px;background:var(--bg)}
.container{max-width:1100px;margin:0 auto;padding:0 12px}
.header-wrap{padding:12px}
.header-card{background:linear-gradient(135deg,var(--navy) 0%,var(--navy3) 100%);color:#fff;border-radius:var(--radius-lg);padding:18px;position:relative;box-shadow:0 8px 24px -8px rgba(10,37,64,.4)}
.header-top{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px}
.admin-chip{background:rgba(255,255,255,.15);color:#fff;font-size:10.5px;font-weight:700;padding:4px 12px;border-radius:999px;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(255,255,255,.2)}
.exit-chip{background:#dc2626;color:#fff;font-size:10.5px;font-weight:700;padding:4px 12px;border-radius:999px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.exit-chip:hover{background:#b91c1c}
.header-school{display:flex;align-items:flex-start;gap:10px;font-size:16px;font-weight:800;margin-bottom:8px;line-height:1.2;letter-spacing:-.01em;text-transform:uppercase}
.header-school .logo{width:36px;height:36px;border-radius:10px;background:var(--gold);display:grid;place-items:center;font-size:18px;flex-shrink:0;color:var(--navy)}
.header-school .name{flex:1;padding-top:2px}
.header-meta{font-size:12.5px;color:#cbd5e1;line-height:1.7;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.header-meta .sep{opacity:.5}
.header-datetime{font-size:12.5px;color:#cbd5e1;line-height:1.7;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.header-periods{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.header-period{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;color:#fff}
.header-period select{background:transparent;color:#fff;border:none;padding:0 4px;font-size:12px;font-weight:700;width:auto;cursor:pointer}
.header-period select option{color:var(--navy)}
.term-pill{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#fff;font-size:11px;font-weight:800;padding:5px 14px;border-radius:999px;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 4px 12px -2px rgba(212,160,23,.5)}
.header-search{position:relative}
.header-search input{background:#fff;border:none;border-radius:999px;padding:13px 20px 13px 46px;font-size:13.5px;color:var(--navy);font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.header-search input::placeholder{color:#94a3b8;font-weight:400}
.header-search .si{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:15px;pointer-events:none}
.nav-pills{display:flex;gap:8px;padding:12px 0 4px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth}
.nav-pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;background:#fff;color:var(--navy);font-size:12.5px;font-weight:600;border:1.5px solid var(--line);white-space:nowrap;cursor:pointer}
.pill:hover{background:#f8fafc;border-color:var(--navy)}
.pill.active{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700;box-shadow:0 4px 12px -2px rgba(10,37,64,.4)}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.04);margin-bottom:14px}
.grid{display:grid;gap:12px}
.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
@media(max-width:640px){.grid-2,.grid-3{grid-template-columns:1fr}.grid-kpi{grid-template-columns:1fr 1fr}}
.kpi{background:#fff;border-radius:var(--radius);padding:18px 14px;position:relative;box-shadow:0 2px 8px rgba(15,23,42,.05);border-top:3px solid var(--gold);text-align:center;overflow:hidden}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--navy);line-height:1.15;word-break:break-word}
.kpi .l{color:var(--muted);font-size:11.5px;margin-top:6px;font-weight:500}
.kpi.kpi-ok{border-top-color:var(--ok)}.kpi.kpi-ok .v{color:#065f46}
.kpi.kpi-bad{border-top-color:var(--bad)}.kpi.kpi-bad .v{color:#7f1d1d}
.kpi.kpi-warn{border-top-color:var(--warn)}.kpi.kpi-warn .v{color:#78350f}
.kpi.kpi-navy{border-top-color:var(--navy)}
.kpi.kpi-plain{border-top-color:var(--line)}.kpi.kpi-plain .v{color:var(--text)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--oksoft);color:#047857;border:1px solid #a7f3d0}
.badge.bad{background:var(--badsoft);color:#b91c1c;border:1px solid #fecaca}
.badge.info{background:var(--brandsoft);color:var(--navy);border:1px solid #c7d2fe}
.badge.warn{background:var(--warnsoft);color:#92400e;border:1px solid #fde68a}
.badge.req{background:#e0e7ff;color:#3730a3;border:1px solid #a5b4fc}
.btn{background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer}
.btn:hover{background:var(--navy3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn.ghost:hover{background:#f8fafc;border-color:var(--navy)}
.btn.danger{background:var(--bad)}.btn.danger:hover{background:#b91c1c}
.btn.ok{background:var(--ok)}.btn.ok:hover{background:#047857}
.btn.gold{background:var(--gold)}.btn.gold:hover{background:var(--gold2)}
.btn.sm{padding:6px 12px;font-size:11.5px;border-radius:999px}
.btn.block{width:100%}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:6px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;z-index:1000;font-size:13px;font-weight:500;box-shadow:0 20px 40px -12px rgba(10,37,64,.5);max-width:90vw;text-align:center}
.toast.bad{background:#7f1d1d}.toast.ok{background:#065f46}
.auth-bg{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy) 0%,var(--navy4) 100%);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;overflow:auto}
.auth-card{background:#fff;border-radius:20px;padding:30px 26px;width:100%;max-width:440px;box-shadow:0 40px 80px -20px rgba(0,0,0,.5);margin:auto}
.auth-card .logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,var(--navy),var(--navy4));display:grid;place-items:center;color:var(--gold);font-weight:800;font-size:24px;margin:0 auto 14px}
.auth-card h1{text-align:center;font-size:19px;margin:0 0 6px}
.auth-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}
.tabs{display:flex;background:#f1f5f9;border-radius:999px;padding:4px;margin-bottom:22px}
.tabs button{flex:1;padding:10px;font-size:13.5px;font-weight:600;color:var(--muted);border-radius:999px}
.tabs button.active{background:var(--navy);color:#fff;box-shadow:0 4px 10px rgba(10,37,64,.3)}
.err{background:var(--badsoft);border:1px solid #fecaca;color:#b91c1c;padding:11px 14px;border-radius:10px;margin-top:14px;font-size:13px}
.ok{background:var(--oksoft);border:1px solid #a7f3d0;color:#047857;padding:11px 14px;border-radius:10px;margin-top:14px;font-size:13px}
.loading{padding:60px;text-align:center;color:var(--muted);font-size:14px}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
.modal-bg{position:fixed;inset:0;background:rgba(10,37,64,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0;backdrop-filter:blur(2px)}
@media(min-width:640px){.modal-bg{align-items:center;padding:16px}}
.modal{background:#fff;border-radius:20px 20px 0 0;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 -10px 40px -10px rgba(0,0,0,.3)}
@media(min-width:640px){.modal{border-radius:20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line2);flex-wrap:wrap}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:90;box-shadow:0 -4px 16px rgba(10,37,64,.08)}
.bottom-bar-inner{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:1100px;margin:0 auto}
.bottom-bar-inner::-webkit-scrollbar{display:none}
.bottom-bar .pill{background:var(--navy);color:#fff;border-color:var(--navy);padding:9px 14px;font-size:12px}
.bottom-bar .pill.active{background:var(--gold);border-color:var(--gold);color:#fff}
.bottom-bar .pill:hover{background:var(--navy3)}
.wa-float{position:fixed;bottom:96px;right:16px;background:#25D366;color:#fff;width:52px;height:52px;border-radius:50%;z-index:99;text-decoration:none;box-shadow:0 10px 20px rgba(0,0,0,.25);display:grid;place-items:center;font-size:22px}
.wa-float:hover{background:#20BA5A;color:#fff;transform:scale(1.05)}
@media(max-width:640px){.page-head{flex-direction:column;align-items:stretch}.page-head .btn{width:100%}.kpi .v{font-size:19px}}
.rc-title{text-align:center;font-size:15px;font-weight:800;color:var(--navy);letter-spacing:.05em;text-transform:uppercase;margin:10px 0 6px}
.rc-info{width:100%;border-collapse:collapse;margin:10px 0}
.rc-info td{padding:8px 10px;font-size:12.5px;border:1px solid var(--line)}
.rc-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding:12px;background:#f8fafc;border-radius:10px;border:1px solid var(--line)}
.rc-summary div b{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;margin-bottom:2px;font-weight:600;letter-spacing:.04em}
.rc-summary div{font-size:14px;font-weight:700;color:var(--navy)}
.rc-comment{margin-top:12px;padding:12px;background:var(--warnsoft);border-left:3px solid var(--gold);border-radius:8px;font-size:13px;line-height:1.6}
.rc-sign{display:flex;justify-content:space-between;gap:12px;margin-top:18px;font-size:12px;color:var(--text2);flex-wrap:wrap}
.rc-sign div{flex:1;min-width:150px}
.gc-key{margin-top:12px;padding:10px;background:#f1f5f9;border-radius:8px;font-size:11px;color:var(--muted);line-height:1.6}
.rc-multi th{background:var(--navy);color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:8px 6px}
.rc-multi th .sub{font-size:9px;font-weight:400;opacity:.75;text-transform:none;letter-spacing:0;display:block;margin-top:2px}
.rc-multi td{padding:8px 10px;font-size:12.5px;border:1px solid #e2e8f0}
.rc-multi tfoot td{background:#f1f5f9;font-weight:700;border-top:2px solid #0a2540}
.profile-hero{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;border-radius:16px;padding:20px;margin-bottom:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.profile-hero .avatar{width:64px;height:64px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:26px;font-weight:800;flex-shrink:0}
.profile-hero .info{flex:1;min-width:200px}
.profile-hero .info h1{color:#fff;font-size:20px;margin:0 0 4px}
.profile-hero .info .meta{color:#cbd5e1;font-size:12.5px;line-height:1.6}
.tabs-bar{display:flex;gap:6px;overflow-x:auto;padding:4px 0;border-bottom:2px solid var(--line);margin-bottom:14px;scrollbar-width:none}
.tabs-bar::-webkit-scrollbar{display:none}
.tabs-bar button{flex:0 0 auto;padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs-bar button.active{color:var(--navy);border-bottom-color:var(--gold)}
.mini-stat{display:inline-block;padding:6px 12px;background:#f1f5f9;border-radius:8px;font-size:12px;font-weight:600;color:var(--navy);margin:2px 4px 2px 0}
.tt-grid{display:grid;grid-template-columns:80px repeat(5,1fr);gap:4px;font-size:11.5px;min-width:640px}
.tt-grid>div{padding:8px 6px;background:#fff;border:1px solid var(--line);border-radius:6px;text-align:center}
.tt-grid .tt-head{background:var(--navy);color:#fff;font-weight:700}
.tt-grid .tt-time{background:#f1f5f9;font-weight:700;color:var(--navy)}
.tt-grid .tt-cell{cursor:pointer;min-height:52px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.tt-grid .tt-cell:hover{background:var(--goldsoft);border-color:var(--gold)}
.tt-grid .tt-cell .sub{font-weight:700;color:var(--navy)}
.tt-grid .tt-cell .meta{font-size:10px;color:var(--muted)}
.tt-grid .tt-cell.empty{color:#cbd5e1;font-style:italic}
.palette-bg{position:fixed;inset:0;background:rgba(10,37,64,.7);z-index:2000;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;backdrop-filter:blur(3px)}
.palette{background:#fff;width:92%;max-width:560px;border-radius:14px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.palette input{border:none;border-radius:0;padding:16px 20px;font-size:15px;border-bottom:1px solid var(--line);box-shadow:none}
.palette input:focus{box-shadow:none;border-color:var(--line)}
.palette-results{max-height:56vh;overflow:auto}
.palette-item{padding:12px 20px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13.5px;border-bottom:1px solid var(--line2)}
.palette-item:hover,.palette-item.sel{background:var(--brandsoft)}
.palette-item .k{flex:1}
.palette-item .hint{font-size:11px;color:var(--muted)}
.receipt{background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:20px;font-family:monospace;font-size:12.5px;line-height:1.7;max-width:420px;margin:0 auto}
.receipt .rhead{text-align:center;border-bottom:1px dashed #cbd5e1;padding-bottom:10px;margin-bottom:10px}
.receipt .rrow{display:flex;justify-content:space-between}
.receipt .rtotal{border-top:1px dashed #cbd5e1;margin-top:10px;padding-top:10px;font-weight:700;font-size:14px}
.bulk-bar{position:sticky;top:0;background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:13px;z-index:5}
.bulk-bar b{font-size:13.5px}
.bulk-bar .spacer{flex:1}
.bulk-bar .btn{background:rgba(255,255,255,.15);color:#fff}
.bulk-bar .btn:hover{background:rgba(255,255,255,.25)}
.alert-item{display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;background:#fff;border-left:4px solid var(--gold);margin-bottom:8px;font-size:13px;box-shadow:0 1px 3px rgba(15,23,42,.04);cursor:pointer}
.alert-item.danger{border-left-color:var(--bad)}
.alert-item.ok{border-left-color:var(--ok);cursor:default}
.alert-item.info{border-left-color:var(--navy4)}
.alert-item .ico{font-size:20px}
.alert-item .txt{flex:1}
.alert-item .txt b{display:block;color:var(--navy)}
.alert-item .txt span{color:var(--muted);font-size:12px}
.chk{width:16px;height:16px;accent-color:var(--navy);cursor:pointer}
.term-warn{background:var(--goldsoft);border-left:4px solid var(--gold);padding:10px 14px;border-radius:8px;font-size:12.5px;color:#78350f;margin-bottom:12px}
</style>
</head>

<div class="auth-bg" id="authScreen">
  <div class="auth-card">
    <div class="logo">E</div>

      <button id="tabLogin" class="active" onclick="switchTab('login')">Sign In</button>
      <button id="tabRegister" onclick="switchTab('register')">Register School</button>
    </div>

      <button class="btn block" id="loginBtn" style="padding:13px;margin-top:18px" onclick="doLogin()">Sign In</button>
    </div>
    <div id="registerForm" style="display:none">
      <div><label>Your Full Name</label><input id="regName"></div>
      <div style="margin-top:12px"><label>Email</label><input id="regEmail" type="email"></div>
      <div style="margin-top:12px"><label>Password (min 8 characters)</label><input id="regPass" type="password"></div>
      <h3 style="margin-top:18px;font-size:12px;text-transform:uppercase">School Information</h3>
      <div><label>School Name</label><input id="regSchool"></div>
      <div style="margin-top:12px"><label>Short Name (no spaces)</label><input id="regSlug"></div>
      <div style="margin-top:12px"><label>Address</label><input id="regAddr"></div>
      <div class="grid grid-2" style="margin-top:12px"><div><label>Telephone</label><input id="regPhone"></div><div><label>Head Teacher</label><input id="regHead"></div></div>
      <div style="margin-top:12px"><label>School Motto</label><input id="regMotto"></div>
      <div id="regErr" class="err" style="display:none"></div>
      <div id="regOk" class="ok" style="display:none"></div>
      <button class="btn block" id="regBtn" style="padding:13px;margin-top:18px" onclick="doRegister()">Create School</button>
    </div>

async function rest(path,options){
  options=options||{};
  const headers=Object.assign({'apikey':SUPA_KEY,'Content-Type':'application/json'},options.headers||{});
  const token=getToken();
  headers['Authorization']='Bearer '+(token||SUPA_KEY);
  const res=await fetch(SUPA_URL+path,Object.assign({},options,{headers}));
  const text=await res.text();
  let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok){
    if(res.status===401){setSession(null);alert('Session expired. Please log in again.');window.location.reload();throw new Error('Session expired');}
    throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status));
  }
  return data;
}
async function auth(path,body){
  const res=await fetch(SUPA_URL+path,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const text=await res.text();
  let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok)throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status));

}

function gradeOf(score){
  if(score==null||isNaN(score)||score==='')return{g:'—',r:'—',cls:''};
  const s=Number(score);
  if(s>=90)return{g:'D1',r:'Distinction 1',cls:'ok'};
  if(s>=80)return{g:'D2',r:'Distinction 2',cls:'ok'};
  if(s>=70)return{g:'C3',r:'Credit 3',cls:'ok'};
  if(s>=60)return{g:'C4',r:'Credit 4',cls:'info'};
  if(s>=55)return{g:'C5',r:'Credit 5',cls:'info'};
  if(s>=50)return{g:'C6',r:'Credit 6',cls:'info'};
  if(s>=45)return{g:'P7',r:'Pass 7',cls:'warn'};
  if(s>=40)return{g:'P8',r:'Pass 8',cls:'warn'};
  return{g:'F9',r:'Fail 9',cls:'bad'};
}
function ordinal(n){if(!n)return '—';if(n===1)return '1st';if(n===2)return '2nd';if(n===3)return '3rd';return n+'th';}
function autoComment(avg,firstName){
  const f=firstName||'The pupil';
  if(avg>=90)return 'Outstanding! '+f+' attained Distinction 1. Excellent mastery of all subjects — keep it up.';
  if(avg>=80)return 'Excellent performance. '+f+' attained Distinction 2 and is working very well.';
  if(avg>=70)return 'Very good work. '+f+' attained Credit 3. A little more effort will push to distinction.';
  if(avg>=60)return 'Good performance. '+f+' attained Credit 4. Keep revising to move higher.';
  if(avg>=55)return 'Fair performance. '+f+' attained Credit 5; more effort needed in weaker subjects.';
  if(avg>=50)return 'Satisfactory. '+f+' attained Credit 6. Regular revision will help improve.';
  if(avg>=45)return 'Average performance. '+f+' attained Pass 7. Needs to work harder, especially at home.';
  if(avg>=40)return 'Weak pass. '+f+' attained Pass 8 and requires closer attention and remedial support.';
  return 'Unsatisfactory. '+f+' failed (F9). Immediate intervention, extra lessons and parental support are required.';
}

}

/* ---------- EXAM STAGE ---------- */
function examStageRank(type){
  const t=String(type||'').toLowerCase();
  if(t.includes('begin')||t.includes('bot')||t.includes('open'))return 1;
  if(t.includes('mid')||t.includes('mot'))return 2;
  if(t.includes('end')||t.includes('eot')||t.includes('final'))return 3;
  return 0;
}
function examStageLabel(type){
  const r=examStageRank(type);
  if(r===1)return 'BOT';
  if(r===2)return 'MOT';
  if(r===3)return 'EOT';
  return String(type||'').slice(0,6).toUpperCase()||'EX';
}
function examStageFullLabel(rank){return {1:'Beginning of Term',2:'Mid Term',3:'End of Term',0:'Other'}[rank]||'Other';}
window.examStageRank=examStageRank;window.examStageLabel=examStageLabel;window.examStageFullLabel=examStageFullLabel;

async function bulkFuncCash(){
  const ids=getSelectedIds();
  if(!ids.length){toast('Select pupils first','bad');return;}
  if(!confirm('Mark '+ids.length+' selected pupil(s) as 💵 Paid in Cash?'))return;
  const cy=getCurrentYear(),ct=getCurrentTerm();
  const iso=new Date().toISOString();
  let n=0;
  for(const sid of ids){
    try{
      const st=(await rest('/rest/v1/students?id=eq.'+sid+'&select=functional_fee,functional_fee_paid'))[0];
      if(!st)continue;
      const ff=Number(st.functional_fee)||FUNC_FEE_DEFAULT;
      const fp=Number(st.functional_fee_paid)||0;
      const short=Math.max(0,ff-fp);
      if(short>0){
        await rest('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({
          school_id:_schoolId,student_id:sid,amount:short,payment_for:'Functional Fees',payment_method:'Cash',notes:'Bulk mark paid',paid_at:iso,academic_year:cy,term:ct
        })});
      }
      await rest('/rest/v1/students?id=eq.'+sid,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({functional_fee_status:'cash',functional_fee_paid:ff,functional_fee:ff})});
      n++;
    }catch(e){}
  }
  toast('Marked '+n,'ok');nav('students');
}

    const dup=await checkDuplicateStudent(adm,fn,ln,pc);

  }catch(e){}
  const lin=generateLIN(fn);

let _feesTab='school';

async function pageFees(root){
  const [students,classes,payments]=await Promise.all([
    rest('/rest/v1/students?school_id=eq.'+_schoolId+'&select=*&status=eq.active&order=first_name'),
    rest('/rest/v1/classes?school_id=eq.'+_schoolId+'&select=id,name&order=sort_order'),
    rest('/rest/v1/payments?school_id=eq.'+_schoolId+'&select=*&order=paid_at.desc')
  ]);
  window._allFeeStudents=students||[];
  window._allClassesForFees=classes||[];
  const pbs={};
  (payments||[]).forEach(p=>{
    if(!pbs[p.student_id])pbs[p.student_id]={school:0,func:0,termSchool:0,termFunc:0};
    const isThis=termIsCurrent(p);
    if(p.payment_for==='Functional Fees'){
      pbs[p.student_id].func+=Number(p.amount);
      if(isThis)pbs[p.student_id].termFunc+=Number(p.amount);
    } else {
      pbs[p.student_id].school+=Number(p.amount);
      if(isThis)pbs[p.student_id].termSchool+=Number(p.amount);
    }
  });
  window._paidByStudentFees=pbs;

  let te=0,tc=0,tfe=0,tfc=0,termTc=0,termTfc=0;
  let funcCashCount=0,funcPendingCount=0,funcReqCount=0,funcPartialCount=0;
  (students||[]).forEach(s=>{
    const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);
    const ff=Number(s.functional_fee)||FUNC_FEE_DEFAULT;
    const p=pbs[s.id]||{school:0,func:0,termSchool:0,termFunc:0};
    const funcPaid=Math.max(Number(s.functional_fee_paid)||0,p.func||0);
    te+=sf;tc+=p.school;tfe+=ff;tfc+=funcPaid;
    termTc+=p.termSchool;termTfc+=p.termFunc;
    const st=s.functional_fee_status||'pending';
    if(st==='cash')funcCashCount++;
    else if(st==='requirements')funcReqCount++;
    else {if(funcPaid>0)funcPartialCount++;else funcPendingCount++;}
  });
  const to=te-tc;
  const funcExpected=students.length*FUNC_FEE_DEFAULT;

  root.innerHTML=
  '<div class="page-head"><div><h1>💰 Fees Management</h1><div class="sub">'+termLabel()+'</div></div>'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
  '<button class="btn ghost" onclick="printFeesList()">🖨️ Print</button>'+
  '<button class="btn ghost" onclick="exportFeesToExcel()">📥 Excel</button>'+
  '</div></div>'+

  '<div class="card" style="padding:6px"><div style="display:flex;gap:6px;flex-wrap:wrap">'+
  '<button class="pill'+(_feesTab==='school'?' active':'')+'" onclick="_feesTab=\'school\';nav(\'fees\')">📚 School Fees</button>'+
  '<button class="pill'+(_feesTab==='func'?' active':'')+'" onclick="_feesTab=\'func\';nav(\'fees\')">🧾 Functional Fee</button>'+
  '</div></div>'+

  (_feesTab==='school'
    ? '<div class="grid grid-kpi" style="margin-bottom:14px">'+
      '<div class="kpi kpi-ok"><div class="v">'+fmtUGX(te)+'</div><div class="l">Total Expected</div></div>'+
      '<div class="kpi kpi-navy"><div class="v">'+fmtUGX(termTc)+'</div><div class="l">This Term</div></div>'+
      '<div class="kpi kpi-navy"><div class="v">'+fmtUGX(tc)+'</div><div class="l">All-Time Collected</div></div>'+
      '<div class="kpi kpi-bad"><div class="v">'+fmtUGX(to)+'</div><div class="l">Outstanding</div></div>'+
      '</div>'
    : '<div class="grid grid-kpi" style="margin-bottom:14px">'+
      '<div class="kpi kpi-navy"><div class="v">'+fmtUGX(funcExpected)+'</div><div class="l">Expected</div></div>'+
      '<div class="kpi kpi-ok"><div class="v">'+fmtUGX(tfc)+'</div><div class="l">All-Time Collected</div></div>'+
      '<div class="kpi kpi-bad"><div class="v">'+fmtUGX(Math.max(0,funcExpected-tfc))+'</div><div class="l">Shortfall</div></div>'+
      '<div class="kpi kpi-ok"><div class="v">'+funcCashCount+'</div><div class="l">💵 Paid in Full</div></div>'+
      '<div class="kpi kpi-warn"><div class="v">'+(funcPartialCount+funcReqCount)+'</div><div class="l">📦 Req / Partial</div></div>'+
      '<div class="kpi kpi-bad"><div class="v">'+funcPendingCount+'</div><div class="l">⏳ Not Paid</div></div>'+
      '</div>')+

  '<div class="card"><div class="grid grid-3" style="margin-bottom:14px">'+
  '<div><label>Class</label><select id="feesClassFilter" onchange="filterFeesTable()"><option value="">All classes</option>'+
  classes.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></div>'+
  (_feesTab==='school'
    ? '<div><label>Show</label><select id="feesOwingFilter" onchange="filterFeesTable()">'+
      '<option value="all">All pupils</option><option value="owing">Owing</option><option value="paid">Fully paid</option></select></div>'
    : '<div><label>Status</label><select id="feesOwingFilter" onchange="filterFeesTable()">'+
      '<option value="all">All pupils</option><option value="cash">💵 Paid in cash</option>'+
      '<option value="requirements">📦 Requirements</option><option value="pending">⏳ Not paid</option>'+
      '<option value="partial">🟡 Partial</option></select></div>')+
  '<div style="display:flex;align-items:flex-end;gap:8px">'+
  '<button class="btn ghost" style="flex:1" onclick="resetFeesFilters()">🔄 Reset</button>'+
  (_feesTab==='func'?'<button class="btn gold" style="flex:1" onclick="bulkMarkFuncPaid()">💵 Bulk Mark Paid</button>':'')+
  '</div></div>'+
  '<div id="feesTableContainer"></div></div>';
  filterFeesTable();
}

function filterFeesTable(){
  const fc=document.getElementById('feesClassFilter')?.value||'';
  const m=document.getElementById('feesOwingFilter')?.value||'all';
  const paid=window._paidByStudentFees||{};
  const tab=_feesTab;

  let list=(window._allFeeStudents||[]).slice();
  if(fc) list=list.filter(s=>s.class_id===fc);

  if(tab==='school'){
    if(m==='owing')list=list.filter(s=>{const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);return (sf-((paid[s.id]||{school:0}).school))>0;});
    if(m==='paid')list=list.filter(s=>{const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);return (sf-((paid[s.id]||{school:0}).school))<=0;});
  } else {
    const statusOf=s=>{
      const st=s.functional_fee_status||'pending';
      const fp=Math.max(Number(s.functional_fee_paid)||0,(paid[s.id]||{func:0}).func||0);
      if(st==='pending'&&fp>0)return 'partial';
      return st;
    };
    if(m!=='all')list=list.filter(s=>statusOf(s)===m);
  }

  const classOrder={};(window._allClassesForFees||[]).forEach((c,i)=>{classOrder[c.id]=i;});
  list.sort((a,b)=>{
    const ca=classOrder[a.class_id]??999,cb=classOrder[b.class_id]??999;
    if(ca!==cb)return ca-cb;
    return (a.first_name||'').localeCompare(b.first_name||'');
  });

  const c=document.getElementById('feesTableContainer');
  if(!list.length){c.innerHTML='<div class="empty">No pupils match.</div>';return;}

  if(tab==='school'){
    c.innerHTML='<div class="table-wrap"><table><thead><tr>'+
    '<th>Adm No</th><th>Name</th><th>Class</th>'+
    '<th style="text-align:right">Expected</th>'+
    '<th style="text-align:right">This Term</th>'+
    '<th style="text-align:right">All-Time</th>'+
    '<th style="text-align:right">Balance</th>'+
    '<th>🧾 Func.</th>'+
    '<th style="text-align:right">Actions</th>'+
    '</tr></thead><tbody>'+
    list.map(s=>{
      const cls=(window._allClassesForFees||[]).find(c=>c.id===s.class_id);
      const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);
      const p=paid[s.id]||{school:0,termSchool:0};
      const bal=sf-p.school;
      const funcPaid=Math.max(Number(s.functional_fee_paid)||0,(paid[s.id]||{func:0}).func||0);
      const funcBadge=functionalStatusBadge(s.functional_fee_status)+(funcPaid>0?' <span class="muted" style="font-size:10px">'+funcPaid.toLocaleString()+'</span>':'');
      return '<tr><td><b>'+esc(s.admission_no)+'</b></td>'+
      '<td>'+esc(s.first_name+' '+(s.last_name||''))+'</td>'+
      '<td><span class="badge info">'+esc(cls?cls.name:'—')+'</span></td>'+
      '<td style="text-align:right">'+sf.toLocaleString()+'</td>'+
      '<td style="text-align:right;color:var(--navy);font-weight:600">'+p.termSchool.toLocaleString()+'</td>'+
      '<td style="text-align:right;color:#047857;font-weight:600">'+p.school.toLocaleString()+'</td>'+
      '<td style="text-align:right"><span class="badge '+(bal>0?'bad':'ok')+'">'+bal.toLocaleString()+'</span></td>'+
      '<td>'+funcBadge+'</td>'+
      '<td style="text-align:right;white-space:nowrap">'+
      '<button class="btn sm" onclick="recordPayment(\''+s.id+'\')">💵</button> '+
      '<button class="btn sm gold" onclick="recordPayment(\''+s.id+'\',\'Functional Fees\')">🧾</button> '+
      '<button class="btn sm ghost" onclick="viewPaymentHistory(\''+s.id+'\')">📋</button>'+
      '</td></tr>';
    }).join('')+'</tbody></table></div>';
  } else {
    c.innerHTML='<div class="table-wrap"><table><thead><tr>'+
    '<th>Adm No</th><th>Name</th><th>Class</th>'+
    '<th style="text-align:right">Expected</th>'+
    '<th style="text-align:right">Paid</th>'+
    '<th style="text-align:right">Shortfall</th>'+
    '<th>Status</th>'+
    '<th style="text-align:right">Actions</th>'+
    '</tr></thead><tbody>'+
    list.map(s=>{
      const cls=(window._allClassesForFees||[]).find(c=>c.id===s.class_id);
      const expected=Number(s.functional_fee)||FUNC_FEE_DEFAULT;
      const paidAmt=Math.max(Number(s.functional_fee_paid)||0,(paid[s.id]||{func:0}).func||0);
      const short=Math.max(0,expected-paidAmt);
      const stRaw=s.functional_fee_status||'pending';
      const st=(stRaw==='pending'&&paidAmt>0)?'partial':stRaw;
      const stBadge=st==='partial'?'<span class="badge warn">🟡 Partial</span>':functionalStatusBadge(st);
      return '<tr>'+
      '<td><b>'+esc(s.admission_no)+'</b></td>'+
      '<td>'+esc(s.first_name+' '+(s.last_name||''))+'</td>'+
      '<td><span class="badge info">'+esc(cls?cls.name:'—')+'</span></td>'+
      '<td style="text-align:right">'+expected.toLocaleString()+'</td>'+
      '<td style="text-align:right;color:#047857;font-weight:600">'+paidAmt.toLocaleString()+'</td>'+
      '<td style="text-align:right"><span class="badge '+(short>0?'bad':'ok')+'">'+short.toLocaleString()+'</span></td>'+
      '<td>'+stBadge+'</td>'+
      '<td style="text-align:right;white-space:nowrap">'+
      '<button class="btn sm gold" onclick="recordPayment(\''+s.id+'\',\'Functional Fees\')">💵 Pay</button> '+
      '<button class="btn sm ghost" onclick="markFunc(\''+s.id+'\',\''+esc(s.first_name+' '+(s.last_name||''))+'\',\''+expected+'\',\''+stRaw+'\')">🧾</button>'+
      '</td></tr>';
    }).join('')+'</tbody></table></div>';
  }
}
window.filterFeesTable=filterFeesTable;

async function bulkMarkFuncPaid(){
  const list=(window._allFeeStudents||[]).filter(s=>{
    const st=s.functional_fee_status||'pending';
    return st!=='cash'&&st!=='requirements';
  });
  if(!list.length){toast('Everyone already paid or on requirements','ok');return;}
  if(!confirm('Mark '+list.length+' pupil(s) as 💵 Paid in Cash and record the payment?'))return;
  const cy=getCurrentYear(),ct=getCurrentTerm();
  const iso=new Date().toISOString();
  let n=0;
  for(const s of list){
    try{
      const ff=Number(s.functional_fee)||FUNC_FEE_DEFAULT;
      const fp=Number(s.functional_fee_paid)||0;
      const short=Math.max(0,ff-fp);
      if(short>0){
        await rest('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({
          school_id:_schoolId,student_id:s.id,amount:short,payment_for:'Functional Fees',
          payment_method:'Cash',notes:'Bulk mark paid',paid_at:iso,academic_year:cy,term:ct
        })});
      }
      await rest('/rest/v1/students?id=eq.'+s.id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({functional_fee_status:'cash',functional_fee_paid:ff,functional_fee:ff})});
      n++;
    }catch(e){}
  }
  toast('Marked '+n+' pupils','ok');
  nav('fees');
}
window.bulkMarkFuncPaid=bulkMarkFuncPaid;

function exportFeesToExcel(){
  const list=window._allFeeStudents||[];const paid=window._paidByStudentFees||{};const classes=window._allClassesForFees||[];
  if(!list.length){toast('No data','bad');return;}
  const data=list.map(s=>{
    const cls=classes.find(c=>c.id===s.class_id);
    const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);
    const p=paid[s.id]||{school:0,termSchool:0};
    const funcPaid=Math.max(Number(s.functional_fee_paid)||0,(paid[s.id]||{func:0}).func||0);
    return{
      'Adm No':s.admission_no,
      'Name':s.first_name+' '+(s.last_name||''),
      'Class':cls?cls.name:'',
      'Expected':sf,
      'This Term':p.termSchool,
      'All-Time Paid':p.school,
      'Balance':sf-p.school,
      'Func Expected':Number(s.functional_fee)||FUNC_FEE_DEFAULT,
      'Func Paid':funcPaid,
      'Func Shortfall':Math.max(0,(Number(s.functional_fee)||FUNC_FEE_DEFAULT)-funcPaid),
      'Func Status':s.functional_fee_status||'pending'
    };
  });
  const ws=XLSX.utils.json_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Fees');
  XLSX.writeFile(wb,'Fees_'+termLabel().replace(/\s/g,'_')+'_'+new Date().toISOString().slice(0,10)+'.xlsx');toast('Exported','ok');
}
window.exportFeesToExcel=exportFeesToExcel;

async function recordPayment(id,preselectFor){
  const [st,pays]=await Promise.all([
    rest('/rest/v1/students?id=eq.'+id+'&select=*'),
    rest('/rest/v1/payments?student_id=eq.'+id+'&select=amount,payment_for')
  ]);
  const s=st[0];if(!s)return;
  const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);
  const ff=Number(s.functional_fee)||FUNC_FEE_DEFAULT;
  const sp=pays.filter(p=>p.payment_for!=='Functional Fees').reduce((sum,p)=>sum+Number(p.amount),0);
  const fp=pays.filter(p=>p.payment_for==='Functional Fees').reduce((sum,p)=>sum+Number(p.amount),0);
  const funcPaid=Math.max(fp,Number(s.functional_fee_paid)||0);
  const bal=sf-sp;
  const funcShort=Math.max(0,ff-funcPaid);

  const now=new Date();const tz=now.getTimezoneOffset()*60000;
  const l=new Date(now-tz).toISOString().slice(0,16);
  const defaultAmt=preselectFor==='Functional Fees'?(funcShort>0?funcShort:''):(bal>0?bal:'');

  modal('<h3>💵 Record Payment — '+esc(s.first_name+' '+(s.last_name||''))+'</h3>'+
  '<div style="background:var(--brandsoft);padding:12px;border-radius:10px;margin-bottom:16px;font-size:13px;line-height:1.9">'+
  '<div>📚 <b>School fees balance:</b> '+fmtUGX(bal)+'</div>'+
  '<div>🧾 <b>Functional fee:</b> '+functionalStatusBadge(s.functional_fee_status)+
  ' — paid '+fmtUGX(funcPaid)+' of '+fmtUGX(ff)+
  (funcShort>0?' <b style="color:#b91c1c">(short '+fmtUGX(funcShort)+')</b>':' <b style="color:#047857">✓</b>')+
  '</div>'+
  '<div style="color:var(--navy)">📅 Tagging to: <b>'+termLabel()+'</b></div></div>'+
  '<div class="grid grid-2">'+
  '<div><label>Payment for *</label><select id="p_for" onchange="onPaymentForChange()">'+
  '<option value="School Fees"'+(preselectFor!=='Functional Fees'?' selected':'')+'>📚 School Fees</option>'+
  '<option value="Functional Fees"'+(preselectFor==='Functional Fees'?' selected':'')+'>🧾 Functional Fees</option>'+
  '</select></div>'+
  '<div><label>Amount (UGX) *</label><input id="p_amount" type="number" value="'+defaultAmt+'"></div>'+
  '<div><label>Method *</label><select id="p_method" onchange="toggleTxn()">'+
  '<option value="Cash">💵 Cash</option>'+
  '<option value="Mobile Money">📱 Mobile Money</option>'+
  '<option value="Bank">🏦 Bank</option>'+
  '<option value="Cheque">📝 Cheque</option>'+
  '</select></div>'+
  '<div><label>Date & time *</label><input id="p_date" type="datetime-local" value="'+l+'"></div>'+
  '<div id="txnIdField" style="display:none"><label>Transaction ID *</label><input id="p_txn"></div>'+
  '<div><label>Notes</label><input id="p_notes"></div>'+
  '</div>'+
  '<div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button>'+
  '<button class="btn ok" onclick="savePayment(\''+id+'\')">💾 Save payment</button></div>');

  window._funcShort=funcShort;
  window._schoolBal=bal;
}
window.recordPayment=recordPayment;

function onPaymentForChange(){
  const pf=document.getElementById('p_for').value;
  const amt=document.getElementById('p_amount');
  if(pf==='Functional Fees'&&window._funcShort>0)amt.value=window._funcShort;
  else if(pf==='School Fees'&&window._schoolBal>0)amt.value=window._schoolBal;
}
window.onPaymentForChange=onPaymentForChange;

function toggleTxn(){
  const m=document.getElementById('p_method').value;
  const f=document.getElementById('txnIdField');
  if(m==='Cash'){f.style.display='none';const t=document.getElementById('p_txn');if(t)t.value='';}
  else f.style.display='block';
}
window.toggleTxn=toggleTxn;

async function savePayment(id){
  const pf=document.getElementById('p_for').value;
  const amt=parseFloat(document.getElementById('p_amount').value);
  const method=document.getElementById('p_method').value;
  const txn=(document.getElementById('p_txn')?.value||'').trim();
  const dv=document.getElementById('p_date').value;
  const nt=document.getElementById('p_notes').value.trim();
  if(!amt||amt<=0){toast('Invalid amount','bad');return;}
  if(method!=='Cash'&&!txn){toast('Transaction ID required','bad');return;}
  if(!dv){toast('Select date','bad');return;}
  try{
    await rest('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({
      school_id:_schoolId,student_id:id,amount:amt,payment_for:pf,
      payment_method:method,transaction_id:txn||null,notes:nt||null,
      paid_at:new Date(dv).toISOString(),
      academic_year:getCurrentYear(),term:getCurrentTerm()
    })});
    const [st,pays]=await Promise.all([
      rest('/rest/v1/students?id=eq.'+id+'&select=total_expected,functional_fee,functional_fee_status'),
      rest('/rest/v1/payments?student_id=eq.'+id+'&select=amount,payment_for')
    ]);
    const te=Number(st[0].total_expected)||0;
    const ff=Number(st[0].functional_fee)||FUNC_FEE_DEFAULT;
    const sp=pays.filter(p=>p.payment_for!=='Functional Fees').reduce((s,p)=>s+Number(p.amount),0);
    const fp=pays.filter(p=>p.payment_for==='Functional Fees').reduce((s,p)=>s+Number(p.amount),0);

    const upd={current_balance:Math.max(0,te-sp),functional_fee_paid:fp,functional_fee:ff};
    const curStatus=st[0].functional_fee_status||'pending';
    if(curStatus!=='requirements'){
      if(fp>=ff) upd.functional_fee_status='cash';
      else upd.functional_fee_status='pending';
    }
    await rest('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(upd)});
    toast('Payment saved · '+fmtUGX(amt),'ok');
    closeModal();nav(activeRoute);
  }catch(e){toast(e.message,'bad');}
}
window.savePayment=savePayment;

async function saveAttendance(){
  const fClass=window._attClass||(await loadClasses())[0]?.id;
  const fDate=window._attDate||new Date().toISOString().slice(0,10);
  const rows=[];
  document.querySelectorAll('.att-select').forEach(sel=>{
    if(sel.value==='')return;
    rows.push({school_id:_schoolId,student_id:sel.dataset.student,class_id:fClass,status:sel.value,date:fDate,academic_year:getCurrentYear(),term:getCurrentTerm()});
  });
  if(!rows.length){toast('No statuses selected','bad');return;}
  try{
    await rest('/rest/v1/attendance?school_id=eq.'+_schoolId+'&class_id=eq.'+fClass+'&date=eq.'+fDate,{method:'DELETE'});
    await rest('/rest/v1/attendance',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(rows)});
    toast('Saved '+rows.length+' records for '+termLabel(),'ok');nav('attendance');
  }catch(e){toast(e.message,'bad');}
}
window.saveAttendance=saveAttendance;

async function pageDebtors(root){
  const [students,classes,payments]=await Promise.all([
    rest('/rest/v1/students?school_id=eq.'+_schoolId+'&select=*&status=eq.active&order=first_name'),
    rest('/rest/v1/classes?school_id=eq.'+_schoolId+'&select=id,name&order=sort_order'),
    rest('/rest/v1/payments?school_id=eq.'+_schoolId+'&select=student_id,amount,payment_for')
  ]);
  const pbs={};
  (payments||[]).forEach(p=>{if(!pbs[p.student_id])pbs[p.student_id]=0;if(p.payment_for!=='Functional Fees')pbs[p.student_id]+=Number(p.amount);});
  const debtors=(students||[]).filter(s=>{const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);return (sf-(pbs[s.id]||0))>0;})
    .map(s=>{const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);return{...s,owed:sf-(pbs[s.id]||0)};})
    .sort((a,b)=>b.owed-a.owed);
  const total=debtors.reduce((s,x)=>s+x.owed,0);
  window._debtorsCache={debtors,classes};
  root.innerHTML=
  '<div class="page-head"><div><h1>📋 Debtors</h1><div class="sub">'+debtors.length+' pupils · '+fmtUGX(total)+' · cumulative (all terms)</div></div><button class="btn ghost" onclick="printDebtors()">🖨️ Print</button></div>'+
  '<div class="card">'+(debtors.length?'<div class="table-wrap"><table><thead><tr><th>#</th><th>Adm No</th><th>Name</th><th>Class</th><th>Parent</th><th>Contact</th><th style="text-align:right">Owed</th><th></th></tr></thead><tbody>'+
  debtors.map((s,i)=>{
    const cls=classes.find(c=>c.id===s.class_id);
    return '<tr><td>'+(i+1)+'</td><td><b>'+esc(s.admission_no)+'</b></td><td><b>'+esc(s.first_name+' '+(s.last_name||''))+'</b></td><td><span class="badge info">'+esc(cls?cls.name:'—')+'</span></td><td>'+esc(s.parent_name||'—')+'</td><td>'+esc(s.parent_contact||'—')+'</td><td style="text-align:right"><span class="badge bad">'+s.owed.toLocaleString()+'</span></td><td><button class="btn sm" onclick="recordPayment(\''+s.id+'\')">💵</button></td></tr>';
  }).join('')+'</tbody></table></div>':'<div class="empty">🎉 No debtors!</div>')+'</div>';
}
window.pageDebtors=pageDebtors;

function printDebtors(){
  const c=window._debtorsCache;
  if(!c||!c.debtors.length){toast('No data','bad');return;}
  const rows=c.debtors.map((s,i)=>{
    const cls=c.classes.find(x=>x.id===s.class_id);
    return '<tr><td>'+(i+1)+'</td><td>'+esc(s.admission_no)+'</td><td><b>'+esc(s.first_name+' '+(s.last_name||''))+'</b></td><td>'+esc(cls?cls.name:'—')+'</td><td>'+esc(s.parent_name||'')+'</td><td>'+esc(s.parent_contact||'')+'</td><td style="text-align:right;color:#b91c1c;font-weight:700">'+s.owed.toLocaleString()+'</td></tr>';
  }).join('');
  const tot=c.debtors.reduce((s,x)=>s+x.owed,0);
  printHTML('Debtors Report','<div class="summary"><div><b>Total Debtors</b>'+c.debtors.length+'</div><div><b>Total Owed</b>UGX '+tot.toLocaleString()+'</div></div><table><thead><tr><th>#</th><th>Adm No</th><th>Name</th><th>Class</th><th>Parent</th><th>Contact</th><th style="text-align:right">Owed</th></tr></thead><tbody>'+rows+'</tbody></table>');
}
window.printDebtors=printDebtors;

function onUniformCategoryChange(){
  const cat=document.getElementById('us_cat').value;
  const items=(window._uniformItems||[]).filter(i=>(i.category||'Other')===cat);
  const sel=document.getElementById('us_item');
  if(!items.length){sel.innerHTML='<option value="">— No items —</option>';document.getElementById('us_price').value=0;document.getElementById('us_total').value=0;return;}
  sel.innerHTML=items.map(i=>'<option value="'+i.id+'" data-price="'+(Number(i.selling_price)||0)+'">'+esc(i.name)+(i.size?' ('+esc(i.size)+')':'')+' — '+Number(i.current_stock)+' in stock</option>').join('');
  if(window._usPreselectItemId&&items.some(i=>i.id===window._usPreselectItemId)){sel.value=window._usPreselectItemId;window._usPreselectItemId=null;}
  const opt=sel.options[sel.selectedIndex];
  document.getElementById('us_price').value=opt?(parseFloat(opt.getAttribute('data-price'))||0):0;
  updateUniformSaleTotal();
}

function filterUniformStudents(q){

  const list=window._uniformStudents||[];
  const f=list.filter(x=>(x.first_name+' '+(x.last_name||'')+' '+x.admission_no).toLowerCase().indexOf(q)!==-1);
  const sel=document.getElementById('us_student');
  if(!sel)return;
  sel.innerHTML=f.length?f.map(s=>'<option value="'+s.id+'">'+esc(s.first_name+' '+(s.last_name||'')+' — '+s.admission_no)+'</option>').join(''):'<option value="">— No match —</option>';

  '<div class="card" style="overflow-x:auto">'+grid+'</div>';
}

async function sendBulkSMS(){
  const target=document.getElementById('bm_target').value;
  const body=document.getElementById('bm_body').value.trim();
  if(!body){toast('Enter message','bad');return;}
  let recipients=(window._msgStudents||[]).filter(s=>s.parent_contact);
  if(target==='debtors'){
    const payments=await rest('/rest/v1/payments?school_id=eq.'+_schoolId+'&select=student_id,amount,payment_for');
    const pbs={};
    payments.forEach(p=>{if(p.payment_for!=='Functional Fees')pbs[p.student_id]=(pbs[p.student_id]||0)+Number(p.amount);});
    const all=window._allStudents||[];
    recipients=recipients.filter(s=>{
      const full=all.find(a=>a.id===s.id);
      if(!full)return false;
      const sf=(Number(full.balance_bf)||0)+(Number(full.actual_fee)||0)+(Number(full.transport_fee)||0);
      return sf-(pbs[s.id]||0)>0;
    });
  } else if(target==='func'){
    const all=window._allStudents||[];
    recipients=recipients.filter(s=>{
      const full=all.find(a=>a.id===s.id);
      return full&&(full.functional_fee_status||'pending')==='pending';
    });
  }
  if(!recipients.length){toast('No recipients','bad');return;}
  const rows=recipients.map(s=>({school_id:_schoolId,student_id:s.id,recipient_name:s.parent_name||'',recipient_phone:s.parent_contact,recipient_type:'parent',body,channel:'sms',academic_year:getCurrentYear(),term:getCurrentTerm()}));
  try{
    for(let i=0;i<rows.length;i+=50)await rest('/rest/v1/messages',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify(rows.slice(i,i+50))});
    toast('Queued '+rows.length,'ok');closeModal();nav('messages');
  }catch(e){toast(e.message,'bad');}
}
window.sendBulkSMS=sendBulkSMS;

async function applyFeeStructure(){
  const year=window._fsYear||getCurrentYear();
  const term=window._fsTerm||getCurrentTerm();
  if(!confirm('Apply fee structure to all active pupils for '+year+' Term '+term+'?'))return;
  const [structs,students]=await Promise.all([
    rest('/rest/v1/fee_structures?school_id=eq.'+_schoolId+'&year=eq.'+year+'&term=eq.'+term+'&select=*'),
    rest('/rest/v1/students?school_id=eq.'+_schoolId+'&status=eq.active&select=id,class_id,boarding_status')
  ]);
  if(!structs.length){toast('No structures set','bad');return;}
  let n=0;
  for(const s of students){
    const bs=s.boarding_status||'Day';
    const st=structs.find(x=>x.class_id===s.class_id&&(x.boarding_status===bs||x.boarding_status===null));
    if(!st)continue;
    const tot=Number(st.tuition)+Number(st.transport_fee)+Number(st.other_fee||0);
    await rest('/rest/v1/students?id=eq.'+s.id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({actual_fee:Number(st.tuition)+Number(st.other_fee||0),transport_fee:Number(st.transport_fee),functional_fee:Number(st.functional_fee),total_expected:tot,current_balance:tot})});
    n++;
  }
  toast('Applied to '+n+' pupils','ok');
}

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
function openPalette(){
  if(document.querySelector('.palette-bg'))return;
  const div=document.createElement('div');div.className='palette-bg';
  div.innerHTML='<div class="palette"><input id="paletteInput" placeholder="Search pupils or type a command…" autofocus><div class="palette-results" id="paletteResults"></div></div>';
  document.body.appendChild(div);
  div.onclick=e=>{if(e.target===div)div.remove();};
  const inp=document.getElementById('paletteInput');
  inp.focus();
  inp.oninput=()=>runPalette(inp.value);
  inp.onkeydown=e=>{
    if(e.key==='Escape')div.remove();
    if(e.key==='Enter'){const sel=document.querySelector('.palette-item.sel')||document.querySelector('.palette-item');if(sel)sel.click();}
  };
  runPalette('');
}
window.openPalette=openPalette;

function runPalette(q){
  const res=document.getElementById('paletteResults');if(!res)return;
  q=(q||'').toLowerCase();
  const items=[];
  Object.entries(ROUTES).forEach(([k,r])=>{
    if(k==='student_profile')return;
    if(q&&r.label.toLowerCase().indexOf(q)===-1&&k.indexOf(q)===-1)return;
    items.push({icon:r.icon,label:r.label,hint:'Page',run:()=>{closePalette();nav(k);}});
  });
  const students=window._allStudents||[];
  if(q&&q.length>=2){
    students.filter(s=>(s.first_name+' '+(s.last_name||'')+' '+s.admission_no).toLowerCase().indexOf(q)!==-1).slice(0,8).forEach(s=>{
      items.push({icon:'👤',label:s.first_name+' '+(s.last_name||''),hint:'Adm '+s.admission_no,run:()=>{closePalette();openProfile(s.id);}});
    });
  }
  if(!items.length){res.innerHTML='<div class="palette-item">No results</div>';return;}
  res.innerHTML=items.slice(0,20).map((it,i)=>'<div class="palette-item'+(i===0?' sel':'')+'" data-idx="'+i+'"><span style="font-size:18px">'+it.icon+'</span><div class="k">'+esc(it.label)+'</div><div class="hint">'+esc(it.hint)+'</div></div>').join('');
  res.querySelectorAll('.palette-item').forEach(el=>{
    el.onclick=()=>items[parseInt(el.dataset.idx)].run();
    el.onmouseenter=()=>{res.querySelectorAll('.palette-item').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');};
  });
}
window.runPalette=runPalette;
function closePalette(){const p=document.querySelector('.palette-bg');if(p)p.remove();}
window.closePalette=closePalette;

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();openPalette();}
  if(e.key==='Escape')closePalette();
});

function buildReportCardBody(student,rd){
  const {exams,cls,subjects,marksByStudent,classAvgPct,classSize,attMap,rankMap,year,term,stageLabel}=rd;
  const perExam=marksByStudent[student.id]||{};
  let grandTotal=0,assessCount=0;
  const subjectRows=subjects.map(s=>{
    const scores=exams.map(e=>{
      const sc=perExam[e.id]?.[s.id];
      if(sc!=null&&!isNaN(sc)){grandTotal+=Number(sc);assessCount++;}
      return sc!=null&&!isNaN(sc)?Number(sc):null;
    });
    return {subject:s,scores};
  });
  const avg=assessCount?grandTotal/assessCount:0;
  const pos=rankMap[student.id];
  const att=attMap[student.id]||{present:0,absent:0,total:0};
  const attPct=att.total?((att.present/att.total)*100).toFixed(0):'—';
  const g=gradeOf(avg);
  const comment=autoComment(avg,student.first_name);
  const stageTitle=stageLabel?stageLabel+' Report Card':'Terminal Report Card';
  let html='';
  html+='<div class="rc-title">'+esc(stageTitle)+'</div>';
  html+='<table class="rc-info"><tr><td><b>Name:</b> '+esc(student.first_name+' '+(student.last_name||''))+'</td><td><b>Adm No:</b> '+esc(student.admission_no)+'</td><td><b>LIN:</b> '+esc(student.lin||'—')+'</td></tr>'+
  '<tr><td><b>Class:</b> '+esc(cls.name)+'</td><td><b>Year:</b> '+year+'</td><td><b>Term:</b> '+term+'</td></tr></table>';
  html+='<table class="rc-multi"><thead><tr><th>#</th><th>Subject</th>';
  exams.forEach(e=>{html+='<th>'+esc(examStageLabel(e.type))+'<span class="sub">'+esc(e.name)+'</span></th>';});
  html+='<th>Total</th><th>Grade</th><th>Remark</th></tr></thead><tbody>';
  subjectRows.forEach((r,i)=>{
    const valid=r.scores.filter(v=>v!=null);
    const subTotal=valid.reduce((a,b)=>a+b,0);
    const subAvg=valid.length?subTotal/valid.length:0;
    const sg=gradeOf(subAvg);
    html+='<tr><td>'+(i+1)+'</td><td>'+esc(r.subject.name)+'</td>';
    r.scores.forEach(v=>{html+='<td style="text-align:center">'+(v!=null?v.toFixed(0):'—')+'</td>';});
    html+='<td style="text-align:right;font-weight:600">'+(valid.length?subTotal.toFixed(0):'—')+'</td>';
    html+='<td style="text-align:center"><b>'+sg.g+'</b></td>';
    html+='<td>'+esc(valid.length?sg.r:'—')+'</td></tr>';
  });
  html+='</tbody><tfoot><tr><td colspan="2">GRAND TOTAL</td>';
  exams.forEach(e=>{
    const examTotal=subjects.reduce((sum,sj)=>{const sc=perExam[e.id]?.[sj.id];return sum+(sc!=null&&!isNaN(sc)?Number(sc):0);},0);
    const hasAny=subjects.some(sj=>perExam[e.id]?.[sj.id]!=null);
    html+='<td style="text-align:center">'+(hasAny?examTotal.toFixed(0):'—')+'</td>';
  });
  html+='<td style="text-align:right">'+grandTotal.toFixed(0)+'</td><td style="text-align:center">'+g.g+'</td><td>Avg: '+avg.toFixed(1)+'%</td></tr></tfoot></table>';
  html+='<div class="rc-summary">'+
  '<div><b>Total Marks</b>'+grandTotal.toFixed(0)+'</div>'+
  '<div><b>Average</b>'+avg.toFixed(1)+'%</div>'+
  '<div><b>Position</b>'+(pos?ordinal(pos)+' / '+classSize:'—')+'</div>'+
  '<div><b>Overall Grade</b>'+g.g+' — '+g.r+'</div>'+
  '<div><b>Attendance</b>'+(att.total?att.present+' / '+att.total+' ('+attPct+'%)':'—')+'</div>'+
  '<div><b>Class Average</b>'+classAvgPct.toFixed(1)+'%</div></div>';
  html+='<div class="rc-comment"><b>📝 Class Teacher\'s Comment:</b><br>'+esc(comment)+'</div>';
  html+='<div class="rc-sign"><div>Class Teacher: _____________________</div><div>Head Teacher: _____________________</div><div>Date: '+new Date().toLocaleDateString()+'</div></div>';
  html+=gradeKeyHTML();
  return html;
}
window.buildReportCardBody=buildReportCardBody;

async function pageReports(root){
  root.innerHTML='<div class="loading">Loading report cards…</div>';
  const [exams,classes,subjects]=await Promise.all([
    rest('/rest/v1/exams?school_id=eq.'+_schoolId+'&select=*&order=created_at.desc').catch(()=>[]),
    rest('/rest/v1/classes?school_id=eq.'+_schoolId+'&select=*&order=sort_order').catch(()=>[]),
    rest('/rest/v1/subjects?school_id=eq.'+_schoolId+'&select=*&order=code').catch(()=>[])
  ]);
  if(!(exams||[]).length){root.innerHTML='<div class="page-head"><div><h1>📄 Report Cards</h1></div></div><div class="card"><div class="empty">Create an exam first.</div></div>';return;}
  if(!(classes||[]).length){root.innerHTML='<div class="page-head"><div><h1>📄 Report Cards</h1></div></div><div class="card"><div class="empty">Create classes first.</div></div>';return;}
  if(!(subjects||[]).length){root.innerHTML='<div class="page-head"><div><h1>📄 Report Cards</h1></div></div><div class="card"><div class="empty">Add subjects first.</div></div>';return;}
  const year=getCurrentYear();
  const term=getCurrentTerm();
  const cId=window._rcClassId||(classes[0]&&classes[0].id);
  const cls=classes.find(c=>c.id===cId)||classes[0];
  const termExams=(exams||[]).filter(e=>Number(e.year)===year&&Number(e.term)===term).sort((a,b)=>{
    const dr=examStageRank(a.type)-examStageRank(b.type);
    if(dr!==0)return dr;
    return new Date(a.created_at||0)-new Date(b.created_at||0);
  });
  if(!termExams.length){
    root.innerHTML='<div class="page-head"><div><h1>📄 Report Cards</h1><div class="sub">'+termLabel()+'</div></div></div>'+
    '<div class="card"><div class="empty">No exams found for '+termLabel()+'. Create one under <b>Exams</b>.</div></div>';
    return;
  }
  const stageRanks=[...new Set(termExams.map(e=>examStageRank(e.type)))].sort((a,b)=>a-b);
  const highestStage=stageRanks[stageRanks.length-1];
  let selectedStage=window._rcStage!=null?Number(window._rcStage):highestStage;
  if(!stageRanks.includes(selectedStage))selectedStage=highestStage;
  const activeExams=termExams.filter(e=>examStageRank(e.type)<=selectedStage);
  const activeExamIds=activeExams.map(e=>e.id);
  const stageLabel=examStageFullLabel(selectedStage);
  const [students,marks,attRecords]=await Promise.all([
    rest('/rest/v1/students?school_id=eq.'+_schoolId+'&class_id=eq.'+cls.id+'&status=eq.active&select=*&order=first_name'),
    rest('/rest/v1/marks?school_id=eq.'+_schoolId+'&exam_id=in.('+activeExamIds.join(',')+')&select=*'),
    rest('/rest/v1/attendance?school_id=eq.'+_schoolId+'&class_id=eq.'+cls.id+'&academic_year=eq.'+year+'&term=eq.'+term+'&select=student_id,status').catch(()=>[])
  ]);
  const studs=students||[];
  const sidSet=new Set(studs.map(s=>s.id));
  const mks=(marks||[]).filter(m=>sidSet.has(m.student_id));
  const marksByStudent={};
  mks.forEach(m=>{
    if(!marksByStudent[m.student_id])marksByStudent[m.student_id]={};
    if(!marksByStudent[m.student_id][m.exam_id])marksByStudent[m.student_id][m.exam_id]={};
    marksByStudent[m.student_id][m.exam_id][m.subject_id]=Number(m.score);
  });
  const subjList=subjects||[];
  const rows=studs.map(s=>{
    const per=marksByStudent[s.id]||{};
    let total=0,count=0;
    activeExams.forEach(e=>{subjList.forEach(sj=>{const v=per[e.id]?.[sj.id];if(v!=null&&!isNaN(v)){total+=Number(v);count++;}});});
    return {student:s,total,avg:count?total/count:0,count};
  });
  const ranked=rows.filter(r=>r.count>0).slice().sort((a,b)=>b.avg-a.avg);
  ranked.forEach((r,i)=>{r.position=i+1;});
  for(let i=1;i<ranked.length;i++){if(ranked[i].avg===ranked[i-1].avg)ranked[i].position=ranked[i-1].position;}
  const rankMap={};ranked.forEach(r=>rankMap[r.student.id]=r.position);
  const classAvgPct=ranked.length?(ranked.reduce((s,r)=>s+r.avg,0)/ranked.length):0;
  const attMap={};
  (attRecords||[]).forEach(a=>{
    if(!attMap[a.student_id])attMap[a.student_id]={present:0,absent:0,total:0};
    attMap[a.student_id].total++;
    if(a.status==='absent')attMap[a.student_id].absent++;
    else attMap[a.student_id].present++;
  });
  const rd={exams:activeExams,cls,subjects:subjList,rows,ranked,classAvgPct,classSize:studs.length,attMap,marksByStudent,rankMap,year,term,stageLabel,selectedStage};
  window._rcData=rd;
  const sortedView=rows.slice().sort((a,b)=>(rankMap[a.student.id]||9999)-(rankMap[b.student.id]||9999));
  const examNames=activeExams.map(e=>examStageLabel(e.type)).join(' + ');
  const stageOptions=stageRanks.map(r=>{
    const includes=termExams.filter(e=>examStageRank(e.type)<=r);
    return {value:r,label:examStageFullLabel(r),count:includes.length};
  });
  root.innerHTML=
  '<div class="page-head"><div><h1>📄 Report Cards</h1><div class="sub">'+esc(cls.name)+' · '+termLabel()+' · <b>'+esc(stageLabel)+'</b></div></div>'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" onclick="printBroadsheet()">📊 Broadsheet</button><button class="btn ghost" onclick="exportReportToExcel()">📥 Excel</button><button class="btn" onclick="printAllReportCards()">🖨️ Print All</button></div></div>'+
  '<div class="card"><div class="grid grid-3">'+
  '<div><label>Class</label><select onchange="window._rcClassId=this.value;nav(\'reports\')">'+classes.map(c=>'<option value="'+c.id+'"'+(c.id===cls.id?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div>'+
  '<div style="grid-column:2/-1"><label>Report Stage (cumulative)</label><select onchange="window._rcStage=this.value;nav(\'reports\')">'+
  stageOptions.map(o=>'<option value="'+o.value+'"'+(o.value===selectedStage?' selected':'')+'>'+esc(o.label)+' — includes '+o.count+' exam'+(o.count>1?'s':'')+' ('+termExams.filter(e=>examStageRank(e.type)<=o.value).map(e=>examStageLabel(e.type)).join(' + ')+')</option>').join('')+
  '</select></div></div></div>'+
  '<div class="grid grid-kpi" style="margin-bottom:14px">'+
  '<div class="kpi kpi-navy"><div class="v">'+studs.length+'</div><div class="l">Pupils</div></div>'+
  '<div class="kpi"><div class="v">'+activeExams.length+'</div><div class="l">Exams</div></div>'+
  '<div class="kpi kpi-ok"><div class="v">'+classAvgPct.toFixed(1)+'%</div><div class="l">Class Average</div></div>'+
  '<div class="kpi kpi-warn"><div class="v">'+ranked.length+' / '+studs.length+'</div><div class="l">With Marks</div></div></div>'+
  '<div class="card"><h3>📊 Class Ranking <span class="muted" style="font-weight:400;font-size:11px">('+esc(examNames)+')</span></h3>'+
  (studs.length?'<div class="table-wrap"><table><thead><tr><th>Pos</th><th>Adm No</th><th>Name</th>'+
  activeExams.map(e=>'<th style="text-align:center">'+esc(examStageLabel(e.type))+'</th>').join('')+
  '<th style="text-align:right">Total</th><th style="text-align:right">Avg</th><th>Grade</th><th style="text-align:right">Actions</th></tr></thead><tbody>'+
  sortedView.map(r=>{
    const pos=rankMap[r.student.id];const g=gradeOf(r.avg);const per=marksByStudent[r.student.id]||{};
    return '<tr><td><b>'+(pos?ordinal(pos):'—')+'</b></td>'+
    '<td>'+esc(r.student.admission_no)+'</td>'+
    '<td><b>'+esc(r.student.first_name+' '+(r.student.last_name||''))+'</b></td>'+
    activeExams.map(e=>{const hasAny=subjList.some(sj=>per[e.id]?.[sj.id]!=null);const examTotal=subjList.reduce((sum,sj)=>sum+(per[e.id]?.[sj.id]!=null?Number(per[e.id][sj.id]):0),0);return '<td style="text-align:center">'+(hasAny?examTotal.toFixed(0):'—')+'</td>';}).join('')+
    '<td style="text-align:right;font-weight:600">'+r.total.toFixed(0)+'</td>'+
    '<td style="text-align:right">'+r.avg.toFixed(1)+'</td>'+
    '<td><span class="badge '+(g.cls||'info')+'">'+g.g+'</span></td>'+
    '<td style="text-align:right;white-space:nowrap"><button class="btn sm" onclick="viewReportCard(\''+r.student.id+'\')">📄 View</button> <button class="btn sm ghost" onclick="printOneReportCard(\''+r.student.id+'\')">🖨️</button></td></tr>';
  }).join('')+'</tbody></table></div>':'<div class="empty">No pupils.</div>')+'</div>';
}

function exportReportToExcel(){
  const rd=window._rcData;if(!rd||!rd.rows.length){toast('No data','bad');return;}
  const sorted=rd.rows.slice().sort((a,b)=>(rd.rankMap[a.student.id]||9999)-(rd.rankMap[b.student.id]||9999));
  const data=sorted.map(r=>{
    const per=rd.marksByStudent[r.student.id]||{};
    const g=gradeOf(r.avg);
    const row={'Position':rd.rankMap[r.student.id]?ordinal(rd.rankMap[r.student.id]):'','Adm No':r.student.admission_no,'Name':r.student.first_name+' '+(r.student.last_name||'')};
    rd.exams.forEach(e=>{const tag=examStageLabel(e.type);rd.subjects.forEach(s=>{const v=per[e.id]?.[s.id];row[tag+'-'+s.code]=v!=null?Number(v):'';});row[tag+'-TOTAL']=rd.subjects.reduce((sum,sj)=>sum+(per[e.id]?.[sj.id]!=null?Number(per[e.id][sj.id]):0),0);});
    row['Total']=r.total;row['Average']=Number(r.avg.toFixed(2));row['Grade']=g.g;row['Remark']=g.r;
    return row;
  });
  const ws=XLSX.utils.json_to_sheet(data);const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,rd.cls.name.slice(0,30));
  XLSX.writeFile(wb,'ReportCards_'+rd.cls.name.replace(/[^A-Za-z0-9]/g,'_')+'_'+rd.stageLabel.replace(/[^A-Za-z0-9]/g,'')+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('Exported','ok');
}

async function renderTermlyReport(y,t){
  const body=window._reportBody;body.innerHTML='<div class="loading">Loading…</div>';
  const [students,classes,payments,expenses,uniform]=await Promise.all([
    rest('/rest/v1/students?school_id=eq.'+_schoolId+'&select=*&status=eq.active').catch(()=>[]),
    rest('/rest/v1/classes?school_id=eq.'+_schoolId+'&select=*&order=sort_order').catch(()=>[]),
    rest('/rest/v1/payments?school_id=eq.'+_schoolId+'&academic_year=eq.'+y+'&term=eq.'+t+'&select=*').catch(()=>[]),
    rest('/rest/v1/expenses?school_id=eq.'+_schoolId+'&academic_year=eq.'+y+'&term=eq.'+t+'&select=*').catch(()=>[]),
    rest('/rest/v1/uniform_sales?school_id=eq.'+_schoolId+'&academic_year=eq.'+y+'&term=eq.'+t+'&select=*').catch(()=>[])
  ]);
  const pbs={};
  payments.forEach(p=>{if(!pbs[p.student_id])pbs[p.student_id]=0;if(p.payment_for!=='Functional Fees')pbs[p.student_id]+=Number(p.amount);});
  let te=0,tc=0;
  students.forEach(s=>{const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);te+=sf;tc+=pbs[s.id]||0;});
  const exT=expenses.reduce((x,e)=>x+Number(e.amount),0);
  const unT=uniform.reduce((x,u)=>x+Number(u.total_amount),0);
  body.innerHTML='<div style="margin-bottom:12px"><b>Term:</b> '+y+' Term '+t+'</div>'+
  '<div class="grid grid-kpi" style="margin-bottom:14px">'+
  '<div class="kpi kpi-navy"><div class="v">'+students.length+'</div><div class="l">Pupils</div></div>'+
  '<div class="kpi kpi-ok"><div class="v">'+fmtUGX(te)+'</div><div class="l">Expected</div></div>'+
  '<div class="kpi kpi-navy"><div class="v">'+fmtUGX(tc)+'</div><div class="l">Collected (term)</div></div>'+
  '<div class="kpi kpi-bad"><div class="v">'+fmtUGX(te-tc)+'</div><div class="l">Outstanding</div></div>'+
  '<div class="kpi kpi-warn"><div class="v">'+fmtUGX(unT)+'</div><div class="l">Uniforms</div></div>'+
  '<div class="kpi kpi-bad"><div class="v">'+fmtUGX(exT)+'</div><div class="l">Expenses</div></div></div>';
}

   EXCEL IMPORT
   ============================================================ */
async function eudesImport(){document.getElementById('excelInput').click();}
window.eudesImport=eudesImport;

async function eudesImportFilePicked(input){
  if(!input.files||input.files.length===0)return;
  const file=input.files[0];
  const reader=new FileReader();
  reader.onload=async ev=>{
    try{
      toast('Reading Excel…','ok');
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});
      if(!rows||rows.length<2){toast('Empty file','bad');input.value='';return;}
      const headers=(rows[0]||[]).map(h=>String(h||'').trim().toLowerCase());
      const find=(...names)=>{
        for(const n of names){const idx=headers.findIndex(h=>h===n.toLowerCase());if(idx!==-1)return idx;}
        for(const n of names){const idx=headers.findIndex(h=>h.indexOf(n.toLowerCase())!==-1);if(idx!==-1)return idx;}
        return -1;
      };
      const cName=find('name','pupil name');
      const cClass=find('class');
      const cStat=find('status','boarding');
      const cBF=find('b/f','bf','balance b/f');
      const cAct=find('actual fee','tuition');
      const cFunc=find('funct','functional');
      const cTrans=find('transport');
      const cD1=find('1st deposit','first deposit');
      const cD2=find('2nd deposit','second deposit');
      const cD3=find('3rd deposit','third deposit');
      if(cName<0||cClass<0){toast('Missing Name or Class column','bad');input.value='';return;}
      const num=v=>{
        if(v==null)return 0;
        let s=String(v).trim();
        if(s===''||s==='-'||s==='—')return 0;
        const neg=/^\(.*\)$/.test(s);
        s=s.replace(/[^0-9.\-]/g,'');
        if(s===''||s==='-')return 0;
        let n=parseFloat(s);if(isNaN(n))return 0;
        return neg?-Math.abs(n):n;
      };
      const parsed=[];const seenNames=new Set();
      for(let i=1;i<rows.length;i++){
        const row=rows[i];if(!row)continue;
        const fullName=String(row[cName]||'').trim();if(!fullName)continue;
        const lower=fullName.toLowerCase();
        if(lower==='name'||lower.indexOf('total')!==-1)continue;
        if(seenNames.has(lower))continue;
        seenNames.add(lower);
        const clsRaw=String(row[cClass]||'').trim();
        const statusRaw=String(row[cStat]||'').trim().toLowerCase();
        let boarding='Day';
        if(statusRaw.indexOf('board')!==-1)boarding='Boarding';
        else if(statusRaw==='bar')boarding='BAR';
        else if(statusRaw==='day'||statusRaw==='')boarding='Day';
        else boarding=statusRaw.charAt(0).toUpperCase()+statusRaw.slice(1);
        parsed.push({fullName,clsRaw,clsLower:clsRaw.toLowerCase(),boarding,bf:num(row[cBF]),act:num(row[cAct]),func:num(row[cFunc]),trans:num(row[cTrans]),d1:num(row[cD1]),d2:num(row[cD2]),d3:num(row[cD3])});
      }
      if(!parsed.length){toast('No valid rows','bad');input.value='';return;}
      const classes=await loadClasses();
      const classMap={};classes.forEach(c=>classMap[c.name.trim().toLowerCase()]=c.id);
      const unknownClasses=[...new Set(parsed.map(p=>p.clsRaw).filter(c=>c&&!classMap[c.toLowerCase()]))];
      const funcPaidCount=parsed.filter(p=>p.func>0).length;
      const totalFunc=parsed.reduce((s,p)=>s+p.func,0);
      const totalFees=parsed.reduce((s,p)=>s+p.bf+p.act+p.trans,0);
      const classTotals={};
      parsed.forEach(p=>{const k=p.clsRaw||'(none)';classTotals[k]=(classTotals[k]||0)+1;});
      modal(
        '<h3>📋 Import Preview — '+termLabel()+'</h3>'+
        '<div style="background:var(--brandsoft);padding:14px;border-radius:10px;font-size:13px;line-height:1.9">'+
        '<div><b>Pupils found:</b> '+parsed.length+'</div>'+
        '<div><b>Functional fee paid:</b> '+funcPaidCount+' pupils · '+fmtUGX(totalFunc)+'</div>'+
        '<div><b>Total fees expected:</b> '+fmtUGX(totalFees)+'</div>'+
        '</div>'+
        '<h3 style="margin-top:16px;font-size:13px">Class breakdown</h3>'+
        '<div style="display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px">'+
        Object.entries(classTotals).map(([k,v])=>'<span class="mini-stat">'+esc(k)+': '+v+'</span>').join('')+
        '</div>'+
        (unknownClasses.length?'<div class="err" style="margin-top:12px"><b>⚠️ New classes will be created:</b><br>'+unknownClasses.map(esc).join(', ')+'</div>':'')+
        '<div style="margin-top:14px"><label><input type="checkbox" id="impFuncAsPayment" style="width:auto;margin-right:6px" checked> Record functional fee as payment entry ('+termLabel()+')</label></div>'+
        '<div class="actions"><button class="btn ghost" onclick="closeModal();document.getElementById(\'excelInput\').value=\'\'">Cancel</button>'+
        '<button class="btn ok" onclick="eudesImportCommit()">✅ Import '+parsed.length+' Pupils</button></div>'
      );
      window._impPayload={parsed,classMap,unknownClasses};
    }catch(err){console.error(err);toast('Error: '+err.message,'bad');input.value='';}
  };
  reader.readAsArrayBuffer(file);
}
window.eudesImportFilePicked=eudesImportFilePicked;

async function eudesImportCommit(){
  const payload=window._impPayload;
  if(!payload){toast('Nothing to import','bad');return;}
  const {parsed,classMap}=payload;
  const alsoPay=document.getElementById('impFuncAsPayment')?.checked;
  closeModal();
  document.getElementById('excelInput').value='';
  for(const clsName of payload.unknownClasses){
    try{
      const ins=await rest('/rest/v1/classes',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({school_id:_schoolId,name:clsName.trim(),sort_order:0})});
      if(ins&&ins[0])classMap[clsName.trim().toLowerCase()]=ins[0].id;
    }catch(e){}
  }
  _classesCache=null;await loadClasses();
  toast('Importing '+parsed.length+' pupils…','ok');
  let created=0,payments=0;
  const cy=getCurrentYear(),ct=getCurrentTerm();
  const iso=new Date().toISOString();
  for(const p of parsed){
    try{
      const parts=p.fullName.split(/\s+/);
      const fn=parts[0];const ln=parts.slice(1).join(' ')||null;
      const classId=classMap[p.clsLower]||null;
      const totalExpected=p.bf+p.act+p.trans;
      const depositsTotal=p.d1+p.d2+p.d3;
      const balance=Math.max(0,totalExpected-depositsTotal);
      const funcStatus=p.func>0?'cash':'pending';
      const stu=await rest('/rest/v1/students',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({
        school_id:_schoolId,
        admission_no:'ADM-'+Date.now().toString().slice(-6)+Math.floor(Math.random()*99),
        first_name:fn,last_name:ln,lin:generateLIN(fn),
        class_id:classId,
        boarding_status:p.boarding,
        balance_bf:p.bf,
        actual_fee:p.act,
        transport_fee:p.trans,
        functional_fee:FUNC_FEE_DEFAULT,
        functional_fee_paid:p.func,
        functional_fee_status:funcStatus,
        total_expected:totalExpected,
        current_balance:balance,
        status:'active'
      })});
      if(!stu||!stu[0])continue;
      const sid=stu[0].id;created++;
      const mkPay=async(amt,label,forType)=>{
        if(!amt||amt<=0)return false;
        await rest('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({
          school_id:_schoolId,student_id:sid,amount:amt,payment_for:forType,payment_method:'Cash',notes:label,paid_at:iso,academic_year:cy,term:ct
        })});
        return true;
      };
      if(await mkPay(p.d1,'1st deposit (imported)','School Fees'))payments++;
      if(await mkPay(p.d2,'2nd deposit (imported)','School Fees'))payments++;
      if(await mkPay(p.d3,'3rd deposit (imported)','School Fees'))payments++;
      if(alsoPay&&p.func>0){
        if(await mkPay(p.func,'Functional fee (imported)','Functional Fees'))payments++;
      }
    }catch(e){console.warn('Row failed',p.fullName,e);}
  }
  toast('✅ '+created+' pupils · '+payments+' payments · tagged '+termLabel(),'ok');
  nav('students');
}
window.eudesImportCommit=eudesImportCommit;

/* ============================================================
   AUTH REDIRECT
   ============================================================ */
async function handleAuthRedirect(){
  const hash=window.location.hash;
  if(hash&&hash.includes('access_token')){
    const p=new URLSearchParams(hash.substring(1));
    const at=p.get('access_token');const rt=p.get('refresh_token');
    if(at){
      try{
        const r=await fetch(SUPA_URL+'/auth/v1/user',{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+at}});
        const u=await r.json();
        if(u&&u.id){
          setSession({access_token:at,refresh_token:rt,user:u});
          window.history.replaceState(null,'',window.location.pathname);
          await boot();return;
        }
      }catch(e){console.error(e);}
    }
  }
  const s=safeStorage.getItem('eudes_session');
  if(s){try{await boot();}catch(e){console.error(e);}}
}
handleAuthRedirect();
