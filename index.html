<script>
/* ============================================================
   Progressive Mothers School Management — Complete System v3
   With Search, Print, and Parent Contacts Export
   ============================================================ */
const SUPA_URL='https://wabeempxckdtjvrkzhpv.supabase.co';
/* ⚠️ REPLACE THIS with your real anon key (eyJ...) from Supabase → Settings → API */
const SUPA_KEY='sb_publishable_n0uAm0Gcq7qR2dJM4jMZGQ_wiV__Cfp';

let _memoryStore={};
const safeStorage={getItem:k=>{try{return localStorage.getItem(k);}catch(e){return _memoryStore[k]||null;}},setItem:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){_memoryStore[k]=String(v);}},removeItem:k=>{try{localStorage.removeItem(k);}catch(e){delete _memoryStore[k];}}};
function getCurrentYear(){return parseInt(safeStorage.getItem('pm_year'))||new Date().getFullYear();}
function getCurrentTerm(){return parseInt(safeStorage.getItem('pm_term'))||1;}
function setCurrentPeriod(y,t){safeStorage.setItem('pm_year',String(y));safeStorage.setItem('pm_term',String(t));}
function getToken(){const s=safeStorage.getItem('pm_session');if(!s)return null;try{return JSON.parse(s).access_token;}catch(e){return null;}}
function getUser(){const s=safeStorage.getItem('pm_session');if(!s)return null;try{return JSON.parse(s).user;}catch(e){return null;}}
function setSession(d){if(d)safeStorage.setItem('pm_session',JSON.stringify(d));else safeStorage.removeItem('pm_session');}

async function rest(path,options){
  options=options||{};
  const headers=Object.assign({'apikey':SUPA_KEY,'Content-Type':'application/json'},options.headers||{});
  const token=getToken();headers['Authorization']='Bearer '+(token||SUPA_KEY);
  const res=await fetch(SUPA_URL+path,Object.assign({},options,{headers}));
  const text=await res.text();let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok){if(res.status===401){setSession(null);alert('Session expired.');window.location.reload();throw new Error('Session expired');}throw new Error((data&&(data.message||data.msg||data.error_description||data.error||data.hint))||text||('HTTP '+res.status));}
  return data;
}
async function auth(path,body){
  const res=await fetch(SUPA_URL+path,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const text=await res.text();let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok)throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status));return data;
}

let _profile=null,_school=null,_schoolId=null,_role=null,_classesCache=null,_examsCache=null;
let _marksClass=null,_marksExam=null,_subjClass=null,_repClass=null,_repStage=3,_repPupil='';
let _importMatches=null,_profileStudentId=null,_profileTab='overview';

function toast(msg,type){const el=document.createElement('div');el.className='toast'+(type==='bad'?' bad':(type==='ok'?' ok':''));el.textContent=msg;document.getElementById('toastRoot').appendChild(el);setTimeout(()=>el.remove(),3500);}
function modal(html){const root=document.getElementById('modalRoot');root.innerHTML='<div class="modal-bg"><div class="modal">'+html+'</div></div>';root.querySelector('.modal-bg').addEventListener('click',e=>{if(e.target.classList.contains('modal-bg'))closeModal();});}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtUGX(n){if(n==null||isNaN(n))return 'UGX 0';return 'UGX '+(Number(n)||0).toLocaleString();}
function fmtNum(n){if(n==null||isNaN(n))return '0';return (Number(n)||0).toLocaleString();}
function fmtDate(ts){if(!ts)return '—';const d=new Date(ts);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function fmtLongDate(d){return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});}
function fmtDateTime(ts){if(!ts)return '—';const d=new Date(ts);return fmtDate(ts)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function telLink(num){if(!num)return '';return String(num).replace(/[^0-9+]/g,'');}
function waLink(num){if(!num)return '';let clean=String(num).replace(/[^0-9]/g,'');if(clean.startsWith('0'))clean='256'+clean.slice(1);return clean;}
window.toast=toast;window.modal=modal;window.closeModal=closeModal;window.esc=esc;window.fmtUGX=fmtUGX;window.fmtNum=fmtNum;window.fmtDate=fmtDate;

/* ---------- PRINT ---------- */
function printSection(title,tableHTML){
  const w=window.open('','_blank');
  if(!w){toast('Allow popups','bad');return;}
  const logo=_school&&(_school.logo_data||_school.logo_url);
  const schoolName=_school?_school.name:'';
  const schoolAddr=_school?(_school.address||''):'';
  const schoolTel=_school?(_school.telephone||''):'';
  const now=new Date();
  const stamp=now.toLocaleDateString('en-GB')+' '+now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>'+esc(title)+'</title><style>'+
    '*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#111;padding:20px;margin:0;font-size:13px}'+
    '.letterhead{display:flex;align-items:center;gap:16px;padding-bottom:14px;border-bottom:2px solid #0a2540;margin-bottom:18px}'+
    '.letterhead .logo{width:70px;height:70px;object-fit:contain;flex-shrink:0}'+
    '.letterhead .logo-fallback{width:70px;height:70px;border-radius:50%;background:#e0e9f5;display:grid;place-items:center;font-size:32px;color:#0a2540;flex-shrink:0}'+

function gradeOf(score){if(score==null||isNaN(score)||score==='')return{g:'—',r:'—',cls:'',agg:'—'};const s=Number(score);if(s>=90)return{g:'D1',r:'Distinction 1',cls:'d1',agg:'1'};if(s>=80)return{g:'D2',r:'Distinction 2',cls:'d2',agg:'2'};if(s>=70)return{g:'C3',r:'Credit 3',cls:'c3',agg:'3'};if(s>=60)return{g:'C4',r:'Credit 4',cls:'c4',agg:'4'};if(s>=55)return{g:'C5',r:'Credit 5',cls:'c5',agg:'5'};if(s>=50)return{g:'C6',r:'Credit 6',cls:'c6',agg:'6'};if(s>=45)return{g:'P7',r:'Pass 7',cls:'p7',agg:'7'};if(s>=40)return{g:'P8',r:'Pass 8',cls:'p8',agg:'8'};return{g:'F9',r:'Fail 9',cls:'f9',agg:'9'};}
function posLabel(n){if(!n)return '—';if(n===1)return '1st';if(n===2)return '2nd';if(n===3)return '3rd';return n+'th';}

function exportContacts(mode){
  const students=window._allStudents||[];
  const classes=_classesCache||[];
  const classesById={};classes.forEach(c=>classesById[c.id]=c);
  let rows=students.map(s=>{
    const cls=classesById[s.class_id];
    const res=String(s.boarding_status||s.residence||'day').toLowerCase();
    return {
      'ADM No':s.admission_no||'',
      'Pupil Name':(s.first_name||'')+' '+(s.last_name||''),
      'Class':cls?cls.name:'',
      'Boarding':res==='boarding'?'Boarding':'Day',
      'Parent Name':s.parent_name||'',
      'Parent Contact':s.parent_contact||'',
      'Location':s.location||'',
      'Status':s.status||'active'
    };
  });
  if(mode==='with')rows=rows.filter(r=>r['Parent Contact']);
  if(mode==='missing')rows=rows.filter(r=>!r['Parent Contact']);
  rows.sort((a,b)=>(a.Class||'').localeCompare(b.Class||'')||(a['Pupil Name']||'').localeCompare(b['Pupil Name']||''));
  if(!rows.length){toast('Nothing to export','bad');return;}
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:16},{wch:24},{wch:14},{wch:10},{wch:24},{wch:18},{wch:18},{wch:10}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Parent Contacts');
  const suffix=mode==='with'?'WithContacts':mode==='missing'?'MissingContacts':'AllContacts';
  XLSX.writeFile(wb,'ParentContacts_'+suffix+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('Downloaded: '+rows.length+' contacts','ok');
  closeModal();
}
window.exportContacts=exportContacts;

function copyContactsToClipboard(){
  const students=window._allStudents||[];
  const classes=_classesCache||[];
  const classesById={};classes.forEach(c=>classesById[c.id]=c);
  const rows=students.filter(s=>s.parent_contact).sort((a,b)=>((a.first_name||'')+(a.last_name||'')).localeCompare((b.first_name||'')+(b.last_name||'')));
  if(!rows.length){toast('No contacts to copy','bad');return;}
  const text=rows.map(s=>{
    const cls=classesById[s.class_id];
    const name=(s.first_name||'')+' '+(s.last_name||'');
    const cleaned=String(s.parent_contact).replace(/[^0-9+]/g,'');
    return cleaned+'  -  '+(s.parent_name||'Parent')+' ('+name+', '+(cls?cls.name:'')+')';
  }).join('\n');
  navigator.clipboard.writeText(text).then(()=>{toast('Copied '+rows.length+' contacts!','ok');closeModal();}).catch(err=>{
    const ta=document.createElement('textarea');
    ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    toast('Copied '+rows.length+' contacts!','ok');closeModal();
  });
}
window.copyContactsToClipboard=copyContactsToClipboard;

async function saveStudent(id){
  const ff={balance_bf:Number(document.getElementById('m_bf').value)||0,actual_fee:Number(document.getElementById('m_fee').value)||0,holiday_fee:Number(document.getElementById('m_hol').value)||0,academics_fee:Number(document.getElementById('m_acad').value)||0,functional_fee:Number(document.getElementById('m_func').value)||0,transport_fee:Number(document.getElementById('m_trans').value)||0,deposit_1:Number(document.getElementById('m_d1').value)||0,deposit_2:Number(document.getElementById('m_d2').value)||0,deposit_3:Number(document.getElementById('m_d3').value)||0};
  const charged=ff.balance_bf+ff.actual_fee+ff.holiday_fee+ff.academics_fee+ff.functional_fee+ff.transport_fee;
  const collected=ff.deposit_1+ff.deposit_2+ff.deposit_3;
  const boarding_status=String(document.getElementById('m_res').value||'day').toLowerCase();
  const body=Object.assign({school_id:_schoolId,admission_no:document.getElementById('m_adm').value.trim(),class_id:document.getElementById('m_class').value||null,first_name:document.getElementById('m_fn').value.trim(),last_name:document.getElementById('m_ln').value.trim()||null,gender:document.getElementById('m_gender').value||null,date_of_birth:document.getElementById('m_dob').value||null,lin:document.getElementById('m_lin').value.trim()||null,boarding_status:boarding_status,location:document.getElementById('m_location').value.trim()||null,parent_name:document.getElementById('m_par').value.trim()||null,parent_contact:document.getElementById('m_pc').value.trim()||null,status:document.getElementById('m_status').value,total_expected:charged,current_balance:charged-collected},ff);
  if(!body.admission_no||!body.first_name){toast('ADM and name required','bad');return;}
  if(!body.class_id){toast('Select class','bad');return;}
  try{
    if(id)await rest('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});
    else await rest('/rest/v1/students',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});
    toast('Saved','ok');closeModal();nav(activeRoute);
  }catch(e){toast(e.message,'bad');}
}
window.saveStudent=saveStudent;

async function savePayment(studentId){
  const amount=Number(document.getElementById('p_amount').value);
  const payment_for=document.getElementById('p_for').value;
  const method=document.getElementById('p_method').value;
  const notes=document.getElementById('p_notes').value.trim();
  if(!amount||amount<=0){toast('Enter amount','bad');return;}
  const s=(window._allStudents||[]).find(x=>x.id===studentId);if(!s){toast('Not found','bad');return;}
  try{
    await rest('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,student_id:studentId,receipt_no:'RCP-'+Date.now(),year:getCurrentYear(),term:getCurrentTerm(),academic_year:getCurrentYear(),amount,method,payment_method:method,payment_for,notes:notes||null,received_by:_profile?_profile.id:null})});
    const dep={deposit_1:Number(s.deposit_1)||0,deposit_2:Number(s.deposit_2)||0,deposit_3:Number(s.deposit_3)||0};
    if(!dep.deposit_1)dep.deposit_1=amount;else if(!dep.deposit_2)dep.deposit_2=amount;else dep.deposit_3+=amount;
    const charged=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.holiday_fee)||0)+(Number(s.academics_fee)||0)+(Number(s.functional_fee)||0)+(Number(s.transport_fee)||0);
    const newCollected=dep.deposit_1+dep.deposit_2+dep.deposit_3;
    await rest('/rest/v1/students?id=eq.'+studentId,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify(Object.assign({current_balance:charged-newCollected},dep))});
    toast('Payment recorded','ok');closeModal();nav(activeRoute);
  }catch(e){toast(e.message,'bad');}
}
window.savePayment=savePayment;

function findColIndex(headers,names){for(let i=0;i<headers.length;i++){const h=String(headers[i]||'').trim().toLowerCase().replace(/\s+/g,' ');for(const n of names){if(h===n.toLowerCase())return i;}}return -1;}

async function processImportRows(rows){
  const status=document.getElementById('importStatus');
  if(!rows||rows.length<2){status.textContent='No data.';return;}
  let headerIdx=0;for(let i=0;i<Math.min(5,rows.length);i++){const r=rows[i].map(c=>String(c||'').toLowerCase());if(r.includes('name')||r.some(c=>c.includes('class'))){headerIdx=i;break;}}
  const headers=rows[headerIdx].map(h=>String(h||'').trim());
  const iName=findColIndex(headers,['name','pupil','full name']);
  const iClass=findColIndex(headers,['class']);
  const iStatus=findColIndex(headers,['status','residence','boarding']);
  const iBF=findColIndex(headers,['b/f','bf']);
  const iActual=findColIndex(headers,['actual fee','actual']);
  const iHoliday=findColIndex(headers,['holiday']);
  const iAcademics=findColIndex(headers,['academics']);
  const iFunc=findColIndex(headers,['funct','functional']);
  const iTrans=findColIndex(headers,['transport']);
  const iD1=findColIndex(headers,['1st deposit','first deposit','deposit 1']);
  const iD2=findColIndex(headers,['2nd deposit','second deposit','deposit 2']);
  const iD3=findColIndex(headers,['3rd deposit','third deposit','deposit 3']);
  if(iName<0){status.innerHTML='<span style="color:#dc2626">❌ No "Name" column.</span>';return;}
  const parsed=[];
  for(let i=headerIdx+1;i<rows.length;i++){
    const r=rows[i];const rawName=String(r[iName]||'').trim();
    if(!rawName||rawName.toLowerCase().includes('total'))continue;
    const parts=rawName.split(/\s+/);let first=parts[0],last='';if(parts.length>=2)last=parts.slice(1).join(' ');
    parsed.push({rawName,first_name:first,last_name:last,class_name:iClass>=0?normalizeClassName(r[iClass]):'',boarding_status:iStatus>=0?(String(r[iStatus]).toLowerCase().includes('board')?'boarding':'day'):'day',balance_bf:iBF>=0?parseMoney(r[iBF]):0,actual_fee:iActual>=0?parseMoney(r[iActual]):0,holiday_fee:iHoliday>=0?parseMoney(r[iHoliday]):0,academics_fee:iAcademics>=0?parseMoney(r[iAcademics]):0,functional_fee:iFunc>=0?parseMoney(r[iFunc]):0,transport_fee:iTrans>=0?parseMoney(r[iTrans]):0,deposit_1:iD1>=0?parseMoney(r[iD1]):0,deposit_2:iD2>=0?parseMoney(r[iD2]):0,deposit_3:iD3>=0?parseMoney(r[iD3]):0});
  }
  const students=window._allStudents||[];const nameIndex={};students.forEach(s=>{const k=normalizeName(s.first_name,s.last_name);if(!nameIndex[k])nameIndex[k]=[];nameIndex[k].push(s);});
  window._importMatches=parsed.map(row=>{
    const k=normalizeName(row.first_name,row.last_name);
    const cands=nameIndex[k]||[];let status='missing',chosen=null;
    if(cands.length===1){status='exact';chosen=cands[0];}
    else if(cands.length>1){status='ambiguous';}
    else{const fm=students.filter(s=>String(s.first_name||'').toLowerCase().trim()===row.first_name.toLowerCase().trim());if(fm.length===1){status='fuzzy';chosen=fm[0];}else if(fm.length>1){status='ambiguous';}}
    return {row,candidates:cands,status,chosen};
  });
  status.innerHTML='<b style="color:#047857">✅ '+parsed.length+' rows</b>';
  renderImportPreview();
}
window.processImportRows=processImportRows;

async function applyImport(btn){
  const m=window._importMatches||[];
  if(!m.length){toast('Nothing','bad');return;}
  const classes=_classesCache||await loadClasses();
  const classByName={};classes.forEach(c=>classByName[c.name.toLowerCase()]=c);
  const updates=m.filter(x=>x.chosen&&(x.status==='exact'||x.status==='fuzzy'));
  const creates=m.filter(x=>x.status==='missing');
  if(!confirm('Apply '+updates.length+' updates, create '+creates.length+' new?'))return;
  if(btn){btn.disabled=true;btn.textContent='Applying…';}
  let u=0,cr=0,err=0;

async function setMark(inputEl){

      if(!window._marksMap[studentId])window._marksMap[studentId]={};

    }

    (window._marksSubjects||[]).forEach(sj=>{const v=per[sj.subject_id];if(v!=null&&!isNaN(v))total+=Number(v);});

  window._reportData={students,subjects,exams,marks,classObj};

function rankingTable(students,subjects,exams,marks){
  const rows=students.map(s=>{
    const m=marks[s.id]||{};let t=0,c=0;
    exams.forEach(e=>subjects.forEach(sj=>{const v=m[e.id]?.[sj.subject_id];if(v!=null&&!isNaN(v)){t+=Number(v);c++;}}));
    return{s,total:t,avg:c?t/c:0,cnt:c};
  });
  rows.sort((a,b)=>b.avg-a.avg);rows.forEach((r,i)=>r.pos=i+1);
  for(let i=1;i<rows.length;i++)if(rows[i].avg===rows[i-1].avg)rows[i].pos=rows[i-1].pos;
  let body='';
  rows.forEach(r=>{
    const g=gradeOf(r.avg);
    body+='<tr><td><b>'+posLabel(r.pos)+'</b></td><td>'+esc(r.s.admission_no)+'</td><td>'+esc(r.s.first_name+' '+(r.s.last_name||''))+'</td><td style="text-align:right">'+r.total.toFixed(0)+'</td><td><span class="badge '+g.cls+'">'+g.g+'</span></td><td><button class="btn sm ghost" onclick="showSingleReport(\''+r.s.id+'\')">View</button></td></tr>';
  });
  return '<div class="table-wrap"><table><thead><tr><th>Pos</th><th>ADM</th><th>Name</th><th style="text-align:right">Total</th><th>Grade</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
window.rankingTable=rankingTable;

function printBroadsheet(){
  const d=window._reportData;
  const ranked=d.students.map(s=>{
    const m=d.marks[s.id]||{};let t=0,c=0;
    d.exams.forEach(e=>d.subjects.forEach(sj=>{const v=m[e.id]?.[sj.subject_id];if(v!=null&&!isNaN(v)){t+=Number(v);c++;}}));
    return{s,total:t,avg:c?t/c:0};
  }).sort((a,b)=>b.avg-a.avg);
  ranked.forEach((r,i)=>r.pos=i+1);
  for(let i=1;i<ranked.length;i++)if(ranked[i].avg===ranked[i-1].avg)ranked[i].pos=ranked[i-1].pos;
  let head='<tr><th rowspan="2">Pos</th><th rowspan="2">ADM</th><th rowspan="2">Name</th>';
  d.exams.forEach(e=>{head+='<th colspan="'+(d.subjects.length+1)+'">'+esc(e.name)+'</th>';});
  head+='<th rowspan="2">Total</th><th rowspan="2">Grade</th></tr><tr>';
  d.exams.forEach(()=>{d.subjects.forEach(sj=>{head+='<th>'+esc(sj.code)+'</th>';});head+='<th style="background:#d4a017">TOT</th>';});
  head+='</tr>';
  let body='';
  ranked.forEach(r=>{
    const m=d.marks[r.s.id]||{};let total=0,c=0;
    let cells='<td><b>'+posLabel(r.pos)+'</b></td><td>'+esc(r.s.admission_no)+'</td><td style="text-align:left">'+esc(r.s.first_name+' '+(r.s.last_name||''))+'</td>';
    d.exams.forEach(e=>{
      let et=0,any=false;
      d.subjects.forEach(sj=>{
        const v=m[e.id]?.[sj.subject_id];
        if(v!=null&&!isNaN(v)){et+=Number(v);any=true;total+=Number(v);c++;}
        cells+='<td>'+(v!=null?v.toFixed(0):'—')+'</td>';
      });
      cells+='<td style="background:#fff7e6;font-weight:700">'+(any?et.toFixed(0):'—')+'</td>';
    });
    const g=gradeOf(c?total/c:0);
    cells+='<td style="font-weight:700">'+total.toFixed(0)+'</td><td><b>'+g.g+'</b></td>';
    body+='<tr>'+cells+'</tr>';
  });
  printSection('Broadsheet — '+(d.classObj?.name||''), '<table><thead>'+head+'</thead><tbody>'+body+'</tbody></table>');
}

async function pageDebtors(root){
  clearClassesCache();
  const students=await rest('/rest/v1/students?school_id=eq.'+_schoolId+'&status=eq.active&select=*');
  const classes=await loadClasses();
  const classesById={};classes.forEach(c=>classesById[c.id]=c);
  const debtors=students.map(s=>{
    const charged=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.holiday_fee)||0)+(Number(s.academics_fee)||0)+(Number(s.functional_fee)||0)+(Number(s.transport_fee)||0);
    const collected=(Number(s.deposit_1)||0)+(Number(s.deposit_2)||0)+(Number(s.deposit_3)||0);
    return{s,bal:charged-collected,cls:classesById[s.class_id]};
  }).filter(x=>x.bal>0).sort((a,b)=>b.bal-a.bal);
  window._debtors=debtors;
  window._allStudents=debtors.map(d=>d.s);
  const totalOwed=debtors.reduce((t,d)=>t+d.bal,0);
  let rows='';
  debtors.forEach(d=>{
    rows+='<tr><td>'+esc(d.s.admission_no)+'</td><td><b>'+esc(d.s.first_name+' '+(d.s.last_name||''))+'</b></td><td>'+esc(d.cls?d.cls.name:'—')+'</td><td>'+esc(d.s.parent_name||'—')+'</td><td>'+esc(d.s.parent_contact||'—')+'</td><td style="text-align:right;font-weight:700;color:#b91c1c">'+fmtNum(d.bal)+'</td><td><button class="btn sm" onclick="recordPayment(\''+d.s.id+'\')">💵</button></td></tr>';
  });
  root.innerHTML='<div class="page-head"><div><h1>👥 Debtors</h1><div class="sub">'+debtors.length+' pupils · '+fmtUGX(totalOwed)+' outstanding</div></div><button class="btn ghost" onclick="printDebtors()">🖨️ Print</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>ADM</th><th>Name</th><th>Class</th><th>Parent</th><th>Contact</th><th style="text-align:right">Balance</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

  '<select id="poRangeFilter" onchange="filterPassOuts()"><option value="">All time</option><option value="today">Today</option><option value="week">This week</option><option value="month">This month</option></select>'+
  '</div><div id="poTableContainer"></div></div>';
  filterPassOuts();

window.pagePassOuts=pagePassOuts;

function filterPassOuts(){
  const q=(document.getElementById('poSearch').value||'').toLowerCase();
  const status=document.getElementById('poStatusFilter').value||'';
  const range=document.getElementById('poRangeFilter').value||'';
  const students=window._passOutStudents||[];
  const studentsById={};students.forEach(s=>studentsById[s.id]=s);
  const classes=_classesCache||[];
  const classesById={};classes.forEach(c=>classesById[c.id]=c);
  const now=new Date();
  const startOfDay=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const startOfWeek=new Date(startOfDay);startOfWeek.setDate(startOfDay.getDate()-startOfDay.getDay());
  const startOfMonth=new Date(now.getFullYear(),now.getMonth(),1);
  const filtered=(window._allPassOuts||[]).filter(p=>{
    if(status&&p.status!==status)return false;
    if(range){
      const d=new Date(p.signed_out_at||0);
      if(range==='today'&&d<startOfDay)return false;
      if(range==='week'&&d<startOfWeek)return false;
      if(range==='month'&&d<startOfMonth)return false;
    }
    if(q){
      const s=studentsById[p.student_id]||{};
      const hay=((s.first_name||'')+' '+(s.last_name||'')+' '+(s.admission_no||'')+' '+(p.reason||'')).toLowerCase();
      if(hay.indexOf(q)===-1)return false;
    }
    return true;
  });
  window._filteredPassOuts=filtered;
  document.getElementById('poCount').textContent=(window._allPassOuts||[]).length+' total · '+filtered.length+' shown';
  const c=document.getElementById('poTableContainer');
  if(!filtered.length){c.innerHTML='<div class="empty">No records match.</div>';return;}
  let rows='';
  filtered.forEach(p=>{
    const s=studentsById[p.student_id]||{};
    const cls=classesById[s.class_id];
    rows+='<tr><td>'+esc(s.admission_no||'—')+'</td><td><b>'+esc((s.first_name||'')+' '+(s.last_name||''))+'</b></td><td>'+esc(cls?cls.name:'—')+'</td><td>'+esc(p.reason||'')+'</td><td>'+fmtDateTime(p.signed_out_at)+'</td><td>'+fmtDateTime(p.signed_in_at)+'</td><td>'+(p.status==='out'?'<span class="badge bad">OUT</span>':'<span class="badge ok">Returned</span>')+'</td><td>'+(p.status==='out'?'<button class="btn sm ok" onclick="returnPass(\''+p.id+'\')">Return</button>':'')+'</td></tr>';
  });
  c.innerHTML='<div class="table-wrap"><table><thead><tr><th>ADM</th><th>Pupil</th><th>Class</th><th>Reason</th><th>Out</th><th>In</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
window.filterPassOuts=filterPassOuts;

function printPassOuts(){
  const list=window._filteredPassOuts||window._allPassOuts||[];
  if(!list.length){toast('Nothing to print','bad');return;}
  const students=window._passOutStudents||[];
  const studentsById={};students.forEach(s=>studentsById[s.id]=s);
  const classes=_classesCache||[];
  const classesById={};classes.forEach(c=>classesById[c.id]=c);
  let rows='';
  list.forEach((p,i)=>{
    const s=studentsById[p.student_id]||{};
    rows+='<tr><td>'+(i+1)+'</td><td>'+esc(s.admission_no||'')+'</td><td>'+esc((s.first_name||'')+' '+(s.last_name||''))+'</td><td>'+esc(classesById[s.class_id]?.name||'')+'</td><td>'+esc(p.reason||'')+'</td><td>'+fmtDateTime(p.signed_out_at)+'</td><td>'+fmtDateTime(p.signed_in_at)+'</td><td>'+esc(p.status||'')+'</td></tr>';

  printSection('Pass Outs Report ('+list.length+' records)','<table><thead><tr><th>#</th><th>ADM</th><th>Pupil</th><th>Class</th><th>Reason</th><th>Out</th><th>In</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table>');

  sales.forEach((s,i)=>{total+=Number(s.total_amount||0);rows+='<tr><td>'+(i+1)+'</td><td>'+fmtDate(s.sold_at)+'</td><td>'+esc(s.item||'')+'</td><td>'+(s.quantity||1)+'</td><td>'+fmtNum(s.unit_price||0)+'</td><td style="text-align:right">'+fmtNum(s.total_amount||0)+'</td></tr>';});
  rows+='<tr style="background:#f1f5f9;font-weight:700"><td colspan="5" style="text-align:right">GRAND TOTAL</td><td style="text-align:right">'+fmtNum(total)+'</td></tr>';
  printSection('Uniform Sales ('+sales.length+' records)','<table><thead><tr><th>#</th><th>Date</th><th>Item</th><th>Qty</th><th>Unit Price</th><th style="text-align:right">Total</th></tr></thead><tbody>'+rows+'</tbody></table>');
}
window.printUniforms=printUniforms;

function addUniform(){
  modal('<h3>New Uniform Sale</h3><div><label>Item</label><input id="u_i" placeholder="Sweater"></div><div class="grid grid-2" style="margin-top:12px"><div><label>Quantity</label><input id="u_q" type="number" value="1"></div><div><label>Unit Price</label><input id="u_p" type="number" value="0"></div></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveUniform()">Save</button></div>');
}
window.addUniform=addUniform;

async function saveUniform(){
  const item=document.getElementById('u_i').value.trim();
  const quantity=Number(document.getElementById('u_q').value)||1;
  const unit_price=Number(document.getElementById('u_p').value)||0;
  if(!item){toast('Enter item','bad');return;}
  try{await rest('/rest/v1/uniform_sales',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,item,quantity,unit_price,total_amount:quantity*unit_price})});toast('Saved','ok');closeModal();nav('uniforms');}
  catch(e){toast(e.message,'bad');}
}
window.saveUniform=saveUniform;

/* ============ EXPENSES ============ */
async function pageExpenses(root){
  const cy=getCurrentYear(),ct=getCurrentTerm();
  let rows=await rest('/rest/v1/expenses?school_id=eq.'+_schoolId+'&select=*&order=spent_at.desc').catch(()=>[]);
  rows=rows.filter(e=>(e.year===cy||e.academic_year===cy)&&e.term===ct);
  window._allExpenses=rows;
  root.innerHTML='<div class="page-head"><div><h1>💸 Expenses</h1><div class="sub" id="expenseCount">'+cy+' Term '+ct+' · '+rows.length+' records</div></div><div style="display:flex;gap:8px"><button class="btn ghost" onclick="printExpenses()">🖨️ Print</button><button class="btn" onclick="addExpense()">＋ Add Expense</button></div></div><div class="card"><div class="grid grid-2" style="margin-bottom:12px"><input id="expenseSearch" placeholder="Search description, category…" oninput="filterExpenses()"><select id="expenseCategoryFilter" onchange="filterExpenses()"><option value="">All categories</option></select></div><div id="expenseTableContainer"></div></div>';
  const catSel=document.getElementById('expenseCategoryFilter');
  const cats=[...new Set(rows.map(e=>e.category).filter(Boolean))].sort();
  cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;catSel.appendChild(o);});
  filterExpenses();
}
window.pageExpenses=pageExpenses;

function filterExpenses(){
  const q=(document.getElementById('expenseSearch').value||'').toLowerCase();
  const fCat=document.getElementById('expenseCategoryFilter').value||'';
  const filtered=(window._allExpenses||[]).filter(e=>{
    if(fCat&&e.category!==fCat)return false;
    if(q){const hay=((e.description||'')+' '+(e.category||'')).toLowerCase();if(hay.indexOf(q)===-1)return false;}
    return true;
  });
  window._filteredExpenses=filtered;
  const total=filtered.reduce((s,x)=>s+Number(x.amount),0);
  document.getElementById('expenseCount').textContent=getCurrentYear()+' Term '+getCurrentTerm()+' · '+filtered.length+' shown · '+fmtUGX(total);
  const c=document.getElementById('expenseTableContainer');
  if(!filtered.length){c.innerHTML='<div class="empty">No expenses match.</div>';return;}
  let body='';
  filtered.forEach(e=>{body+='<tr><td>'+fmtDate(e.spent_at)+'</td><td>'+esc(e.description)+'</td><td>'+esc(e.category||'')+'</td><td style="text-align:right;font-weight:700;color:#b91c1c">'+fmtUGX(e.amount)+'</td></tr>';});
  body+='<tr style="background:#f1f5f9;font-weight:700"><td colspan="3" style="text-align:right">TOTAL</td><td style="text-align:right;color:#b91c1c">'+fmtUGX(total)+'</td></tr>';
  c.innerHTML='<div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right">Amount</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
window.filterExpenses=filterExpenses;

function printExpenses(){
  const rows=window._filteredExpenses||window._allExpenses||[];
  if(!rows.length){toast('Nothing to print','bad');return;}
  let body='';let total=0;
  rows.forEach((e,i)=>{total+=Number(e.amount);body+='<tr><td>'+(i+1)+'</td><td>'+fmtDate(e.spent_at)+'</td><td>'+esc(e.description)+'</td><td>'+esc(e.category||'')+'</td><td style="text-align:right">'+fmtNum(e.amount)+'</td></tr>';});
  body+='<tr style="background:#f1f5f9;font-weight:700"><td colspan="4" style="text-align:right">GRAND TOTAL</td><td style="text-align:right">'+fmtNum(total)+'</td></tr>';
  printSection('Expenses — '+getCurrentYear()+' Term '+getCurrentTerm(),'<table><thead><tr><th>#</th><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right">Amount</th></tr></thead><tbody>'+body+'</tbody></table>');
}
window.printExpenses=printExpenses;

function addExpense(){
  modal('<h3>Add Expense</h3><div><label>Description *</label><input id="x_d"></div><div style="margin-top:12px"><label>Amount *</label><input id="x_a" type="number"></div><div style="margin-top:12px"><label>Category</label><input id="x_c" placeholder="Utilities"></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveExpense()">Save</button></div>');
}
window.addExpense=addExpense;

async function saveExpense(){
  const description=document.getElementById('x_d').value.trim();
  const amount=Number(document.getElementById('x_a').value);
  const category=document.getElementById('x_c').value.trim();
  if(!description||!amount){toast('Fill required','bad');return;}
  const body={school_id:_schoolId,description,amount,category,year:getCurrentYear(),term:getCurrentTerm()};
  try{
    try{await rest('/rest/v1/expenses',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});}
    catch(e){body.academic_year=body.year;delete body.year;await rest('/rest/v1/expenses',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});}
    toast('Saved','ok');closeModal();nav('expenses');
  }catch(e){toast(e.message,'bad');}
}
window.saveExpense=saveExpense;

/* ============ MESSAGES ============ */
async function pageMessages(root){
  const msgs=await rest('/rest/v1/messages?school_id=eq.'+_schoolId+'&select=*&order=sent_at.desc&limit=200')||[];
  window._allMessages=msgs;
  root.innerHTML='<div class="page-head"><div><h1>💬 Messages</h1><div class="sub" id="messageCount">'+msgs.length+' messages</div></div><div style="display:flex;gap:8px"><button class="btn ghost" onclick="printMessages()">🖨️ Print</button><button class="btn" onclick="addMessage()">＋ New Message</button></div></div><div class="card"><input id="messageSearch" placeholder="Search contact or body…" oninput="filterMessages()" style="margin-bottom:12px"><div id="messageTableContainer"></div></div>';
  filterMessages();
}
window.pageMessages=pageMessages;

function filterMessages(){
  const q=(document.getElementById('messageSearch').value||'').toLowerCase();
  const filtered=(window._allMessages||[]).filter(m=>{
    if(!q)return true;
    return ((m.parent_contact||'')+' '+(m.body||'')).toLowerCase().indexOf(q)!==-1;
  });
  window._filteredMessages=filtered;
  document.getElementById('messageCount').textContent=(window._allMessages||[]).length+' total · '+filtered.length+' shown';
  const c=document.getElementById('messageTableContainer');
  if(!filtered.length){c.innerHTML='<div class="empty">No messages match.</div>';return;}
  let rows='';
  filtered.forEach(m=>{
    const wa=waLink(m.parent_contact);
    rows+='<tr><td>'+fmtDate(m.sent_at)+'</td><td>'+esc(m.parent_contact||'—')+'</td><td>'+esc(m.body)+'</td><td>'+(wa?'<a href="https://wa.me/'+wa+'" target="_blank" class="btn sm wa" style="text-decoration:none">💬</a>':'')+'</td></tr>';
  });
  c.innerHTML='<div class="table-wrap"><table><thead><tr><th>Date</th><th>To</th><th>Body</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
window.filterMessages=filterMessages;

function printMessages(){
  const msgs=window._filteredMessages||window._allMessages||[];
  if(!msgs.length){toast('Nothing to print','bad');return;}
  let rows='';
  msgs.forEach((m,i)=>{rows+='<tr><td>'+(i+1)+'</td><td>'+fmtDateTime(m.sent_at)+'</td><td>'+esc(m.parent_contact||'')+'</td><td>'+esc(m.body)+'</td></tr>';});
  printSection('Messages Log ('+msgs.length+')','<table><thead><tr><th>#</th><th>Date</th><th>To</th><th>Body</th></tr></thead><tbody>'+rows+'</tbody></table>');
}
window.printMessages=printMessages;

function addMessage(){
  modal('<h3>New Message</h3><div><label>Parent Contact</label><input id="m_c" placeholder="+256..."></div><div style="margin-top:12px"><label>Body</label><textarea id="m_b" rows="4"></textarea></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveMessage()">Save</button></div>');
}
window.addMessage=addMessage;

async function saveMessage(){
  const parent_contact=document.getElementById('m_c').value.trim();
  const body=document.getElementById('m_b').value.trim();
  if(!body){toast('Enter body','bad');return;}
  try{await rest('/rest/v1/messages',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,parent_contact,body})});toast('Saved','ok');closeModal();nav('messages');}
  catch(e){toast(e.message,'bad');}
}
window.saveMessage=saveMessage;

/* ============ SETTINGS ============ */
async function pageSettings(root){
  root.innerHTML='<div class="page-head"><div><h1>⚙️ Settings</h1><div class="sub">School information</div></div><button class="btn ghost" onclick="printSettings()">🖨️ Print</button></div><div class="card"><h3>School Info</h3><div class="grid grid-2"><div><label>Name</label><input id="s_name" value="'+esc(_school?.name||'')+'"></div><div><label>Telephone</label><input id="s_phone" value="'+esc(_school?.telephone||'')+'"></div><div><label>Address</label><input id="s_addr" value="'+esc(_school?.address||'')+'"></div><div><label>Head Teacher</label><input id="s_head" value="'+esc(_school?.head_teacher||'')+'"></div></div><div style="margin-top:12px"><label>Logo URL</label><input id="s_logo" value="'+esc(_school?.logo_url||'')+'"></div><button class="btn" style="margin-top:14px" onclick="saveSchool()">💾 Save</button></div><div class="card"><h3>Account</h3><div class="muted">Signed in as <b>'+esc(_profile?.full_name||'')+'</b> ('+esc(_profile?.email||'')+')</div><div class="muted" style="margin-top:6px">Role: <b>'+esc(_role||'')+'</b></div><button class="btn danger" style="margin-top:12px" onclick="doLogout()">Sign Out</button></div>';
}
window.pageSettings=pageSettings;

function printSettings(){
  const s=_school||{};
  const rows='<tr><td><b>School Name</b></td><td>'+esc(s.name||'')+'</td></tr><tr><td><b>Address</b></td><td>'+esc(s.address||'')+'</td></tr><tr><td><b>Telephone</b></td><td>'+esc(s.telephone||'')+'</td></tr><tr><td><b>Head Teacher</b></td><td>'+esc(s.head_teacher||'')+'</td></tr><tr><td><b>Email</b></td><td>'+esc(s.email||'')+'</td></tr>';
  printSection('School Information','<table><tbody>'+rows+'</tbody></table>');
}
window.printSettings=printSettings;

async function saveSchool(){
  const body={name:document.getElementById('s_name').value.trim(),telephone:document.getElementById('s_phone').value.trim(),address:document.getElementById('s_addr').value.trim(),head_teacher:document.getElementById('s_head').value.trim(),logo_url:document.getElementById('s_logo').value.trim()};
  try{await rest('/rest/v1/schools?id=eq.'+_schoolId,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});_school=Object.assign(_school,body);renderHeader();toast('Saved','ok');}
  catch(e){toast(e.message,'bad');}
}
window.saveSchool=saveSchool;

/* ============================================================
   INIT
   ============================================================ */
if(getUser()&&getToken()){boot();}
</script>
