*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:'Inter',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:all .15s}
input,select,textarea{font-family:inherit;width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--text);font-size:14px}

label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:6px;font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line2);font-size:13.5px}
th{color:#fff;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;background:var(--navy)}
tbody tr:hover{background:#f9fafb}
h1{font-size:20px;font-weight:700;margin:0 0 4px;color:var(--navy)}
h3{font-size:15px;font-weight:700;margin:0 0 12px;color:var(--navy)}
.muted{color:var(--muted);font-size:12.5px}
.topbar{position:fixed;top:0;left:0;right:0;height:48px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 12px;z-index:100;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar .title{flex:1;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}

.topbar .icon-btn:hover{background:rgba(255,255,255,.1)}
.topbar .icon-btn .dot{position:absolute;top:2px;right:2px;min-width:15px;height:15px;padding:0 3px;border-radius:999px;background:#dc2626;color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;line-height:1}
#app{min-height:100vh;padding-top:48px;padding-bottom:90px;background:var(--bg)}
.container{max-width:1100px;margin:0 auto;padding:0 12px}
.header-wrap{padding:12px}
.header-card{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 24px -8px rgba(10,37,64,.4)}
.header-top{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px}

.exit-chip{background:#dc2626;color:#fff;font-size:10.5px;font-weight:700;padding:4px 12px;border-radius:999px;text-transform:uppercase;cursor:pointer}
.header-school{display:flex;align-items:flex-start;gap:10px;font-size:16px;font-weight:800;margin-bottom:8px;text-transform:uppercase}
.header-school .logo{width:44px;height:44px;border-radius:10px;background:var(--gold);display:grid;place-items:center;font-size:20px;flex-shrink:0;color:var(--navy);overflow:hidden}
.header-school .logo img{width:100%;height:100%;object-fit:cover}
.header-meta{font-size:12.5px;color:#cbd5e1;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.header-meta .sep{opacity:.5}
.header-datetime{font-size:12.5px;color:#cbd5e1;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.header-periods{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.header-period{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;color:#fff}
.header-period select{background:transparent;color:#fff;border:none;padding:0 4px;font-size:12px;font-weight:700;width:auto;cursor:pointer}
.header-period select option{color:var(--navy)}
.header-search{position:relative}
.header-search input{background:#fff;border:none;border-radius:999px;padding:13px 20px 13px 46px;font-size:13.5px;box-shadow:0 4px 12px rgba(0,0,0,.15)}

.nav-pills{display:flex;gap:8px;padding:12px 0 4px;overflow-x:auto;scrollbar-width:none}
.nav-pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;background:#fff;color:var(--navy);font-size:12.5px;font-weight:600;border:1.5px solid var(--line);white-space:nowrap;cursor:pointer}
.pill.active{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:3px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.04);margin-bottom:14px}
.grid{display:grid;gap:12px}
.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

.kpi{background:#fff;border-radius:var(--radius);padding:18px 14px;box-shadow:0 2px 8px rgba(15,23,42,.05);border-top:3px solid var(--gold);text-align:center}

.kpi.kpi-ok{border-top-color:var(--ok)}.kpi.kpi-ok .v{color:#065f46}
.kpi.kpi-bad{border-top-color:var(--bad)}.kpi.kpi-bad .v{color:#7f1d1d}
.kpi.kpi-warn{border-top-color:var(--warn)}.kpi.kpi-warn .v{color:#78350f}
.kpi.kpi-navy{border-top-color:var(--navy)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--oksoft);color:#047857;border:1px solid #a7f3d0}
.badge.bad{background:var(--badsoft);color:#b91c1c;border:1px solid #fecaca}
.badge.info{background:var(--brandsoft);color:var(--navy);border:1px solid #c7d2fe}
.badge.warn{background:var(--warnsoft);color:#92400e;border:1px solid #fde68a}
.badge.req{background:#e0e7ff;color:#3730a3;border:1px solid #a5b4fc}
.badge.navy{background:#0a2540;color:#fff;border:1px solid #0a2540}
.btn{background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--navy3)}
.btn:disabled{opacity:.5}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn.ghost:hover{background:#f8fafc;border-color:var(--navy)}
.btn.danger{background:var(--bad)}
.btn.ok{background:var(--ok)}
.btn.gold{background:var(--gold);color:#fff}
.btn.sm{padding:6px 12px;font-size:11.5px;border-radius:999px}
.btn.block{width:100%}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:6px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;z-index:1000;font-size:13px;font-weight:500;box-shadow:0 20px 40px -12px rgba(10,37,64,.5);max-width:90vw;text-align:center}
.toast.bad{background:#7f1d1d}.toast.ok{background:#065f46}
.auth-bg{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),#2c5282);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;overflow:auto}
.auth-card{background:#fff;border-radius:20px;padding:30px 26px;width:100%;max-width:440px;box-shadow:0 40px 80px -20px rgba(0,0,0,.5);margin:auto}
.auth-card .logo{width:66px;height:66px;border-radius:16px;background:linear-gradient(135deg,var(--navy),#2c5282);display:grid;place-items:center;color:var(--gold);font-weight:800;font-size:26px;margin:0 auto 14px;overflow:hidden}
.auth-card .logo img{width:100%;height:100%;object-fit:cover}
.auth-card h1{text-align:center;font-size:19px;margin:0 0 6px}
.auth-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}
.err{background:var(--badsoft);border:1px solid #fecaca;color:#b91c1c;padding:11px 14px;border-radius:10px;margin-top:14px;font-size:13px}
.ok{background:var(--oksoft);border:1px solid #a7f3d0;color:#047857;padding:11px 14px;border-radius:10px;margin-top:14px;font-size:13px}
.loading{padding:60px;text-align:center;color:var(--muted)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(10,37,64,.6);display:flex;align-items:flex-end;justify-content:center;z-index:150;backdrop-filter:blur(2px)}
@media(min-width:640px){.modal-bg{align-items:center;padding:16px}}
.modal{background:#fff;border-radius:20px 20px 0 0;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:22px}
@media(min-width:640px){.modal{border-radius:20px}}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line2);flex-wrap:wrap}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:90;box-shadow:0 -4px 16px rgba(10,37,64,.08)}
.bottom-bar-inner{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:1100px;margin:0 auto}
.bottom-bar-inner::-webkit-scrollbar{display:none}
.bottom-bar .pill{background:var(--navy);color:#fff;border-color:var(--navy);padding:9px 14px;font-size:12px}
.bottom-bar .pill.active{background:var(--gold);border-color:var(--gold);color:#fff}
.wa-float{position:fixed;bottom:96px;right:16px;background:#25D366;color:#fff;width:52px;height:52px;border-radius:50%;z-index:99;text-decoration:none;box-shadow:0 10px 20px rgba(0,0,0,.25);display:grid;place-items:center;font-size:22px}
.profile-hero{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;border-radius:16px;padding:20px;margin-bottom:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.profile-hero .avatar{width:64px;height:64px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:26px;font-weight:800;flex-shrink:0;overflow:hidden}
.profile-hero .avatar img{width:100%;height:100%;object-fit:cover}
.profile-hero .info{flex:1;min-width:200px}
.profile-hero .info h1{color:#fff;font-size:20px;margin:0 0 4px}
.profile-hero .info .meta{color:#cbd5e1;font-size:12.5px;line-height:1.6}
.tabs-bar{display:flex;gap:6px;overflow-x:auto;padding:4px 0;border-bottom:2px solid var(--line);margin-bottom:14px;scrollbar-width:none}
.tabs-bar::-webkit-scrollbar{display:none}
.tabs-bar button{flex:0 0 auto;padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs-bar button.active{color:var(--navy);border-bottom-color:var(--gold)}
.mini-stat{display:inline-block;padding:6px 12px;background:#f1f5f9;border-radius:8px;font-size:12px;font-weight:600;color:var(--navy);margin:2px 4px 2px 0}
.alert-item{display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;background:#fff;border-left:4px solid var(--gold);margin-bottom:8px;font-size:13px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.alert-item.danger{border-left-color:var(--bad)}
.alert-item.ok{border-left-color:var(--ok)}
.alert-item.info{border-left-color:#2c5282}
.alert-item .ico{font-size:20px}
.alert-item .txt{flex:1}

.lin-chip{display:inline-flex;align-items:center;gap:6px;background:#fef3c7;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:4px 10px;font-family:ui-monospace,monospace;font-weight:800;font-size:12.5px;letter-spacing:.05em;cursor:pointer}
.lin-chip:hover{background:#fde68a}
.lin-chip::after{content:'📋';font-size:11px;opacity:.7}
.notice{background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:12px;padding:14px 16px;margin-bottom:10px;position:relative;cursor:pointer}
.notice.high{border-left-color:var(--gold);background:#fffdf5}

.rc-info{width:100%;border-collapse:collapse;margin:10px 0;background:#fff;border-radius:12px;overflow:hidden}
.rc-info td{padding:9px 12px;font-size:12.5px;border:1px solid var(--line2)}

.rc-sign div{flex:1;min-width:140px;border-top:1px solid #333;padding-top:6px}
.holiday-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line2)}

.holiday-row .info .tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.status-banner{margin-top:14px;padding:12px 14px;border-radius:12px;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600;line-height:1.5;color:#fff;border:1px solid rgba(255,255,255,.25)}

.status-banner .txt small{display:block;font-size:11.5px;font-weight:500;opacity:.9;margin-top:2px}
</style>
</head>

/* ============================================================
   DUPLICATE DETECTION
   Rule: same name + same DOB (if both present) + same parent name (if both present)
         + same parent phone (if both present)
   ============================================================ */
function normalizeName(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');}
function normalizePhone(s){return String(s||'').replace(/[^0-9+]/g,'').replace(/^\+?256/,'0').replace(/^\+?0*/,'0');}
function normalizeDob(s){return String(s||'').trim().slice(0,10);}
function findDuplicateLocal(candidate,excludeId){
  const list=_allStudents||[];
  const fn=normalizeName(candidate.first_name);
  const ln=normalizeName(candidate.last_name);
  const dp=normalizeDob(candidate.dob||candidate.date_of_birth);
  const pn=normalizeName(candidate.parent_name);
  const pc=normalizePhone(candidate.parent_contact);
  return list.find(s=>{
    if(excludeId && s.id===excludeId)return false;
    if(normalizeName(s.first_name)!==fn)return false;
    if(ln && normalizeName(s.last_name)!==ln)return false;
    if(dp && s.date_of_birth && normalizeDob(s.date_of_birth)!==dp)return false;
    if(pn && s.parent_name && normalizeName(s.parent_name)!==pn)return false;
    if(pc && s.parent_contact && normalizePhone(s.parent_contact)!==pc)return false;
    return true;
  });
}

function defaultGradingSystem(){
  return [
    {code:'D1',min:90,max:100,remark:'Distinction 1'},
    {code:'D2',min:80,max:89,remark:'Distinction 2'},
    {code:'C3',min:70,max:79,remark:'Credit 3'},

    {code:'P7',min:45,max:49,remark:'Pass 7'},
    {code:'P8',min:40,max:44,remark:'Pass 8'},
    {code:'F9',min:0,max:39,remark:'Fail 9'}
  ];
}
function currentGrading(){
  if(_school && _school.grading_system){
    let gs=_school.grading_system;
    if(typeof gs==='string'){try{gs=JSON.parse(gs);}catch(e){gs=null;}}
    if(Array.isArray(gs) && gs.length) return gs;
  }
  return defaultGradingSystem();
}
function gradeClsFor(code){
  const c=String(code||'').toUpperCase();
  if(c.startsWith('D'))return 'ok';
  if(c.startsWith('C'))return 'info';
  if(c.startsWith('P'))return 'warn';
  if(c.startsWith('F'))return 'bad';
  return 'info';
}
function gradeOf(score){
  if(score==null||isNaN(score)||score==='')return{g:'—',r:'—',cls:''};
  const s=Number(score);
  const gs=currentGrading();
  for(const g of gs){
    if(s>=Number(g.min)&&s<=Number(g.max)){
      return {g:g.code,r:g.remark||g.code,cls:gradeClsFor(g.code)};
    }
  }
  return {g:'—',r:'—',cls:''};
}
function ordinal(n){if(!n)return '—';if(n===1)return '1st';if(n===2)return '2nd';if(n===3)return '3rd';return n+'th';}
function autoComment(avg,fn){
  const f=fn||'Pupil';
  const gs=currentGrading();
  const g=gradeOf(avg);
  if(!g.g||g.g==='—')return 'No scores recorded.';
  return f+' attained '+g.g+' ('+g.r+').';
}
function gradeKeyHTML(){
  return '<div class="gc-key"><b>Grading Scale:</b> '+currentGrading().map(g=>g.code+' ('+g.min+'-'+g.max+')').join(' · ')+'</div>';
}

    if(t)await fetch(SUPA_URL+'/auth/v1/logout',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+t}});
  }catch(e){}
  setSession(null);
  SESSION=null;_profile=null;_school=null;_schoolId=null;_role=null;
  _classesCache=null;_staffCache=null;_allStudents=[];
  document.getElementById('app').style.display='none';
  document.getElementById('authScreen').style.display='flex';
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  if(isInAppBrowser())document.getElementById('webviewWarn').style.display='block';
  const user=getUser(),token=getToken();
  if(!user||!token){
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('app').style.display='none';
    return;
  }
  SESSION=user;
  const errEl=document.getElementById('loginErr');
  try{
    const p=await rest('/rest/v1/profiles?id=eq.'+user.id+'&select=*');
    _profile=p&&p[0];
    if(!_profile)throw new Error('Profile not found for this account.');
    _schoolId=_profile.school_id;
    _role=_profile.role;
    if(!_schoolId)throw new Error('Your account is not linked to a school. Contact Eudes Media on WhatsApp +254757208077.');
    const sc=await rest('/rest/v1/schools?id=eq.'+_schoolId+'&select=*');
    _school=sc&&sc[0];
    if(!_school)throw new Error('School record not found.');
    if(!_school.is_approved)throw new Error('School pending approval. Contact Eudes Media on WhatsApp +254757208077.');
  }catch(e){
    errEl.textContent=e.message;
    errEl.style.display='block';
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('app').style.display='none';
    return;
  }
  document.getElementById('authScreen').style.display='none';
  document.getElementById('app').style.display='block';
  populateTermSelector();
  renderHeader();
  renderAuthLogo();
  renderNav();
  renderBottomBar();
  tickClock();
  setInterval(tickClock,30000);
  loadNoticesCount();setInterval(loadNoticesCount,60000);
  loadParentMsgCount();setInterval(loadParentMsgCount,60000);
  loadUpcomingHolidays();
  await nav('dashboard');
}

function populateTermSelector(){
  const ySel=document.getElementById('termYearSelect');
  const tSel=document.getElementById('termTermSelect');
  if(!ySel||!tSel)return;
  const cy=getCurrentYear(),ct=getCurrentTerm();
  const currentYear=new Date().getFullYear();
  const years=[];
  for(let y=currentYear-2;y<=currentYear+1;y++)years.push(y);
  if(!years.includes(cy))years.push(cy);
  years.sort((a,b)=>b-a);
  ySel.innerHTML=years.map(y=>'<option value="'+y+'"'+(y===cy?' selected':'')+'>'+y+'</option>').join('');
  tSel.value=ct;
}

async function nav(route){
  if(!ROUTES[route]){toast('Page not found','bad');return;}
  activeRoute=route;
  renderNav();
  renderBottomBar();
  const main=document.getElementById('main');
  main.innerHTML='<div class="loading">Loading…</div>';
  window.scrollTo({top:0,behavior:'smooth'});
  try{
    await ROUTES[route].render(main);

    main.innerHTML='<div class="card"><h3>Error</h3><p class="muted">'+esc(e.message)+'</p><button class="btn ghost" onclick="nav(\''+route+'\')">Retry</button></div>';

function filterStudentsTable(q,fClass){
  q=(q||'').toLowerCase();
  fClass=fClass||'';
  window._stFilterSearch=q;
  const fFunc=document.getElementById('studentFuncFilter')?.value||'';
  const fGender=document.getElementById('studentGenderFilter')?.value||'';
  const classes=_classesCache||[];
  const paid=window._paidByStudent||{};
  const openMap=window._openPassOuts||{};
  const filtered=(_allStudents||[]).filter(s=>{
    if(fClass&&s.class_id!==fClass)return false;
    if(fGender&&s.gender!==fGender)return false;
    if(fFunc==='out'&&!openMap[s.id])return false;
    if(fFunc==='nolin'&&s.lin)return false;
    if(q){
      const hay=(s.first_name+' '+(s.last_name||'')+' '+s.admission_no+' '+(s.lin||'')+' '+(s.parent_name||'')+' '+(s.parent_contact||'')).toLowerCase();
      if(hay.indexOf(q)===-1)return false;
    }
    return true;
  });
  window._filteredStudents=filtered;
  document.getElementById('studentCount').textContent=_allStudents.length+' total · '+filtered.length+' shown';
  const c=document.getElementById('studentsTableContainer');
  if(!filtered.length){c.innerHTML='<div class="empty">No pupils.</div>';return;}
  c.innerHTML='<div class="table-wrap"><table><thead><tr><th>Adm No</th><th>Name</th><th>Sex</th><th>Class</th><th>LIN</th><th>Parent</th><th>Balance</th><th></th></tr></thead><tbody>'+
    filtered.map(s=>{
      const cls=(classes||[]).find(x=>x.id===s.class_id);
      const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);
      const p=paid[s.id]||{school:0};
      const bal=sf-p.school;
      const openPO=openMap[s.id];
      const outBadge=openPO?' <span class="badge" style="background:#dc2626;color:#fff;border-color:#991b1b">🚪 OUT</span>':'';
      const linCell=s.lin?'<span class="lin-chip" onclick="event.stopPropagation();copyLin(\''+esc(s.lin)+'\')">'+esc(s.lin)+'</span>':'<span class="badge warn">—</span>';
      const sexCell=s.gender==='female'?'<span class="badge" style="background:#fce7f3;color:#9d174d">♀ F</span>':(s.gender==='male'?'<span class="badge info">♂ M</span>':'<span class="badge warn">—</span>');
      return '<tr style="'+(openPO?'background:#fef3c7':'')+'">'+
        '<td><b>'+esc(s.admission_no)+'</b></td>'+
        '<td><b>'+esc(s.first_name+' '+(s.last_name||''))+'</b>'+(s.qr_code?' <span class="badge info">🎫</span>':'')+outBadge+'</td>'+
        '<td>'+sexCell+'</td>'+
        '<td><span class="badge info">'+esc(cls?cls.name:'—')+'</span></td>'+
        '<td>'+linCell+'</td>'+
        '<td>'+esc(s.parent_name||'—')+'</td>'+

function checkLiveDuplicate(){
  const warn=document.getElementById('s_dupWarn');
  const btn=document.getElementById('s_saveBtn');
  if(!warn)return;
  const candidate={
    first_name:document.getElementById('s_fn')?.value||'',
    last_name:document.getElementById('s_ln')?.value||'',
    dob:document.getElementById('s_dob')?.value||'',
    parent_name:document.getElementById('s_parent_name')?.value||'',
    parent_contact:document.getElementById('s_parent_contact')?.value||''
  };
  if(!candidate.first_name){warn.style.display='none';if(btn)btn.disabled=false;return;}
  const dup=findDuplicateLocal(candidate);
  if(dup){
    warn.style.display='block';
    warn.innerHTML='<div class="err" style="line-height:1.7"><b>⚠️ Possible duplicate detected</b><br>'+
      'An existing pupil matches: <b>'+esc(dup.first_name+' '+(dup.last_name||''))+'</b> — '+esc(dup.admission_no)+' — LIN '+esc(dup.lin||'—')+
      '<br><br><button class="btn sm ghost" onclick="closeModal();openProfile(\''+dup.id+'\')">Open existing pupil</button></div>';
    if(btn)btn.disabled=true;
  } else {
    warn.style.display='none';
    if(btn)btn.disabled=false;
  }
}
async function saveNewStudent(ev){
  const adm=document.getElementById('s_adm').value.trim();
  const fn=document.getElementById('s_fn').value.trim();
  const ln=document.getElementById('s_ln').value.trim()||null;
  const dob=document.getElementById('s_dob').value||null;
  const pc=document.getElementById('s_parent_contact').value.trim()||null;
  const pn=document.getElementById('s_parent_name').value.trim()||null;
  const gender=document.getElementById('s_gender').value||'male';
  if(!adm||!fn){toast('Admission and Name required','bad');return;}
  const dup=findDuplicateLocal({first_name:fn,last_name:ln,dob,parent_name:pn,parent_contact:pc});
  if(dup){toast('Duplicate pupil detected: '+dup.admission_no,'bad');return;}
  const btn=ev?.target;
  if(btn)btn.disabled=true;
  const lin=document.getElementById('s_lin').value.trim()||generateLIN(fn);
  const gn=id=>{const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;};
  const bf=gn('s_balance_bf'),af=gn('s_actual_fee'),tf=gn('s_transport_fee');
  let ff=gn('s_functional_fee');if(ff===0)ff=FUNC_FEE_DEFAULT;
  const tot=bf+af+tf;
  try{
    await insertStudentWithRetry({
      school_id:_schoolId,admission_no:adm,first_name:fn,lin,last_name:ln,
      date_of_birth:dob,
      class_id:document.getElementById('s_class').value,
      boarding_status:document.getElementById('s_boarding').value,
      gender:gender,
      parent_name:pn,parent_contact:pc,
      balance_bf:bf,actual_fee:af,functional_fee:ff,transport_fee:tf,
      functional_fee_paid:0,functional_fee_status:'pending',
      total_expected:tot,current_balance:tot,status:'active',
      qr_code:'STU-'+Date.now()
    });
    toast('Registered · LIN: '+lin,'ok');
    closeModal();
    nav('students');
  }catch(e){toast(e.message,'bad');}
  if(btn)btn.disabled=false;
}

async function updateStudent(id){

  const fpaid=gn('e_functional_fee_paid');
  const tot=bf+af+tf;
  const fn=document.getElementById('e_fn').value.trim();
  const ln=document.getElementById('e_ln').value.trim()||null;
  const dob=document.getElementById('e_dob').value||null;
  const pn=document.getElementById('e_parent_name').value.trim()||null;
  const pc=document.getElementById('e_parent_contact').value.trim()||null;

      functional_fee_status:document.getElementById('e_func_status').value,
      total_expected:tot,

async function pageNotices(root){
  root.innerHTML='<div class="loading">Loading…</div>';
  try{
    const notices=await rest('/rest/v1/announcements?school_id=eq.'+_schoolId+'&select=*&order=published_at.desc&limit=200').catch(()=>[]);
    window._allNotices=notices||[];
    const order={urgent:0,high:1,normal:2};
    const sorted=(notices||[]).slice().sort((a,b)=>{
      const p=(order[a.priority]||2)-(order[b.priority]||2);
      if(p)return p;
      return new Date(b.published_at||0)-new Date(a.published_at||0);
    });
    const unread=sorted.filter(n=>!isNoticeRead(n.id));
    root.innerHTML='<div class="page-head"><div><h1>📢 Notices</h1><div class="sub">'+sorted.length+' total · '+unread.length+' unread</div></div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
      (unread.length?'<button class="btn ok" onclick="markAllNoticesRead()">✅ Mark all read</button>':'')+
      '<button class="btn ghost" onclick="nav(\'notices\')">🔄 Refresh</button>'+
      '</div></div>'+
      (sorted.length?sorted.map(n=>{
        const cls=n.priority==='urgent'?'urgent':n.priority==='high'?'high':'';
        const badge=n.priority==='urgent'?'<span class="badge bad">🚨 Urgent</span>':n.priority==='high'?'<span class="badge warn">⚠️ Important</span>':'<span class="badge info">📌 Notice</span>';
        const read=isNoticeRead(n.id);
        return '<div class="notice '+cls+'" style="'+(read?'opacity:.72':'')+'" onclick="markNoticeRead(\''+n.id+'\')">'+
          (read?'':'<span class="unread-dot"></span>')+
          '<div class="hd"><h4>'+esc(n.title||'Notice')+'</h4><span class="when">'+fmtLongDate(n.published_at)+'</span></div>'+
          '<div class="body">'+esc(n.body||'')+'</div>'+
          '<div class="tags">'+badge+(n.audience==='class'?'<span class="badge info">🎓 Class-specific</span>':'')+(n.audience==='parents'?'<span class="badge info">👨‍👩‍👧 Parents only</span>':'')+'</div></div>';
      }).join(''):'<div class="card"><div class="empty">📭 No notices yet.</div></div>');
  }catch(e){root.innerHTML='<div class="card"><div class="empty">Error: '+esc(e.message)+'</div></div>';}
}

async function saveGradingSystem(){
  const rows=[...document.querySelectorAll('.gs-input')];
  const map={};
  rows.forEach(inp=>{const i=Number(inp.dataset.i);if(!map[i])map[i]={};map[i][inp.dataset.f]=inp.value;});
  const gs=Object.keys(map).map(k=>{
    const g=map[k];
    return {code:String(g.code||'').trim().toUpperCase(),min:Number(g.min)||0,max:Number(g.max)||0,remark:String(g.remark||'').trim()};
  }).filter(g=>g.code);
  gs.sort((a,b)=>b.min-a.min);
  let prev=101;
  for(const g of gs){
    if(g.min>g.max){toast('Invalid range for '+g.code,'bad');return;}
    if(g.max>=prev){toast('Ranges overlap at '+g.code,'bad');return;}
    prev=g.min;
  }
  if(gs.length&&gs[gs.length-1].min>0){toast('Lowest grade must start at 0','bad');return;}
  if(gs.length&&gs[0].max<100){toast('Highest grade must reach 100','bad');return;}
  try{
    await rest('/rest/v1/schools?id=eq.'+_schoolId,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({grading_system:gs})});
    _school.grading_system=gs;
    toast('Grading saved','ok');
    nav('settings');
  }catch(e){toast(e.message,'bad');}
}

function resetFeesFilters(){
  const a=document.getElementById('feesClassFilter');if(a)a.value='';

  filterFeesTable();

function filterFeesTable(){
  const fc=document.getElementById('feesClassFilter')?.value||'';
  const m=document.getElementById('feesOwingFilter')?.value||'all';
  const paid=window._paidByStudentFees||{};
  const tab=_feesTab;
  let list=(window._allFeeStudents||[]).slice();
  if(fc)list=list.filter(s=>s.class_id===fc);
  if(tab==='school'){
    if(m==='owing')list=list.filter(s=>{const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);return (sf-((paid[s.id]||{school:0}).school))>0;});
    if(m==='paid')list=list.filter(s=>{const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);return (sf-((paid[s.id]||{school:0}).school))<=0;});
  } else {
    if(m!=='all')list=list.filter(s=>(s.functional_fee_status||'pending')===m);
  }
  const c=document.getElementById('feesTableContainer');
  if(!list.length){c.innerHTML='<div class="empty">No match.</div>';return;}
  if(tab==='school'){
    c.innerHTML='<div class="table-wrap"><table><thead><tr><th>Adm</th><th>Name</th><th>Class</th><th style="text-align:right">Exp</th><th style="text-align:right">Paid</th><th style="text-align:right">Bal</th><th></th></tr></thead><tbody>'+
      list.map(s=>{
        const cls=(window._allClassesForFees||[]).find(c=>c.id===s.class_id);
        const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);
        const p=paid[s.id]||{school:0};
        const bal=sf-p.school;
        return '<tr><td><b>'+esc(s.admission_no)+'</b></td><td>'+esc(s.first_name+' '+(s.last_name||''))+'</td><td><span class="badge info">'+esc(cls?cls.name:'—')+'</span></td><td style="text-align:right">'+sf.toLocaleString()+'</td><td style="text-align:right;color:#047857">'+p.school.toLocaleString()+'</td><td style="text-align:right"><span class="badge '+(bal>0?'bad':'ok')+'">'+bal.toLocaleString()+'</span></td><td><button class="btn sm" onclick="recordPayment(\''+s.id+'\')">💵</button></td></tr>';
      }).join('')+'</tbody></table></div>';
  } else {
    c.innerHTML='<div class="table-wrap"><table><thead><tr><th>Adm</th><th>Name</th><th style="text-align:right">Exp</th><th style="text-align:right">Paid</th><th>Status</th><th></th></tr></thead><tbody>'+
      list.map(s=>{
        const expected=Number(s.functional_fee)||FUNC_FEE_DEFAULT;

      }).join('')+'</tbody></table></div>';
  }

  }

function exportFeesToExcel(){
  if(!window.XLSX){toast('Excel not loaded','bad');return;}
  const list=window._allFeeStudents||[];
  const paid=window._paidByStudentFees||{};
  const classes=window._allClassesForFees||[];
  if(!list.length){toast('No data','bad');return;}
  const data=list.map(s=>{
    const cls=classes.find(c=>c.id===s.class_id);
    const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);
    const p=paid[s.id]||{school:0};
    const fp=Number(s.functional_fee_paid)||p.func||0;
    return {'Adm No':s.admission_no,'LIN':s.lin||'','Name':s.first_name+' '+(s.last_name||''),'Class':cls?cls.name:'','Expected':sf,'Paid':p.school,'Balance':sf-p.school,'Func Paid':fp};
  });
  const ws=XLSX.utils.json_to_sheet(data);

async function recordPayment(id,preselectFor){
  const [st,pays]=await Promise.all([rest('/rest/v1/students?id=eq.'+id+'&select=*'),rest('/rest/v1/payments?student_id=eq.'+id+'&select=amount,payment_for').catch(()=>[])]);

async function savePayment(id){
  const pf=document.getElementById('p_for').value;
  const amt=parseFloat(document.getElementById('p_amount').value);
  const method=document.getElementById('p_method').value;
  const txn=(document.getElementById('p_txn')?.value||'').trim();
  const dv=document.getElementById('p_date').value;
  const nt=document.getElementById('p_notes').value.trim();
  if(!amt||amt<=0){toast('Invalid amount','bad');return;}
  if(method!=='Cash'&&!txn){toast('Txn ID required','bad');return;}
  try{
    await rest('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,student_id:id,amount:amt,payment_for:pf,payment_method:method,transaction_id:txn||null,notes:nt||null,paid_at:new Date(dv).toISOString(),academic_year:getCurrentYear(),term:getCurrentTerm()})});
    const [st,pays]=await Promise.all([rest('/rest/v1/students?id=eq.'+id+'&select=total_expected,functional_fee'),rest('/rest/v1/payments?student_id=eq.'+id+'&select=amount,payment_for')]);
    const te=Number(st[0].total_expected)||0;
    const ff=Number(st[0].functional_fee)||FUNC_FEE_DEFAULT;
    const sp=pays.filter(p=>p.payment_for!=='Functional Fees').reduce((s,p)=>s+Number(p.amount),0);
    const fp=pays.filter(p=>p.payment_for==='Functional Fees').reduce((s,p)=>s+Number(p.amount),0);
    const upd={current_balance:te-sp,functional_fee_paid:fp};
    if(pf==='Functional Fees'&&fp>=ff)upd.functional_fee_status='cash';
    await rest('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify(upd)});
    toast('Saved · '+fmtUGX(amt),'ok');
    closeModal();
    nav(activeRoute);
  }catch(e){toast(e.message,'bad');}
}

let _qrScanner=null;
async function startQRScanner(onScan){
  if(_qrScanner){try{await _qrScanner.stop();}catch(e){}_qrScanner=null;}
  const container=document.getElementById('qrScannerBox');
  if(!container){toast('Scanner container missing','bad');return;}
  container.innerHTML='';
  _qrScanner=new Html5Qrcode("qrScannerBox");
  let lastCode='';let lastTime=0;
  try{
    await _qrScanner.start({facingMode:'environment'},{fps:12,qrbox:{width:260,height:260}},async decoded=>{
      const now=Date.now();
      if(decoded===lastCode&&now-lastTime<2000)return;
      lastCode=decoded;lastTime=now;
      try{await onScan(decoded);}catch(e){console.warn(e);}
    },()=>{});
  }catch(e){
    const msg=(e&&e.message)?e.message:'unknown';
    toast('Camera: '+msg,'bad');
  }
}
async function stopQRScanner(){if(_qrScanner){try{await _qrScanner.stop();}catch(e){}_qrScanner=null;}}
async function lookupQR(code){
  code=(code||'').trim();
  if(!code)return null;
  const st=(await rest('/rest/v1/students?school_id=eq.'+_schoolId+'&qr_code=eq.'+encodeURIComponent(code)+'&select=id,first_name,last_name,admission_no,class_id,status,lin,gender').catch(()=>[]))[0];
  if(st)return {type:'student',student:st,code};
  const sf=(await rest('/rest/v1/staff?school_id=eq.'+_schoolId+'&qr_code=eq.'+encodeURIComponent(code)+'&select=id,full_name,role').catch(()=>[]))[0];
  if(sf)return {type:'staff',staff:sf,code};
  return null;
}

async function pageTimetable(root){

  const cls=classes.find(c=>c.id===cId)||classes[0];
  const entries=await rest('/rest/v1/timetable?school_id=eq.'+_schoolId+'&class_id=eq.'+cls.id+'&select=*').catch(()=>[]);
  const cfg=getTimetableConfig();
  const days=cfg.days;
  const periods=cfg.periods;
  const subjMap={};subjects.forEach(s=>subjMap[s.id]=s);
  const staffMap={};staff.forEach(s=>staffMap[s.id]=s);

        const s=subjMap[e.subject_id],st=staffMap[e.staff_id];
        grid+='<div class="tt-cell" onclick="editTTCell('+d+','+pn+',\''+cls.id+'\')"><div class="sub">'+esc(s?s.code:'—')+'</div><div class="meta">'+esc(st?st.full_name.split(' ')[0]:'')+'</div></div>';
      } else {
        grid+='<div class="tt-cell empty" onclick="editTTCell('+d+','+pn+',\''+cls.id+'\')">+</div>';
      }
    }
  });

  root.innerHTML='<div class="page-head"><div><h1>🗓️ Timetable</h1><div class="sub">'+days.length+' day'+(days.length!==1?'s':'')+' · '+periods.length+' period'+(periods.length!==1?'s':'')+'</div></div>'+

    '<button class="btn danger" onclick="clearTimetable(\''+cls.id+'\')">🗑️ Clear</button>'+
    '</div></div>'+
    '<div class="card"><div><label>Class</label><select onchange="window._ttClassId=this.value;nav(\'timetable\')">'+
    classes.map(c=>'<option value="'+c.id+'"'+(c.id===cls.id?' selected':'')+'>'+esc(c.name)+'</option>').join('')+
    '</select></div></div>'+
    '<div class="card" style="overflow-x:auto">'+grid+'</div>'+
    '<div class="muted" style="text-align:center;font-size:12px;margin-top:8px;line-height:1.6">Tap any cell to assign a subject & teacher.<br>Use ⚙️ Edit Times to change period times, add periods or add days.</div>';

function editTimetableSettings(){
  const cfg=getTimetableConfig();
  modal('<h3>⚙️ Timetable Settings</h3>'+

    '<input id="tt_days_input" value="'+esc(cfg.days.join(','))+'" placeholder="Mon,Tue,Wed,Thu,Fri">'+

    '<h3 style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px">Periods & Times</h3>'+

    '<button class="btn ghost" onclick="addTtPeriodRow()" style="margin-top:8px">＋ Add Period</button>'+
    '<div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveTimetableSettings()">💾 Save</button></div>');

    row.innerHTML='<b style="min-width:34px;color:var(--navy);font-family:monospace;font-size:12.5px"></b>'+

      '<button class="btn sm danger" onclick="removeTtPeriodRow(this)" title="Remove">✕</button>';
    list.appendChild(row);
  });
  renumberTtPeriods();
}
function addTtPeriodRow(){
  const list=document.getElementById('tt_periods_list');
  const lastRow=list.lastElementChild;
  let s='08:00',e='08:40';
  if(lastRow){
    const lastEnd=lastRow.querySelector('.tt-end').value;
    if(lastEnd){
      s=lastEnd;
      const [h,m]=lastEnd.split(':').map(Number);
      let endMin=h*60+m+40;
      if(endMin>=24*60)endMin=23*60+59;
      e=String(Math.floor(endMin/60)).padStart(2,'0')+':'+String(endMin%60).padStart(2,'0');
    }
  }
  const row=document.createElement('div');
  row.className='tt-period-row';
  row.style.cssText='display:flex;gap:8px;align-items:center;margin-bottom:8px';
  row.innerHTML='<b style="min-width:34px;color:var(--navy);font-family:monospace;font-size:12.5px"></b>'+
    '<input type="time" class="tt-start" value="'+s+'" style="flex:1">'+
    '<span style="color:var(--muted);font-size:12px">→</span>'+
    '<input type="time" class="tt-end" value="'+e+'" style="flex:1">'+
    '<button class="btn sm danger" onclick="removeTtPeriodRow(this)" title="Remove">✕</button>';
  list.appendChild(row);
  renumberTtPeriods();
  list.scrollTop=list.scrollHeight;
}
function removeTtPeriodRow(btn){
  const list=document.getElementById('tt_periods_list');
  if(list.children.length<=1){toast('At least one period required','bad');return;}
  btn.closest('.tt-period-row').remove();
  renumberTtPeriods();
}
function renumberTtPeriods(){
  const list=document.getElementById('tt_periods_list');
  [...list.children].forEach((row,i)=>{row.querySelector('b').textContent='P'+(i+1);});
}
async function saveTimetableSettings(){
  const daysRaw=document.getElementById('tt_days_input').value;
  const days=daysRaw.split(',').map(d=>d.trim()).filter(d=>d);
  if(!days.length){toast('Add at least one day','bad');return;}
  if(days.length>7){toast('Maximum 7 days','bad');return;}
  const rows=[...document.querySelectorAll('#tt_periods_list .tt-period-row')];
  const periods=rows.map((r,i)=>({
    n:i+1,
    start:r.querySelector('.tt-start').value||'00:00',
    end:r.querySelector('.tt-end').value||'00:00'
  }));
  if(!periods.length){toast('Add at least one period','bad');return;}
  for(let i=1;i<periods.length;i++){
    if(periods[i].start<periods[i-1].end){
      if(!confirm('Period '+(i+1)+' starts before period '+i+' ends. Save anyway?'))return;
      break;
    }
  }
  const oldCfg=getTimetableConfig();
  const shrinking=(periods.length<oldCfg.periods.length) || (days.length<oldCfg.days.length);
  if(shrinking){
    if(!confirm('You are reducing periods or days. Existing entries outside the new range will be deleted. Continue?'))return;
    try{
      await rest('/rest/v1/timetable?school_id=eq.'+_schoolId+'&period=gt.'+periods.length,{method:'DELETE'});
      await rest('/rest/v1/timetable?school_id=eq.'+_schoolId+'&day_of_week=gt.'+days.length,{method:'DELETE'});
    }catch(e){}
  }
  const cfg={days,periods};
  try{
    await rest('/rest/v1/schools?id=eq.'+_schoolId,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({timetable_config:cfg})});
    _school.timetable_config=cfg;
    toast('Timetable settings saved','ok');
    closeModal();
    nav('timetable');
  }catch(e){toast(e.message,'bad');}
}

async function openRecordPayment(preselectStaffId){
  const staff=await loadStaff();
  if(!staff.length){toast('Add staff first','bad');return;}
  const advances=await rest('/rest/v1/staff_advances?school_id=eq.'+_schoolId+'&balance=gt.0&select=*&order=given_date.asc').catch(()=>[]);
  const advByStaff={};
  (advances||[]).forEach(a=>{advByStaff[a.staff_id]=(advByStaff[a.staff_id]||0)+Number(a.balance||0);});
  window._advByStaff=advByStaff;

  const now=new Date();
  const tz=now.getTimezoneOffset()*60000;
  const localNow=new Date(now-tz).toISOString().slice(0,16);

  modal('<h3>💵 Record Salary Payment</h3>'+
    '<div><label>Staff member *</label><select id="pr_staff" onchange="onPayrollStaffChange()">'+
      '<option value="">— Select staff —</option>'+
      staff.map(s=>'<option value="'+s.id+'"'+(preselectStaffId===s.id?' selected':'')+'>'+esc(s.full_name)+' — '+esc(s.role||'')+'</option>').join('')+

    '<div class="grid grid-2" style="margin-top:14px">'+
    '<div><label>Basic Salary *</label><input id="pr_basic" type="number" value="" oninput="computePayroll()"></div>'+

    '<div><label>Allowance (not part of salary)</label><input id="pr_allowance" type="number" value="0" oninput="computePayroll()"></div>'+
    '<div><label>Method</label><select id="pr_method"><option>Cash</option><option>Mobile Money</option><option>Bank Transfer</option><option>Cheque</option></select></div>'+
    '<div><label>Date & Time (auto)</label><input id="pr_paid_at" type="datetime-local" value="'+localNow+'"></div>'+
    '<div><label>Notes</label><input id="pr_notes" placeholder="Optional"></div>'+
    '</div>'+
    '<div id="pr_summary" style="margin-top:16px;background:var(--brandsoft);padding:14px;border-radius:12px;font-size:13.5px;line-height:2"></div>'+
    '<div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn ok" onclick="saveSalaryPayment()">💾 Save Payment</button></div>');

  if(preselectStaffId)onPayrollStaffChange();
}

function onPayrollStaffChange(){
  const sid=document.getElementById('pr_staff').value;
  const box=document.getElementById('pr_adv_box');
  const advInput=document.getElementById('pr_adv_deduct');
  const bal=(window._advByStaff&&window._advByStaff[sid])||0;
  if(!sid){box.innerHTML='';advInput.value=0;computePayroll();return;}
  if(bal>0){
    box.innerHTML='<div class="alert-item danger" style="margin-bottom:0"><span class="ico">💳</span><div class="txt"><b>Outstanding advance: '+fmtUGX(bal)+'</b><span>Deduct this from the salary below.</span></div><button class="btn sm ghost" onclick="useFullAdvance('+bal+')">Use full</button></div>';
    advInput.value=bal;
  } else {
    box.innerHTML='<div class="alert-item ok" style="margin-bottom:0"><span class="ico">✅</span><div class="txt"><b>No outstanding advance</b></div></div>';
    advInput.value=0;
  }
  computePayroll();
}
function useFullAdvance(amount){
  document.getElementById('pr_adv_deduct').value=amount;
  computePayroll();
}
function computePayroll(){
  const basic=parseFloat(document.getElementById('pr_basic').value)||0;
  const adv=parseFloat(document.getElementById('pr_adv_deduct').value)||0;
  const allow=parseFloat(document.getElementById('pr_allowance').value)||0;
  const net=Math.max(0, basic-adv);
  const total=net+allow;
  document.getElementById('pr_summary').innerHTML=
    '<div style="display:flex;justify-content:space-between"><span>Basic Salary</span><b>'+fmtUGX(basic)+'</b></div>'+
    '<div style="display:flex;justify-content:space-between;color:#b91c1c"><span>Less Advance</span><b>'+(adv?('−'+fmtUGX(adv)):'—')+'</b></div>'+

async function saveSalaryPayment(){
  const staffId=document.getElementById('pr_staff').value;
  const basic=parseFloat(document.getElementById('pr_basic').value)||0;
  const adv=parseFloat(document.getElementById('pr_adv_deduct').value)||0;
  const allow=parseFloat(document.getElementById('pr_allowance').value)||0;
  const method=document.getElementById('pr_method').value;
  const paidAt=document.getElementById('pr_paid_at').value;
  const notes=document.getElementById('pr_notes').value.trim()||null;
  if(!staffId){toast('Select a staff member','bad');return;}
  if(basic<=0){toast('Enter basic salary','bad');return;}
  if(adv>basic){toast('Advance cannot exceed salary','bad');return;}
  const net=Math.max(0, basic-adv);
  const total=net+allow;
  try{
    await rest('/rest/v1/staff_salaries',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({
      school_id:_schoolId,staff_id:staffId,
      basic_salary:basic,gross:basic,
      advance_deduction:adv,deductions:0,
      net_salary:net,net:net,
      allowance:allow,total_paid:total,
      method:method,payment_method:method,
      notes:notes,
      paid_at:new Date(paidAt).toISOString(),
      paid_date:paidAt.slice(0,10),
      recorded_by:SESSION.id,
      month:new Date(paidAt).getMonth()+1,
      year:new Date(paidAt).getFullYear(),
      status:'paid'
    })});
    if(adv>0)await applyAdvanceDeduction(staffId,adv);
    toast('Saved · '+fmtUGX(total)+' paid','ok');
    closeModal();nav('payroll');
  }catch(e){toast(e.message,'bad');}
}
async function applyAdvanceDeduction(staffId,amount){
  const advances=await rest('/rest/v1/staff_advances?staff_id=eq.'+staffId+'&balance=gt.0&select=*&order=given_date.asc').catch(()=>[]);
  let remaining=amount;
  for(const a of advances){
    if(remaining<=0)break;
    const b=Number(a.balance)||0;
    const use=Math.min(b,remaining);
    const newBal=b-use;
    await rest('/rest/v1/staff_advances?id=eq.'+a.id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({balance:newBal,status:newBal<=0?'cleared':'active'})});
    remaining-=use;
  }
}

function buildReportCardBody(student,rd){
  const {exams,cls,marksByStudent,classAvgPct,classSize,rankMap,year,term,stageLabel}=rd;
  const subjects=filterGradeableSubjects(cls,rd.subjects);
  const perExam=marksByStudent[student.id]||{};
  let grandTotal=0,assessCount=0;
  const subjectRows=subjects.map(s=>{
    const scores=exams.map(e=>{
      const sc=perExam[e.id]?.[s.id];
      if(sc!=null&&!isNaN(sc)){grandTotal+=Number(sc);assessCount++;}
      return sc!=null&&!isNaN(sc)?Number(sc):null;
    });
    return {subject:s,scores};
  });
  const avg=assessCount?grandTotal/assessCount:0;
  const pos=rankMap[student.id];
  const g=gradeOf(avg);
  const comment=autoComment(avg,student.first_name);
  const filtering=isUpperPrimaryClass(cls) && subjects.length!==(rd.subjects||[]).length;
  let html='<div class="rc-title">'+esc(stageLabel+' Report Card')+'</div>';
  html+='<table class="rc-info"><tr><td><b>Name:</b> '+esc(student.first_name+' '+(student.last_name||''))+'</td><td><b>Adm:</b> '+esc(student.admission_no)+'</td><td><b>LIN:</b> '+esc(student.lin||'—')+'</td></tr><tr><td><b>Class:</b> '+esc(cls.name)+'</td><td><b>Year:</b> '+year+'</td><td><b>Term:</b> '+term+'</td></tr></table>';
  if(filtering){
    html+='<div style="margin:10px 0;padding:8px 12px;background:#e0e9f5;border-radius:8px;font-size:11.5px;color:#0a2540">Graded on the 4 core subjects: <b>SCI, SST, ENG, MATH</b></div>';
  }
  html+='<table class="rc-multi"><thead><tr><th>#</th><th>Subject</th>';
  exams.forEach(e=>{html+='<th>'+esc(examStageLabel(e.type))+'</th>';});
  html+='<th>Total</th><th>Grade</th><th>Remark</th></tr></thead><tbody>';
  subjectRows.forEach((r,i)=>{
    const valid=r.scores.filter(v=>v!=null);
    const subTotal=valid.reduce((a,b)=>a+b,0);
    const subAvg=valid.length?subTotal/valid.length:0;
    const sg=gradeOf(subAvg);
    html+='<tr><td>'+(i+1)+'</td><td>'+esc(r.subject.name)+'</td>';
    r.scores.forEach(v=>{html+='<td style="text-align:center">'+(v!=null?v.toFixed(0):'—')+'</td>';});
    html+='<td style="text-align:right"><b>'+(valid.length?subTotal.toFixed(0):'—')+'</b></td><td style="text-align:center"><b>'+sg.g+'</b></td><td>'+esc(valid.length?sg.r:'—')+'</td></tr>';
  });
  html+='</tbody><tfoot><tr><td colspan="2">TOTAL</td>';
  exams.forEach(e=>{
    const t=subjects.reduce((sum,sj)=>sum+(perExam[e.id]?.[sj.id]||0),0);
    const hasAny=subjects.some(sj=>perExam[e.id]?.[sj.id]!=null);
    html+='<td style="text-align:center">'+(hasAny?t.toFixed(0):'—')+'</td>';
  });
  html+='<td style="text-align:right">'+grandTotal.toFixed(0)+'</td><td style="text-align:center">'+g.g+'</td><td>Avg: '+avg.toFixed(1)+'%</td></tr></tfoot></table>';
  html+='<div class="rc-summary"><div><b>Total</b>'+grandTotal.toFixed(0)+'</div><div><b>Average</b>'+avg.toFixed(1)+'%</div><div><b>Position</b>'+(pos?ordinal(pos)+' / '+classSize:'—')+'</div><div><b>Grade</b>'+g.g+' — '+g.r+'</div><div><b>Class Avg</b>'+classAvgPct.toFixed(1)+'%</div></div>';
  html+='<div class="rc-comment"><b>📝 Comment:</b><br>'+esc(comment)+'</div>';
  html+='<div class="rc-sign"><div>Teacher: __________</div><div>Head: __________</div><div>Date: '+new Date().toLocaleDateString()+'</div></div>';
  html+=gradeKeyHTML();
  return html;
}

  const [exams,classes,subjects]=await Promise.all([
    rest('/rest/v1/exams?school_id=eq.'+_schoolId+'&select=*&order=created_at.desc').catch(()=>[]),

  ]);
  if(!classes.length||!subjects.length){
    root.innerHTML='<div class="page-head"><div><h1>📄 Report Cards</h1></div></div><div class="card"><div class="empty">Create classes and subjects first.</div></div>';
    return;
  }
  const year=window._rcYear!=null?Number(window._rcYear):getCurrentYear();
  const term=window._rcTerm!=null?Number(window._rcTerm):getCurrentTerm();
  const cId=window._rcClassId||(classes[0]&&classes[0].id);
  const cls=classes.find(c=>c.id===cId)||classes[0];

  const allStages=[
    {value:1,label:'BOT only (Beginning of Term)'},
    {value:2,label:'BOT + Mid Term'},
    {value:3,label:'BOT + Mid + End of Term'}
  ];
  let selectedStage=window._rcStage!=null?Number(window._rcStage):3;
  if(![1,2,3].includes(selectedStage))selectedStage=3;

  const termExams=exams.filter(e=>Number(e.year)===year&&Number(e.term)===term).sort((a,b)=>examStageRank(a.type)-examStageRank(b.type));
  const activeExams=termExams.filter(e=>examStageRank(e.type)<=selectedStage);
  const activeExamIds=activeExams.map(e=>e.id);
  const stageLabel=examStageFullLabel(selectedStage);
  const stageSummary=allStages.map(s=>{const count=termExams.filter(e=>examStageRank(e.type)<=s.value).length;return {value:s.value,label:s.label,count:count};});

  let students=[],marks=[];
  if(activeExamIds.length){
    [students,marks]=await Promise.all([
      rest('/rest/v1/students?school_id=eq.'+_schoolId+'&class_id=eq.'+cls.id+'&status=eq.active&select=*&order=first_name'),
      rest('/rest/v1/marks?school_id=eq.'+_schoolId+'&exam_id=in.('+activeExamIds.join(',')+')&select=*').catch(()=>[])
    ]);
  } else {
    students=await rest('/rest/v1/students?school_id=eq.'+_schoolId+'&class_id=eq.'+cls.id+'&status=eq.active&select=*&order=first_name').catch(()=>[]);
  }

  const studs=students||[];
  const sidSet=new Set(studs.map(s=>s.id));
  const mks=(marks||[]).filter(m=>sidSet.has(m.student_id));
  const marksByStudent={};
  mks.forEach(m=>{if(!marksByStudent[m.student_id])marksByStudent[m.student_id]={};if(!marksByStudent[m.student_id][m.exam_id])marksByStudent[m.student_id][m.exam_id]={};marksByStudent[m.student_id][m.exam_id][m.subject_id]=Number(m.score);});

  const gradeableSubjects=filterGradeableSubjects(cls,subjects);

  const rows=studs.map(s=>{
    const per=marksByStudent[s.id]||{};let total=0,count=0;

    '<div class="card"><div class="grid grid-3">'+
    '<div><label>Year</label><input type="number" value="'+year+'" onchange="window._rcYear=this.value;nav(\'reports\')"></div>'+

    '<div><label>Class</label><select onchange="window._rcClassId=this.value;window._rcStage=null;nav(\'reports\')">'+classes.map(c=>'<option value="'+c.id+'"'+(c.id===cls.id?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div>'+
    '<div style="grid-column:1/-1"><label>Which exams to include in the report</label><select onchange="window._rcStage=this.value;nav(\'reports\')">'+
    stageSummary.map(o=>'<option value="'+o.value+'"'+(o.value===selectedStage?' selected':'')+'>'+esc(o.label)+' — '+o.count+' exam'+(o.count===1?'':'s')+' found</option>').join('')+
    '</select></div></div></div>'+
    (termExams.length?'':'<div class="card" style="border-left:4px solid var(--warn);background:#fffbeb"><b>⚠️ No exams recorded for '+year+' Term '+term+'.</b><div class="muted" style="margin-top:6px">Go to the Exams page to create the BOT, Mid Term or End of Term exam first.</div></div>')+
    '<div class="card"><h3>📊 Ranking</h3>'+
    (studs.length?'<div class="table-wrap"><table><thead><tr><th>Pos</th><th>Adm</th><th>Name</th>'+activeExams.map(e=>'<th style="text-align:center">'+esc(examStageLabel(e.type))+'</th>').join('')+'<th style="text-align:right">Total</th><th style="text-align:right">Avg</th><th>Grade</th><th></th></tr></thead><tbody>'+
    sortedView.map(r=>{const pos=rankMap[r.student.id];const g=gradeOf(r.avg);const per=marksByStudent[r.student.id]||{};
      return '<tr><td><b>'+(pos?ordinal(pos):'—')+'</b></td><td>'+esc(r.student.admission_no)+'</td><td><b>'+esc(r.student.first_name+' '+(r.student.last_name||''))+'</b></td>'+
        activeExams.map(e=>{const hasAny=gradeableSubjects.some(sj=>per[e.id]?.[sj.id]!=null);const t=gradeableSubjects.reduce((sum,sj)=>sum+(per[e.id]?.[sj.id]||0),0);return '<td style="text-align:center">'+(hasAny?t.toFixed(0):'—')+'</td>';}).join('')+
        '<td style="text-align:right">'+r.total.toFixed(0)+'</td><td style="text-align:right">'+r.avg.toFixed(1)+'</td><td><span class="badge '+(g.cls||'info')+'">'+g.g+'</span></td>'+
        '<td><button class="btn sm" onclick="printOneReportCard(\''+r.student.id+'\')">🖨️</button></td></tr>';
    }).join('')+'</tbody></table></div>':'<div class="empty">No pupils.</div>')+'</div>';

function printOneReportCard(studentId){const rd=window._rcData;if(!rd){toast('Reload','bad');return;}const r=rd.rows.find(x=>x.student.id===studentId);if(!r){toast('Not found','bad');return;}const body=buildReportCardBody(r.student,rd);printHTML(rd.stageLabel+' Report — '+r.student.first_name,body,RC_PRINT_CSS);}
function printAllReportCards(){const rd=window._rcData;if(!rd||!rd.rows.length){toast('No pupils','bad');return;}const sorted=rd.rows.slice().sort((a,b)=>(rd.rankMap[a.student.id]||9999)-(rd.rankMap[b.student.id]||9999));let html='';sorted.forEach((r,i)=>{html+='<div class="rc-page'+(i<sorted.length-1?' rc-page-break':'')+'">'+buildReportCardBody(r.student,rd)+'</div>';});printHTML(rd.stageLabel+' Reports — '+rd.cls.name,html,RC_PRINT_CSS);}
function printBroadsheet(){
  const rd=window._rcData;if(!rd||!rd.rows.length){toast('No data','bad');return;}
  const sorted=rd.rows.slice().sort((a,b)=>(rd.rankMap[a.student.id]||9999)-(rd.rankMap[b.student.id]||9999));
  let head='<tr><th>Pos</th><th>Adm</th><th>Name</th>';rd.exams.forEach(e=>head+='<th>'+esc(e.name)+'</th>');
  head+='<th style="text-align:right">Tot</th><th style="text-align:right">Avg</th><th>Grade</th></tr>';
  const bodyRows=sorted.map(r=>{const per=rd.marksByStudent[r.student.id]||{};let cells='<td><b>'+(rd.rankMap[r.student.id]?ordinal(rd.rankMap[r.student.id]):'—')+'</b></td><td>'+esc(r.student.admission_no)+'</td><td>'+esc(r.student.first_name+' '+(r.student.last_name||''))+'</td>';
    rd.exams.forEach(e=>{const t=rd.subjects.reduce((sum,sj)=>sum+(per[e.id]?.[sj.id]||0),0);const hasAny=rd.subjects.some(sj=>per[e.id]?.[sj.id]!=null);cells+='<td style="text-align:center">'+(hasAny?t.toFixed(0):'—')+'</td>';});
    const g=gradeOf(r.avg);cells+='<td style="text-align:right">'+r.total.toFixed(0)+'</td><td style="text-align:right">'+r.avg.toFixed(1)+'</td><td><b>'+g.g+'</b></td>';return '<tr>'+cells+'</tr>';}).join('');
  printHTML('Broadsheet','<table><thead>'+head+'</thead><tbody>'+bodyRows+'</tbody></table>');
}

async function renderReportCharts(){
  const area=document.getElementById('reportArea');area.innerHTML='<div class="loading">Loading…</div>';
  const cy=getCurrentYear(),ct=getCurrentTerm();
  const [students,payments,expenses,classes]=await Promise.all([
    rest('/rest/v1/students?school_id=eq.'+_schoolId+'&status=eq.active&select=id,class_id,gender,balance_bf,actual_fee,transport_fee'),
    rest('/rest/v1/payments?school_id=eq.'+_schoolId+'&select=student_id,amount,payment_for,paid_at'),
    rest('/rest/v1/expenses?school_id=eq.'+_schoolId+'&academic_year=eq.'+cy+'&term=eq.'+ct+'&select=amount').catch(()=>[]),
    loadClasses()
  ]);
  const male=students.filter(s=>s.gender==='male').length;const female=students.filter(s=>s.gender==='female').length;
  const classCounts={};classes.forEach(c=>classCounts[c.name]=0);
  students.forEach(s=>{const cls=classes.find(c=>c.id===s.class_id);if(cls)classCounts[cls.name]++;});
  const pbs={};payments.forEach(p=>{if(p.payment_for!=='Functional Fees'){if(!pbs[p.student_id])pbs[p.student_id]=0;pbs[p.student_id]+=Number(p.amount);}});
  const classColl={};classes.forEach(c=>{classColl[c.name]={expected:0,collected:0};});
  students.forEach(s=>{const cls=classes.find(c=>c.id===s.class_id);if(cls){const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);classColl[cls.name].expected+=sf;classColl[cls.name].collected+=pbs[s.id]||0;}});
  area.innerHTML='<div class="grid grid-2" style="margin-bottom:14px"><div class="card"><h3>👥 Gender</h3><canvas id="chartGender" style="max-height:250px"></canvas></div><div class="card"><h3>🏫 Pupils per Class</h3><canvas id="chartClass" style="max-height:250px"></canvas></div></div>'+
    '<div class="card"><h3>💰 Fee Collection by Class</h3><canvas id="chartColl" style="max-height:300px"></canvas></div>';
  setTimeout(()=>{
    if(!window.Chart)return;
    new Chart(document.getElementById('chartGender'),{type:'doughnut',data:{labels:['Boys','Girls'],datasets:[{data:[male,female],backgroundColor:['#2c5282','#d4a017']}]},options:{responsive:true,maintainAspectRatio:false}});
    new Chart(document.getElementById('chartClass'),{type:'bar',data:{labels:Object.keys(classCounts),datasets:[{label:'Pupils',data:Object.values(classCounts),backgroundColor:'#0a2540'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
    new Chart(document.getElementById('chartColl'),{type:'bar',data:{labels:Object.keys(classColl),datasets:[{label:'Expected',data:Object.values(classColl).map(c=>c.expected),backgroundColor:'#94a3b8'},{label:'Collected',data:Object.values(classColl).map(c=>c.collected),backgroundColor:'#059669'}]},options:{responsive:true,maintainAspectRatio:false}});
  },100);
}

async function renderProfitLoss(){
  const area=document.getElementById('reportArea');area.innerHTML='<div class="loading">…</div>';
  const cy=getCurrentYear(),ct=getCurrentTerm();
  const [payments,expenses,salaries,uniformSales]=await Promise.all([
    rest('/rest/v1/payments?school_id=eq.'+_schoolId+'&academic_year=eq.'+cy+'&term=eq.'+ct+'&select=amount,payment_for'),
    rest('/rest/v1/expenses?school_id=eq.'+_schoolId+'&academic_year=eq.'+cy+'&term=eq.'+ct+'&select=amount').catch(()=>[]),
    rest('/rest/v1/staff_salaries?school_id=eq.'+_schoolId+'&year=eq.'+cy+'&status=eq.paid&select=net_salary,net').catch(()=>[]),
    rest('/rest/v1/uniform_sales?school_id=eq.'+_schoolId+'&academic_year=eq.'+cy+'&term=eq.'+ct+'&select=total_amount').catch(()=>[])
  ]);
  const feeRev=payments.filter(p=>p.payment_for!=='Functional Fees').reduce((s,p)=>s+Number(p.amount),0);
  const funcRev=payments.filter(p=>p.payment_for==='Functional Fees').reduce((s,p)=>s+Number(p.amount),0);
  const uniformRev=uniformSales.reduce((s,u)=>s+Number(u.total_amount),0);
  const expTotal=expenses.reduce((s,e)=>s+Number(e.amount),0);
  const salaryTotal=salaries.reduce((s,x)=>s+Number(x.net_salary||x.net||0),0);
  const rev=feeRev+funcRev+uniformRev;const costs=expTotal+salaryTotal;const profit=rev-costs;
  area.innerHTML='<div class="grid grid-kpi" style="margin-bottom:14px"><div class="kpi kpi-ok"><div class="v">'+fmtUGX(rev)+'</div><div class="l">Revenue</div></div><div class="kpi kpi-bad"><div class="v">'+fmtUGX(costs)+'</div><div class="l">Costs</div></div><div class="kpi '+(profit>=0?'kpi-ok':'kpi-bad')+'"><div class="v">'+fmtUGX(profit)+'</div><div class="l">'+(profit>=0?'Surplus':'Deficit')+'</div></div></div>'+
    '<div class="card"><table><tbody>'+
    '<tr><td>School fees</td><td style="text-align:right">'+feeRev.toLocaleString()+'</td></tr>'+
    '<tr><td>Functional fees</td><td style="text-align:right">'+funcRev.toLocaleString()+'</td></tr>'+
    '<tr><td>Uniforms</td><td style="text-align:right">'+uniformRev.toLocaleString()+'</td></tr>'+
    '<tr style="font-weight:700;background:#ecfdf5"><td>Total Revenue</td><td style="text-align:right">'+rev.toLocaleString()+'</td></tr>'+
    '<tr><td>Expenses</td><td style="text-align:right">'+expTotal.toLocaleString()+'</td></tr>'+
    '<tr><td>Salaries</td><td style="text-align:right">'+salaryTotal.toLocaleString()+'</td></tr>'+
    '<tr style="font-weight:700;background:#fef2f2"><td>Total Costs</td><td style="text-align:right">'+costs.toLocaleString()+'</td></tr>'+
    '<tr style="font-weight:800;font-size:15px;background:'+(profit>=0?'#ecfdf5':'#fef2f2')+';color:'+(profit>=0?'#047857':'#b91c1c')+'"><td>'+(profit>=0?'SURPLUS':'DEFICIT')+'</td><td style="text-align:right">'+Math.abs(profit).toLocaleString()+'</td></tr>'+
    '</tbody></table></div>';
}

   FEE REMINDERS
   ============================================================ */
async function sendFeeReminders(){
  const students=await rest('/rest/v1/students?school_id=eq.'+_schoolId+'&status=eq.active&select=*');
  const payments=await rest('/rest/v1/payments?school_id=eq.'+_schoolId+'&select=student_id,amount,payment_for').catch(()=>[]);
  const pbs={};
  payments.forEach(p=>{if(p.payment_for!=='Functional Fees'){if(!pbs[p.student_id])pbs[p.student_id]=0;pbs[p.student_id]+=Number(p.amount);}});
  const debtors=students.filter(s=>{const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);return (sf-(pbs[s.id]||0))>0&&s.parent_contact;});
  if(!debtors.length){toast('No debtors with phone','ok');return;}
  if(!confirm('Queue reminders for '+debtors.length+' parents?'))return;
  const rows=debtors.map(s=>{const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);const bal=sf-(pbs[s.id]||0);return {school_id:_schoolId,student_id:s.id,channel:'sms',phone:s.parent_contact,message:'Dear Parent, '+s.first_name+' has UGX '+bal.toLocaleString()+' balance. Kindly clear. Thank you.',amount_owed:bal,status:'queued'};});
  try{
    for(let i=0;i<rows.length;i+=50){await rest('/rest/v1/fee_reminders',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify(rows.slice(i,i+50))});}
    toast('Queued '+rows.length,'ok');
  }catch(e){toast(e.message,'bad');}
}

   TERM ROLLOVER
   ============================================================ */
async function termRollover(){
  const cy=getCurrentYear(),ct=getCurrentTerm();
  const nextTerm=ct<3?ct+1:1,nextYear=ct<3?cy:cy+1;
  modal('<h3>🔄 Term Rollover</h3><div style="background:var(--warnsoft);padding:14px;border-radius:10px;font-size:13px;line-height:1.9"><b>Current:</b> '+cy+' Term '+ct+'<br><b>Next:</b> '+nextYear+' Term '+nextTerm+'<br><br>All balances carry forward as B/F.</div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="cfmRollover('+cy+','+ct+','+nextYear+','+nextTerm+')">🔄 Proceed</button></div>');
}
async function cfmRollover(cy,ct,ny,nt){
  closeModal();toast('Rolling over…','ok');
  try{
    const students=await rest('/rest/v1/students?school_id=eq.'+_schoolId+'&status=eq.active&select=id,balance_bf,actual_fee,transport_fee');
    const payments=await rest('/rest/v1/payments?school_id=eq.'+_schoolId+'&academic_year=eq.'+cy+'&term=eq.'+ct+'&select=student_id,amount,payment_for').catch(()=>[]);
    const pbs={};
    payments.forEach(p=>{if(p.payment_for!=='Functional Fees'){if(!pbs[p.student_id])pbs[p.student_id]=0;pbs[p.student_id]+=Number(p.amount);}});
    for(const s of students){
      const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);
      const newBF=sf-(pbs[s.id]||0);
      await rest('/rest/v1/students?id=eq.'+s.id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({balance_bf:newBF,actual_fee:0,transport_fee:0})});
    }
    setCurrentPeriod(ny,nt);
    populateTermSelector();
    toast('✅ Rolled to '+ny+' Term '+nt,'ok');
    nav('dashboard');
  }catch(e){toast('Failed: '+e.message,'bad');}
}

/* ============================================================
   HOLIDAYS / IMPORTANT DATES
   ============================================================ */
async function pageHolidays(root){
  const [schoolHolidays,nationalHolidays]=await Promise.all([
    rest('/rest/v1/holidays?school_id=eq.'+_schoolId+'&select=*&order=start_date.desc').catch(()=>[]),
    rest('/rest/v1/holidays?is_national=eq.true&school_id=neq.'+_schoolId+'&select=*&order=start_date.desc').catch(()=>[])
  ]);
  const today=new Date().toISOString().slice(0,10);
  const coalesceEnd=h=>(h&&(h.end_date||h.start_date))||'9999-12-31';
  const upcoming=(schoolHolidays||[]).filter(h=>coalesceEnd(h)>=today).sort((a,b)=>new Date(a.start_date)-new Date(b.start_date));
  const past=(schoolHolidays||[]).filter(h=>coalesceEnd(h)<today).sort((a,b)=>new Date(b.start_date)-new Date(a.start_date));
  const natUpcoming=(nationalHolidays||[]).filter(h=>coalesceEnd(h)>=today).sort((a,b)=>new Date(a.start_date)-new Date(b.start_date));

  const kindColors={public:'info',school:'warn',exam:'bad',event:'ok',term:'navy'};
  const holidayCard=(h,editable)=>{
    const badgeCls=kindColors[h.kind]||'info';
    const isRange=h.end_date&&h.end_date!==h.start_date;
    const dateStr=isRange?(fmtDate(h.start_date)+' → '+fmtDate(h.end_date)):fmtDate(h.start_date);
    const natTag=h.is_national?'<span class="badge" style="background:#e0e7ff;color:#3730a3">🌍 National</span>':'';
    const kindTag='<span class="badge '+badgeCls+'">'+esc((h.kind||'event').toUpperCase())+'</span>';
    return '<div class="alert-item '+(h.kind==='exam'?'danger':h.kind==='event'?'ok':'')+'" style="border-left-color:'+(h.kind==='exam'?'#dc2626':h.kind==='event'?'#059669':h.kind==='term'?'#0a2540':'#d4a017')+'">'+
      '<span class="ico">📌</span>'+
      '<div class="txt"><b>'+esc(h.title)+'</b>'+
        '<span>'+esc(dateStr)+(h.description?' · '+esc(h.description):'')+'</span>'+
        '<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">'+kindTag+natTag+'</div></div>'+
      (editable?'<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm ghost" onclick="editHoliday(\''+h.id+'\')">✏️</button><button class="btn sm danger" onclick="delHoliday(\''+h.id+'\')">✕</button></div>':'')+
    '</div>';
  };

  root.innerHTML='<div class="page-head"><div><h1>📅 Holidays & Important Dates</h1><div class="sub">'+upcoming.length+' upcoming · '+past.length+' past</div></div>'+
    '<button class="btn" onclick="addHoliday()">＋ Add</button></div>'+
    '<div class="card" style="border-left:4px solid var(--gold);background:#fffdf5"><b>🌍 National holidays</b><div class="muted" style="margin-top:4px">Entries with "National" ticked are visible to every school on the platform and to every parent portal.</div></div>'+
    '<div class="card"><h3>🔜 Upcoming</h3>'+
    (upcoming.length?upcoming.map(h=>holidayCard(h,true)).join(''):'<div class="empty">No upcoming dates.</div>')+'</div>'+
    (natUpcoming.length?'<div class="card"><h3>🌍 National Holidays (shared)</h3>'+natUpcoming.map(h=>holidayCard(h,false)).join('')+'</div>':'')+
    (past.length?'<div class="card"><h3>📜 Past</h3>'+past.map(h=>holidayCard(h,false)).join('')+'</div>':'');
}
async function loadUpcomingHolidays(){
  try{
    const today=new Date().toISOString().slice(0,10);
    const list=await rest('/rest/v1/holidays?or=(school_id.eq.'+_schoolId+',is_national.eq.true)&select=*&order=start_date.asc&limit=50').catch(()=>[]);
    const coalesceEnd=h=>(h&&(h.end_date||h.start_date))||'9999-12-31';
    const upcoming=(list||[]).filter(h=>coalesceEnd(h)>=today).slice(0,5);
    window._upcomingHolidays=upcoming;
  }catch(e){window._upcomingHolidays=[];}
}

  modal('<h3>📅 Add Holiday / Important Date</h3>'+

    '<div style="margin-top:12px"><label>Description</label><input id="h_desc" placeholder="Optional"></div>'+
    '<div class="grid grid-2" style="margin-top:12px">'+
    '<div><label>Start date *</label><input id="h_start" type="date" value="'+t+'"></div>'+
    '<div><label>End date (optional)</label><input id="h_end" type="date"></div>'+
    '</div>'+
    '<div class="grid grid-2" style="margin-top:12px">'+
    '<div><label>Type</label><select id="h_kind">'+
      '<option value="public">Public Holiday</option>'+

/* ============================================================
   BULK IMPORT
   ============================================================ */
function bulkImportStudents(){
  if(!window.XLSX){toast('Excel not loaded','bad');return;}
  const input=document.createElement('input');
  input.type='file';
  input.accept='.xlsx,.xls';
  input.onchange=async e=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=async ev=>{
      try{
        toast('Reading…','ok');
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
        const sheet=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});
        if(rows.length<2){toast('Empty file','bad');return;}
        const headers=rows[0].map(h=>String(h||'').trim().toLowerCase());
        const find=(...names)=>{
          for(const n of names){const i=headers.findIndex(h=>h===n.toLowerCase());if(i>=0)return i;}
          for(const n of names){const i=headers.findIndex(h=>h.includes(n.toLowerCase()));if(i>=0)return i;}
          return -1;
        };
        const cName=find('name','full name');
        const cClass=find('class');
        const cAdm=find('admission','adm');
        const cGender=find('gender','sex');
        const cDOB=find('date of birth','dob');
        const cParent=find('parent name');
        const cContact=find('parent contact','contact');
        const cBF=find('balance b/f','b/f');
        const cActual=find('actual fee','tuition');
        const cFunc=find('funct','functional');
        const cTrans=find('transport');
        if(cName<0||cClass<0){toast('File must have Name and Class','bad');return;}
        const classes=await loadClasses();
        const classMap={};classes.forEach(c=>classMap[c.name.toLowerCase()]=c.id);
        const parsed=[];const unknown=new Set();const dupes=[];
        for(let i=1;i<rows.length;i++){
          const r=rows[i];if(!r)continue;
          const name=String(r[cName]||'').trim();
          if(!name||name.toLowerCase()==='name')continue;
          const parts=name.split(/\s+/);
          const fn=parts[0];
          const ln=parts.slice(1).join(' ')||null;
          const clsName=String(r[cClass]||'').trim();
          let classId=classMap[clsName.toLowerCase()]||null;
          if(!classId&&clsName)unknown.add(clsName);
          const num=v=>{if(v==null||v==='')return 0;const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;};
          const bf=num(r[cBF]),act=num(r[cActual]),func=num(r[cFunc])||FUNC_FEE_DEFAULT,tr=num(r[cTrans]);
          const adm=String(r[cAdm]||'').trim()||('ADM-'+Date.now()+'-'+Math.floor(Math.random()*999));
          const gender=String(r[cGender]||'').toLowerCase().includes('f')?'female':'male';
          const dob=(cDOB>=0?String(r[cDOB]||'').trim():'')||null;
          const pname=String(r[cParent]||'').trim()||null;
          const pcontact=String(r[cContact]||'').trim()||null;
          const dup=findDuplicateLocal({first_name:fn,last_name:ln,dob,parent_name:pname,parent_contact:pcontact});
          if(dup){dupes.push({fn,ln,adm,reason:'Matches '+dup.admission_no});continue;}
          const tot=bf+act+tr;
          parsed.push({school_id:_schoolId,admission_no:adm,first_name:fn,last_name:ln,lin:generateLIN(fn),date_of_birth:dob,class_id:classId,gender:gender,boarding_status:'Day',parent_name:pname,parent_contact:pcontact,balance_bf:bf,actual_fee:act,functional_fee:func,transport_fee:tr,functional_fee_paid:func>0?func:0,functional_fee_status:func>0?'cash':'pending',total_expected:tot,current_balance:tot,status:'active',qr_code:'STU-'+Date.now()+Math.floor(Math.random()*999)});
        }
        if(!parsed.length){toast(dupes.length?'All rows were duplicates':'No valid rows','bad');return;}
        modal('<h3>📥 Import Preview</h3>'+
          '<div style="background:var(--brandsoft);padding:14px;border-radius:10px;font-size:13px;line-height:1.9">'+
          '<div><b>Pupils found:</b> '+parsed.length+'</div>'+
          (dupes.length?'<div style="color:#b91c1c"><b>Duplicates skipped:</b> '+dupes.length+'</div>':'')+
          '<div><b>Unknown classes:</b> '+(unknown.size||'none')+'</div></div>'+
          (dupes.length?'<div class="err" style="margin-top:10px;max-height:150px;overflow:auto">'+dupes.map(d=>esc(d.fn+' '+(d.ln||''))+' — '+esc(d.reason)).join('<br>')+'</div>':'')+
          '<div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn ok" onclick="confirmBulkImport('+JSON.stringify(parsed).replace(/"/g,'&quot;')+','+JSON.stringify([...unknown]).replace(/"/g,'&quot;')+')">✅ Import '+parsed.length+'</button></div>');
      }catch(err){toast('Error: '+err.message,'bad');}
    };
    reader.readAsArrayBuffer(file);
  };
  input.click();
}
async function confirmBulkImport(parsed,unknown){
  closeModal();toast('Importing…','ok');
  const classes=await loadClasses();
  const classMap={};classes.forEach(c=>classMap[c.name.toLowerCase()]=c.id);
  for(const clsName of unknown){
    if(!clsName)continue;
    try{
      const ins=await rest('/rest/v1/classes',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({school_id:_schoolId,name:clsName.trim(),sort_order:0})});
      if(ins&&ins[0])classMap[clsName.toLowerCase()]=ins[0].id;
    }catch(e){}
  }
  _classesCache=null;
  let ok=0;
  for(let i=0;i<parsed.length;i+=50){
    const chunk=parsed.slice(i,i+50);
    try{await rest('/rest/v1/students',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify(chunk)});ok+=chunk.length;}catch(e){}
  }
  toast('Imported '+ok,'ok');
  nav('students');
}
