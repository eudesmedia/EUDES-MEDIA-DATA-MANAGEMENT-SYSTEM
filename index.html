<script>
const SUPA_URL='https://wabeempxckdtjvrkzhpv.supabase.co';
const SUPA_KEY='sb_publishable_n0uAm0Gcq7qR2dJM4jMZGQ_wiV__Cfp';

let _memoryStore={};
const safeStorage={getItem:k=>{try{return localStorage.getItem(k);}catch(e){return _memoryStore[k]||null;}},setItem:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){_memoryStore[k]=String(v);}},removeItem:k=>{try{localStorage.removeItem(k);}catch(e){delete _memoryStore[k];}}};
function getCurrentYear(){return parseInt(safeStorage.getItem('pm_year'))||new Date().getFullYear();}
function getCurrentTerm(){return parseInt(safeStorage.getItem('pm_term'))||1;}
function setCurrentPeriod(y,t){safeStorage.setItem('pm_year',String(y));safeStorage.setItem('pm_term',String(t));}
function getToken(){const s=safeStorage.getItem('pm_session');if(!s)return null;try{return JSON.parse(s).access_token;}catch(e){return null;}}
function getUser(){const s=safeStorage.getItem('pm_session');if(!s)return null;try{return JSON.parse(s).user;}catch(e){return null;}}
function setSession(d){if(d)safeStorage.setItem('pm_session',JSON.stringify(d));else safeStorage.removeItem('pm_session');}

async function rest(path,options){
  options=options||{};
  const headers=Object.assign({'apikey':SUPA_KEY,'Content-Type':'application/json'},options.headers||{});
  const token=getToken();headers['Authorization']='Bearer '+(token||SUPA_KEY);
  const res=await fetch(SUPA_URL+path,Object.assign({},options,{headers}));
  const text=await res.text();let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok){if(res.status===401){setSession(null);alert('Session expired.');window.location.reload();throw new Error('Session expired');}throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status));}
  return data;
}
async function auth(path,body){
  const res=await fetch(SUPA_URL+path,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const text=await res.text();let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok)throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status));return data;
}

let _profile=null,_school=null,_schoolId=null,_role=null,_classesCache=null,_examsCache=null;
let _marksClass=null,_marksExam=null,_subjClass=null,_repClass=null,_repStage=3,_repPupil='';
let _importMatches=null,_profileStudentId=null,_profileTab='overview',_rceClass=null;
let _payMonth=null,_payYear=null;

function toast(msg,type){const el=document.createElement('div');el.className='toast'+(type==='bad'?' bad':(type==='ok'?' ok':''));el.textContent=msg;document.getElementById('toastRoot').appendChild(el);setTimeout(()=>el.remove(),3500);}
function modal(html){const root=document.getElementById('modalRoot');root.innerHTML='<div class="modal-bg"><div class="modal">'+html+'</div></div>';root.querySelector('.modal-bg').addEventListener('click',e=>{if(e.target.classList.contains('modal-bg'))closeModal();});}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtUGX(n){if(n==null||isNaN(n))return 'UGX 0';return 'UGX '+(Number(n)||0).toLocaleString();}
function fmtNum(n){if(n==null||isNaN(n))return '0';return (Number(n)||0).toLocaleString();}
function fmtDate(ts){if(!ts)return '—';const d=new Date(ts);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function fmtLongDate(d){return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});}
function fmtDateTime(ts){if(!ts)return '—';const d=new Date(ts);return fmtDate(ts)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function telLink(num){if(!num)return '';return String(num).replace(/[^0-9+]/g,'');}
function waLink(num){if(!num)return '';let clean=String(num).replace(/[^0-9]/g,'');if(clean.startsWith('0'))clean='256'+clean.slice(1);return clean;}
window.toast=toast;window.modal=modal;window.closeModal=closeModal;window.esc=esc;window.fmtUGX=fmtUGX;window.fmtNum=fmtNum;window.fmtDate=fmtDate;

function gradeOf(score){if(score==null||isNaN(score)||score==='')return{g:'—',r:'—',cls:'',agg:'—'};const s=Number(score);if(s>=90)return{g:'D1',r:'Distinction 1',cls:'d1',agg:'1'};if(s>=80)return{g:'D2',r:'Distinction 2',cls:'d2',agg:'2'};if(s>=70)return{g:'C3',r:'Credit 3',cls:'c3',agg:'3'};if(s>=60)return{g:'C4',r:'Credit 4',cls:'c4',agg:'4'};if(s>=55)return{g:'C5',r:'Credit 5',cls:'c5',agg:'5'};if(s>=50)return{g:'C6',r:'Credit 6',cls:'c6',agg:'6'};if(s>=45)return{g:'P7',r:'Pass 7',cls:'p7',agg:'7'};if(s>=40)return{g:'P8',r:'Pass 8',cls:'p8',agg:'8'};return{g:'F9',r:'Fail 9',cls:'f9',agg:'9'};}
function posLabel(n){if(!n)return '—';if(n===1)return '1st';if(n===2)return '2nd';if(n===3)return '3rd';return n+'th';}
window.gradeOf=gradeOf;

function printHTML(title,bodyHTML){

function filterStudentsTable(q,fClass){
  q=(q||'').toLowerCase();fClass=fClass||'';
  window._stFilterSearch=q;
  const fRes=document.getElementById('studentResFilter')?.value||'';
  const classes=_classesCache||[];
  const filtered=(window._allStudents||[]).filter(s=>{
    if(fClass&&s.class_id!==fClass)return false;
    const res=s.residence||s.boarding_status||'day';
    if(fRes&&res!==fRes)return false;
    if(q){const hay=(s.first_name+' '+(s.last_name||'')+' '+(s.admission_no||'')+' '+(s.parent_name||'')+' '+(s.parent_contact||'')+' '+(s.lin||'')+' '+(s.location||'')+' '+(s.district||'')+' '+(s.physical_address||'')).toLowerCase();if(hay.indexOf(q)===-1)return false;}
    return true;
  });
  window._filteredStudents=filtered;
  document.getElementById('studentCount').textContent=(window._allStudents||[]).length+' total · '+filtered.length+' shown';
  const c=document.getElementById('studentsTableContainer');
  if(!filtered.length){c.innerHTML='<div class="empty">No pupils.</div>';return;}
  let rows='';
  filtered.forEach(s=>{
    const cls=classes.find(x=>x.id===s.class_id);
    const charged=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.holiday_fee)||0)+(Number(s.academics_fee)||0)+(Number(s.functional_fee)||0)+(Number(s.transport_fee)||0);
    const collected=(Number(s.deposit_1)||0)+(Number(s.deposit_2)||0)+(Number(s.deposit_3)||0);
    const bal=charged-collected;
    const res=s.residence||s.boarding_status||'day';
    const wa=waLink(s.parent_contact||'');const tl=telLink(s.parent_contact||'');
    const contactCell=s.parent_contact?'<div style="font-weight:600">'+esc(s.parent_contact)+'</div><div style="display:flex;gap:4px;margin-top:4px">'+(wa?'<a href="https://wa.me/'+wa+'" target="_blank" class="btn sm wa" style="text-decoration:none">💬</a>':'')+(tl?'<a href="tel:'+tl+'" class="btn sm ghost" style="text-decoration:none">📞</a>':'')+'</div>':'—';
    const loc=[s.location,s.district].filter(Boolean).join(' · ')||'—';
    const statusBadge=s.status==='active'?'<span class="badge ok">Active</span>':(s.status?'<span class="badge warn">'+esc(s.status)+'</span>':'<span class="badge bad">—</span>');
    rows+='<tr><td><b>'+esc(s.admission_no||'—')+'</b></td><td><a href="javascript:void(0)" onclick="nav(\'student_profile\',\''+s.id+'\')" style="color:var(--navy);font-weight:600;text-decoration:none">'+esc(s.first_name+' '+(s.last_name||''))+'</a></td><td>'+(cls?'<span class="badge info">'+esc(cls.name)+'</span>':'<span class="badge bad">No class</span>')+'</td><td>'+esc(s.gender||'—')+'</td><td>'+esc(s.lin||'—')+'</td><td><b>'+esc(s.parent_name||'—')+'</b><br>'+contactCell+'</td><td>'+esc(loc)+'</td><td>'+esc(s.physical_address||'—')+'</td><td>'+(res==='boarding'?'<span class="badge warn">Board</span>':'<span class="badge ok">Day</span>')+'</td><td>'+statusBadge+'</td><td style="text-align:right"><span class="badge '+(bal>0?'bad':'ok')+'">'+fmtNum(bal)+'</span></td><td style="text-align:right;white-space:nowrap"><button class="btn sm" onclick="nav(\'student_profile\',\''+s.id+'\')">👤</button> <button class="btn sm gold" onclick="recordPayment(\''+s.id+'\')">💵</button> <button class="btn sm ghost" onclick="editStudent(\''+s.id+'\')">✏️</button> <button class="btn sm danger" onclick="deleteStudent(\''+s.id+'\')">✕</button></td></tr>';
  });
  c.innerHTML='<div class="table-wrap"><table style="font-size:12.5px"><thead><tr><th>ADM</th><th>Name</th><th>Class</th><th>Gender</th><th>LIN</th><th>Parent / Contact</th><th>Location</th><th>Address</th><th>Type</th><th>Status</th><th style="text-align:right">Balance</th><th style="text-align:right">Actions</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

async function savePayment(studentId){
  const amount=Number(document.getElementById('p_amount').value);
  const payment_for=document.getElementById('p_for').value;
  const method=document.getElementById('p_method').value;
  const notes=document.getElementById('p_notes').value.trim();

  const s=(window._allStudents||[]).find(x=>x.id===studentId);if(!s){toast('Not found','bad');return;}
  try{await rest('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,student_id:studentId,receipt_no:'RCP-'+Date.now(),year:getCurrentYear(),term:getCurrentTerm(),academic_year:getCurrentYear(),amount,method,payment_method:method,payment_for,notes:notes||null,received_by:_profile?_profile.id:null})});
  const dep={deposit_1:Number(s.deposit_1)||0,deposit_2:Number(s.deposit_2)||0,deposit_3:Number(s.deposit_3)||0};
  if(!dep.deposit_1)dep.deposit_1=amount;else if(!dep.deposit_2)dep.deposit_2=amount;else dep.deposit_3+=amount;
  const charged=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.holiday_fee)||0)+(Number(s.academics_fee)||0)+(Number(s.functional_fee)||0)+(Number(s.transport_fee)||0);

  await rest('/rest/v1/students?id=eq.'+studentId,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify(Object.assign({current_balance:charged-newCollected},dep))});
  toast('Payment recorded','ok');closeModal();nav(activeRoute);}catch(e){toast(e.message,'bad');}
}

async function handleImportFile(ev){const file=ev.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=async (e)=>{try{const wb=XLSX.read(e.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});await processImportRows(rows);}catch(err){toast('Failed: '+err.message,'bad');}};reader.readAsArrayBuffer(file);}

function findColIndex(headers,names){for(let i=0;i<headers.length;i++){const h=String(headers[i]||'').trim().toLowerCase().replace(/\s+/g,' ');for(const n of names){if(h===n.toLowerCase())return i;}}return -1;}

async function processImportRows(rows){
  const status=document.getElementById('importStatus');
  if(!rows||rows.length<2){status.textContent='No data.';return;}
  let headerIdx=0;for(let i=0;i<Math.min(5,rows.length);i++){const r=rows[i].map(c=>String(c||'').toLowerCase());if(r.includes('name')||r.some(c=>c.includes('class'))){headerIdx=i;break;}}
  const headers=rows[headerIdx].map(h=>String(h||'').trim());
  const iName=findColIndex(headers,['name','pupil','full name']);
  const iClass=findColIndex(headers,['class']);
  const iStatus=findColIndex(headers,['status','residence']);
  const iBF=findColIndex(headers,['b/f','bf']);
  const iActual=findColIndex(headers,['actual fee','actual']);
  const iHoliday=findColIndex(headers,['holiday']);
  const iAcademics=findColIndex(headers,['academics']);
  const iFunc=findColIndex(headers,['funct','functional']);
  const iTrans=findColIndex(headers,['transport']);
  const iD1=findColIndex(headers,['1st deposit','first deposit','deposit 1']);
  const iD2=findColIndex(headers,['2nd deposit','second deposit','deposit 2']);
  const iD3=findColIndex(headers,['3rd deposit','third deposit','deposit 3']);
  if(iName<0){status.innerHTML='<span style="color:#dc2626">❌ No "Name" column.</span>';return;}
  const parsed=[];
  for(let i=headerIdx+1;i<rows.length;i++){
    const r=rows[i];const rawName=String(r[iName]||'').trim();
    if(!rawName||rawName.toLowerCase().includes('total'))continue;
    const parts=rawName.split(/\s+/);let first=parts[0],last='';if(parts.length>=2)last=parts.slice(1).join(' ');
    parsed.push({rawName,first_name:first,last_name:last,class_name:iClass>=0?normalizeClassName(r[iClass]):'',residence:iStatus>=0?(String(r[iStatus]).toLowerCase().includes('board')?'boarding':'day'):'',balance_bf:iBF>=0?parseMoney(r[iBF]):0,actual_fee:iActual>=0?parseMoney(r[iActual]):0,holiday_fee:iHoliday>=0?parseMoney(r[iHoliday]):0,academics_fee:iAcademics>=0?parseMoney(r[iAcademics]):0,functional_fee:iFunc>=0?parseMoney(r[iFunc]):0,transport_fee:iTrans>=0?parseMoney(r[iTrans]):0,deposit_1:iD1>=0?parseMoney(r[iD1]):0,deposit_2:iD2>=0?parseMoney(r[iD2]):0,deposit_3:iD3>=0?parseMoney(r[iD3]):0});
  }
  const students=window._allStudents||[];const nameIndex={};students.forEach(s=>{const k=normalizeName(s.first_name,s.last_name);if(!nameIndex[k])nameIndex[k]=[];nameIndex[k].push(s);});
  window._importMatches=parsed.map(row=>{
    const k=normalizeName(row.first_name,row.last_name);const cands=nameIndex[k]||[];let status='missing',chosen=null;
    if(cands.length===1){status='exact';chosen=cands[0];}else if(cands.length>1){status='ambiguous';}
    else{const fm=students.filter(s=>String(s.first_name||'').toLowerCase().trim()===row.first_name.toLowerCase().trim());if(fm.length===1){status='fuzzy';chosen=fm[0];}else if(fm.length>1){status='ambiguous';}}
    return {row,candidates:cands,status,chosen};
  });
  status.innerHTML='<b style="color:#047857">✅ '+parsed.length+' rows</b>';renderImportPreview();
}
window.processImportRows=processImportRows;

function renderImportPreview(){
  const c=document.getElementById('importPreview');if(!c)return;
  const m=window._importMatches||[];
  const counts={exact:0,fuzzy:0,ambiguous:0,missing:0};m.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);
  let rows='';
  m.forEach((x,i)=>{const charged=x.row.balance_bf+x.row.actual_fee+x.row.holiday_fee+x.row.academics_fee+x.row.functional_fee+x.row.transport_fee;const collected=x.row.deposit_1+x.row.deposit_2+x.row.deposit_3;const bal=charged-collected;const cls=x.chosen?((_classesCache||[]).find(c=>c.id===x.chosen.class_id)||{}).name:'';const badge={exact:'✅',fuzzy:'⚠️',ambiguous:'❓',missing:'❌'}[x.status]||'';rows+='<tr><td>'+(i+1)+'</td><td><b>'+esc(x.row.rawName)+'</b><div class="muted" style="font-size:11px">'+esc(x.row.class_name||'')+'</div></td><td>'+(x.chosen?esc(x.chosen.first_name+' '+(x.chosen.last_name||'')):'—')+'</td><td>'+esc(cls||x.row.class_name||'')+'</td><td style="text-align:right">'+fmtNum(charged)+'</td><td style="text-align:right;color:#047857">'+fmtNum(collected)+'</td><td style="text-align:right;color:'+(bal>0?'#b91c1c':'#047857')+'">'+fmtNum(bal)+'</td><td>'+badge+'</td><td>'+(x.status==='ambiguous'?'<button class="btn sm" onclick="pickAmbiguous('+i+')">Pick</button>':'')+'</td></tr>';});

}

async function applyImport(btn){

  for(const x of creates){try{const r=x.row;const cls=classByName[r.class_name.toLowerCase()];const charged=r.balance_bf+r.actual_fee+r.holiday_fee+r.academics_fee+r.functional_fee+r.transport_fee;const collected=r.deposit_1+r.deposit_2+r.deposit_3;await rest('/rest/v1/students',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,admission_no:'ADM-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-5)+Math.floor(Math.random()*100),class_id:cls?cls.id:null,first_name:r.first_name,last_name:r.last_name||null,residence:r.residence||'day',status:'active',balance_bf:r.balance_bf,actual_fee:r.actual_fee,holiday_fee:r.holiday_fee,academics_fee:r.academics_fee,functional_fee:r.functional_fee,transport_fee:r.transport_fee,deposit_1:r.deposit_1,deposit_2:r.deposit_2,deposit_3:r.deposit_3,total_expected:charged,current_balance:charged-collected})});cr++;}catch(e){err++;console.error(e);}}
  toast('Done: '+u+' updated, '+cr+' created, '+err+' errors',err?'bad':'ok');
  window._importMatches=null;nav('fees');

function levelOfClass(c){const n=String(c||'').toLowerCase();if(n.includes('baby')||n.includes('middle')||n.includes('top'))return 'nursery';if(n.includes('primary 1')||n.includes('primary 2')||n.includes('primary 3'))return 'lower';if(n.includes('primary 4')||n.includes('primary 5')||n.includes('primary 6')||n.includes('primary 7'))return 'upper';return 'lower';}
function divisionOf(avg){if(avg>=75)return 'I';if(avg>=55)return 'II';if(avg>=40)return 'III';if(avg>0)return 'IV';return '—';}
const REPORT_SUBJECT_LABEL={'ENG':'ENGLISH','MATH':'MATH','SCI':'SCIENCE','SST':'SOCIAL STUDIES','RE':'R.E','LIT1':'LITERACY 1','LIT2':'LITERACY 2','NUM':'NUMBERS','RDG':'READING','SOC':'SOCIAL DEVELOPMENT','HH':'HEALTH HABITS','LA1':'LEARNING AREA 1'};

function buildReportCardHTML(s,subjects,exams,marks,students){
  const cls=(_classesCache||[]).find(c=>c.id===s.class_id);const className=cls?.name||'';
  const level=levelOfClass(className);const per=marks[s.id]||{};
  const maxStage=Number(_repStage)||3;
  const activeExams=(_examsCache||[]).filter(e=>Number(e.stage)>=1&&Number(e.stage)<=maxStage).sort((a,b)=>Number(a.stage)-Number(b.stage));
  const ranked=students.map(st=>{const m=marks[st.id]||{};let t=0,c=0;activeExams.forEach(e=>subjects.forEach(sj=>{const v=m[e.id]?.[sj.subject_id];if(v!=null&&!isNaN(v)){t+=Number(v);c++;}}));return {id:st.id,total:t,avg:c?t/c:0,cnt:c};}).filter(x=>x.cnt>0).sort((a,b)=>b.avg-a.avg);
  ranked.forEach((r,i)=>r.pos=i+1);for(let i=1;i<ranked.length;i++)if(ranked[i].avg===ranked[i-1].avg)ranked[i].pos=ranked[i-1].pos;
  const myRank=ranked.find(r=>r.id===s.id);const myPos=s.position_manual||(myRank?.pos||0);const totalOutOf=ranked.length;
  const logoUrl=_school?.logo_url||_school?.logo_data||'';
  const logoImg=logoUrl?'<img src="'+esc(logoUrl)+'" style="width:80px;height:80px;object-fit:contain">':'<div style="width:80px;height:80px;border-radius:50%;background:#e1bee7;border:2px solid #7b1fa2;display:grid;place-items:center;font-size:32px;color:#4a148c">🏛️</div>';
  const cell='padding:4px 6px;border:1px solid #7b1fa2;font-size:11px;';
  const headCell=cell+'background:#f3e5f5;font-weight:700;color:#4a148c;text-align:center;text-transform:uppercase;font-size:10px;';
  const labelCell=cell+'background:#f3e5f5;font-weight:700;color:#4a148c;';
  const centerCell=cell+'text-align:center;';
  const photoBox='<div style="width:70px;height:85px;border:1.5px solid #7b1fa2;background:#fafafa;position:absolute;top:10px;right:14px"></div>';
  const header='<div style="position:relative;text-align:center;padding-bottom:10px;border-bottom:2.5px solid #7b1fa2;margin-bottom:8px"><div style="display:flex;align-items:center;justify-content:center;gap:14px">'+logoImg+'<div style="flex:1"><div style="font-family:Georgia,serif;font-size:20px;font-weight:900;color:#6a1b9a;line-height:1.1">'+SCHOOL_HEADER.name+'</div><div style="font-size:11px;color:#4a148c;margin-top:3px">'+SCHOOL_HEADER.po+'</div><div style="font-size:11px;color:#4a148c">'+SCHOOL_HEADER.tel+'</div><div style="font-size:11px;color:#4a148c">'+SCHOOL_HEADER.email+'</div><div style="font-size:11px;color:#4a148c">'+SCHOOL_HEADER.website+'</div><div style="font-family:Georgia,serif;font-size:15px;font-weight:800;color:#6a1b9a;letter-spacing:2px;margin-top:8px">TERMLY REPORT</div></div></div>'+photoBox+'</div>';
  const line=(label,val)=>'<div style="display:flex;align-items:baseline;gap:6px;margin:2px 0"><span style="font-size:11px;color:#4a148c;font-weight:700;min-width:110px">'+label+'</span><span style="flex:1;border-bottom:1px dotted #7b1fa2;padding:1px 4px;font-size:12px;font-weight:700;color:#1a1a1a">'+(val||'')+'</span></div>';
  const termLabel={1:'ONE',2:'TWO',3:'THREE'}[getCurrentTerm()]||getCurrentTerm();
  let infoRows='<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 20px">'+line("PUPIL'S NAME:", esc(s.first_name+' '+(s.last_name||'')).toUpperCase())+line('CLASS:', esc(className).toUpperCase())+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:0 20px">'+line('LIN NO:', esc(s.lin||''))+line('TERM:', termLabel+'    YEAR: '+getCurrentYear())+'</div>';
  if(level!=='upper'){infoRows+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 20px">'+line('POSITION:', (myPos?myPos+'TH':'—')+' OUT OF '+totalOutOf)+line('DIVISION:', s.division_manual||divisionOf(myRank?.avg||0))+'</div>';}
  infoRows+=line('SCHOOL PAY CODE:', esc(s.school_pay_code||''));
  const info='<div style="margin:6px 0 10px">'+infoRows+'</div>';
  const midtermSubjects=level==='upper'?['ENGLISH','MATH','SCIENCE','SOCIAL STUDIES','TOTAL']:level==='lower'?['ENGLISH','MATH','LITERACY 1','LITERACY 2','R.E','TOTAL']:['LIT 1','NUMBERS','READING','SOC DEV','HEALTH','LEARN AREA','R.E','TOTAL'];
  let midHead='<tr><th style="'+headCell+'" colspan="'+(midtermSubjects.length+1)+'">MIDTERM EXAMINATIONS RECORD</th></tr><tr><th style="'+headCell+'">SUBJECTS</th>'+midtermSubjects.map(x=>'<th style="'+headCell+'">'+x+'</th>').join('')+'</tr>';
  const midRows='<tr><td style="'+labelCell+'">SCORE</td>'+midtermSubjects.map(()=>'<td style="'+centerCell+'height:22px"></td>').join('')+'</tr><tr><td style="'+labelCell+'">AGGREGATES</td>'+midtermSubjects.map(()=>'<td style="'+centerCell+'height:22px"></td>').join('')+'</tr>';
  const midterm='<table style="width:100%;border-collapse:collapse;margin-bottom:8px"><thead>'+midHead+'</thead><tbody>'+midRows+'</tbody></table>';
  let examHeaderCells='';activeExams.forEach(e=>{const label=STAGE_LABELS[e.stage]||e.name;examHeaderCells+='<th style="'+headCell+'" colspan="2">'+esc(label)+'</th>';});
  let subHeaderCells='';activeExams.forEach(()=>{subHeaderCells+='<th style="'+headCell+'">MARKS</th><th style="'+headCell+'">AGG</th>';});
  let eotRows='';let grandPerExam={};let aggPerExam={};
  activeExams.forEach(e=>{grandPerExam[e.id]=0;aggPerExam[e.id]=0;});
  subjects.forEach(sj=>{let row='<td style="'+labelCell+'">'+esc(REPORT_SUBJECT_LABEL[sj.code]||sj.name)+'</td>';activeExams.forEach(e=>{const v=per[e.id]?.[sj.subject_id];const score=v!=null&&!isNaN(v)?Number(v):null;const g=score!=null?gradeOf(score):null;if(score!=null){grandPerExam[e.id]+=score;if(g)aggPerExam[e.id]+=Number(g.agg);}row+='<td style="'+centerCell+'">'+(score!=null?score:'')+'</td><td style="'+centerCell+'">'+(g?g.agg:'')+'</td>';});eotRows+='<tr>'+row+'</tr>';});
  let totalRow='<td style="'+labelCell+'">TOTAL</td>';activeExams.forEach(e=>{totalRow+='<td style="'+centerCell+';font-weight:800">'+grandPerExam[e.id]+'</td><td style="'+centerCell+';font-weight:800">'+(aggPerExam[e.id]||'—')+'</td>';});
  eotRows+='<tr style="background:#f3e5f5">'+totalRow+'</tr>';
  const eot='<table style="width:100%;border-collapse:collapse;margin-bottom:8px"><thead><tr><th style="'+headCell+'" colspan="'+(1+activeExams.length*2)+'">END OF TERM PERFORMANCE</th></tr><tr><th style="'+headCell+';text-align:left" rowspan="2">SUBJECT</th>'+examHeaderCells+'</tr><tr>'+subHeaderCells+'</tr></thead><tbody>'+eotRows+'</tbody></table>';
  const gradePairs=[['90-100','D1'],['80-89','D2'],['70-79','C3'],['60-69','C4'],['55-59','C5'],['50-54','C6'],['45-49','P7'],['40-44','P8'],['0-39','F9']];
  let scaleCells='';gradePairs.forEach(([range])=>{scaleCells+='<td style="'+centerCell+'font-weight:700;font-size:10px">'+range+'</td>';});
  let scaleCells2='';gradePairs.forEach(([,g])=>{scaleCells2+='<td style="'+centerCell+'font-weight:900;font-size:12px;color:#6a1b9a">'+g+'</td>';});
  const scale='<table style="width:100%;border-collapse:collapse;margin-bottom:8px"><thead><tr><th style="'+headCell+'" colspan="9">GRADING SCALE %</th></tr></thead><tbody><tr>'+scaleCells+'</tr><tr>'+scaleCells2+'</tr></tbody></table>';
  const dateStr=s.term_ended_on?new Date(s.term_ended_on).toLocaleDateString('en-GB'):'';
  const nextStr=s.next_term_begins?new Date(s.next_term_begins).toLocaleDateString('en-GB'):'';
  const commentRows='<div style="margin-top:6px;font-size:11px;color:#4a148c"><div style="display:flex;gap:8px;margin-bottom:6px"><b style="min-width:80px">Conduct:</b><span style="flex:1;border-bottom:1px dotted #7b1fa2;min-height:18px;padding:1px 4px;color:#1a1a1a">'+esc(s.conduct||'')+'</span></div><div style="display:flex;gap:8px;margin-bottom:6px"><b style="min-width:160px">Class Teacher\'s comment:</b><span style="flex:1;border-bottom:1px dotted #7b1fa2;min-height:18px;padding:1px 4px;color:#1a1a1a">'+esc(s.class_teacher_comment||'')+'</span><b style="min-width:60px">Signature:</b><span style="width:110px;border-bottom:1px dotted #7b1fa2;min-height:18px"></span></div><div style="display:flex;gap:8px;margin-bottom:6px"><b style="min-width:160px">Head Teacher\'s comment:</b><span style="flex:1;border-bottom:1px dotted #7b1fa2;min-height:18px;padding:1px 4px;color:#1a1a1a">'+esc(s.head_teacher_comment||'')+'</span><b style="min-width:60px">Signature:</b><span style="width:110px;border-bottom:1px dotted #7b1fa2;min-height:18px"></span></div><div style="display:flex;gap:12px;margin-top:8px"><div>This term has Ended on: <b style="border-bottom:1px dotted #7b1fa2;padding:0 6px">'+esc(dateStr)+'</b></div><div>Next term begins on: <b style="border-bottom:1px dotted #7b1fa2;padding:0 6px">'+esc(nextStr)+'</b></div></div><div style="text-align:center;font-size:10px;color:#666;margin-top:10px;font-style:italic">Note: This report is valid only when it bears the school stamp</div><div style="display:flex;justify-content:flex-end;margin-top:14px"><div style="width:180px;height:70px;border:1.5px dashed #7b1fa2;border-radius:50%;display:grid;place-items:center;font-size:9px;color:#7b1fa2;text-align:center;line-height:1.3">PROGRESSIVE MOTHERS<br>SCHOOL STAMP</div></div></div>';
  return '<div style="background:#fff;padding:14px;border:2px solid #7b1fa2;max-width:210mm;margin:0 auto">'+header+info+midterm+eot+scale+commentRows+'</div>';
}
window.buildReportCardHTML=buildReportCardHTML;

async function pageReports(root){
  clearClassesCache();
  const classes=await loadClasses();
  if(!_repClass&&classes[0])_repClass=classes[0].id;
  const classObj=classes.find(c=>c.id===_repClass);
  const subjects=await loadSubjectsForClass(_repClass);
  const students=await rest('/rest/v1/students?school_id=eq.'+_schoolId+'&class_id=eq.'+_repClass+'&status=eq.active&select=*&order=first_name')||[];
  if(!_examsCache){_examsCache=await rest('/rest/v1/exams?school_id=eq.'+_schoolId+'&select=*&order=stage')||[];}
  const maxStage=Number(_repStage)||3;
  const exams=(_examsCache||[]).filter(e=>Number(e.stage)>=1&&Number(e.stage)<=maxStage).sort((a,b)=>Number(a.stage)-Number(b.stage));
  const studentIds=students.map(s=>s.id);let marksRows=[];
  if(studentIds.length&&exams.length){const ids=studentIds.join(',');const eids=exams.map(e=>e.id).join(',');marksRows=await rest('/rest/v1/marks?school_id=eq.'+_schoolId+'&student_id=in.('+ids+')&exam_id=in.('+eids+')&select=student_id,exam_id,subject_id,score')||[];}
  const marks={};marksRows.forEach(m=>{if(!marks[m.student_id])marks[m.student_id]={};if(!marks[m.student_id][m.exam_id])marks[m.student_id][m.exam_id]={};marks[m.student_id][m.exam_id][m.subject_id]=Number(m.score);});
  window._reportData={students,subjects,exams,marks,classObj};
  const classOpts=classes.map(c=>'<option value="'+c.id+'"'+(_repClass===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('');
  let pupilOpts='';students.forEach(s=>{pupilOpts+='<option value="'+s.id+'">'+esc(s.admission_no)+' — '+esc(s.first_name+' '+(s.last_name||''))+'</option>';});
  let allCards='';students.forEach(s=>{allCards+=reportCardBlock(s,subjects,exams,marks,false);});
  let body=students.length===0?'<div class="card empty">No pupils.</div>':'<div class="card no-print"><label>View Single Pupil</label><select onchange="showSingleReport(this.value)"><option value="">— Choose —</option>'+pupilOpts+'</select></div><div id="singleReport"></div><div class="card no-print"><h3>📊 Class Ranking</h3>'+rankingTable(students,subjects,exams,marks)+'</div><div class="no-print"><h3 style="padding:0 4px">All Report Cards ('+students.length+')</h3>'+allCards+'</div>';
  root.innerHTML='<div class="page-head"><h1>📄 Report Cards</h1><div class="sub">'+getCurrentYear()+' Term '+getCurrentTerm()+'</div></div><div class="card no-print"><div class="grid grid-2"><div><label>Class</label><select onchange="_repClass=this.value;_repPupil=\'\';pageReports(document.getElementById(\'main\'))">'+classOpts+'</select></div><div><label>Exam Stage</label><select onchange="_repStage=parseInt(this.value);pageReports(document.getElementById(\'main\'))"><option value="1"'+(_repStage===1?' selected':'')+'>Beginning of Term only</option><option value="2"'+(_repStage===2?' selected':'')+'>Beginning + Mid Term</option><option value="3"'+(_repStage===3?' selected':'')+'>Beginning + Mid + End of Term</option></select></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn" onclick="printAllReports()">🖨️ Print All</button><button class="btn ghost" onclick="printBroadsheet()">📊 Broadsheet</button></div></div>'+body;
}
window.pageReports=pageReports;

function showSingleReport(id){_repPupil=id;const c=document.getElementById('singleReport');if(!id){c.innerHTML='';return;}const d=window._reportData;const s=d.students.find(x=>x.id===id);if(!s){c.innerHTML='';return;}c.innerHTML=reportCardBlock(s,d.subjects,d.exams,d.marks,true);setTimeout(()=>{const el=document.getElementById('singleReport');if(el)el.scrollIntoView({behavior:'smooth'});},100);}
window.showSingleReport=showSingleReport;

function reportCardBlock(s,subjects,exams,marks,isSingle){const html=buildReportCardHTML(s,subjects,exams,marks,window._reportData.students);const head=isSingle?'<div class="no-print" style="display:flex;justify-content:space-between;padding:8px 12px;background:#6a1b9a;color:#fff;border-radius:8px 8px 0 0"><b>📄 '+esc(s.first_name+' '+(s.last_name||''))+'</b><button class="btn sm gold" onclick="printOneReport(\''+s.id+'\')">🖨️ Print</button></div>':'<div class="no-print" style="display:flex;justify-content:space-between;padding:8px 12px;background:#f3e5f5;border-radius:8px 8px 0 0"><b>'+esc(s.first_name+' '+(s.last_name||''))+' — '+esc(s.admission_no)+'</b><button class="btn sm" onclick="printOneReport(\''+s.id+'\')">🖨️ Print</button></div>';return '<div style="margin-bottom:16px">'+head+'<div style="background:#fff;padding:20px;border:1px solid #e2e8f0;border-radius:0 0 12px 12px">'+html+'</div></div>';}

function rankingTable(students,subjects,exams,marks){const rows=students.map(s=>{const m=marks[s.id]||{};let t=0,c=0;exams.forEach(e=>subjects.forEach(sj=>{const v=m[e.id]?.[sj.subject_id];if(v!=null&&!isNaN(v)){t+=Number(v);c++;}}));return{s,total:t,avg:c?t/c:0,cnt:c};});rows.sort((a,b)=>b.avg-a.avg);rows.forEach((r,i)=>r.pos=i+1);for(let i=1;i<rows.length;i++)if(rows[i].avg===rows[i-1].avg)rows[i].pos=rows[i-1].pos;let body='';rows.forEach(r=>{const g=gradeOf(r.avg);body+='<tr><td><b>'+posLabel(r.pos)+'</b></td><td>'+esc(r.s.admission_no)+'</td><td>'+esc(r.s.first_name+' '+(r.s.last_name||''))+'</td><td style="text-align:right">'+r.total.toFixed(0)+'</td><td><span class="badge '+g.cls+'">'+g.g+'</span></td><td><button class="btn sm ghost" onclick="showSingleReport(\''+r.s.id+'\')">View</button></td></tr>';});return '<div class="table-wrap"><table><thead><tr><th>Pos</th><th>ADM</th><th>Name</th><th style="text-align:right">Total</th><th>Grade</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div>';}
window.rankingTable=rankingTable;

function printOneReport(id){const d=window._reportData;const s=d.students.find(x=>x.id===id);if(!s){toast('Not found','bad');return;}printHTML('Report — '+s.first_name,'<div style="page-break-inside:avoid">'+buildReportCardHTML(s,d.subjects,d.exams,d.marks,d.students)+'</div>');}
window.printOneReport=printOneReport;

function printAllReports(){const d=window._reportData;if(!d.students.length){toast('No pupils','bad');return;}let pages='';d.students.forEach((s,i)=>{pages+='<div style="page-break-inside:avoid;'+(i<d.students.length-1?'page-break-after:always':'')+'">'+buildReportCardHTML(s,d.subjects,d.exams,d.marks,d.students)+'</div>';});printHTML('All Report Cards',pages);}
window.printAllReports=printAllReports;

function printBroadsheet(){
  const d=window._reportData;
  const ranked=d.students.map(s=>{const m=d.marks[s.id]||{};let t=0,c=0;d.exams.forEach(e=>d.subjects.forEach(sj=>{const v=m[e.id]?.[sj.subject_id];if(v!=null&&!isNaN(v)){t+=Number(v);c++;}}));return{s,total:t,avg:c?t/c:0};}).sort((a,b)=>b.avg-a.avg);
  ranked.forEach((r,i)=>r.pos=i+1);for(let i=1;i<ranked.length;i++)if(ranked[i].avg===ranked[i-1].avg)ranked[i].pos=ranked[i-1].pos;
  let head='<tr><th rowspan="2">Pos</th><th rowspan="2">ADM</th><th rowspan="2">Name</th>';d.exams.forEach(e=>{head+='<th colspan="'+(d.subjects.length+1)+'">'+esc(e.name)+'</th>';});head+='<th rowspan="2">Total</th></tr><tr>';d.exams.forEach(()=>{d.subjects.forEach(sj=>{head+='<th>'+esc(sj.code)+'</th>';});head+='<th>TOT</th>';});head+='</tr>';
  let body='';ranked.forEach(r=>{const m=d.marks[r.s.id]||{};let total=0;let cells='<td><b>'+posLabel(r.pos)+'</b></td><td>'+esc(r.s.admission_no)+'</td><td>'+esc(r.s.first_name+' '+(r.s.last_name||''))+'</td>';d.exams.forEach(e=>{let et=0,any=false;d.subjects.forEach(sj=>{const v=m[e.id]?.[sj.subject_id];if(v!=null&&!isNaN(v)){et+=Number(v);any=true;total+=Number(v);}cells+='<td>'+(v!=null?v.toFixed(0):'—')+'</td>';});cells+='<td style="background:#f3e5f5;font-weight:700">'+(any?et.toFixed(0):'—')+'</td>';});cells+='<td style="font-weight:700">'+total.toFixed(0)+'</td>';body+='<tr>'+cells+'</tr>';});
  printHTML('Broadsheet','<div style="text-align:center"><h2>'+SCHOOL_HEADER.name+'</h2></div><table style="width:100%;border-collapse:collapse"><thead>'+head+'</thead><tbody>'+body+'</tbody></table>');
}
window.printBroadsheet=printBroadsheet;

async function editReportCard(id){

const ALLOWANCE_OPTIONS=['House Allowance','Transport Allowance','Lunch Allowance','Overtime','Responsibility Allowance','Acting Allowance','Risk Allowance','Medical Allowance','Rent Allowance','Air time','Bonus','Holiday Pay','Other'];
const DEDUCTION_OPTIONS=['NSSF','PAYE','Absenteeism','Late Penalty','Damages','Welfare','SACCO','Loan Repayment','Uniform','Advance Recovery','Other'];
const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];

async function pagePayroll(root){
  const now=new Date();if(!_payMonth)_payMonth=now.getMonth()+1;if(!_payYear)_payYear=now.getFullYear();
  const [staff,salaries,advances]=await Promise.all([
    rest('/rest/v1/staff?school_id=eq.'+_schoolId+'&select=*&order=full_name').catch(()=>[]),
    rest('/rest/v1/staff_salaries?school_id=eq.'+_schoolId+'&year=eq.'+_payYear+'&month=eq.'+_payMonth+'&select=*').catch(()=>[]),
    rest('/rest/v1/staff_advances?school_id=eq.'+_schoolId+'&status=eq.open&select=*').catch(()=>[])
  ]);
  const salMap={};salaries.forEach(s=>{salMap[s.staff_id]=s;});
  const advMap={};advances.forEach(a=>{if(!advMap[a.staff_id])advMap[a.staff_id]=0;advMap[a.staff_id]+=Number(a.balance||a.amount||0);});
  let rows='';let tG=0,tA=0,tD=0,tAdv=0,tN=0;
  staff.forEach(st=>{
    const sal=salMap[st.id];const base=Number(st.monthly_salary||st.base_salary||0);
    const allow=sal?Number(sal.allowances||0):0;const ded=sal?Number(sal.deductions||0):0;
    const advOwed=advMap[st.id]||0;const advDed=sal?Number(sal.advance_deducted||0):0;
    const net=sal?Number(sal.net||0):(base+allow-ded);const paid=sal&&sal.status==='paid';
    tG+=base;tA+=allow;tD+=ded;tAdv+=advDed;tN+=net;
    rows+='<tr style="'+(paid?'background:#ecfdf5':'')+'"><td><b>'+esc(st.full_name)+'</b><div class="muted" style="font-size:11px">'+esc(st.role||'')+'</div></td><td style="text-align:right">'+fmtNum(base)+'</td><td style="text-align:right"><input type="number" class="marks-input" value="'+allow+'" data-staff="'+st.id+'" data-field="allowances" onchange="saveSalaryField(this)"></td><td style="text-align:right"><input type="number" class="marks-input" value="'+ded+'" data-staff="'+st.id+'" data-field="deductions" onchange="saveSalaryField(this)"></td><td style="text-align:right">'+fmtNum(advOwed)+'</td><td style="text-align:right"><input type="number" class="marks-input" value="'+advDed+'" data-staff="'+st.id+'" data-field="advance_deducted" onchange="saveSalaryField(this)"></td><td style="text-align:right;font-weight:700;color:#047857">'+fmtNum(net)+'</td><td style="text-align:center">'+(paid?'<span class="badge ok">PAID</span> <button class="btn sm ghost" onclick="undoPay(\''+st.id+'\')">↺</button>':'<button class="btn sm ok" onclick="payStaff(\''+st.id+'\')">💵 Pay</button>')+'</td><td style="text-align:right;white-space:nowrap"><button class="btn sm ghost" onclick="printPayslip(\''+st.id+'\')">🖨️</button> <button class="btn sm wa" onclick="waPayslip(\''+st.id+'\')">💬</button></td></tr>';
  });
  const monthOpts=MONTH_NAMES.map((m,i)=>'<option value="'+(i+1)+'"'+(_payMonth===i+1?' selected':'')+'>'+m+'</option>').join('');
  const years=[];for(let y=now.getFullYear()-2;y<=now.getFullYear()+1;y++)years.push(y);
  const yearOpts=years.map(y=>'<option value="'+y+'"'+(_payYear===y?' selected':'')+'>'+y+'</option>').join('');
  root.innerHTML='<div class="page-head"><div><h1>💼 Monthly Payroll</h1><div class="sub">'+MONTH_NAMES[_payMonth-1]+' '+_payYear+' · '+staff.length+' staff</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="batchPayAll()">💵 Pay All</button><button class="btn ghost" onclick="nav(\'payroll_summary\')">📊 Summary</button></div></div>'+
  '<div class="card"><div class="grid grid-2"><div><label>Month</label><select onchange="_payMonth=parseInt(this.value);pagePayroll(document.getElementById(\'main\'))">'+monthOpts+'</select></div><div><label>Year</label><select onchange="_payYear=parseInt(this.value);pagePayroll(document.getElementById(\'main\'))">'+yearOpts+'</select></div></div></div>'+
  '<div class="grid grid-kpi" style="margin-bottom:14px"><div class="kpi kpi-navy"><div class="v">'+fmtUGX(tG)+'</div><div class="l">Gross</div></div><div class="kpi"><div class="v">'+fmtUGX(tA)+'</div><div class="l">Allowances</div></div><div class="kpi kpi-warn"><div class="v">'+fmtUGX(tD)+'</div><div class="l">Deductions</div></div><div class="kpi kpi-bad"><div class="v">'+fmtUGX(tAdv)+'</div><div class="l">Advance Recovery</div></div><div class="kpi kpi-ok"><div class="v">'+fmtUGX(tN)+'</div><div class="l">Net Payroll</div></div></div>'+
  '<div class="card"><div class="table-wrap"><table style="font-size:12.5px"><thead><tr><th>Staff</th><th style="text-align:right">Gross</th><th style="text-align:right">Allow.</th><th style="text-align:right">Deduct.</th><th style="text-align:right">Adv Owed</th><th style="text-align:right">Adv Deduct</th><th style="text-align:right">Net</th><th style="text-align:center">Status</th><th style="text-align:right">Tools</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

async function saveSalaryField(inputEl){
  const staffId=inputEl.dataset.staff;const field=inputEl.dataset.field;const value=Number(inputEl.value)||0;
  const st=await rest('/rest/v1/staff?id=eq.'+staffId+'&select=*');const staff=st&&st[0];
  const base=Number(staff?.monthly_salary||staff?.base_salary||0);
  const existing=await rest('/rest/v1/staff_salaries?school_id=eq.'+_schoolId+'&staff_id=eq.'+staffId+'&year=eq.'+_payYear+'&month=eq.'+_payMonth+'&select=*');
  const cur=existing&&existing[0];
  const allow=field==='allowances'?value:Number(cur?.allowances||0);
  const ded=field==='deductions'?value:Number(cur?.deductions||0);
  const advDed=field==='advance_deducted'?value:Number(cur?.advance_deducted||0);
  const net=base+allow-ded-advDed;
  try{if(cur){await rest('/rest/v1/staff_salaries?id=eq.'+cur.id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({allowances:allow,deductions:ded,advance_deducted:advDed,advance_deduction:advDed,net:net})});}
  else{await rest('/rest/v1/staff_salaries',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,staff_id:staffId,year:_payYear,month:_payMonth,gross:base,allowances:allow,deductions:ded,advance_deducted:advDed,advance_deduction:advDed,net:net,status:'pending'})});}
  toast('Saved','ok');pagePayroll(document.getElementById('main'));}catch(e){toast(e.message,'bad');}
}
window.saveSalaryField=saveSalaryField;

async function payStaff(staffId){
  const existing=await rest('/rest/v1/staff_salaries?school_id=eq.'+_schoolId+'&staff_id=eq.'+staffId+'&year=eq.'+_payYear+'&month=eq.'+_payMonth+'&select=*');
  const cur=existing&&existing[0];if(!cur){toast('Save amounts first','bad');return;}
  const advDed=Number(cur.advance_deducted||0);
  try{await rest('/rest/v1/staff_salaries?id=eq.'+cur.id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({status:'paid',paid_date:new Date().toISOString().slice(0,10)})});
  if(advDed>0){const advances=await rest('/rest/v1/staff_advances?school_id=eq.'+_schoolId+'&staff_id=eq.'+staffId+'&status=eq.open&select=*&order=given_date');let remaining=advDed;for(const a of (advances||[])){if(remaining<=0)break;const bal=Number(a.balance||a.amount||0);const take=Math.min(bal,remaining);const newBal=bal-take;await rest('/rest/v1/staff_advances?id=eq.'+a.id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({balance:newBal,status:newBal<=0?'closed':'open'})});await rest('/rest/v1/advance_repayments',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,advance_id:a.id,amount:take,notes:'Recovered from '+MONTH_NAMES[_payMonth-1]+' '+_payYear+' salary',at:new Date().toISOString()})});remaining-=take;}}
  toast('Paid','ok');pagePayroll(document.getElementById('main'));}catch(e){toast(e.message,'bad');}
}
window.payStaff=payStaff;

async function batchPayAll(){if(!confirm('Pay ALL pending staff for '+MONTH_NAMES[_payMonth-1]+' '+_payYear+'?'))return;const salaries=await rest('/rest/v1/staff_salaries?school_id=eq.'+_schoolId+'&year=eq.'+_payYear+'&month=eq.'+_payMonth+'&status=eq.pending&select=*');let done=0;for(const s of (salaries||[])){await rest('/rest/v1/staff_salaries?id=eq.'+s.id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({status:'paid',paid_date:new Date().toISOString().slice(0,10)})});const advDed=Number(s.advance_deducted||0);if(advDed>0){const advances=await rest('/rest/v1/staff_advances?school_id=eq.'+_schoolId+'&staff_id=eq.'+s.staff_id+'&status=eq.open&select=*&order=given_date');let remaining=advDed;for(const a of (advances||[])){if(remaining<=0)break;const bal=Number(a.balance||a.amount||0);const take=Math.min(bal,remaining);const newBal=bal-take;await rest('/rest/v1/staff_advances?id=eq.'+a.id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({balance:newBal,status:newBal<=0?'closed':'open'})});await rest('/rest/v1/advance_repayments',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,advance_id:a.id,amount:take,notes:'Batch '+MONTH_NAMES[_payMonth-1]+' '+_payYear,at:new Date().toISOString()})});remaining-=take;}}done++;}toast('Paid '+done,'ok');pagePayroll(document.getElementById('main'));}

async function pagePayrollSummary(root){
  const year=_payYear||new Date().getFullYear();
  const rows=await rest('/rest/v1/staff_salaries?school_id=eq.'+_schoolId+'&year=eq.'+year+'&select=*').catch(()=>[]);
  const staff=await rest('/rest/v1/staff?school_id=eq.'+_schoolId+'&select=id,full_name,role&order=full_name');
  const staffMap={};staff.forEach(s=>{staffMap[s.id]=s;});
  const monthly={};for(let m=1;m<=12;m++)monthly[m]={gross:0,allow:0,ded:0,adv:0,net:0,count:0};
  rows.forEach(r=>{const m=Number(r.month||0);if(monthly[m]){monthly[m].gross+=Number(r.gross||0);monthly[m].allow+=Number(r.allowances||0);monthly[m].ded+=Number(r.deductions||0);monthly[m].adv+=Number(r.advance_deducted||0);monthly[m].net+=Number(r.net||0);monthly[m].count++;}});
  let summaryRows='';let totNet=0;
  for(let m=1;m<=12;m++){const d=monthly[m];if(d.count===0)continue;totNet+=d.net;summaryRows+='<tr><td><b>'+MONTH_NAMES[m-1]+'</b></td><td style="text-align:center">'+d.count+'</td><td style="text-align:right">'+fmtNum(d.gross)+'</td><td style="text-align:right">'+fmtNum(d.allow)+'</td><td style="text-align:right">'+fmtNum(d.ded)+'</td><td style="text-align:right">'+fmtNum(d.adv)+'</td><td style="text-align:right;font-weight:700;color:#047857">'+fmtNum(d.net)+'</td></tr>';}
  const byStaff={};rows.forEach(r=>{if(!byStaff[r.staff_id])byStaff[r.staff_id]={gross:0,net:0,months:0};byStaff[r.staff_id].gross+=Number(r.gross||0);byStaff[r.staff_id].net+=Number(r.net||0);byStaff[r.staff_id].months++;});
  let staffRows='';Object.keys(byStaff).forEach(sid=>{const d=byStaff[sid];const st=staffMap[sid];staffRows+='<tr><td><b>'+esc(st?st.full_name:'—')+'</b></td><td>'+esc(st?st.role||'':'')+'</td><td style="text-align:center">'+d.months+'</td><td style="text-align:right">'+fmtNum(d.gross)+'</td><td style="text-align:right;font-weight:700;color:#047857">'+fmtNum(d.net)+'</td></tr>';});
  root.innerHTML='<div class="page-head"><div><h1>📊 Payroll Summary</h1><div class="sub">'+year+' · Net: '+fmtUGX(totNet)+'</div></div></div><div class="card"><h3>By Month</h3><div class="table-wrap"><table><thead><tr><th>Month</th><th style="text-align:center">Staff</th><th style="text-align:right">Gross</th><th style="text-align:right">Allow.</th><th style="text-align:right">Deduct.</th><th style="text-align:right">Advance</th><th style="text-align:right">Net</th></tr></thead><tbody>'+(summaryRows||'<tr><td colspan="7" class="empty">No data</td></tr>')+'</tbody></table></div></div><div class="card"><h3>By Staff</h3><div class="table-wrap"><table><thead><tr><th>Staff</th><th>Role</th><th style="text-align:center">Months</th><th style="text-align:right">Gross YTD</th><th style="text-align:right">Net YTD</th></tr></thead><tbody>'+(staffRows||'<tr><td colspan="5" class="empty">No data</td></tr>')+'</tbody></table></div></div>';
}

function addUniform(){modal('<h3>New Uniform Sale</h3><div><label>Item</label><input id="u_i"></div><div class="grid grid-2" style="margin-top:12px"><div><label>Qty</label><input id="u_q" type="number" value="1"></div><div><label>Unit Price</label><input id="u_p" type="number" value="0"></div></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveUniform()">Save</button></div>');}
window.addUniform=addUniform;
async function saveUniform(){const item=document.getElementById('u_i').value.trim();const quantity=Number(document.getElementById('u_q').value)||1;const unit_price=Number(document.getElementById('u_p').value)||0;if(!item){toast('Enter item','bad');return;}try{await rest('/rest/v1/uniform_sales',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,item,quantity,unit_price,total_amount:quantity*unit_price})});toast('Saved','ok');closeModal();nav('uniforms');}catch(e){toast(e.message,'bad');}}
window.saveUniform=saveUniform;

async function pageExpenses(root){const cy=getCurrentYear();let rows=await rest('/rest/v1/expenses?school_id=eq.'+_schoolId+'&select=*&order=spent_at.desc').catch(()=>[]);rows=rows.filter(e=>(e.year===cy||e.academic_year===cy));const total=rows.reduce((s,x)=>s+Number(x.amount),0);let body='';rows.forEach(e=>{body+='<tr><td>'+fmtDate(e.spent_at)+'</td><td>'+esc(e.description)+'</td><td>'+esc(e.category||'')+'</td><td style="text-align:right;color:#b91c1c">'+fmtUGX(e.amount)+'</td></tr>';});root.innerHTML='<div class="page-head"><div><h1>💸 Expenses</h1><div class="sub">'+fmtUGX(total)+'</div></div><button class="btn" onclick="addExpense()">＋ Add</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right">Amount</th></tr></thead><tbody>'+body+'</tbody></table></div></div>';}
window.pageExpenses=pageExpenses;
function addExpense(){modal('<h3>Add Expense</h3><div><label>Description *</label><input id="x_d"></div><div style="margin-top:12px"><label>Amount *</label><input id="x_a" type="number"></div><div style="margin-top:12px"><label>Category</label><input id="x_c"></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveExpense()">Save</button></div>');}
window.addExpense=addExpense;
async function saveExpense(){const description=document.getElementById('x_d').value.trim();const amount=Number(document.getElementById('x_a').value);const category=document.getElementById('x_c').value.trim();if(!description||!amount){toast('Fill required','bad');return;}const body={school_id:_schoolId,description,amount,category,year:getCurrentYear(),term:getCurrentTerm()};try{try{await rest('/rest/v1/expenses',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});}catch(e){body.academic_year=body.year;delete body.year;await rest('/rest/v1/expenses',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});}toast('Saved','ok');closeModal();nav('expenses');}catch(e){toast(e.message,'bad');}}
window.saveExpense=saveExpense;

async function pageMessages(root){const msgs=await rest('/rest/v1/messages?school_id=eq.'+_schoolId+'&select=*&order=sent_at.desc&limit=100')||[];let rows='';msgs.forEach(m=>{const wa=waLink(m.parent_contact);rows+='<tr><td>'+fmtDate(m.sent_at)+'</td><td>'+esc(m.parent_contact||'—')+'</td><td>'+esc(m.body)+'</td><td>'+(wa?'<a href="https://wa.me/'+wa+'" target="_blank" class="btn sm wa" style="text-decoration:none">💬</a>':'')+'</td></tr>';});root.innerHTML='<div class="page-head"><h1>💬 Messages</h1></div><div class="card"><button class="btn" onclick="addMessage()">＋ New</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Date</th><th>To</th><th>Body</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';}
window.pageMessages=pageMessages;
function addMessage(){modal('<h3>New Message</h3><div><label>Parent Contact</label><input id="m_c"></div><div style="margin-top:12px"><label>Body</label><textarea id="m_b" rows="4"></textarea></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveMessage()">Save</button></div>');}
window.addMessage=addMessage;
async function saveMessage(){const parent_contact=document.getElementById('m_c').value.trim();const body=document.getElementById('m_b').value.trim();if(!body){toast('Enter body','bad');return;}try{await rest('/rest/v1/messages',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,parent_contact,body})});toast('Saved','ok');closeModal();nav('messages');}catch(e){toast(e.message,'bad');}}
window.saveMessage=saveMessage;

async function pageSettings(root){root.innerHTML='<div class="page-head"><h1>⚙️ Settings</h1></div><div class="card"><h3>School Info</h3><div class="grid grid-2"><div><label>Name</label><input id="s_name" value="'+esc(_school?.name||'')+'"></div><div><label>Telephone</label><input id="s_phone" value="'+esc(_school?.telephone||'')+'"></div><div><label>Address</label><input id="s_addr" value="'+esc(_school?.address||'')+'"></div><div><label>Head Teacher</label><input id="s_head" value="'+esc(_school?.head_teacher||'')+'"></div></div><div style="margin-top:12px"><label>Logo URL</label><input id="s_logo" value="'+esc(_school?.logo_url||'')+'" placeholder="https://..."></div><button class="btn" style="margin-top:14px" onclick="saveSchool()">💾 Save</button></div><div class="card"><h3>Account</h3><div class="muted">Signed in as <b>'+esc(_profile?.full_name||'')+'</b></div><button class="btn danger" style="margin-top:12px" onclick="doLogout()">Sign Out</button></div>';}
window.pageSettings=pageSettings;
async function saveSchool(){const body={name:document.getElementById('s_name').value.trim(),telephone:document.getElementById('s_phone').value.trim(),address:document.getElementById('s_addr').value.trim(),head_teacher:document.getElementById('s_head').value.trim(),logo_url:document.getElementById('s_logo').value.trim()};try{await rest('/rest/v1/schools?id=eq.'+_schoolId,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});_school=Object.assign(_school,body);renderHeader();renderAuthLogo();toast('Saved','ok');}catch(e){toast(e.message,'bad');}}
window.saveSchool=saveSchool;

if(getUser()&&getToken()){boot();}
</script>
</body>
</html>
