}

@media (min-width: 768px){
  .container{
    max-width: 768px;
  }
}

@media (min-width: 1024px){
  .container{
    max-width: 1024px;
  }
}

@media (min-width: 1280px){
  .container{
    max-width: 1280px;
  }
}

@media (min-width: 1536px){
  .container{
    max-width: 1536px;
  }
}

.absolute{
  position: absolute;
}

.block{
  display: block;
}

.inline{
  display: inline;
}

.flex{
  display: flex;
}

.table{
  display: table;
}

.grid{
  display: grid;
}

.transform{
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.border{
  border-width: 1px;
}

.uppercase{
  text-transform: uppercase;
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

:root{
  --navy:#0a2540;
  --navy2:#1e3a5c;
  --gold:#d4a017;
  --gold2:#f2c94c;
  --surface:#ffffff;
  --bg:#f1f5f9;
  --ink:#0a2540;
  --muted:#64748b;
  --line:#e2e8f0;
  --ok:#0f7a4d;
  --bad:#c0392b;
  --amber:#b7790a;
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#122a42;
    --bg:#081a2e;
    --ink:#f5f1e6;
    --muted:#a9bccf;
    --line:#2a435e;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Archivo,system-ui,sans-serif
}

button,input,select,textarea{
  font:inherit
}

.mono{
  font-family:'IBM Plex Mono',monospace
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px
}

.kpi{
  background:var(--surface);
  border:1px solid var(--line);
  border-top:3px solid var(--gold);
  border-radius:14px;
  text-align:center
}

.btn{
  background:var(--navy);
  color:#fff;
  border:0;
  border-radius:999px;
  padding:10px 16px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap
}

.btn-gold{
  background:var(--gold);
  color:#0a2540
}

.btn-ghost{
  background:transparent;
  color:var(--ink);
  border:1px solid var(--line)
}

.btn-danger{
  background:#c0392b;
  color:#fff
}

.btn-ok{
  background:#0f7a4d;
  color:#fff
}

.btn-sm{
  padding:7px 11px;
  font-size:13px
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed
}

.input{
  width:100%;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 11px;
  color:var(--ink);
  outline:none
}

.input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(212,160,23,.18)
}

.label{
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:800;
  margin:6px 0 5px
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border-radius:999px;
  padding:4px 9px;
  font-size:12px;
  font-weight:700
}

.navbtn{
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:#dbe7f2;
  padding:10px 12px;
  border-radius:10px;
  cursor:pointer;
  display:flex;
  gap:10px;
  align-items:center;
  font-weight:600
}

.navbtn.active{
  background:var(--gold);
  color:#0a2540
}

.topbar{
  height:48px;
  background:var(--navy);
  color:#fff
}

.header-card{
  background:linear-gradient(120deg,#0a2540,#1e3a5c);
  border-radius:20px;
  color:#fff
}

.pill{
  border:0;
  border-radius:999px;
  padding:8px 14px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
  font-size:13px
}

.pill-active{
  background:var(--gold);
  color:#0a2540
}

.pill-idle{
  background:rgba(255,255,255,.14);
  color:#fff
}

.pill-idle-light{
  background:#fff;
  border:1px solid var(--line);
  color:var(--ink)
}

.search-pill{
  background:#fff;
  border-radius:999px
}

.bottom-bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:40;
  background:var(--navy);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom))
}

::-webkit-scrollbar{
  height:8px;
  width:8px
}

::-webkit-scrollbar-thumb{
  background:#cbd5e1;
  border-radius:99px
}

table{
  width:100%;
  border-collapse:collapse
}

th{
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
  text-align:left;
  padding:10px 8px;
  border-bottom:2px solid var(--line)
}

td{
  padding:10px 8px;
  border-bottom:1px solid var(--line);
  font-size:14px;
  vertical-align:top
}
</style>

<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Eudes School Management</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a2540;--navy2:#142b4d;--navy3:#1e3a5c;--navy4:#2c5282;--gold:#d4a017;--bg:#eef2f7;--card:#fff;--line:#e2e8f0;--line2:#eef1f6;--text:#0a2540;--text2:#334155;--muted:#64748b;--ok:#059669;--oksoft:#ecfdf5;--warn:#d97706;--bad:#dc2626;--badsoft:#fef2f2;--brandsoft:#e0e9f5;--radius:14px;--radius-lg:20px}
*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;font-family:'Inter',system-ui,sans-serif}body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}input,select,textarea{font-family:inherit;width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--text);font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy)}label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:6px;font-weight:600}
table{width:100%;border-collapse:collapse}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line2);font-size:13.5px}th{color:#fff;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;background:var(--navy)}tbody tr:hover{background:#f9fafb}
h1{font-size:20px;font-weight:700;margin:0 0 4px;color:var(--navy)}h3{font-size:15px;font-weight:700;margin:0 0 12px;color:var(--navy)}.muted{color:var(--muted);font-size:12.5px}
.topbar{position:fixed;top:0;left:0;right:0;height:48px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 12px;z-index:100;gap:10px}.topbar .title{flex:1;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;color:#fff}.topbar .icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:16px}
#app{min-height:100vh;padding-top:48px;padding-bottom:90px;background:var(--bg)}.container{max-width:1100px;margin:0 auto;padding:0 12px}.header-wrap{padding:12px}.header-card{background:linear-gradient(135deg,var(--navy) 0%,var(--navy3) 100%);color:#fff;border-radius:var(--radius-lg);padding:18px;box-shadow:0 8px 24px -8px rgba(10,37,64,.4)}
.header-top{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px}.admin-chip{background:rgba(255,255,255,.15);color:#fff;font-size:10.5px;font-weight:700;padding:4px 12px;border-radius:999px;text-transform:uppercase}.exit-chip{background:#dc2626;color:#fff;font-size:10.5px;font-weight:700;padding:4px 12px;border-radius:999px;cursor:pointer}
.header-school{display:flex;align-items:flex-start;gap:10px;font-size:16px;font-weight:800;margin-bottom:8px;text-transform:uppercase}.header-school .logo{width:36px;height:36px;border-radius:10px;background:var(--gold);display:grid;place-items:center;font-size:18px;flex-shrink:0;color:var(--navy)}.header-school .name{flex:1;padding-top:2px}
.header-meta{font-size:12.5px;color:#cbd5e1;line-height:1.7;display:flex;gap:6px;flex-wrap:wrap}.header-datetime{font-size:12.5px;color:#cbd5e1;line-height:1.7;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.header-periods{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.header-period{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;color:#fff}.header-period select{background:transparent;color:#fff;border:none;padding:0 4px;font-size:12px;font-weight:700;width:auto;cursor:pointer}.header-period select option{color:var(--navy)}
.header-search{position:relative}.header-search input{background:#fff;border:none;border-radius:999px;padding:13px 20px 13px 46px;font-size:13.5px;color:var(--navy);font-weight:500}.header-search .si{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#94a3b8}
.nav-pills{display:flex;gap:8px;padding:12px 0 4px;overflow-x:auto;scrollbar-width:none}.pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;background:#fff;color:var(--navy);font-size:12.5px;font-weight:600;border:1.5px solid var(--line);white-space:nowrap;cursor:pointer}.pill.active{background:var(--navy);color:#fff}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}.page-head .sub{color:var(--muted);font-size:13px;margin-top:3px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}.grid{display:grid;gap:12px}.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
@media(max-width:640px){.grid-2,.grid-3{grid-template-columns:1fr}.grid-kpi{grid-template-columns:1fr 1fr}}
.kpi{background:#fff;border-radius:var(--radius);padding:18px 14px;box-shadow:0 2px 8px rgba(15,23,42,.05);border-top:3px solid var(--gold);text-align:center}.kpi .v{font-size:22px;font-weight:800;color:var(--navy)}.kpi .l{color:var(--muted);font-size:11.5px;margin-top:6px}.kpi.kpi-ok{border-top-color:var(--ok)}.kpi.kpi-bad{border-top-color:var(--bad)}.kpi.kpi-warn{border-top-color:var(--warn)}
.badge{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}.badge.ok{background:var(--oksoft);color:#047857}.badge.bad{background:var(--badsoft);color:#b91c1c}.badge.info{background:var(--brandsoft);color:var(--navy)}.badge.warn{background:#fffbeb;color:#92400e}.badge.req{background:#e0e7ff;color:#3730a3}
.btn{background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}.btn:hover{background:var(--navy3)}.btn:disabled{opacity:.5}.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy)}.btn.danger{background:var(--bad)}.btn.ok{background:var(--ok)}.btn.gold{background:var(--gold)}.btn.sm{padding:6px 12px;font-size:11.5px}.btn.block{width:100%}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;z-index:1000;font-size:13px;max-width:90vw;text-align:center}.toast.bad{background:#7f1d1d}.toast.ok{background:#065f46}

async function handleExcelUpload(input){if(!input.files||!input.files.length)return;const file=input.files[0];const reader=new FileReader();reader.onload=async function(e){try{const data=new Uint8Array(e.target.result);const wb=XLSX.read(data,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1});const classes=await loadClasses();const toInsert=[];for(let i=1;i<rows.length;i++){const row=rows[i];if(!row||!row[1])continue;const full=String(row[1]).trim();const parts=full.split(' ');const fn=parts[0];const ln=parts.slice(1).join(' ')||null;const cn=String(row[2]||'').trim();let cid=null;if(cn){const m=classes.find(c=>c.name.toLowerCase()===cn.toLowerCase());if(m)cid=m.id}const gn=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.-]/g,''));return isNaN(n)?0:n};const bf=gn(row[5]),af=gn(row[7]);let ff=gn(row[10]);if(!ff)ff=FUNC_FEE_DEFAULT;const tf=gn(row[12]);toInsert.push({school_id:_schoolId,admission_no:row[0]?'ADM-'+String(row[0]).trim():'ADM-'+Math.floor(Math.random()*10000),first_name:fn,last_name:ln,lin:generateLIN(fn),class_id:cid,boarding_status:String(row[3]||'Day').trim(),parent_contact:row[4]?String(row[4]).trim():null,location:row[18]?String(row[18]).trim():null,balance_bf:bf,actual_fee:af,functional_fee:ff,transport_fee:tf,total_expected:bf+af+tf,current_balance:bf+af+tf,functional_fee_status:'pending',status:'active'})}for(let i=0;i<toInsert.length;i+=50)await rest('/rest/v1/students',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(toInsert.slice(i,i+50))});toast('Imported '+toInsert.length,'ok');input.value='';nav('students')}catch(err){toast(err.message,'bad');input.value=''}};reader.readAsArrayBuffer(file)}

function filterFeesTable(){const fc=document.getElementById('feesClassFilter')?.value||'';const m=document.getElementById('feesOwingFilter')?.value||'all';const paid=window._paidByStudentFees||{};let list=window._allFeeStudents||[];if(fc)list=list.filter(s=>s.class_id===fc);if(m==='owing')list=list.filter(s=>{const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);return (sf-((paid[s.id]||{school:0}).school))>0});const c=document.getElementById('feesTableContainer');if(!list.length){c.innerHTML='<div class="empty">No match for '+getCurrentYear()+' Term '+getCurrentTerm()+'.</div>';return}c.innerHTML='<div class="table-wrap"><table><thead><tr><th>Adm No</th><th>Name</th><th>Class</th><th style="text-align:right">Expected</th><th style="text-align:right">Paid (period)</th><th style="text-align:right">Balance</th><th style="text-align:right">Actions</th></tr></thead><tbody>'+list.map(s=>{const cls=(window._allClassesForFees||[]).find(x=>x.id===s.class_id);const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);const p=paid[s.id]||{school:0};const bal=sf-p.school;return '<tr><td><b>'+esc(s.admission_no)+'</b></td><td>'+esc(s.first_name+' '+(s.last_name||''))+'</td><td><span class="badge info">'+esc(cls?cls.name:'—')+'</span></td><td style="text-align:right">'+sf.toLocaleString()+'</td><td style="text-align:right;color:#047857">'+p.school.toLocaleString()+'</td><td style="text-align:right"><span class="badge '+(bal>0?'bad':'ok')+'">'+bal.toLocaleString()+'</span></td><td style="text-align:right"><button class="btn sm" onclick="recordPayment(\\''+s.id+'\\')">\uD83D\uDCB5</button> <button class="btn sm ghost" onclick="viewPaymentHistory(\\''+s.id+'\\')">\uD83D\uDCCB</button></td></tr>'}).join('')+'</tbody></table></div>'}

async function recordPayment(id){const [st,pays]=await Promise.all([rest('/rest/v1/students?id=eq.'+id+'&select=*'),rest('/rest/v1/payments?student_id=eq.'+id+periodFilter()+'&select=amount,payment_for')]);const s=st[0];if(!s)return;const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);const sp=pays.filter(p=>p.payment_for!=='Functional Fees').reduce((sum,p)=>sum+Number(p.amount),0);const bal=sf-sp;const now=new Date();const l=new Date(now-now.getTimezoneOffset()*60000).toISOString().slice(0,16);modal('<h3>\uD83D\uDCB5 Record Payment — '+esc(s.first_name+' '+(s.last_name||''))+'</h3><div style="background:var(--brandsoft);padding:12px;border-radius:10px;margin-bottom:16px">\uD83D\uDCDA <b>School Balance (this period):</b> '+fmtUGX(bal)+'<br>\uD83D\uDCC5 Tagged: <b>'+getCurrentYear()+' · Term '+getCurrentTerm()+'</b></div><div class="grid grid-2"><div><label>Payment For *</label><select id="p_for"><option value="School Fees">\uD83D\uDCDA School Fees</option><option value="Functional Fees">\uD83E\uDDFE Functional Fees</option></select></div><div><label>Amount (UGX) *</label><input id="p_amount" type="number"></div><div><label>Method *</label><select id="p_method" onchange="toggleTxn()"><option value="Cash">\uD83D\uDCB5 Cash</option><option value="Mobile Money">\uD83D\uDCF1 MoMo</option><option value="Bank Transfer">\uD83C\uDFE6 Bank</option><option value="Cheque">\uD83D\uDCDD Cheque</option></select></div><div><label>Date & Time *</label><input id="p_date" type="datetime-local" value="'+l+'"></div><div id="txnIdField" style="display:none"><label>Transaction ID *</label><input id="p_txn"></div><div><label>Notes</label><input id="p_notes"></div></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn ok" onclick="savePayment(\\''+id+'\\')">\uD83D\uDCBE Save</button></div>')}
function toggleTxn(){const m=document.getElementById('p_method').value;const f=document.getElementById('txnIdField');if(m==='Cash'){f.style.display='none'}else f.style.display='block'}
async function savePayment(id){const pf=document.getElementById('p_for').value;const amt=parseFloat(document.getElementById('p_amount').value);const method=document.getElementById('p_method').value;const txn=(document.getElementById('p_txn')?.value||'').trim();const dv=document.getElementById('p_date').value;const nt=document.getElementById('p_notes').value.trim();if(!amt||amt<=0){toast('Invalid amount','bad');return}if(method!=='Cash'&&!txn){toast('Transaction ID required','bad');return}try{await rest('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({school_id:_schoolId,student_id:id,amount:amt,payment_for:pf,payment_method:method,transaction_id:txn||null,notes:nt||null,paid_at:new Date(dv).toISOString(),academic_year:getCurrentYear(),term:getCurrentTerm()})});if(pf==='Functional Fees')await rest('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({functional_fee_status:'cash'})});toast('Payment: '+fmtUGX(amt)+' saved for '+getCurrentYear()+' Term '+getCurrentTerm(),'ok');closeModal();nav(activeRoute)}catch(e){toast(e.message,'bad')}}
async function viewPaymentHistory(studentId){const [st,pays]=await Promise.all([rest('/rest/v1/students?id=eq.'+studentId+'&select=*').then(r=>r[0]),rest('/rest/v1/payments?student_id=eq.'+studentId+'&select=*&order=paid_at.desc')]);if(!st)return;const rows=(pays||[]).map(p=>'<tr><td>'+fmtDate(p.paid_at)+'</td><td>'+esc(p.payment_for||'')+' ('+(p.academic_year||'?')+' T'+(p.term||'?')+')</td><td style="text-align:right"><b>'+Number(p.amount).toLocaleString()+'</b></td><td>'+esc(p.payment_method||'')+'</td><td><button class="btn sm danger" onclick="delPay(\\''+p.id+'\\',\\''+studentId+'\\')">✕</button></td></tr>').join('');modal('<h3>\uD83D\uDCCB History — '+esc(st.first_name+' '+(st.last_name||''))+'</h3><div class="muted" style="margin-bottom:10px">All periods shown. Current period filter: '+getCurrentYear()+' Term '+getCurrentTerm()+'</div>'+((pays||[]).length?'<div class="table-wrap"><table><thead><tr><th>Date</th><th>For (Year/Term)</th><th style="text-align:right">Amount</th><th>Method</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty">No payments.</div>')+'<div class="actions"><button class="btn ghost" onclick="closeModal()">Close</button></div>')}

async function pageAttendance(root){const classes=await loadClasses();if(!classes.length){root.innerHTML='<div class="card"><div class="empty">Create classes first.</div></div>';return}const fClass=window._attClass||classes[0].id;const fDate=window._attDate||new Date().toISOString().slice(0,10);const [students,records]=await Promise.all([rest('/rest/v1/students?school_id=eq.'+_schoolId+'&class_id=eq.'+fClass+'&status=eq.active&select=*&order=first_name'),rest('/rest/v1/attendance?school_id=eq.'+_schoolId+'&class_id=eq.'+fClass+'&date=eq.'+fDate+'&select=*')]);root.innerHTML='<div class="page-head"><div><h1>\uD83D\uDCC5 Rollcall</h1><div class="sub">'+fmtDate(fDate)+' · '+getCurrentYear()+' Term '+getCurrentTerm()+'</div></div><div style="display:flex;gap:8px"><button class="btn ok" onclick="markAllPresent()">✅ All Present</button><button class="btn" onclick="saveAttendance()">\uD83D\uDCBE Save</button></div></div><div class="card"><div class="grid grid-2"><div><label>Class</label><select onchange="window._attClass=this.value;nav(\\'attendance\\')">'+classes.map(c=>'<option value="'+c.id+'"'+(c.id===fClass?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div><div><label>Date</label><input type="date" value="'+fDate+'" onchange="window._attDate=this.value;nav(\\'attendance\\')"></div></div></div><div class="card"><h3>Mark Attendance</h3>'+((students||[]).length?'<div class="table-wrap"><table><thead><tr><th>#</th><th>Adm No</th><th>Name</th><th>Status</th></tr></thead><tbody>'+students.map((s,i)=>{const rec=(records||[]).find(r=>r.student_id===s.id);const c=rec?rec.status:'';return '<tr><td>'+(i+1)+'</td><td><b>'+esc(s.admission_no)+'</b></td><td>'+esc(s.first_name+' '+(s.last_name||''))+'</td><td><select class="att-select" data-student="'+s.id+'"><option value=""'+(!c?' selected':'')+'>—</option><option value="present"'+(c==='present'?' selected':'')+'>✅ Present</option><option value="absent"'+(c==='absent'?' selected':'')+'>❌ Absent</option><option async function saveAttendance(){const fClass=window._attClass||(await loadClasses())[0]?.id;const fDate=window._attDate||new Date().toISOString().slice(0,10);const rows=[];document.querySelectorAll('.att-select').forEach(sel=>{if(sel.value==='')return;rows.push({school_id:_schoolId,student_id:sel.dataset.student,class_id:fClass,status:sel.value,date:fDate,academic_year:getCurrentYear(),term:getCurrentTerm()})});if(!rows.length){toast('No statuses','bad');return}try{await rest('/rest/v1/attendance?school_id=eq.'+_schoolId+'&class_id=eq.'+fClass+'&date=eq.'+fDate,{method:'DELETE'});await rest('/rest/v1/attendance',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(rows)});toast('Saved '+rows.length,'ok');nav('attendance')}catch(e){toast(e.message,'bad')}}
async function pageDebtors(root){const [students,classes,payments]=await Promise.all([rest('/rest/v1/students?school_id=eq.'+_schoolId+'&select=*&status=eq.active&order=first_name'),rest('/rest/v1/classes?school_id=eq.'+_schoolId+'&select=id,name'),rest('/rest/v1/payments?school_id=eq.'+_schoolId+periodFilter()+'&select=student_id,amount,payment_for')]);const pbs={};payments.forEach(p=>{if(p.payment_for!=='Functional Fees')pbs[p.student_id]=(pbs[p.student_id]||0)+Number(p.amount)});const debtors=(students||[]).map(s=>{const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);return {...s,owed:sf-(pbs[s.id]||0)}}).filter(s=>s.owed>0).sort((a,b)=>b.owed-a.owed);root.innerHTML='<div class="page-head"><div><h1>\uD83D\uDCCB Debtors — '+getCurrentYear()+' Term '+getCurrentTerm()+'</h1></div></div><div class="card">'+(debtors.length?'<div class="table-wrap"><table><thead><tr><th>Name</th><th>Class</th><th>Parent</th><th style="text-align:right">Owed (period)</th><th></th></tr></thead><tbody>'+debtors.map(s=>{const cls=classes.find(c=>c.id===s.class_id);return '<tr><td><b>'+esc(s.first_name+' '+(s.last_name||''))+'</b></td><td>'+esc(cls?cls.name:'—')+'</td><td>'+esc(s.parent_name||'')+' '+esc(s.parent_contact||'')+'</td><td style="text-align:right"><b>'+s.owed.toLocaleString()+'</b></td><td><button class="btn sm" onclick="recordPayment(\\''+s.id+'\\')">\uD83D\uDCB5</button></td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty">\uD83C\uDF89 No debtors in this period!</div>')+'</div>'}
async function pageReportsAll(root){root.innerHTML='<div class="page-head"><div><h1>\uD83D\uDCC8 Reports</h1><div class="sub">'+getCurrentYear()+' Term '+getCurrentTerm()+'</div></div></div><div class="card"><p class="muted">Use Dashboard + Fees for period totals. Daily report uses the date you pick.</p><div><label>Date</label><input type="date" id="repDate" value="'+new Date().toISOString().slice(0,10)+'"></div><button class="btn" style="margin-top:10px" onclick="renderDailyReport(document.getElementById(\\'repDate\\').value)">Show Daily Report</button><div id="reportBody" style="margin-top:14px"></div></div>'}

function sellUniform(preId){const items=window._uniformItems||[];const students=window._uniformStudents||[];if(!items.length){toast('Add item first','bad');return}if(!students.length){toast('No active pupils','bad');return}const l=new Date(new Date()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);let preCat=UNIFORM_CATEGORIES[0];if(preId){const pre=items.find(x=>x.id===preId);if(pre)preCat=pre.category}modal('<h3>\uD83D\uDED2 Sell Uniform</h3><div class="grid grid-2"><div style="grid-column:1/-1"><label>Pupil *</label><select id="us_student">'+students.map(s=>'<option value="'+s.id+'">'+esc(s.first_name+' '+(s.last_name||'')+' — '+s.admission_no)+'</option>').join('')+'</select></div><div><label>Category *</label><select id="us_cat" onchange="onUniformCategoryChange()">'+UNIFORM_CATEGORIES.map(c=>'<option value="'+c+'"'+(c===preCat?' selected':'')+'>'+c+'</option>').join('')+'</select></div><div><label>Item *</label><select id="us_item"></select></div><div><label>Quantity *</label><input id="us_qty" type="number" value="1" oninput="updateUniformSaleTotal()"></div><div><label>Unit Price</label><input id="us_price" type="number" oninput="updateUniformSaleTotal()"></div><div><label>Total</label><input id="us_total" disabled></div><div><label>Method</label><select id="us_method"><option value="Cash">Cash</option><option value="Mobile Money">MoMo</option><option value="Bank Transfer">Bank</option></select></div><div><label>Date</label><input id="us_date" type="datetime-local" value="'+l+'"></div></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn ok" onclick="saveUniformSale()">\uD83D\uDCBE Record</button></div>');setTimeout(()=>{window._usPre=preId||null;onUniformCategoryChange()},0)}
function onUniformCategoryChange(){const cat=document.getElementById('us_cat').value;const items=(window._uniformItems||[]).filter(i=>(i.category||'Other')===cat);const sel=document.getElementById('us_item');if(!items.length){sel.innerHTML='<option value="">— No items —</option>';return}sel.innerHTML=items.map(i=>'<option value="'+i.id+'" data-price="'+(Number(i.selling_price)||0)+'">'+esc(i.name)+' — '+Number(i.current_stock)+' in stock</option>').join('');if(window._usPre&&items.some(i=>i.id===window._usPre)){sel.value=window._usPre;window._usPre=null}document.getElementById('us_price').value=parseFloat(sel.options[sel.selectedIndex].getAttribute('data-price'))||0;updateUniformSaleTotal()}
