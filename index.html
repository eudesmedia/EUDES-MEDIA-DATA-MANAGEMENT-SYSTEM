<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Progressive Mothers School</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#eef2f7;color:#0a2540;font-size:14px;line-height:1.5}
input,select,button{font-family:inherit;font-size:14px}
input,select{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:10px;background:#fff}
input:focus,select:focus{outline:none;border-color:#0a2540;box-shadow:0 0 0 3px rgba(10,37,64,.1)}
label{display:block;font-size:12px;color:#64748b;margin-bottom:5px;font-weight:600}
button{cursor:pointer;border:none;background:none;color:inherit}
.btn{background:#0a2540;color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#1e3a5c}
.btn.ghost{background:#fff;border:1.5px solid #e2e8f0;color:#0a2540}
.btn.ok{background:#059669}
.btn.bad{background:#dc2626}
.btn.gold{background:#d4a017}
.btn.wa{background:#25D366}
.btn.sm{padding:6px 10px;font-size:11px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.h1{font-size:20px;font-weight:700;margin-bottom:4px}
.sub{font-size:12.5px;color:#64748b}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
@media(max-width:600px){.g2{grid-template-columns:1fr}}
.kpi{background:#fff;border-radius:12px;padding:14px;border-top:3px solid #d4a017;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.kpi .v{font-size:18px;font-weight:800;color:#0a2540;line-height:1.2;word-break:break-word}
.kpi .l{font-size:11px;color:#64748b;margin-top:4px}
.kpi.ok{border-top-color:#059669}
.kpi.bad{border-top-color:#dc2626}
.kpi.navy{border-top-color:#0a2540}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600}
.badge.ok{background:#ecfdf5;color:#047857}
.badge.bad{background:#fef2f2;color:#b91c1c}
.badge.warn{background:#fffbeb;color:#92400e}
.badge.info{background:#e0e9f5;color:#0a2540}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eef1f6;font-size:12.5px}
th{background:#0a2540;color:#fff;font-weight:600;font-size:10.5px;text-transform:uppercase}
tr:hover{background:#f9fafb}
.tbl-wrap{overflow-x:auto;border:1px solid #e2e8f0;border-radius:10px}
.nav{display:flex;gap:6px;padding:10px 0;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:#fff;color:#0a2540;font-size:12px;font-weight:600;border:1.5px solid #e2e8f0}
.nav button.active{background:#0a2540;color:#fff;border-color:#0a2540}
.top{background:#0a2540;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.top .title{flex:1;font-size:13px;font-weight:700;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top button{color:#fff;font-size:16px;padding:6px}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
.header{background:linear-gradient(135deg,#0a2540,#1e3a5c);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.header h2{font-size:16px;text-transform:uppercase;margin-bottom:6px}
.header .meta{font-size:12px;color:#cbd5e1}
.auth{position:fixed;inset:0;background:linear-gradient(135deg,#0a2540,#2c5282);display:flex;align-items:center;justify-content:center;padding:20px;z-index:500}
.auth-card{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:400px}
.auth-card h1{text-align:center;font-size:18px;margin-bottom:4px}
.auth-card .sub{text-align:center;margin-bottom:20px}
.err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:10px;border-radius:8px;margin-top:10px;font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0a2540;color:#fff;padding:10px 20px;border-radius:999px;z-index:1000;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;text-align:center}
.toast.ok{background:#065f46}
.toast.bad{background:#7f1d1d}
.mbg{position:fixed;inset:0;background:rgba(10,37,64,.6);display:flex;align-items:flex-end;justify-content:center;z-index:100;overflow:auto}
@media(min-width:640px){.mbg{align-items:center;padding:16px}}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:700px;max-height:92vh;overflow:auto;padding:20px}
@media(min-width:640px){.modal{border-radius:16px}}
.modal h3{font-size:16px;margin-bottom:14px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid #eef1f6;flex-wrap:wrap}
.empty{text-align:center;padding:30px;color:#94a3b8}
.mini{display:inline-block;padding:5px 10px;background:#f1f5f9;border-radius:6px;font-size:11px;font-weight:600;color:#0a2540;margin:2px}
.hint{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 12px;font-size:11px;color:#92400e;margin-top:8px}
</style>
</head>
<body>

<div class="auth" id="authScreen">
  <div class="auth-card">
    <h1>Progressive Mothers School</h1>
    <div class="sub">Powered by Eudes Media</div>
    <div style="margin-bottom:12px"><label>Email</label><input id="loginEmail" type="email" placeholder="you@example.com"></div>
    <div style="margin-bottom:12px"><label>Password</label><input id="loginPass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div id="loginErr" class="err" style="display:none"></div>
    <button class="btn" style="width:100%;justify-content:center;padding:12px;margin-top:14px" id="loginBtn" onclick="doLogin()">Sign In</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="top">
    <button onclick="doLogout()">⎋</button>
    <div class="title" id="topTitle">SCHOOL</div>
    <button onclick="nav('settings')">⚙️</button>
  </div>
  <div class="wrap">
    <div class="header">
      <h2 id="hdrName">SCHOOL</h2>
      <div class="meta" id="hdrMeta">—</div>
    </div>
    <div class="nav" id="navBar"></div>
    <div id="main"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
const SUPA_URL='https://wabeempxckdtjvrkzhpv.supabase.co';
const SUPA_KEY='PASTE_KEY_HERE';

let _sess=null,_prof=null,_school=null,_schoolId=null,_classes=[],_students=[];
let _route='dashboard';

const store={
  get:(k)=>{try{return localStorage.getItem(k)}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
  del:(k)=>{try{localStorage.removeItem(k)}catch(e){}}
};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ugx(n){if(n==null||isNaN(n))return'UGX 0';return'UGX '+(Number(n)||0).toLocaleString()}
function num(n){if(n==null||isNaN(n))return'0';return(Number(n)||0).toLocaleString()}
function dt(ts){if(!ts)return'—';const d=new Date(ts);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}
function gender(g){if(!g)return'—';const x=String(g).toLowerCase();if(x==='m'||x==='male')return'Male';if(x==='f'||x==='female')return'Female';return'—'}
function isBoard(v){if(!v)return false;const x=String(v).toLowerCase();return x==='boarding'||x==='boarder'}
function tel(p){if(!p)return'';return String(p).replace(/[^0-9+]/g,'')}
function wa(p){if(!p)return'';let c=String(p).replace(/[^0-9]/g,'');if(c.startsWith('0'))c='256'+c.slice(1);return c}

function toast(msg,type){
  const el=document.createElement('div');
  el.className='toast'+(type==='bad'?' bad':(type==='ok'?' ok':''));
  el.textContent=msg;
  document.getElementById('toastRoot').appendChild(el);
  setTimeout(()=>el.remove(),3500);
}
function modal(html){
  const r=document.getElementById('modalRoot');
  r.innerHTML='<div class="mbg"><div class="modal">'+html+'</div></div>';
  r.querySelector('.mbg').addEventListener('click',e=>{if(e.target.classList.contains('mbg'))closeModal()});
}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}

function getToken(){return _sess?_sess.access_token:null}
async function api(path,opt){
  opt=opt||{};
  const h=Object.assign({'apikey':SUPA_KEY,'Content-Type':'application/json'},opt.headers||{});
  h['Authorization']='Bearer '+(getToken()||SUPA_KEY);
  const res=await fetch(SUPA_URL+path,Object.assign({},opt,{headers:h}));
  const txt=await res.text();
  let data=null;try{data=txt?JSON.parse(txt):null}catch(e){data=txt}
  if(!res.ok){
    const msg=(data&&(data.message||data.msg||data.error_description||data.error))||txt||('HTTP '+res.status);
    throw new Error(msg);
  }
  return data;
}

async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass=document.getElementById('loginPass').value;
  const err=document.getElementById('loginErr');
  const btn=document.getElementById('loginBtn');
  err.style.display='none';
  if(!email||!pass){err.textContent='Enter email and password';err.style.display='block';return}
  btn.disabled=true;btn.textContent='Signing in…';
  try{
    const res=await fetch(SUPA_URL+'/auth/v1/token?grant_type=password',{
      method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email,password:pass})
    });
    const txt=await res.text();
    const data=txt?JSON.parse(txt):null;
    if(!res.ok)throw new Error((data&&(data.error_description||data.msg||data.error))||'Login failed');
    _sess={access_token:data.access_token,refresh_token:data.refresh_token,user:data.user};
    store.set('pm_sess',JSON.stringify(_sess));
    await boot();
  }catch(e){
    err.textContent=e.message||String(e);
    err.style.display='block';
  }
  btn.disabled=false;btn.textContent='Sign In';
}

async function doLogout(){
  if(!confirm('Sign out?'))return;
  try{const t=getToken();if(t)await fetch(SUPA_URL+'/auth/v1/logout',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+t}})}catch(e){}
  _sess=null;_prof=null;_school=null;_schoolId=null;
  store.del('pm_sess');
  document.getElementById('app').style.display='none';
  document.getElementById('authScreen').style.display='flex';
}

async function boot(){
  if(!_sess||!_sess.user){document.getElementById('authScreen').style.display='flex';return}
  const errEl=document.getElementById('loginErr');
  try{
    const p=await api('/rest/v1/profiles?id=eq.'+_sess.user.id+'&select=*');
    _prof=p&&p[0];
  }catch(e){errEl.textContent='Profile error: '+e.message;errEl.style.display='block';return}
  if(!_prof){errEl.textContent='Profile not found in database.';errEl.style.display='block';return}
  _schoolId=_prof.school_id;
  if(!_schoolId){errEl.textContent='No school linked to account.';errEl.style.display='block';return}
  try{
    const sc=await api('/rest/v1/schools?id=eq.'+_schoolId+'&select=*');
    _school=sc&&sc[0];
  }catch(e){}
  if(!_school){errEl.textContent='School record not found.';errEl.style.display='block';return}
  document.getElementById('authScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('hdrName').textContent=_school.name||'SCHOOL';
  document.getElementById('topTitle').textContent=_school.name||'SCHOOL';
  const meta=[];
  if(_school.address)meta.push('📍 '+_school.address);
  if(_school.telephone)meta.push('📞 '+_school.telephone);
  document.getElementById('hdrMeta').textContent=meta.length?meta.join(' · '):'—';
  renderNav();
  await nav('dashboard');
}

const ROUTES=[
  {id:'dashboard',label:'📊 Dashboard'},
  {id:'students',label:'🎓 Students'},
  {id:'payments',label:'💳 Payments'},
  {id:'reminders',label:'📨 Reminders'},
  {id:'contacts',label:'📞 Parents'},
  {id:'settings',label:'⚙️ Settings'}
];

function renderNav(){
  document.getElementById('navBar').innerHTML=ROUTES.map(r=>
    '<button class="'+(r.id===_route?'active':'')+'" onclick="nav(\''+r.id+'\')">'+r.label+'</button>'
  ).join('');
}

async function nav(route){
  _route=route;
  renderNav();
  const m=document.getElementById('main');
  m.innerHTML='<div class="card empty">Loading…</div>';
  try{
    if(route==='dashboard')await pageDashboard(m);
    else if(route==='students')await pageStudents(m);
    else if(route==='payments')await pagePayments(m);
    else if(route==='reminders')await pageReminders(m);
    else if(route==='contacts')await pageContacts(m);
    else if(route==='settings')await pageSettings(m);
  }catch(e){
    console.error(e);
    m.innerHTML='<div class="card"><h3 class="h1">⚠️ Error</h3><div class="sub">'+esc(e.message||String(e))+'</div><button class="btn" style="margin-top:12px" onclick="nav(\''+route+'\')">Retry</button></div>';
  }
}
window.nav=nav;

async function loadClasses(){
  if(_classes.length)return _classes;
  _classes=await api('/rest/v1/classes?school_id=eq.'+_schoolId+'&select=id,name,level,sort_order&order=sort_order')||[];
  return _classes;
}
function clearClassCache(){_classes=[]}

async function loadStudents(){
  _students=await api('/rest/v1/students?school_id=eq.'+_schoolId+'&select=*&order=admission_no')||[];
  return _students;
}

async function pageDashboard(root){
  const students=await loadStudents();
  const active=students.filter(s=>s.status!=='inactive');
  let tc=0,tp=0,debt=0;
  active.forEach(s=>{
    const c=Number(s.total_charged)||0,p=Number(s.total_paid)||0;
    tc+=c;tp+=p;if(c-p>0)debt++;
  });
  const bal=tc-tp;
  root.innerHTML=
    '<div class="grid g4" style="margin-bottom:12px">'+
    '<div class="kpi navy"><div class="v">'+active.length+'</div><div class="l">Active Pupils</div></div>'+
    '<div class="kpi ok"><div class="v">'+ugx(tp)+'</div><div class="l">Collected</div></div>'+
    '<div class="kpi bad"><div class="v">'+ugx(bal)+'</div><div class="l">Outstanding</div></div>'+
    '<div class="kpi"><div class="v">'+debt+'</div><div class="l">Debtors</div></div>'+
    '</div>'+
    '<div class="card"><h3 class="h1">Welcome to '+esc(_school.name||'School')+'</h3>'+
    '<div class="sub" style="margin-bottom:12px">Signed in as '+esc(_prof.full_name||_prof.email||'—')+'</div>'+
    '<div class="grid g2">'+
    '<button class="btn" onclick="nav(\'students\')">🎓 View Students</button>'+
    '<button class="btn gold" onclick="openStudentModal()">＋ Register Pupil</button>'+
    '<button class="btn ok" onclick="nav(\'payments\')">💳 Record Payment</button>'+
    '<button class="btn wa" onclick="nav(\'reminders\')">📨 Send Reminders</button>'+
    '</div></div>';
}

async function pageStudents(root){
  clearClassCache();
  const classes=await loadClasses();
  await loadStudents();
  root.innerHTML=
    '<div class="card"><div class="grid g3" style="margin-bottom:12px">'+
    '<input id="sSearch" placeholder="🔍 Search name, ADM, parent…" oninput="renderStudents()">'+
    '<select id="sClass" onchange="renderStudents()"><option value="">All classes</option>'+
      classes.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select>'+
    '<select id="sType" onchange="renderStudents()"><option value="">All</option><option value="Day">Day</option><option value="Boarding">Boarding</option></select>'+
    '</div>'+
    '<div style="margin-bottom:12px"><button class="btn" onclick="openStudentModal()">＋ Register Pupil</button></div>'+
    '<div id="stuTable"></div></div>';
  renderStudents();
}

function renderStudents(){
  const q=(document.getElementById('sSearch').value||'').toLowerCase();
  const cf=document.getElementById('sClass').value||'';
  const tf=document.getElementById('sType').value||'';
  const cBy={};_classes.forEach(c=>cBy[c.id]=c);
  const list=_students.filter(s=>{
    if(cf&&s.class_id!==cf)return false;
    if(tf){const wb=tf==='Boarding';if(wb!==isBoard(s.boarding_status))return false}
    if(q){
      const h=(s.first_name+' '+(s.last_name||'')+' '+(s.admission_no||'')+' '+(s.parent_name||'')+' '+(s.parent_contact||'')).toLowerCase();
      if(h.indexOf(q)===-1)return false;
    }
    return true;
  });
  window._stuFiltered=list;
  const t=document.getElementById('stuTable');
  if(!list.length){t.innerHTML='<div class="empty">No pupils.</div>';return}
  let rows='';
  list.forEach(s=>{
    const cls=cBy[s.class_id];
    const bal=(Number(s.total_charged)||0)-(Number(s.total_paid)||0);
    const pc=(s.parent_contact||'').trim();
    rows+='<tr>'+
      '<td><b>'+esc(s.admission_no||'—')+'</b></td>'+
      '<td><b>'+esc(s.first_name+' '+(s.last_name||''))+'</b><div style="font-size:10.5px;color:#64748b">'+(cls?esc(cls.name):'')+' · '+esc(gender(s.gender))+'</div></td>'+
      '<td>'+esc(s.lin||'—')+'</td>'+
      '<td>'+esc(s.parent_name||'—')+'</td>'+
      '<td>'+esc(pc||'—')+'</td>'+
      '<td>'+(isBoard(s.boarding_status)?'<span class="badge warn">Board</span>':'<span class="badge ok">Day</span>')+'</td>'+
      '<td style="text-align:right"><span class="badge '+(bal>0?'bad':'ok')+'">'+num(bal)+'</span></td>'+
      '<td style="text-align:right;white-space:nowrap">'+
        '<button class="btn sm gold" onclick="openPaymentModal(\''+s.id+'\')" title="Pay">💵</button> '+
        '<button class="btn sm ghost" onclick="openStudentModal(\''+s.id+'\')" title="Edit">✏️</button> '+
        '<button class="btn sm bad" onclick="deleteStudent(\''+s.id+'\')" title="Delete">✕</button>'+
      '</td></tr>';
  });
  t.innerHTML='<div class="tbl-wrap"><table><thead><tr><th>ADM</th><th>Name</th><th>LIN</th><th>Parent</th><th>Phone</th><th>Type</th><th style="text-align:right">Balance</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
window.renderStudents=renderStudents;

function openStudentModal(id){
  const s=id?_students.find(x=>x.id===id):{};
  if(!s)s={};
  const isB=isBoard(s.boarding_status);
  const g=String(s.gender||'').toUpperCase();
  modal('<h3>'+(id?'Edit Pupil':'Register Pupil')+'</h3>'+
    '<div class="grid g2" style="margin-bottom:10px">'+
      '<div><label>Admission No *</label><input id="m_adm" value="'+esc(s.admission_no||('ADM-'+Date.now().toString().slice(-6)))+'"></div>'+
      '<div><label>Class *</label><select id="m_class"><option value="">— Select —</option>'+_classes.map(c=>'<option value="'+c.id+'"'+(s.class_id===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div>'+
    '</div>'+
    '<div class="grid g2" style="margin-bottom:10px">'+
      '<div><label>First Name *</label><input id="m_fn" value="'+esc(s.first_name||'')+'"></div>'+
      '<div><label>Second Name</label><input id="m_ln" value="'+esc(s.last_name||'')+'"></div>'+
    '</div>'+
    '<div class="grid g3" style="margin-bottom:10px">'+
      '<div><label>Gender</label><select id="m_gender"><option value="">—</option><option value="M"'+(g==='M'||g==='MALE'?' selected':'')+'>Male</option><option value="F"'+(g==='F'||g==='FEMALE'?' selected':'')+'>Female</option></select></div>'+
      '<div><label>DOB</label><input id="m_dob" type="date" value="'+esc(s.date_of_birth||'')+'"></div>'+
      '<div><label>LIN</label><input id="m_lin" value="'+esc(s.lin||'')+'"></div>'+
    '</div>'+
    '<div class="grid g3" style="margin-bottom:10px">'+
      '<div><label>Boarding</label><select id="m_res"><option value="Day"'+(isB?'':' selected')+'>Day</option><option value="Boarding"'+(isB?' selected':'')+'>Boarding</option></select></div>'+
      '<div><label>Location</label><input id="m_loc" value="'+esc(s.location||'')+'"></div>'+
      '<div><label>Status</label><select id="m_status"><option value="active"'+(s.status!=='inactive'?' selected':'')+'>Active</option><option value="inactive"'+(s.status==='inactive'?' selected':'')+'>Inactive</option></select></div>'+
    '</div>'+
    '<div class="grid g2" style="margin-bottom:10px">'+
      '<div><label>Parent Name</label><input id="m_par" value="'+esc(s.parent_name||'')+'"></div>'+
      '<div><label>Parent Phone</label><input id="m_pc" value="'+esc(s.parent_contact||'')+'"></div>'+
    '</div>'+
    '<h4 style="font-size:12px;text-transform:uppercase;color:#64748b;margin:14px 0 8px">Fees (UGX)</h4>'+
    '<div class="grid g3" style="margin-bottom:10px">'+
      '<div><label>B/F</label><input id="m_bf" type="number" value="'+(Number(s.balance_bf)||0)+'" oninput="recalcFees()"></div>'+

function recalcFees(){
  const n=f=>Number(document.getElementById(f)?.value)||0;
  const sum=n('m_bf')+n('m_fee')+n('m_func')+n('m_trans')+n('m_hol')+n('m_acad');
  const tc=document.getElementById('m_tc');
  if(tc){tc.value=sum;recalcBal()}
}

function recalcBal(){
  const n=f=>Number(document.getElementById(f)?.value)||0;
  const bal=document.getElementById('m_bal');
  if(bal)bal.value=n('m_tc')-n('m_tp');
}

async function saveStudent(id){
  const n=f=>{const el=document.getElementById(f);if(!el)return 0;const v=el.value.trim();return v===''?0:(Number(v)||0)};
  const v=f=>{const el=document.getElementById(f);return el?el.value.trim():''};
  const adm=v('m_adm'),fn=v('m_fn'),cid=v('m_class');
  if(!adm||!fn||!cid){toast('Fill ADM, First Name and Class','bad');return}
  const bf=n('m_bf'),fee=n('m_fee'),func=n('m_func'),trans=n('m_trans'),hol=n('m_hol'),acad=n('m_acad');
  const tc=n('m_tc')||(bf+fee+func+trans+hol+acad);
  const tp=n('m_tp');
  const bal=tc-tp;
  const body={
    school_id:_schoolId,admission_no:adm,first_name:fn,last_name:v('m_ln')||null,
    class_id:cid,gender:v('m_gender')||null,date_of_birth:v('m_dob')||null,
    lin:v('m_lin')||null,school_pay_code:v('m_code')||null,
    boarding_status:v('m_res')||'Day',location:v('m_loc')||null,
    parent_name:v('m_par')||null,parent_contact:v('m_pc')||null,
    status:v('m_status')||'active',
    balance_bf:bf,actual_fee:fee,functional_fee:func,
    transport_fee:trans,holiday_fee:hol,academics_fee:acad,
    total_charged:tc,total_paid:tp,current_balance:bal
  };
  try{
    if(id)await api('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});
    else await api('/rest/v1/students',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});
    toast('Saved ✓ Charged: '+ugx(tc)+' · Paid: '+ugx(tp)+' · Balance: '+ugx(bal),'ok');
    closeModal();
    await loadStudents();
    nav(_route);
  }catch(e){toast('Save failed: '+e.message,'bad')}
}

async function savePayment(studentId){
  const amount=Number(document.getElementById('pay_amt').value);
  const rno=document.getElementById('pay_rno').value.trim()||('RCP-'+Date.now());
  if(!amount||amount<=0){toast('Enter amount','bad');return}
  const s=_students.find(x=>x.id===studentId);
  if(!s){toast('Not found','bad');return}
  const forWhat=document.getElementById('pay_for').value;
  const method=document.getElementById('pay_method').value;
  const body={
    school_id:_schoolId,student_id:studentId,receipt_no:rno,
    year:new Date().getFullYear(),term:1,academic_year:new Date().getFullYear(),
    amount:amount,method:method,payment_for:forWhat,
    received_by:_prof?_prof.id:null
  };
  try{
    await api('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});
    const newPaid=(Number(s.total_paid)||0)+amount;
    const charged=Number(s.total_charged)||0;
    await api('/rest/v1/students?id=eq.'+studentId,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({total_paid:newPaid,current_balance:Math.max(0,charged-newPaid)})});
    toast('Payment recorded ✓ '+rno,'ok');
    printReceipt(s,{receipt_no:rno,amount:amount,payment_for:forWhat,method:method,date:new Date().toISOString()});
    closeModal();
    await loadStudents();
    nav(_route);
  }catch(e){toast('Save failed: '+e.message,'bad')}
}
window.savePayment=savePayment;

async function pageReminders(root){

    '<div id="conTable"></div></div>';
  renderContacts();
}

function renderContacts(){
  const q=(document.getElementById('cSearch').value||'').toLowerCase();
  const list=(window._contactsAll||[]).filter(r=>{
    if(!q)return true;
    const h=((r.s.parent_name||'')+' '+(r.phone||'')+' '+(r.s.first_name||'')+' '+(r.s.last_name||'')+' '+(r.s.admission_no||'')).toLowerCase();
    return h.indexOf(q)!==-1;
  });
  window._contactsFiltered=list;
  const t=document.getElementById('conTable');
  if(!list.length){t.innerHTML='<div class="empty">No contacts.</div>';return}
  let rows='';
  list.forEach(r=>{
    const s=r.s;
    const actions=r.phone
      ?'<a class="btn sm ghost" style="text-decoration:none" href="tel:'+r.tel+'">📞</a> <a class="btn sm wa" style="text-decoration:none" target="_blank" href="https://wa.me/'+r.wa+'">💬</a>'
      :'<span class="sub">—</span>';
    rows+='<tr>'+
      '<td><b>'+esc(s.admission_no||'—')+'</b></td>'+
      '<td><b>'+esc(s.first_name+' '+(s.last_name||''))+'</b></td>'+
      '<td>'+esc(s.lin||'—')+'</td>'+
      '<td>'+esc(s.parent_name||'—')+'</td>'+
      '<td>'+(r.phone?'<b>'+esc(r.phone)+'</b>':'<span class="badge bad">No phone</span>')+'</td>'+
      '<td style="text-align:right">'+num(r.bal)+'</td>'+
      '<td style="text-align:right;white-space:nowrap">'+actions+'</td>'+
    '</tr>';
  });
  t.innerHTML='<div class="tbl-wrap"><table><thead><tr><th>ADM</th><th>Pupil</th><th>LIN</th><th>Parent</th><th>Phone</th><th style="text-align:right">Balance</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
window.renderContacts=renderContacts;

function downloadCSV(){
  const list=window._contactsFiltered||window._contactsAll||[];
  if(!list.length){toast('Nothing to download','bad');return}
  const head=['ADM','LIN','First Name','Last Name','Gender','Boarding','Parent Name','Parent Phone','Balance'];
  const rows=[head.join(',')];
  list.forEach(r=>{
    const s=r.s;
    const row=[s.admission_no||'',s.lin||'',s.first_name||'',s.last_name||'',gender(s.gender),isBoard(s.boarding_status)?'Boarding':'Day',s.parent_name||'',r.phone||'',r.bal]
      .map(v=>{const str=String(v==null?'':v);if(str.includes(',')||str.includes('"')||str.includes('\n'))return'"'+str.replace(/"/g,'""')+'"';return str});
    rows.push(row.join(','));
  });
  const blob=new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='parents_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('CSV downloaded ('+list.length+' rows)','ok');
}
window.downloadCSV=downloadCSV;

function downloadVCF(){
  const list=(window._contactsFiltered||window._contactsAll||[]).filter(r=>r.phone);
  if(!list.length){toast('No phones','bad');return}
  let vcf='';
  list.forEach(r=>{
    const s=r.s;
    const name=(s.parent_name||'Parent of '+(s.first_name||'')).replace(/[\n;]/g,' ');
    vcf+='BEGIN:VCARD\nVERSION:3.0\nFN:'+name+'\nTEL;TYPE=CELL:'+r.phone+'\nNOTE:Parent of '+s.first_name+' '+(s.last_name||'')+' — ADM '+(s.admission_no||'')+'\nEND:VCARD\n';
  });
  const blob=new Blob([vcf],{type:'text/vcard;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='parents_'+new Date().toISOString().slice(0,10)+'.vcf';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('vCard downloaded ('+list.length+' contacts)','ok');
}
window.downloadVCF=downloadVCF;

window.printContacts=printContacts;

async function saveSchoolInfo(){
  const b={
    name:document.getElementById('st_name').value.trim(),
    telephone:document.getElementById('st_phone').value.trim(),
    address:document.getElementById('st_addr').value.trim(),
    head_teacher:document.getElementById('st_head').value.trim(),
    motto:document.getElementById('st_motto').value.trim(),
    logo_url:document.getElementById('st_logo').value.trim()
  };
  try{
    await api('/rest/v1/schools?id=eq.'+_schoolId,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(b)});
    Object.assign(_school,b);
    document.getElementById('hdrName').textContent=_school.name||'SCHOOL';
    toast('Saved ✓','ok');
  }catch(e){toast('Save failed: '+e.message,'bad')}
}
