function classCountsHtml(students, classes, pays, yr, tr){
  var byId={}; (classes||[]).forEach(function(c){ byId[c.id]=c; });
  var rows=[]; var tot={n:0,boys:0,girls:0,day:0,board:0,alum:0,dem:0,paid:0,full:0};

      if(s.status==='waiting'||s.status==='rejected') return;
       var isAlum=(s.status==='graduated'||s.status==='alumni');
      r.n++; tot.n++;
      var g=String(s.gender||'').toLowerCase();
      if(g.indexOf('f')===0||g==='girl'||g==='female'){ r.girls++; tot.girls++; } else { r.boys++; tot.boys++; }

      var led=periodLedger(s,pays||[],yr,tr); r.dem+=led.demanded; r.paid+=led.paidIn; tot.dem+=led.demanded; tot.paid+=led.paidIn;
      if(led.balance<=0 && led.demanded>0){ r.full++; tot.full++; }

    +'<tr style="background:#f8fafc;font-weight:800"><td>TOTAL</td><td style="text-align:right">'+tot.n+'</td><td style="text-align:right">'+tot.boys+'</td><td style="text-align:right">'+tot.girls+'</td><td style="text-align:right">'+tot.day+'</td><td style="text-align:right">'+tot.board+'</td><td style="text-align:right">'+tot.alum+'</td><td style="text-align:right">'+fmtUGX(tot.dem)+'</td><td style="text-align:right">'+fmtUGX(tot.paid)+'</td><td style="text-align:right">'+fmtUGX(tot.dem-tot.paid)+'</td><td style="text-align:right">'+tot.full+'</td></tr>'
    +'</tbody></table>';
  return html;
}

async function saveInterview(id, applyDecision){
  const eng=Number(gv('iv_eng')), math=Number(gv('iv_math')), read=Number(gv('iv_read'));
  if(isNaN(eng)||isNaN(math)||isNaN(read)){ toast('Enter English, Maths and Reading marks (0-100)','bad'); return; }
  if(eng<0||eng>100||math<0||math>100||read<0||read>100){ toast('Marks must be 0-100','bad'); return; }
  const rec=gv('iv_rec'), total=eng+math+read;
  const body={school_id:_schoolId, student_id:id, interview_date:gv('iv_date')||new Date().toISOString().slice(0,10), english:eng, maths:math, reading:read, total:total, interviewer:gv('iv_by')||null, comment:gv('iv_comment')||null, recommendation:rec};
  try{ await api('/rest/v1/admission_interviews',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)}); }catch(e){ toast('Interview table not in Supabase yet. Run the CREATE TABLE SQL shown on Admissions page, then try again. ('+e.message+')','bad'); return; }
  if(!applyDecision){ toast('Interview saved — Total '+total+'/300','ok'); closeModal(); nav('admissions'); return; }
  if(rec==='Admit'){ closeModal(); await admitApplicant(id); return; }
  if(rec==='Reject'){ closeModal(); await rejectApplicant(id); return; }
  toast('Interview saved — child stays Waiting (Re-interview)','ok'); closeModal(); nav('admissions');
}

async function addApplicant(){
  const fn=gv('ad_fn').trim(), ln=gv('ad_ln').trim(), cid=gv('ad_class'), par=gv('ad_par').trim(), pc=gv('ad_pc').trim();
  if(!fn||!cid){ toast('First Name and Class Wanted are required','bad'); return; }
  if(!par||!pc){ toast('Parent Name and Parent Phone are required','bad'); return; }
  // Block duplicate: same name + same class already waiting or active
  const dup=await api('/rest/v1/students?school_id=eq.'+_schoolId+'&first_name=eq.'+encodeURIComponent(fn)+'&class_id=eq.'+cid+'&select=id,first_name,last_name,status,admission_no').catch(()=>[]);
  if(dup&&dup.length){ if(!confirm('A pupil named '+fn+' '+(dup[0].last_name||'')+' already exists in this class ('+dup[0].status+', '+dup[0].admission_no+'). Add anyway as a new application?')) return; }
  const body={school_id:_schoolId, admission_no:'WAIT-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-5), class_id:cid, first_name:fn, last_name:ln||null, gender:gv('ad_gender')||null, date_of_birth:gv('ad_dob')||null, boarding_status:gv('ad_res')||'Day', parent_name:par, parent_contact:pc, lin:gv('ad_prev')||null, location:gv('ad_notes')||null, status:'waiting'};
  try{ await api('/rest/v1/students',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)}); toast('Added to Waiting List','ok'); nav('admissions'); }catch(e){ toast('Failed: '+e.message,'bad'); }
}
function admClassName(cid){ const cs=window._admClasses||[]; const c=cs.find(x=>x.id===cid); return c?c.name:''; }
function admIsNursery(clsName){ return /BABY|MIDDLE|TOP|NURSERY|NURS/i.test(String(clsName||'')); }
function admIsP1toP3(clsName){ const s=String(clsName||'').toUpperCase(); return /P\s*[.,]?\s*[1-7]\b/.test(s)||/PRIMARY\s*(1|2|3|4|5|6|7|ONE|TWO|THREE|FOUR|FIVE|SIX|SEVEN)\b/.test(s); }
async function admitApplicant(id){
  const rows=await api('/rest/v1/students?id=eq.'+id+'&select=id,first_name,last_name,class_id&limit=1').catch(()=>[]);
  const s=(rows||[])[0]; if(!s){ toast('Applicant not found','bad'); return; }
  // RULE: Baby-Middle-Top = NO interview. P.1-P.7 = MUST have interview before Admit.
  const _clsName=admClassName(s.class_id);
  if(admIsP1toP3(_clsName)){
    let ivs=window._admInterviews; if(!ivs){ ivs=await api('/rest/v1/admission_interviews?school_id=eq.'+_schoolId+'&select=student_id&limit=500').catch(()=>[]); }
    const hasIv=(ivs||[]).some(iv=>String(iv.student_id)===String(id));
    if(!hasIv){ toast('STOP — '+_clsName+' must do an interview first. Press 📝 Interview, enter marks, then Admit.','bad'); return; }
  }
  const clsName=(await loadClasses()).find(c=>c.id===s.class_id);
  if(!confirm('Admit '+s.first_name+' '+(s.last_name||'')+' to '+(clsName?clsName.name:'')+'?\n\nThey will get a real ADM, appear in Pupils, and start paying fees for '+getYear()+' Term '+getTerm()+'.')) return;
  // Next ADM: ADM-Year-XXX, one higher than highest existing ADM for that year
  const yr=getYear();
  const existing=await api('/rest/v1/students?school_id=eq.'+_schoolId+'&admission_no=like.ADM-'+yr+'-%&select=admission_no&limit=1000').catch(()=>[]);
  let maxN=0; (existing||[]).forEach(r=>{ const m=String(r.admission_no||'').match(/-(\d+)$/); if(m) maxN=Math.max(maxN, parseInt(m[1])||0); });
  const adm='ADM-'+yr+'-'+String(maxN+1).padStart(3,'0');
  try{ await api('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'active', admission_no:adm})}); toast('Admitted — new ADM '+adm,'ok'); nav('admissions'); }catch(e){ toast('Failed: '+e.message,'bad'); }
}

function showDuplicates(){

async function deleteAllDuplicates(){
  var list=_cachedStudents||[];
  var toDelete=[], seenDel={};
  function markExtra(g){
    var sorted=g.slice().sort(function(a,b){ return String(a.created_at||'').localeCompare(String(b.created_at||'')); });
    for(var i=1;i<sorted.length;i++){ if(!seenDel[sorted[i].id]){ seenDel[sorted[i].id]=true; toDelete.push(sorted[i]); } }
  }
  // Rule 1: same ADM = same child, always duplicate.
  var byAdm={};
  list.forEach(function(s){ var a=String(s.admission_no||'').trim(); if(a){ (byAdm[a]=byAdm[a]||[]).push(s); } });
  Object.keys(byAdm).forEach(function(k){ if(byAdm[k].length>1) markExtra(byAdm[k]); });
  // Rule 2: same Name + same Class = duplicate ONLY if DOB is the same or one/both DOBs are missing.
  // If DOB is DIFFERENT, they are two different children (e.g. twins / same-name) - keep both, never auto-delete.
  var byNC={};
  list.forEach(function(s){ var k2=normName((s.first_name||'')+' '+(s.last_name||''))+'|'+s.class_id; (byNC[k2]=byNC[k2]||[]).push(s); });
  Object.keys(byNC).forEach(function(k){
    var g=byNC[k]; if(g.length<=1) return;
    var dobs={}; g.forEach(function(s){ if(s.date_of_birth) dobs[s.date_of_birth]=true; });
    if(Object.keys(dobs).length>1) return; // different DOBs = different children, skip
    markExtra(g);
  });
  if(!toDelete.length){ toast('No duplicates by ADM to delete','ok'); return; }
  if(!confirm('Delete '+toDelete.length+' duplicate copie(s)?\n\nThis keeps ONE pupil per ADM (the oldest). The extra copies will be PERMANENTLY deleted.\n\nIf a copy has marks or payments, those will be lost too — check the list first. Continue?')) return;
  var done=0;
  for(var j=0;j<toDelete.length;j++){
    try{ await api('/rest/v1/students?id=eq.'+toDelete[j].id,{method:'DELETE'}); done++; }catch(e){ toast('Could not delete '+toDelete[j].first_name+': '+e.message,'bad'); }
  }
  toast('Deleted '+done+' duplicate copie(s)','ok');
  nav('students');
}

function renderReleaseList(){const box=document.getElementById('releaseList');if(!box)return;const d=window._reportData;if(!d||!d.students.length){box.innerHTML='No students.';return}box.innerHTML=d.students.map(s=>{const bal=(Number(s.total_charged)||0)-(Number(s.total_paid)||0);const appr=s.report_approved===true;let status=bal<=0?'<span class="badge ok">Auto-Open</span>':appr?'<span class="badge ok">Released ✅</span>':'<span class="badge bad">Locked 🔒</span>';let btn=bal>0?(appr?'<button class="btn sm danger" onclick="toggleApproval(\''+s.id+'\',false)">🔒 Lock</button>':'<button class="btn sm ok" onclick="toggleApproval(\''+s.id+'\',true)">🔓 Release</button>'):'';return '<div style="display:flex;justify-content:space-between;gap:12px;padding:10px;background:#f8fafc;border-radius:10px;margin-bottom:8px;flex-wrap:wrap"><div><b>'+esc(s.first_name+' '+(s.last_name||''))+'</b><div style="font-size:11px;color:#64748b">'+esc(s.admission_no||'')+' · '+(bal>0?'Owes '+fmtNum(bal):'Cleared')+'</div></div><div>'+status+'</div><div>'+btn+'</div></div>'}).join('')}
async function toggleApproval(id,appr){try{await api('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({report_approved:appr})});const s=(_reportData.students||[]).find(x=>x.id===id);if(s)s.report_approved=appr;toast(appr?'✅ Report released':'🔒 Report locked','ok');renderReleaseList()}catch(e){toast(e.message,'bad')}}

function rcAge(dob){if(!dob)return '';try{const b=new Date(dob);if(isNaN(b))return '';const now=new Date();let a=now.getFullYear()-b.getFullYear();const m=now.getMonth()-b.getMonth();if(m<0||(m===0&&now.getDate()<b.getDate()))a--;return String(a);}catch(e){return ''}}

function buildPrimaryCard(s,d){const per=d.endMarks[s.id]||{},midPer=d.midMarks[s.id]||{},botPer=d.botMarks[s.id]||{};const cls=(_classesCache||[]).find(c=>c.id===s.class_id);function buildTable(perObj){let rows='',grand=0,cnt=0,aggT=0;d.subjects.forEach(sj=>{const v=perObj[sj.subject_id];const sc=(v!=null&&!isNaN(v))?Number(v):null;const g=gradePrimary(sc);const un=isUngradedSubject(sj);if(sc!=null){grand+=sc;cnt++;if(!un&&g.aggNum!=null)aggT+=g.aggNum}rows+='<tr><td class="subname">'+esc(sj.name)+'</td><td>100</td><td class="sc">'+(sc!=null?sc:'')+'</td><td class="grade">'+(sc!=null?g.g:'')+'</td><td class="agg">'+(sc!=null&&!un?g.agg:'-')+'</td><td></td></tr>'});if(cnt===0)rows='<tr><td colspan="6" style="text-align:center;color:#64748b;padding:10px">No marks entered for this exam yet</td></tr>';return{rows,grand,cnt,aggTotal:aggT}}const botT=buildTable(botPer),midT=buildTable(midPer),endT=buildTable(per);let div='—';if(s.division_manual)div=s.division_manual;else if(d.computed[s.id].usedCount>=4)div=d.computed[s.id].division;else if(d.computed[s.id].usedCount>0)div='—';const pos=s.position_manual||(d.positions[s.id]?String(d.positions[s.id]):'—');let grand=0,count=0;if(endT.cnt>0){grand=endT.grand;count=endT.cnt}else if(midT.cnt>0){grand=midT.grand;count=midT.cnt}else if(botT.cnt>0){grand=botT.grand;count=botT.cnt}const avg=count>0?grand/count:0;const autoC=generateAutoComments(avg,count>0,'normal');const ct=(s.class_teacher_comment||'').trim()?s.class_teacher_comment:autoC.ct;const ht=(s.head_teacher_comment||'').trim()?s.head_teacher_comment:autoC.ht;const headers='<thead><tr><th style="text-align:left">SUBJECT</th><th style="width:15%">SCORE</th><th style="width:20%">MARKS</th><th style="width:15%">GRADE</th><th style="width:10%">AGG</th><th style="width:15%">INITIALS</th></tr></thead>';let tables='';if(_printTables.bot)tables+='<div class="rc-section-title">BEGINNING OF TERM PERFORMANCE</div><table class="rc-table">'+headers+'<tbody>'+botT.rows+'<tr><td clas function buildBabyCard(s,d){const per=d.endMarks[s.id]||{},midPer=d.midMarks[s.id]||{},botPer=d.botMarks[s.id]||{};const cls=(_classesCache||[]).find(c=>c.id===s.class_id);const babySubs=['LA 1 (SOCIAL DEVELOPMENT)','LA 2 (ENGLISH)','LA 3 (HEALTH HABITS)','LA 4 (MATHEMATICS)','LA 5 (READING & WRITING)'];function findBaby(n){for(const sj of d.subjects){const nm=(sj.name||'').toUpperCase(),cc=(sj.code||'').toUpperCase();if(cc==='LA'+n)return sj;const m=nm.match(/LA[\s\-_.]*0*(\d)(?![0-9])/);if(m&&parseInt(m[1])===n)return sj;const mc=cc.match(/LA[\s\-_.]*0*(\d)(?![0-9])/);if(mc&&parseInt(mc[1])===n)return sj}return null}function buildTable(perObj){let rows='';babySubs.forEach((name,idx)=>{const db=findBaby(idx+1);const v=db?perObj[db.subject_id]:null;const sc=(v!=null&&!isNaN(v))?Number(v):null;const g=gradeBaby(sc);rows+='<tr><td class="subname" style="text-align:center">'+esc(name)+'</td><td class="sc" style="font-size:14pt">'+(g.g||'')+'</td><td style="font-family:\'Comic Sans MS\',cursive;font-size:14pt;text-align:center">'+(g.r||'')+'</td><td></td></tr>'});return{rows}}const botT=buildTable(botPer),midT=buildTable(midPer),endT=buildTable(per);let tot=0,cnt=0;d.subjects.forEach(sj=>{const v=per[sj.subject_id]??midPer[sj.subject_id]??botPer[sj.subject_id];if(v!=null&&!isNaN(v)){tot+=Number(v);cnt++}});const avg=cnt>0?tot/cnt:0;const autoC=generateAutoComments(avg,cnt>0,'normal');const ct=(s.class_teacher_comment||'').trim()?s.class_teacher_comment:autoC.ct;const ht=(s.head_teacher_comment||'').trim()?s.head_teacher_comment:autoC.ht;const headers='<thead><tr><th style="width:40%;text-align:left">SUBJECT</th><th style="width:20%">SCORE</th><th style="width:25%">REMARK</th><th style="width:15%">INITIALS</th></tr></thead>';let tables='';if(_printTables.bot)tables+='<div class="rc-section-title">BEGINNING OF TERM PERFORMANCE</div><table class="rc-table">'+headers+'<tbody>'+botT.rows+'</tbody></table>';if(_printTables.mid)tables+='<div class="rc-section-title">MID TERM P function buildP7Card(s,d){const cls=(_classesCache||[]).find(c=>c.id===s.class_id);const c=d.computed[s.id]||{};const subs=d.subjects.slice(0,4);function buildTable(perObj,title,key){if(!_printTables[key])return '';let rows='',grand=0,aggT=0;subs.forEach(sj=>{const v=perObj[sj.subject_id];const sc=(v!=null&&!isNaN(v))?Number(v):null;const g=gradePrimary(sc);if(sc!=null){grand+=sc;if(g.aggNum!=null)aggT+=g.aggNum}rows+='<tr><td class="subname">'+esc(sj.name)+'</td><td>100</td><td class="sc">'+(sc!=null?sc:'')+'</td><td class="grade">'+(sc!=null?g.g:'')+'</td><td class="agg">'+(sc!=null?g.agg:'-')+'</td><td></td></tr>'});const sd=computeP7Division(perObj,subs);const headers='<thead><tr><th style="text-align:left">SUBJECT</th><th style="width:15%">SCORE</th><th style="width:20%">MARKS</th><th style="width:15%">GRADE</th><th style="width:10%">AGG</th><th style="width:15%">INITIALS</th></tr></thead>';return '<div class="rc-section-title">'+title+'</div><table class="rc-table">'+headers+'<tbody>'+rows+'<tr><td class="subname">TOTAL</td><td>'+(subs.length*100)+'</td><td class="sc">'+grand.toFixed(0)+'</td><td></td><td class="agg">'+aggT+'</td><td></td></tr><tr style="background:#fdf4ff"><td class="subname" style="color:#800080">'+title+' — DIV</td><td colspan="2" style="font-weight:900;color:#800080">'+(sd.incomplete?'—':sd.division)+'</td><td class="subname" style="color:#800080">AGGREGATE</td><td colspan="2" class="agg">'+(sd.incomplete?'—':sd.agg)+'</td></tr></tbody></table>'}let div='—';if(s.division_manual)div=s.division_manual;else if(!c.incomplete)div=c.division;let tot=0,cnt=0;const active=Object.keys(d.mockMarks[s.id]||{}).length?d.mockMarks[s.id]:Object.keys(d.set3Marks[s.id]||{}).length?d.set3Marks[s.id]:Object.keys(d.set2Marks[s.id]||{}).length?d.set2Marks[s.id]:d.set1Marks[s.id]||{};subs.forEach(sj=>{const v=active[sj.subject_id];if(v!=null&&!isNaN(v)){tot+=Number(v);cnt++}});const avg=cnt>0?tot/cnt:0;const autoC=generateAutoComments(avg,cnt>0,'ple');const ct=(s.class_teacher_comment||'').trim()?s.class_teacher_comment:autoC.ct;const ht=(s.head_teacher_comment||'').trim()?s.head_teacher_comment:autoC.ht;let tables=buildTable(d.mockMarks[s.id]||{},'MOCK EXAMINATION','mock')+buildTable(d.set1Marks[s.id]||{},'SET 1','set1')+buildTable(d.set2Marks[s.id]||{},'SET 2','set2')+buildTable(d.set3Marks[s.id]||{},'SET 3','set3');return '<div class="rc-page"><div class="rc-inner">'+buildHeader()+'<div class="rc-pupil"><div class="cell w-full"><span class="lbl">PUPIL\'S NAME:</span><span class="val">'+esc((s.first_name+' '+(s.last_name||'')).toUpperCase())+'</span></div><div class="cell w-50"><span class="lbl">CLASS:</span><span class="val">'+esc(cls?cls.name.toUpperCase():'—')+'</span></div><div class="cell w-50"><span class="lbl">TERM:</span><span class="val">'+d.term+'</span></div><div class="cell w-50"><span class="lbl">DIVISION:</span><span class="val" style="font-weight:900;color:#800080">'+div+'</span></div>'+rcPupilExtra(s)+'<div class="cell w-50"><span class="lbl">YEAR:</span><span class="val">'+d.year+'</span></div></div>'+tables+'<div class="rc-summary"><div><div class="lbl2">Final Division (P.7)</div><div class="big">DIV '+div+'</div></div><div><div class="lbl2">Final Aggregate</div><div class="big">'+(c.incomplete?'—':c.agg)+'</div></div><div><div class="lbl2">Average (best set)</div><div class="big">'+(cnt?((tot/cnt).toFixed(1)+'%'):'—')+'</div></div></div><div class="rc-note"><b>How to read this card:</b> Each SET / MOCK has its own Division + Aggregate at the bottom of its table. The <b>Division at the top is the final division</b>, from the best available set (Mock, then Set 3, Set 2, Set 1). Only English, Maths, Science, SST count. Position is hidden for P.7. Blank = no mark entered.</div>'+buildScalePrimary()+'<div class="rc-lines"><span class="lbl">Conduct:</span><span class="line handwriting">'+esc(s.conduct||'')+'</span><span class="lbl" style="margin-top:8px">Class Teacher\'s comment:</span><span class="line handwriting">'+esc(ct)+'</span></div><div class="rc-lines"><span class="lbl">Head Teacher\'s comment:</span><span class="line handwriting">'+esc(ht)+'</span>'+(s.director_comment?'<span class="lbl" style="margin-top:6px">Director\'s comment:</span><span class="line handwriting">'+esc(s.director_comment)+'</span>':'')+'</div>'+buildPleWish()+((_printTables.end&&d.term===3)?buildReportDates(s.term_ended_on||'',s.next_term_begins||''):'')+rcPromotion(s,d)+buildFooter()+'</div></div>'}
function setPrintPreset(preset){
  var p={bot:false,mid:false,end:false,set1:false,set2:false,set3:false,mock:false};
  if(preset==='bot') p.bot=true;
  if(preset==='mid') p.mid=true;
  if(preset==='end') p.end=true;
  if(preset==='botmid'){ p.bot=true; p.mid=true; }
  if(preset==='midend'){ p.mid=true; p.end=true; }
  if(preset==='botend'){ p.bot=true; p.end=true; }
  if(preset==='all3'){ p.bot=true; p.mid=true; p.end=true; }
  if(preset==='set1') p.set1=true;
  if(preset==='set1set2'){ p.set1=true; p.set2=true; }
  if(preset==='allsets'){ p.set1=true; p.set2=true; p.set3=true; }
  if(preset==='mock') p.mock=true;
  if(preset==='mockall'){ p.mock=true; p.set1=true; p.set2=true; p.set3=true; }
  window._printTables=p; pageReports(document.getElementById('main'));
}

async function saveStudentComments(){const id=document.getElementById('c_student').value;const body={conduct:document.getElementById('c_conduct').value.trim()||null,position_manual:document.getElementById('c_pos').value.trim()||null,division_manual:document.getElementById('c_div').value.trim()||null,term_ended_on:document.getElementById('c_term_end').value||null,next_term_begins:document.getElementById('c_next_term').value||null,class_teacher_comment:document.getElementById('c_ct_comment').value.trim()||null,head_teacher_comment:document.getElementById('c_ht_comment').value.trim()||null,director_comment:document.getElementById('c_dir_comment').value.trim()||null};try{await api('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});toast('Comments saved ✓','ok');closeModal();pageReports(document.getElementById('main'))}catch(e){toast('Error: '+e.message,'bad')}}

async function graduateP7(){
  const yr=getYear();
  if(!confirm('Graduate ALL active P.7 pupils for '+yr+'?\n\nThey will move to Alumni (status = graduated) and will NO LONGER appear in P.7, Marks, Reports or Analysis for next year.\n\nUse this at the end of the year, after P.7 results are done. Continue?')) return;
  try{
    const classes=await loadClasses();
    const p7ids=classes.filter(c=>isP7Class(c.name)).map(c=>c.id);
    if(!p7ids.length){toast('No P.7 class found','bad');return}
    const pupils=await api('/rest/v1/students?school_id=eq.'+_schoolId+'&class_id=in.('+p7ids.join(',')+')&status=eq.active&select=id')||[];
    if(!pupils.length){toast('No active P.7 pupils to graduate','bad');return}
    // update one by one (RLS-safe, same as other edits)
    let done=0; for(const pu of pupils){ try{ await api('/rest/v1/students?id=eq.'+pu.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'graduated'})}); done++; }catch(e){} }
    toast('Graduated '+done+' P.7 pupils to Alumni','ok');
    nav('analysis');
  }catch(e){ toast('Graduation failed: '+e.message,'bad'); }
}

// ===== FEES PASTE + EXCEL =====
function normName(s){return String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function normClass(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function numVal(v){if(v==null||v==='')return 0;let raw=String(v).trim();if(/^#(VALUE|REF|DIV|NAME|N\/A)/i.test(raw))return 0;if(raw==='-'||raw==='—')return 0;let neg=false;if(/^\(.*\)$/.test(raw)){neg=true;raw=raw.slice(1,-1);}let s=raw.replace(/^(UGX|USH|SHS)\s*/i,'').replace(/[\s,]/g,'').replace(/\/=/g,'').replace(/[^0-9.\-]/g,'');if(!s)return 0;if(/^-?\d+\.\d{3}(\.\d{3})*$/.test(s))s=s.replace(/\./g,'');if(/\.00$/.test(s))s=s.slice(0,-3);const n=Number(s);if(isNaN(n))return 0;return neg?-Math.abs(n):n;}
function feesClassKey(s){
  const u=String(s||'').toUpperCase();
  // Nursery / Baby / Middle / Top
  if(/BABY/.test(u)) return 'BABY';
  if(/MIDDLE/.test(u)) return 'MIDDLE';
  if(/TOP/.test(u)) return 'TOP';
  if(/NURS/.test(u)) return 'NURSERY';
  // Primary 1-7 in ANY spelling: P.1, P1, P 1, Primary 1, PRIMARY ONE, etc.
  const m=u.match(/P\s*\.?\s*([1-7])/)||u.match(/PRIMARY\s*(1|2|3|4|5|6|7|ONE|TWO|THREE|FOUR|FIVE|SIX|SEVEN)/)||u.match(/\b([1-7])\b/);
  if(m){ const n=m[1]; const map={ONE:'1',TWO:'2',THREE:'3',FOUR:'4',FIVE:'5',SIX:'6',SEVEN:'7'}; return 'P'+(map[n]||n); }
  return normClass(s);
}
function feesNameTokens(s){ return normName(s).split(' ').filter(Boolean); }
function feesTokenFuzzy(x,y){ if(x===y) return true; if(!x||!y||x[0]!==y[0]) return false; const d=feesLev(x,y); const maxLen=Math.max(x.length,y.length); if(maxLen<=4) return d<=1; return d<=2; }
function feesTokensFuzzyMatch(ta,tb){ const short=ta.length<=tb.length?ta:tb, long=ta.length<=tb.length?tb:ta; if(short.length<2) return false; const used=new Set(); for(const tok of short){ let found=-1; for(let i=0;i<long.length;i++){ if(used.has(i)) continue; if(feesTokenFuzzy(tok,long[i])){ found=i; break; } } if(found<0) return false; used.add(found); } return true; }
function feesFindMatch(sysName, sheetName, sysClassName, sheetClassRaw){ const exact=feesNamesMatch(sysName, sheetName); const fuzzy=!exact && feesTokensFuzzyMatch(feesNameTokens(sysName), feesNameTokens(sheetName)); if(exact||fuzzy){ return {ok:true, fuzzy:!!fuzzy, classDiff:feesClassKey(sysClassName)!==feesClassKey(sheetClassRaw), sysClass:sysClassName, sheetClass:sheetClassRaw}; } return {ok:false}; }
function feesSuggest(sysName, sheetName, sysClassName, sheetClassRaw){ const a=normName(sheetName), b=normName(sysName); const ta=feesNameTokens(sheetName), tb=feesNameTokens(sysName); const overlap=ta.length?ta.filter(function(x){ return tb.some(function(y){ return feesTokenFuzzy(x,y); }); }).length/Math.max(ta.length,tb.length):0; const lev=feesLev(a,b); const maxLen=Math.max(a.length,b.length,1); const levScore=1-(lev/maxLen); const classBonus=feesClassKey(sysClassName)===feesClassKey(sheetClassRaw)?0.15:0; return {score:overlap*0.6+levScore*0.4+classBonus}; }
function feesManualMatch(rowIdx, studentId){ const rows=window._feesUploadRows||[]; const r=rows.find(function(x){ return x.row===rowIdx; }); if(!r) return; const s=(_cachedStudents||[]).find(function(x){ return x.id===studentId; }); if(!s) return; const cById={}; (_classesCache||[]).forEach(function(c){ cById[c.id]=c; }); const sysCls=cById[s.class_id]?cById[s.class_id].name:''; r.match=s; r.matchInfo={ok:true, fuzzy:true, manual:true, classDiff:feesClassKey(sysCls)!==feesClassKey(r.clsRaw), sysClass:sysCls, sheetClass:r.clsRaw}; feesRenderPreview(); feesSetStatus('Manually matched '+r.name+' - press Apply to save it.'); }
window.feesManualMatch=feesManualMatch;
function feesNamesMatch(a,b){
  const ta=feesNameTokens(a), tb=feesNameTokens(b);
  if(!ta.length||!tb.length) return false;
  // exact order
  if(ta.join(' ')===tb.join(' ')) return true;
  // reversed order: "Nakato Mary" == "Mary Nakato"
  if(ta.slice().reverse().join(' ')===tb.join(' ')) return true;
  // same tokens in any order: "Nakato Mary Grace" == "Mary Grace Nakato"
  if(ta.length===tb.length && ta.slice().sort().join(' ')===tb.slice().sort().join(' ')) return true;
  // one name has a middle name the other does not: "Mary Nakato" matches "Mary Grace Nakato" if first+last match
  // check: every token of the shorter name appears in the longer name
  const short=ta.length<=tb.length?ta:tb, long=ta.length<=tb.length?tb:ta;
  if(short.length>=2 && short.every(tok=>long.includes(tok))) return true;
  return false;
}
function feesParseRows(rows){
  const students=_cachedStudents||[]; const cById={}; (_classesCache||[]).forEach(c=>cById[c.id]=c);
  // --- Auto-detect columns from a header row, if there is one ---
  // Supports BOTH formats:
  //  A) Template: Name | Class | STATUS | B/F | Actual | holiday | academics | Funct | holiday | Transport | 1st | 2nd | 3rd | Total | Balance
  //  B) System Fees table: ADM | Name | Class | B/F | This Term Fee | Total Demanded | Paid This Term | Balance
  let col={name:0,cls:1,status:2,bf:3,actual:4,hol1:5,acad:6,funct:7,hol2:8,transp:9,d1:10,d2:11,d3:12,total:13,bal:14};
  let isFeesTable=false, headerFound=false, headerHasSerial=false;
  for(let hi=0;hi<Math.min(rows.length,3);hi++){
    const hdr=(rows[hi]||[]).map(c=>String(c||'').toLowerCase());
    if(hdr.some(c=>c.includes('name'))){
      headerFound=true; headerHasSerial=(hdr[0]==='no'||hdr[0]==='no.'||hdr[0]==='#'||hdr[0]==='s/n'||hdr[0]==='serial'||hdr[0]==='sn'||hdr[0].includes('serial'));
      const findIdx=(...words)=>hdr.findIndex(c=>words.some(w=>c.includes(w)));
      col.adm=findIdx('adm','admission'); col.name=findIdx('name'); col.cls=findIdx('class'); col.status=findIdx('status');
      col.bf=findIdx('b/f','balance brought','brought forward');
      col.actual=findIdx('actual fee');
      col.hol1=findIdx('holiday'); col.acad=findIdx('academ');
      col.funct=findIdx('funct'); col.transp=findIdx('transport');
      col.d1=findIdx('1st'); col.d2=findIdx('2nd'); col.d3=findIdx('3rd');
      col.total=findIdx('total'); col.bal=findIdx('balance');
      // Fees-table format: has "This Term Fee" and "Paid This Term", no 1st/2nd/3rd deposits
      if(hdr.some(c=>c.includes('total demanded'))||hdr.some(c=>c.includes('paid this term'))){ isFeesTable=true; col.actual=findIdx('this term fee'); col.d1=-1; col.d2=-1; col.d3=-1; }
      // If header has ADM before Name, Name index already points at the right column — good.
      break;
    }
  }
  const seen=new Set(); const out=[];
  rows.forEach((r,idx)=>{
    if(!r||!r.length) return;
    const first=String(r[0]||'').toLowerCase();
    const firstTrim=first.trim();
    // Serial-number column: sheet starts "1 | Ssemakula Josaiah | P.1 | ..." — first cell is just 1,2,3...
    // Detect it: first cell is a plain number AND second cell looks like a name (has a space)
    const isSerialRow=/^\d+$/.test(firstTrim) && String(r[1]||'').trim().includes(' ');
    if(isSerialRow && (!headerFound || !headerHasSerial)){
      // FIX: only slice serial when NO header. With a header, col indices already include the serial column,
      // so slicing a data row shifts B/F/Actual/Transport/1st/2nd/3rd left by one and picks WRONG cells.
      r=r.slice(1);
    }
    if(firstTrim==='name'&&String(r[1]||'').toLowerCase().includes('class')) return; // header (template)
    if(firstTrim==='adm'&&String(r[1]||'').toLowerCase().includes('name')) return; // header (fees table)
    // Only skip a real header row: first cell is exactly "ADM" or "Name" — NOT a data row like "ADM-2026-1234"
    if(firstTrim==='adm'||firstTrim==='name'||firstTrim==='no'||firstTrim==='no.'||firstTrim==='#'||firstTrim==='s/n') return;
    // No header? Per-row ADM shift: "ADM-... | Name | Class | ..." -> Name is col 1, not col 0
    let off=0;
    if(!headerFound){
      const c0=String(r[0]||'').trim();
      const looksADM=/^ADM[- ]/i.test(c0)||(/^\d+$/.test(c0)&&String(r[1]||'').trim().includes(' '));
      if(looksADM){ off=1; isFeesTable=true; }
    }
    const get=(i,fallback)=>{ const v=r[(i>=0?i: -1)+off]; return v==null?'':v; };
    // For fees-table rows without a header, columns are: [ADM] Name | Class | B/F | This Term Fee | Total | Paid | Balance
    let name, clsRaw, bf, actual, hol1, acad, funct, hol2, transp, d1, d2, d3;
    if(isFeesTable && !headerFound && off===1){
      name=String(r[1]||'').trim(); clsRaw=String(r[2]||'').trim(); bf=numVal(r[3]); actual=numVal(r[4]); hol1=0; acad=0; funct=0; hol2=0; transp=0; d1=0; d2=0; d3=0;
      // actual here IS the whole This Term Fee, so treat it as actual_fee so the ledger matches
    } else if(isFeesTable && headerFound){
      admRaw=String(get(col.adm)||'').trim(); name=String(get(col.name)||'').trim(); clsRaw=String(get(col.cls)||'').trim(); bf=numVal(get(col.bf)); actual=numVal(get(col.actual)); hol1=0; acad=0; funct=0; hol2=0; transp=0; d1=0; d2=0; d3=0;
    } else {
      admRaw=String(get(col.adm)||'').trim(); name=String(get(col.name)||'').trim(); clsRaw=String(get(col.cls)||'').trim();
      bf=numVal(get(col.bf)); actual=numVal(get(col.actual)); hol1=numVal(get(col.hol1)); acad=numVal(get(col.acad)); funct=numVal(get(col.funct)); hol2=numVal(get(col.hol2)); transp=numVal(get(col.transp));
      d1=numVal(get(col.d1)); d2=numVal(get(col.d2)); d3=numVal(get(col.d3));
    }
    if(!name && typeof admRaw==='undefined') return;
    if(name) name=name.replace(/\s*\([^)]*\)/g,'').replace(/\s+/g,' ').trim();
    if(!name && !admRaw) return;
    const key=(admRaw||normName(name))+'|'+feesClassKey(clsRaw);
    const dup=seen.has(key); seen.add(key);
    let found=null; const sysNameOf=s=>s.first_name+' '+(s.last_name||'');
    if(typeof admRaw!=='undefined' && admRaw){ const byAdm=students.find(function(s){ return String(s.admission_no||'').trim().toLowerCase()===String(admRaw).trim().toLowerCase(); }); if(byAdm){ const sc0=cById[byAdm.class_id]?cById[byAdm.class_id].name:''; found={s:byAdm, info:{ok:true, byAdm:true, classDiff:feesClassKey(sc0)!==feesClassKey(clsRaw), sysClass:sc0, sheetClass:clsRaw}}; } }
    if(!found) for(const s of students){ const sysCls=cById[s.class_id]?cById[s.class_id].name:''; const f=feesFindMatch(sysNameOf(s), name, sysCls, clsRaw); if(f.ok && !f.classDiff){ found={s,info:f}; break; } }
    if(!found){ for(const s of students){ const sysCls=cById[s.class_id]?cById[s.class_id].name:''; const f=feesFindMatch(sysNameOf(s), name, sysCls, clsRaw); if(f.ok){ found={s,info:f}; break; } } }
    const match=found?found.s:null; const matchInfo=found?found.info:null;
    var suggestions=[];
    if(!match){ suggestions=students.map(function(s){ const sysCls=cById[s.class_id]?cById[s.class_id].name:''; const sc=feesSuggest(sysNameOf(s), name, sysCls, clsRaw); return {s:s, sysCls:sysCls, score:sc.score}; }).filter(function(x){ return x.score>=0.45; }).sort(function(a,b){ return b.score-a.score; }).slice(0,3); }
    const fee=isFeesTable?actual:(actual+funct+transp+hol1+hol2+acad);
    const total=bf+fee; const paid=d1+d2+d3; const bal=total-paid; // FIX: show FULL as pasted, including negative (overpaid) - do NOT clamp to 0
    out.push({row:idx+1,name,clsRaw,status:String(get(col.status)||''),bf,actual,hol:hol1+hol2,acad,funct,transp,fee,total,paid,bal,d1,d2,d3,match:match||null,dup,isFeesTable,matchInfo,suggestions});
  });
  return out;
}
function feesRenderPreview(){

  if(!rows.length){box.innerHTML='No rows yet. Paste your sheet or upload Excel below.';return}
  const matched=rows.filter(r=>r.match&&!r.dup).length, notfound=rows.filter(r=>!r.match).length, dup=rows.filter(r=>r.dup).length;
    const sample=(_cachedStudents||[]).slice(0,3).map(s=>{const cn=((_classesCache||[]).find(c=>c.id===s.class_id)||{}).name||''; return esc(s.first_name+' '+(s.last_name||''))+' ('+esc(cn)+')';}).join(' · ');
  const firstRow=rows[0]?('First row read as: Name="'+esc(rows[0].name)+'" · Class="'+esc(rows[0].clsRaw)+'"'):'';

    spellSection += notFoundRows.map(function(r){ var sugHtml = (r.suggestions && r.suggestions.length) ? r.suggestions.map(function(sug){ return '<div style="margin-bottom:4px">' + esc(sug.s.first_name + ' ' + (sug.s.last_name||'')) + ' (' + esc(sug.sysCls) + ') - ' + Math.round(sug.score*100) + '% close <button class="btn sm" onclick="feesManualMatch(' + r.row + ',\'' + sug.s.id + '\')">Match to this pupil</button></div>'; }).join('') : '<span style="color:#991b1b">No close match.</span>'; return '<tr><td><b>' + esc(r.name) + '</b></td><td>' + esc(r.clsRaw) + '</td><td>' + sugHtml + '</td></tr>'; }).join('');

function feesSplitLine(line){ if(line.includes('\t')) return line.split('\t').map(function(c){return c.trim();}); const out=[]; let cur='', inQ=false; for(let i=0;i<line.length;i++){ const ch=line[i]; if(ch==='"'){ inQ=!inQ; continue; } if(ch===','&&!inQ){ out.push(cur.trim()); cur=''; } else cur+=ch; } out.push(cur.trim()); // FIX: ALWAYS merge thousand groups in CSV. "50,000" is ONE number, not "50" + "000".
    // Old code only merged when >15 cols, so "50,000" stayed split, shifted every column after it,
    // and the "50" landed in 2nd/3rd deposit. That is exactly the 50/75/100/200 stray payments.
    // Merge a 1-3 digit group + a 3-digit group, repeatedly. A real separate column that is exactly 3 digits
    // after a 1-3 digit column is ambiguous in CSV - that is why CSV paste is NOT safe. Use Upload Excel / tab paste.
    let merged=out.slice(); let guard=0; while(guard++<20){ let did=false; for(let k=0;k<merged.length-1;k++){ if(/^\d{1,3}$/.test(merged[k]) && /^\d{3}$/.test(merged[k+1])){ merged[k]=merged[k]+merged[k+1]; merged.splice(k+1,1); did=true; break; } } if(!did) break; } return merged; }
function feesParsePaste(){

    feesSetProgress(60,'Matching Name + Class…');
    const rows=lines.map(line=>feesSplitLine(line));
    window._feesUploadRows=feesParseRows(rows);
    feesSetProgress(90,'Done parsing.');
    const matched=(window._feesUploadRows||[]).filter(r=>r.match&&!r.dup).length;
    feesSetStatus('✅ Parsed '+window._feesUploadRows.length+' rows — '+matched+' matched, '+(window._feesUploadRows.length-matched)+' not matched. See the preview below.');
    feesRenderPreview();

  }catch(e){
    feesSetStatus('❌ FAILED while parsing: '+(e.message||e)+'. Nothing was saved. Try again, or paste 2 rows here so I can check the format.', true);
    feesHideProgress();
    console.error(e);
  }
}

async function feesApplyUpload(){
  const rows=(window._feesUploadRows||[]).filter(r=>r.match&&!r.dup); if(!rows.length){toast('No matched rows to apply','bad');return}
  const batch='UPLOAD-'+Date.now(); const provider=(document.getElementById('feesProvider')||{}).value||''; const method=(document.getElementById('feesMethod')||{}).value||'Cash';
  // No confirm popup.

  feesSetStatus('⏳ Applying '+rows.length+' matched rows — please wait, do not close the page…'); feesSetProgress(5,'Applying… 0/'+rows.length);
  let done=0, payCount=0, skipped=0, dupSkipped=0; const errors=[];
  // Duplicate protection: if this pupil already has Fees-upload deposits this term totalling the same amount, skip them
  const priorPays=await api('/rest/v1/payments?school_id=eq.'+_schoolId+'&year=eq.'+getYear()+'&term=eq.'+getTerm()+'&select=student_id,amount,notes&limit=5000').catch(()=>[])||[];
  const priorByPupil={}; priorPays.forEach(x=>{ if((x.notes||'').includes('Fees upload')) priorByPupil[x.student_id]=(priorByPupil[x.student_id]||0)+Number(x.amount||0); });
  for(const r of rows){
    feesSetProgress(Math.round(((done+dupSkipped)/Math.max(1,rows.length))*100),'Applying… '+(done+dupSkipped+1)+'/'+rows.length+' — '+r.name);
    // FIX: NEVER treat >3 payments as duplicate. Manual payments are unlimited - a parent can pay 4,5,10 times.
    // Old code skipped the WHOLE pupil if Fees-upload total already equalled Excel paid total.
    // That hid a B/F / fee update when the total happened to match. Now: still update fees/B/F, only skip adding the deposits again.
    const alreadyUploaded = false; // REPLACE mode: old uploaded deposits deleted above, always insert current ones.
    if(alreadyUploaded){ dupSkipped++; }
    try{
      await api('/rest/v1/students?id=eq.'+r.match.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(r.isFeesTable?{actual_fee:r.actual,functional_fee:0,transport_fee:0,holiday_fee:0,academics_fee:0,balance_bf:r.bf}:{actual_fee:r.actual,functional_fee:r.funct,transport_fee:r.transp,holiday_fee:r.hol,academics_fee:r.acad,balance_bf:r.bf})});
      // REPLACE, NOT ADD: delete this pupil's OLD "Fees upload" payments for this year/term, then insert current Excel deposits.
      // Manual payments have no "Fees upload" in notes, so they are NEVER deleted. Pupils NOT in this upload are NEVER touched.
      if(!r.isFeesTable){
        const oldPays=await api('/rest/v1/payments?school_id=eq.'+_schoolId+'&student_id=eq.'+r.match.id+'&year=eq.'+getYear()+'&term=eq.'+getTerm()+'&select=id,notes&limit=5000').catch(()=>[])||[];
        for(const op of oldPays){ if((op.notes||'').includes('Fees upload')){ await api('/rest/v1/payments?id=eq.'+op.id,{method:'DELETE',headers:{Prefer:'return=minimal'}}).catch(()=>{}); } }
      }
      const deposits=(r.isFeesTable||alreadyUploaded)?[]:[{amt:r.d1,label:'1st deposit'},{amt:r.d2,label:'2nd deposit'},{amt:r.d3,label:'3rd deposit'}];
      for(const d of deposits){ if(!d.amt) continue;
        // FIX: Apply was pressed 7 times in 5 seconds (7 batches) -> 7 copies of every deposit. Block exact duplicates:
        // same pupil + same label + same amount + same term already exists -> skip, do NOT create again.
        const dupCheck=await api('/rest/v1/payments?school_id=eq.'+_schoolId+'&student_id=eq.'+r.match.id+'&year=eq.'+getYear()+'&term=eq.'+getTerm()+'&amount=eq.'+d.amt+'&select=id,notes').catch(()=>[])||[];
        /* REPLACE mode: old Fees-upload rows just deleted, so dupCheck is empty and never blocks a fresh insert. */
        if(d.amt>0 && d.amt<1000){ skipped++; errors.push(r.name+': REFUSED to create a '+d.amt+' '+d.label+' - a real deposit is never under 1,000. This is a mis-parsed tail of a split number (e.g. 150,350 split into 150 + 350). Check that row in Excel and re-paste it.'); continue; }
        // duplicate protection: same pupil + same amount + same batch label already paid this term?
        const existing=await api('/rest/v1/payments?school_id=eq.'+_schoolId+'&student_id=eq.'+r.match.id+'&year=eq.'+getYear()+'&term=eq.'+getTerm()+'&amount=eq.'+d.amt+'&select=id').catch(()=>[]);
        // only skip if we already added this batch (notes contain batch) — checked via a second query on notes is not reliable, so we rely on user running once + this amount check is NOT used to skip (amounts repeat legitimately). Proceed.
        await api('/rest/v1/payments',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({school_id:_schoolId,student_id:r.match.id,receipt_no:'RCP-'+batch+'-'+r.match.admission_no+'-'+d.label.replace(' ',''),year:getYear(),term:getTerm(),academic_year:getYear(),amount:d.amt,method:method,payment_for:'School Fees',received_by:_profile?_profile.id:null,notes:'Fees upload '+d.label+' · batch '+batch+(provider?' · Provider: '+provider:''),provider:provider||null})});
        payCount++;
      }
      done++;
    }catch(e){ skipped++; errors.push(r.name+': '+(e.message||e)); }
  }
  if(skipped>0){ feesSetStatus('❌ '+skipped+' row(s) FAILED to save - first error: '+errors[0], true); const box=document.getElementById('feesPreview'); if(box){ box.innerHTML='<div style="background:#fef2f2;border:1px solid #fecaca;padding:12px;border-radius:8px;color:#991b1b"><b>Apply failed - Supabase blocked the save.</b><br><br>'+errors.slice(0,5).map(function(e){ return esc(e); }).join('<br>')+'</div>'; } toast(skipped+' row(s) failed - see red box','bad'); return; }
  feesSetStatus('✅ Done — applied '+done+' pupils, '+payCount+' deposits added'+(dupSkipped?' · '+dupSkipped+' already uploaded — skipped':'')+'.'); feesSetProgress(100,'Done'); setTimeout(feesHideProgress,1000);
  toast('Applied '+done+' pupils, '+payCount+' deposits added'+(dupSkipped?' · '+dupSkipped+' already uploaded — skipped':'')+(skipped?' · '+skipped+' failed':'') ,'ok');
  window._feesUploadRows=[]; document.getElementById('feesPreview').innerHTML='Done. Refresh Fees / Payments to see the new totals.';
  nav('fees');
}

function passoutStatus(r){

  if(s==='returned'||s==='back'||s==='signed_in'||s==='in') return 'back';
  return 'out';
}

async function signOutPupil(){
  var sid=document.getElementById('passPupil').value; if(!sid){ toast('Pick the pupil first','bad'); return; }
  var reason=document.getElementById('passReason').value;
  var picked=document.getElementById('passPickedBy').value.trim();
  var phone=document.getElementById('passPhone').value.trim();
  var note=document.getElementById('passNote').value.trim();
  var now=new Date().toISOString();
  var table='pass_outs';
  var body={school_id:_schoolId,student_id:sid,reason:reason,reason_details:note,notes:note,signed_out_at:now,status:'out',picked_up_by:picked,signed_out_by:'School',academic_year:getYear(),term:getTerm()};
  try{ await api('/rest/v1/'+table,{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)}); }
  catch(e){
    // Retry with only the core columns, in case this Supabase table does not have picked_by / guardian / note columns
    try{ await api('/rest/v1/'+table,{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({school_id:_schoolId,student_id:sid,reason:reason,signed_out_at:now,status:'out',academic_year:getYear(),term:getTerm()})}); }
    catch(e2){ toast('Could not save passout: '+e2.message,'bad'); return; }
  }
  toast('Signed out','ok'); pagePassouts(document.getElementById('main'));
}
async function signInPupil(id){
  if(!confirm('Sign this child back IN now?')) return;
  var table='pass_outs';
  var now=new Date().toISOString();
  try{ await api('/rest/v1/'+table+'?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({signed_in_at:now,status:'signed_in',signed_in_by:'School'})}); toast('Signed back in','ok'); pagePassouts(document.getElementById('main')); return; }
  catch(e){ toast('Could not sign back in: '+e.message,'bad'); }
}

// All new pages now read/write Supabase, NOT localStorage.
// If a table does not exist yet (you have not run the SQL), the page shows a clear message with the table name.
async function supaList(table, extra){
  try{
    var rows = await api('/rest/v1/'+table+'?school_id=eq.'+_schoolId+(extra||'')+'&select=*&limit=5000');
    return {ok:true, rows: rows||[], missing:false};
  }catch(e){
    var msg = String(e.message||'');
    if(msg.indexOf('relation')>=0 || msg.indexOf('does not exist')>=0 || msg.indexOf('PGRST')>=0 || msg.indexOf('404')>=0) return {ok:false, rows:[], missing:true, error:msg};
    return {ok:false, rows:[], missing:false, error:msg};
  }
}
async function supaInsert(table, body){
  body.school_id=_schoolId;
  return await api('/rest/v1/'+table, {method:'POST', headers:{Prefer:'return=representation'}, body:JSON.stringify(body)});
}
async function supaUpsert(table, filterQs, body){
  // Try update first, if 0 rows updated then insert. filterQs like "&student_id=eq.X&date=eq.Y"
  body.school_id=_schoolId;
  try{
    var upd = await api('/rest/v1/'+table+'?school_id=eq.'+_schoolId+filterQs, {method:'PATCH', headers:{Prefer:'return=representation'}, body:JSON.stringify(body)});
    if(upd && upd.length) return upd;
  }catch(e){}
  return await supaInsert(table, body);
}
async function supaDelete(table, id){
  return await api('/rest/v1/'+table+'?id=eq.'+id, {method:'DELETE'});
}
function supaMissingBox(table){
  return '<div class="card" style="border-left:4px solid #b91c1c;background:#fef2f2"><b>⚠ Table <code>'+table+'</code> not found in Supabase yet.</b><br>Run the SQL file I gave you (Supabase → SQL Editor → Run) to create it. It does NOT delete your old data. After running, refresh this page.</div>';
}

function msgBuild(s,bal,tpl){
  var school=(_school&&_school.name)||'Progressive Mothers';

  if(tpl==='balance') return 'Hello '+(s.parent_name||'parent')+', this is '+school+'. '+name+' has a fees balance of UGX '+Number(bal||0).toLocaleString()+' for '+getYear()+' Term '+getTerm()+'. Please pay / talk to the office. Thank you.';
  if(tpl==='results') return 'Hello '+(s.parent_name||'parent')+', this is '+school+'. '+name+'\'s report card for '+getYear()+' Term '+getTerm()+' is ready. Please come to school / ask your child for it. Thank you.';
  if(tpl==='passout') return 'Hello '+(s.parent_name||'parent')+', this is '+school+'. '+name+' has been signed out today. Please confirm you picked them / they are on the way home. Thank you.';
  if(tpl==='meeting') return 'Hello '+(s.parent_name||'parent')+', this is '+school+'. There is a parents meeting. Please come to school. Thank you.';

}

// ===== GRAPHS (plain canvas, no library) =====
function drawBars(canvasId, labels, values, color){
  const cv=document.getElementById(canvasId); if(!cv) return; const ctx=cv.getContext('2d'); const W=cv.width, H=cv.height; ctx.clearRect(0,0,W,H);
  const max=Math.max(1,...values); const padL=34, padB=26, padT=10; const bw=(W-padL-10)/Math.max(1,labels.length);
  ctx.fillStyle='#64748b'; ctx.font='11px sans-serif'; ctx.fillText('0',6,H-padB+3); ctx.fillText(Math.round(max)+'%',6,padT+3);
  values.forEach((v,i)=>{ const h=(H-padB-padT)*(v/max); const x=padL+i*bw+6; ctx.fillStyle=color; ctx.fillRect(x,H-padB-h,bw-12,h); ctx.fillStyle='#0f172a'; ctx.font='11px sans-serif'; ctx.fillText(Math.round(v)+'%',x,H-padB-h-4); ctx.fillStyle='#64748b'; ctx.font='10px sans-serif'; const lab=String(labels[i]).slice(0,10); ctx.fillText(lab,x,H-8); });
}
function drawLine(canvasId, labels, values, color){
  const cv=document.getElementById(canvasId); if(!cv) return; const ctx=cv.getContext('2d'); const W=cv.width, H=cv.height; ctx.clearRect(0,0,W,H);
  const max=Math.max(1,...values), min=Math.min(0,...values); const padL=34, padB=26, padT=12;
  ctx.strokeStyle='#e2e8f0'; ctx.beginPath(); ctx.moveTo(padL,padT); ctx.lineTo(padL,H-padB); ctx.lineTo(W-6,H-padB); ctx.stroke();
  ctx.fillStyle='#64748b'; ctx.font='11px sans-serif'; ctx.fillText(Math.round(max)+'%',6,padT+3); ctx.fillText(Math.round(min)+'%',6,H-padB+3);
  ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.beginPath();

      if(cr.worst.length) html+='<div style="margin-top:8px"><b>Bottom 3 - need follow-up in '+esc(cr.cls.name)+':</b><ol style="margin:6px 0">'+cr.worst.map(function(x){ return '<li><b>'+esc(x.s.first_name+' '+(x.s.last_name||''))+'</b> - Average '+x.avg.toFixed(1)+'%, Aggregate '+(x.agg==null?'—':x.agg)+', Division '+x.division+', Trend: '+esc(x.trend.txt)+'</li>'; }).join('')+'</ol></div>';
      html+='</div>';
    });

    
    // ===== PER-PUPIL COMPARISON: Beginning -> Mid -> End (P.1-P.6, Nursery) / Set 1 -> Set 2 -> Set 3 -> Mock (P.7 ONLY) =====
    let compHtml='';
    try{
      const examsInTerm=(exams||[]).filter(e=>Number(e.year)===yr&&Number(e.term)===tr);
      const allMarksTerm=[].concat(marksRows||[], altMarksRows||[]);
      // Dedupe marks by student+exam+subject (chosen exam appears in both)
      const seenM={}; const uniqMarks=[]; allMarksTerm.forEach(m=>{ const k=m.student_id+'|'+m.exam_id+'|'+m.subject_id; if(!seenM[k]){ seenM[k]=1; uniqMarks.push(m); } });
      const subjNameById={}; (subjectsAll||[]).forEach(s=>subjNameById[s.id]=String(s.name||'').toUpperCase());
      const isMajorP7=function(sid){ const n=subjNameById[sid]||''; return /ENGLISH|MATH|SCIENCE|SOCIAL|SST/.test(n); };
      const examScore=function(sid, examId){
        const mm=uniqMarks.filter(m=>String(m.student_id)===String(sid)&&String(m.exam_id)===String(examId));
        if(!mm.length) return null;
        return mm;
      };
      classes.forEach(function(cls){
        const isP7=isP7Class(cls.name);
        let clsExams=examsInTerm.filter(e=> isP7 ? /SET|MOCK/i.test(String(e.name||'')) : !/SET|MOCK/i.test(String(e.name||'')) );
        clsExams=clsExams.slice().sort((a,b)=>Number(a.stage)-Number(b.stage));
        if(!clsExams.length) return;
        const pupils=students.filter(s=>s.class_id===cls.id);
        if(!pupils.length) return;
        // Per-pupil rows
        const rows=pupils.map(function(s){
          const vals=clsExams.map(function(ex){
            const mm=examScore(s.id, ex.id);
            if(!mm) return null;
            if(isP7){
              const majors=mm.filter(m=>isMajorP7(m.subject_id));
              if(majors.length<4) return {label:'Incomplete', val:null, n:majors.length};
              let agg=0; majors.forEach(m=>{ const g=gradePrimary(Number(m.score)); if(g.aggNum!=null) agg+=g.aggNum; });
              return {label:'Agg '+agg, val:agg, n:majors.length, agg:agg};
            } else {
              const scores=mm.map(m=>Number(m.score)).filter(x=>!isNaN(x));
              if(!scores.length) return null;
              const avg=scores.reduce((a,b)=>a+b,0)/scores.length;
              return {label:avg.toFixed(1), val:avg, n:scores.length, avg:avg};
            }
          });
          const first=vals.find(v=>v&&v.val!=null), last=[].concat(vals).reverse().find(v=>v&&v.val!=null);
          let trend='—', tColor='#64748b';
          if(first&&last&&first!==last){
            if(isP7){ const d=last.val-first.val; if(d<0){ trend='📈 Improving (Agg down '+Math.abs(d)+')'; tColor='#047857'; } else if(d>0){ trend='📉 Going down (Agg up '+d+')'; tColor='#b91c1c'; } else { trend='➖ Same'; tColor='#d4a017'; } }
            else { const d=last.val-first.val; if(d>2){ trend='📈 Improving (+'+d.toFixed(1)+')'; tColor='#047857'; } else if(d<-2){ trend='📉 Going down ('+d.toFixed(1)+')'; tColor='#b91c1c'; } else { trend='➖ Stable'; tColor='#d4a017'; } }
          } else if(first&&!last||!first){ trend='—'; }
          else { trend='Only 1 exam'; }
          return {s:s, vals:vals, trend:trend, tColor:tColor};
        });
        const hdr=clsExams.map(e=>'<th style="text-align:center">'+esc(e.name)+'</th>').join('');
        const body=rows.map(function(r,idx){ return '<tr><td>'+(idx+1)+'</td><td><b>'+esc(r.s.first_name+' '+(r.s.last_name||''))+'</b> ('+esc(r.s.admission_no)+')</td>'+r.vals.map(v=>'<td style="text-align:center">'+(v?v.label:'<span style="color:#94a3b8">—</span>')+'</td>').join('')+'<td style="color:'+r.tColor+';font-weight:700">'+r.trend+'</td></tr>'; }).join('');
        compHtml+='<div class="card"><h3 style="margin-top:0">📊 '+esc(cls.name)+' — '+(isP7?'Set 1 → Set 2 → Set 3 → Mock (per paper: Agg of 4 majors)':'Beginning → Mid → End (average)')+' — Improving or Going Down?</h3>'
          +'<div style="font-size:12.5px;margin-bottom:8px">'+(isP7?'P.7: Lower Agg = better. Agg = sum of English + Maths + Science + SST grades (D1=1 … F9=9). Incomplete = less than 4 majors, no Agg.':'Other classes: Higher average = better. Average = mean of all subject marks in that exam. Improving = +2 marks or more, Going down = −2 or more.')+'</div>'
          +'<div style="overflow-x:auto"><table><thead><tr><th>#</th><th>Pupil</th>'+hdr+'<th>Trend</th></tr></thead><tbody>'+body+'</tbody></table></div></div>';
        // P.7 per-paper detail: each subject across Sets
        if(isP7){
          const majorSubs=(subjectsAll||[]).filter(s=>isMajorP7(s.id));
          // Also include Computer / RE as shown-not-counted? Keep majors only for Agg, but show all subjects for per-paper
          const allSubsForClass=subjectsAll||[];
          let paperHtml='<div class="card"><h3 style="margin-top:0">📄 '+esc(cls.name)+' — Per Paper: Each Subject Across Sets</h3><div style="font-size:12.5px;margin-bottom:8px">Each cell = mark /100 in that Set. Read across a row: is this child improving in this paper, or going down?</div>';
          pupils.forEach(function(s){
            paperHtml+='<h4>'+esc(s.first_name+' '+(s.last_name||''))+' ('+esc(s.admission_no)+')</h4><div style="overflow-x:auto"><table><thead><tr><th>Paper</th>'+clsExams.map(e=>'<th style="text-align:center">'+esc(e.name)+'</th>').join('')+'<th>Trend</th></tr></thead><tbody>'
              +allSubsForClass.map(function(sub){
                const vals=clsExams.map(function(ex){ const m=uniqMarks.find(mm=>String(mm.student_id)===String(s.id)&&String(mm.exam_id)===String(ex.id)&&String(mm.subject_id)===String(sub.id)); return m?Number(m.score):null; });
                const firstV=vals.find(v=>v!=null), lastV=[].concat(vals).reverse().find(v=>v!=null);
                let tr='—', tc='#64748b'; if(firstV!=null&&lastV!=null&&firstV!==lastV){ const d=lastV-firstV; if(d>2){ tr='📈 +'+d.toFixed(0); tc='#047857'; } else if(d<-2){ tr='📉 '+d.toFixed(0); tc='#b91c1c'; } else { tr='➖ Stable'; tc='#d4a017'; } }
                return '<tr><td><b>'+esc(sub.name||sub.code||'')+'</b></td>'+vals.map(v=>'<td style="text-align:center">'+(v==null?'—':v.toFixed(0))+'</td>').join('')+'<td style="color:'+tc+';font-weight:700">'+tr+'</td></tr>';
              }).join('')+'</tbody></table></div>';
          });
          paperHtml+='</div>';
          compHtml+=paperHtml;
        }
      });
    }catch(e){ compHtml='<div class="card">Per-pupil comparison failed: '+esc(e.message||e)+'</div>'; }
    
    // ===== TRACK FROM PREVIOUS CLASSES — even after promotion =====
    // Marks are stored by pupil ID, not by class, so promotion does NOT erase history.
    // This follows each child across ALL terms/years, not just this term.
    let crossHtml='';
    try{
      const allMarksAll=await api('/rest/v1/marks?school_id=eq.'+_schoolId+'&select=student_id,exam_id,subject_id,score,academic_year,term&limit=10000').catch(()=>[]);
      const examByIdAll={}; (exams||[]).forEach(e=>examByIdAll[String(e.id)]=e);
      const byPupil={}; (allMarksAll||[]).forEach(m=>{ (byPupil[m.student_id]=byPupil[m.student_id]||[]).push(m); });
      const crossRows=students.map(function(s){
        const mm=byPupil[s.id]||[]; if(!mm.length) return null;
        // Group by exam
        const byExam={}; mm.forEach(m=>{ (byExam[m.exam_id]=byExam[m.exam_id]||[]).push(m); });
        const examAvgs=Object.keys(byExam).map(eid=>{
          const ex=examByIdAll[String(eid)]||{name:'Exam', year:mm[0].academic_year, term:mm[0].term, stage:99};
          const scores=byExam[eid].map(x=>Number(x.score)).filter(x=>!isNaN(x));
          const avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;
          return {eid:eid, ex:ex, avg:avg, n:scores.length, sortKey:(Number(ex.year)*100+Number(ex.term)*10+Number(ex.stage||0))};
        }).sort((a,b)=>a.sortKey-b.sortKey);
        if(examAvgs.length<2) return {s:s, examAvgs:examAvgs, trend:'Only 1 exam — need more terms to track', tColor:'#64748b', first:null, last:null, diff:null};
        const first=examAvgs[0], last=examAvgs[examAvgs.length-1];
        const diff=last.avg-first.avg;
        let trend='➖ Stable', tColor='#d4a017';
        if(diff>2){ trend='📈 Improving (+'+diff.toFixed(1)+')'; tColor='#047857'; }
        else if(diff<-2){ trend='📉 Going down ('+diff.toFixed(1)+')'; tColor='#b91c1c'; }
        return {s:s, examAvgs:examAvgs, trend:trend, tColor:tColor, first:first, last:last, diff:diff};
      }).filter(Boolean);
      const sortedCross=crossRows.slice().sort((a,b)=>(b.diff||0)-(a.diff||0));
      const clsNameFor=function(s){ const c=classes.find(x=>x.id===s.class_id); return c?c.name:''; };
      crossHtml='<div class="card" style="border-left:4px solid #800080"><h3 style="margin-top:0">🔄 Track From Previous Classes — Even After Promotion</h3>'
        +'<div style="font-size:12.5px;margin-bottom:8px">Promotion does <b>NOT</b> erase history. Marks follow the child by pupil ID. This compares <b>First Exam Ever</b> vs <b>Latest Exam</b> for each child, across all terms/years and all classes they have been in.<br>'
        +'Average = mean of all subject marks in that exam (0–100, comparable across classes). Improving = +2 or more, Going down = −2 or more, Stable = within 2. Sorted best-improving first.</div>'
        +'<div style="overflow-x:auto"><table><thead><tr><th>#</th><th>Pupil</th><th>Current Class</th><th>First Exam</th><th>First Avg</th><th>Latest Exam</th><th>Latest Avg</th><th>Exams Done</th><th>Change</th><th>Trend</th></tr></thead><tbody>'
        +sortedCross.map(function(r,idx){
            const firstLabel=r.first?esc(r.first.ex.name+' ('+r.first.ex.year+' Term '+r.first.ex.term+')'):'—';
            const lastLabel=r.last?esc(r.last.ex.name+' ('+r.last.ex.year+' Term '+r.last.ex.term+')'):'—';
            return '<tr><td>'+(idx+1)+'</td><td><b>'+esc(r.s.first_name+' '+(r.s.last_name||''))+'</b> ('+esc(r.s.admission_no)+')</td><td>'+esc(clsNameFor(r.s))+'</td><td>'+firstLabel+'</td><td style="text-align:right">'+(r.first?r.first.avg.toFixed(1):'—')+'</td><td>'+lastLabel+'</td><td style="text-align:right">'+(r.last?r.last.avg.toFixed(1):'—')+'</td><td style="text-align:right">'+r.examAvgs.length+'</td><td style="text-align:right;color:'+r.tColor+';font-weight:700">'+(r.diff==null?'—':(r.diff>=0?'+':'')+r.diff.toFixed(1))+'</td><td style="color:'+r.tColor+';font-weight:700">'+r.trend+'</td></tr>';
          }).join('')+'</tbody></table></div>'
        +'<div style="font-size:12px;color:#64748b;margin-top:8px">Example: A child promoted from P.4 → P.5 → P.6 will show P.4 Beginning as First, P.6 End as Latest. If they were 65 in P.4 and 50 in P.6, they are Going Down — even though they were promoted. Promotion ≠ improvement.</div></div>';
      // Detailed per-child history (all exams in order) - collapsible by class
      let detailHtml='<div class="card"><h3 style="margin-top:0">📜 Full History Per Child — Every Exam, In Order</h3><div style="font-size:12.5px;margin-bottom:8px">Each row = one child, each column = one exam in time order. Use this to see the whole journey, not just first vs last.</div>';
      // Build exam columns: all distinct exams sorted
      const allExamIds=[...new Set((allMarksAll||[]).map(m=>String(m.exam_id)))];
      const allExamsSorted=allExamIds.map(id=>examByIdAll[id]).filter(Boolean).sort((a,b)=>(Number(a.year)-Number(b.year))||(Number(a.term)-Number(b.term))||(Number(a.stage)-Number(b.stage)));
      detailHtml+='<div style="overflow-x:auto"><table><thead><tr><th>Pupil</th><th>Current Class</th>'+allExamsSorted.map(e=>'<th style="text-align:center;min-width:70px">'+esc(e.name)+'<br><span style="font-weight:400;font-size:10px">'+e.year+' T'+e.term+'</span></th>').join('')+'</tr></thead><tbody>'
        +students.map(function(s){
            const mm=byPupil[s.id]||[]; if(!mm.length) return '';
            const cells=allExamsSorted.map(function(e){
              const em=mm.filter(m=>String(m.exam_id)===String(e.id));
              if(!em.length) return '<td style="text-align:center;color:#cbd5e1">—</td>';
              const scores=em.map(x=>Number(x.score)).filter(x=>!isNaN(x)); const avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;
              const col=avg>=70?'#047857':avg>=50?'#d4a017':'#b91c1c';
              return '<td style="text-align:center;color:'+col+';font-weight:700">'+avg.toFixed(0)+'</td>';
            }).join('');
            return '<tr><td><b>'+esc(s.first_name+' '+(s.last_name||''))+'</b> ('+esc(s.admission_no)+')</td><td>'+esc(clsNameFor(s))+'</td>'+cells+'</tr>';
          }).join('')+'</tbody></table></div></div>';
      crossHtml+=detailHtml;
    }catch(e){ crossHtml='<div class="card">Track from previous classes failed: '+esc(e.message||e)+'</div>'; }
    html+=crossHtml;
html+=compHtml;
root.innerHTML=html;
    setTimeout(()=>{ const g=window._graphData; if(!g) return; drawBars('gSubj', g.subj.map(s=>s.name), g.subj.map(s=>s.avg), '#800080'); drawBars('gClass', g.cls.map(s=>s.name), g.cls.map(s=>s.avg), '#2563eb'); drawBars('gDiv', ['Div I','Div II','Div III','Div IV','Div U'], [g.div.I,g.div.II,g.div.III,g.div.IV,g.div.U], '#d4a017'); drawLine('gTrend', g.trendLabels, g.trendVals, '#dc2626'); }, 150);
  }catch(e){ root.innerHTML='<h1>📈 Performance Analysis</h1<div class="card"><h3>Error</h3><p>'+esc(e.message)+'</p><button class="btn ghost" onclick="nav(\'analysis\')">Retry</button></div>' }
}

async function saveStaff(id){

  try{

    toast('Staff saved','ok'); closeModal(); nav('staff');
  }catch(e){ toast('Save failed: '+e.message,'bad'); }
}
