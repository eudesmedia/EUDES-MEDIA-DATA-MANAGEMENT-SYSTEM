function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function getYear(){const s=parseInt(lsGet('pm_year'));if(!isNaN(s))return s;return 2026}
function getTerm(){const s=parseInt(lsGet('pm_term'));if(!isNaN(s)&&s>=1&&s<=3)return s;return 3}

function scheduleTokenRefresh(s){if(refreshTimer)clearTimeout(refreshTimer);const ms=(s-120)*1000;if(ms<=0)return;refreshTimer=setTimeout(async()=>{try{const r=await fetch(SUPA_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:_session.refresh_token})});if(r.ok){const d=await r.json();setSession({access_token:d.access_token,refresh_token:d.refresh_token,user:d.user,expires_in:d.expires_in})}}catch(e){}},ms)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function fmtDateTime(ts){if(!ts)return '—';const d=new Date(ts);return fmtDate(ts)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

function feePerTerm(s){const v=(Number(s.actual_fee)||0)+(Number(s.functional_fee)||0)+(Number(s.transport_fee)||0)+(Number(s.holiday_fee)||0)+(Number(s.academics_fee)||0);if(v>0)return v;const tc=Number(s.total_charged)||0,bf=Number(s.balance_bf)||0;if(tc-bf>0)return tc-bf;return tc}
function pupilStartTerm(s,allPays){let best=null;const td=termFromDate(s.created_at||s.enrollment_date);if(td)best=td;(allPays||[]).filter(x=>x.student_id===s.id).forEach(x=>{if(x.year==null)return;const cand={year:Number(x.year),term:Number(x.term)||1};if(!best||termIndex(cand.year,cand.term)<termIndex(best.year,best.term))best=cand});return best}
function periodLedger(s,allPays,yr,tr){const fee=feePerTerm(s);const start=pupilStartTerm(s,allPays);let termsBefore=0;if(start){let y=start.year,tt=start.term;while(termIndex(y,tt)<termIndex(yr,tr)){termsBefore++;tt++;if(tt>3){tt=1;y++}}if(termsBefore<0)termsBefore=0;if(termsBefore>30)termsBefore=30}const demandBefore=fee*termsBefore;let paidBefore=0,paidIn=0;(allPays||[]).filter(x=>x.student_id===s.id).forEach(x=>{if(x.year==null)return;const ti=termIndex(Number(x.year),Number(x.term)||1),sel=termIndex(yr,tr);if(ti<sel)paidBefore+=Number(x.amount)||0;else if(ti===sel)paidIn+=Number(x.amount)||0});const bf0=Number(s.balance_bf)||0;let carried=Math.max(0,demandBefore-paidBefore);if(termsBefore===0)carried=Math.max(carried,bf0);const demanded=carried+fee;const balance=Math.max(0,demanded-paidIn);return{fee:fee,carried:carried,demanded:demanded,paidIn:paidIn,balance:balance,termsBefore:termsBefore,paidBefore:paidBefore}}
function examsForPeriod(all){const y=getYear(),tr=getTerm();return (all||[]).filter(e=>Number(e.year)===y&&Number(e.term)===tr);}

function gradePrimary(s){if(s==null||isNaN(s))return{g:'—',agg:'—',aggNum:null};s=Number(s);if(s>=90)return{g:'D1',agg:'1',aggNum:1};if(s>=80)return{g:'D2',agg:'2',aggNum:2};if(s>=70)return{g:'C3',agg:'3',aggNum:3};if(s>=60)return{g:'C4',agg:'4',aggNum:4};if(s>=55)return{g:'C5',agg:'5',aggNum:5};if(s>=50)return{g:'C6',agg:'6',aggNum:6};if(s>=45)return{g:'P7',agg:'7',aggNum:7};if(s>=40)return{g:'P8',agg:'8',aggNum:8};return{g:'F9',agg:'9',aggNum:9}}
function gradeBaby(s){if(s==null||isNaN(s))return{g:'—',r:'—'};s=Number(s);if(s>=90)return{g:'A',r:'Excellent'};if(s>=80)return{g:'B',r:'V. Good'};if(s>=70)return{g:'C',r:'Good'};if(s>=50)return{g:'D',r:'Fair'};return{g:'E',r:'Needs Help'}}

function computeP7Division(per,subs){const a=[];subs.forEach(sj=>{const v=per[sj.subject_id];if(v==null||isNaN(v))return;const g=gradePrimary(Number(v));if(g.aggNum!=null)a.push(g.aggNum)});a.sort((x,y)=>x-y);const total=a.reduce((s,x)=>s+x,0);let div='U';if(a.length===4){if(total<=12)div='I';else if(total<=23)div='II';else if(total<=29)div='III';else if(total<=34)div='IV';else div='U'}return{agg:total,division:div,usedCount:a.length,incomplete:a.length<4}}
function computePrimaryDivision(per,subs){const a=[];subs.forEach(sj=>{if(isUngradedSubject(sj))return;const v=per[sj.subject_id];if(v==null||isNaN(v))return;const g=gradePrimary(Number(v));if(g.aggNum!=null)a.push(g.aggNum)});a.sort((x,y)=>x-y);const best7=a.slice(0,7);const agg=best7.reduce((s,x)=>s+x,0);let div='U';if(best7.length>=4){if(agg<=12)div='I';else if(agg<=23)div='II';else if(agg<=29)div='III';else if(agg<=34)div='IV';else div='U'}return{best7Agg:agg,division:div,usedCount:best7.length,incomplete:best7.length===0}}

async function api(path,opt){opt=opt||{};const h=Object.assign({apikey:SUPA_KEY,'Content-Type':'application/json'},opt.headers||{});const t=getToken();h['Authorization']='Bearer '+(t||SUPA_KEY);const res=await fetch(SUPA_URL+path,Object.assign({},opt,{headers:h}));const txt=await res.text();let data=null;try{data=txt?JSON.parse(txt):null}catch(e){data=txt}if(!res.ok)throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||txt||('HTTP '+res.status));return data}
async function doLogin(){const email=document.getElementById('loginEmail').value.trim().toLowerCase();const pass=document.getElementById('loginPass').value;const err=document.getElementById('loginErr');const btn=document.getElementById('loginBtn');err.style.display='none';if(!email||!pass){err.textContent='Enter email and password';err.style.display='block';return}btn.disabled=true;btn.textContent='Signing in…';try{const res=await fetch(SUPA_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});const txt=await res.text();let data=null;try{data=txt?JSON.parse(txt):null}catch(e){}if(!res.ok)throw new Error((data&&(data.error_description||data.msg||data.error||data.message))||'Login failed');setSession({access_token:data.access_token,refresh_token:data.refresh_token,user:data.user,expires_in:data.expires_in});await boot()}catch(e){err.textContent=e.message;err.style.display='block';document.getElementById('dbg').textContent='LOGIN FAIL: '+e.message}btn.disabled=false;btn.textContent='Sign In'}
async function doLogout(){if(!confirm('Sign out?'))return;try{const t=getToken();if(t)await fetch(SUPA_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+t}})}catch(e){}setSession(null);lsDel('pm_year');lsDel('pm_term');_profile=null;_school=null;_schoolId=null;_classesCache=null;_examsCache=null;document.getElementById('app').style.display='none';document.getElementById('authScreen').style.display='flex'}
async function boot(){const user=getUser();if(!user){document.getElementById('authScreen').style.display='flex';return}const errEl=document.getElementById('loginErr');const dbg=document.getElementById('dbg');try{let p=null;try{const byId=await api('/rest/v1/profiles?id=eq.'+user.id+'&select=*');if(byId&&byId[0])p=byId[0]}catch(e){dbg.textContent='profiles by id error: '+e.message}if(!p){try{const byEmail=await api('/rest/v1/profiles?email=eq.'+encodeURIComponent(user.email)+'&select=*');if(byEmail&&byEmail[0])p=byEmail[0]}catch(e){}} _profile=p}catch(e){errEl.textContent='Profile error: '+e.message;errEl.style.display='block';return}if(!_profile){errEl.textContent='Profile not found for '+user.email+' (UUID '+user.id+'). Check profiles table has a row with id = this UUID or email = this email.';errEl.style.display='block';return}_schoolId=_profile.school_id;_role=_profile.role;if(!_schoolId){errEl.textContent='No school linked to this profile.';errEl.style.display='block';return}try{const sc=await api('/rest/v1/schools?id=eq.'+_schoolId+'&select=*');_school=sc&&sc[0]}catch(e){}if(!_school){errEl.textContent='School not found for school_id '+_schoolId;errEl.style.display='block';return}if(Number(_school.current_year)===2026&&Number(_school.current_term)===1){_school.current_term=3;lsSet('pm_year','2026');lsSet('pm_term','3');api('/rest/v1/schools?id=eq.'+_schoolId,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({current_year:2026,current_term:3})}).catch(()=>{});}if(!lsGet('pm_year'))lsSet('pm_year','2026');if(!lsGet('pm_term'))lsSet('pm_term','3');document.getElementById('authScreen').style.display='none';document.getElementById('app').style.display='block';populateTermSelector();renderHeader();renderNav();await nav('dashboard')}
function renderHeader(){if(!_school)return;document.getElementById('headerSchoolName').textContent=_school.name||'SCHOOL';document.getElementById('topbarTitle').textContent=_school.name||'SCHOOL';if(_role)document.getElementById('roleChip').textContent=String(_role).replace(/_/g,' ').toUpperCase();const meta=[];if(_school.address)meta.push('📍 '+esc(_school.address));if(_school.telephone)meta.push('📞 '+esc(_school.telephone));document.getElementById('headerMeta').innerHTML=meta.length?meta.join(' · '):'—';const logoEl=document.getElementById('headerLogo');if(logoEl){const src=_school.logo_data||_school.logo_url||'';if(src){logoEl.innerHTML='<img src="'+esc(src)+'">';logoEl.style.background='#fff'}else logoEl.innerHTML='🏛'}}

async function pageDashboard(root){const cy=getYear(),ct=getTerm(),today=new Date().toISOString().slice(0,10);const [students,classes,payments,staff,exams]=await Promise.all([api('/rest/v1/students?school_id=eq.'+_schoolId+'&select=*').catch(()=>[]),api('/rest/v1/classes?school_id=eq.'+_schoolId+'&select=id').catch(()=>[]),api('/rest/v1/payments?school_id=eq.'+_schoolId+'&year=eq.'+cy+'&term=eq.'+ct+'&select=amount,paid_at').catch(()=>[]),api('/rest/v1/staff?school_id=eq.'+_schoolId+'&select=id').catch(()=>[]),api('/rest/v1/exams?school_id=eq.'+_schoolId+'&year=eq.'+cy+'&term=eq.'+ct).catch(()=>[])]);_cachedStudents=students;const active=students.filter(s=>s.status==='active'||!s.status);const allPaysDash=await api('/rest/v1/payments?school_id=eq.'+_schoolId+'&select=student_id,amount,year,term&limit=5000').catch(()=>[]);let tC=0,tP=0,deb=0;active.forEach(s=>{const led=periodLedger(s,allPaysDash,cy,ct);tC+=led.demanded;tP+=led.paidIn;if(led.balance>0)deb++});const periodColl=payments.reduce((s,p)=>s+Number(p.amount||0),0);const todayColl=payments.filter(p=>(p.paid_at||'').slice(0,10)===today).reduce((s,p)=>s+Number(p.amount),0);let examHtml='';if(!exams.length)examHtml='<div style="background:#fef2f2;padding:12px;border-radius:10px">No exams for '+cy+' Term '+ct+'</div>';else{const ids=exams.map(e=>e.id).join(',');const mc=await api('/rest/v1/marks?school_id=eq.'+_schoolId+'&exam_id=in.('+ids+')&select=exam_id,student_id').catch(()=>[]);const em={};mc.forEach(m=>{(em[m.exam_id]=em[m.exam_id]||new Set()).add(m.student_id)});exams.forEach(ex=>{const n=em[ex.id]?em[ex.id].size:0;examHtml+='<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eef1f6"><b>'+esc(ex.name)+' (Stage '+ex.stage+')</b><span class="badge '+(n?'ok':'bad')+'">'+n+' pupils · '+(n?'Uploaded':'No Marks')+'</span></div>'})}
root.innerHTML='<div style="display:flex;justify-content:space-between;align-items:flex-end"><div><h1 style="margin:0">Dashboard</h1><div style="color:#64748b">'+cy+' Term '+ct+' · '+fmtLongDate(new Date())+'</div></div><button class="btn" onclick="openStudentModal(null)">＋ Register Pupil</button></div><div class="grid grid-3" style="margin:14px 0"><div class="kpi"><div class="v">'+active.length+'</div><div class="l">Active Pupils</div></div><div class="kpi"><div class="v">'+fmtUGX(periodColl)+'</div><div class="l">Collected · '+cy+' Term '+ct+'</div></div><div class="kpi"><div class="v">'+fmtUGX(tC-tP)+'</div><div class="l">Outstanding · '+cy+' Term '+ct+'</div></div><div class="kpi"><div class="v">'+fmtUGX(todayColl)+'</div><div class="l">Today · '+cy+' Term '+ct+'</div></div><div class="kpi"><div class="v">'+deb+'</div><div class="l">Debtors</div></div><div class="kpi"><div class="v">'+classes.length+' · '+staff.length+'</div><div class="l">Classes · Staff</div></div></div><div class="card"><h3>📝 Exam Upload Status ('+cy+' Term '+ct+')</h3>'+examHtml+'</div>'}
async function pageStudents(root){_classesCache=null;const classes=await loadClasses();const students=await api('/rest/v1/students?school_id=eq.'+_schoolId+'&select=*&order=admission_no');_cachedStudents=students||[];window._feesAllPays=await api('/rest/v1/payments?school_id=eq.'+_schoolId+'&select=student_id,amount,year,term&limit=5000').catch(()=>[]);window._feesPeriod={year:getYear(),term:getTerm()};root.innerHTML='<div style="display:flex;justify-content:space-between"><h1 style="margin:0">Pupils</h1><button class="btn" onclick="openStudentModal(null)">＋ Register</button></div><div class="card"><div class="grid grid-3" style="margin-bottom:12px"><input id="stSearch" placeholder="🔍 Search name, ADM, parent…" oninput="filterStudents()"><select id="stClass" onchange="filterStudents()"><option value="">All classes</option>'+classes.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select><select id="stRes" onchange="filterStudents()"><option value="">All types</option><option value="Day">Day</option><option value="Boarding">Boarding</option></select></div><div id="stTable"></div></div>';filterStudents()}
function filterStudents(){const q=(document.getElementById('stSearch').value||'').toLowerCase();const cf=document.getElementById('stClass').value||'';const rf=document.getElementById('stRes').value||'';const cById={};(_classesCache||[]).forEach(c=>cById[c.id]=c);const list=_cachedStudents.filter(s=>{if(cf&&s.class_id!==cf)return false;if(rf&&isBoard(s.boarding_status)!==(rf==='Boarding'))return false;if(q){const h=(s.first_name+' '+(s.last_name||'')+' '+s.admission_no+' '+(s.parent_name||'')+' '+(s.parent_contact||'')).toLowerCase();if(h.indexOf(q)===-1)return false}return true});const c=document.getElementById('stTable');if(!list.length){c.innerHTML='<div style="text-align:center;padding:30px;color:#64748b">No pupils.</div>';return}c.innerHTML='<div style="overflow-x:auto"><table><thead><tr><th>ADM</th><th>Name</th><th>Class</th><th>Gender</th><th>Parent</th><th>Type</th><th style="text-align:right">Balance</th><th></th></tr></thead><tbody>'+list.map(s=>{const bal=periodLedger(s,window._feesAllPays||[],getYear(),getTerm()).balance;return '<tr><td><b>'+esc(s.admission_no||'—')+'</b></td><td>'+esc(s.first_name+' '+(s.last_name||''))+'</td><td>'+esc(cById[s.class_id]?cById[s.class_id].name:'')+'</td><td>'+esc(genderLabel(s.gender))+'</td><td>'+esc(s.parent_name||'—')+'<div style="font-size:11px;color:#64748b">'+esc(s.parent_contact||'')+'</div></td><td>'+(isBoard(s.boarding_status)?'<span class="badge warn">Board</span>':'<span class="badge ok">Day</span>')+'</td><td style="text-align:right"><span class="badge '+(bal>0?'bad':'ok')+'">'+fmtNum(bal)+'</span></td><td style="white-space:nowrap"><button class="btn sm gold" onclick="recordPayment(\''+s.id+'\')">💵</button> <button class="btn sm ghost" onclick="openStudentModalById(\''+s.id+'\')">✏</button> <button class="btn sm danger" onclick="deleteStudent(\''+s.id+'\')">✕</button></td></tr>'}).join('')+'</tbody></table></div>'}

async function openStudentModal(existing){_classesCache=null;const classes=await loadClasses();const s=existing||{};modal('<h3>'+(existing?'Edit Pupil':'Register Pupil')+'</h3><div class="grid grid-2"><div><label>Admission No *</label><input id="m_adm" value="'+esc(s.admission_no||('ADM-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-4)))+'"></div><div><label>Class *</label><select id="m_class"><option value="">— Select —</option>'+classes.map(c=>'<option value="'+c.id+'"'+(s.class_id===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div></div><div class="grid grid-2" style="margin-top:12px"><div><label>First Name *</label><input id="m_fn" value="'+esc(s.first_name||'')+'"></div><div><label>Second Name</label><input id="m_ln" value="'+esc(s.last_name||'')+'"></div></div><div class="grid grid-3" style="margin-top:12px"><div><label>Gender</label><select id="m_gender"><option value="">—</option><option value="M"'+(String(s.gender||'').toUpperCase()==='M'?' selected':'')+'>Male</option><option value="F"'+(String(s.gender||'').toUpperCase()==='F'?' selected':'')+'>Female</option></select></div><div><label>DOB</label><input id="m_dob" type="date" value="'+esc(s.date_of_birth||'')+'"></div><div><label>LIN</label><input id="m_lin" value="'+esc(s.lin||'')+'"></div></div><div class="grid grid-3" style="margin-top:12px"><div><label>Boarding</label><select id="m_res"><option value="Day"'+(isBoard(s.boarding_status)?'':' selected')+'>Day</option><option value="Boarding"'+(isBoard(s.boarding_status)?' selected':'')+'>Boarding</option></select></div><div><label>Location</label><input id="m_loc" value="'+esc(s.location||'')+'"></div><div><label>Status</label><select id="m_status"><option value="active"'+(s.status!=='inactive'?' selected':'')+'>Active</option><option value="inactive"'+(s.status==='inactive'?' selected':'')+'>Inactive</option></select></div></div><div class="grid grid-2" style="margin-top:12px"><div><label>Parent Name</label><input id="m_par" value="'+esc(s.parent_name||'')+'"></div><div><label>Parent Phone</label><input id="m_pc" value="'+esc(s.parent_contact||'')+'"></div></div><h4>Fees (UGX)</h4><div class="grid grid-3"><div><label>B/F</label><input id="m_bf" type="number" value="'+(Number(s.balance_bf)||0)+'" oninput="recalcFees()"></div><div><label>School Fee</label><input id="m_fee" type="number" value="'+(Number(s.actual_fee)||0)+'" oninput="recalcFees()"></div><div><label>Functional</label><input id="m_func" type="number" value="'+(Number(s.functional_fee)||0)+'" oninput="recalcFees()"></div><div><label>Transport</label><input id="m_trans" type="number" value="'+(Number(s.transport_fee)||0)+'" oninput="recalcFees()"></div><div><label>Holiday</label><input id="m_hol" type="number" value="'+(Number(s.holiday_fee)||0)+'" oninput="recalcFees()"></div><div><label>Academics</label><input id="m_acad" type="number" value="'+(Number(s.academics_fee)||0)+'" oninput="recalcFees()"></div></div><div class="grid grid-3" style="margin-top:12px"><div><label>Total Charged</label><input id="m_tc" type="number" value="'+(Number(s.total_charged)||0)+'" oninput="recalcBal()"></div><div><label>Amount Paid</label><input id="m_tp" type="number" value="'+(Number(s.total_paid)||0)+'" oninput="recalcBal()"></div><div><label>Balance</label><input id="m_bal" type="number" value="'+(Number(s.current_balance)||0)+'"></div></div><div style="margin-top:12px"><label>School Pay Code</label><input id="m_paycode" value="'+esc(s.school_pay_code||'')+'"></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveStudent(\''+(existing?existing.id:'')+'\')">Save</button></div>');setTimeout(recalcFees,80)}
function recalcFees(){const n=f=>Number(document.getElementById(f)?.value)||0;const sum=n('m_bf')+n('m_fee')+n('m_func')+n('m_trans')+n('m_hol')+n('m_acad');const tc=document.getElementById('m_tc');if(tc){tc.value=sum;recalcBal()}}

async function saveStudent(id){const n=f=>{const el=document.getElementById(f);const v=el?el.value.trim():'';return v===''?0:(Number(v)||0)};const v=f=>{const el=document.getElementById(f);return el?el.value.trim():''};const adm=v('m_adm'),fn=v('m_fn'),cid=v('m_class');if(!adm||!fn||!cid){toast('Fill ADM, First Name and Class','bad');return}const bf=n('m_bf'),fee=n('m_fee'),func=n('m_func'),trans=n('m_trans'),hol=n('m_hol'),acad=n('m_acad');const tc=n('m_tc')||(bf+fee+func+trans+hol+acad);const tp=n('m_tp');const body={school_id:_schoolId,admission_no:adm,class_id:cid,first_name:fn,last_name:v('m_ln')||null,gender:v('m_gender')||null,date_of_birth:v('m_dob')||null,lin:v('m_lin')||null,school_pay_code:v('m_paycode')||null,boarding_status:v('m_res')||'Day',location:v('m_loc')||null,parent_name:v('m_par')||null,parent_contact:v('m_pc')||null,status:v('m_status')||'active',balance_bf:bf,actual_fee:fee,functional_fee:func,transport_fee:trans,holiday_fee:hol,academics_fee:acad,total_charged:tc,total_paid:tp,current_balance:tc-tp};try{if(id)await api('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});else await api('/rest/v1/students',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});toast('Saved ✓','ok');closeModal();nav(activeRoute)}catch(e){toast('Save failed: '+e.message,'bad')}}

function buildPrimaryCard(s,d){const per=d.endMarks[s.id]||{},midPer=d.midMarks[s.id]||{},botPer=d.botMarks[s.id]||{};const cls=(_classesCache||[]).find(c=>c.id===s.class_id);function buildTable(perObj){let rows='',grand=0,cnt=0,aggT=0;d.subjects.forEach(sj=>{const v=perObj[sj.subject_id];const sc=(v!=null&&!isNaN(v))?Number(v):null;const g=gradePrimary(sc);const un=isUngradedSubject(sj);if(sc!=null){grand+=sc;cnt++;if(!un&&g.aggNum!=null)aggT+=g.aggNum}rows+='<tr><td class="subname">'+esc(sj.name)+'</td><td>100</td><td class="sc">'+(sc!=null?sc:'')+'</td><td class="grade">'+(sc!=null?g.g:'')+'</td><td class="agg">'+(sc!=null&&!un?g.agg:'-')+'</td><td></td></tr>'});return{rows,grand,cnt,aggTotal:aggT}}const botT=buildTable(botPer),midT=buildTable(midPer),endT=buildTable(per);let div='U';if(s.division_manual)div=s.division_manual;else if(d.computed[s.id].usedCount>=4)div=d.computed[s.id].division;const pos=s.position_manual||(d.positions[s.id]?String(d.positions[s.id]):'—');let grand=0,count=0;if(endT.cnt>0){grand=endT.grand;count=endT.cnt}else if(midT.cnt>0){grand=midT.grand;count=midT.cnt}else if(botT.cnt>0){grand=botT.grand;count=botT.cnt}const avg=count>0?grand/count:0;const autoC=generateAutoComments(avg,count>0,'normal');const ct=(s.class_teacher_comment||'').trim()?s.class_teacher_comment:autoC.ct;const ht=(s.head_teacher_comment||'').trim()?s.head_teacher_comment:autoC.ht;const headers='<thead><tr><th style="text-align:left">SUBJECT</th><th style="width:15%">SCORE</th><th style="width:20%">MARKS</th><th style="width:15%">GRADE</th><th style="width:10%">AGG</th><th style="width:15%">INITIALS</th></tr></thead>';let tables='';if(_printTables.bot)tables+='<div class="rc-section-title">BEGINNING OF TERM PERFORMANCE</div><table class="rc-table">'+headers+'<tbody>'+botT.rows+'<tr><td class="subname">TOTAL</td><td>'+(d.subjects.length*100)+'</td><td class="sc">'+botT.grand.toFixed(0)+'</td><td></td><td class="agg">'+botT.aggTotal+'</td><td></td></tr></tbody></table>' function buildBabyCard(s,d){const per=d.endMarks[s.id]||{},midPer=d.midMarks[s.id]||{},botPer=d.botMarks[s.id]||{};const cls=(_classesCache||[]).find(c=>c.id===s.class_id);const babySubs=['LA 1 (SOCIAL DEVELOPMENT)','LA 2 (ENGLISH)','LA 3 (HEALTH HABITS)','LA 4 (MATHEMATICS)','LA 5 (READING & WRITING)'];function findBaby(n){for(const sj of d.subjects){const nm=(sj.name||'').toUpperCase(),cc=(sj.code||'').toUpperCase();if(cc==='LA'+n)return sj;const m=nm.match(/LA[\s\-_.]*0*(\d)(?![0-9])/);if(m&&parseInt(m[1])===n)return sj;const mc=cc.match(/LA[\s\-_.]*0*(\d)(?![0-9])/);if(mc&&parseInt(mc[1])===n)return sj}return null}function buildTable(perObj){let rows='';babySubs.forEach((name,idx)=>{const db=findBaby(idx+1);const v=db?perObj[db.subject_id]:null;const sc=(v!=null&&!isNaN(v))?Number(v):null;const g=gradeBaby(sc);rows+='<tr><td class="subname" style="text-align:center">'+esc(name)+'</td><td class="sc" style="font-size:14pt">'+(g.g||'')+'</td><td style="font-family:\'Comic Sans MS\',cursive;font-size:14pt;text-align:center">'+(g.r||'')+'</td><td></td></tr>'});return{rows}}const botT=buildTable(botPer),midT=buildTable(midPer),endT=buildTable(per);let tot=0,cnt=0;d.subjects.forEach(sj=>{const v=per[sj.subject_id]??midPer[sj.subject_id]??botPer[sj.subject_id];if(v!=null&&!isNaN(v)){tot+=Number(v);cnt++}});const avg=cnt>0?tot/cnt:0;const autoC=generateAutoComments(avg,cnt>0,'normal');const ct=(s.class_teacher_comment||'').trim()?s.class_teacher_comment:autoC.ct;const ht=(s.head_teacher_comment||'').trim()?s.head_teacher_comment:autoC.ht;const headers='<thead><tr><th style="width:40%;text-align:left">SUBJECT</th><th style="width:20%">SCORE</th><th style="width:25%">REMARK</th><th style="width:15%">INITIALS</th></tr></thead>';let tables='';if(_printTables.bot)tables+='<div class="rc-section-title">BEGINNING OF TERM PERFORMANCE</div><table class="rc-table">'+headers+'<tbody>'+botT.rows+'</tbody></table>';if(_printTables.mid)tables+='<div class="rc-section-title">MID TERM P function buildP7Card(s,d){const cls=(_classesCache||[]).find(c=>c.id===s.class_id);const c=d.computed[s.id]||{};const subs=d.subjects.slice(0,4);function buildTable(perObj,title,key){if(!_printTables[key])return '';let rows='',grand=0,aggT=0;subs.forEach(sj=>{const v=perObj[sj.subject_id];const sc=(v!=null&&!isNaN(v))?Number(v):null;const g=gradePrimary(sc);if(sc!=null){grand+=sc;if(g.aggNum!=null)aggT+=g.aggNum}rows+='<tr><td class="subname">'+esc(sj.name)+'</td><td>100</td><td class="sc">'+(sc!=null?sc:'')+'</td><td class="grade">'+(sc!=null?g.g:'')+'</td><td class="agg">'+(sc!=null?g.agg:'-')+'</td><td></td></tr>'});const sd=computeP7Division(perObj,subs);const headers='<thead><tr><th style="text-align:left">SUBJECT</th><th style="width:15%">SCORE</th><th style="width:20%">MARKS</th><th style="width:15%">GRADE</th><th style="width:10%">AGG</th><th style="width:15%">INITIALS</th></tr></thead>';return '<div class="rc-section-title">'+title+'</div><table class="rc-table">'+headers+'<tbody>'+rows+'<tr><td class="subname">TOTAL</td><td>'+(subs.length*100)+'</td><td class="sc">'+grand.toFixed(0)+'</td><td></td><td class="agg">'+aggT+'</td><td></td></tr><tr style="background:#fdf4ff"><td class="subname" style="color:#800080">'+title+' — DIV</td><td colspan="2" style="font-weight:900;color:#800080">'+(sd.incomplete?'—':sd.division)+'</td><td class="subname" style="color:#800080">AGGREGATE</td><td colspan="2" class="agg">'+(sd.incomplete?'—':sd.agg)+'</td></tr></tbody></table>'}let div='U';if(s.division_manual)div=s.division_manual;else if(!c.incomplete)div=c.division;let tot=0,cnt=0;const active=Object.keys(d.mockMarks[s.id]||{}).length?d.mockMarks[s.id]:Object.keys(d.set3Marks[s.id]||{}).length?d.set3Marks[s.id]:Object.keys(d.set2Marks[s.id]||{}).length?d.set2Marks[s.id]:d.set1Marks[s.id]||{};subs.forEach(sj=>{const v=active[sj.subject_id];if(v!=null&&!isNaN(v)){tot+=Number(v);cnt++}});const avg=cnt>0?tot/cnt:0;const autoC=generateAutoComments(avg,cnt>0,'ple');const ct=(s.class_teacher_comment||'').trim()?s.class_teacher_comment:autoC.ct;const ht=(s.head_teacher_comment||'').trim()?s.head_teacher_comment:autoC.ht;let tables=buildTable(d.mockMarks[s.id]||{},'MOCK EXAMINATION','mock')+buildTable(d.set1Marks[s.id]||{},'SET 1','set1')+buildTable(d.set2Marks[s.id]||{},'SET 2','set2')+buildTable(d.set3Marks[s.id]||{},'SET 3','set3');return '<div class="rc-page"><div class="rc-inner">'+buildHeader()+'<div class="rc-pupil"><div class="cell w-full"><span class="lbl">PUPIL\'S NAME:</span><span class="val">'+esc((s.first_name+' '+(s.last_name||'')).toUpperCase())+'</span></div><div class="cell w-50"><span class="lbl">CLASS:</span><span class="val">'+esc(cls?cls.name.toUpperCase():'—')+'</span></div><div class="cell w-50"><span class="lbl">TERM:</span><span class="val">'+d.term+'</span></div><div class="cell w-50"><span class="lbl">DIVISION:</span><span class="val" style="font-weight:900;color:#800080">'+div+'</span></div>'+rcPupilExtra(s)+'<div class="cell w-50"><span class="lbl">YEAR:</span><span class="val">'+d.year+'</span></div></div>'+tables+buildScalePrimary()+'<div class="rc-lines"><span class="lbl">Conduct:</span><span class="line handwriting">'+esc(s.conduct||'')+'</span><span class="lbl" style="margin-top:8px">Class Teacher\'s comment:</span><span class="line handwriting">'+esc(ct)+'</span></div><div class="rc-lines"><span class="lbl">Head Teacher\'s comment:</span><span class="line handwriting">'+esc(ht)+'</span>'+(s.director_comment?'<span class="lbl" style="margin-top:6px">Director\'s comment:</span><span class="line handwriting">'+esc(s.director_comment)+'</span>':'')+'</div>'+buildPleWish()+((_printTables.end&&d.term===3)?buildReportDates(s.term_ended_on||'',s.next_term_begins||''):'')+rcPromotion(s,d)+buildFooter()+'</div></div>'}
function printAllReports(){const d=window._reportData;if(!d||!d.students.length){toast('Nothing to print','bad');return}let inIframe=false;try{inIframe=window.self!==window.top}catch(e){inIframe=true}if(inIframe){toast('Press Ctrl + P to print this page','ok');window.print();return}const w=window.open('','_blank');if(!w){toast('Allow popups','bad');return}let styles='';document.querySelectorAll('style').forEach(st=>{styles+=st.innerHTML});let h='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Report Cards</title><style>'+styles+'</style></head><body>';d.students.forEach(s=>{h+='<div class="rc-stage">'+(d.isP7?buildP7Card(s,d):d.isBaby?buildBabyCard(s,d):buildPrimaryCard(s,d))+'</div>'});h+='<script>setTimeout(function(){window.print()},700)</'+'script></body></html>';w.document.write(h);w.document.close()}

async function saveSchool(){const b={name:document.getElementById('s_name').value.trim(),telephone:document.getElementById('s_phone').value.trim(),address:document.getElementById('s_addr').value.trim(),head_teacher:document.getElementById('s_head').value.trim()};try{await api('/rest/v1/schools?id=eq.'+_schoolId,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(b)});Object.assign(_school,b);renderHeader();toast('Saved ✓','ok')}catch(e){toast('Save failed: '+e.message,'bad')}}
try{const s=lsGet('pm_session');if(s)_session=JSON.parse(s)}catch(e){_session=null}
if(_session&&_session.user)boot().catch(()=>{lsDel('pm_session');_session=null;document.getElementById('authScreen').style.display='flex'});
</script></body></html>
