<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Eudes School Management</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- SheetJS Library for reading Excel files -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6fb;--surface:#fff;--line:#e5e9f0;--line2:#eef1f6;--text:#0b1220;--text2:#334155;--muted:#64748b;--brand:#4f46e5;--brand2:#4338ca;--brandsoft:#eef2ff;--ring:rgba(79,70,229,.15);--ok:#059669;--oksoft:#ecfdf5;--warn:#d97706;--warnsoft:#fffbeb;--bad:#dc2626;--badsoft:#fef2f2;--radius:14px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:'Inter',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:all .15s}
input,select{font-family:inherit;width:100%;padding:11px 14px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--text);font-size:14px}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--ring)}
label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:6px;font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line2);font-size:13.5px}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;background:#f9fafb}
tbody tr:hover{background:#f9fafb}
h1{font-size:22px;font-weight:700;margin:0 0 4px}
h3{font-size:15px;font-weight:700;margin:0 0 12px}
.muted{color:var(--muted);font-size:12.5px}
#app{display:flex;min-height:100vh;flex-direction:row-reverse}
#sidebar{width:250px;background:#0f172a;color:#cbd5e1;display:flex;flex-direction:column;padding:20px 14px;flex-shrink:0}
#sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:16px}
#sidebar .brand .mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px}
#sidebar .brand .name{font-size:13.5px;font-weight:700;color:#fff}
#sidebar .brand .sub{font-size:10px;color:#94a3b8;letter-spacing:.06em;text-transform:uppercase}
#schoolBadge{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);padding:12px;border-radius:12px;margin-bottom:16px;font-size:12px;color:#e2e8f0}
#schoolBadge b{display:block;font-size:12.5px;font-weight:600;color:#fff;margin-bottom:3px;line-height:1.3}
#schoolBadge .muted{color:#8ea1bb;font-size:11px}
#sidebar nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
#sidebar nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;color:#cbd5e1;font-weight:500}
#sidebar nav a:hover{background:rgba(255,255,255,.06);color:#fff}
#sidebar nav a.active{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;font-weight:600}
#sidebar .logout{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;color:#94a3b8;margin-top:8px;border-top:1px solid rgba(255,255,255,.06);padding-top:14px}
#sidebar .logout:hover{color:#fca5a5}
#main{flex:1;padding:28px 36px;overflow:auto;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:3px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.grid{display:grid;gap:16px}
.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-size:12px;margin-top:4px;font-weight:500}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600}
.badge.ok{background:var(--oksoft);color:#047857;border:1px solid #a7f3d0}
.badge.bad{background:var(--badsoft);color:#b91c1c;border:1px solid #fecaca}
.badge.info{background:var(--brandsoft);color:var(--brand2);border:1px solid #c7d2fe}
.btn{background:var(--brand);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--brand2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--text2)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
.toast{position:fixed;bottom:20px;left:20px;background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;z-index:100;font-size:13.5px;font-weight:500;box-shadow:0 20px 40px -12px rgba(15,23,42,.5)}
.toast.bad{background:#7f1d1d}
.auth-bg{position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,#4f46e5 0%,transparent 50%),radial-gradient(circle at 80% 80%,#7c3aed 0%,transparent 50%),#0b1220;display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;overflow:auto}
.auth-card{background:#fff;border-radius:20px;padding:36px;width:100%;max-width:440px;box-shadow:0 40px 80px -20px rgba(0,0,0,.5)}
.auth-card .logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;margin:0 auto 16px}
.auth-card h1{text-align:center;font-size:19px;margin:0 0 6px}
.auth-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs button{flex:1;padding:11px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.active{color:var(--brand);border-bottom-color:var(--brand)}
.err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:11px 14px;border-radius:10px;margin-top:14px;font-size:13px}
.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#047857;padding:11px 14px;border-radius:10px;margin-top:14px;font-size:13px}
.loading{padding:60px;text-align:center;color:var(--muted);font-size:14px}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:14px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:26px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line2);flex-wrap:wrap}
@media(max-width:900px){
  #app{flex-direction:column}
  #sidebar{width:100%;flex-direction:column;padding:12px}
  #sidebar .brand{padding:0 0 10px;margin:0}
  #sidebar nav{flex-direction:row;overflow-x:auto;gap:6px;padding:6px 0}
  #sidebar nav a{flex:0 0 auto;padding:8px 12px;font-size:12.5px;background:rgba(255,255,255,.05);border-radius:999px}
  #main{padding:16px}
  .grid-kpi{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="auth-bg" id="authScreen">
  <div class="auth-card">
    <div class="logo">E</div>
    <h1>Eudes School Management</h1>
    <div class="sub">Powered by Eudes Media</div>

    <div class="tabs">
      <button id="tabLogin" class="active" onclick="switchTab('login')">Sign In</button>
      <button id="tabRegister" onclick="switchTab('register')">Register School</button>
    </div>

    <div id="loginForm">
      <div><label>Email</label><input id="loginEmail" type="email" placeholder="you@gmail.com"></div>
      <div style="margin-top:12px"><label>Password</label><input id="loginPass" type="password"></div>
      <div id="loginErr" class="err" style="display:none"></div>
      <button class="btn" id="loginBtn" style="width:100%;justify-content:center;padding:12px;margin-top:18px" onclick="doLogin()">Sign In</button>
    </div>

    <div id="registerForm" style="display:none">
      <div><label>Your Full Name</label><input id="regName"></div>
      <div style="margin-top:12px"><label>Email (use a real email you own)</label><input id="regEmail" type="email"></div>
      <div style="margin-top:12px"><label>Password (min 8 characters)</label><input id="regPass" type="password"></div>
      <h3 style="margin-top:18px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">School Information</h3>
      <div><label>School Name</label><input id="regSchool" placeholder="Progressive Mother's Nursery and Primary School"></div>
      <div style="margin-top:12px"><label>Short Name (no spaces)</label><input id="regSlug" placeholder="progressive-mothers"></div>
      <div style="margin-top:12px"><label>Address</label><input id="regAddr" placeholder="Gayaza Kijabijo, Wakiso"></div>
      <div class="grid grid-2" style="margin-top:12px">
        <div><label>Telephone</label><input id="regPhone"></div>
        <div><label>Head Teacher</label><input id="regHead"></div>
      </div>
      <div id="regErr" class="err" style="display:none"></div>
      <div id="regOk" class="ok" style="display:none"></div>

</div>

<div id="app" style="display:none">
  <aside id="sidebar">
    <div class="brand">
      <div class="mark">E</div>
      <div>
        <div class="name">Eudes S.M.</div>
        <div class="sub">Powered by Eudes</div>
      </div>
    </div>
    <div id="schoolBadge"></div>
    <nav id="nav"></nav>
    <a class="logout" href="#" onclick="doLogout();return false;">⎋ &nbsp;Sign Out</a>
  </aside>
  <main id="main"></main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<input type="file" id="excelInput" accept=".xlsx, .xls" style="display:none;" onchange="handleExcelUpload(this)">

<script>
/* ============================================================
   CONFIGURATION
   ============================================================ */
const SUPA_URL = 'https://wabeempxckdtjvrkzhpv.supabase.co';
const SUPA_KEY = 'sb_publishable_n0uAm0Gcq7qR2dJM4jMZGQ_wiV__Cfp';

/* ============================================================
   SAFE STORAGE WRAPPER
   ============================================================ */
let _memoryStore = {};
const safeStorage = {
  getItem: function(key) {
    try { return localStorage.getItem(key); } 
    catch(e) { return _memoryStore[key] || null; }
  },
  setItem: function(key, value) {
    try { localStorage.setItem(key, value); } 
    catch(e) { _memoryStore[key] = String(value); }
  },
  removeItem: function(key) {
    try { localStorage.removeItem(key); } 
    catch(e) { delete _memoryStore[key]; }
  }
};

/* ============================================================
   LOW-LEVEL FETCH HELPERS
   ============================================================ */
function getToken(){
  const s = safeStorage.getItem('eudes_session');
  if(!s) return null;
  try { return JSON.parse(s).access_token; } catch(e){ return null; }
}
function getUser(){
  const s = safeStorage.getItem('eudes_session');
  if(!s) return null;
  try { return JSON.parse(s).user; } catch(e){ return null; }
}
function setSession(data){
  if(data){
    safeStorage.setItem('eudes_session', JSON.stringify(data));
  } else {
    safeStorage.removeItem('eudes_session');
  }
}

async function rest(path, options){
  options = options || {};
  const headers = Object.assign({
    'apikey': SUPA_KEY,
    'Content-Type': 'application/json'
  }, options.headers || {});
  const token = getToken();
  headers['Authorization'] = 'Bearer ' + (token || SUPA_KEY);

  const res = await fetch(SUPA_URL + path, Object.assign({}, options, { headers: headers }));
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
  if(!res.ok){
    const msg = (data && (data.message || data.msg || data.error_description || data.error)) || text || ('HTTP ' + res.status);
    throw new Error(msg);
  }
  return data;
}

async function auth(path, body){
  const res = await fetch(SUPA_URL + path, {
    method: 'POST',
    headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
  if(!res.ok){
    const msg = (data && (data.message || data.msg || data.error_description || data.error)) || text || ('HTTP ' + res.status);
    throw new Error(msg);
  }
  return data;
}

/* ============================================================
   STATE
   ============================================================ */
let SESSION = null;
let _profile = null;
let _school = null;
let _schoolId = null;
let _role = null;
let _classesCache = null;

function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'bad' ? ' bad' : '');
  el.textContent = msg;
  document.getElementById('toastRoot').appendChild(el);
  setTimeout(function(){ el.remove(); }, 3200);
}
function modal(html){
  const root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="modal-bg"><div class="modal">' + html + '</div></div>';
  root.querySelector('.modal-bg').addEventListener('click', function(e){
    if(e.target.classList.contains('modal-bg')) closeModal();
  });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function age(dob){ if(!dob) return '—'; return Math.floor((Date.now()-new Date(dob).getTime())/(365.25*24*3600*1000)) + ' yrs'; }
window.toast = toast; window.modal = modal; window.closeModal = closeModal;

/* ============================================================
   AUTH SCREEN
   ============================================================ */
function switchTab(which){
  document.getElementById('tabLogin').classList.toggle('active', which === 'login');
  document.getElementById('tabRegister').classList.toggle('active', which === 'register');
  document.getElementById('loginForm').style.display = which === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = which === 'register' ? 'block' : 'none';
  document.getElementById('loginErr').style.display = 'none';
  document.getElementById('regErr').style.display = 'none';
}
window.switchTab = switchTab;

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  err.style.display = 'none';
  if(!email || !pass){ err.textContent = 'Enter email and password'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const data = await auth('/auth/v1/token?grant_type=password', { email: email, password: pass });
    setSession(data);
    await boot();
  } catch(e){
    err.textContent = e.message;
    err.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'Sign In';
}
window.doLogin = doLogin;

async function doRegister(){
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim().toLowerCase();
  const pass = document.getElementById('regPass').value;
  const school = document.getElementById('regSchool').value.trim();
  const slug = document.getElementById('regSlug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-');
  const addr = document.getElementById('regAddr').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const head = document.getElementById('regHead').value.trim();
  const err = document.getElementById('regErr');
  const ok = document.getElementById('regOk');
  const btn = document.getElementById('regBtn');
  err.style.display = 'none'; ok.style.display = 'none';

  if(!name || !email || !pass || !school || !slug){
    err.textContent = 'Fill all required fields'; err.style.display = 'block'; return;
  }
  if(pass.length < 8){
    err.textContent = 'Password must be at least 8 characters'; err.style.display = 'block'; return;
  }

  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const data = await auth('/auth/v1/signup', {
      email: email, password: pass,
      data: { full_name: name }
    });
    
    if(!data.access_token){
      ok.textContent = 'Check your email to confirm, then sign in.';
      ok.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Create School';
      return;
    }
    
    setSession(data);

    await rest('/rest/v1/rpc/create_school_and_become_owner', {
      method: 'POST',
      body: JSON.stringify({
        p_school_name: school,
        p_school_slug: slug,
        p_motto: null,
        p_address: addr || null,
        p_telephone: phone || null,
        p_email: email,
        p_head_teacher: head || null
      })
    });

    ok.textContent = 'School created. Loading dashboard…';
    ok.style.display = 'block';
    setTimeout(boot, 500);
  } catch(e){
    err.textContent = e.message;
    err.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'Create School';
}
window.doRegister = doRegister;

async function doLogout(){
  try {
    const token = getToken();
    if(token){
      await fetch(SUPA_URL + '/auth/v1/logout', {
        method: 'POST',
        headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + token }
      });
    }
  } catch(e){}
  setSession(null);
  SESSION = null; _profile = null; _school = null; _schoolId = null; _role = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('authScreen').style.display = 'flex';
}
window.doLogout = doLogout;

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  const user = getUser();
  const token = getToken();
  if(!user || !token){
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    return;
  }
  SESSION = user;

  try {
    const profiles = await rest('/rest/v1/profiles?id=eq.' + user.id + '&select=*');
    _profile = profiles && profiles[0];
  } catch(e){
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('loginErr').textContent = 'Profile not found. Error: ' + e.message;
    document.getElementById('loginErr').style.display = 'block';
    return;
  }

  if(!_profile){
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('loginErr').textContent = 'Profile not found. The trigger may not have run.';
    document.getElementById('loginErr').style.display = 'block';
    return;
  }
  _schoolId = _profile.school_id;
  _role = _profile.role;

  if(!_schoolId){
    document.getElementById('authScreen').style.display = 'flex';
    switchTab('register');
    document.getElementById('regErr').textContent = 'Your account is not linked to a school. Create one below.';
    document.getElementById('regErr').style.display = 'block';
    document.getElementById('regName').parentElement.style.display = 'none';
    document.getElementById('regEmail').parentElement.style.display = 'none';
    document.getElementById('regPass').parentElement.style.display = 'none';
    document.getElementById('regBtn').textContent = 'Create School';
    document.getElementById('regBtn').onclick = createSchoolOnly;
    return;
  }

  try {
    const schools = await rest('/rest/v1/schools?id=eq.' + _schoolId + '&select=*');
    _school = schools && schools[0];
  } catch(e){}

  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  renderBadge();
  renderNav();
  await nav('dashboard');
}
window.boot = boot;

async function createSchoolOnly(){
  const school = document.getElementById('regSchool').value.trim();
  const slug = document.getElementById('regSlug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-');
  const addr = document.getElementById('regAddr').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const head = document.getElementById('regHead').value.trim();
  const err = document.getElementById('regErr');
  const btn = document.getElementById('regBtn');
  err.style.display = 'none';
  if(!school || !slug){ err.textContent = 'Fill school name and short name'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    await rest('/rest/v1/rpc/create_school_and_become_owner', {
      method: 'POST',
      body: JSON.stringify({
        p_school_name: school, p_school_slug: slug, p_motto: null,
        p_address: addr || null, p_telephone: phone || null,
        p_email: _profile.email || null, p_head_teacher: head || null
      })
    });
    toast('School created');
    setTimeout(boot, 500);
  } catch(e){
    err.textContent = e.message; err.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'Create School';
}
window.createSchoolOnly = createSchoolOnly;

/* ============================================================
   BADGE + NAV
   ============================================================ */
function renderBadge(){
  const el = document.getElementById('schoolBadge');
  if(!_school){ el.innerHTML = '<b>School</b>'; return; }
  el.innerHTML =
    '<b>' + esc(_school.name) + '</b>' +
    '<div class="muted">' + esc(_school.address || '') + '</div>' +
    '<div class="muted" style="margin-top:3px">' + esc(_profile.full_name || SESSION.email) + ' · ' + esc((_profile.role||'').replace(/_/g,' ')) + '</div>';
}

const ROUTES = {
  dashboard: { label:'Dashboard', icon:'📊', render: pageDashboard },
  students:  { label:'Pupils',    icon:'🎓', render: pageStudents },
  classes:   { label:'Classes',   icon:'🏫', render: pageClasses },
  subjects:  { label:'Subjects',  icon:'📚', render: pageSubjects },

function generateLIN(firstName) {
  const initial = firstName ? firstName.charAt(0).toUpperCase() : 'X';
  const digits = Math.floor(1000 + Math.random() * 9000);
  return 'PM' + initial + digits;
}

/* ============================================================
   BULK IMPORT EXCEL LOGIC (DIRECT FROM YOUR FILE)
   ============================================================ */
async function handleExcelUpload(input) {
  if (!input.files || input.files.length === 0) return;
  const file = input.files[0];
  const reader = new FileReader();

  reader.onload = async function(e) {
    try {
      toast('Reading Excel file...', 'info');
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      
      // Convert to array of arrays (header: 1) to easily access columns by index
      const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
      if (!rows || rows.length < 2) { toast('No data found in the file', 'bad'); return; }

      const classes = await loadClasses();
      const studentsToInsert = [];

      // Loop starting from index 1 (skip header)
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        // Skip empty rows or rows without a name (Column B is index 1)
        if (!row || !row[1] || String(row[1]).trim() === '' || String(row[1]).trim() === 'Name') continue;

        const fullName = String(row[1]).trim();
        const nameParts = fullName.split(' ');
        const firstName = nameParts[0];
        const lastName = nameParts.slice(1).join(' ') || null;
        
        const className = String(row[2] || '').trim();
        let classId = null;
        
        // Match or create the class
        if (className) {
          const matched = classes.find(c => c.name.toLowerCase() === className.toLowerCase());
          if (matched) {
            classId = matched.id;
          } else {
            try {
              const newClass = await rest('/rest/v1/classes', {
                method: 'POST',
                headers: { 'Prefer': 'return=representation' },
                body: JSON.stringify({ school_id: _schoolId, name: className, sort_order: 99 })
              });
              if (newClass && newClass[0]) {
                classId = newClass[0].id;
                classes.push({ id: classId, name: className });
                _classesCache = classes;
              }
            } catch(err) { console.error('Error creating class:', className, err); }
          }
        }

        // Helper to safely parse numbers from Excel
        const getNum = (val) => {
          if (val === undefined || val === null || val === '') return 0;
          // Remove any formulas or non-numeric characters
          const cleaned = String(val).replace(/[^0-9.-]/g, '');
          const num = parseFloat(cleaned);
          return isNaN(num) ? 0 : num;
        };

        // Map Excel columns to database fields based on your specific file
        const boardingStatus = String(row[3] || 'Day').trim(); // Col D (Status)
        const parentContact = row[4] ? String(row[4]).trim() : null; // Col E (Parent tel)
        const balanceBf = getNum(row[5]); // Col F
        const actualFee = getNum(row[7]); // Col H
        const functionalFee = getNum(row[10]); // Col K
        const transportFee = getNum(row[12]); // Col M
        const dep1 = getNum(row[13]); // Col N
        const dep2 = getNum(row[14]); // Col O
        const dep3 = getNum(row[15]); // Col P
        
        // If Excel has a total (Col Q) use it, otherwise calculate
        let totalExpected = getNum(row[16]); // Col Q
        if (totalExpected === 0) {
          totalExpected = balanceBf + actualFee + functionalFee + transportFee;
        }
        
        let currentBalance = getNum(row[17]); // Col R
        if (currentBalance === 0 && totalExpected > 0) {
          currentBalance = totalExpected - dep1 - dep2 - dep3;
        }

        studentsToInsert.push({
          school_id: _schoolId,
          admission_no: row[0] ? 'ADM-' + String(row[0]).trim() : 'ADM-' + Math.floor(Math.random() * 10000),
          first_name: firstName,
          last_name: lastName,
          lin: generateLIN(firstName),
          class_id: classId,
          boarding_status: boardingStatus,
          parent_contact: parentContact,
          balance_bf: balanceBf,
          actual_fee: actualFee,
          functional_fee: functionalFee,
          transport_fee: transportFee,
          deposit_1: dep1,
          deposit_2: dep2,
          deposit_3: dep3,
          total_expected: totalExpected,
          current_balance: currentBalance,
          status: 'active'
        });
      }

      if (studentsToInsert.length === 0) { toast('No valid student records found', 'bad'); return; }

      toast('Importing ' + studentsToInsert.length + ' students...', 'info');

      // Batch insert in chunks of 50 to avoid payload limits
      const chunkSize = 50;
      for (let i = 0; i < studentsToInsert.length; i += chunkSize) {
        const chunk = studentsToInsert.slice(i, i + chunkSize);
        await rest('/rest/v1/students', {
          method: 'POST',
          headers: { 'Prefer': 'return=minimal' },
          body: JSON.stringify(chunk)
        });
      }

      toast('Successfully imported ' + studentsToInsert.length + ' students!');
      input.value = ''; 
      nav('students'); 
    } catch (err) {
      console.error('Excel import error:', err);
      toast('Error importing Excel: ' + err.message, 'bad');
      input.value = '';
    }
  };
  reader.readAsArrayBuffer(file);
}
window.handleExcelUpload = handleExcelUpload;

async function pageMarks(root){
  const [exams, classes, subjects] = await Promise.all([
    rest('/rest/v1/exams?school_id=eq.' + _schoolId + '&select=*&order=created_at.desc'),
    rest('/rest/v1/classes?school_id=eq.' + _schoolId + '&select=*&order=sort_order'),
    rest('/rest/v1/subjects?school_id=eq.' + _schoolId + '&select=*&order=code')
  ]);
  if(!(exams||[]).length || !(classes||[]).length || !(subjects||[]).length){
    root.innerHTML = '<div class="page-head"><div><h1>Marks Entry</h1></div></div>' +
      '<div class="card"><div class="empty">Create an exam, class, and subject first.</div></div>';
    return;
  }
  const examId = window._marksExamId || exams[0].id;
  const classId = window._marksClassId || classes[0].id;
  const subjectId = window._marksSubjectId || subjects[0].id;
  const exam = exams.find(function(e){ return e.id === examId; }) || exams[0];
  const cls = classes.find(function(c){ return c.id === classId; }) || classes[0];
  const subj = subjects.find(function(s){ return s.id === subjectId; }) || subjects[0];

  const [students, marks] = await Promise.all([
    rest('/rest/v1/students?school_id=eq.' + _schoolId + '&class_id=eq.' + cls.id + '&status=eq.active&select=*&order=first_name'),
    rest('/rest/v1/marks?school_id=eq.' + _schoolId + '&exam_id=eq.' + exam.id + '&subject_id=eq.' + subj.id + '&select=*')
  ]);

  root.innerHTML =
    '<div class="page-head"><div><h1>Marks Entry</h1>' +
      '<div class="sub">' + esc(exam.name) + ' · ' + esc(cls.name) + ' · ' + esc(subj.name) + '</div></div>' +
      (exam.is_locked ? '<span class="badge bad">Locked</span>' :
      '<button class="btn" onclick="saveMarksGrid()">💾 Save All</button>') + '</div>' +
    '<div class="card" style="margin-bottom:16px"><div class="grid grid-3">' +
      '<div><label>Exam</label><select onchange="window._marksExamId=this.value;nav(\'marks\')">' +
        exams.map(function(e){ return '<option value="' + e.id + '"' + (e.id===exam.id?' selected':'') + '>' + esc(e.name) + '</option>'; }).join('') +
      '</select></div>' +
      '<div><label>Class</label><select onchange="window._marksClassId=this.value;nav(\'marks\')">' +
        classes.map(function(c){ return '<option value="' + c.id + '"' + (c.id===cls.id?' selected':'') + '>' + esc(c.name) + '</option>'; }).join('') +
      '</select></div>' +
      '<div><label>Subject</label><select onchange="window._marksSubjectId=this.value;nav(\'marks\')">' +
        subjects.map(function(s){ return '<option value="' + s.id + '"' + (s.id===subj.id?' selected':'') + '>' + esc(s.code) + ' — ' + esc(s.name) + '</option>'; }).join('') +
      '</select></div>' +
    '</div></div>' +
    '<div class="card">' +
      ((students||[]).length ? '<div class="table-wrap"><table>' +
        '<thead><tr><th>#</th><th>Adm No</th><th>Name</th><th>Score / 100</th></tr></thead>' +
        '<tbody>' + students.map(function(s, i){
          const m = (marks||[]).find(function(x){ return x.student_id === s.id; });
          return '<tr><td>' + (i+1) + '</td>' +
            '<td><b>' + esc(s.admission_no) + '</b></td>' +
            '<td>' + esc(s.first_name + ' ' + (s.last_name||'')) + '</td>' +
            '<td><input type="number" min="0" max="100" class="mk-input" data-student="' + s.id + '" value="' + (m ? m.score : '') + '" style="max-width:130px"></td>' +
          '</tr>';
        }).join('') + '</tbody></table></div>' : '<div class="empty">No pupils in this class.</div>') +
    '</div>';
}

async function saveMarksGrid(){
  const examId = window._marksExamId;
  const subjectId = window._marksSubjectId;
  const rows = [];
  document.querySelectorAll('.mk-input').forEach(function(inp){
    const v = inp.value.trim();
    if(v === '') return;
    const score = parseFloat(v);
    if(isNaN(score) || score < 0 || score > 100) return;
    rows.push({
      school_id: _schoolId,
      exam_id: examId,
      subject_id: subjectId,
      student_id: inp.dataset.student,
      score: score
    });
  });
  if(!rows.length){ toast('Nothing to save','bad'); return; }

  try {
    await rest('/rest/v1/marks?school_id=eq.' + _schoolId + '&exam_id=eq.' + examId + '&subject_id=eq.' + subjectId, { method: 'DELETE' });
    await rest('/rest/v1/marks', {
      method: 'POST',
      headers: { 'Prefer': 'return=minimal' },
      body: JSON.stringify(rows)
    });
    toast(rows.length + ' marks saved');
  } catch(e){ toast(e.message, 'bad'); }
}
window.saveMarksGrid = saveMarksGrid;

        '<tbody>' + students.map(function(s){
          return '<tr><td><b>' + esc(s.admission_no) + '</b></td>' +

async function viewReport(studentId, examId){
  const [student, exam, subjects, marks, rules] = await Promise.all([
    rest('/rest/v1/students?id=eq.' + studentId + '&select=*').then(function(r){ return r[0]; }),
    rest('/rest/v1/exams?id=eq.' + examId + '&select=*').then(function(r){ return r[0]; }),
    rest('/rest/v1/subjects?school_id=eq.' + _schoolId + '&select=*&order=code'),
    rest('/rest/v1/marks?school_id=eq.' + _schoolId + '&exam_id=eq.' + examId + '&student_id=eq.' + studentId + '&select=*'),
    rest('/rest/v1/grading_rules?school_id=eq.' + _schoolId + '&select=*&order=min_score.desc')
  ]);
  function gradeFor(score){
    return (rules||[]).find(function(r){ return score >= Number(r.min_score) && score <= Number(r.max_score); });
  }
  let total = 0, count = 0;
  const rows = (subjects||[]).map(function(sub){
    const m = (marks||[]).find(function(x){ return x.subject_id === sub.id; });
    const score = m ? Number(m.score) : null;
    if(score != null){ total += score; count++; }
    const g = score != null ? gradeFor(score) : null;
    return '<tr><td>' + esc(sub.name) + '</td>' +
      '<td style="text-align:center">' + (score != null ? score : '—') + '</td>' +
      '<td style="text-align:center"><b>' + (g ? g.grade : '—') + '</b></td>' +
      '<td>' + (g ? esc(g.remark||'') : '') + '</td></tr>';
  }).join('');
  const avg = count ? total/count : 0;
  const overall = gradeFor(avg);

  modal('<div id="rcPrint" style="background:#fff;color:#111;padding:24px;font-family:Inter,sans-serif">' +
    '<div style="text-align:center;padding-bottom:12px;border-bottom:2px solid #111;margin-bottom:14px">' +
      '<h2 style="margin:0;font-size:20px">' + esc(_school.name) + '</h2>' +
      '<div style="font-size:12px">' + esc(_school.address||'') + ' · ' + esc(_school.telephone||'') + '</div>' +
      '<div style="margin-top:8px;font-weight:700">REPORT CARD</div>' +
    '</div>' +
    '<div style="font-size:13px;line-height:1.9;margin-bottom:12px">' +
      '<div><b>Name:</b> ' + esc(student.first_name + ' ' + (student.last_name||'')) + '</div>' +
      '<div><b>Adm No:</b> ' + esc(student.admission_no) + ' · <b>LIN:</b> ' + esc(student.lin||'—') + '</div>' +
      '<div><b>Exam:</b> ' + esc(exam.name) + ' · <b>Year:</b> ' + exam.year + ' T' + exam.term + '</div>' +
    '</div>' +
    '<table style="width:100%;border-collapse:collapse;font-size:13px">' +
      '<thead><tr style="background:#f1f5f9">' +
        '<th style="border:1px solid #cbd5e1;padding:7px;text-align:left">Subject</th>' +
        '<th style="border:1px solid #cbd5e1;padding:7px">Score</th>' +
        '<th style="border:1px solid #cbd5e1;padding:7px">Grade</th>' +
        '<th style="border:1px solid #cbd5e1;padding:7px;text-align:left">Remark</th>' +
      '</tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>' +
    '<div style="margin-top:12px;padding:10px;background:#f1f5f9;border-radius:8px;font-size:13px;display:flex;justify-content:space-between">' +
      '<div><b>Total:</b> ' + total.toFixed(1) + '</div>' +
      '<div><b>Average:</b> ' + avg.toFixed(1) + '</div>' +
      '<div><b>Overall:</b> ' + (overall ? overall.grade : '—') + '</div>' +
    '</div>' +
    '<div style="text-align:center;font-size:10px;margin-top:16px;color:#64748b">Powered by EUDES MEDIA</div>' +
  '</div>' +
  '<div class="actions"><button class="btn ghost" onclick="closeModal()">Close</button>' +
    '<button class="btn" onclick="printEl(\'rcPrint\')">🖨️ Print</button></div>');
}
window.viewReport = viewReport;

function printEl(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.add('printing');
  try { window.print(); } catch(e){}
  setTimeout(function(){ el.classList.remove('printing'); }, 300);
}
window.printEl = printEl;

/* ============================================================
   STARTUP & AUTH REDIRECT HANDLING
   ============================================================ */
async function handleAuthRedirect() {
  const hash = window.location.hash;
  
  if (hash && hash.includes('access_token')) {
    const params = new URLSearchParams(hash.substring(1));
    const access_token = params.get('access_token');
    const refresh_token = params.get('refresh_token');
    
    if (access_token) {
      try {
        const res = await fetch(SUPA_URL + '/auth/v1/user', {
          headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + access_token }
        });
        const user = await res.json();
        
        if (user && user.id) {
          const sessionData = {
            access_token: access_token,
            refresh_token: refresh_token,
            user: user
          };
          
          setSession(sessionData);
          window.history.replaceState(null, '', window.location.pathname);
          await boot();
          return;
        }
      } catch (e) {
        console.error('Error handling auth redirect', e);
      }
    }
  }
  
  const s = safeStorage.getItem('eudes_session');
  if(s){ 
    try { await boot(); } catch(e){ console.error(e); } 
  }
}

handleAuthRedirect();
