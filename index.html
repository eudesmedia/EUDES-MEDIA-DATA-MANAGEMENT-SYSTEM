</style>

<script>
const SUPA_URL='https://wabeempxckdtjvrkzhpv.supabase.co';
const SUPA_KEY='sb_publishable_n0uAm0Gcq7qR2dJM4jMZGQ_wiV__Cfp';
const FUNC_FEE_DEFAULT=70000;
const UNIFORM_CATEGORIES=['Boys Uniform','Girls Uniform','Sports Wear','Sweaters','Other'];
const STAFF_ROLES=['Teacher','Head Teacher','Deputy Head Teacher','Director','Bursar','Secretary','Public Relations Officer','Matron Boys','Matron Girls','Nurse','Librarian','Driver','Cook','Security Guard','Cleaner','Groundsman','Store Keeper','Support Staff','Other'];

let _memoryStore={};
const safeStorage={getItem:k=>{try{return localStorage.getItem(k);}catch(e){return _memoryStore[k]||null;}},setItem:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){_memoryStore[k]=String(v);}},removeItem:k=>{try{localStorage.removeItem(k);}catch(e){delete _memoryStore[k];}}};
function getToken(){const s=safeStorage.getItem('eudes_session');if(!s)return null;try{return JSON.parse(s).access_token;}catch(e){return null;}}
function getUser(){const s=safeStorage.getItem('eudes_session');if(!s)return null;try{return JSON.parse(s).user;}catch(e){return null;}}
function setSession(d){if(d)safeStorage.setItem('eudes_session',JSON.stringify(d));else safeStorage.removeItem('eudes_session');}

let SESSION=null,_profile=null,_school=null,_schoolId=null,_role=null,_classesCache=null,_staffCache=null;
function getCurrentYear(){return (_school&&_school.current_year)||new Date().getFullYear();}
function getCurrentTerm(){return (_school&&_school.current_term)||1;}
window.getCurrentYear=getCurrentYear;window.getCurrentTerm=getCurrentTerm;

/* ROLE PERMISSIONS */
const PERMS={
  owner:{all:true},
  admin:{all:true},
  public_relations:{all:true},
  finance:{view:['dashboard','fees','debtors','paid_full','reports_all','expenses','salaries','uniforms','advances'],create:['payments','expenses','salaries','advances','allowances'],edit:['payments','expenses','salaries','advances','allowances'],del:['payments','expenses','salaries','advances','allowances']},
  director:{readOnly:true},
  teacher:{readOnly:true}
};
function can(action){
  if(!_role) return false;
  const p=PERMS[_role]; if(!p) return false;
  if(p.all) return true;
  if(action==='readonly') return true;
  if(action==='view'||action.startsWith('view:')) return true;
  if(p.readOnly) return false;
  if(p[action]&&Array.isArray(p[action])) return true;
  return false;
}
function canView(route){ if(can('all'))return true; const p=PERMS[_role]; if(!p)return false; if(p.readOnly)return true; if(p.view&&p.view.includes(route))return true; return false; }
function isReadOnly(){ const p=PERMS[_role]; return p&&p.readOnly; }
window.can=can;window.canView=canView;window.isReadOnly=isReadOnly;

async function rest(path,options){
  options=options||{};
  const headers=Object.assign({'apikey':SUPA_KEY,'Content-Type':'application/json'},options.headers||{});
  const token=getToken();headers['Authorization']='Bearer '+(token||SUPA_KEY);
  const res=await fetch(SUPA_URL+path,Object.assign({},options,{headers}));
  const text=await res.text();
  let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok){
    if(res.status===401){setSession(null);alert('Session expired');window.location.reload();throw new Error('Session expired');}
    throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status));
  }
  return data;
}
async function auth(path,body){
  const res=await fetch(SUPA_URL+path,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const text=await res.text();
  let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok)throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status));
  return data;
}

function toast(msg,type){const el=document.createElement('div');el.className='toast'+(type==='bad'?' bad':(type==='ok'?' ok':''));el.textContent=msg;document.getElementById('toastRoot').appendChild(el);setTimeout(()=>el.remove(),3500);}
function modal(html){const root=document.getElementById('modalRoot');root.innerHTML='<div class="modal-bg"><div class="modal">'+html+'</div></div>';root.querySelector('.modal-bg').addEventListener('click',e=>{if(e.target.classList.contains('modal-bg'))closeModal();});}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtUGX(n){return 'UGX '+(Number(n)||0).toLocaleString();}
function fmtDate(ts){if(!ts)return '—';const d=new Date(ts);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}

/* WhatsApp click-to-chat */
function waLink(phone,message){
  let p=(phone||'').replace(/[^0-9]/g,'');
  if(p.startsWith('0')) p='256'+p.slice(1);
  if(!p.startsWith('256') && p.length<=9) p='256'+p;
  return 'https://wa.me/'+p+'?text='+encodeURIComponent(message);
}
function callLink(phone){ return 'tel:'+(phone||'').replace(/[^0-9+]/g,''); }

async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass=document.getElementById('loginPass').value;
  const err=document.getElementById('loginErr');const btn=document.getElementById('loginBtn');
  err.style.display='none';
  if(!email||!pass){err.textContent='Enter email and password';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='Signing in…';
  try{const data=await auth('/auth/v1/token?grant_type=password',{email,password:pass});setSession(data);await boot();}
  catch(e){err.textContent=e.message;err.style.display='block';}
  btn.disabled=false;btn.textContent='Sign In';
}

async function doRegister(){
  const name=document.getElementById('regName').value.trim();
  const email=document.getElementById('regEmail').value.trim().toLowerCase();
  const pass=document.getElementById('regPass').value;
  const school=document.getElementById('regSchool').value.trim();
  const slug=document.getElementById('regSlug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-');
  const addr=document.getElementById('regAddr').value.trim();
  const phone=document.getElementById('regPhone').value.trim();
  const head=document.getElementById('regHead').value.trim();
  const motto=document.getElementById('regMotto').value.trim();
  const err=document.getElementById('regErr');const ok=document.getElementById('regOk');const btn=document.getElementById('regBtn');
  err.style.display='none';ok.style.display='none';
  if(!name||!email||!pass||!school||!slug){err.textContent='Fill required';err.style.display='block';return;}
  if(pass.length<8){err.textContent='Password 8+ chars';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='Creating…';
  try{
    const data=await auth('/auth/v1/signup',{email,password:pass,data:{full_name:name}});
    if(!data.access_token){ok.textContent='Check email to confirm.';ok.style.display='block';btn.disabled=false;btn.textContent='Create School';return;}
    setSession(data);
    await rest('/rest/v1/rpc/create_school_and_become_owner',{method:'POST',body:JSON.stringify({p_school_name:school,p_school_slug:slug,p_motto:motto||null,p_address:addr||null,p_telephone:phone||null,p_email:email,p_head_teacher:head||null})});

  try{const p=await rest('/rest/v1/profiles?id=eq.'+user.id+'&select=*');_profile=p&&p[0];}catch(e){document.getElementById('loginErr').textContent='Profile error';document.getElementById('loginErr').style.display='block';return;}

/* ============ FINANCE CORE ============ */
async function loadFinanceData(){
  const cy=getCurrentYear(),ct=getCurrentTerm();
  const [students,classes,payments]=await Promise.all([
    rest('/rest/v1/students?school_id=eq.'+_schoolId+'&select=*&order=first_name'),
    loadClasses(),
    rest('/rest/v1/payments?school_id=eq.'+_schoolId+'&select=*&order=paid_at.desc').catch(()=>[])
  ]);
  const paidByStudent={},paidAllTime={};
  (payments||[]).forEach(p=>{
    const sid=p.student_id;
    if(!paidByStudent[sid])paidByStudent[sid]={school:0,func:0};
    if(!paidAllTime[sid])paidAllTime[sid]={school:0,func:0};
    if(p.year===cy && p.term===ct){
      if(p.payment_for==='Functional Fees')paidByStudent[sid].func+=Number(p.amount);else paidByStudent[sid].school+=Number(p.amount);
    }
    if(p.payment_for==='Functional Fees')paidAllTime[sid].func+=Number(p.amount);else paidAllTime[sid].school+=Number(p.amount);
  });
  const computed=(students||[]).map(s=>{
    const expectedTerm=(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);
    const bf=Number(s.balance_bf)||0;
    const expectedRunning=expectedTerm+bf;
    const termPaid=(paidByStudent[s.id]||{school:0,func:0});
    const allPaid=(paidAllTime[s.id]||{school:0,func:0});
    const termPaidTotal=termPaid.school;
    const allPaidTotal=allPaid.school;
    return {...s,_expected_term:expectedTerm,_expected_running:expectedRunning,_paid_term:termPaidTotal,_paid_all:allPaidTotal,_balance_term:expectedTerm-termPaidTotal,_balance_running:expectedRunning-allPaidTotal};
  });
  return {students:computed,classes:classes||[],payments:payments||[],year:cy,term:ct};
}
window.loadFinanceData=loadFinanceData;
function financeSummary(students){
  let expected_term=0,collected_term=0,expected_running=0,collected_running=0,zero_paid=0;
  students.forEach(s=>{expected_term+=s._expected_term;collected_term+=s._paid_term;expected_running+=s._expected_running;collected_running+=s._paid_all;if(s._paid_term===0&&s._expected_term>0)zero_paid++;});
  return {expected_term,collected_term,outstanding_term:expected_term-collected_term,expected_running,collected_running,outstanding_running:expected_running-collected_running,zero_paid};
}
window.financeSummary=financeSummary;

function filterFeesTable(){
  const fin=window._finCache||{students:[],classes:[]};
  const fc=document.getElementById('feesClassFilter')?.value||'';
  const m=document.getElementById('feesOwingFilter')?.value||'all';
  const mode=_feesMode==='term'?'term':'running';
  let list=fin.students.filter(s=>s.status==='active');
  if(fc)list=list.filter(s=>s.class_id===fc);
  list=list.map(s=>({...s,_expected:mode==='term'?s._expected_term:s._expected_running,_paid:mode==='term'?s._paid_term:s._paid_all,_balance:mode==='term'?s._balance_term:s._balance_running}));
  let filtered=list;
  if(m==='zero_paid')filtered=list.filter(r=>r._paid===0&&r._expected>0);
  if(m==='owing')filtered=list.filter(r=>r._balance>0);
  if(m==='paid_full')filtered=list.filter(r=>r._balance<=0);
  if(m==='boarding')filtered=list.filter(r=>(r.boarding_status||'').toLowerCase().includes('board'));
  if(m==='van')filtered=list.filter(r=>Number(r.transport_fee)>0);
  window._filteredFees=filtered;
  const c=document.getElementById('feesTableContainer');
  if(!filtered.length){c.innerHTML='<div class="empty">No pupils match.</div>';return;}
  c.innerHTML='<div class="table-wrap"><table><thead><tr>'+
    '<th>Adm No</th><th>LIN</th><th>Name</th><th>Sex</th><th>Class</th><th>Parent</th><th>Contact</th><th>Location</th>'+
    '<th style="text-align:right">Expected</th><th style="text-align:right">Paid</th><th style="text-align:right">Balance</th>'+
    '<th style="text-align:right">Actions</th></tr></thead><tbody>'+
    filtered.map(s=>{
      const cls=(fin.classes||[]).find(c=>c.id===s.class_id);
      const board=(s.boarding_status||'').toLowerCase().includes('board');
      const van=Number(s.transport_fee)>0;
      const st=s._balance<=0?'<span class="badge ok">'+Number(s._balance).toLocaleString()+'</span>':s._paid===0?'<span class="badge bad">'+Number(s._balance).toLocaleString()+'</span>':'<span class="badge warn">'+Number(s._balance).toLocaleString()+'</span>';
      const waMsg=buildFeeMessage(s,s._balance);
      const waUrl=waLink(s.parent_contact,waMsg);
      const callUrl=callLink(s.parent_contact);
      return '<tr>'+
        '<td><b>'+esc(s.admission_no)+'</b></td>'+
        '<td style="font-family:monospace;font-size:12px">'+esc(s.lin||'—')+'</td>'+
        '<td><b>'+esc(s.first_name+' '+(s.last_name||''))+'</b>'+(board?' <span class="badge warn">🏠</span>':'')+(van?' <span class="badge info">🚐</span>':'')+'</td>'+
        '<td>'+sexIcon(s.gender)+'</td>'+
        '<td><span class="badge info">'+esc(cls?cls.name:'—')+'</span></td>'+
        '<td>'+esc(s.parent_name||'—')+'</td>'+
        '<td>'+esc(s.parent_contact||'—')+'</td>'+
        '<td>'+esc(s.location||'—')+'</td>'+
        '<td style="text-align:right">'+s._expected.toLocaleString()+'</td>'+
        '<td style="text-align:right;color:#047857">'+s._paid.toLocaleString()+'</td>'+
        '<td style="text-align:right">'+st+'</td>'+
        '<td style="text-align:right;white-space:nowrap">'+
          (s.parent_contact?'<a href="'+waUrl+'" target="_blank" class="btn sm wa" title="WhatsApp">💬</a> <a href="'+callUrl+'" class="btn sm call" title="Call">📞</a> ':'')+
          '<button class="btn sm" onclick="recordPayment(\''+s.id+'\')">💵</button> '+
          '<button class="btn sm ghost" onclick="viewPaymentHistory(\''+s.id+'\')">📋</button>'+
        '</td></tr>';

async function recordPayment(studentId){
  const [st,pays]=await Promise.all([
    rest('/rest/v1/students?id=eq.'+studentId+'&select=*'),
    rest('/rest/v1/payments?student_id=eq.'+studentId+'&select=amount,payment_for,year,term')
  ]);
  const s=st[0];if(!s)return;
  const cy=getCurrentYear(),ct=getCurrentTerm();
  const termPaid=(pays||[]).filter(p=>p.year===cy&&p.term===ct&&p.payment_for!=='Functional Fees').reduce((sum,p)=>sum+Number(p.amount),0);
  const exp=(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);
  const now=new Date();const tz=now.getTimezoneOffset()*60000;const l=new Date(now-tz).toISOString().slice(0,16);
  modal('<h3>💵 Record Payment — '+esc(s.first_name+' '+(s.last_name||''))+'</h3>'+
    '<div style="background:var(--brandsoft);padding:12px;border-radius:10px;margin-bottom:16px;font-size:13px;line-height:1.9">'+
      '<div>📅 <b>'+cy+' · Term '+ct+'</b></div>'+
      '<div>Term Expected: <b>'+fmtUGX(exp)+'</b></div>'+
      '<div>Paid this term: <b>'+fmtUGX(termPaid)+'</b></div>'+
      '<div>Balance: <b style="color:#b91c1c">'+fmtUGX(exp-termPaid)+'</b></div>'+
    '</div>'+
    '<div class="grid grid-2">'+
      '<div><label>Payment For *</label><select id="p_for"><option value="School Fees">📚 School Fees</option><option value="Functional Fees">🧾 Functional Fees</option></select></div>'+
      '<div><label>Amount (UGX) *</label><input id="p_amount" type="number"></div>'+
      '<div><label>Method *</label><select id="p_method"><option value="Cash">💵 Cash</option><option value="Mobile Money">📱 MoMo</option><option value="Bank Transfer">🏦 Bank</option></select></div>'+
      '<div><label>Date & Time *</label><input id="p_date" type="datetime-local" value="'+l+'"></div>'+
      '<div style="grid-column:1/-1"><label>Notes</label><input id="p_notes"></div>'+
    '</div>'+
    '<div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn ok" onclick="savePayment(\''+studentId+'\')">💾 Save</button></div>');
}
window.recordPayment=recordPayment;

async function savePayment(id){
  const pf=document.getElementById('p_for').value;
  const amt=parseFloat(document.getElementById('p_amount').value);
  const method=document.getElementById('p_method').value;
  const dv=document.getElementById('p_date').value;
  const nt=document.getElementById('p_notes').value.trim();
  if(!amt||amt<=0){toast('Invalid amount','bad');return;}
  if(!dv){toast('Select date','bad');return;}
  const cy=getCurrentYear(),ct=getCurrentTerm();
  const rcp='R'+Date.now().toString().slice(-8);
  try{
    await rest('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({
      school_id:_schoolId,student_id:id,amount:amt,payment_for:pf,method:method,notes:nt||null,paid_at:new Date(dv).toISOString(),year:cy,term:ct,receipt_no:rcp
    })});
    toast('Payment: '+fmtUGX(amt),'ok');closeModal();nav(activeRoute);
  }catch(e){toast(e.message,'bad');}
}
window.savePayment=savePayment;

async function handleExcelUpload(input){
  if(!input.files||!input.files[0])return;
  const file=input.files[0];const reader=new FileReader();
  reader.onload=async function(e){
    try{
      toast('Reading…','ok');
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
      if(!rows||rows.length<2){toast('No data','bad');return;}
      const classes=await loadClasses();
      const toInsert=[];
      for(let i=1;i<rows.length;i++){
        const row=rows[i];
        if(!row||!row[1]||String(row[1]).trim()==='')continue;
        const full=String(row[1]).trim().split(' ');const fn=full[0];const ln=full.slice(1).join(' ')||null;
        const cn=String(row[2]||'').trim();
        const cls=classes.find(c=>c.name.toLowerCase()===cn.toLowerCase());
        const gn=v=>{if(v==null||v==='')return 0;const n=parseFloat(String(v).replace(/[^0-9.-]/g,''));return isNaN(n)?0:n;};
        const transport=gn(row[12]);
        toInsert.push({school_id:_schoolId,admission_no:row[0]?'ADM-'+String(row[0]).trim():'ADM-'+Math.floor(Math.random()*10000),first_name:fn,last_name:ln,lin:generateLIN(fn),class_id:cls?cls.id:null,boarding_status:String(row[3]||'Day').trim(),parent_contact:row[4]?String(row[4]).trim():null,location:row[18]?String(row[18]).trim():null,balance_bf:gn(row[5]),actual_fee:gn(row[7]),functional_fee:gn(row[10])||70000,transport_fee:transport,transport_fee_override:transport>0?transport:null,registration_fee_paid:false,status:'active'});
      }
      if(!toInsert.length){toast('No rows','bad');return;}
      for(let i=0;i<toInsert.length;i+=50)await rest('/rest/v1/students',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(toInsert.slice(i,i+50))});
      toast('Imported '+toInsert.length,'ok');input.value='';nav('students');
    }catch(err){toast('Error: '+err.message,'bad');input.value='';}
  };
  reader.readAsArrayBuffer(file);
}
window.handleExcelUpload=handleExcelUpload;

  const amt=parseFloat(document.getElementById('rep_amount').value);

  try{
    await rest('/rest/v1/advance_repayments',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({school_id:_schoolId,advance_id:aid,amount:amt,date_paid:document.getElementById('rep_date').value,notes:document.getElementById('rep_notes').value.trim()||null})});

    await rest('/rest/v1/advances?id=eq.'+aid,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({amount_repaid:tr,status})});
    closeModal();nav('advances');
  }catch(e){toast(e.message,'bad');}

async function handleAuthRedirect(){
  const hash=window.location.hash;
  if(hash&&hash.includes('access_token')){
    const p=new URLSearchParams(hash.substring(1));const at=p.get('access_token');const rt=p.get('refresh_token');
    if(at){try{const r=await fetch(SUPA_URL+'/auth/v1/user',{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+at}});const u=await r.json();if(u&&u.id){setSession({access_token:at,refresh_token:rt,user:u});window.history.replaceState(null,'',window.location.pathname);await boot();return;}}catch(e){console.error(e);}}
  }
  const s=safeStorage.getItem('eudes_session');
  if(s){try{await boot();}catch(e){console.error(e);}}
}
handleAuthRedirect();
