<script>
/* ============================================================
   Progressive Mothers School Management — Complete v6
   ============================================================ */
const SUPA_URL='https://wabeempxckdtjvrkzhpv.supabase.co';
const SUPA_KEY='sb_publishable_n0uAm0Gcq7qR2dJM4jMZGQ_wiV__Cfp'; /* ⚠️ REPLACE */

let _memoryStore={};
const safeStorage={getItem:k=>{try{return localStorage.getItem(k);}catch(e){return _memoryStore[k]||null;}},setItem:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){_memoryStore[k]=String(v);}},removeItem:k=>{try{localStorage.removeItem(k);}catch(e){delete _memoryStore[k];}}};
function getCurrentYear(){return parseInt(safeStorage.getItem('pm_year'))||new Date().getFullYear();}
function getCurrentTerm(){return parseInt(safeStorage.getItem('pm_term'))||1;}
function setCurrentPeriod(y,t){safeStorage.setItem('pm_year',String(y));safeStorage.setItem('pm_term',String(t));}
function getToken(){const s=safeStorage.getItem('pm_session');if(!s)return null;try{return JSON.parse(s).access_token;}catch(e){return null;}}
function getUser(){const s=safeStorage.getItem('pm_session');if(!s)return null;try{return JSON.parse(s).user;}catch(e){return null;}}
function setSession(d){if(d)safeStorage.setItem('pm_session',JSON.stringify(d));else safeStorage.removeItem('pm_session');}

async function rest(path,options){
  options=options||{};
  const headers=Object.assign({'apikey':SUPA_KEY,'Content-Type':'application/json'},options.headers||{});
  const token=getToken();headers['Authorization']='Bearer '+(token||SUPA_KEY);
  const res=await fetch(SUPA_URL+path,Object.assign({},options,{headers}));
  const text=await res.text();let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok){if(res.status===401){setSession(null);alert('Session expired.');window.location.reload();throw new Error('Session expired');}throw new Error((data&&(data.message||data.msg||data.error_description||data.error||data.hint))||text||('HTTP '+res.status));}
  return data;
}
async function auth(path,body){
  const res=await fetch(SUPA_URL+path,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const text=await res.text();let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok)throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status));return data;
}

let _profile=null,_school=null,_schoolId=null,_role=null,_classesCache=null,_examsCache=null;
let _marksClass=null,_marksExam=null,_subjClass=null;
let _enumPaymentMethod=[],_enumPaymentProvider=[],_enumAttendanceStatus=[];
function cache(k,v){window['_cache_'+k]=v;}
function getCache(k){return window['_cache_'+k]||[];}

function toast(msg,type){const el=document.createElement('div');el.className='toast'+(type==='bad'?' bad':(type==='ok'?' ok':''));el.textContent=msg;document.getElementById('toastRoot').appendChild(el);setTimeout(()=>el.remove(),3500);}
function modal(html){const root=document.getElementById('modalRoot');root.innerHTML='<div class="modal-bg"><div class="modal">'+html+'</div></div>';root.querySelector('.modal-bg').addEventListener('click',e=>{if(e.target.classList.contains('modal-bg'))closeModal();});}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtUGX(n){if(n==null||isNaN(n))return 'UGX 0';return 'UGX '+(Number(n)||0).toLocaleString();}
function fmtNum(n){if(n==null||isNaN(n))return '0';return (Number(n)||0).toLocaleString();}
function fmtDate(ts){if(!ts)return '—';const d=new Date(ts);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function fmtLongDate(d){return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});}
function fmtDateTime(ts){if(!ts)return '—';const d=new Date(ts);return fmtDate(ts)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function telLink(num){if(!num)return '';return String(num).replace(/[^0-9+]/g,'');}
function waLink(num){if(!num)return '';let clean=String(num).replace(/[^0-9]/g,'');if(clean.startsWith('0'))clean='256'+clean.slice(1);return clean;}
function friendlyDbError(err){
  const msg=String(err&&err.message||err||'');
  if(msg.indexOf('idx_students_adm_unique')!==-1||msg.indexOf('admission_no')!==-1)return 'ADM number already exists.';
  if(msg.indexOf('idx_students_lin_unique')!==-1||msg.indexOf('"lin"')!==-1)return 'LIN number already exists.';
  if(msg.indexOf('idx_passouts_active_unique')!==-1)return 'This pupil is already signed out.';
  if(msg.indexOf('idx_payments_receipt_unique')!==-1||msg.indexOf('receipt_no')!==-1)return 'Receipt number already used.';
  if(msg.indexOf('idx_staff_staffno_unique')!==-1)return 'Staff number already exists.';
  return msg;
}
window.toast=toast;window.modal=modal;window.closeModal=closeModal;window.esc=esc;window.waLink=waLink;window.telLink=telLink;window.friendlyDbError=friendlyDbError;

/* ---------- PRINT ---------- */
function printSection(title,tableHTML){
  const w=window.open('','_blank');
  if(!w){toast('Allow popups','bad');return;}
  const logo=_school&&(_school.logo_data||_school.logo_url);
  const now=new Date();
  const stamp=now.toLocaleDateString('en-GB')+' '+now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

function gradeOf(score){if(score==null||isNaN(score)||score==='')return{g:'—',r:'—',cls:'',agg:'—'};const s=Number(score);if(s>=90)return{g:'D1',r:'Distinction 1',cls:'d1',agg:'1'};if(s>=80)return{g:'D2',r:'Distinction 2',cls:'d2',agg:'2'};if(s>=70)return{g:'C3',r:'Credit 3',cls:'c3',agg:'3'};if(s>=60)return{g:'C4',r:'Credit 4',cls:'c4',agg:'4'};if(s>=55)return{g:'C5',r:'Credit 5',cls:'c5',agg:'5'};if(s>=50)return{g:'C6',r:'Credit 6',cls:'c6',agg:'6'};if(s>=45)return{g:'P7',r:'Pass 7',cls:'p7',agg:'7'};if(s>=40)return{g:'P8',r:'Pass 8',cls:'p8',agg:'8'};return{g:'F9',r:'Fail 9',cls:'f9',agg:'9'};}
function posLabel(n){if(!n)return '—';if(n===1)return '1st';if(n===2)return '2nd';if(n===3)return '3rd';return n+'th';}

/* ---------- UNIQUE ID HELPERS ---------- */
async function generateAdmissionNo(){
  const year=new Date().getFullYear();
  try{
    const rows=await rest('/rest/v1/students?school_id=eq.'+_schoolId+'&admission_no=like.ADM-'+year+'-%&select=admission_no&order=admission_no.desc&limit=1');
    let next=1;
    if(rows&&rows.length&&rows[0].admission_no){
      const parts=rows[0].admission_no.split('-');
      const lastNum=parseInt(parts[parts.length-1]);
      if(!isNaN(lastNum))next=lastNum+1;
    }
    let candidate='ADM-'+year+'-'+String(next).padStart(4,'0');
    let tries=0;
    while(tries<50){
      const check=await rest('/rest/v1/students?school_id=eq.'+_schoolId+'&admission_no=eq.'+encodeURIComponent(candidate)+'&select=id');
      if(!check||!check.length)break;
      next++;tries++;candidate='ADM-'+year+'-'+String(next).padStart(4,'0');
    }
    return candidate;
  }catch(e){return 'ADM-'+year+'-'+String(Date.now()).slice(-4);}
}
window.generateAdmissionNo=generateAdmissionNo;

function exportContacts(mode){
  const students=getCache('students');
  const classes=_classesCache||[];
  const classesById={};classes.forEach(c=>classesById[c.id]=c);
  let rows=students.map(s=>{
    const cls=classesById[s.class_id];
    return{
      'ADM No':s.admission_no||'',
      'Pupil Name':(s.first_name||'')+' '+(s.last_name||''),
      'Class':cls?cls.name:'',
      'Boarding':s.boarding_status||'Day',
      'Parent Name':s.parent_name||'',
      'Parent Contact':s.parent_contact||'',
      'Location':s.location||s.district||'',
      'Status':s.status||'active'
    };
  });
  if(mode==='with')rows=rows.filter(r=>r['Parent Contact']);
  if(mode==='missing')rows=rows.filter(r=>!r['Parent Contact']);
  rows.sort((a,b)=>(a.Class||'').localeCompare(b.Class||'')||(a['Pupil Name']||'').localeCompare(b['Pupil Name']||''));
  if(!rows.length){toast('Nothing to export','bad');return;}
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:16},{wch:24},{wch:14},{wch:10},{wch:24},{wch:18},{wch:18},{wch:10}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Contacts');
  const suffix=mode==='with'?'WithContacts':mode==='missing'?'Missing':'All';
  XLSX.writeFile(wb,'Contacts_'+suffix+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('Downloaded: '+rows.length,'ok');closeModal();
}
window.exportContacts=exportContacts;

function copyContactsToClipboard(){
  const students=getCache('students');
  const classes=_classesCache||[];
  const classesById={};classes.forEach(c=>classesById[c.id]=c);
  const rows=students.filter(s=>s.parent_contact);
  if(!rows.length){toast('No contacts','bad');return;}
  const text=rows.map(s=>{
    const cls=classesById[s.class_id];
    const name=(s.first_name||'')+' '+(s.last_name||'');
    const cleaned=String(s.parent_contact).replace(/[^0-9+]/g,'');
    return cleaned+' - '+(s.parent_name||'Parent')+' ('+name+', '+(cls?cls.name:'')+')';
  }).join('\n');
  navigator.clipboard.writeText(text).then(()=>{toast('Copied '+rows.length,'ok');closeModal();}).catch(()=>{
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    toast('Copied '+rows.length,'ok');closeModal();
  });
}

async function saveStudent(id){
  const num=f=>Number(document.getElementById(f).value)||0;
  const adm=document.getElementById('m_adm').value.trim();
  const lin=document.getElementById('m_lin').value.trim();
  const firstName=document.getElementById('m_fn').value.trim();
  const lastName=document.getElementById('m_ln').value.trim();
  const classId=document.getElementById('m_class').value||null;
  if(!adm||!firstName){toast('ADM and name required','bad');return;}
  if(!classId){toast('Select class','bad');return;}
  window._editingStudentId=id||null;
  if(await isAdmissionNoTaken(adm,id)){toast('❌ ADM already used','bad');return;}
  if(lin&&await isLinTaken(lin,id)){toast('❌ LIN already used','bad');return;}
  if(!id){
    const similar=await findSimilarStudents(firstName,lastName,classId);
    if(similar.length){
      const names=similar.map(x=>x.admission_no).join(', ');
      if(!confirm('⚠️ A pupil named "'+firstName+' '+(lastName||'')+'" already exists in this class.\nExisting ADM(s): '+names+'\n\nRegister anyway?'))return;
    }
  }
  const body={
    school_id:_schoolId,admission_no:adm,class_id:classId,
    first_name:firstName,last_name:lastName||null,
    gender:document.getElementById('m_gender').value||null,
    date_of_birth:document.getElementById('m_dob').value||null,
    lin:lin||null,
    boarding_status:document.getElementById('m_res').value,
    location:document.getElementById('m_location').value.trim()||null,
    district:document.getElementById('m_district').value.trim()||null,
    parent_name:document.getElementById('m_par').value.trim()||null,
    parent_contact:document.getElementById('m_pc').value.trim()||null,
    balance_bf:num('m_bf'),actual_fee:num('m_fee'),functional_fee:num('m_func'),
    transport_fee:num('m_trans'),holiday_fee:num('m_hol'),academics_fee:num('m_acad')
  };
  body.total_charged=body.balance_bf+body.actual_fee+body.functional_fee+body.transport_fee+body.holiday_fee+body.academics_fee;
  const old=(getCache('students')||[]).find(x=>x.id===id);
  body.total_paid=old?Number(old.total_paid)||0:0;
  body.current_balance=body.total_charged-body.total_paid;
  try{
    if(id)await rest('/rest/v1/students?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});
    else await rest('/rest/v1/students',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});
    toast('Saved','ok');window._editingStudentId=null;closeModal();nav(activeRoute);
  }catch(e){toast(friendlyDbError(e),'bad');}
}

async function savePayment(studentId){
  const amount=Number(document.getElementById('p_amount').value);
  const receipt_no=document.getElementById('p_receipt').value.trim()||('RCP-'+Date.now());
  if(!amount||amount<=0){toast('Enter amount','bad');return;}
  const s=getCache('students').find(x=>x.id===studentId);
  if(!s){toast('Not found','bad');return;}
  const payment_for=document.getElementById('p_for').value;
  const method=normMethodForDb(document.getElementById('p_method').value);
  const providerRaw=document.getElementById('p_provider').value;
  const provider=providerRaw?(_enumPaymentProvider.includes(providerRaw)?providerRaw:_enumPaymentProvider[0]):null;
  const body={
    school_id:_schoolId,student_id:studentId,receipt_no:receipt_no,
    year:getCurrentYear(),term:getCurrentTerm(),academic_year:getCurrentYear(),
    amount:amount,method:method,payment_for:payment_for,
    payment_method:document.getElementById('p_method').value,
    received_by:_profile?_profile.id:null
  };
  if(provider)body.provider=provider;
  const momo=document.getElementById('p_momo').value.trim();if(momo)body.momo_number=momo;
  const txn=document.getElementById('p_txn').value.trim();if(txn)body.transaction_id=txn;
  const bank=document.getElementById('p_bank').value.trim();if(bank)body.bank_name=bank;
  const branch=document.getElementById('p_branch').value.trim();if(branch)body.bank_branch=branch;
  const notes=document.getElementById('p_notes').value.trim();if(notes)body.notes=notes;
  try{
    await rest('/rest/v1/payments',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify(body)});
    const oldPaid=Number(s.total_paid)||((Number(s.deposit_1)||0)+(Number(s.deposit_2)||0)+(Number(s.deposit_3)||0));
    const newPaid=oldPaid+amount;
    const charged=Number(s.total_charged)||((Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.functional_fee)||0)+(Number(s.transport_fee)||0)+(Number(s.holiday_fee)||0)+(Number(s.academics_fee)||0));
    const d1=Number(s.deposit_1)||0,d2=Number(s.deposit_2)||0,d3=Number(s.deposit_3)||0;
    const patch={total_paid:newPaid,total_charged:charged,current_balance:Math.max(0,charged-newPaid)};
    if(!d1)patch.deposit_1=amount;else if(!d2)patch.deposit_2=amount;else patch.deposit_3=d3+amount;
    await rest('/rest/v1/students?id=eq.'+studentId,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify(patch)});
    const clearResult=await autoClearPromisesForStudent(studentId,amount);
    let msg='Receipt: '+receipt_no;
    if(clearResult.cleared>0)msg+=' · '+clearResult.cleared+' promise cleared';
    toast(msg,'ok');
    const refreshed=(await rest('/rest/v1/students?id=eq.'+studentId+'&select=*'))[0];
    if(refreshed){const c=getCache('students');const idx=c.findIndex(x=>x.id===studentId);if(idx>=0)c[idx]=refreshed;else c.push(refreshed);cache('students',c);}
    printReceipt(refreshed||s,{receipt_no,amount,payment_for,method:document.getElementById('p_method').value,provider:providerRaw,notes,date:new Date().toISOString(),momo,txn,bank});
    closeModal();nav(activeRoute);
  }catch(e){toast(friendlyDbError(e),'bad');}
}

async function autoClearPromisesForStudent(studentId,amountPaid){
  try{
    const promises=await rest('/rest/v1/fee_reminders?student_id=eq.'+studentId+'&select=*');
    if(!promises||!promises.length)return{cleared:0};
    const srow=await rest('/rest/v1/students?id=eq.'+studentId+'&select=total_charged,total_paid,balance_bf,actual_fee,functional_fee,transport_fee,holiday_fee,academics_fee,deposit_1,deposit_2,deposit_3');
    const s=srow&&srow[0];if(!s)return{cleared:0};
    const charged=Number(s.total_charged)||((Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.functional_fee)||0)+(Number(s.transport_fee)||0)+(Number(s.holiday_fee)||0)+(Number(s.academics_fee)||0));
    const paid=Number(s.total_paid)||((Number(s.deposit_1)||0)+(Number(s.deposit_2)||0)+(Number(s.deposit_3)||0));
    const outstanding=Math.max(0,charged-paid);
    let cleared=0;
    for(const p of promises){
      if(p.status==='cleared'||p.status_override==='cleared')continue;
      const amt=Number(p.promised_amount||p.amount_owed||0);
      let shouldClear=false;
      if(outstanding<=0)shouldClear=true;
      else if(amountPaid>0&&Math.abs(amt-amountPaid)<100)shouldClear=true;
      if(shouldClear){
        try{await rest('/rest/v1/fee_reminders?id=eq.'+p.id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({status:'cleared',status_override:'cleared',remarks:(p.remarks?p.remarks+' | ':'')+'Auto-cleared '+new Date().toISOString().slice(0,10)+' after payment of '+amountPaid})});cleared++;}catch(e){}
      }
    }
    return{cleared};
  }catch(e){return{cleared:0};}
}
window.autoClearPromisesForStudent=autoClearPromisesForStudent;

async function autoClearStalePromises(){
  try{
    const promises=await rest('/rest/v1/fee_reminders?school_id=eq.'+_schoolId+'&select=id,student_id,status,status_override');
    if(!promises||!promises.length)return;
    const active=promises.filter(p=>p.status!=='cleared'&&p.status_override!=='cleared');
    if(!active.length)return;
    const ids=[...new Set(active.map(p=>p.student_id))];
    const students=await rest('/rest/v1/students?school_id=eq.'+_schoolId+'&id=in.('+ids.join(',')+')&select=id,total_charged,total_paid,balance_bf,actual_fee,functional_fee,transport_fee,holiday_fee,academics_fee,deposit_1,deposit_2,deposit_3');
    const byId={};students.forEach(s=>byId[s.id]=s);
    let cleared=0;
    for(const p of active){
      const s=byId[p.student_id];if(!s)continue;
      const charged=Number(s.total_charged)||((Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.functional_fee)||0)+(Number(s.transport_fee)||0)+(Number(s.holiday_fee)||0)+(Number(s.academics_fee)||0));
      const paid=Number(s.total_paid)||((Number(s.deposit_1)||0)+(Number(s.deposit_2)||0)+(Number(s.deposit_3)||0));
      if(charged-paid<=0){
        try{await rest('/rest/v1/fee_reminders?id=eq.'+p.id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({status:'cleared',status_override:'cleared',remarks:'Auto-cleared: fully paid'})});cleared++;}catch(e){}
      }
    }
    if(cleared>0)toast(cleared+' stale promise(s) auto-cleared','ok');
  }catch(e){}
}

function promiseStatusOf(p){
  if(p.status==='cleared'||p.status_override==='cleared')return 'cleared';
  if(!p.promise_date)return 'future';
  const today=new Date();today.setHours(0,0,0,0);
  const d=new Date(p.promise_date);d.setHours(0,0,0,0);
  if(d.getTime()===today.getTime())return 'today';
  if(d<today)return 'overdue';
  const diff=(d-today)/(1000*60*60*24);
  return diff<=7?'upcoming':'future';
}
window.promiseStatusOf=promiseStatusOf;

function filterPromises(){
  const q=(document.getElementById('promSearch').value||'').toLowerCase();
  const statusF=document.getElementById('promStatusFilter').value||'';
  const classF=document.getElementById('promClassFilter').value||'';
  const students=window._promiseStudents||[];
  const studentsById={};students.forEach(s=>studentsById[s.id]=s);
  const classes=_classesCache||[];
  const classesById={};classes.forEach(c=>classesById[c.id]=c);
  const filtered=(window._allPromises||[]).filter(p=>{
    const s=studentsById[p.student_id]||{};
    if(classF&&s.class_id!==classF)return false;
    if(statusF&&promiseStatusOf(p)!==statusF)return false;
    if(q){const hay=((s.first_name||'')+' '+(s.last_name||'')+' '+(s.admission_no||'')+' '+(p.promised_by||'')+' '+(s.parent_name||'')).toLowerCase();if(hay.indexOf(q)===-1)return false;}
    return true;
  });
  const order={overdue:0,today:1,upcoming:2,future:3,cleared:4};
  filtered.sort((a,b)=>{const sa=order[promiseStatusOf(a)],sb=order[promiseStatusOf(b)];if(sa!==sb)return sa-sb;return (a.promise_date||'').localeCompare(b.promise_date||'');});
  window._filteredPromises=filtered;
  const c=document.getElementById('promTableContainer');
  if(!filtered.length){c.innerHTML='<div class="empty">No promises.</div>';return;}
  let rows='';
  filtered.forEach(p=>{

    const badgeCls={overdue:'bad',today:'warn',upcoming:'info',future:'info',cleared:'ok'}[st]||'info';
    const badgeTxt={overdue:'⚠️ Overdue',today:'🔔 Today',upcoming:'📅 Soon',future:'🕐 Future',cleared:'✅ Cleared'}[st]||st;

  });
  c.innerHTML='<div class="table-wrap"><table style="font-size:12.5px"><thead><tr><th>ADM</th><th>Pupil</th><th>Class</th><th>Contact</th><th>Promised By</th><th style="text-align:right">Amount</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';

function renderMissingTable(){

    const missing=DATA_FIELDS.filter(f=>isFieldMissing(s,f));

  }).sort((a,b)=>b.missingCount-a.missingCount);

  const c=document.getElementById('missingTableContainer');

function fixMissingInline(studentId){
  const s=(window._missingStudents||[]).find(x=>x.id===studentId);

    }else if(f.type==='class'){
      const opts=classes.map(c=>'<option value="'+c.id+'"'+(s.class_id===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('');

async function saveMissingInline(studentId){
  const s=(window._missingStudents||[]).find(x=>x.id===studentId);
  if(!s){toast('Not found','bad');return;}
  const missing=DATA_FIELDS.filter(f=>isFieldMissing(s,f));
  const patch={};
  let filled=0;
  for(const f of missing){
    const el=document.getElementById('fix_'+f.key);
    if(!el)continue;
    const val=el.value.trim();
    if(!val)continue;
    patch[f.key]=val;filled++;
  }
  if(!filled){toast('Nothing filled','bad');return;}
  if(patch.lin){
    try{
      const conflict=await rest('/rest/v1/students?school_id=eq.'+_schoolId+'&lin=eq.'+encodeURIComponent(patch.lin)+'&id=neq.'+studentId+'&select=id');
      if(conflict&&conflict.length){toast('❌ LIN already used','bad');return;}
    }catch(e){}
  }
  try{
    await rest('/rest/v1/students?id=eq.'+studentId,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify(patch)});
    toast('✅ '+filled+' field(s) updated','ok');closeModal();nav('missing');
  }catch(e){toast(friendlyDbError(e),'bad');}
}

function efRecalc(){
  const bf=Number(document.getElementById('ef_bf').value)||0;

  const trans=Number(document.getElementById('ef_trans').value)||0;
  const hol=Number(document.getElementById('ef_hol').value)||0;
  const acad=Number(document.getElementById('ef_acad').value)||0;
  const charged=bf+fee+func+trans+hol+acad;
  const paid=Number(String(document.getElementById('ef_tp').value).replace(/[^0-9]/g,''))||0;

async function printFullFeeStatement(studentId){
  try{
    const [srows,payments]=await Promise.all([
      rest('/rest/v1/students?id=eq.'+studentId+'&select=*'),
      rest('/rest/v1/payments?student_id=eq.'+studentId+'&select=*&order=paid_at.asc')
    ]);
    const s=srows&&srows[0];if(!s){toast('Not found','bad');return;}
    const cls=(_classesCache||[]).find(c=>c.id===s.class_id);
    const charged=Number(s.total_charged)||((Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.functional_fee)||0)+(Number(s.transport_fee)||0)+(Number(s.holiday_fee)||0)+(Number(s.academics_fee)||0));
    const totalPaid=Number(s.total_paid)||((Number(s.deposit_1)||0)+(Number(s.deposit_2)||0)+(Number(s.deposit_3)||0));
    const outstanding=charged-totalPaid;
    let running=Number(s.balance_bf)||0;

    if(Number(s.balance_bf)||0)lines.push({date:'—',desc:'Balance B/F',debit:Number(s.balance_bf),credit:0,running:running});

    if(Number(s.holiday_fee))termCharges.push(['Holiday Fees',Number(s.holiday_fee)]);
    if(Number(s.academics_fee))termCharges.push(['Academics Fees',Number(s.academics_fee)]);
    termCharges.forEach(([n,a])=>{running+=a;lines.push({date:'—',desc:n+' — Term '+getCurrentTerm()+' '+getCurrentYear(),debit:a,credit:0,running:running});});
    (payments||[]).forEach(p=>{running-=Number(p.amount||0);lines.push({date:p.paid_at,desc:'Payment: '+(p.payment_for||'Fees')+' ('+(p.receipt_no||'')+')',debit:0,credit:Number(p.amount||0),running:running});});

    const headerInfo='<table style="margin-bottom:14px;border:none"><tbody>'+
      '<tr><td style="border:none"><b>Pupil</b></td><td style="border:none;font-weight:700">'+esc(s.first_name+' '+(s.last_name||''))+'</td><td style="border:none"><b>ADM</b></td><td style="border:none">'+esc(s.admission_no)+'</td></tr>'+
      '<tr><td style="border:none"><b>Class</b></td><td style="border:none">'+esc(cls?cls.name:'')+'</td><td style="border:none"><b>LIN</b></td><td style="border:none">'+esc(s.lin||'')+'</td></tr>'+
      '<tr><td style="border:none"><b>Parent</b></td><td style="border:none">'+esc(s.parent_name||'')+'</td><td style="border:none"><b>Contact</b></td><td style="border:none">'+esc(s.parent_contact||'')+'</td></tr>'+
      '<tr><td style="border:none"><b>Term</b></td><td style="border:none">'+getCurrentTerm()+' / '+getCurrentYear()+'</td><td style="border:none"><b>Printed</b></td><td style="border:none">'+fmtDateTime(new Date())+'</td></tr>'+
      '</tbody></table>'+
      '<table style="margin-bottom:14px;border:none"><tbody><tr>'+
      '<td style="border:1px solid #ccc;padding:10px;text-align:center"><div style="font-size:10px;text-transform:uppercase;color:#666">Charged</div><div style="font-size:16px;font-weight:800">'+fmtUGX(charged)+'</div></td>'+
      '<td style="border:1px solid #ccc;padding:10px;text-align:center;background:#ecfdf5"><div style="font-size:10px;text-transform:uppercase;color:#047857">Paid</div><div style="font-size:16px;font-weight:800;color:#047857">'+fmtUGX(totalPaid)+'</div></td>'+
      '<td style="border:1px solid #ccc;padding:10px;text-align:center;background:'+(outstanding>0?'#fef2f2':'#ecfdf5')+'"><div style="font-size:10px;text-transform:uppercase">Balance</div><div style="font-size:16px;font-weight:800;color:'+(outstanding>0?'#b91c1c':'#047857')+'">'+fmtUGX(outstanding)+'</div></td>'+
      '</tr></tbody></table>';
    const table='<table><thead><tr><th>Date</th><th>Description</th><th style="text-align:right">Charged</th><th style="text-align:right">Paid</th><th style="text-align:right">Balance</th></tr></thead><tbody>'+rows+'</tbody></table>';

  }catch(e){toast(friendlyDbError(e),'bad');}

function printStudentPromises(studentId){

async function clearAllPromisesForStudent(studentId){
  if(!confirm('Mark ALL promises as cleared?'))return;
  try{
    const promises=await rest('/rest/v1/fee_reminders?student_id=eq.'+studentId+'&select=id,status,status_override');
    let n=0;
    for(const p of promises||[]){if(p.status==='cleared'||p.status_override==='cleared')continue;await rest('/rest/v1/fee_reminders?id=eq.'+p.id,{method:'PATCH',headers:{'Prefer':'return:minimal'},body:JSON.stringify({status:'cleared',status_override:'cleared'})});n++;}
    toast(n+' cleared','ok');nav('student_profile');
  }catch(e){toast(friendlyDbError(e),'bad');}
}
window.clearAllPromisesForStudent=clearAllPromisesForStudent;

async function reprintReceipt(paymentId){

}

function filterPayments(){
  const q=(document.getElementById('paySearch').value||'').toLowerCase();
  const fm=document.getElementById('payMethodFilter').value||'';
  const fd=document.getElementById('payDateFilter').value||'';
  const students=window._paymentsStudents||[];
  const studentsById={};students.forEach(s=>studentsById[s.id]=s);
  const classes=_classesCache||[];
  const classesById={};classes.forEach(c=>classesById[c.id]=c);
  const filtered=(window._allPayments||[]).filter(p=>{
    if(fm&&p.method!==fm)return false;
    if(fd&&(p.paid_at||'').slice(0,10)!==fd)return false;
    if(q){const s=studentsById[p.student_id]||{};const hay=((p.receipt_no||'')+' '+(s.first_name||'')+' '+(s.last_name||'')+' '+(s.admission_no||'')).toLowerCase();if(hay.indexOf(q)===-1)return false;}
    return true;
  });
  window._filteredPayments=filtered;
  const c=document.getElementById('payTableContainer');
  if(!filtered.length){c.innerHTML='<div class="empty">No payments.</div>';return;}
  let rows='';
  filtered.forEach(p=>{
    const s=studentsById[p.student_id]||{};
    rows+='<tr><td>'+fmtDate(p.paid_at)+'</td><td><b style="font-family:monospace">'+esc(p.receipt_no||'')+'</b></td><td>'+esc(s.admission_no||'')+'</td><td>'+esc((s.first_name||'')+' '+(s.last_name||''))+'</td><td>'+esc(p.payment_for||'')+'</td><td>'+esc(p.method||'')+'</td><td style="text-align:right;font-weight:700;color:#047857">'+fmtNum(p.amount)+'</td><td><button class="btn sm ghost" onclick="reprintReceipt(\''+p.id+'\')">🖨️</button></td></tr>';
  });
  c.innerHTML='<div class="table-wrap"><table style="font-size:12px"><thead><tr><th>Date</th><th>Receipt</th><th>ADM</th><th>Pupil</th><th>For</th><th>Method</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
window.filterPayments=filterPayments;

function filterPassOuts(){
  const q=(document.getElementById('poSearch').value||'').toLowerCase();
  const status=document.getElementById('poStatusFilter').value||'';
  const range=document.getElementById('poRangeFilter').value||'';
  const students=window._passOutStudents||[];
  const studentsById={};students.forEach(s=>studentsById[s.id]=s);
  const classes=_classesCache||[];
  const classesById={};classes.forEach(c=>classesById[c.id]=c);
  const promisesByStudent=window._promisesByStudent||{};
  const now=new Date();
  const startOfDay=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const startOfWeek=new Date(startOfDay);startOfWeek.setDate(startOfDay.getDate()-startOfDay.getDay());
  const startOfMonth=new Date(now.getFullYear(),now.getMonth(),1);
  const filtered=(window._allPassOuts||[]).filter(p=>{
    if(status&&p.status!==status)return false;
    if(range){const d=new Date(p.signed_out_at||0);if(range==='today'&&d<startOfDay)return false;if(range==='week'&&d<startOfWeek)return false;if(range==='month'&&d<startOfMonth)return false;}
    if(q){const s=studentsById[p.student_id]||{};const hay=((s.first_name||'')+' '+(s.last_name||'')+' '+(s.admission_no||'')+' '+(p.reason||'')).toLowerCase();if(hay.indexOf(q)===-1)return false;}
    return true;
  });
  window._filteredPassOuts=filtered;
  document.getElementById('poCount').textContent=(window._allPassOuts||[]).length+' total · '+filtered.length+' shown';
  const c=document.getElementById('poTableContainer');
  if(!filtered.length){c.innerHTML='<div class="empty">No records.</div>';return;}
  let rows='';
  filtered.forEach(p=>{
    const s=studentsById[p.student_id]||{};
    const cls=classesById[s.class_id];
    const promises=promisesByStudent[p.student_id]||[];
    let promiseCell='—';
    const active=promises.filter(x=>promiseStatusOf(x)!=='cleared');
    if(active.length){
      active.sort((a,b)=>new Date(a.promise_date||0)-new Date(b.promise_date||0));
      const nx=active[0];
      const st=promiseStatusOf(nx);
      const bCls={overdue:'bad',today:'warn',upcoming:'info',future:'info'}[st]||'info';
      const bTxt={overdue:'⚠️ Overdue',today:'🔔 Today',upcoming:'📅 Soon',future:'🕐'}[st]||'';
      promiseCell='<span class="badge '+bCls+'">'+bTxt+' '+fmtNum(nx.promised_amount||nx.amount_owed||0)+'</span>';
    }else if(promises.length){promiseCell='<span class="badge ok">✅ Cleared</span>';}
    rows+='<tr><td><b>'+esc(s.admission_no||'—')+'</b></td><td>'+esc((s.first_name||'')+' '+(s.last_name||''))+'</td><td>'+esc(cls?cls.name:'—')+'</td><td>'+esc(p.reason||'')+'</td><td>'+esc(p.picked_up_by||'—')+'</td><td style="font-size:11px;white-space:nowrap">'+fmtDateTime(p.signed_out_at)+'</td><td style="font-size:11px;white-space:nowrap">'+fmtDateTime(p.signed_in_at)+'</td><td>'+promiseCell+'</td><td>'+(p.status==='out'?'<span class="badge bad">OUT</span>':'<span class="badge ok">Returned</span>')+'</td><td style="text-align:right;white-space:nowrap"><button class="btn sm gold" onclick="openPromiseForStudent(\''+s.id+'\')">🔔</button> <button class="btn sm" onclick="recordPayment(\''+s.id+'\')">💵</button> '+(p.status==='out'?'<button class="btn sm ok" onclick="returnPass(\''+p.id+'\')">Return</button>':'')+'</td></tr>';
  });
  c.innerHTML='<div class="table-wrap"><table style="font-size:12px"><thead><tr><th>ADM</th><th>Pupil</th><th>Class</th><th>Reason</th><th>Picked Up By</th><th>Out</th><th>In</th><th>Promise</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

/* ---------- PHONE DUPLICATE DETECTION ---------- */
async function showDuplicatePhonesWarning(){
  const students=getCache('students');
  if(!students.length){toast('No pupils loaded','bad');return;}
  const norm=num=>{if(!num)return '';return String(num).replace(/[^0-9]/g,'').replace(/^0+/,'256').replace(/^256+/,'256');};
  const byPhone={};
  students.forEach(s=>{const k=norm(s.parent_contact);if(!k)return;if(!byPhone[k])byPhone[k]=[];byPhone[k].push(s);});
  const dupes=Object.values(byPhone).filter(g=>g.length>1);
  if(!dupes.length){toast('✅ No duplicate phone numbers','ok');return;}
  const classes=_classesCache||[];
  const classesById={};classes.forEach(c=>classesById[c.id]=c);
  let html='';
  dupes.forEach((group,gi)=>{
    html+='<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px;margin-bottom:12px">'+
      '<div style="font-weight:700;color:#92400e;margin-bottom:6px">📞 '+esc(group[0].parent_contact)+' — '+group.length+' pupils share this number</div>'+
      group.map(s=>'<div style="padding:6px 0;border-top:1px solid #fde68a;display:flex;justify-content:space-between;align-items:center"><div><b>'+esc(s.first_name+' '+(s.last_name||''))+'</b> <span class="muted">· '+esc(s.admission_no)+' · '+esc(classesById[s.class_id]?.name||'')+'</span></div><div style="display:flex;gap:6px"><button class="btn sm ghost" onclick="closeModal();openStudentModalById(\''+s.id+'\')">Edit</button></div></div>').join('')+
      '<div class="muted" style="margin-top:6px;font-size:11.5px">💡 If these are siblings, this is fine. Otherwise, one may be a typo.</div>'+
    '</div>';
  });
  modal('<h3>🔍 Duplicate Phone Numbers</h3>'+
    '<p class="muted">'+dupes.length+' number(s) shared by multiple pupils. Verify these are correct.</p>'+
    '<div style="max-height:65vh;overflow:auto">'+html+'</div>'+
    '<div class="actions"><button class="btn ghost" onclick="closeModal()">Close</button><button class="btn gold" onclick="closeModal();exportDuplicatePhones()">📥 Export</button></div>');
}
window.showDuplicatePhonesWarning=showDuplicatePhonesWarning;

function exportDuplicatePhones(){
  const students=getCache('students');
  const norm=num=>{if(!num)return '';return String(num).replace(/[^0-9]/g,'').replace(/^0+/,'256').replace(/^256+/,'256');};
  const byPhone={};
  students.forEach(s=>{const k=norm(s.parent_contact);if(!k)return;if(!byPhone[k])byPhone[k]=[];byPhone[k].push(s);});
  const dupes=Object.entries(byPhone).filter(([k,v])=>v.length>1);
  if(!dupes.length){toast('No duplicates','ok');return;}
  const classes=_classesCache||[];
  const classesById={};classes.forEach(c=>classesById[c.id]=c);
  const rows=[];
  dupes.forEach(([phone,group])=>{
    group.forEach(s=>{rows.push({'Phone':phone,'Count':group.length,'ADM':s.admission_no,'Pupil':(s.first_name||'')+' '+(s.last_name||''),'Class':classesById[s.class_id]?.name||'','Parent Name':s.parent_name||''});});
  });
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:16},{wch:8},{wch:16},{wch:24},{wch:14},{wch:24}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Duplicate Phones');
  XLSX.writeFile(wb,'DuplicatePhones_'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('Exported','ok');
}
window.exportDuplicatePhones=exportDuplicatePhones;
