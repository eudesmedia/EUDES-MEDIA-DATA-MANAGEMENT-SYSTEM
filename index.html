let _memoryStore={};
const safeStorage={
  getItem:k=>{try{return localStorage.getItem(k);}catch(e){return _memoryStore[k]||null;}},
  setItem:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){_memoryStore[k]=String(v);}},
  removeItem:k=>{try{localStorage.removeItem(k);}catch(e){delete _memoryStore[k];}}
};

function getToken(){const s=safeStorage.getItem('eudes_session');if(!s)return null;try{return JSON.parse(s).access_token;}catch(e){return null;}}
function getUser(){const s=safeStorage.getItem('eudes_session');if(!s)return null;try{return JSON.parse(s).user;}catch(e){return null;}}
function setSession(d){if(d)safeStorage.setItem('eudes_session',JSON.stringify(d));else safeStorage.removeItem('eudes_session');}

async function rest(path,options){
  options=options||{};
  const headers=Object.assign({'apikey':SUPA_KEY,'Content-Type':'application/json'},options.headers||{});
  const token=getToken();
  headers['Authorization']='Bearer '+(token||SUPA_KEY);
  const res=await fetch(SUPA_URL+path,Object.assign({},options,{headers}));
  const text=await res.text();
  let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok){
    if(res.status===401){setSession(null);alert('Session expired.');window.location.reload();throw new Error('Session expired');}
    throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status));
  }
  return data;
}
async function auth(path,body){
  const res=await fetch(SUPA_URL+path,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const text=await res.text();
  let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok)throw new Error((data&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+res.status));
  return data;
}

function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtUGX(n){return 'UGX '+(Number(n)||0).toLocaleString();}
function fmtDate(ts){if(!ts)return '—';const d=new Date(ts);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function fmtLongDate(d){return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});}

/* ---------- GRADING (UNEB) ---------- */
function gradeOf(score){
  if(score==null||isNaN(score)||score==='')return{g:'—',r:'—',cls:''};
  const s=Number(score);
  if(s>=90)return{g:'D1',r:'Distinction 1',cls:'d1'};
  if(s>=80)return{g:'D2',r:'Distinction 2',cls:'d2'};
  if(s>=70)return{g:'C3',r:'Credit 3',cls:'c3'};
  if(s>=60)return{g:'C4',r:'Credit 4',cls:'c4'};
  if(s>=55)return{g:'C5',r:'Credit 5',cls:'c5'};
  if(s>=50)return{g:'C6',r:'Credit 6',cls:'c6'};
  if(s>=45)return{g:'P7',r:'Pass 7',cls:'p7'};
  if(s>=40)return{g:'P8',r:'Pass 8',cls:'p8'};
  return{g:'F9',r:'Fail 9',cls:'f9'};
}
function posLabel(n){if(!n)return '—';if(n===1)return '1st';if(n===2)return '2nd';if(n===3)return '3rd';return n+'th';}
window.gradeOf=gradeOf;

function switchTab(which){
  document.getElementById('tabLogin').classList.toggle('active',which==='login');
  document.getElementById('tabRegister').classList.toggle('active',which==='register');
  document.getElementById('loginForm').style.display=which==='login'?'block':'none';
  document.getElementById('registerForm').style.display=which==='register'?'block':'none';
}
window.switchTab=switchTab;

async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass=document.getElementById('loginPass').value;
  const err=document.getElementById('loginErr');
  const btn=document.getElementById('loginBtn');
  err.style.display='none';
  if(!email||!pass){err.textContent='Enter email and password';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='Signing in…';
  try{const data=await auth('/auth/v1/token?grant_type=password',{email,password:pass});setSession(data);await boot();}
  catch(e){err.textContent=e.message;err.style.display='block';}
  btn.disabled=false;btn.textContent='Sign In';
}
window.doLogin=doLogin;

async function doRegister(){
  const name=document.getElementById('regName').value.trim();
  const email=document.getElementById('regEmail').value.trim().toLowerCase();
  const pass=document.getElementById('regPass').value;
  const school=document.getElementById('regSchool').value.trim();
  const slug=document.getElementById('regSlug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-');
  const addr=document.getElementById('regAddr').value.trim();
  const phone=document.getElementById('regPhone').value.trim();
  const head=document.getElementById('regHead').value.trim();
  const err=document.getElementById('regErr');const ok=document.getElementById('regOk');const btn=document.getElementById('regBtn');
  err.style.display='none';ok.style.display='none';
  if(!name||!email||!pass||!school||!slug){err.textContent='Fill all required';err.style.display='block';return;}
  if(pass.length<8){err.textContent='Password min 8 characters';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='Creating…';
  try{
    const data=await auth('/auth/v1/signup',{email,password:pass,data:{full_name:name}});
    if(!data.access_token){ok.textContent='Check email to confirm, then sign in.';ok.style.display='block';btn.disabled=false;btn.textContent='Create School';return;}
    setSession(data);
    await rest('/rest/v1/rpc/create_school_and_become_owner',{method:'POST',body:JSON.stringify({p_school_name:school,p_school_slug:slug,p_motto:null,p_address:addr||null,p_telephone:phone||null,p_email:email,p_head_teacher:head||null})});
    ok.textContent='School created. Pending approval. WhatsApp +254757208077.';ok.style.display='block';
    setTimeout(boot,500);
  }catch(e){err.textContent=e.message;err.style.display='block';}
  btn.disabled=false;btn.textContent='Create School';
}
window.doRegister=doRegister;

async function doLogout(){
  if(!confirm('Sign out?'))return;
  try{const t=getToken();if(t)await fetch(SUPA_URL+'/auth/v1/logout',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+t}});}catch(e){}
  setSession(null);_profile=null;_school=null;_schoolId=null;_role=null;_classesCache=null;_subjectsCache={};
  document.getElementById('app').style.display='none';
  document.getElementById('authScreen').style.display='flex';
}
window.doLogout=doLogout;

async function boot(){
  const user=getUser(),token=getToken();
  if(!user||!token){document.getElementById('authScreen').style.display='flex';document.getElementById('app').style.display='none';return;}
  try{const p=await rest('/rest/v1/profiles?id=eq.'+user.id+'&select=*');_profile=p&&p[0];}
  catch(e){document.getElementById('loginErr').textContent='Profile error';document.getElementById('loginErr').style.display='block';return;}
  if(!_profile){document.getElementById('loginErr').textContent='Profile not found.';document.getElementById('loginErr').style.display='block';return;}
  _schoolId=_profile.school_id;_role=_profile.role;
  if(!_schoolId){
    switchTab('register');
    document.getElementById('regErr').textContent='Account not linked to a school.';
    document.getElementById('regErr').style.display='block';
    ['regName','regEmail','regPass'].forEach(id=>document.getElementById(id).parentElement.style.display='none');
    return;
  }
  try{const sc=await rest('/rest/v1/schools?id=eq.'+_schoolId+'&select=*');_school=sc&&sc[0];}catch(e){}
  if(!_school||!_school.is_approved){
    document.getElementById('loginErr').innerHTML='⏳ Pending approval. WhatsApp <b>+254757208077</b>.';
    document.getElementById('loginErr').style.display='block';
    return;
  }
  document.getElementById('authScreen').style.display='none';
  document.getElementById('app').style.display='block';
  populateTermSelector();renderHeader();renderAuthLogo();renderNav();renderBottomBar();tickClock();
  setInterval(tickClock,30000);
  await nav('dashboard');
}
window.boot=boot;

function filterStudentsTable(q,fClass){
  q=(q||'').toLowerCase();fClass=fClass||'';
  window._stFilterSearch=q;
  const fFunc=document.getElementById('studentFuncFilter')?.value||'';
  const classes=_classesCache||[];
  const paid=window._paidByStudent||{};
  const openMap=window._openPassOuts||{};
  const filtered=(window._allStudents||[]).filter(s=>{
    if(fClass&&s.class_id!==fClass)return false;
    if(fFunc==='out'&&!openMap[s.id])return false;
    if(fFunc&&fFunc!=='out'&&s.functional_fee_status!==fFunc)return false;
    if(q){const hay=(s.first_name+' '+(s.last_name||'')+' '+s.admission_no+' '+(s.parent_name||'')+' '+(s.parent_contact||'')).toLowerCase();if(hay.indexOf(q)===-1)return false;}
    return true;
  });
  window._filteredStudents=filtered;
  document.getElementById('studentCount').textContent=(window._allStudents||[]).length+' total · '+filtered.length+' shown';
  const c=document.getElementById('studentsTableContainer');
  if(!filtered.length){c.innerHTML='<div class="empty">No pupils.</div>';return;}
  c.innerHTML='<div class="table-wrap"><table><thead><tr><th>Adm No</th><th>Name</th><th>Class</th><th>Parent</th><th>Func.</th><th style="text-align:right">Balance</th><th style="text-align:right">Actions</th></tr></thead><tbody>'+
  filtered.map(s=>{
    const cls=(classes||[]).find(x=>x.id===s.class_id);
    const sf=(Number(s.balance_bf)||0)+(Number(s.actual_fee)||0)+(Number(s.transport_fee)||0);
    const p=paid[s.id]||{school:0};
    const bal=sf-p.school;
    const openPO=openMap[s.id];
    const outBadge=openPO?' <span class="badge" style="background:#dc2626;color:#fff;border-color:#991b1b">🚪 OUT</span>':'';
    return '<tr style="'+(openPO?'background:#fef3c7':'')+'">'+
      '<td><b>'+esc(s.admission_no)+'</b></td>'+
      '<td><b>'+esc(s.first_name+' '+(s.last_name||''))+'</b>'+outBadge+'</td>'+
      '<td><span class="badge info">'+esc(cls?cls.name:'—')+'</span></td>'+
      '<td>'+esc(s.parent_name||'—')+'</td>'+
      '<td>'+funcBadge(s.functional_fee_status)+'</td>'+
      '<td style="text-align:right"><span class="badge '+(bal>0?'bad':'ok')+'">'+bal.toLocaleString()+'</span></td>'+
      '<td style="text-align:right;white-space:nowrap">'+
      '<button class="btn sm" onclick="recordPayment(\''+s.id+'\')">💵</button> '+
      '<button class="btn sm ghost" onclick="editStudent(\''+s.id+'\')">✏️</button> '+
      '<button class="btn sm danger" onclick="deleteStudent(\''+s.id+'\')">✕</button>'+
      '</td></tr>';
  }).join('')+'</tbody></table></div>';
}
window.filterStudentsTable=filterStudentsTable;

function funcBadge(s){
  if(s==='cash')return '<span class="badge ok">💵 Paid</span>';

    }

let _marksClass=null,_marksExam=null,_examsCache=null;

    if(!_examsCache.length){
      // seed three default exams for this school/year/term

    rest('/rest/v1/students?school_id=eq.'+_schoolId+'&class_id=eq.'+_marksClass+'&status=eq.active&select=*&order=first_name'),

async function setMark(inputEl){
  const studentId=inputEl.dataset.student;
  const subjectId=inputEl.dataset.subject;
  const val=inputEl.value;
  const score=val===''?null:parseFloat(val);
  if(score!=null&&(isNaN(score)||score<0||score>100)){toast('Score must be 0-100','bad');inputEl.value='';return;}
  try{
    if(score==null){
      await rest('/rest/v1/marks?school_id=eq.'+_schoolId+'&student_id=eq.'+studentId+'&exam_id=eq.'+_marksExam+'&subject_id=eq.'+subjectId,{method:'DELETE'});
      if(window._marksMap[studentId])delete window._marksMap[studentId][subjectId];
    }else{
      await rest('/rest/v1/marks?school_id=eq.'+_schoolId+'&student_id=eq.'+studentId+'&exam_id=eq.'+_marksExam+'&subject_id=eq.'+subjectId,{method:'DELETE'});
      await rest('/rest/v1/marks',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({school_id:_schoolId,student_id:studentId,exam_id:_marksExam,subject_id:subjectId,score})});
      if(!window._marksMap[studentId])window._marksMap[studentId]={};
      window._marksMap[studentId][subjectId]=score;
    }
    // recompute row total
    const subjects=(_subjectsCache[_marksClass]||[]);
    const graded=subjects.filter(x=>x.graded!==false);
    const per=window._marksMap[studentId]||{};
    let total=0,cnt=0;
    graded.forEach(sj=>{const v=per[sj.id];if(v!=null&&!isNaN(v)){total+=Number(v);cnt++;}});
    const g=gradeOf(cnt?total/cnt:0);
    const totEl=document.querySelector('.row-total[data-student="'+studentId+'"]');
    const gEl=document.querySelector('.row-grade[data-student="'+studentId+'"]');
    if(totEl)totEl.textContent=total.toFixed(0);
    if(gEl)gEl.innerHTML='<span class="badge '+g.cls+'">'+g.g+'</span>';
  }catch(e){toast(e.message,'bad');}
}
window.setMark=setMark;

function buildReportCardHTML(s,subjects,exams,marks,students){
  const cls=(_classesById&&_classesById[s.class_id])||(_classesCache||[]).find(c=>c.id===s.class_id);
  const per=marks[s.id]||{};
  const graded=subjects.filter(x=>x.graded!==false);
  const stageLabel={1:'Beginning of Term',2:'Mid Term',3:'End of Term'}[_repStage];
  let grand=0,cnt=0;
  const rows=subjects.map((sj,i)=>{
    const scores=exams.map(e=>{const v=per[e.id]?.[sj.id];return v!=null&&!isNaN(v)?Number(v):null;});
    const isG=sj.graded!==false;
    if(isG)scores.forEach(v=>{if(v!=null){grand+=v;cnt++;}});
    const valid=scores.filter(v=>v!=null);
    const sub=valid.reduce((a,b)=>a+b,0);
    const sAvg=valid.length?sub/valid.length:0;
    const sg=gradeOf(sAvg);
    return '<tr><td>'+(i+1)+'</td><td class="subject">'+esc(sj.name)+(isG?'':' <span style="font-size:9px;color:#94a3b8">(na)</span>')+'</td>'+
      scores.map(v=>'<td>'+(v!=null?v.toFixed(0):'—')+'</td>').join('')+
      '<td style="font-weight:600">'+(valid.length?sub.toFixed(0):'—')+'</td>'+
      '<td><b>'+(isG?sg.g:'—')+'</b></td><td style="font-size:10.5px">'+(isG?sg.r:'Not graded')+'</td></tr>';
  }).join('');
  const avg=cnt?grand/cnt:0;
  const g=gradeOf(avg);

  // ranking
  const ranked=students.map(st=>{
    const m=marks[st.id]||{};
    let t=0,c=0;
    exams.forEach(e=>graded.forEach(sj=>{const v=m[e.id]?.[sj.id];if(v!=null&&!isNaN(v)){t+=Number(v);c++;}}));
    return{id:st.id,avg:c?t/c:0,cnt:c};
  }).filter(x=>x.cnt>0).sort((a,b)=>b.avg-a.avg);
  ranked.forEach((r,i)=>r.pos=i+1);
  for(let i=1;i<ranked.length;i++)if(ranked[i].avg===ranked[i-1].avg)ranked[i].pos=ranked[i-1].pos;
  const myPos=ranked.find(r=>r.id===s.id)?.pos||0;

  return '<div class="rc-header">'+(_school?.logo_url?('<img src="'+esc(_school.logo_url)+'" style="width:60px;height:60px;object-fit:contain;margin-bottom:6px">'):'')+
    '<h1>'+esc(_school?.name||'')+'</h1><div class="sub">'+esc(_school?.address||'')+' · '+esc(_school?.telephone||'')+'</div>'+
    '<h2>'+esc(stageLabel)+' Report Card — '+getCurrentYear()+' Term '+getCurrentTerm()+'</h2></div>'+
    '<table class="rc-info"><tr><td><b>Name:</b> '+esc(s.first_name+' '+(s.last_name||''))+'</td><td><b>Adm:</b> '+esc(s.admission_no)+'</td><td><b>LIN:</b> '+esc(s.lin||'—')+'</td></tr>'+
    '<tr><td><b>Class:</b> '+esc(cls?.name||'')+'</td><td><b>Year:</b> '+getCurrentYear()+'</td><td><b>Term:</b> '+getCurrentTerm()+'</td></tr></table>'+
    '<table class="rc-table"><thead><tr><th style="width:30px">#</th><th style="text-align:left">Subject</th>'+exams.map(e=>'<th>'+esc(e.name)+'</th>').join('')+'<th>Total</th><th>Grade</th><th>Remark</th></tr></thead>'+
    '<tbody>'+rows+'</tbody>'+
    '<tfoot><tr><td colspan="2" style="text-align:left">GRAND TOTAL</td>'+exams.map(e=>{const et=graded.reduce((a,sj)=>a+(per[e.id]?.[sj.id]||0),0);const any=graded.some(sj=>per[e.id]?.[sj.id]!=null);return '<td>'+(any?et.toFixed(0):'—')+'</td>';}).join('')+'<td>'+grand.toFixed(0)+'</td><td><b>'+g.g+'</b></td><td></td></tr></tfoot></table>'+
    '<div class="rc-summary"><div><b>Total Marks</b>'+grand.toFixed(0)+'</div><div><b>Average</b>'+avg.toFixed(1)+'%</div></div>'+
    '<div class="rc-position"><span class="label">Position in Class</span><span class="value">'+posLabel(myPos)+'</span></div>'+
    '<div class="rc-sign"><div>Class Teacher</div><div>Head Teacher</div><div>Date: '+new Date().toLocaleDateString('en-GB')+'</div></div>';
}
window.buildReportCardHTML=buildReportCardHTML;

function rankingTable(students,subjects,exams,marks){
  const graded=subjects.filter(x=>x.graded!==false);
  const rows=students.map(s=>{
    const m=marks[s.id]||{};
    let t=0,c=0;
    exams.forEach(e=>graded.forEach(sj=>{const v=m[e.id]?.[sj.id];if(v!=null&&!isNaN(v)){t+=Number(v);c++;}}));
    return{s,total:t,avg:c?t/c:0,cnt:c};
  });
  rows.sort((a,b)=>b.avg-a.avg);
  rows.forEach((r,i)=>r.pos=i+1);
  for(let i=1;i<rows.length;i++)if(rows[i].avg===rows[i-1].avg)rows[i].pos=rows[i-1].pos;
  return '<div class="table-wrap"><table><thead><tr><th>Pos</th><th>Adm</th><th>Name</th><th style="text-align:right">Total</th><th>Grade</th><th></th></tr></thead><tbody>'+
    rows.map(r=>{const g=gradeOf(r.avg);return '<tr><td><b>'+posLabel(r.pos)+'</b></td><td>'+esc(r.s.admission_no)+'</td><td>'+esc(r.s.first_name+' '+(r.s.last_name||''))+'</td><td style="text-align:right">'+r.total.toFixed(0)+'</td><td><span class="badge '+g.cls+'">'+g.g+'</span></td><td><button class="btn sm ghost" onclick="showSingleReport(\''+r.s.id+'\')">View</button></td></tr>';}).join('')+
    '</tbody></table></div>';
}

function printBroadsheet(){
  const d=window._reportData;
  const graded=d.subjects.filter(x=>x.graded!==false);
  const ranked=d.students.map(s=>{
    const m=d.marks[s.id]||{};
    let t=0,c=0;
    d.exams.forEach(e=>graded.forEach(sj=>{const v=m[e.id]?.[sj.id];if(v!=null&&!isNaN(v)){t+=Number(v);c++;}}));
    return{s,total:t,avg:c?t/c:0};
  }).sort((a,b)=>b.avg-a.avg);
  ranked.forEach((r,i)=>r.pos=i+1);
  for(let i=1;i<ranked.length;i++)if(ranked[i].avg===ranked[i-1].avg)ranked[i].pos=ranked[i-1].pos;

  let head='<tr><th rowspan="2">Pos</th><th rowspan="2">Adm</th><th rowspan="2">Name</th>';
  d.exams.forEach(e=>{head+='<th colspan="'+(d.subjects.length+1)+'">'+esc(e.name)+'</th>';});
  head+='<th rowspan="2">Total</th><th rowspan="2">Grade</th></tr><tr>';
  d.exams.forEach(()=>{d.subjects.forEach(sj=>{head+='<th>'+esc(sj.code)+'</th>';});head+='<th style="background:#d4a017">TOT</th>';});
  head+='</tr>';

  const body=ranked.map(r=>{
    const m=d.marks[r.s.id]||{};
    let total=0,c=0;
    let cells='<td><b>'+posLabel(r.pos)+'</b></td><td>'+esc(r.s.admission_no)+'</td><td>'+esc(r.s.first_name+' '+(r.s.last_name||''))+'</td>';
    d.exams.forEach(e=>{
      let et=0,any=false;
      d.subjects.forEach(sj=>{
        const v=m[e.id]?.[sj.id];
        if(v!=null&&!isNaN(v)){et+=Number(v);any=true;if(sj.graded!==false){total+=Number(v);c++;}}
        cells+='<td>'+(v!=null?v.toFixed(0):'—')+'</td>';
      });
      cells+='<td style="background:#fff7e6;font-weight:700">'+(any?et.toFixed(0):'—')+'</td>';
    });
    const g=gradeOf(c?total/c:0);
    cells+='<td style="font-weight:700">'+total.toFixed(0)+'</td><td><b>'+g.g+'</b></td>';
    return '<tr>'+cells+'</tr>';
  }).join('');

  printHTML('Broadsheet','<div style="text-align:center"><h1>'+esc(_school?.name||'')+'</h1><div style="font-size:11px;color:#666">'+esc(_school?.address||'')+'</div><h2>BROADSHEET — '+esc(d.classObj?.name||'')+' — '+getCurrentYear()+' Term '+getCurrentTerm()+'</h2></div><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table>');
}

function exportExcel(){
  const d=window._reportData;
  if(!d.students.length){toast('No pupils','bad');return;}
  const graded=d.subjects.filter(x=>x.graded!==false);
  const rows=d.students.map(s=>{
    const m=d.marks[s.id]||{};
    const row={Adm:s.admission_no,Name:s.first_name+' '+(s.last_name||'')};
    let total=0,c=0;
    d.exams.forEach(e=>{
      d.subjects.forEach(sj=>{
        const v=m[e.id]?.[sj.id];
        row[e.name+' - '+sj.code]=v!=null?Number(v):'';
        if(v!=null&&!isNaN(v)&&sj.graded!==false){total+=Number(v);c++;}
      });
    });
    row.Total=total;row.Grade=gradeOf(c?total/c:0).g;
    return row;
  });
  const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Marks');
  XLSX.writeFile(wb,'ReportSheet_'+getCurrentYear()+'_T'+getCurrentTerm()+'.xlsx');
  toast('Exported','ok');
}

async function pageSubjects(root){
  clearClassesCache();
  const classes=await loadClasses();
  if(!_marksClass&&classes[0])_marksClass=classes[0].id;
  const classObj=classes.find(c=>c.id===_marksClass);
  const subjects=await loadSubjects(_marksClass);
  root.innerHTML=
  '<div class="page-head"><div><h1>Subjects</h1><div class="sub">'+esc(classObj?.name||'')+' · '+subjects.length+' subjects</div></div><button class="btn" onclick="addSubject()">＋ Add Subject</button></div>'+
  '<div class="card"><label>Choose Class</label><select onchange="_marksClass=this.value;clearSubjectsCache();pageSubjects(document.getElementById(\'main\'))">'+classes.map(c=>'<option value="'+c.id+'"'+(_marksClass===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div>'+
  '<div class="card"><div class="table-wrap"><table><thead><tr><th>Code</th><th>Name</th><th>Graded</th><th></th></tr></thead><tbody>'+
  (subjects.length?subjects.map(s=>'<tr><td><b>'+esc(s.code)+'</b></td><td>'+esc(s.name)+'</td><td>'+(s.graded===false?'<span class="badge warn">Not graded</span>':'<span class="badge ok">Graded</span>')+'</td><td><button class="btn sm danger" onclick="delSubject(\''+s.id+'\')">✕</button></td></tr>').join(''):'<tr><td colspan="4" class="empty">No subjects</td></tr>')+

async function saveSubject(){
  const code=document.getElementById('s_code').value.trim().toUpperCase();
  const name=document.getElementById('s_name').value.trim();
  const graded=document.getElementById('s_graded').value==='true';
  if(!code||!name){toast('Enter code and name','bad');return;}

    await rest('/rest/v1/class_subjects',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,class_id:_marksClass,code,name,graded})});

  }catch(e){toast(e.message,'bad');}
}

async function delSubject(id){

/* ============================================================
   STAFF ATTENDANCE
   ============================================================ */
async function pageStaffAttendance(root){
  const today=new Date().toISOString().slice(0,10);
  root.innerHTML=
  '<div class="page-head"><h1>Staff Attendance</h1><div class="sub">'+fmtLongDate(new Date())+'</div></div>'+
  '<div class="card"><label>Date</label><input type="date" id="sa_date" value="'+today+'" onchange="loadStaffAtt()"></div>'+
  '<div id="saTable"></div>';
  loadStaffAtt();
}
window.pageStaffAttendance=pageStaffAttendance;

async function loadStaffAtt(){
  const date=document.getElementById('sa_date').value;
  const [staff,existing]=await Promise.all([
    rest('/rest/v1/staff?school_id=eq.'+_schoolId+'&select=*&order=full_name'),
    rest('/rest/v1/staff_attendance?school_id=eq.'+_schoolId+'&date=eq.'+date+'&select=staff_id,status')
  ]);
  const map={};existing.forEach(a=>map[a.staff_id]=a.status);
  const c=document.getElementById('saTable');
  if(!staff.length){c.innerHTML='<div class="card empty">No staff.</div>';return;}
  c.innerHTML='<div class="card"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th style="text-align:center">Status</th></tr></thead><tbody>'+
    staff.map(s=>{
      const st=map[s.id]||'';
      return '<tr><td><b>'+esc(s.full_name)+'</b></td><td>'+esc(s.role||'')+'</td><td style="text-align:center">'+
      '<button class="btn sm '+(st==='present'?'ok':'ghost')+'" onclick="setStaffAtt(\''+s.id+'\',\''+date+'\',\'present\')">✓ Present</button> '+
      '<button class="btn sm '+(st==='absent'?'danger':'ghost')+'" onclick="setStaffAtt(\''+s.id+'\',\''+date+'\',\'absent\')">✗ Absent</button>'+
      '</td></tr>';
    }).join('')+'</tbody></table></div></div>';
}
window.loadStaffAtt=loadStaffAtt;

async function setStaffAtt(staffId,date,status){
  try{
    await rest('/rest/v1/staff_attendance?school_id=eq.'+_schoolId+'&staff_id=eq.'+staffId+'&date=eq.'+date,{method:'DELETE'});
    await rest('/rest/v1/staff_attendance',{method:'POST',headers:{'Prefer':'return:minimal'},body:JSON.stringify({school_id:_schoolId,staff_id:staffId,date,status})});
    loadStaffAtt();
  }catch(e){toast(e.message,'bad');}
}
window.setStaffAtt=setStaffAtt;
